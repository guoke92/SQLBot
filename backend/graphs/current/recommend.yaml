version: 1
graph_key: recommend
durable: false
state: apps.chat.graphs.nodes.recommend.RecommendState
description: >
  Recommend-questions side graph. start → generate → end.
  Failures are recorded on the side graph without failing the primary answer.

nodes:
  generate: apps.chat.graphs.nodes.recommend.generate_node

edges:
  - from: START
    to: generate

  - from: generate
    to: END
