version: 1
graph_key: chat
state: apps.chat.graphs.nodes.nlq.NlqState
description: >
  Agentic batch loop: LLM plans N queries → concurrent execution → charts →
  LLM decides continue/summarize/finish. Max 3 iterations, 5 queries per batch.
  Respects ChatFinishStep for MCP early stop (query-only / data-only).

nodes:
  prepare_record: apps.chat.graphs.nodes.nlq.prepare_record_node
  ensure_datasource: apps.chat.graphs.nodes.nlq.ensure_datasource_node
  match_terminology: apps.chat.graphs.nodes.nlq.match_terminology_node
  match_training: apps.chat.graphs.nodes.nlq.match_training_node
  match_custom_prompts: apps.chat.graphs.nodes.nlq.match_custom_prompts_node
  build_context: apps.chat.graphs.nodes.nlq.build_context_node
  ground_entities: apps.chat.graphs.nodes.nlq.ground_entities_node
  prepare_query_bindings: apps.chat.graphs.nodes.nlq_bindings.prepare_query_bindings_node
  generate_queries: apps.chat.graphs.nodes.nlq.generate_queries_node
  execute_queries: apps.chat.graphs.nodes.nlq.execute_queries_node
  generate_charts: apps.chat.graphs.nodes.nlq.generate_charts_node
  decide_next: apps.chat.graphs.nodes.nlq.decide_next_node
  summarize: apps.chat.graphs.nodes.nlq.summarize_node
  complete: apps.chat.graphs.nodes.nlq.complete_node
  fail: apps.chat.graphs.nodes.nlq.fail_node

edges:
  - from: START
    to: prepare_record

  - from: prepare_record
    router:
      type: ok_or_fail
      next: ensure_datasource
    paths:
      ensure_datasource: ensure_datasource
      fail: fail

  - from: ensure_datasource
    router:
      type: ok_or_fail
      next: match_terminology
    paths:
      match_terminology: match_terminology
      fail: fail

  - from: match_terminology
    router:
      type: ok_or_fail
      next: match_training
    paths:
      match_training: match_training
      fail: fail

  - from: match_training
    router:
      type: ok_or_fail
      next: match_custom_prompts
    paths:
      match_custom_prompts: match_custom_prompts
      fail: fail

  - from: match_custom_prompts
    router:
      type: ok_or_fail
      next: build_context
    paths:
      build_context: build_context
      fail: fail

  - from: build_context
    router:
      type: ok_or_fail
      next: ground_entities
    paths:
      ground_entities: ground_entities
      fail: fail

  - from: ground_entities
    router:
      type: ok_or_fail
      next: prepare_query_bindings
    paths:
      prepare_query_bindings: prepare_query_bindings
      fail: fail

  - from: prepare_query_bindings
    router:
      type: ok_or_fail
      next: generate_queries
    paths:
      generate_queries: generate_queries
      fail: fail

  - from: generate_queries
    router: apps.chat.graphs.nodes.nlq.route_after_queries
    paths:
      generate_queries: generate_queries
      execute_queries: execute_queries
      complete: complete
      fail: fail

  - from: execute_queries
    router: apps.chat.graphs.nodes.nlq.route_after_execute
    paths:
      generate_charts: generate_charts
      complete: complete
      fail: fail

  - from: generate_charts
    router:
      type: ok_or_fail
      next: decide_next
    paths:
      decide_next: decide_next
      fail: fail

  # ── Agentic Loop ──
  - from: decide_next
    router: apps.chat.graphs.nodes.nlq.route_after_decision
    paths:
      generate_queries: generate_queries
      summarize: summarize
      complete: complete
      fail: fail

  - from: summarize
    to: complete

  - from: complete
    to: END

  - from: fail
    to: END
