version: 1
graph_key: chat
state: apps.chat.graphs.turn_state.ChatTurnState
description: >
  Unified Autonomous Data Agent runtime.
  agent_loop (init once) <-> execute_tools -> finalize_turn;
  clarifications pause durably at await_clarification; errors route to fail.

nodes:
  agent_loop: apps.chat.agent.loop.agent_loop_node
  execute_tools: apps.chat.agent.tools.runtime.execute_tools_node
  await_clarification: apps.chat.agent.clarify.await_agent_clarification_node
  finalize_turn: apps.chat.agent.delivery.finalize_agent_turn_node
  fail: apps.chat.agent.delivery.fail_node

edges:
  - from: START
    to: agent_loop

  - from: agent_loop
    router: apps.chat.agent.loop.route_after_agent_loop
    paths:
      execute_tools: execute_tools
      finalize_turn: finalize_turn
      fail: fail

  - from: execute_tools
    router: apps.chat.agent.loop.route_after_tools_execution
    paths:
      agent_loop: agent_loop
      await_clarification: await_clarification
      finalize_turn: finalize_turn
      fail: fail

  - from: await_clarification
    to: agent_loop

  - from: finalize_turn
    router:
      type: ok_or_fail
      next: END
    paths:
      END: END
      fail: fail

  - from: fail
    to: END
