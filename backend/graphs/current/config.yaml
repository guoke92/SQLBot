version: 1
graph_key: config
state: apps.config_assistant.nodes.ConfigState
description: >
  Config-assistant graph. prepare → agent ⇄ run_tools → finish; agent/run_tools errors → fail.

nodes:
  prepare: apps.config_assistant.nodes.prepare_node
  agent: apps.config_assistant.nodes.agent_node
  run_tools: apps.config_assistant.nodes.run_tools_node
  finish: apps.config_assistant.nodes.finish_node
  fail: apps.config_assistant.nodes.fail_node

edges:
  - from: START
    to: prepare

  - from: prepare
    to: agent

  - from: agent
    router: apps.config_assistant.nodes.route_after_agent
    paths:
      run_tools: run_tools
      finish: finish
      fail: fail

  - from: run_tools
    router: apps.config_assistant.nodes.route_after_tools
    paths:
      agent: agent
      fail: fail

  - from: finish
    to: END

  - from: fail
    to: END
