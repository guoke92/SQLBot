version: 1
graph_key: config
state: apps.config_assistant.nodes.ConfigState
description: >
  Config-assistant graph. prepare → agent ⇄ execute_tools → finish;
  infrastructure errors route to fail while tool-domain errors return to the agent.

nodes:
  prepare: apps.config_assistant.nodes.prepare_node
  agent: apps.conversation.agent.agent_node
  execute_tools: apps.conversation.tooling.execute_tools_node
  finish: apps.conversation.turn.finish_text_node
  fail: apps.conversation.turn.fail_node

edges:
  - from: START
    to: prepare

  - from: prepare
    to: agent

  - from: agent
    router: apps.conversation.agent.route_after_agent
    paths:
      agent: agent
      execute_tools: execute_tools
      finish: finish
      fail: fail

  - from: execute_tools
    router: apps.conversation.agent.route_after_tools
    paths:
      agent: agent
      fail: fail

  - from: finish
    to: END

  - from: fail
    to: END
