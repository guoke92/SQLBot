name: httpbin-get
type: api
base_url: https://httpbin.org
timeout: 30
auth:
  type: none
endpoints:
  - name: get_args
    method: GET
    path: /get
    description: Echo query params from httpbin
    data_path: ""
    params:
      - name: foo
        type: string
        location: query
        required: false
        default: bar
        description: Sample query parameter
    response_fields:
      - name: url
        type: string
        path: url
        description: Request URL echoed by httpbin
      - name: origin
        type: string
        path: origin
        description: Client origin IP
      - name: args
        type: object
        path: args
        description: Query argument map
