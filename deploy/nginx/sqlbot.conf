server {
    # 远程机对外暴露 3001：域名 → 域名:3001 → 本机 nginx:3001
    listen 3001;
    server_name _;                    # 通配，不绑定具体 IP/域名

    # 前端静态
    root /opt/sqlbot/frontend/dist;
    index index.html;

    # 前端 SPA（hash 路由，回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE 流式问答）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：禁缓冲、延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # OpenAPI 文档（可选）
    location /docs { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; }

    # xpack 静态资源（license-generator 等，由后端动态生成）
    location /xpack_static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 服务（含 WebSocket 升级）
    location /mcp/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # 上传体积
    client_max_body_size 50m;
}
