      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: credited_cust_name
      name: credited_cust_name
      description: 被授信方（核心企业）
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: crediting_cust_id
      name: crediting_cust_id
      description: 授信方（资金方）id
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: crediting_cust_name
      name: crediting_cust_name
      description: 授信方（资金方）
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: is_group_limit
      name: is_group_limit
      description: 是否为集团额度：Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: limit_begin_date
      name: limit_begin_date
      description: 额度有效期开始
      data_type: date
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: limit_end_date
      name: limit_end_date
      description: 额度有效期结束
      data_type: date
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: is_recyclable
      name: is_recyclable
      description: 额度是否可循环：Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: ref_tenant_project_approval_flow_credit_project_approval
      name: ref_tenant_project_approval_flow_credit_project_approval
      description: 关联项目审批
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    - field_id: ref_tenant_project_approval_flow_credit_project_approval_node
      name: ref_tenant_project_approval_flow_credit_project_approval_node
      description: 关联项目审批流程节点
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
    evidence_refs: []
  - dataset_id: approval_flow_config
    name: tenant_project_approval_flow_config
    description: 项目上线审批流程配置表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow-config
    - field_id: flow_code
      name: flow_code
      description: 流程编码：NO_ONLINE，STANDARD，REGULAR
      data_type: varchar
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-do-approval-flow-config
    - field_id: node_code
      name: node_code
      description: 节点编码字典
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow-config
    - field_id: node_name
      name: node_name
      description: 节点名称（中文）
      data_type: varchar
      dictionary: {}
      evidence_refs:
