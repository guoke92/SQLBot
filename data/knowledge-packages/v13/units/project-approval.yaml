      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: operate_type
      name: operate_type
      description: 操作类型
      data_type: varchar
      dictionary:
        pass: 同意
        reject: 驳回
        back: 退回
        delegate: 转审
      evidence_refs:
      - ev-approval-enum-operate
    - field_id: is_low_risk
      name: is_low_risk
      description: 是否低风险项目
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: is_back_agreement
      name: is_back_agreement
      description: 是否后补合作协议
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: approve_comment
      name: approve_comment
      description: 审批意见
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: operator_user_id
      name: operator_user_id
      description: 操作人 userId
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: operator_user_name
      name: operator_user_name
      description: 操作人姓名
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: operate_time
      name: operate_time
      description: 操作时间
      data_type: datetime
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: ref_tenant_project_approval_flow_node_project_approval
      name: ref_tenant_project_approval_flow_node_project_approval
      description: 关联项目审批
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: ref_tenant_project_approval_flow_node_project_approval_flow
      name: ref_tenant_project_approval_flow_node_project_approval_flow
      description: 关联项目审批流程
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    evidence_refs: []
  - dataset_id: approval_credit
    name: tenant_project_approval_flow_credit
    description: 项目上线审批授信信息表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-approval-credit
