  - caliber_id: caliber-approval-running
    label: 审批中
    description: wf_status = RUNNING 的审批单
    contract_fragment:
      predicate: tenant_project_approval.wf_status = 'RUNNING'
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-enum-wf
  - caliber_id: caliber-approval-finished
    label: 审批通过
    description: wf_status = FINISHED 的审批单
    contract_fragment:
