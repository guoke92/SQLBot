  calibers:
  - caliber_id: caliber-approval-pending
    label: 待发起审批
    description: wf_status = PENDING 的审批单
    contract_fragment:
      predicate: tenant_project_approval.wf_status = 'PENDING'
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
