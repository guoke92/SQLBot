unit_id: project-approval
revision: 1
title: 项目上线审批
aliases:
- 项目审批
- 上线审批
- 立项审批
domain: product-management
applicability: 项目上线审批从创建/发起、节点审批（同意/退回/驳回/转审）到终态项目生效或保持失效的完整闭环
description: 从 ProjectApprovalController 与 ProjectApprovalApplication/ProjectApprovalDeskApplication
  穿透：submit 先删后增审批流程节点并生成工作流定义，随后启动工作流置 RUNNING；节点审批写 flow_node 并更新 flow.node_status；终态
  FINISHED 置项目已生效。
content:
  concepts:
  - concept_id: approval-pending
    name: 待发起审批
    aliases:
    - 待发起
    - 草稿
    definition: tenant_project_approval.wf_status 为 PENDING
    dictionary:
      PENDING: 待发起
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-enum-wf
  - concept_id: approval-running
    name: 审批中
    aliases:
    - 审批进行中
    definition: tenant_project_approval.wf_status 为 RUNNING
    dictionary:
      RUNNING: 审批中
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-enum-wf
  - concept_id: approval-finished
    name: 审批通过
    aliases:
    - 上线审批通过
    - 审批完成
    definition: tenant_project_approval.wf_status 为 FINISHED
    dictionary:
      FINISHED: 审批通过
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-enum-wf
  - concept_id: approval-terminated
    name: 审批拒绝
    aliases:
    - 审批驳回
    - 审批终止
    definition: tenant_project_approval.wf_status 为 TERMINATED
    dictionary:
      TERMINATED: 审批拒绝
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-enum-wf
  processes:
  - stage_id: approval-flow-config-query
    name: 查询审批流程节点配置
    description: 按 flow_code 读 tenant_project_approval_flow_config 预设节点
    trigger: POST /app-web/projectApproval/listFlowConfig
    enter_conditions:
    - flow_code 可解析
    exit_conditions:
    - 返回流程节点配置
    next_stages: []
    data_effects:
    - operation: read
      dataset: approval_flow_config
      fields:
      - id
      - flow_code
      - node_code
      - node_name
      - node_order
      condition: flow_code = :flowCode AND enable='Y'
      description: 读流程节点配置
      evidence_refs:
      - ev-approval-flow-config-read
    evidence_refs:
    - ev-approval-flow-config-read
  - stage_id: approval-submit
    name: 发起/暂存上线审批
    description: 校验 PENDING，先删后增 flow 节点，写审批字段；正式提交回写立项编号并生成工作流定义
    trigger: POST /app-web/projectApproval/submit
    enter_conditions:
    - approval.wf_status = PENDING
    exit_conditions:
    - flow 节点已保存
    - approval 字段已更新
    next_stages:
    - approval-start-workflow
    data_effects:
    - operation: read
      dataset: approval
      fields:
      - id
      - code
      - approval_no
      - wf_status
      - is_latest
      - is_add
      - ref_tenant_project_approval_tenant_project
      condition: id = req.id
      description: 读审批主记录
      evidence_refs:
      - ev-approval-submit
    - operation: read
      dataset: project
      fields:
      - id
      - code
      - project_status
      condition: code = approval.ref_tenant_project_approval_tenant_project
      description: 读租户项目
      evidence_refs:
      - ev-approval-submit
    - operation: delete
      dataset: approval_flow
      fields:
      - ref_tenant_project_approval_flow_tenant_project_approval
      condition: ref = approval.code AND enable='Y'
      description: 先删除旧流程节点
      evidence_refs:
      - ev-approval-submit
    - operation: insert
      dataset: approval_flow
      fields:
      - code
      - node_code
      - node_name
      - node_order
      - node_status
      - approver_user_id
      - approver_user_name
      - ref_tenant_project_approval_flow_tenant_project_approval
      condition: 有审批人的节点按 node_order 排序后写入
      description: 保存新流程节点
      evidence_refs:
      - ev-approval-submit
    - operation: update
      dataset: approval
      fields:
      - is_online_approval
      - sp_no
      - project_type
      - flow_code
      - wf_status
      condition: id = approval.id
      description: 审批主表业务字段覆盖写
      evidence_refs:
      - ev-approval-submit
    - operation: update
      dataset: project
      fields:
      - wechat_audit_no
      condition: is_add=Y 且首次正式提交且 wechat_audit_no 为空
      description: 回写立项审批编号到项目配置
      evidence_refs:
      - ev-approval-backfill-spno
    evidence_refs:
    - ev-approval-submit
  - stage_id: approval-start-workflow
    name: 启动工作流
    description: 事务提交后启动工作流，成功则 initiate_time 写入、wf_status 更新为 RUNNING
    trigger: submit 非暂存后调用
    enter_conditions:
    - isDraft = N
    exit_conditions:
    - wf_status = RUNNING
    next_stages:
    - approval-node-approve
    data_effects:
    - operation: read
      dataset: approval
      fields:
      - id
      - code
      - flow_code
      condition: id = approvalId
      description: 读审批详情用于启动工作流
      evidence_refs:
      - ev-approval-start-wf
      - ev-approval-detail
    - operation: update
      dataset: approval
      fields:
      - initiate_time
      - wf_status
      - act_procinst_id
      condition: 工作流启动成功
      description: wfStatus=RUNNING 并回写 actProcinstId
      evidence_refs:
      - ev-approval-start-wf
    evidence_refs:
    - ev-approval-start-wf
  - stage_id: approval-node-approve
    name: 节点审批
    description: 同意/退回/驳回/转审均写 flow_node 并更新 flow.node_status；法务经办同意同步 is_low_risk，业务经理同意保存授信
    trigger: 审批人提交节点审批意见
    enter_conditions:
    - flow.node_code 与审批节点匹配
    exit_conditions:
    - flow_node 已写入
    - flow.node_status 已更新
    next_stages:
    - approval-finish
    data_effects:
    - operation: read
      dataset: approval
      fields:
      - id
      - code
      - wf_status
      - is_low_risk
      condition: id = req.approvalId
      description: 读审批主记录
      evidence_refs:
      - ev-approval-desk-agree
    - operation: read
      dataset: approval_flow
      fields:
      - id
      - code
      - node_code
      - node_status
      condition: code = approval.code AND node_code = req.nodeCode
      description: 读审批流程节点
      evidence_refs:
      - ev-approval-desk-agree
    - operation: insert
      dataset: approval_node
      fields:
      - code
      - node_code
      - operate_type
      - is_low_risk
      - is_back_agreement
      - approve_comment
      - operator_user_id
      - operator_user_name
      - operate_time
      - ref_tenant_project_approval_flow_node_project_approval
      - ref_tenant_project_approval_flow_node_project_approval_flow
      condition: 按 operateType 写 pass/reject/back/delegate
      description: 写节点审批操作记录
      evidence_refs:
      - ev-approval-desk-agree
      - ev-approval-desk-back
      - ev-approval-desk-reject
      - ev-approval-desk-transfer
    - operation: update
      dataset: approval_flow
      fields:
      - node_status
      condition: 同意/退回/转审置 APPROVING，驳回置 REJECTED
      description: 更新流程节点状态
      evidence_refs:
      - ev-approval-desk-agree
      - ev-approval-desk-back
      - ev-approval-desk-reject
      - ev-approval-desk-transfer
    - operation: update
      dataset: approval
      fields:
      - is_low_risk
      condition: 法务经办节点同意
      description: 同步主表 is_low_risk
      evidence_refs:
      - ev-approval-legal-lowrisk
    - operation: insert
      dataset: approval_credit
      fields:
      - credit_limit
      - credited_cust_id
      - credited_cust_name
      - crediting_cust_id
      - crediting_cust_name
      - is_group_limit
      - limit_begin_date
      - limit_end_date
      - is_recyclable
      - ref_tenant_project_approval_flow_credit_project_approval
      - ref_tenant_project_approval_flow_credit_project_approval_node
      condition: 业务经理节点同意
      description: 保存授信信息
      evidence_refs:
      - ev-approval-credit-save
    evidence_refs:
    - ev-approval-desk-agree
  - stage_id: approval-finish
    name: 审批终态处理
    description: 工作流终态通知：FINISHED/TERMINATED 更新 wf_status 和 complete_time；FINISHED
      时项目置已生效
    trigger: 流程结束监听器
    enter_conditions:
    - wfStatus = FINISHED 或 TERMINATED
    exit_conditions:
    - approval.complete_time 已写入
    - FINISHED 时 project.project_status=1
    next_stages: []
    data_effects:
    - operation: update
      dataset: approval
      fields:
      - wf_status
      - complete_time
      condition: id = approval.id
      description: 终态更新 wf_status 与 complete_time
      evidence_refs:
      - ev-approval-handle-status
    - operation: update
      dataset: project
      fields:
      - project_status
      condition: wfStatus = FINISHED
      description: 项目置为已生效
      evidence_refs:
      - ev-approval-effective
    evidence_refs:
    - ev-approval-handle-status
  datasets:
  - dataset_id: approval
    name: tenant_project_approval
    description: 项目上线审批主表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: code
      name: code
      description: 编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: approval_no
      name: approval_no
      description: 审批编号，格式：SX+yyyymmdd+xxx
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: sp_no
      name: sp_no
      description: 立项审批编号（wechat_project_approval_apply#sp_no）
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: is_online_approval
      name: is_online_approval
      description: 是否发起上线审批：Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: project_type
      name: project_type
      description: 项目类型：STANDARD（标准） / REGULAR（常规）
      data_type: varchar
      dictionary:
        STANDARD: 标准项目
        REGULAR: 常规项目
      evidence_refs:
      - ev-do-approval
    - field_id: wf_status
      name: wf_status
      description: 工作流状态
      data_type: varchar
      dictionary:
        PENDING: 待发起
        RUNNING: 审批中
        FINISHED: 审批通过
        TERMINATED: 审批拒绝
      evidence_refs:
      - ev-approval-enum-wf
    - field_id: flow_code
      name: flow_code
      description: 流程配置编码（tenant_project_approval_flow_config#flow_code）
      data_type: varchar
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-do-approval
    - field_id: is_low_risk
      name: is_low_risk
      description: 是否低风险项目:Y,N
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: is_latest
      name: is_latest
      description: 是否最新审批
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: is_add
      name: is_add
      description: 是否新增项目；Y=是，N=否
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: complete_time
      name: complete_time
      description: 完成时间
      data_type: datetime
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: initiate_time
      name: initiate_time
      description: 发起时间
      data_type: datetime
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: ref_tenant_project_approval_tenant_project
      name: ref_tenant_project_approval_tenant_project
      description: 关联租户项目
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    - field_id: act_procinst_id
      name: act_procinst_id
      description: 流程实例ID
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval
    evidence_refs: []
  - dataset_id: approval_flow
    name: tenant_project_approval_flow
    description: 项目上线审批流程节点表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: code
      name: code
      description: 编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: node_code
      name: node_code
      description: 节点编码
      data_type: varchar
      dictionary:
        PROJECT_CONFIG: 方案配置
        PROJECT_MANAGER: 方案经理
        LEGAL_PROCESS: 法务经办
        LEGAL_REVIEW: 法务复核
        BUSINESS_MANAGER: 业务经理审批
        OPERATION: 运营审批
        OTHER: 其他
        SUPPLEMENT_AGREEMENT: 补充协议
      evidence_refs:
      - ev-approval-enum-node-code
    - field_id: node_name
      name: node_name
      description: 节点名称（中文）
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: node_order
      name: node_order
      description: 节点顺序，从 1 开始
      data_type: int
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: node_status
      name: node_status
      description: 节点状态
      data_type: varchar
      dictionary:
        PENDING: 待审批
        APPROVING: 审批中
        APPROVED: 已通过
        REJECTED: 已拒绝
      evidence_refs:
      - ev-approval-enum-node-status
    - field_id: approver_user_id
      name: approver_user_id
      description: 审批人 userId
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: approver_user_name
      name: approver_user_name
      description: 审批人姓名
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    - field_id: ref_tenant_project_approval_flow_tenant_project_approval
      name: ref_tenant_project_approval_flow_tenant_project_approval
      description: 关联项目审批
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-flow
    evidence_refs: []
  - dataset_id: approval_node
    name: tenant_project_approval_flow_node
    description: 项目上线审批节点操作记录表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: code
      name: code
      description: 编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-approval-node
    - field_id: node_code
      name: node_code
