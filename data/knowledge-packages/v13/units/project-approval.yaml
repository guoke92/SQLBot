  domain_rules:
  - rule_id: rule-approval-submit-guard
    label: 审批发起状态守卫
    content: 只有 wf_status=PENDING 的审批单可发起/暂存；Controller 持有分布式锁防止重复提交。
    applicability: 项目上线审批提交接口
    query_impact: 重复提交的审批单不会进入 RUNNING；按 wf_status 过滤即可识别在途单
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-approval-submit
  - rule_id: rule-approval-legal-lowrisk
    label: 法务经办低风险必填
    content: 法务经办节点同意时必须填写 is_low_risk，并同步更新审批主表 is_low_risk，供 AMS 推送判定。
    applicability: 法务经办节点审批
    query_impact: 是否推送 AMS 需结合 approval.is_low_risk 与 project_type 判断
    field_targets:
    - dataset: approval
      field: is_low_risk
    - dataset: approval_node
      field: is_low_risk
    evidence_refs:
    - ev-approval-legal-lowrisk
  - rule_id: rule-approval-business-manager-credit
    label: 业务经理审批保存授信
    content: 业务经理节点同意时，保存 tenant_project_approval_flow_credit 授信信息。
    applicability: 业务经理审批节点
    query_impact: 审批授信信息只在业务经理节点同意后存在
    field_targets:
    - dataset: approval_flow
      field: node_code
    - dataset: approval_credit
      field: id
    evidence_refs:
    - ev-approval-credit-save
  - rule_id: rule-approval-finished-effective-project
    label: 审批通过项目生效
    content: 审批 FINISHED 时，将关联的 tenant_project.project_status 置为已生效。
    applicability: 审批终态处理
    query_impact: 项目状态=已生效的充分条件之一是最近一次上线审批 FINISHED
    field_targets:
    - dataset: approval
      field: wf_status
    - dataset: project
      field: project_status
    evidence_refs:
    - ev-approval-effective
  verified_query_patterns:
  - pattern_id: pattern-approval-running-list
    question: 审批中的项目上线审批有哪些？
    query: SELECT a.id, a.approval_no, a.name, a.project_type, a.wf_status, a.initiate_time
      FROM tenant_project_approval a WHERE a.wf_status = 'RUNNING' AND a.enable =
      'Y' ORDER BY a.initiate_time DESC
    intended_specification:
      caliber_id: caliber-approval-running
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-approval-submit
  - pattern_id: pattern-approval-node-detail
    question: 某审批单各节点的审批状态和操作记录是什么？
    query: SELECT f.node_code, f.node_name, f.node_status, n.operate_type, n.approve_comment,
      n.operator_user_name, n.operate_time FROM tenant_project_approval_flow f LEFT
      JOIN tenant_project_approval_flow_node n ON n.ref_tenant_project_approval_flow_node_project_approval_flow
      = f.code WHERE f.ref_tenant_project_approval_flow_tenant_project_approval =
      :approvalCode AND f.enable = 'Y' ORDER BY f.node_order, n.operate_time
    intended_specification:
      caliber_id: caliber-approval-running
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-approval-desk-agree
