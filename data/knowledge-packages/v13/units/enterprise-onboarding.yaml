unit_id: enterprise-onboarding
revision: 1
title: 企业自主注册建档
aliases:
- 建档
- 自主注册
- 企业建档
- 客户建档
domain: customer-management
applicability: 客户发起自主注册建档，联动客户、联系人、项目关系与推送记录
description: 从 OperCustFacade.regSelfOld 穿透：读企业/联系人 -> 锁与在途校验 -> 绑定默认项目 -> 推送运营中台
  -> 回写审核状态与运营用户 -> 保存建档推送记录；失败时回滚认证状态。
content:
  concepts:
  - concept_id: build-cert-success
    name: 认证成功
    aliases:
    - 建档认证成功
    - 认证通过
    definition: 企业主数据 cust_build_status 为 BUILD_SUCCESS，表示第三方/运营认证成功
    dictionary:
      BUILD_SUCCESS: 认证成功
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-enum-build-status
  - concept_id: build-audit-success
    name: 审核通过
    aliases:
    - 建档审核通过
    definition: 企业主数据 cust_build_status 为 CUST_BUILD_SUCCESS，表示运营审核通过
    dictionary:
      CUST_BUILD_SUCCESS: 审核通过
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-enum-build-status
  - concept_id: build-in-progress
    name: 在途建档
    aliases:
    - 建档中
    - 在途流程
    definition: check_status 非空且不为 CUST_CHECK_REJECT，表示企业存在在途建档流程
    dictionary:
      CUST_CHECK_INIT: 待审核
      CUST_CHECK_CHECKING: 审核中
    field_targets:
    - dataset: company
      field: check_status
    evidence_refs:
    - ev-lock-check
  - concept_id: effective-enterprise
    name: 有效企业
    aliases:
    - 生效企业
    - 正常企业
    definition: 企业状态为生效，可正常开展业务
    dictionary:
      EFFECT: 生效
    field_targets:
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-enum-cust-status
  processes:
  - stage_id: self-reg-submit
    name: 自主注册建档提交
    description: regSelfOld 事务链路
    trigger: 用户提交自主注册建档
    enter_conditions:
    - company.id 存在
    - 获取到 Redis 锁
    exit_conditions:
    - check_status=CUST_CHECK_INIT
    - cust_build_record 写入成功
    next_stages: []
    data_effects:
    - operation: read
      dataset: company
      fields:
      - id
      - code
      - name
      - cust_build_status
      - check_status
      - cust_company_type
      - db_tenant_code
      condition: id = companyId
      description: 读企业主数据
      evidence_refs:
      - ev-get-company
      - ev-reg-self-old
    - operation: read
      dataset: person
      fields:
      - id
      - ref_cust_company_info
      - user_type
      condition: id = personId AND ref_cust_company_info = company.code
      description: 读联系人
      evidence_refs:
      - ev-get-person
      - ev-reg-self-old
    - operation: update
      dataset: person
      fields:
      - user_type
      condition: user_type != accountAdmin
      description: 联系人置为管理员
      evidence_refs:
      - ev-person-type-admin
    - operation: read
      dataset: project_rel
      fields:
      - id
      - project_id
      - product_id
      - ref_cust_project_rel_cust_company_info
      - company_type
      - status
      condition: ref_cust_project_rel_cust_company_info = company.code
      description: 读企业项目关系
      evidence_refs:
      - ev-set-project-info
    - operation: read
      dataset: tenant_project
      fields:
      - id
      - platform_product_code
      - name
      condition: id = 项目id
      description: 读租户项目
      evidence_refs:
      - ev-set-project-info
    - operation: read
      dataset: platform_product
      fields:
      - product_code
      - name
      condition: product_code = tenant_project.platform_product_code
      description: 读平台产品
      evidence_refs:
      - ev-set-project-info
    - operation: insert
      dataset: project_rel
      fields:
      - project_id
      - product_id
      - ref_cust_project_rel_cust_company_info
      - company_type
      - status
      condition: 无项目关系且自主建档入口
      description: 无项目码时绑定租户默认项目
      evidence_refs:
      - ev-save-project-rel
    - operation: update
      dataset: company
      fields:
      - check_status
      condition: 推送成功后
      description: check_status=CUST_CHECK_INIT
      evidence_refs:
      - ev-check-status-init
      - ev-update-company
    - operation: update
      dataset: person
      fields:
      - platform_user_id
      condition: 推送成功后按 id 更新
      description: 回写运营系统用户id
      evidence_refs:
      - ev-check-status-init
      - ev-update-user
    - operation: insert
      dataset: build_record
      fields:
      - cust_id
      - person_id
      - plat_cust_id
      - plat_person_id
      - channel
      condition: 保存申请记录
      description: 写建档推送运营记录
      evidence_refs:
      - ev-save-build-record
    - operation: update
      dataset: company
      fields:
      - cust_build_status
      condition: 推送异常路径
      description: cust_build_status 回滚为 INIT
      evidence_refs:
      - ev-fail-rollback
    evidence_refs:
    - ev-reg-self-old
  datasets:
  - dataset_id: company
    name: cust_company_info
    description: 客户信息主表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-company
    - field_id: code
      name: code
      description: 编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-company
    - field_id: name
      name: name
      description: 客户名称
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-company
    - field_id: cust_build_status
      name: cust_build_status
      description: 认证状态
      data_type: varchar
      dictionary:
        INIT: 初始化
        TO_BE_BUILD: 未建档
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功
        BUILD_FAIL: 认证失败
        CUST_AUDIT_AWAIT: 待审核
        CUST_BUILDING: 审批中
        CUST_BUILD_SUCCESS: 审核通过
        CUST_BUILD_FAIL: 审核拒绝
        CUST_CHANGE: 变更
        AWAIT_CUST_CONFIRM: 待客户确认
      evidence_refs:
      - ev-enum-build-status
    - field_id: cust_status
      name: cust_status
      description: 客户状态
      data_type: varchar
      dictionary:
        ADD: 新增
        EFFECT: 生效
        FAILURE: 失效
        WRITEOFF: 注销
        FREEZE: 冻结
        CHANGE: 变更
      evidence_refs:
      - ev-enum-cust-status
    - field_id: check_status
      name: check_status
      description: 审核状态
      data_type: varchar
      dictionary:
        CUST_CHECK_INIT: 待审核
        CUST_CHECK_CHECKING: 审核中
        CUST_CHECK_PASS: 审核通过
        CUST_CHECK_REJECT: 审核不通过
        CUST_CHECK_BACKTOCUSTOM: 待客户确认
        CUST_BACK: 退回
      evidence_refs:
      - ev-enum-check-status
    - field_id: cust_company_type
      name: cust_company_type
      description: 企业角色
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-enum-company-type
    - field_id: db_tenant_code
      name: db_tenant_code
      description: 数据租户标识
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-company
    evidence_refs: []
  - dataset_id: person
    name: cust_person_info
    description: 客户联系人表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-person
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 关联企业
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-person
    - field_id: user_type
      name: user_type
      description: 联系人类型
      data_type: varchar
      dictionary:
        accountAdmin: 管理员
        accountNormal: 经办人
        accountGuest: 游客
      evidence_refs:
      - ev-enum-user-type
    - field_id: platform_user_id
      name: platform_user_id
      description: 运营系统用户id
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-person
    evidence_refs: []
  - dataset_id: project_rel
    name: cust_project_rel
    description: 客户项目关联表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-project-rel
    - field_id: project_id
      name: project_id
      description: 项目id
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-project-rel
    - field_id: product_id
      name: product_id
      description: 产品
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-project-rel
      - ev-project-rel-product-derived
    - field_id: company_type
      name: company_type
      description: 客户角色(只取一个)
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-enum-company-type
    - field_id: status
      name: status
      description: 关联状态
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-project-rel
    - field_id: ref_cust_project_rel_cust_company_info
      name: ref_cust_project_rel_cust_company_info
      description: 客户和项目关系
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-project-rel
    evidence_refs: []
  - dataset_id: tenant_project
    name: tenant_project
    description: 租户项目
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-tenant-project
    - field_id: platform_product_code
      name: platform_product_code
      description: 平台产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-tenant-project
    - field_id: name
      name: name
      description: 名称
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-tenant-project
    evidence_refs: []
  - dataset_id: platform_product
    name: platform_product
    description: 平台产品
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-platform-product
    - field_id: name
      name: name
      description: 名称
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-platform-product
    evidence_refs: []
  - dataset_id: build_record
    name: cust_build_record
    description: 建档推送运营记录表
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
    - field_id: cust_id
      name: cust_id
      description: 企业ID
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
    - field_id: person_id
      name: person_id
      description: 联系人ID
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
    - field_id: plat_cust_id
      name: plat_cust_id
      description: 运营中台ID
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
      - ev-build-record-plat-ids-external
    - field_id: plat_person_id
      name: plat_person_id
      description: 运营中台ID
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
      - ev-build-record-plat-ids-external
    - field_id: channel
      name: channel
      description: 渠道
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-do-build-record
    evidence_refs: []
  relationships: []
  metrics:
  - metric_id: build-record-count
    name: 建档推送记录数
    description: 按建档推送运营记录去重计数
    aggregation: COUNT
    field:
      dataset: build_record
      field: id
    grain:
    - dataset: build_record
      field: id
    evidence_refs:
    - ev-save-build-record
  - metric_id: company-count-by-build-status
    name: 企业数（按认证状态）
    description: 按企业主数据去重计数，可按 cust_build_status 过滤
    aggregation: COUNT
    field:
      dataset: company
      field: id
    grain:
    - dataset: company
      field: id
    evidence_refs:
    - ev-enum-build-status
  calibers:
  - caliber_id: caliber-in-progress-build
    label: 在途建档
    description: check_status 非空且不等于 CUST_CHECK_REJECT
    contract_fragment:
      predicate: cust_company_info.check_status IS NOT NULL AND cust_company_info.check_status
        != 'CUST_CHECK_REJECT'
    field_targets:
    - dataset: company
      field: check_status
    evidence_refs:
    - ev-lock-check
  - caliber_id: caliber-cert-success
    label: 认证成功企业
    description: cust_build_status = BUILD_SUCCESS（认证流），与审核通过 CUST_BUILD_SUCCESS 区分
    contract_fragment:
      predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS'
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-enum-build-status
  - caliber_id: caliber-valid-enterprise
    label: 有效企业
    description: 认证成功且企业生效，或变更中且企业状态为变更
    contract_fragment:
      predicate: (cust_company_info.cust_build_status='BUILD_SUCCESS' AND cust_company_info.cust_status='EFFECT')
        OR (cust_company_info.cust_build_status='CUST_CHANGE' AND cust_company_info.cust_status='CHANGE')
    field_targets:
    - dataset: company
      field: cust_build_status
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-enum-build-status
    - ev-enum-cust-status
  domain_rules:
  - rule_id: rule-duplicate-build-lock
    label: 建档在途防重
    content: 自主建档前获取 Redis 分布式锁并二次查询；check_status 非空且非 CUST_CHECK_REJECT 视为在途重复，直接拒绝。
    applicability: 企业自主注册建档入口 regSelfOld
    query_impact: 查询企业是否存在在途建档时必须看 check_status 而非只看 cust_build_status
    field_targets:
    - dataset: company
      field: check_status
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-lock-check
  - rule_id: rule-build-fail-rollback
    label: 建档推送失败回滚
    content: 推送运营中台异常时，将 cust_build_status 回滚为 INIT。
    applicability: 自主建档推送异常路径
    query_impact: 失败企业在 cust_build_status 上表现为 INIT，不能直接判为未发起
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-fail-rollback
  - rule_id: rule-supplier-acflow-status
    label: 供应商 ACFLOW/ORDER 产品项目关系置为 1
    content: 供应商企业绑定项目时，若租户项目平台产品为 ACFLOW 或 ORDER，则 cust_project_rel.status 写 1，否则写
      0。
    applicability: 无项目码自动绑定默认项目时
    query_impact: 供应商在 ACFLOW/ORDER 项目下的关系记录 status=1
    field_targets:
    - dataset: project_rel
      field: company_type
    - dataset: project_rel
      field: status
    - dataset: tenant_project
      field: platform_product_code
    evidence_refs:
    - ev-save-project-rel
  verified_query_patterns:
  - pattern_id: pattern-onboarding-build-records
    question: 某企业的建档推送记录有哪些？
    query: SELECT id, cust_id, person_id, plat_cust_id, plat_person_id, channel FROM
      cust_build_record WHERE cust_id = :companyId ORDER BY id DESC
    intended_specification:
      caliber_id: caliber-in-progress-build
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-save-build-record
  - pattern_id: pattern-company-by-build-status
    question: 认证成功的有效企业有哪些？
    query: SELECT c.id, c.code, c.name, c.cust_build_status, c.cust_status FROM cust_company_info
      c WHERE c.cust_build_status = 'BUILD_SUCCESS' AND c.cust_status = 'EFFECT'
    intended_specification:
      caliber_id: caliber-valid-enterprise
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-enum-build-status
    - ev-enum-cust-status
evidence_refs:
- ev-reg-self-old
unit_links: []
assumptions:
- 推送运营中台的远程服务 opss 不是本地物理表，相关数据只体现在 cust_build_record.return_data JSON 中
conflicts: []
confidence: 0.9
