  metrics:
  - metric_id: metric-approval-count
    name: 项目上线审批数
    description: 项目上线审批主记录数。
    aggregation: COUNT
    field:
      dataset: project_approval
      field: id
    grain:
    - dataset: project_approval
      field: id
    filters: []
    evidence_refs:
    - ev-proj-create-approval
  - metric_id: metric-approval-passed-count
    name: 审批通过项目数
    description: 工作流状态为 FINISHED 的项目上线审批数。
    aggregation: COUNT
    field:
      dataset: project_approval
      field: id
    grain:
    - dataset: project_approval
      field: id
    filters:
    - field: wf_status
      op: '='
      value: FINISHED
    evidence_refs:
    - ev-proj-handle-status
  - metric_id: metric-approval-running-count
    name: 在途审批数
    description: 工作流状态为 RUNNING 的审批数。
    aggregation: COUNT
    field:
      dataset: project_approval
      field: id
    grain:
    - dataset: project_approval
      field: id
    filters:
    - field: wf_status
      op: '='
      value: RUNNING
    evidence_refs:
    - ev-proj-start-workflow
  calibers:
  - caliber_id: cal-approval-pending
    label: 待发起审批
    description: 审批工作流状态为 PENDING。
    contract_fragment:
      predicate: wf_status = 'PENDING'
      scope: tenant_project_approval 全局定义
    field_targets:
    - dataset: project_approval
      field: wf_status
    evidence_refs:
    - ev-proj-wf-status-dict
  - caliber_id: cal-approval-running
    label: 审批中
    description: 审批工作流状态为 RUNNING。
    contract_fragment:
      predicate: wf_status = 'RUNNING'
      scope: tenant_project_approval 全局定义
    field_targets:
    - dataset: project_approval
      field: wf_status
    evidence_refs:
    - ev-proj-wf-status-dict
  - caliber_id: cal-approval-passed
    label: 审批通过
    description: 审批工作流状态为 FINISHED。
    contract_fragment:
      predicate: wf_status = 'FINISHED'
      scope: tenant_project_approval 全局定义
