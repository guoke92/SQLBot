unit_id: project-approval
revision: 1
title: 项目上线审批
aliases:
- 项目审批
- 上线审批
domain: product
applicability: 租户项目发起/复制/提交/审批/生效的上线审批闭环
description: 穿透 ProjectApprovalApplication 与 ProjectApprovalDeskApplication：创建审批、查流程配置、提交审批（先删后增节点实例、回写立项编号）、启动工作流、节点审批（法务/业务经理/通用/退回/驳回/转审）、终态项目生效。
content:
  concepts:
  - concept_id: project-approval
    name: 项目上线审批
    aliases:
    - 上线审批
    - 项目审批
    definition: 项目上线审批主记录 tenant_project_approval，以主键 id 锚定。
    field_targets:
    - dataset: project_approval
      field: id
    evidence_refs:
    - ev-proj-schema
  - concept_id: approval-running
    name: 审批中
    aliases:
    - 项目审批中
    definition: 项目上线审批工作流状态为 RUNNING。
    dictionary:
      RUNNING: 审批中
    field_targets:
    - dataset: project_approval
      field: wf_status
    evidence_refs:
    - ev-proj-wf-status-dict
  - concept_id: approval-passed
    name: 审批通过
    aliases:
    - 上线审批通过
    definition: 项目上线审批工作流状态为 FINISHED。
    dictionary:
      FINISHED: 审批通过
    field_targets:
    - dataset: project_approval
      field: wf_status
    evidence_refs:
    - ev-proj-wf-status-dict
  - concept_id: approval-legal-process
    name: 法务经办节点
    aliases:
    - 法务经办
    definition: 审批流程中 node_code=LEGAL_PROCESS 的节点，同意时必须填写是否低风险。
    dictionary:
      LEGAL_PROCESS: 法务经办
    field_targets:
    - dataset: approval_flow
      field: node_code
    evidence_refs:
    - ev-proj-node-code-dict
  processes:
  - stage_id: approval-create
    name: 创建项目上线审批
    description: 项目创建/复制审批：写审批主记录并回写项目 project_approval_id；复制场景读取原审批并复制业务信息/流程节点。
    trigger: ProjectApprovalApplication.createInitialApproval / doCreateApproval
    enter_conditions:
    - 项目存在且 project.code 非空
    exit_conditions:
    - approval.wf_status=PENDING
    - project.project_approval_id 已回写
    next_stages:
    - approval-prepare
    data_effects:
    - operation: read
      dataset: tenant_project
      fields:
      - id
      - code
      - name
      - db_tenant_code
      condition: id = projectId 或 code = projectCode
      description: 读项目生成审批基础信息
      evidence_refs:
      - ev-proj-create-approval
    - operation: read
      dataset: project_approval
      fields:
      - id
      - code
      - enable
      - ref_tenant_project_approval_tenant_project
      condition: code = refTenantProjectApprovalTenantProjectApproval 且 enable='Y'
      description: 复制场景读原审批
      evidence_refs:
      - ev-proj-copy-approval
    - operation: read
      dataset: approval_business_info
      fields:
      - id
      - ref_tenant_project_approval_business_info_project_approval
      - product_code
      - source_system
      - asset_list_mode
      - business_flow_mode
      - service_fee_collector_financing
      - service_fee_quote_type_financing
      - service_fee_collect_method_financing
      - enable
      condition: ref_tenant_project_approval_business_info_project_approval = 原审批.code
      description: 复制场景读原审批业务信息
      evidence_refs:
      - ev-proj-copy-approval
    - operation: read
      dataset: approval_flow
      fields:
      - id
      - ref_tenant_project_approval_flow_tenant_project_approval
      - node_code
      - node_name
      - node_order
      - node_status
      - approver_user_id
      - approver_user_name
      - is_optional
      - enable
      condition: ref_tenant_project_approval_flow_tenant_project_approval = 原审批.code
      description: 复制场景读原审批流程节点
      evidence_refs:
      - ev-proj-copy-approval
    - operation: insert
      dataset: project_approval
      fields:
      - code
      - name
      - approval_no
      - wf_status
      - flow_code
      - project_type
      - is_add
      - ref_tenant_project_approval_tenant_project
      - db_tenant_code
      - enable
      condition: 新建/复制审批主记录
      description: 写入项目上线审批主记录，wf_status=PENDING
      evidence_refs:
      - ev-proj-create-approval
      - ev-proj-copy-approval
    - operation: update
      dataset: tenant_project
      fields:
      - project_approval_id
      condition: id = projectId
      description: 回写项目当前审批 id
      evidence_refs:
      - ev-proj-create-approval
    evidence_refs:
    - ev-proj-create-approval
  - stage_id: approval-prepare
    name: 查询审批流程配置
    description: 发起审批前按 is_online_approval + project_type 推断 flow_code 并查询预设流程节点。
    trigger: ProjectApprovalApplication.listFlowConfig
    enter_conditions:
    - isOnlineApproval 合法
    - projectType 合法
    exit_conditions:
    - 返回该 flow_code 下有序节点列表
    next_stages:
    - approval-submit
    data_effects:
    - operation: read
      dataset: approval_flow_config
      fields:
      - id
      - flow_code
      - node_code
      - node_name
      - node_order
      - is_optional
      - is_operate
      - enable
      condition: flow_code = :flowCode AND enable='Y' ORDER BY node_order
      description: 按流程编码读预设审批节点
      evidence_refs:
      - ev-proj-list-flow-config
    evidence_refs:
    - ev-proj-list-flow-config
  - stage_id: approval-submit
    name: 提交/暂存上线审批
    description: 提交审批：先删后增流程节点实例、写入审批业务字段、回写项目立项编号、生成工作流定义。
    trigger: ProjectApprovalApplication.submit
    enter_conditions:
    - 审批存在且 wf_status=PENDING
    exit_conditions:
    - approval 已更新，flow 节点实例已保存，project.wechat_audit_no 已回写（首次正式提交）
    next_stages:
    - approval-start
    data_effects:
    - operation: read
      dataset: project_approval
      fields:
      - id
      - code
      - wf_status
      - ref_tenant_project_approval_tenant_project
      - is_add
      - sp_no
      - flow_code
      - project_type
      - enable
      condition: id = approvalId AND enable='Y'
      description: 读审批主记录并校验 PENDING
      evidence_refs:
      - ev-proj-submit
    - operation: read
      dataset: tenant_project
      fields:
      - id
      - code
      - project_status
      - wechat_audit_no
      - enable
      condition: code = approval.ref_tenant_project_approval_tenant_project
      description: 读关联项目
      evidence_refs:
      - ev-proj-submit
    - operation: delete
      dataset: approval_flow
      fields:
      - id
      - ref_tenant_project_approval_flow_tenant_project_approval
      condition: ref_tenant_project_approval_flow_tenant_project_approval = approval.code AND enable='Y'
      description: 先删旧节点实例（先删后增）
      evidence_refs:
      - ev-proj-submit
    - operation: insert
      dataset: approval_flow
      fields:
      - ref_tenant_project_approval_flow_tenant_project_approval
      - node_code
      - node_name
      - node_order
      - node_status
      - approver_user_id
      - approver_user_name
      - is_optional
      - enable
      condition: flowList 非空且有效审批人节点
      description: 保存本次提交的审批流程节点实例
      evidence_refs:
      - ev-proj-submit
    - operation: update
      dataset: project_approval
      fields:
      - name
      - sp_no
      - wf_status
      - flow_code
      - project_type
      - is_low_risk
      condition: id = approvalId
      description: 将请求业务字段写入审批 DO，暂存时返回
      evidence_refs:
      - ev-proj-submit
    - operation: update
      dataset: tenant_project
      fields:
      - wechat_audit_no
      condition: is_add=Y 且首次发起且 sp_no 非空
      description: 新增项目首次正式提交回写立项编号
      evidence_refs:
      - ev-proj-submit
    evidence_refs:
    - ev-proj-submit
  - stage_id: approval-start
    name: 启动工作流
    description: 事务外启动项目上线审批工作流，成功后更新 wf_status=RUNNING。
    trigger: ProjectApprovalApplication.startWorkflowAndUpdateStatus
    enter_conditions:
    - submit 事务已提交
    exit_conditions:
    - wf_status=RUNNING 或保持 PENDING（失败降级）
    next_stages:
    - approval-node
    data_effects:
    - operation: read
      dataset: project_approval
      fields:
      - id
      - code
      - wf_status
      - db_tenant_code
      condition: id = approvalId
      description: 读审批轻详情用于启动工作流
      evidence_refs:
      - ev-proj-start-workflow
    - operation: update
      dataset: project_approval
      fields:
      - initiate_time
      - wf_status
      condition: id = approvalId AND 启动成功
      description: wf_status 置 RUNNING，记录发起时间
      evidence_refs:
      - ev-proj-start-workflow
    evidence_refs:
    - ev-proj-start-workflow
  - stage_id: approval-node
    name: 审批节点操作
    description: 法务经办/业务经理/通用节点同意、退回、驳回、转审：写 flow_node 操作记录，更新 flow.node_status，按节点写入授信或 is_low_risk。
    trigger: ProjectApprovalDeskApplication.agree/back/reject/transfer
    enter_conditions:
    - 审批存在且 enable='Y'
    - flow.node_code 匹配
    exit_conditions:
    - flow_node 已保存，flow.node_status 已更新
    next_stages:
    - approval-finish
    data_effects:
    - operation: read
      dataset: project_approval
      fields:
      - id
      - code
      - db_tenant_code
      - is_low_risk
      condition: id = approvalId AND enable='Y'
      description: 读审批主记录
      evidence_refs:
      - ev-proj-desk-agree
    - operation: read
      dataset: approval_flow
      fields:
      - id
      - code
      - ref_tenant_project_approval_flow_tenant_project_approval
      - node_code
      - node_status
      condition: ref_tenant_project_approval_flow_tenant_project_approval = approval.code AND node_code = :nodeCode AND enable='Y'
      description: 按审批编码和节点编码读流程节点实例
      evidence_refs:
      - ev-proj-desk-agree
    - operation: insert
      dataset: approval_flow_node
      fields:
      - ref_tenant_project_approval_flow_node_project_approval
      - ref_tenant_project_approval_flow_node_project_approval_flow
      - node_code
      - node_order
      - operate_type
      - operator_user_id
      - operator_user_name
      - approve_comment
      - is_low_risk
      - is_back_agreement
      - operate_time
      - enable
      condition: 每个审批动作落一条节点操作记录
      description: 保存审批节点操作记录（同意/退回/驳回/转审）
      evidence_refs:
      - ev-proj-desk-build-node
    - operation: update
      dataset: approval_flow
      fields:
      - node_status
      condition: id = flow.id
      description: 更新流程节点状态为 APPROVING/APPROVED/REJECTED
      evidence_refs:
      - ev-proj-desk-agree
      - ev-proj-desk-back-reject
    - operation: insert
      dataset: approval_flow_credit
      fields:
      - ref_tenant_project_approval_flow_credit_project_approval
      - ref_tenant_project_approval_flow_credit_project_approval_node
      - credit_limit
      - credited_cust_id
      - credited_cust_name
      - crediting_cust_id
      - crediting_cust_name
      - is_group_limit
      - limit_begin_date
      - limit_end_date
      - is_recyclable
      - finance_email
      - enable
      condition: 业务经理节点同意时
      description: 保存授信信息
      evidence_refs:
      - ev-proj-desk-save-credit
    - operation: update
      dataset: project_approval
      fields:
      - is_low_risk
      condition: 法务经办节点同意时
      description: 回写主表 is_low_risk 供 AMS 判定
      evidence_refs:
      - ev-proj-desk-agree
    - operation: insert
      dataset: approval_flow_file
      fields:
      - ref_tenant_project_approval_flow_file_project_approval
      - ref_tenant_project_approval_flow_file_project_approval_flow_node
      - catg_id
      - catg_name
      - file_id
      - file_name
      - file_url
      - enable
      condition: 节点操作附带附件时
      description: 审批文件落库并关联审批/流程节点
      evidence_refs:
      - ev-proj-desk-media-file
    evidence_refs:
    - ev-proj-desk-agree
  - stage_id: approval-finish
    name: 审批终态与项目生效
    description: 工作流终态（FINISHED/TERMINATED）回写审批主记录；FINISHED 时触发项目置为已生效并推送业务系统/AMS。
    trigger: ProjectOnlineProcessOperateListener 流程结束通知 -> handleFlowAndNodeStatus
    enter_conditions:
    - wfStatus ∈ {FINISHED, TERMINATED}
    exit_conditions:
    - approval.wf_status 终态已写，FINISHED 时 tenant_project.project_status=1
    next_stages: []
    data_effects:
    - operation: update
      dataset: project_approval
      fields:
      - wf_status
      - complete_time
      condition: id = approvalId
      description: 更新审批主记录为 FINISHED/TERMINATED，记录完成时间
      evidence_refs:
      - ev-proj-handle-status
    - operation: update
      dataset: tenant_project
      fields:
      - project_status
      condition: wfStatus=FINISHED 且 projectId 非空
      description: 审批通过后将项目置为已生效
      evidence_refs:
      - ev-proj-effective
    evidence_refs:
    - ev-proj-handle-status
  datasets:
  - dataset_id: tenant_project
    name: tenant_project
    description: 租户项目配置
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: project_status
      name: project_status
      data_type: varchar
      description: 项目状态
      dictionary:
        '0': 待生效
        '1': 已生效
        '2': 已失效
      evidence_refs:
      - ev-tenant-project-schema
      - ev-proj-project-status-dict
    - field_id: project_approval_id
      name: project_approval_id
      data_type: bigint
      description: 项目上线审批ID（FK：tenant_project.project_approval_id -> tenant_project_approval.id）
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: wechat_audit_no
      name: wechat_audit_no
      data_type: varchar
      description: 企微审批编号
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-tenant-project-schema
    evidence_refs:
    - ev-proj-create-approval
    - ev-proj-desk-agree
    - ev-proj-effective
    - ev-proj-handle-status
    - ev-proj-list-flow-config
    - ev-proj-start-workflow
    - ev-proj-submit
    - ev-tenant-project-schema
  - dataset_id: project_approval
    name: tenant_project_approval
    description: 项目上线审批主记录
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-proj-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-proj-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-proj-schema
    - field_id: approval_no
      name: approval_no
      data_type: varchar
      description: 审批编号，格式：SX+yyyymmdd+xxx
      evidence_refs:
      - ev-proj-schema
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      description: 立项审批编号
      evidence_refs:
      - ev-proj-schema
    - field_id: wf_status
      name: wf_status
      data_type: varchar
      description: 工作流状态
      dictionary:
        PENDING: 待发起
        RUNNING: 审批中
        FINISHED: 审批通过
        TERMINATED: 审批拒绝
      evidence_refs:
      - ev-proj-schema
      - ev-proj-wf-status-dict
    - field_id: flow_code
      name: flow_code
      data_type: varchar
      description: 流程配置编码
      dictionary: &id002
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-proj-schema
      - ev-proj-flow-code-dict
    - field_id: project_type
      name: project_type
      data_type: varchar
      description: 项目类型
      dictionary:
        STANDARD: 标准项目
        REGULAR: 常规项目
      evidence_refs:
      - ev-proj-schema
      - ev-proj-project-type-dict
    - field_id: is_low_risk
      name: is_low_risk
      data_type: varchar
      description: 是否低风险项目
      dictionary: &id001
        Y: 是
        N: 否
      evidence_refs:
      - ev-proj-schema
    - field_id: is_add
      name: is_add
      data_type: varchar
      description: 是否新增项目
      dictionary: *id001
      evidence_refs:
      - ev-proj-schema
    - field_id: ref_tenant_project_approval_tenant_project
      name: ref_tenant_project_approval_tenant_project
      data_type: varchar
      description: 关联租户项目
      evidence_refs:
      - ev-proj-schema
    - field_id: initiate_time
      name: initiate_time
      data_type: datetime
      description: 发起时间
      evidence_refs:
      - ev-proj-schema
    - field_id: complete_time
      name: complete_time
      data_type: datetime
      description: 完成时间
      evidence_refs:
      - ev-proj-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-proj-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-proj-schema
    evidence_refs:
    - ev-proj-copy-approval
    - ev-proj-create-approval
    - ev-proj-desk-agree
    - ev-proj-handle-status
    - ev-proj-list-flow-config
    - ev-proj-schema
    - ev-proj-start-workflow
    - ev-proj-submit
  - dataset_id: approval_business_info
    name: tenant_project_approval_business_info
    description: 项目审批业务信息
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: ref_tenant_project_approval_business_info_project_approval
      name: ref_tenant_project_approval_business_info_project_approval
      data_type: varchar
      description: 关联项目审批
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码code
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: source_system
      name: source_system
      data_type: varchar
      description: 来源系统
      dictionary:
        ACFLOW: 讯易链
        RVSFACTOR_PC: 线上保理
        ORDER: 订单融资
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: asset_list_mode
      name: asset_list_mode
      data_type: varchar
      description: 资产清单模式
      dictionary:
        STANDARD_LIST: 标准清单
        SIMPLE_LIST: 简易清单
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: business_flow_mode
      name: business_flow_mode
      data_type: varchar
      description: 业务流程模式
      dictionary:
        CONFIRM_RIGHT_FIRST: 先确权
        CONFIRM_RIGHT_AFTER: 后确权
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: service_fee_collector_financing
      name: service_fee_collector_financing
      data_type: varchar
      description: 服务费收取方
      dictionary:
        PLATFORM: 平台方
        OPERATOR: 运营方
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: service_fee_quote_type_financing
      name: service_fee_quote_type_financing
      data_type: varchar
      description: 服务费报价类型
      dictionary:
        PLATFORM_SERVICE_RATE: 平台服务费率
        TOTAL_RATE: 总费率
        FIXED: 固定年化利率
        PAY_PER_VIEW: 非年化利率
      evidence_refs:
      - ev-proj-biz-schema
    - field_id: service_fee_collect_method_financing
      name: service_fee_collect_method_financing
      data_type: varchar
      description: 服务费收取方式
      dictionary:
        ONLINE: 线上收取
        OFFLINE: 线下收取
        BOCOM_PAY: 交e保
        FREE: 免费
      evidence_refs:
      - ev-proj-biz-schema
