unit_id: customer-survey-invite-settings
revision: 1
title: 问卷/邀请/客户设置
aliases: []
domain: customer
applicability: 企业邀请码、问卷调研白名单与答案、首访问卷弹窗状态、建档配置信息场景
description: 穿透 CustCompanyInfoController 邀请保存、WenjuanDisplayService 首访状态、CustSurveyAnswerService 提交答案、CustSettingConfigController
  读取配置。
content:
  concepts:
  - concept_id: cust-invite
    name: 企业邀请
    aliases: []
    definition: 企业邀请信息 cust_invite_info
    dictionary: {}
    field_targets:
    - dataset: cust_invite_info
      field: id
    evidence_refs:
    - ev-cust-invite-schema
  - concept_id: survey-state
    name: 问卷首访状态
    aliases: []
    definition: 企业问卷首访状态 cust_company_survey_state
    dictionary: {}
    field_targets:
    - dataset: cust_company_survey_state
      field: id
    evidence_refs:
    - ev-cust-survey-state-schema
  - concept_id: survey-whitelist
    name: 问卷白名单
    aliases: []
    definition: 企业问卷白名单 cust_company_survey_whitelist
    dictionary: {}
    field_targets:
    - dataset: cust_company_survey_whitelist
      field: id
    evidence_refs:
    - ev-cust-survey-whitelist-schema
  - concept_id: survey-answer
    name: 调研答案
    aliases: []
    definition: 企业调研答案 cust_survey_answer
    dictionary: {}
    field_targets:
    - dataset: cust_survey_answer
      field: id
    evidence_refs:
    - ev-cust-survey-answer-schema
  - concept_id: cust-setting-config
    name: 建档配置
    aliases: []
    definition: 企业建档配置 cust_setting_config
    dictionary: {}
    field_targets:
    - dataset: cust_setting_config
      field: id
    evidence_refs:
    - ev-cust-setting-config-schema
  processes:
  - stage_id: invite-save
    name: 邀请信息保存
    description: 企业邀请检查/保存/创建客户
    trigger: CustCompanyInfoController.inviteCheck/inviteSave
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - survey-state-claim
    data_effects:
    - operation: read
      dataset: cust_invite_info
      fields:
      - id
      - contact_phone
      - channel_code
      - invite_from
      - invite_cust_id
      - enable
      condition: contact_phone=:contactPhone
      description: 邀请查重
      evidence_refs:
      - ev-cust-invite-save
    - operation: upsert
      dataset: cust_invite_info
      fields:
      - progress
      - contact_name
      - contact_phone
      - channel_code
      - invite_from
      - invite_cust_id
      - enable
      condition: 保存邀请
      description: 保存企业邀请信息
      evidence_refs:
      - ev-cust-invite-save
    evidence_refs:
    - ev-cust-invite-save
  - stage_id: survey-state-claim
    name: 问卷首访状态
    description: 查询/抢占企业首个访问用户与转盘展示状态
    trigger: WenjuanDisplayService
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - survey-answer-submit
    data_effects:
    - operation: read
      dataset: cust_company_survey_state
      fields:
      - id
      - company_id
      - first_visitor_user_id
      - first_visit_time
      - first_visitor_lottery_shown
      - enable
      condition: company_id=:companyId
      description: 读首访状态
      evidence_refs:
      - ev-cust-survey-state-claim
    - operation: upsert
      dataset: cust_company_survey_state
      fields:
      - company_id
      - first_visitor_user_id
      - first_visit_time
      - first_visitor_lottery_shown
      - enable
      condition: 首访时插入/更新
      description: 保存首访状态
      evidence_refs:
      - ev-cust-survey-state-claim
    - operation: read
      dataset: cust_company_survey_whitelist
      fields:
      - id
      - company_id
      - company_name
      - enable
      condition: company_id=:companyId AND enable='Y'
      description: 读问卷白名单
      evidence_refs:
      - ev-cust-survey-whitelist-check
    evidence_refs:
    - ev-cust-survey-state-claim
  - stage_id: survey-answer-submit
    name: 调研答案提交
    description: 企业用户提交调研问卷答案
    trigger: CustSurveyAnswerService.submit
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - setting-read
    data_effects:
    - operation: insert
      dataset: cust_survey_answer
      fields:
      - survey_code
      - company_id
      - user_id
      - question_no
      - answer_value
      - submit_time
      condition: 提交答案
      description: 保存调研答案
      evidence_refs:
      - ev-cust-survey-answer-submit
    evidence_refs:
    - ev-cust-survey-answer-submit
  - stage_id: setting-read
    name: 建档配置读取
    description: 读取企业建档配置（关键信息/邀请码/打款次数等）
    trigger: CustSettingConfigController.getConfig
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: cust_setting_config
      fields:
      - id
      - key_word
      - need_verify_no_key
      - invitation_code_period
      - payment_maximum_number
      - enable
      condition: enable='Y'
      description: 读建档配置
      evidence_refs:
      - ev-cust-setting-get
    evidence_refs:
    - ev-cust-setting-get
  datasets:
  - dataset_id: cust_invite_info
    name: cust_invite_info
    description: 企业邀请信息
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: progress
      name: progress
      data_type: varchar
      description: 进度
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: contact_name
      name: contact_name
      data_type: varchar
      description: 联系人
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: contact_phone
      name: contact_phone
      data_type: varchar
      description: 联系人手机号码
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: channel_code
      name: channel_code
      data_type: varchar
      description: 渠道码（渠道业务编码，非外键）
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: invite_from
      name: invite_from
      data_type: varchar
      description: 邀请主体
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: invite_cust_id
      name: invite_cust_id
      data_type: bigint
      description: 邀请客户id（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-invite-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-invite-schema
    evidence_refs:
    - ev-cust-invite-save
    - ev-cust-invite-schema
    - ev-cust-setting-get
    - ev-cust-survey-answer-submit
    - ev-cust-survey-state-claim
  - dataset_id: cust_company_survey_state
    name: cust_company_survey_state
    description: 企业问卷首访状态
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-survey-state-schema
    - field_id: company_id
      name: company_id
      data_type: bigint
      description: 企业ID（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-survey-state-schema
    - field_id: first_visitor_user_id
      name: first_visitor_user_id
      data_type: bigint
      description: 首个进入产融首页的用户ID（外部用户系统标识，非本库外键）
      evidence_refs:
      - ev-cust-survey-state-schema
    - field_id: first_visit_time
      name: first_visit_time
      data_type: datetime
      description: 首次访问时间
      evidence_refs:
      - ev-cust-survey-state-schema
    - field_id: first_visitor_lottery_shown
      name: first_visitor_lottery_shown
      data_type: varchar
      description: 转盘抽奖是否已展示
      dictionary:
        Y: 是
        N: 否
      evidence_refs:
      - ev-cust-survey-state-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-survey-state-schema
    evidence_refs:
    - ev-cust-invite-save
    - ev-cust-setting-get
    - ev-cust-survey-answer-submit
    - ev-cust-survey-state-claim
    - ev-cust-survey-state-schema
  - dataset_id: cust_company_survey_whitelist
    name: cust_company_survey_whitelist
    description: 企业问卷白名单
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-survey-whitelist-schema
    - field_id: company_id
      name: company_id
      data_type: bigint
      description: 企业id（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-survey-whitelist-schema
    - field_id: company_name
      name: company_name
      data_type: varchar
      description: 企业名称
      evidence_refs:
      - ev-cust-survey-whitelist-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-survey-whitelist-schema
    evidence_refs:
    - ev-cust-invite-save
    - ev-cust-setting-get
    - ev-cust-survey-answer-submit
    - ev-cust-survey-state-claim
    - ev-cust-survey-whitelist-check
    - ev-cust-survey-whitelist-schema
  - dataset_id: cust_survey_answer
    name: cust_survey_answer
    description: 企业调研答案
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键（雪花ID）
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: survey_code
      name: survey_code
      data_type: varchar
      description: 调研编码（对应 Nacos 配置，非外键）
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: company_id
      name: company_id
      data_type: bigint
      description: 当前登录企业ID（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: user_id
      name: user_id
      data_type: bigint
      description: 当前登录用户ID（外部用户系统标识，非本库外键）
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: question_no
      name: question_no
      data_type: int
      description: 题号
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: answer_value
      name: answer_value
      data_type: varchar
      description: 选项明文
      evidence_refs:
      - ev-cust-survey-answer-schema
    - field_id: submit_time
      name: submit_time
      data_type: datetime
      description: 提交时间
      evidence_refs:
      - ev-cust-survey-answer-schema
    evidence_refs:
    - ev-cust-invite-save
    - ev-cust-setting-get
    - ev-cust-survey-answer-schema
    - ev-cust-survey-answer-submit
    - ev-cust-survey-state-claim
  - dataset_id: cust_setting_config
    name: cust_setting_config
    description: 企业建档配置
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-setting-config-schema
    - field_id: key_word
      name: key_word
      data_type: varchar
      description: 企业关键信息
      evidence_refs:
      - ev-cust-setting-config-schema
    - field_id: need_verify_no_key
      name: need_verify_no_key
      data_type: varchar
      description: 企业非关键信息变更审核
      evidence_refs:
      - ev-cust-setting-config-schema
    - field_id: invitation_code_period
      name: invitation_code_period
      data_type: int
      description: 邀请码有效期
      evidence_refs:
      - ev-cust-setting-config-schema
    - field_id: payment_maximum_number
      name: payment_maximum_number
      data_type: int
      description: 最多申请打款次数
      evidence_refs:
      - ev-cust-setting-config-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-setting-config-schema
    evidence_refs:
    - ev-cust-invite-save
    - ev-cust-setting-config-schema
    - ev-cust-setting-get
    - ev-cust-survey-answer-submit
    - ev-cust-survey-state-claim
  relationships: []
  metrics:
  - metric_id: metric-invite-count
    name: 企业邀请数
    description: 企业邀请记录数
    aggregation: COUNT
    field:
      dataset: cust_invite_info
      field: id
    grain:
    - dataset: cust_invite_info
      field: id
    filters: []
    evidence_refs:
    - ev-cust-invite-save
  - metric_id: metric-survey-answer-count
    name: 调研答案数
    description: 企业调研答案数
    aggregation: COUNT
    field:
      dataset: cust_survey_answer
      field: id
    grain:
    - dataset: cust_survey_answer
      field: id
    filters: []
    evidence_refs:
    - ev-cust-survey-answer-submit
  calibers:
  - caliber_id: cal-survey-whitelisted
    label: 问卷白名单企业
    description: enable=Y 的问卷白名单企业
    contract_fragment:
      predicate: enable = 'Y'
      scope: enable=Y 的问卷白名单企业
    field_targets:
    - dataset: cust_company_survey_whitelist
      field: enable
    evidence_refs:
    - ev-cust-survey-whitelist-check
  - caliber_id: cal-lottery-not-shown
    label: 转盘未展示
    description: first_visitor_lottery_shown=N 的首访记录
    contract_fragment:
      predicate: first_visitor_lottery_shown = 'N'
      scope: first_visitor_lottery_shown=N 的首访记录
    field_targets:
    - dataset: cust_company_survey_state
      field: first_visitor_lottery_shown
    evidence_refs:
    - ev-cust-survey-state-claim
  domain_rules:
  - rule_id: rule-survey-whitelist-gate
    label: 问卷仅白名单企业可见
    content: 问卷弹窗/调研入口只对 cust_company_survey_whitelist 中 enable=Y 的企业展示。
    applicability: WenjuanDisplayService
    query_impact: 查询问卷可见企业时必须关联白名单表。
    field_targets:
    - dataset: cust_company_survey_whitelist
      field: company_id
    evidence_refs:
    - ev-cust-survey-whitelist-check
  - rule_id: rule-first-visitor-lottery
    label: 首访用户转盘展示只一次
    content: 首访用户转盘抽奖展示后置 first_visitor_lottery_shown=Y，后续访问不再展示。
    applicability: WenjuanDisplayService
    query_impact: 查询转盘展示状态时按 first_visitor_lottery_shown 判断。
    field_targets:
    - dataset: cust_company_survey_state
      field: first_visitor_lottery_shown
    evidence_refs:
    - ev-cust-survey-state-claim
  verified_query_patterns:
  - pattern_id: pat-survey-whitelist-by-company
    question: 查问卷白名单企业
    query: SELECT * FROM cust_company_survey_whitelist WHERE company_id=:companyId AND enable='Y'
    intended_specification:
      caliber_id: cal-survey-whitelisted
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cust-survey-whitelist-check
  - pattern_id: pat-survey-answer-by-company
    question: 查企业调研答案
    query: SELECT * FROM cust_survey_answer WHERE company_id=:companyId ORDER BY submit_time DESC
    intended_specification:
      metric_id: metric-survey-answer-count
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cust-survey-answer-submit
evidence_refs: []
unit_links: []
assumptions:
- 问卷星为外部问卷服务，只落本地白名单/首访状态/答案记录
conflicts: []
confidence: 0.7
