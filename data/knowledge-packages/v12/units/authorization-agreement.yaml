unit_id: authorization-agreement
revision: 1
title: 授权协议
aliases: []
domain: product
applicability: 企业产品授权书认证状态查询、保存/更新场景
description: 穿透 CustAuthAgreementDomainService：查询企业管理员在各平台产品下的授权书认证状态，保存/更新授权协议。
content:
  concepts:
  - concept_id: authorization-agreement
    name: 授权协议
    aliases: []
    definition: 企业产品授权书 authorization_agreement
    dictionary: {}
    field_targets:
    - dataset: authorization_agreement
      field: id
    evidence_refs:
    - ev-authorization-agreement-schema
  - concept_id: authorization-authed
    name: 已授权
    aliases: []
    definition: authed_status=Y 的授权协议
    dictionary:
      Y: 已授权
      N: 未授权
    field_targets:
    - dataset: authorization_agreement
      field: authed_status
    evidence_refs:
    - ev-authorization-agreement-check
  processes:
  - stage_id: auth-agreement-check
    name: 授权状态检查
    description: 按企业管理员+产品查询授权书认证状态
    trigger: CustAuthAgreementDomainService.listAuthorizationAgreement
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - auth-agreement-save
    data_effects:
    - operation: read
      dataset: authorization_agreement
      fields:
      - id
      - cust_id
      - cust_manager_id
      - platform_product_code
      - authed_status
      - company_type
      - creation_type
      - enable
      condition: cust_id=:companyId AND cust_manager_id=:managerUserId
      description: 读授权状态
      evidence_refs:
      - ev-authorization-agreement-check
    evidence_refs:
    - ev-authorization-agreement-check
  - stage_id: auth-agreement-save
    name: 授权状态保存
    description: 保存/更新授权协议，按产品维度更新认证状态
    trigger: CustAuthAgreementDomainService
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: authorization_agreement
      fields:
      - id
      - cust_id
      - cust_manager_id
      - platform_product_code
      - authed_status
      - enable
      condition: cust_id=:companyId AND cust_manager_id=:managerUserId AND platform_product_code=:productCode
      description: 读指定产品授权
      evidence_refs:
      - ev-authorization-agreement-save
    - operation: upsert
      dataset: authorization_agreement
      fields:
      - cust_id
      - cust_manager_id
      - platform_product_code
      - authed_status
      - company_type
      - creation_type
      - enable
      condition: 保存/更新
      description: 保存授权协议
      evidence_refs:
      - ev-authorization-agreement-save
    evidence_refs:
    - ev-authorization-agreement-save
  datasets:
  - dataset_id: authorization_agreement
    name: authorization_agreement
    description: 企业产品授权书
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业id
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: cust_manager_id
      name: cust_manager_id
      data_type: bigint
      description: 企业管理员id（外部用户系统标识，非本库外键）
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品id（业务键，关联 platform_product.product_code）
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: authed_status
      name: authed_status
      data_type: varchar
      description: 授权书认证状态
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 企业角色
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: creation_type
      name: creation_type
      data_type: varchar
      description: 授权创建类型
      evidence_refs:
      - ev-authorization-agreement-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-authorization-agreement-schema
    evidence_refs:
    - ev-authorization-agreement-check
    - ev-authorization-agreement-save
    - ev-authorization-agreement-schema
  relationships: []
  metrics:
  - metric_id: metric-auth-agreement-count
    name: 授权协议数
    description: 企业产品授权书记录数
    aggregation: COUNT
    field:
      dataset: authorization_agreement
      field: id
    grain:
    - dataset: authorization_agreement
      field: id
    filters: []
    evidence_refs:
    - ev-authorization-agreement-check
  calibers:
  - caliber_id: cal-auth-agreement-authed
    label: 已授权协议
    description: authed_status=Y 的授权协议
    contract_fragment:
      predicate: authed_status = 'Y'
      scope: authed_status=Y 的授权协议
    field_targets:
    - dataset: authorization_agreement
      field: authed_status
    evidence_refs:
    - ev-authorization-agreement-check
  domain_rules:
  - rule_id: rule-auth-agreement-by-product
    label: 授权协议按产品认证
    content: 授权协议按平台产品维度保存，认证状态按产品独立判定。
    applicability: CustAuthAgreementDomainService
    query_impact: 查询企业授权状态时按平台产品过滤，不能只看企业维度。
    field_targets:
    - dataset: authorization_agreement
      field: platform_product_code
    evidence_refs:
    - ev-authorization-agreement-check
  verified_query_patterns:
  - pattern_id: pat-auth-agreement-by-company
    question: 查企业授权协议
    query: SELECT * FROM authorization_agreement WHERE cust_id=:custId AND enable='Y'
    intended_specification:
      caliber_id: cal-auth-agreement-authed
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-authorization-agreement-check
evidence_refs: []
unit_links: []
assumptions: []
conflicts: []
confidence: 0.7
