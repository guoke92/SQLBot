unit_id: tenant-product
revision: 1
title: 租户产品开通
aliases:
- 租户产品
- 产品开通
domain: product
applicability: 租户产品创建/开通/取消/按企业角色筛选适配产品的场景
description: 穿透 TenantProductApplication 与 TenantProductDomainService：租户创建产品（每租户每平台产品唯一）、开通/取消（校验关联项目/企业）、按企业角色过滤适配产品。
content:
  concepts:
  - concept_id: tenant-product
    name: 租户产品
    aliases:
    - 开通产品
    definition: 租户产品表 tenant_product，以主键 id 锚定。
    field_targets:
    - dataset: tenant_product
      field: id
    evidence_refs:
    - ev-tenant-product-schema
  - concept_id: tenant-product-open
    name: 产品已开通
    aliases:
    - 已开通产品
    definition: 租户产品 open_status=Y。
    dictionary:
      Y: 已开通
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-domain-active
  - concept_id: tenant-product-opening
    name: 产品开通中
    aliases:
    - 开通中产品
    definition: 租户产品 open_status=P（ACFLOW/ORDER 等多级回调产品）。
    dictionary:
      P: 开通中
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-active
  - concept_id: product-cust-role
    name: 产品适配企业角色
    aliases:
    - 产品角色适配
    definition: 平台产品与客户角色适配关系 platform_product_cust_role，以主键 id 锚定。
    field_targets:
    - dataset: platform_product_cust_role
      field: id
    evidence_refs:
    - ev-platform-product-cust-role-schema
  processes:
  - stage_id: tenant-product-create
    name: 创建租户产品
    description: 按租户+平台产品创建租户产品；已存在则直接返回。从平台产品复制产品字段并保存。
    trigger: TenantProductApplication.create / syncTenantProduct
    enter_conditions:
    - tenantId 与 platformProductId 非空
    exit_conditions:
    - tenant_product 已保存
    next_stages:
    - tenant-product-active
    data_effects:
    - operation: read
      dataset: platform_product
      fields:
      - id
      - product_code
      - name
      condition: id = :platformProductId 或 product_code = :platformProductCode
      description: 读平台产品基础信息
      evidence_refs:
      - ev-tenant-product-create
      - ev-tenant-product-domain-create
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - tenant_id
      - platform_product_code
      - platform_product_id
      condition: tenant_id = :tenantId AND platform_product_code = :platformProductCode
      description: 校验是否已存在租户产品
      evidence_refs:
      - ev-tenant-product-domain-create
    - operation: upsert
      dataset: tenant_product
      fields:
      - name
      - platform_product_id
      - tenant_id
      - open_status
      - platform_product_code
      - ref_tenant_product_tenant_setting_config
      - ref_tenant_product_project_code
      - db_tenant_code
      - enable
      condition: 不存在则插入，存在则更新
      description: 创建/更新租户产品
      evidence_refs:
      - ev-tenant-product-domain-create
    evidence_refs:
    - ev-tenant-product-create
  - stage_id: tenant-product-active
    name: 开通租户产品
    description: 开通产品：已开通直接返回；ACFLOW/ORDER 等多级回调产品先置 P，其余置 Y 并推送开通事件。
    trigger: TenantProductApplication.activeAndNotify
    enter_conditions:
    - tenant_product 存在
    exit_conditions:
    - open_status=Y 或 P
    next_stages:
    - tenant-product-query
    data_effects:
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - tenant_id
      - open_status
      - platform_product_code
      - platform_product_id
      condition: id = :id
      description: 读租户产品当前开通状态
      evidence_refs:
      - ev-tenant-product-active
    - operation: update
      dataset: tenant_product
      fields:
      - open_status
      condition: ACFLOW/ORDER 产品置 P，其他置 Y
      description: 更新产品开通状态
      evidence_refs:
      - ev-tenant-product-active
      - ev-tenant-product-domain-active
    evidence_refs:
    - ev-tenant-product-active
  - stage_id: tenant-product-cancel
    name: 取消开通租户产品
    description: 取消开通前校验是否已有关联项目/企业，有关联不允许取消；通过后 open_status 置 N。
    trigger: TenantProductApplication.cancel -> TenantProductDomainService.cancel
    enter_conditions:
    - tenant_product 存在
    exit_conditions:
    - open_status=N 或校验不通过
    next_stages: []
    data_effects:
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - tenant_id
      - platform_product_id
      - open_status
      condition: id = :id
      description: 读租户产品
      evidence_refs:
      - ev-tenant-product-domain-cancel
    - operation: update
      dataset: tenant_product
      fields:
      - open_status
      condition: 无关联项目/企业时
      description: 取消开通，open_status=N
      evidence_refs:
      - ev-tenant-product-domain-cancel
    evidence_refs:
    - ev-tenant-product-cancel
  - stage_id: tenant-product-query
    name: 按企业角色查询适配产品
    description: 查询租户全部产品，并按 platform_product_cust_role 过滤出指定企业角色可开通的产品。
    trigger: TenantProductApplication.allProductByTenantAndCustType
    enter_conditions:
    - tenantCode 非空
    - custCompanyType 非空
    exit_conditions:
    - 返回适配产品列表
    next_stages: []
    data_effects:
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - name
      - platform_product_id
      - tenant_id
      - open_status
      - platform_product_code
      - enable
      condition: tenant_id = :tenantId 或 db_tenant_code = :tenantCode
      description: 读租户全部产品
      evidence_refs:
      - ev-tenant-product-all-by-cust-type
    - operation: read
      dataset: platform_product
      fields:
      - id
      - product_code
      - name
      condition: 1=1
      description: 读平台产品名称映射
      evidence_refs:
      - ev-tenant-product-all-by-cust-type
    - operation: read
      dataset: platform_product_cust_role
      fields:
      - id
      - product_code
      - company_type_code
      - company_type_name
      - enable
      condition: company_type_code = :custCompanyType AND enable='Y'
      description: 按企业角色读产品适配关系并过滤
      evidence_refs:
      - ev-tenant-product-all-by-cust-type
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  datasets:
  - dataset_id: tenant_product
    name: tenant_product
    description: 租户产品
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: platform_product_id
      name: platform_product_id
      data_type: bigint
      description: 平台产品id
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      description: 租户id（租户隔离字段，非关联）
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: open_status
      name: open_status
      data_type: varchar
      description: 产品开通状态
      dictionary:
        Y: 已开通
        P: 开通中
        N: 未开通
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编号（冗余副本，derived_from platform_product.product_code）
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: ref_tenant_product_tenant_setting_config
      name: ref_tenant_product_tenant_setting_config
      data_type: varchar
      description: 租户-产品（关联 tenant_setting_config.code）
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: ref_tenant_product_project_code
      name: ref_tenant_product_project_code
      data_type: varchar
      description: 租户产品-平台产品（冗余副本，derived_from platform_product.code）
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-tenant-product-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-tenant-product-schema
    evidence_refs:
    - ev-tenant-product-active
    - ev-tenant-product-all-by-cust-type
    - ev-tenant-product-cancel
    - ev-tenant-product-create
    - ev-tenant-product-domain-active
    - ev-tenant-product-domain-cancel
    - ev-tenant-product-domain-create
    - ev-tenant-product-schema
  - dataset_id: platform_product_cust_role
    name: platform_product_cust_role
    description: 平台产品-企业角色适配
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-platform-product-cust-role-schema
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码
      evidence_refs:
      - ev-platform-product-cust-role-schema
    - field_id: company_type_code
      name: company_type_code
      data_type: varchar
      description: 企业角色编码
      evidence_refs:
      - ev-platform-product-cust-role-schema
    - field_id: company_type_name
      name: company_type_name
      data_type: varchar
      description: 企业角色名称
      evidence_refs:
      - ev-platform-product-cust-role-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-platform-product-cust-role-schema
    evidence_refs:
    - ev-platform-product-cust-role-schema
    - ev-tenant-product-active
    - ev-tenant-product-all-by-cust-type
    - ev-tenant-product-cancel
    - ev-tenant-product-create
  - dataset_id: platform_product
    name: platform_product
    description: 平台产品
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-platform-product-schema
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码
      evidence_refs:
      - ev-platform-product-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-platform-product-schema
    evidence_refs:
    - ev-platform-product-schema
    - ev-tenant-product-active
    - ev-tenant-product-all-by-cust-type
    - ev-tenant-product-cancel
    - ev-tenant-product-create
    - ev-tenant-product-domain-create
  relationships:
  - relationship_id: rel-tenant-product-platform-product
    left:
      dataset: tenant_product
      field: platform_product_id
    right:
      dataset: platform_product
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 租户产品通过 platform_product_id 关联平台产品
    status: proposed
    evidence_refs:
    - ev-tenant-product-domain-create
  - relationship_id: rel-tenant-product-cust-role-product
    left:
      dataset: platform_product_cust_role
      field: product_code
    right:
      dataset: platform_product
      field: product_code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 产品角色适配通过 product_code 关联平台产品
    status: proposed
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  metrics:
  - metric_id: metric-tenant-product-count
    name: 租户产品数
    description: 租户产品记录数。
    aggregation: COUNT
    field:
      dataset: tenant_product
      field: id
    grain:
    - dataset: tenant_product
      field: id
    filters: []
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  - metric_id: metric-tenant-product-open-count
    name: 已开通租户产品数
    description: open_status=Y 的租户产品数。
    aggregation: COUNT
    field:
      dataset: tenant_product
      field: id
    grain:
    - dataset: tenant_product
      field: id
    filters:
    - field: open_status
      op: '='
      value: Y
    evidence_refs:
    - ev-tenant-product-domain-active
  - metric_id: metric-product-cust-role-count
    name: 产品适配企业角色数
    description: 产品-企业角色适配记录数。
    aggregation: COUNT
    field:
      dataset: platform_product_cust_role
      field: id
    grain:
    - dataset: platform_product_cust_role
      field: id
    filters: []
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  calibers:
  - caliber_id: cal-tenant-product-open
    label: 已开通产品
    description: open_status=Y 的租户产品。
    contract_fragment:
      predicate: open_status = 'Y'
      scope: tenant_product 全局定义
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-domain-active
  - caliber_id: cal-tenant-product-opening
    label: 开通中产品
    description: open_status=P 的租户产品（ACFLOW/ORDER 等多级回调产品）。
    contract_fragment:
      predicate: open_status = 'P'
      scope: tenant_product 全局定义
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-active
  - caliber_id: cal-tenant-product-not-open
    label: 未开通产品
    description: open_status=N 的租户产品。
    contract_fragment:
      predicate: open_status = 'N'
      scope: tenant_product 全局定义
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-domain-cancel
  - caliber_id: cal-product-cust-role-scope
    label: 产品适配企业角色范围
    description: 按 company_type_code 过滤指定企业角色可开通的产品编码集合。
    contract_fragment:
      predicate: company_type_code = :custCompanyType AND enable = 'Y'
      scope: platform_product_cust_role
    field_targets:
    - dataset: platform_product_cust_role
      field: company_type_code
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  domain_rules:
  - rule_id: rule-tenant-product-unique
    label: 每租户每平台产品只保留一条
    content: 创建租户产品时按 tenantId + platformProductCode 查重，已存在直接返回，不允许重复开通。
    applicability: TenantProductDomainService.create
    query_impact: tenant_product 在 (tenant_id, platform_product_code) 维度唯一，查询无需去重。
    field_targets:
    - dataset: tenant_product
      field: tenant_id
    - dataset: tenant_product
      field: platform_product_code
    evidence_refs:
    - ev-tenant-product-domain-create
  - rule_id: rule-tenant-product-cancel-check
    label: 有关联项目或企业不允许取消开通
    content: 取消开通前检查是否有生效项目或已开通企业，存在任一关联则拒绝取消。
    applicability: TenantProductDomainService.checkOnTheWay
    query_impact: 查询可取消产品时需排除已关联项目/企业的产品；取消操作不是纯状态更新。
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-tenant-product-check-on-way
  - rule_id: rule-tenant-product-acflow-order-pending
    label: ACFLOW/ORDER 产品开通先置 P
    content: ACFLOW 或 ORDER 平台产品开通时先置 open_status=P，多级回调后置为成功；其他产品直接置 Y。
    applicability: TenantProductApplication.activeAndNotify
    query_impact: 查询开通中产品时，ACFLOW/ORDER 产品会在 P 状态停留，需按 open_status=P 识别。
    field_targets:
    - dataset: tenant_product
      field: open_status
    - dataset: tenant_product
      field: platform_product_code
    evidence_refs:
    - ev-tenant-product-active
  verified_query_patterns:
  - pattern_id: pat-tenant-product-open-by-tenant
    question: 按租户查已开通产品
    query: SELECT * FROM tenant_product WHERE tenant_id = :tenantId AND open_status = 'Y' AND enable = 'Y'
    intended_specification:
      caliber_id: cal-tenant-product-open
      metric_id: metric-tenant-product-open-count
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
  - pattern_id: pat-tenant-product-by-cust-type
    question: 按企业角色查可开通产品
    query: SELECT tp.* FROM tenant_product tp JOIN platform_product_cust_role pcr ON pcr.product_code = tp.platform_product_code
      WHERE tp.tenant_id = :tenantId AND pcr.company_type_code = :custCompanyType AND pcr.enable = 'Y'
    intended_specification:
      caliber_id: cal-product-cust-role-scope
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-product-all-by-cust-type
evidence_refs:
- ev-tenant-product-create
unit_links: []
assumptions:
- 平台产品主数据 platform_product 由 onboarding 单元权威声明，本单元最小声明 id/product_code/name
conflicts: []
confidence: 0.7
