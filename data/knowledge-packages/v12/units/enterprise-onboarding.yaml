  - rule_id: rule-onboarding-push-rollback
    label: 建档推送失败回滚 INIT
    content: 推送运营中台异常时，将 cust_build_status 回滚为 INIT。
    applicability: OperCustFacade.regSelfOld 异常处理分支
    query_impact: 统计在途/成功建档时需排除 INIT 状态，且要理解失败会回滚到 INIT。
    field_targets:
