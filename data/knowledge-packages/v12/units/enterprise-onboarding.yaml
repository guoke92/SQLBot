unit_id: enterprise-onboarding
revision: 1
title: 企业建档与客户项目关联
aliases:
- 建档
- 自主注册建档
- 客户项目关联
domain: customer
applicability: 企业主数据/联系人/建档记录/客户项目关系的自助建档与审核场景
description: 穿透 OperCustFacade.regSelfOld 入口：读取企业/联系人/租户项目配置，推送运营中台后写回审核状态、联系人平台用户ID与建档记录；覆盖在途锁、默认项目绑定、供应商项目关联状态规则。
content:
  concepts:
  - concept_id: build-success
    name: 建档成功
    aliases:
    - 认证成功
    - 有效已建档企业
    definition: 主数据建档状态为 BUILD_SUCCESS 且企业生效（cust_status=EFFECT）。
    dictionary:
      BUILD_SUCCESS: 认证成功
      EFFECT: 生效
    field_targets:
    - dataset: company
      field: build_status
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-cust-build-status-dict
    - ev-cust-status-dict
  - concept_id: audit-passed
    name: 审核通过
    aliases:
    - 建档审核通过
    definition: 建档审核流终态为 CUST_BUILD_SUCCESS（审核通过）。
    dictionary:
      CUST_BUILD_SUCCESS: 审核通过
    field_targets:
    - dataset: company
      field: build_status
    evidence_refs:
    - ev-cust-build-status-dict
  - concept_id: await-cust-confirm
    name: 待客户确认
    aliases:
    - 待客户认证
    definition: 建档状态为 CUST_CONFIRM_AWAIT，等待客户确认/补充资料。
    dictionary:
      CUST_CONFIRM_AWAIT: 待客户认证
    field_targets:
    - dataset: company
      field: build_status
    evidence_refs:
    - ev-cust-build-status-dict
  - concept_id: effective-company
    name: 有效企业
    aliases:
    - 企业
    definition: 企业主数据表 cust_company_info 的实体概念，以主键 id 锚定。
    field_targets:
    - dataset: company
      field: id
    evidence_refs:
    - ev-company-schema
  - concept_id: contact-person
    name: 企业联系人
    aliases:
    - 联系人
    definition: 企业联系人表 cust_person_info 的实体概念，以主键 id 锚定。
    field_targets:
    - dataset: person
      field: id
    evidence_refs:
    - ev-person-schema
  processes:
  - stage_id: onboarding-submit
    name: 自主注册建档提交
    description: OperCustFacade.regSelfOld 事务链路：锁+在途校验 → 组装企业/用户数据 → 读项目配置 → 推送运营中台 → 写回状态并保存建档记录。
    trigger: 管理端/运营端调用 OperCustFacade.regSelfOld(companyId, personId)
    enter_conditions:
    - companyId 对应企业存在
    - check_status 为空或 CUST_CHECK_REJECT
    exit_conditions:
    - check_status=CUST_CHECK_INIT
    - cust_build_record 已保存
    next_stages:
    - onboarding-audit
    data_effects:
    - operation: read
      dataset: company
      fields:
      - id
      - code
      - certification_no
      - db_tenant_code
      - enable
      - check_status
      - build_status
      - company_type
      - cust_source
      condition: id = companyId
      description: 两次读取企业主数据（锁前 + 锁后二次校验）
      evidence_refs:
      - ev-onboarding-regself
      - ev-onboarding-get-company
    - operation: read
      dataset: person
      fields:
      - id
      - name
      - ref_cust_company_info
      - enable
      - user_type
      condition: id = personId AND ref_cust_company_info = company.code AND enable='Y'
      description: 按企业编码 + 联系人 id 读取联系人
      evidence_refs:
      - ev-onboarding-get-person
    - operation: read
      dataset: cust_project_rel
      fields:
      - id
      - project_id
      - ref_cust_project_rel_cust_company_info
      condition: ref_cust_project_rel_cust_company_info = company.code
      description: 判断企业是否已有项目关联
      evidence_refs:
      - ev-onboarding-set-project
    - operation: read
      dataset: tenant_setting
      fields:
      - db_tenant_code
      - enable
      - default_project_id
      - band_name
      - cust_service_number
      condition: db_tenant_code = company.db_tenant_code AND enable='Y'
      description: 读租户设置取默认项目/贴牌/客服信息
      evidence_refs:
      - ev-onboarding-set-project
    - operation: read
      dataset: tenant_project
      fields:
      - id
      - name
      - platform_product_code
      - product_id
      condition: id = tenant_setting.default_project_id
      description: 读默认项目；已有项目关联时按 rel.project_id 读项目
      evidence_refs:
      - ev-onboarding-set-project
    - operation: read
      dataset: platform_product
      fields:
      - id
      - product_code
      - name
      condition: product_code = tenant_project.platform_product_code
      description: 按项目平台产品编码读产品名称
      evidence_refs:
      - ev-onboarding-set-project
    - operation: update
      dataset: person
      fields:
      - user_type
      condition: id = personId AND user_type != 'admin'
      description: 将联系人提升为管理员
      evidence_refs:
      - ev-onboarding-regself
    - operation: insert
      dataset: cust_project_rel
      fields:
      - project_id
      - product_id
      - company_type
      - status
      - show_flag
      - ref_cust_project_rel_cust_company_info
      - db_tenant_code
      condition: 无项目码且存在默认项目时自动绑定
      description: 保存客户-项目关系；项目 id 以字符串写入（long_to_string CAST）
      evidence_refs:
      - ev-onboarding-save-project-rel
    - operation: update
      dataset: company
      fields:
      - check_status
      condition: id = companyId
      description: 推送成功后 check_status 置为 CUST_CHECK_INIT
      evidence_refs:
      - ev-onboarding-regself
      - ev-onboarding-update-company
    - operation: update
      dataset: person
      fields:
      - platform_user_id
      condition: id = personId
      description: 回写运营系统用户 id
      evidence_refs:
      - ev-onboarding-update-user
    - operation: insert
      dataset: build_record
      fields:
      - cust_id
      - person_id
      - channel
      - return_data
      - db_tenant_code
      condition: 建档推送完成后
      description: 保存建档记录（cust_id/person_id 来自方法形参传播）
      evidence_refs:
      - ev-onboarding-build-record
    evidence_refs:
    - ev-onboarding-regself
  - stage_id: onboarding-audit
    name: 建档审核流转
    description: 运营中台审核回写：check_status 在 CUST_CHECK_INIT/CHECKING/PASS/REJECT 间流转，认证流与审核流分别落在 cust_build_status。
    trigger: 运营中台审核回调/审核结果同步
    enter_conditions:
    - check_status=CUST_CHECK_INIT
    exit_conditions:
    - check_status=CUST_CHECK_PASS 或 CUST_CHECK_REJECT
    next_stages: []
    data_effects:
    - operation: read
      dataset: company
      fields:
      - id
      - check_status
      - build_status
      condition: id = companyId
      description: 读当前企业审核/认证状态
      evidence_refs:
      - ev-onboarding-regself
    - operation: update
      dataset: company
      fields:
      - check_status
      - build_status
      condition: 按审核结果写入
      description: CUST_CHECK_INIT→CUST_CHECK_CHECKING→CUST_CHECK_PASS/REJECT；认证流 INIT/BUILDING/BUILD_SUCCESS/BUILD_FAIL 由推送结果更新
      evidence_refs:
      - ev-onboarding-regself
      - ev-check-status-dict
      - ev-cust-build-status-dict
    evidence_refs:
    - ev-onboarding-regself
  datasets:
  - dataset_id: company
    name: cust_company_info
    description: 企业主数据/过程记录，一行一家企业
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-company-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-company-schema
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 统一信用代码
      evidence_refs:
      - ev-company-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-company-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-company-schema
    - field_id: check_status
      name: check_status
      data_type: varchar
      description: 审核状态
      dictionary:
        CUST_CHECK_INIT: 待审核
        CUST_CHECK_CHECKING: 审核中
        CUST_CHECK_PASS: 审核通过
        CUST_CHECK_REJECT: 审核不通过
        CUST_CHECK_BACKTOCUSTOM: 待客户确认
        CUST_BACK: 退回
      evidence_refs:
      - ev-company-schema
      - ev-check-status-dict
    - field_id: build_status
      name: cust_build_status
      data_type: varchar
      description: 认证状态
      dictionary:
        INIT: 初始化
        TO_BE_BUILD: 未建档
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功
        BUILD_FAIL: 认证失败
        BUILD_BACK: 退回
        BUILD_ACTIVATE: 待激活
        CUST_CONFIRM_AWAIT: 待客户认证
        CUST_AUDIT_AWAIT: 待审核
        CUST_BUILDING: 审核中
        CUST_BUILD_SUCCESS: 审核通过
        CUST_BUILD_FAIL: 审核拒绝
        CUST_CHANGE: 变更
        AWAIT_CUST_CONFIRM: 待客户确认
      evidence_refs:
      - ev-company-schema
      - ev-cust-build-status-dict
    - field_id: cust_status
      name: cust_status
      data_type: varchar
      description: 客户状态
      dictionary:
        ADD: 新增
        EFFECT: 生效
        FAILURE: 失效
        WRITEOFF: 注销
        FREEZE: 冻结
        CHANGE: 变更
      evidence_refs:
      - ev-company-schema
      - ev-cust-status-dict
    - field_id: company_type
      name: cust_company_type
      data_type: varchar
      description: 企业角色
      dictionary: &id001
        CORE: 核心企业
        SUPPLIER: 供应商
        FINANCE: 金融机构
        PLATFORM_OPERATOR_COMPANY: 平台运营方
        DEALER: 经销商
        PROJECT_COMPANY: 项目公司
      evidence_refs:
      - ev-company-schema
      - ev-company-type-dict
    - field_id: cust_source
      name: cust_source
      data_type: varchar
      description: 建档数据来源
      dictionary:
        PLATFORM_PUSH: 运营中台推送
        MIGRATORY: 存量迁移企业
        PPLATFORM: 产融自建企业
      evidence_refs:
      - ev-company-schema
      - ev-cust-source-dict
    evidence_refs:
    - ev-check-status-dict
    - ev-company-schema
    - ev-cust-build-status-dict
    - ev-onboarding-get-company
    - ev-onboarding-regself
    - ev-onboarding-update-company
  - dataset_id: person
    name: cust_person_info
    description: 企业联系人/用户信息
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-person-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 姓名
      evidence_refs:
      - ev-person-schema
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业
      evidence_refs:
      - ev-person-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-person-schema
    - field_id: user_type
      name: user_type
      data_type: varchar
      description: 联系人类型
      dictionary:
        admin: 管理员
        operator: 经办人
        guest: 游客
      evidence_refs:
      - ev-person-schema
      - ev-user-type-dict
    - field_id: platform_user_id
      name: platform_user_id
      data_type: bigint
      description: 运营系统用户id（外部运营中台用户标识，非本库外键）
      evidence_refs:
      - ev-person-schema
    evidence_refs:
    - ev-onboarding-get-person
    - ev-onboarding-regself
    - ev-onboarding-update-user
    - ev-person-schema
  - dataset_id: build_record
    name: cust_build_record
    description: 建档推送运营中台记录
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-build-record-schema
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID
      evidence_refs:
      - ev-build-record-schema
    - field_id: person_id
      name: person_id
      data_type: bigint
      description: 联系人ID
      evidence_refs:
      - ev-build-record-schema
    - field_id: channel
      name: channel
      data_type: varchar
      description: 渠道
      evidence_refs:
      - ev-build-record-schema
    - field_id: return_data
      name: return_data
      data_type: varchar
      description: 返回data
      evidence_refs:
      - ev-build-record-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-build-record-schema
    evidence_refs:
    - ev-build-record-schema
    - ev-onboarding-build-record
    - ev-onboarding-regself
  - dataset_id: cust_project_rel
    name: cust_project_rel
    description: 客户-项目关系
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: project_id
      name: project_id
      data_type: varchar
      description: 项目id
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: product_id
      name: product_id
      data_type: varchar
      description: 产品（反规范化副本，derived_from tenant_project.product_id）
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 客户角色(只取一个)
      dictionary: *id001
      evidence_refs:
      - ev-cust-project-rel-schema
      - ev-company-type-dict
    - field_id: status
      name: status
      data_type: varchar
      description: 关联状态
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: show_flag
      name: show_flag
      data_type: varchar
      description: 展示标记
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: ref_cust_project_rel_cust_company_info
      name: ref_cust_project_rel_cust_company_info
      data_type: varchar
      description: 客户和项目关系
      evidence_refs:
      - ev-cust-project-rel-schema
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-cust-project-rel-schema
    evidence_refs:
    - ev-cust-project-rel-schema
    - ev-onboarding-regself
    - ev-onboarding-save-project-rel
    - ev-onboarding-set-project
  - dataset_id: tenant_project
    name: tenant_project
    description: 租户项目配置
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编码
      evidence_refs:
      - ev-tenant-project-schema
    - field_id: product_id
      name: product_id
      data_type: bigint
      description: 产品编码（真 FK：tenant_project.product_id -> tenant_product.id）
      evidence_refs:
      - ev-tenant-project-schema
    evidence_refs:
    - ev-onboarding-regself
    - ev-onboarding-set-project
    - ev-tenant-project-schema
  - dataset_id: platform_product
    name: platform_product
    description: 平台产品
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-platform-product-schema
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码
      evidence_refs:
      - ev-platform-product-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-platform-product-schema
    evidence_refs:
    - ev-onboarding-regself
    - ev-onboarding-set-project
    - ev-platform-product-schema
  - dataset_id: tenant_setting
    name: tenant_setting_config
    description: 租户设置
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 数据租户标识
      evidence_refs:
      - ev-tenant-setting-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-tenant-setting-schema
    - field_id: default_project_id
      name: default_project_id
      data_type: bigint
      description: 默认项目（FK：tenant_setting_config.default_project_id -> tenant_project.id）
      evidence_refs:
      - ev-tenant-setting-schema
    - field_id: band_name
      name: band_name
      data_type: varchar
      description: 贴牌平台名称
      evidence_refs:
      - ev-tenant-setting-schema
    - field_id: cust_service_number
      name: cust_service_number
      data_type: varchar
      description: 客服电话
      evidence_refs:
      - ev-tenant-setting-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-tenant-setting-schema
    evidence_refs:
    - ev-onboarding-regself
    - ev-onboarding-set-project
    - ev-tenant-setting-schema
  relationships:
  - relationship_id: rel-person-company-code
    left:
      dataset: person
      field: ref_cust_company_info
    right:
      dataset: company
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 联系人通过企业编码关联企业主数据
    status: proposed
    evidence_refs:
    - ev-onboarding-get-person
  - relationship_id: rel-project-rel-company-code
    left:
      dataset: cust_project_rel
      field: ref_cust_project_rel_cust_company_info
    right:
      dataset: company
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 客户-项目关系通过企业编码关联企业
    status: proposed
    evidence_refs:
    - ev-onboarding-set-project
    - ev-onboarding-save-project-rel
  - relationship_id: rel-project-rel-project
    left:
      dataset: cust_project_rel
      field: project_id
    right:
      dataset: tenant_project
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 客户项目关系关联租户项目；project_id 为 varchar，tenant_project.id 为 bigint，需 CAST(long_to_string)
    status: proposed
    evidence_refs:
    - ev-onboarding-save-project-rel
  - relationship_id: rel-tenant-project-platform-product
    left:
      dataset: tenant_project
      field: platform_product_code
    right:
      dataset: platform_product
      field: product_code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 租户项目通过平台产品编码关联平台产品
    status: proposed
    evidence_refs:
    - ev-onboarding-set-project
  - relationship_id: rel-build-record-company
    left:
      dataset: build_record
      field: cust_id
    right:
      dataset: company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 建档记录归属企业
    status: proposed
    evidence_refs:
    - ev-onboarding-build-record
  - relationship_id: rel-build-record-person
    left:
      dataset: build_record
      field: person_id
    right:
      dataset: person
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 建档记录归属联系人
    status: proposed
    evidence_refs:
    - ev-onboarding-build-record
  metrics:
  - metric_id: metric-build-company-count
    name: 建档企业数
    description: 按企业主数据计数；可按 caliber 拆分口径（创建/提交认证/审核通过/认证成功）。
    aggregation: COUNT
    field:
      dataset: company
      field: id
    grain:
    - dataset: company
      field: id
    filters: []
    evidence_refs:
    - ev-onboarding-regself
  - metric_id: metric-build-record-count
    name: 建档记录数
    description: 建档推送运营中台记录数。
    aggregation: COUNT
    field:
      dataset: build_record
      field: id
    grain:
    - dataset: build_record
      field: id
