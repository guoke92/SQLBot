unit_id: customer-group
revision: 1
title: 客户集团关系
aliases: []
domain: customer
applicability: 集团企业成员关系的创建、生效/拒绝与树查询场景
description: 穿透 CustGroupRelApplication：创建集团关系时计算 root/parent/level，查询集团成员关系。
content:
  concepts:
  - concept_id: cust-group-rel
    name: 集团关系
    aliases: []
    definition: 企业集团成员关系 cust_group_rel
    dictionary: {}
    field_targets:
    - dataset: cust_group_rel
      field: id
    evidence_refs:
    - ev-cust-group-rel-schema
  - concept_id: group-root
    name: 集团根企业
    aliases: []
    definition: root_flag=Y 的集团根企业关系
    dictionary:
      Y: 集团企业
    field_targets:
    - dataset: cust_group_rel
      field: root_flag
    evidence_refs:
    - ev-cust-group-rel-schema
  processes:
  - stage_id: group-rel-save
    name: 集团关系保存
    description: 新增集团成员关系，计算根企业/父企业/层级
    trigger: CustGroupRelApplication 新增
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - group-rel-query
    data_effects:
    - operation: read
      dataset: cust_group_rel
      fields:
      - id
      - cust_id
      - parent_cust_id
      - root_cust_id
      - root_flag
      - level
      - status
      condition: cust_id=:custId
      description: 查已有集团关系
      evidence_refs:
      - ev-cust-group-rel-save
    - operation: insert
      dataset: cust_group_rel
      fields:
      - cust_id
      - parent_cust_id
      - root_cust_id
      - root_flag
      - level
      - cust_type
      - status
      - enable
      condition: 新增集团关系
      description: 保存集团关系
      evidence_refs:
      - ev-cust-group-rel-save
    evidence_refs:
    - ev-cust-group-rel-save
  - stage_id: group-rel-query
    name: 集团关系查询
    description: 按根企业/父企业查询集团成员关系
    trigger: CustGroupRelApplication 查询
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: cust_group_rel
      fields:
      - id
      - cust_id
      - parent_cust_id
      - root_cust_id
      - root_flag
      - level
      - cust_type
      - status
      - enable
      condition: root_cust_id=:rootCustId OR parent_cust_id=:custId
      description: 读集团关系
      evidence_refs:
      - ev-cust-group-rel-query
    evidence_refs:
    - ev-cust-group-rel-query
  datasets:
  - dataset_id: cust_group_rel
    name: cust_group_rel
    description: 企业集团关系
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业id
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: parent_cust_id
      name: parent_cust_id
      data_type: bigint
      description: 父企业id（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: root_cust_id
      name: root_cust_id
      data_type: bigint
      description: 根企业id（FK：-> cust_company_info.id）
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: root_flag
      name: root_flag
      data_type: varchar
      description: 是否集团企业
      dictionary:
        Y: 是
        N: 不是
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: level
      name: level
      data_type: int
      description: 层级
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: cust_type
      name: cust_type
      data_type: varchar
      description: 企业角色
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: status
      name: status
      data_type: varchar
      description: 状态
      dictionary:
        EFFECTIVE: 已生效
        INEFFECTIVE: 未生效
        REJECTED: 已拒绝
      evidence_refs:
      - ev-cust-group-rel-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-group-rel-schema
    evidence_refs:
    - ev-cust-group-rel-query
    - ev-cust-group-rel-save
    - ev-cust-group-rel-schema
  relationships: []
  metrics:
  - metric_id: metric-cust-group-rel-count
    name: 集团关系数
    description: 企业集团成员关系数
    aggregation: COUNT
    field:
      dataset: cust_group_rel
      field: id
    grain:
    - dataset: cust_group_rel
      field: id
    filters: []
    evidence_refs:
    - ev-cust-group-rel-query
  calibers:
  - caliber_id: cal-cust-group-effective
    label: 生效集团关系
    description: status=EFFECTIVE 的集团成员关系
    contract_fragment:
      predicate: status = 'EFFECTIVE'
      scope: status=EFFECTIVE 的集团成员关系
    field_targets:
    - dataset: cust_group_rel
      field: status
    evidence_refs:
    - ev-cust-group-rel-save
  - caliber_id: cal-cust-group-root
    label: 集团根企业
    description: root_flag=Y 的集团关系
    contract_fragment:
      predicate: root_flag = 'Y'
      scope: root_flag=Y 的集团关系
    field_targets:
    - dataset: cust_group_rel
      field: root_flag
    evidence_refs:
    - ev-cust-group-rel-schema
  domain_rules:
  - rule_id: rule-cust-group-root-calc
    label: 集团关系保存时计算根企业
    content: 保存集团关系时按父企业链路计算 root_cust_id 和 level；root_flag=Y 表示集团企业。
    applicability: CustGroupRelApplication 新增
    query_impact: 查询集团成员时以 root_cust_id 聚合。
    field_targets:
    - dataset: cust_group_rel
      field: root_cust_id
    - dataset: cust_group_rel
      field: root_flag
    evidence_refs:
    - ev-cust-group-rel-save
  verified_query_patterns:
  - pattern_id: pat-cust-group-by-root
    question: 查集团成员
    query: SELECT * FROM cust_group_rel WHERE root_cust_id=:rootCustId AND enable='Y'
    intended_specification:
      caliber_id: cal-cust-group-effective
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cust-group-rel-query
evidence_refs: []
unit_links: []
assumptions: []
conflicts: []
confidence: 0.7
