unit_id: tenant-interworking
revision: 1
title: 租户互通产品与项目
aliases: []
domain: product
applicability: 租户互通产品创建/开通/取消、互通产品关联项目场景
description: 穿透 TenantInterworkingProductController 与 TenantInterworkingProductApplication、TenantInterworkingProjectApplicationService。
content:
  concepts:
  - concept_id: tenant-interworking-product
    name: 租户互通产品
    aliases: []
    definition: 租户互通产品 tenant_interworking_product
    dictionary: {}
    field_targets:
    - dataset: tenant_interworking_product
      field: id
    evidence_refs:
    - ev-tenant-interworking-product-schema
  - concept_id: tenant-interworking-project
    name: 互通产品项目
    aliases: []
    definition: 互通产品关联项目 tenant_interworking_project
    dictionary: {}
    field_targets:
    - dataset: tenant_interworking_project
      field: id
    evidence_refs:
    - ev-tenant-interworking-project-schema
  processes:
  - stage_id: inter-product-create
    name: 互通产品创建/开通
    description: 租户创建并开通互通产品
    trigger: TenantInterworkingProductApplication.create/active
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - inter-project-rel
    data_effects:
    - operation: read
      dataset: tenant_interworking_product
      fields:
      - id
      - name
      - platform_product_id
      - tenant_id
      - open_status
      - platform_product_code
      - ref_tenant_interworking_product_tenant_setting_config
      - enable
      condition: tenant_id=:tenantId AND platform_product_id=:platformProductId
      description: 查重
      evidence_refs:
      - ev-tenant-interworking-product-create
    - operation: upsert
      dataset: tenant_interworking_product
      fields:
      - name
      - platform_product_id
      - tenant_id
      - open_status
      - platform_product_code
      - ref_tenant_interworking_product_tenant_setting_config
      - enable
      condition: 创建/开通互通产品
      description: 保存互通产品
      evidence_refs:
      - ev-tenant-interworking-product-create
      - ev-tenant-interworking-product-active
    evidence_refs:
    - ev-tenant-interworking-product-create
  - stage_id: inter-project-rel
    name: 互通产品关联项目
    description: 保存/查询互通产品关联的项目
    trigger: TenantInterworkingProjectApplicationService.relTenantProject
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: tenant_interworking_project
      fields:
      - id
      - product_id
      - tenant_id
      - platform_product_code
      - project_id
      - ref_tenant_interworking_project_tenant_interworking_product
      - enable
      condition: product_id=:productId
      description: 读关联项目
      evidence_refs:
      - ev-tenant-interworking-project-query
    - operation: upsert
      dataset: tenant_interworking_project
      fields:
      - product_id
      - tenant_id
      - platform_product_code
      - project_id
      - ref_tenant_interworking_project_tenant_interworking_product
      - enable
      condition: 保存关联项目
      description: 保存互通产品项目关系
      evidence_refs:
      - ev-tenant-interworking-project-rel
    evidence_refs:
    - ev-tenant-interworking-project-rel
  datasets:
  - dataset_id: tenant_interworking_product
    name: tenant_interworking_product
    description: 租户互通产品
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: platform_product_id
      name: platform_product_id
      data_type: bigint
      description: 平台产品id
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      description: 租户id（租户隔离字段，非关联）
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: open_status
      name: open_status
      data_type: varchar
      description: 产品开通状态
      dictionary:
        Y: 已开通
        P: 开通中
        N: 未开通
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编号（冗余副本，derived_from platform_product.product_code）
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: ref_tenant_interworking_product_tenant_setting_config
      name: ref_tenant_interworking_product_tenant_setting_config
      data_type: varchar
      description: 关联租户（FK：-> tenant_setting_config.code）
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-tenant-interworking-product-schema
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
      evidence_refs:
      - ev-tenant-interworking-product-schema
    evidence_refs:
    - ev-tenant-interworking-product-active
    - ev-tenant-interworking-product-create
    - ev-tenant-interworking-product-schema
    - ev-tenant-interworking-project-rel
  - dataset_id: tenant_interworking_project
    name: tenant_interworking_project
    description: 互通产品项目
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: product_id
      name: product_id
      data_type: bigint
      description: 产品id
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      description: 租户id（租户隔离字段，非关联）
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编码（冗余副本，derived_from tenant_interworking_product.platform_product_code）
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: project_id
      name: project_id
      data_type: bigint
      description: 项目id（FK：-> tenant_project.id）
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: ref_tenant_interworking_project_tenant_interworking_product
      name: ref_tenant_interworking_project_tenant_interworking_product
      data_type: varchar
      description: 租户产品项目（FK：-> tenant_interworking_product.code）
      evidence_refs:
      - ev-tenant-interworking-project-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-tenant-interworking-project-schema
    evidence_refs:
    - ev-tenant-interworking-product-create
    - ev-tenant-interworking-project-query
    - ev-tenant-interworking-project-rel
    - ev-tenant-interworking-project-schema
  relationships: []
  metrics:
  - metric_id: metric-tenant-inter-product-count
    name: 互通产品数
    description: 租户互通产品数
    aggregation: COUNT
    field:
      dataset: tenant_interworking_product
      field: id
    grain:
    - dataset: tenant_interworking_product
      field: id
    filters: []
    evidence_refs:
    - ev-tenant-interworking-product-create
  - metric_id: metric-tenant-inter-project-count
    name: 互通产品项目数
    description: 互通产品关联项目数
    aggregation: COUNT
    field:
      dataset: tenant_interworking_project
      field: id
    grain:
    - dataset: tenant_interworking_project
      field: id
    filters: []
    evidence_refs:
    - ev-tenant-interworking-project-rel
  calibers:
  - caliber_id: cal-tenant-inter-product-open
    label: 已开通互通产品
    description: open_status=Y 的租户互通产品
    contract_fragment:
      predicate: open_status = 'Y'
      scope: open_status=Y 的租户互通产品
    field_targets:
    - dataset: tenant_interworking_product
      field: open_status
    evidence_refs:
    - ev-tenant-interworking-product-active
  - caliber_id: cal-tenant-inter-project-by-product
    label: 互通产品项目范围
    description: 按 product_id 查询互通产品关联项目
    contract_fragment:
      predicate: product_id = :productId
      scope: 按 product_id 查询互通产品关联项目
    field_targets:
    - dataset: tenant_interworking_project
      field: product_id
    evidence_refs:
    - ev-tenant-interworking-project-query
  domain_rules:
  - rule_id: rule-tenant-inter-product-unique
    label: 互通产品每租户每平台产品唯一
    content: 创建互通产品时按 tenantId + platformProductId 查重，已存在直接返回。
    applicability: TenantInterworkingProductApplication.create
    query_impact: 查询租户互通产品时同一平台产品最多一条。
    field_targets:
    - dataset: tenant_interworking_product
      field: tenant_id
    - dataset: tenant_interworking_product
      field: platform_product_id
    evidence_refs:
    - ev-tenant-interworking-product-create
  - rule_id: rule-tenant-inter-project-rel
    label: 互通产品项目关系按产品维护
    content: 保存互通产品项目关系时先按产品清理旧关系再写入新关系。
    applicability: TenantInterworkingProjectApplicationService.relTenantProject
    query_impact: 查询互通产品项目时以产品维度聚合。
    field_targets:
    - dataset: tenant_interworking_project
      field: product_id
    evidence_refs:
    - ev-tenant-interworking-project-rel
  verified_query_patterns:
  - pattern_id: pat-tenant-inter-product-open
    question: 查已开通互通产品
    query: SELECT * FROM tenant_interworking_product WHERE tenant_id=:tenantId AND open_status='Y' AND enable='Y'
    intended_specification:
      caliber_id: cal-tenant-inter-product-open
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-interworking-product-create
  - pattern_id: pat-tenant-inter-project-by-product
    question: 查互通产品项目
    query: SELECT * FROM tenant_interworking_project WHERE product_id=:productId AND enable='Y'
    intended_specification:
      caliber_id: cal-tenant-inter-project-by-product
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-interworking-project-query
evidence_refs: []
unit_links: []
assumptions: []
conflicts: []
confidence: 0.7
