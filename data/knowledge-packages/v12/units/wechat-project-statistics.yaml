unit_id: wechat-project-statistics
revision: 1
title: 微信项目审批与统计
aliases: []
domain: project
applicability: 微信项目立项审批数据导入/更新、字段变更历史、微企链运营关系、运营人员查询场景
description: 穿透 WechatProjectApprovalApplication 导入/更新，ProjectStatisticsApplication 查询字段历史，ProjectReportController 查询微企链运营关系与运营人员。
content:
  concepts:
  - concept_id: wechat-project-approval-apply
    name: 微信项目立项审批
    aliases: []
    definition: 微信项目立项审批数据 wechat_project_approval_apply
    dictionary: {}
    field_targets:
    - dataset: wechat_project_approval_apply
      field: id
    evidence_refs:
    - ev-wechat-approval-apply-schema
  - concept_id: wechat-project-approval-history
    name: 立项审批字段历史
    aliases: []
    definition: 立项审批字段变更历史 wechat_project_approval_field_history
    dictionary: {}
    field_targets:
    - dataset: wechat_project_approval_field_history
      field: id
    evidence_refs:
    - ev-wechat-approval-history-schema
  - concept_id: wec-project-operation
    name: 微企链项目运营关系
    aliases: []
    definition: 微企链项目运营关系 wec_project_operation_rel
    dictionary: {}
    field_targets:
    - dataset: wec_project_operation_rel
      field: id
    evidence_refs:
    - ev-wec-project-operation-rel-schema
  - concept_id: wec-project-cust-operation
    name: 微企链客户运营关系
    aliases: []
    definition: 微企链客户运营关系 wec_project_cust_operation_rel
    dictionary: {}
    field_targets:
    - dataset: wec_project_cust_operation_rel
      field: id
    evidence_refs:
    - ev-wec-project-cust-operation-rel-schema
  - concept_id: operation-user
    name: 运营人员
    aliases: []
    definition: 运营人员 operation_user
    dictionary: {}
    field_targets:
    - dataset: operation_user
      field: id
    evidence_refs:
    - ev-operation-user-schema
  processes:
  - stage_id: wechat-approval-import
    name: 微信立项审批导入/更新
    description: 导入微信项目立项审批数据，更新分组与方案经理
    trigger: WechatProjectApprovalApplication.importWechatApprovalInfo
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - history-query
    data_effects:
    - operation: read
      dataset: wechat_project_approval_apply
      fields:
      - id
      - sp_no
      - sp_type
      - project_approval_name
      - sp_pass_time
      - solution_manager
      - bussiness_manager
      - project_id
      - data_source
      - enable
      condition: sp_no=:spNo
      description: 查重
      evidence_refs:
      - ev-wechat-approval-import
    - operation: upsert
      dataset: wechat_project_approval_apply
      fields:
      - sp_no
      - sp_type
      - project_approval_name
      - sp_pass_time
      - solution_manager
      - bussiness_manager
      - project_id
      - data_source
      - enable
      condition: 导入/更新
      description: 保存微信立项审批数据
      evidence_refs:
      - ev-wechat-approval-import
      - ev-wechat-approval-update-group
    evidence_refs:
    - ev-wechat-approval-import
  - stage_id: history-query
    name: 字段变更历史查询
    description: 按 applyId/spNo 查询方案经理等字段变更历史
    trigger: ProjectStatisticsApplication 查询
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - wec-operation-query
    data_effects:
    - operation: read
      dataset: wechat_project_approval_field_history
      fields:
      - id
      - apply_id
      - sp_no
      - field_name
      - field_label
      - old_value
      - new_value
      - change_source
      - enable
      condition: apply_id=:applyId AND field_name=:fieldName
      description: 读字段历史
      evidence_refs:
      - ev-wechat-approval-history
    evidence_refs:
    - ev-wechat-approval-history
  - stage_id: wec-operation-query
    name: 微企链运营关系查询
    description: 按项目查询微企链项目/客户运营关系及运营人员
    trigger: ProjectReportController
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: wec_project_operation_rel
      fields:
      - id
      - wec_project_id
      - wechat_audit_no
      - solution_manager
      - business_manager
      - first_settlement_time
      - enable
      condition: wec_project_id=:wecProjectId
      description: 读项目运营关系
      evidence_refs:
      - ev-wec-operation-rel-query
    - operation: read
      dataset: wec_project_cust_operation_rel
      fields:
      - id
      - wec_rel_id
      - company_id
      - company_type
      - project_id
      - top_flag
      - enable
      condition: project_id=:wecProjectId
      description: 读客户运营关系
      evidence_refs:
      - ev-wec-cust-operation-rel-query
    - operation: read
      dataset: operation_user
      fields:
      - id
      - operation_id
      - operation_name
      - operation_group
      - status
      - deleted
      - enable
      condition: operation_id=:operationId
      description: 读运营人员
      evidence_refs:
      - ev-operation-user-query
    evidence_refs:
    - ev-wec-operation-rel-query
  datasets:
  - dataset_id: wechat_project_approval_apply
    name: wechat_project_approval_apply
    description: 微信项目立项审批数据
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      description: 企微审批编号
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: sp_type
      name: sp_type
      data_type: varchar
      description: 类型
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: project_approval_name
      name: project_approval_name
      data_type: varchar
      description: 立项名称
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: sp_pass_time
      name: sp_pass_time
      data_type: datetime
      description: 立项审批通过时间
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: solution_manager
      name: solution_manager
      data_type: varchar
      description: 方案经理
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: bussiness_manager
      name: bussiness_manager
      data_type: varchar
      description: 业务经理
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: project_id
      name: project_id
      data_type: bigint
      description: 关联的项目id（FK：-> tenant_project.id）
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: data_source
      name: data_source
      data_type: varchar
      description: 数据来源
      evidence_refs:
      - ev-wechat-approval-apply-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-wechat-approval-apply-schema
    evidence_refs:
    - ev-wec-operation-rel-query
    - ev-wechat-approval-apply-schema
    - ev-wechat-approval-history
    - ev-wechat-approval-import
    - ev-wechat-approval-update-group
  - dataset_id: wechat_project_approval_field_history
    name: wechat_project_approval_field_history
    description: 微信项目立项审批字段历史
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: apply_id
      name: apply_id
      data_type: bigint
      description: 关联 wechat_project_approval_apply.id
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      description: 审批编号
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: field_name
      name: field_name
      data_type: varchar
      description: 列名
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: field_label
      name: field_label
      data_type: varchar
      description: 中文标签
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: old_value
      name: old_value
      data_type: varchar
      description: 变更前值
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: new_value
      name: new_value
      data_type: varchar
      description: 变更后值
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: change_source
      name: change_source
      data_type: varchar
      description: 变更来源
      evidence_refs:
      - ev-wechat-approval-history-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-wechat-approval-history-schema
    evidence_refs:
    - ev-wec-operation-rel-query
    - ev-wechat-approval-history
    - ev-wechat-approval-history-schema
    - ev-wechat-approval-import
  - dataset_id: wec_project_operation_rel
    name: wec_project_operation_rel
    description: 微企链项目运营关系
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: wec_project_id
      name: wec_project_id
      data_type: varchar
      description: 微企链项目id（外部微企链系统标识，非本库外键）
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: wechat_audit_no
      name: wechat_audit_no
      data_type: varchar
      description: 企微审批编号
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: solution_manager
      name: solution_manager
      data_type: varchar
      description: 方案经理
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: business_manager
      name: business_manager
      data_type: varchar
      description: 业务经理
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: first_settlement_time
      name: first_settlement_time
      data_type: datetime
      description: 首笔落地时间
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-wec-project-operation-rel-schema
    evidence_refs:
    - ev-wec-operation-rel-query
    - ev-wec-project-operation-rel-schema
    - ev-wechat-approval-history
    - ev-wechat-approval-import
  - dataset_id: wec_project_cust_operation_rel
    name: wec_project_cust_operation_rel
    description: 微企链客户运营关系
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: wec_rel_id
      name: wec_rel_id
      data_type: varchar
      description: 微企链关联关系id（外部微企链系统标识，非本库外键）
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: company_id
      name: company_id
      data_type: varchar
      description: 微企链企业id（外部微企链系统标识，非本库外键）
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 微企链企业角色
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: project_id
      name: project_id
      data_type: varchar
      description: 微企链项目id（外部微企链系统标识，非本库外键）
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: top_flag
      name: top_flag
      data_type: varchar
      description: 置顶标识
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-wec-project-cust-operation-rel-schema
    evidence_refs:
    - ev-wec-cust-operation-rel-query
    - ev-wec-operation-rel-query
    - ev-wec-project-cust-operation-rel-schema
    - ev-wechat-approval-history
    - ev-wechat-approval-import
  - dataset_id: operation_user
    name: operation_user
    description: 运营人员
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-operation-user-schema
    - field_id: operation_id
      name: operation_id
      data_type: varchar
      description: 运营中台id（外部运营中台业务标识，非本库外键）
      evidence_refs:
      - ev-operation-user-schema
    - field_id: operation_name
      name: operation_name
      data_type: varchar
      description: 运营人员姓名
      evidence_refs:
      - ev-operation-user-schema
    - field_id: operation_group
      name: operation_group
      data_type: varchar
      description: 运营组别
      evidence_refs:
      - ev-operation-user-schema
    - field_id: status
      name: status
      data_type: varchar
      description: 用户状态标识
      evidence_refs:
      - ev-operation-user-schema
    - field_id: deleted
      name: deleted
      data_type: varchar
      description: 删除标识
      evidence_refs:
      - ev-operation-user-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-operation-user-schema
    evidence_refs:
    - ev-operation-user-query
    - ev-operation-user-schema
    - ev-wec-operation-rel-query
    - ev-wechat-approval-history
    - ev-wechat-approval-import
  relationships: []
  metrics:
  - metric_id: metric-wechat-approval-count
    name: 微信立项审批数
    description: 微信项目立项审批记录数
    aggregation: COUNT
    field:
      dataset: wechat_project_approval_apply
      field: id
    grain:
    - dataset: wechat_project_approval_apply
      field: id
    filters: []
    evidence_refs:
    - ev-wechat-approval-import
  - metric_id: metric-wechat-history-count
    name: 字段历史数
    description: 立项审批字段变更历史数
    aggregation: COUNT
    field:
      dataset: wechat_project_approval_field_history
      field: id
    grain:
    - dataset: wechat_project_approval_field_history
      field: id
    filters: []
    evidence_refs:
    - ev-wechat-approval-history
  - metric_id: metric-operation-user-count
    name: 运营人员数
    description: 运营人员记录数
    aggregation: COUNT
    field:
      dataset: operation_user
      field: id
    grain:
    - dataset: operation_user
      field: id
    filters: []
    evidence_refs:
    - ev-operation-user-query
  calibers:
  - caliber_id: cal-wechat-approval-by-sp
    label: 微信立项审批范围
    description: 按 sp_no 定位微信立项审批
    contract_fragment:
      predicate: sp_no = :spNo
      scope: 按 sp_no 定位微信立项审批
    field_targets:
    - dataset: wechat_project_approval_apply
      field: sp_no
    evidence_refs:
    - ev-wechat-approval-import
  - caliber_id: cal-history-by-apply
    label: 立项审批字段历史范围
    description: 按 apply_id 查询字段变更历史
    contract_fragment:
      predicate: apply_id = :applyId
      scope: 按 apply_id 查询字段变更历史
    field_targets:
    - dataset: wechat_project_approval_field_history
      field: apply_id
    evidence_refs:
    - ev-wechat-approval-history
  - caliber_id: cal-operation-user-active
    label: 有效运营人员
    description: deleted != 'Y' 且 enable='Y' 的运营人员
    contract_fragment:
      predicate: deleted <> 'Y' AND enable = 'Y'
      scope: deleted != 'Y' 且 enable='Y' 的运营人员
    field_targets:
    - dataset: operation_user
      field: deleted
    - dataset: operation_user
      field: enable
    evidence_refs:
    - ev-operation-user-query
  domain_rules:
  - rule_id: rule-wechat-approval-upsert
    label: 微信立项审批按 sp_no upsert
    content: 微信项目立项审批导入按 sp_no 查重，存在则更新分组/方案经理/统计字段。
    applicability: WechatProjectApprovalApplication.importWechatApprovalInfo
    query_impact: 查询立项审批时 sp_no 唯一。
    field_targets:
    - dataset: wechat_project_approval_apply
      field: sp_no
    evidence_refs:
    - ev-wechat-approval-import
  - rule_id: rule-history-field-source
    label: 字段历史记录变更来源
    content: 字段变更历史由 FieldHistoryWriter 按列写入 change_source 与新旧值。
    applicability: ProjectStatisticsApplication
    query_impact: 查询字段历史时按 apply_id+field_name 过滤，old/new 成对出现。
    field_targets:
    - dataset: wechat_project_approval_field_history
      field: field_name
    - dataset: wechat_project_approval_field_history
      field: change_source
    evidence_refs:
    - ev-wechat-approval-history
  - rule_id: rule-wec-cust-top
    label: 微企链客户运营置顶
    content: 微企链客户运营关系按 project_id 查询，top_flag=1 为置顶企业。
    applicability: ProjectReportController
    query_impact: 查询项目客户运营关系时可用 top_flag 排序。
    field_targets:
    - dataset: wec_project_cust_operation_rel
      field: top_flag
    evidence_refs:
    - ev-wec-cust-operation-rel-query
  verified_query_patterns:
  - pattern_id: pat-wechat-approval-by-sp
    question: 查微信立项审批
    query: SELECT * FROM wechat_project_approval_apply WHERE sp_no=:spNo AND enable='Y'
    intended_specification:
      caliber_id: cal-wechat-approval-by-sp
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-wechat-approval-import
  - pattern_id: pat-wechat-history-by-apply
    question: 查立项审批字段历史
    query: SELECT * FROM wechat_project_approval_field_history WHERE apply_id=:applyId ORDER BY create_time DESC
    intended_specification:
      caliber_id: cal-history-by-apply
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-wechat-approval-history
evidence_refs: []
unit_links: []
assumptions:
- 微企链为外部数据源，wec_* 关系表为本地同步副本
conflicts: []
confidence: 0.7
