unit_id: customer-company-extra
revision: 1
title: 企业补充信息
aliases: []
domain: customer
applicability: 总公司信息、股东/关联方信息、企业冻结/解冻生命周期记录场景
description: 穿透 PlatFormMigratoryApplication 保存总公司，ApplyCompanyInfoApplication 维护股东，CustCompanyInfoApplication 写生命周期记录。
content:
  concepts:
  - concept_id: cust-head-company
    name: 总公司信息
    aliases: []
    definition: 企业总公司信息 cust_head_company_info
    dictionary: {}
    field_targets:
    - dataset: cust_head_company_info
      field: id
    evidence_refs:
    - ev-cust-head-company-schema
  - concept_id: cust-shareholder
    name: 股东信息
    aliases: []
    definition: 企业股东/关联方信息 cust_shareholder_info
    dictionary: {}
    field_targets:
    - dataset: cust_shareholder_info
      field: id
    evidence_refs:
    - ev-cust-shareholder-schema
  - concept_id: cust-lifecycle
    name: 企业生命周期
    aliases: []
    definition: 企业冻结/解冻生命周期 cust_company_lifecycle_info
    dictionary: {}
    field_targets:
    - dataset: cust_company_lifecycle_info
      field: id
    evidence_refs:
    - ev-cust-lifecycle-schema
  processes:
  - stage_id: head-company-save
    name: 总公司信息保存
    description: 保存/更新企业总公司信息
    trigger: PlatFormMigratoryApplication.setHeadCompany
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - shareholder-save
    data_effects:
    - operation: read
      dataset: cust_head_company_info
      fields:
      - id
      - name
      - certification_no
      - legal_name
      - ref_cust_head_company_info_cust_company_info
      - enable
      condition: certification_no=:certificationNo
      description: 查总公司
      evidence_refs:
      - ev-cust-head-company-save
    - operation: upsert
      dataset: cust_head_company_info
      fields:
      - name
      - certification_no
      - legal_name
      - ref_cust_head_company_info_cust_company_info
      - enable
      condition: 不存在则新增
      description: 保存总公司信息
      evidence_refs:
      - ev-cust-head-company-save
    evidence_refs:
    - ev-cust-head-company-save
  - stage_id: shareholder-save
    name: 股东信息维护
    description: 按企业查询并复制股东/关联方信息
    trigger: ApplyCompanyInfoApplication
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - lifecycle-write
    data_effects:
    - operation: read
      dataset: cust_shareholder_info
      fields:
      - id
      - name
      - ref_cust_company_info
      - certification_type
      - certification_no
      - fund_scale
      - relation_type
      - enable
      condition: ref_cust_company_info=:companyCode
      description: 读股东信息
      evidence_refs:
      - ev-cust-shareholder-save
    - operation: upsert
      dataset: cust_shareholder_info
      fields:
      - name
      - ref_cust_company_info
      - certification_type
      - certification_no
      - fund_scale
      - relation_type
      - enable
      condition: 复制/保存股东信息
      description: 维护股东信息
      evidence_refs:
      - ev-cust-shareholder-save
    evidence_refs:
    - ev-cust-shareholder-save
  - stage_id: lifecycle-write
    name: 生命周期记录写入
    description: 企业冻结/解冻时写入生命周期记录
    trigger: CustCompanyInfoApplication 冻结/解冻
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: cust_company_lifecycle_info
      fields:
      - id
      - company_id
      - type
      - reason
      - attach
      - enable
      condition: company_id=:companyId AND type=:type
      description: 查生命周期记录
      evidence_refs:
      - ev-cust-lifecycle-write
    - operation: upsert
      dataset: cust_company_lifecycle_info
      fields:
      - company_id
      - type
      - reason
      - attach
      - enable
      condition: 冻结/解冻时写入
      description: 保存生命周期记录
      evidence_refs:
      - ev-cust-lifecycle-write
    evidence_refs:
    - ev-cust-lifecycle-write
  datasets:
  - dataset_id: cust_head_company_info
    name: cust_head_company_info
    description: 企业总公司信息
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-head-company-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 企业名称
      evidence_refs:
      - ev-cust-head-company-schema
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 统一社会信用代码
      evidence_refs:
      - ev-cust-head-company-schema
    - field_id: legal_name
      name: legal_name
      data_type: varchar
      description: 法人姓名
      evidence_refs:
      - ev-cust-head-company-schema
    - field_id: ref_cust_head_company_info_cust_company_info
      name: ref_cust_head_company_info_cust_company_info
      data_type: varchar
      description: 客户信息和总公司信息
      evidence_refs:
      - ev-cust-head-company-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-head-company-schema
    evidence_refs:
    - ev-cust-head-company-save
    - ev-cust-head-company-schema
    - ev-cust-lifecycle-write
    - ev-cust-shareholder-save
  - dataset_id: cust_shareholder_info
    name: cust_shareholder_info
    description: 企业股东/关联方信息
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: name
      name: name
      data_type: varchar
      description: 关联方名称
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 客户股东信息
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: certification_type
      name: certification_type
      data_type: varchar
      description: 证件类型
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 证件号码
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: fund_scale
      name: fund_scale
      data_type: varchar
      description: 出资比例（%）
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: relation_type
      name: relation_type
      data_type: varchar
      description: 关联方类型
      evidence_refs:
      - ev-cust-shareholder-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-shareholder-schema
    evidence_refs:
    - ev-cust-head-company-save
    - ev-cust-lifecycle-write
    - ev-cust-shareholder-save
    - ev-cust-shareholder-schema
  - dataset_id: cust_company_lifecycle_info
    name: cust_company_lifecycle_info
    description: 企业生命周期记录
    database: lowcode_pplatform
    inactive: false
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
      evidence_refs:
      - ev-cust-lifecycle-schema
    - field_id: company_id
      name: company_id
      data_type: bigint
      description: 企业id
      evidence_refs:
      - ev-cust-lifecycle-schema
    - field_id: type
      name: type
      data_type: varchar
      description: 类型
      evidence_refs:
      - ev-cust-lifecycle-schema
    - field_id: reason
      name: reason
      data_type: varchar
      description: 冻结原因
      evidence_refs:
      - ev-cust-lifecycle-schema
    - field_id: attach
      name: attach
      data_type: varchar
      description: 冻结附件路径集合
      evidence_refs:
      - ev-cust-lifecycle-schema
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
      evidence_refs:
      - ev-cust-lifecycle-schema
    evidence_refs:
    - ev-cust-head-company-save
    - ev-cust-lifecycle-schema
    - ev-cust-lifecycle-write
    - ev-cust-shareholder-save
  relationships: []
  metrics:
  - metric_id: metric-head-company-count
    name: 总公司信息数
    description: 总公司信息记录数
    aggregation: COUNT
    field:
      dataset: cust_head_company_info
      field: id
    grain:
    - dataset: cust_head_company_info
      field: id
    filters: []
    evidence_refs:
    - ev-cust-head-company-save
  - metric_id: metric-shareholder-count
    name: 股东信息数
    description: 企业股东/关联方记录数
    aggregation: COUNT
    field:
      dataset: cust_shareholder_info
      field: id
    grain:
    - dataset: cust_shareholder_info
      field: id
    filters: []
    evidence_refs:
    - ev-cust-shareholder-save
  calibers:
  - caliber_id: cal-shareholder-by-company
    label: 企业股东范围
    description: ref_cust_company_info 指定企业的股东/关联方记录
    contract_fragment:
      predicate: ref_cust_company_info = :companyCode
      scope: ref_cust_company_info 指定企业的股东/关联方记录
    field_targets:
    - dataset: cust_shareholder_info
      field: ref_cust_company_info
    evidence_refs:
    - ev-cust-shareholder-save
  - caliber_id: cal-lifecycle-freeze
    label: 冻结生命周期
    description: type=冻结 的企业生命周期记录
    contract_fragment:
      predicate: type = 'FREEZE'
      scope: type=冻结 的企业生命周期记录
    field_targets:
    - dataset: cust_company_lifecycle_info
      field: type
    evidence_refs:
    - ev-cust-lifecycle-write
  domain_rules:
  - rule_id: rule-head-company-unique
    label: 总公司按企业唯一
    content: 总公司信息通过 ref_cust_head_company_info_cust_company_info 关联企业，保存时按企业查重。
    applicability: PlatFormMigratoryApplication.setHeadCompany
    query_impact: 查询企业总公司时按 ref_cust_head_company_info_cust_company_info 关联。
    field_targets:
    - dataset: cust_head_company_info
      field: ref_cust_head_company_info_cust_company_info
    evidence_refs:
    - ev-cust-head-company-save
  - rule_id: rule-lifecycle-freeze-record
    label: 冻结记录留存
    content: 企业冻结/解冻时记录 reason 与附件，查询冻结状态时按 type 过滤。
    applicability: CustCompanyInfoApplication 冻结/解冻
    query_impact: 查询企业冻结历史时按 type 和 enable 过滤。
    field_targets:
    - dataset: cust_company_lifecycle_info
      field: type
    evidence_refs:
    - ev-cust-lifecycle-write
  verified_query_patterns:
  - pattern_id: pat-shareholder-by-company
    question: 查企业股东信息
    query: SELECT * FROM cust_shareholder_info WHERE ref_cust_company_info=:companyCode AND enable='Y'
    intended_specification:
      caliber_id: cal-shareholder-by-company
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cust-shareholder-save
  - pattern_id: pat-head-company-by-company
    question: 查企业总公司信息
    query: SELECT * FROM cust_head_company_info WHERE ref_cust_head_company_info_cust_company_info=:companyCode AND enable='Y'
    intended_specification:
      metric_id: metric-head-company-count
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cust-head-company-save
evidence_refs: []
unit_links: []
assumptions: []
conflicts: []
confidence: 0.7
