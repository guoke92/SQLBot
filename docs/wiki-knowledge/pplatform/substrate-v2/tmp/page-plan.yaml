schema_version: '1.0'
system_summary: 系统为单仓多模块 Spring Boot 低代码平台，所有模块经 lowcode-pplatform-application 聚合启动。客户管理服务承载企业建档、认证、角色、准入、银行账户、通知、CA
  收费与项目审批主流程；租户管理服务负责租户配置、灰度、运营邮件、DBAss/SSO 初始化与迁移；OpenAPI 服务聚合标准/非标对外接口；平台组件提供协议、通知、SSO
  复用能力；client 模块以事件监听同步各域状态；pplatform-apaas 统一承载 DO/Service/Mapper 数据访问。入口形态包括 HTTP
  Controller、Application、XXL-Job、事件 Listener、Dubbo Provider/Facade 与 OpenAPI 网关，业务表围绕客户、产品、项目、租户、CA
  收费和审批流组织。
