schema_version: '1.0'
system_summary: 系统为单仓多模块 Spring Boot 平台，由 lowcode-pplatform-application 启动。核心模块包括
  customer-management（客户、产品、项目、角色、CA 证书、授权）、tenant-management（租户配置、SSO/DBAss、运营邮件）、openapi（标准/非标/天马/HSCC
  开放接口）、components（协议、通知、SSO）和 pplatform-apaas（DO/Mapper/Service）。入口以 HTTP Controller、Dubbo
  Provider、XXL-Job、事件监听器为主，覆盖企业建档、企业变更、人员管理、产品与租户项目、CA 证书收费、资金方规则、OpenAPI 同步等业务域。数据统一通过
  pplatform-apaas 的 MyBatis-Plus Mapper 读写。
