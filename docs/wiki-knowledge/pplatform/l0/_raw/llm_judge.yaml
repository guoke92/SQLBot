tables:
  ca_certification_info:
    table: ca_certification_info
    enums:
    - column: cust_type
      verdict: keep
      reason: 注释直接给出封闭代码集 PERSON / COMPANY，属主体类型码；采样只落到 COMPANY 一个值，属 proposed，待补全
        PERSON 侧样本。
    - column: op_type
      verdict: keep
      reason: INSERT / UPDATE 为变更操作类型码，封闭集，属 proposed。
    - column: data_source
      verdict: keep
      reason: FBP_PORTAL / OPERATION_PLATFORM / CHANNEL_OPENAPI 为来源/渠道码，封闭集，属 proposed。
    - column: submit_status
      verdict: keep
      reason: PENDING / SUCCESS / FAIL 为提交状态码，封闭集，属 proposed。
    - column: enable
      verdict: keep
      reason: Y/N 启用开关属封闭开关码；样本仅见 Y，取值域依惯例推断，仍为 proposed。
    - column: head_company_data
      verdict: keep
      reason: 注释「是否总公司」，样本 N / Y，属是非开关码，封闭集，仍为 proposed。
    clusters:
    - key: common
      title: 通用/审计
      include: always
      fields:
      - id
      - code
      - enable
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: subject
      title: 认证主体信息
      fields:
      - cust_id
      - cust_type
      - name
      - organization_id
      - head_company_data
    - key: sync
      title: 数据同步批次
      fields:
      - op_type
      - batch_no
      - data_date
      - data_source
    - key: cert_payload
      title: 认证要素与协议
      fields:
      - notify_agreement_json
      - enterprise_four_json
      - police_two_json
      - file_refs_json
    - key: intent
      title: 意愿认证
      fields:
      - intent_sms_json
      - intent_h_face_json
    - key: submit
      title: 提交与中台结果
      fields:
      - submit_status
      - submit_time
      - sign_platform_result
    - key: workflow
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: misc
      title: 其他
      fields:
      - remark
    similar_fields:
    - fields:
      - app_tenant_code
      - db_tenant_code
      note: 逻辑租户标识与数据租户标识，语义高度重叠，疑似冗余的双租户编码
    - fields:
      - create_by
      - create_user
      note: 同一创建人的 id 与名称，成对冗余
    - fields:
      - update_by
      - update_user
      note: 同一更新人的 id 与名称，成对冗余
    - fields:
      - create_user
      - update_user
      note: 均为操作人名称列，语义近义，仅靠 create/update 前缀区分
    - fields:
      - cust_id
      - organization_id
      note: 疑似同一主体的两个标识（企业Id / 机构编号），是否同源需下游确认
  async_io_task:
    table: async_io_task
    enums:
    - column: task_type
      verdict: keep
      reason: 任务类型为封闭业务代码集（IMPORT/EXPORT），属典型类型枚举，待人工确认中文含义
    - column: status
      verdict: keep
      reason: 任务状态为封闭状态码集（SUCCESS/FAILED/RUNNING），属状态枚举，待人工确认中文含义
    - column: is_deleted
      verdict: keep
      reason: 软删除开关（0 否 / 1 是），封闭开关型代码集
    - column: enable
      verdict: keep
      reason: enable 为开关型代码列（Y/N），样本仅见 Y，需人工补全另一取值后再定稿
    - column: menu_code
      verdict: instance
      reason: 菜单标识码随业务菜单配置增长，是菜单实体的引用标识而非封闭业务代码集，宜改入 value_index 作为取值清单
    clusters:
    - key: common
      title: 通用/审计字段
      include: always
      fields:
      - id
      - code
      - enable
      - is_deleted
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: task
      title: 任务主体
      fields:
      - task_no
      - task_type
      - task_name
    - key: biz_invoke
      title: 异步调用上下文
      fields:
      - biz_class
      - biz_method
      - biz_args_json
      - ctx_json
    - key: runtime
      title: 执行状态与结果
      fields:
      - status
      - result_text
      - error_msg
      - start_time
      - end_time
    - key: file
      title: 结果文件
      fields:
      - file_url
      - file_name
    - key: menu
      title: 业务菜单
      fields:
      - menu_code
      - menu_name
    - key: user
      title: 发起人
      fields:
      - user_id
      - user_name
    - key: tenant
      title: 租户与机构
      fields:
      - app_tenant_code
      - db_tenant_code
      - organization_id
    - key: workflow
      title: 审批流程关联
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: generic
      title: 名称与备注
      fields:
      - name
      - remark
    similar_fields:
    - fields:
      - app_tenant_code
      - db_tenant_code
      note: 同为租户标识，一为逻辑租户一为数据租户，语义相邻易混用
    - fields:
      - create_by
      - user_id
      note: 创建人ID与发起人用户ID，同一行通常指向同一用户，存在冗余
    - fields:
      - create_user
      - user_name
      note: 创建人名称与发起人姓名，若为同一人则字段冗余
    - fields:
      - task_name
      - name
      note: 任务名称与通用名称列语义重叠，需确认是否重复承载业务名称
    - fields:
      - result_text
      - error_msg
      note: 业务返回与失败原因可能都来源于同一次执行返回，存在信息重叠
  authorization_agreement:
    table: authorization_agreement
    enums:
    - column: authed_status
      verdict: keep
      reason: 授权书认证状态，仅 N/Y 二值开关型封闭代码集，注释已明确语义，可作为 proposed 枚举
    - column: enable
      verdict: keep
      reason: 标准 enable 启停开关，Y/N 二值封闭集
    - column: creation_type
      verdict: keep
      reason: 创建类型，3 个互斥业务代码（CUST_BUILD_INIT/AUTO/COMPANY_MANAGER_CHANGE_CODE），属封闭类型集
    - column: company_type
      verdict: keep
      reason: 企业角色/类型封闭代码集，语义为业务角色分类；但存在 ["CORE"] 数组形态与 PLATFORM_OPREATOR_COMPANY
        拼写变体等脏值，入库前需归一化，故仍为 proposed
    - column: platform_product_code
      verdict: keep
      reason: 平台产品编码，低基数封闭代码集而非实例名；含 pplaftorm 小写拼写变体、RVSFACTOR 与 RVSFACTOR_PC 疑似同义异形，需归一化后确认
    clusters:
    - key: common
      title: 通用/审计字段
      include: always
      fields:
      - id
      - code
      - enable
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: cust
      title: 企业主档信息
      fields:
      - cust_id
      - cust_name
      - cust_manager_id
      - cust_manager_name
      - original_cust_id
    - key: act_procinst
      title: 审批流程信息
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: agreement
      title: 授权书业务属性
      fields:
      - name
      - platform_product_code
      - authed_status
      - company_type
      - creation_type
      - organization_id
      - remark
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    similar_fields:
    - fields:
      - create_by
      - create_user
      note: 创建人 id 与创建人名称同主体冗余，取值口径不同，勿混用
    - fields:
      - update_by
      - update_user
      note: 更新人 id 与更新人名称同主体冗余
    - fields:
      - cust_id
      - original_cust_id
      note: 本系统企业 id 与源系统 custid，命名近似易混，且类型不一致（number vs string）
    - fields:
      - app_tenant_code
      - db_tenant_code
      note: 逻辑租户标识与数据租户标识双编码，含义不同易误用
    - fields:
      - act_procinst_id
      - act_procinst_no
      note: 流程实例 ID 与流程申请编号，均为流程标识但取值口径不同
    - fields:
      - cust_name
      - name
      note: name 为授权确认书名称，cust_name 为企业名称，语义不同需区分
  ca_fee_special_config:
    table: ca_fee_special_config
    enums:
    - column: enable
      verdict: keep
      reason: Y/N 二值开关，属封闭代码集，可作 proposed 候选；但列注释为空，仅有原始值，未确认语义标签
    clusters:
    - key: common
      title: 通用（主键/编码/开关/审计/时间戳）
      include: always
      fields:
      - id
      - code
      - enable
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: enterprise
      title: 企业主体信息
      fields:
      - certification_no
      - company_name
    - key: fee
      title: 费用配置
      fields:
      - annual_fee
      - name
      - remark
    - key: validity
      title: 有效期
      fields:
      - valid_start
      - valid_end
    - key: workflow
      title: 审批流程实例
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: ref
      title: 外部引用
      fields:
      - project_id
      - organization_id
    - key: log
      title: 操作日志
      fields:
      - operate_logs
    similar_fields:
    - fields:
      - app_tenant_code
      - db_tenant_code
      note: 逻辑租户/数据租户双份标识，同一租户维度的重复编码，疑似冗余
    - fields:
      - create_by
      - create_user
      note: 创建人 id 与名称成对拷贝
    - fields:
      - update_by
      - update_user
      note: 更新人 id 与名称成对拷贝
    - fields:
      - act_procinst_id
      - act_procinst_no
      note: 流程实例 ID 与流程申请编号，同一流程实例的两种标识
    - fields:
      - name
      - company_name
      note: 通用名称与企业名称，语义层级不同但含混，需确认 name 是否指该配置项名称
  ca_fee_project_config:
    table: ca_fee_project_config
    enums:
    - column: charge_enabled
      verdict: keep
      reason: Y/N 两值，属封闭布尔开关代码集，符合收费开关语义；样本仅 2 值，仍为 proposed
    - column: enable
      verdict: keep
      reason: 系统通用启用开关，Y/N 封闭集；当前样本仅见 Y，N 值待线上确认，仍为 proposed
    - column: agreement_version
      verdict: reject
      reason: 协议版本号，自由文本/配置值而非封闭业务代码集，distinct=1 仅为单条配置痕迹
    clusters:
    - key: common
      title: 通用/审计
      include: always
      fields:
      - id
      - code
      - enable
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: fee_rule
      title: 收费规则配置
      fields:
      - charge_enabled
      - supplier_annual_fee
      - core_annual_fee
      - pay_channel
      - special_company_list
      - block_scene_list
      - agreement_version
      - last_toggle_time
    - key: tenant_scope
      title: 租户标识
      fields:
      - tenant_id
      - app_tenant_code
      - db_tenant_code
    - key: owner
      title: 归属对象
      fields:
      - project_id
      - organization_id
      - name
    - key: approval_process
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    similar_fields:
    - fields:
      - create_by
      - create_user
      note: 创建人 id 与创建人名称，同一审计主体的两种表示，常同步出现
    - fields:
      - update_by
      - update_user
      note: 更新人 id 与更新人名称，同一审计主体的两种表示，常同步出现
    - fields:
      - tenant_id
      - app_tenant_code
      - db_tenant_code
      note: 租户标识三处冗余表达，需确认逻辑租户与数据租户是否一一对应
  ca_fee_order:
    table: ca_fee_order
    enums:
    - column: company_type
      verdict: keep
      reason: 企业角色代码集（SUPPLIER/CORE/PROJECT_COMPANY），取值封闭且均为业务角色码，非实例名，建议人工确认后转 confirmed。
    - column: order_type
      verdict: keep
      reason: 订单类型代码集（STOCK/FIRST/RENEW/RENEW_EXPIRED），业务语义封闭，属代码枚举。
    - column: order_status
      verdict: keep
      reason: 订单状态机取值（CLOSED/PENDING/PAID/PAIDING/UNPAID），典型封闭状态集。
    - column: pay_method
      verdict: reject
      reason: 样本 distinct=1（仅 BOCOM），无法证明是封闭代码集，更像当前只接入单一渠道的配置碎片，不宜入枚举。
    - column: agreement_version
      verdict: reject
      reason: 取值 V1.0 属协议版本号标识而非业务代码集，单值样本不足以构成封闭枚举。
    - column: agreement_signed
      verdict: keep
      reason: Y/N 二值开关，语义为是否已签署，属封闭布尔代码。
    - column: invoice_status
      verdict: keep
      reason: 发票状态取值（PENDING/ISSUED），封闭状态码；注意表中存在 invoice_fail_reason，样本可能不完整。
    - column: enable
      verdict: keep
      reason: Y/N 启用开关，通用封闭布尔代码。
    clusters:
    - key: common
      title: 通用与审计字段
      include: always
      fields:
      - id
      - code
      - name
      - remark
      - enable
      - version
      - operate_logs
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: order
      title: 订单与生命周期
      fields:
      - order_no
      - order_type
      - order_status
      - close_reason
    - key: payment
      title: 缴费与金额
      fields:
      - annual_fee
      - pay_amount
      - pay_method
      - pay_time
      - pay_remark
    - key: company
      title: 企业主体
      fields:
      - company_id
      - company_name
      - company_type
      - certification_no
      - organization_id
    - key: project
      title: 触发项目
      fields:
      - project_id
      - project_name
    - key: bocom
      title: 交e保银行侧交互
      fields:
      - bocom_plfm_ser_no
      - bocom_plfm_bsn_id
      - bocom_req_sn
      - bocom_txn_sts
      - bocom_pay_info
    - key: service
      title: 服务周期
      fields:
      - service_start
      - service_end
    - key: agreement
      title: 收费协议
      fields:
      - agreement_version
      - agreement_signed
      - agreement_sign_time
      - agreement_file_path
    - key: invoice
      title: 发票
      fields:
      - invoice_status
      - invoice_no
      - invoice_file_path
      - invoice_request_id
      - invoice_fail_reason
    - key: tenant
      title: 租户标识
      fields:
      - tenant_id
      - app_tenant_code
      - db_tenant_code
    - key: approval
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    similar_fields:
    - fields:
      - create_by
      - create_user
      note: 创建人 id 与其显示名称成对存在，展示时易混用。
    - fields:
      - update_by
      - update_user
      note: 更新人 id 与其显示名称成对存在，展示时易混用。
    - fields:
      - tenant_id
      - app_tenant_code
      - db_tenant_code
      note: 三种租户标识并列，逻辑租户与数据租户语义重叠，过滤条件易误用。
    - fields:
      - act_procinst_id
      - act_procinst_no
      note: 同属流程实例的 ID 与申请编号，命名相近需区分。
    - fields:
      - bocom_plfm_ser_no
      - bocom_plfm_bsn_id
      - bocom_req_sn
      note: 银行侧平台流水号、业务编号、请求流水号三者命名近似，需对照业务含义使用。
  ca_fee_company:
    table: ca_fee_company
    enums:
    - column: fee_locked
      verdict: keep
      reason: 封闭开关值 Y/N，符合代码枚举，保持 proposed。
    - column: pay_status
      verdict: keep
      reason: 缴费状态封闭代码集 PAID/UNPAID，保持 proposed。
    - column: source_company_type
      verdict: keep
      reason: 来源企业角色封闭代码集 SUPPLIER/CORE/PROJECT_COMPANY，保持 proposed。
    - column: renew_remind_sent
      verdict: keep
      reason: 续费待办生成标记封闭开关值 Y/N，保持 proposed。
    - column: special_config_flag
      verdict: keep
      reason: 特殊配置快照存在标记封闭开关值 Y/N，保持 proposed。
    - column: ca_status
      verdict: keep
      reason: CA签章状态封闭代码集 NORMAL/CANCELLED/UNKNOWN，保持 proposed。
    - column: enable
      verdict: reject
      reason: 仅观测到单值 Y，缺少可枚举区分度，属于常量噪声；非实例名单，不转 value_index。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - enable
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: company_identity
      title: 企业主档身份
      fields:
      - certification_no
      - company_name
      - name
    - key: source_lock
      title: 来源锁定
      fields:
      - tenant_id
      - source_project_id
      - source_company_type
    - key: service_period
      title: 服务周期
      fields:
      - service_start
      - service_end
    - key: fee_management
      title: 年费与缴费
      fields:
      - locked_annual_fee
      - fee_locked
      - pay_status
      - renew_remind_sent
    - key: special_config
      title: 特殊配置
      fields:
      - special_config_flag
      - special_annual_fee
    - key: ca_signing
      title: CA签章
      fields:
      - ca_status
    - key: approval_flow
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant_org
      title: 租户与机构
      fields:
      - app_tenant_code
      - db_tenant_code
      - organization_id
    - key: extension
      title: 扩展与备注
      fields:
      - ext_json
      - remark
    similar_fields:
    - fields:
      - company_name
      - name
      note: 企业名称与通用名称同表并存，疑似名称拷贝/冗余，需确认业务语义差异。
    - fields:
      - app_tenant_code
      - db_tenant_code
      note: 逻辑租户标识与数据租户标识命名高度相似，疑似重复租户编码，需确认是否同源。
    - fields:
      - act_procinst_id
      - act_procinst_no
      note: 流程实例ID与流程申请编号均为流程标识，需确认是否冗余或分别承载实例/申请编号。
    - fields:
      - locked_annual_fee
      - special_annual_fee
      note: 锁定年费标准与特殊配置年费均为年费金额，语义相近，需确认是否不同计费口径。
  client_api_sync_error:
    table: client_api_sync_error
    enums:
    - column: enable
      verdict: keep
