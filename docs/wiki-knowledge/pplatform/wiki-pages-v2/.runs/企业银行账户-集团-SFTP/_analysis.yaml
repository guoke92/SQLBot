field_semantics:
- table: cust_account_info
  field: id
  meaning: 表主键，雪花ID
  evidence: db
- table: cust_account_info
  field: account_no
  meaning: 账户账号（银行账号），新增前按该字段+归属企业去重
  evidence: code
- table: cust_account_info
  field: account_name
  meaning: 账户名称（开户名），打款申请时作为 AccountName 传给银行
  evidence: code
- table: cust_account_info
  field: account_type
  meaning: 账户类型；DB 实测主值为 'BANK'(48428)，另有 'OPERATION_FEE_ACCOUNT'(30)、'received'(1)、'1'(5)
  evidence: db
- table: cust_account_info
  field: default_account_flag
  meaning: 是否默认还款账户，'1'=默认 / '0'=非默认；同一归属企业下仅允许一条为 '1'
  evidence: code
- table: cust_account_info
  field: ref_cust_company_info
  meaning: 归属企业编码，指向 cust_company_info.code（不是 id）
  evidence: code
- table: cust_account_info
  field: auth_state
  meaning: 银行小额打款验证认证状态，DB 默认值 APPLY_00；实测分布 APPLY_00/APPLY_20/APPLY_40
  evidence: db
- table: cust_account_info
  field: payment_remaining_count
  meaning: 剩余可发起打款次数，由 cust_setting_config.payment_maximum_number 初始化，每次申请成功 -1
  evidence: code
- table: cust_account_info
  field: error_try_count
  meaning: 打款验证金额错误次数，result=1/2 时 +1
  evidence: code
- table: cust_account_info
  field: error_try_time
  meaning: 最后一次打款验证错误时间
  evidence: code
- table: cust_account_info
  field: trans_id
  meaning: 银行打款申请交易流水号（OriginalTxSN），申请成功后回写并用于后续查询/验证
  evidence: code
- table: cust_account_info
  field: trace_no
  meaning: 银行返回的系统跟踪号
  evidence: code
- table: cust_account_info
  field: bank_no
  meaning: 联行号；代码中同时被 setCnapsCode(bankNo) 复用为联行号传给银行，语义被复用
  evidence: code
- table: cust_account_info
  field: bank_code
  meaning: 银行(总行)代码
  evidence: db
- table: cust_account_info
  field: bank_code_name
  meaning: 银行(总行)名称，打款申请时作为 BankName 传给银行
  evidence: code
- table: cust_account_info
  field: bank_branch_name
  meaning: 账户开户行
  evidence: db
- table: cust_account_info
  field: status
  meaning: 账户状态；DB 实测仅有 'INIT'，代码中未见状态迁移写值点
  evidence: db
- table: cust_account_info
  field: receive_payment_type
  meaning: 收付类型
  evidence: db
- table: cust_account_info
  field: enable
  meaning: 逻辑启用标识，DB 全量 'Y'
  evidence: db
- table: cust_account_info
  field: main_data_id
  meaning: 主数据id
  evidence: db
- table: cust_group_rel
  field: id
  meaning: 表主键，集团关系树节点ID
  evidence: db
- table: cust_group_rel
  field: cust_id
  meaning: 当前成员企业ID，指向 cust_company_info.id
  evidence: code
- table: cust_group_rel
  field: parent_cust_id
  meaning: 上一级企业ID，指向 cust_company_info.id
  evidence: code
- table: cust_group_rel
  field: parent_group_id
  meaning: 父节点ID，指向本表 cust_group_rel.id，建树时按此分组
  evidence: code
- table: cust_group_rel
  field: root_cust_id
  meaning: 根集团企业ID，指向 cust_company_info.id
  evidence: code
- table: cust_group_rel
  field: root_group_id
  meaning: 根节点ID，指向本表 cust_group_rel.id，用于 listAllNodesByRootId
  evidence: code
- table: cust_group_rel
  field: root_flag
  meaning: 是否集团根企业，'Y'=是 / 'N'=不是；DB root_flag='Y' 29 条与 level=1 的 29 条一致
  evidence: db
- table: cust_group_rel
  field: level
  meaning: 层级；代码仅在根节点写入 1，DB 实测仅出现 '1'
  evidence: code
- table: cust_group_rel
  field: cust_type
  meaning: 企业角色，JSON 数组字符串（代码用 JSONArray.toJSONString() 写入，形如 ["CORE"]），支持多角色遍历写入
  evidence: code
- table: cust_group_rel
  field: status
  meaning: 关系生效状态：EFFECTIVE/INEFFECTIVE/REJECTED
  evidence: db
- table: cust_group_rel
  field: db_tenant_code
  meaning: 数据租户标识，DB 实测 17 个取值，是集团关系查询的关键过滤条件
  evidence: db
- table: cust_sftp
  field: channel
  meaning: SFTP 渠道编码（如 ZTSJ、tianma、meituan、sny_test），DB 16 条互不相同
  evidence: db
- table: cust_sftp
  field: host
  meaning: SFTP 主机地址，实测 qa.sftp.lls.com(15) / uat.sftp.lls.com(1)
  evidence: db
- table: cust_sftp
  field: port
  meaning: SFTP 端口，实测全部 '22'
  evidence: db
- table: cust_sftp
  field: user_name
  meaning: SFTP 登录账号，命名形如 app_<渠道>_<日期序列>
  evidence: db
- table: cust_sftp
  field: name
  meaning: 渠道中文名称（如 天合光能、深天马、百果园、美团）
  evidence: db
- table: cust_sftp
  field: db_tenant_code
  meaning: 数据租户标识，与 channel 非一一对应（ISOLATE_TAG_zjsj、sny 各有 2 条）
  evidence: db
- table: cust_sftp
  field: enable
  meaning: 是否启用，实测全部 'Y'
  evidence: db
state_machines:
- name: 银行账户打款认证状态
  field: cust_account_info.auth_state
  states:
  - value: APPLY_00
    label: 初始，未发起打款认证（DB 列默认值）
    source: db_dist
  - value: APPLY_10
    label: 已提交打款申请、待银行受理
    source: code_const
  - value: APPLY_20
    label: 银行受理成功（允许发起金额验证）
    source: code_const
  - value: APPLY_30
    label: 申请打款受理失败
    source: code_const
  - value: APPLY_40
    label: 已完成验证（金额一致时落库）
    source: db_dist
  transitions:
  - from: APPLY_00
    event: 发起小额打款申请 cnapsPaymentApply
    to: APPLY_10
    evidence: code_path:CustAccountApplication.java:193
  - from: APPLY_10
    event: 查询打款结果 status=10（幂等重写）
    to: APPLY_10
    evidence: code_path:CustAccountApplication.java:222
  - from: APPLY_10
    event: 查询打款结果 status=20
    to: APPLY_20
    evidence: code_path:CustAccountApplication.java:224
  - from: APPLY_10
    event: 查询打款结果 status=30
    to: APPLY_30
    evidence: code_path:CustAccountApplication.java:226
  - from: APPLY_20
    event: 打款验证金额一致 result=0
    to: APPLY_40
    evidence: code_path:CustAccountApplication.java:283
  - from: APPLY_20
    event: 打款验证金额不匹配 result=1（抛异常，状态未落库）
    to: APPLY_40
    evidence: code_path:CustAccountApplication.java:287
  - from: APPLY_20
    event: 银行库无记录 result=2（抛异常，状态未落库）
    to: APPLY_40
    evidence: code_path:CustAccountApplication.java:293
- name: 集团成员单位关系状态
  field: cust_group_rel.status
  states:
  - value: INEFFECTIVE
    label: 未生效
    source: code_enum
  - value: EFFECTIVE
    label: 已生效
    source: db_dist
  - value: REJECTED
    label: 已拒绝
    source: code_enum
  transitions:
  - from: null
    event: 新增成员单位关系（addExistSubCustGroupRel/addNewSubCustGroupRel/导入）
    to: INEFFECTIVE
    evidence: code_path:CustGroupRelApplication.java:addExistSubCustGroupRel
  - from: null
    event: 发送成员单位签署待办 sendCustGroupRelNotice
    to: INEFFECTIVE
    evidence: code_path:CustGroupLicenseApplication.java:sendCustGroupRelNotice
  - from: INEFFECTIVE
    event: 成员单位签署协议 accept
    to: EFFECTIVE
    evidence: code_path:CustGroupLicenseApplication.java:accept
  - from: INEFFECTIVE
    event: 拒绝签署协议 reject
    to: REJECTED
    evidence: code_path:CustGroupLicenseApplication.java:reject
  - from: null
    event: 新增集团根企业且企业已建档成功 BUILD_SUCCESS
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java:addExistRootGroupRel
  - from: INEFFECTIVE
    event: effectGroupRel 外部回调置为已生效
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java:effectGroupRel
calibers:
- name: 默认还款账户
  predicate: cust_account_info.default_account_flag = '1'
  scope: 同一 ref_cust_company_info 下唯一；setDefaultFlag/afterSave 维护
  evidence: code_path:CustAccountApplication.java:setDefaultFlag
- name: 有效账户
  predicate: cust_account_info.enable = 'Y'
  scope: 全表实测均为 Y
  evidence: db
- name: 银行账户（账户类型）
  predicate: cust_account_info.account_type = 'BANK'
  scope: 占 48428/48468，是账户类型主口径
  evidence: db
- name: 未发起打款认证
  predicate: cust_account_info.auth_state = 'APPLY_00'
  scope: DB 列默认值，占 49144 条
  evidence: db
- name: 已生效集团关系
  predicate: cust_group_rel.status = 'EFFECTIVE'
  scope: listSubCust 仅返回该状态节点
  evidence: code_path:CustGroupRelApplication.java:listSubCust
- name: 集团根节点
  predicate: cust_group_rel.root_flag = 'Y'
  scope: checkCustGroup 拒绝对根节点做签署/拒绝操作
  evidence: code_path:CustGroupLicenseApplication.java:checkCustGroup
term_bridges:
- term: 默认账户
  aliases:
  - 默认还款账号
  - 默认还款账户
  maps_to: cust_account_info.default_account_flag = '1'
  also_confused_with:
  - cust_account_info.account_type
  adjudication: boundary
  boundary: default_account_flag 是企业维度内的默认标记，由 setDefaultFlag/afterSave 互斥维护；account_type
    描述账户性质（银行/运营费账户），二者不可互推
- term: 集团（集团公司/根企业）
  aliases:
  - root
  - rootGroup
  maps_to: cust_group_rel.root_flag = 'Y'
  also_confused_with:
  - cust_company_info.cust_company_type
  adjudication: boundary
  boundary: root_flag='Y' 是关系表上的根节点标记；cust_company_info.cust_company_type 含 CORPORATION_COMPANY
    才是企业角色意义上的集团，showCustGroupTree 先看角色再查关系，二者需联合判断
- term: 成员单位
  aliases:
  - 子企业
  - 子级企业
  - 上级企业
  maps_to: cust_group_rel.cust_id
  also_confused_with:
  - cust_group_rel.parent_cust_id
  adjudication: boundary
  boundary: cust_id 是当前成员企业，parent_cust_id 是其上一级企业；同层级语义相反，建树/校验必须区分
- term: 企业角色
  aliases:
  - custType
  - companyType
  maps_to: cust_group_rel.cust_type
  also_confused_with:
  - cust_company_info.cust_company_type
  adjudication: boundary
  boundary: cust_group_rel.cust_type 限定该条关系下的角色（JSON 数组字符串，多角色逐条写入），cust_company_info.cust_company_type
    是企业全局角色，导入校验要求两者一致
- term: 打款验证
  aliases:
  - 小额打款
  - 打款认证
  - 打款验证码
  maps_to: cust_account_info.auth_state
  also_confused_with:
  - cust_account_info.status
  adjudication: boundary
  boundary: auth_state 描述打款认证流程阶段（APPLY_xx）；status 是账户业务状态，DB 实测仅 INIT，代码无迁移
- term: SFTP 渠道
  aliases:
  - channel
  maps_to: cust_sftp.channel
  also_confused_with:
  - cust_sftp.db_tenant_code
  adjudication: boundary
  boundary: channel 是业务渠道编码（ZTSJ/tianma/meituan），db_tenant_code 是数据租户标识，取值域不同且非一一对应（ISOLATE_TAG_zjsj、sny
    各有 2 条）
rules:
- name: 账户不可重复添加
  content: 同一归属企业内相同 account_no 唯一，命中时报“账户不能重复添加”
  impact: 阻断新增
  field_targets:
  - cust_account_info.account_no
  - cust_account_info.ref_cust_company_info
  evidence: code_path:CustAccountApplication.java:checkBefore
- name: 单企业唯一默认账户
  content: 置默认时先把该企业已有 default_account_flag='1' 的账户改为 '0'，再把当前账户置 '1'
  impact: 更新存量数据
  field_targets:
  - cust_account_info.default_account_flag
  evidence: code_path:CustAccountApplication.java:setDefaultFlag
- name: 打款次数初始化
  content: 从 cust_setting_config.payment_maximum_number 取首条配置写入 payment_remaining_count
  impact: 初始化字段
  field_targets:
  - cust_account_info.payment_remaining_count
  - cust_setting_config.payment_maximum_number
  evidence: code_path:CustAccountApplication.java:updatePayCount
- name: 打款次数用尽阻断
  content: payment_remaining_count == 0 时抛“今天打款次数已用完”，申请成功后 -1
  impact: 阻断
  field_targets:
  - cust_account_info.payment_remaining_count
  evidence: code_path:CustAccountApplication.java:cnapsPaymentApply
- name: 打款验证金额区间
  content: 验证金额须 >0 且 <1（0.01~0.99），控制器换算为分后传银行
  impact: 入参校验
  field_targets:
  - cust_account_info.trans_id
  evidence: code_path:CustAccountInfoController.java:checkAmount
- name: 验证失败不落库
  content: result=1/2 分支在 setErrorTryCount/setErrorTryTime 之后、saveOrUpdate 之前直接 throw，且方法无事务注解，错误次数与
    APPLY_40 实际不会持久化
  impact: 实现与设计不一致
  field_targets:
  - cust_account_info.error_try_count
  - cust_account_info.error_try_time
  - cust_account_info.auth_state
  evidence: code_path:CustAccountApplication.java:cnapsPaymentConfirm
- name: group根企业禁操作
  content: root_flag='Y' 或状态已 EFFECTIVE 的集团关系不允许再次 accept/reject
  impact: 阻断
  field_targets:
  - cust_group_rel.root_flag
  - cust_group_rel.status
  evidence: code_path:CustGroupLicenseApplication.java:checkCustGroup
- name: 待办不可重复发送
  content: queryLatelyNotice 命中未处理待办时抛“企业存在未办理的待办事项，不支持重复发送”
  impact: 阻断
  field_targets:
  - cust_group_rel.id
  evidence: code_path:CustGroupLicenseApplication.java:sendCustGroupRelNotice
- name: 成员单位删除前置在途校验
  content: removeRootGroup 先扁平化集团树，再调额度/产品在途校验，有在途业务抛 HAS_BUSINESS_PROCESS
  impact: 阻断删除
  field_targets:
  - cust_group_rel.id
  - cust_group_rel.root_cust_id
  evidence: code_path:CustGroupRelApplication.java:validateBusinessOnWay
- name: 成员单位角色一致性
  content: 导入时同一上级下所有成员单位的企业角色必须一致，且与已存在上级企业角色一致
  impact: 导入校验
  field_targets:
  - cust_group_rel.cust_type
  evidence: code_path:CustGroupRelApplication.java:checkRoleExcelData
- name: 签署待办异步容错发送
  content: '@Async 线程池 + 事务提交后 afterCommit 触发，异常仅 log.warn 不阻断主流程'
  impact: 异步/容错
  field_targets:
  - cust_group_rel.status
  evidence: code_path:CustGroupRelApplication.java:sendCustGroupRelNotice
reqdoc_claims:
- claim: 消息异步发送，不阻塞主流程；发送失败记录日志，不抛出异常
  code_status: confirmed
  code_evidence: CustGroupRelApplication.java:sendCustGroupRelNotice（@Async("custGroupThreadPool")
    + TransactionSynchronization.afterCommit + catch log.warn）
  action: anchor
- claim: 企业状态流转：待提交→审核中→已通过；已通过→已冻结/已注销
  code_status: uncovered
  code_evidence: CustCompanyIfoEnchanceService.java:userCompanyStatus 仅引用 CustBuildStatusEnum
    的 BUILD_SUCCESS/CUST_BUILDING/BUILD_FAIL/CUST_CHANGE；冻结/注销流转的枚举与写值点未出现在本次给出文件
  action: review
- claim: 删除权限：不支持物理删除，只支持逻辑删除（冻结/注销）
  code_status: refuted
  code_evidence: CustGroupRelApplication.java:removeRootGroup -> groupRelService.removeBatchByIds(collect)，集团成员单位关系为物理删除
  action: prose_only
- claim: 所有通知同步发送站内信，用户登录后可查看站内信
  code_status: uncovered
  code_evidence: CustGroupLicenseApplication.java 通过 noticeProvider/complete 发送与消除待办，站内信落库链路未在给出的文件中
  action: review
enum_audit:
- field: cust_account_info.account_type
  value: BANK
  java_name: AccountTypeEnum.BANK
  stored_as: name()/字面量 'BANK'
  label: 银行
  verdict: confirm
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/CustPersonController.java:305
  note: DB 实测 48428 条为字面 'BANK'，与 .name() 落库一致，底稿 stored_as=name 成立
- field: cust_account_info.account_type
  value: received
  java_name: AccountTypeEnum.RECEIVED
  stored_as: getDictKey()
  label: 收款
  verdict: confirm
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/enums/AccountTypeEnum.java
  note: DB 仅 1 条，accessors 声明 getDictKey=1 处被引用，属低频写入路径
- field: cust_account_info.account_type
  value: '1'
  java_name: AccountTypeEnum.BANK.getDictParam()
  stored_as: dictParam 数字形态
  label: 银行（数字形态）
  verdict: correct
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/enums/AccountTypeEnum.java
  note: 枚举同值存在 getDictParam=1 与 name()=BANK 两种键；DB 中 '1' 仅 5 条、'BANK' 48428 条，说明主路径是
    name()，'1' 为历史/其他写入点遗留，底稿未体现键混用
- field: cust_account_info.account_type
  value: OPERATION_FEE_ACCOUNT
  java_name: null
  stored_as: 字面量
  label: 运营费账户
  verdict: correct
  evidence: db
  note: DB 30 条，代码枚举基线完全未声明，需补枚举，否则按 account_type 统计会漏口径
- field: cust_account_info.auth_state
  value: APPLY_10
  java_name: AccountAuthState.APPLY_10
  stored_as: 写值用 getDictParam()、查询用 getDictKey()
  label: 打款申请已提交
  verdict: reject
  evidence: CustAccountApplication.java:193（getDictParam） vs CustAccountApplication.java:222（getDictKey）
  note: 同一枚举在打款申请写值与结果查询/confirm 判断处使用不同存取器，DB 分布中不存在 APPLY_10，疑似写入值与判断值不一致导致状态链路断裂
- field: cust_account_info.auth_state
  value: APPLY_40
  java_name: AccountAuthState.APPLY_40
  stored_as: getDictKey()
  label: 已完成验证
  verdict: confirm
  evidence: CustAccountApplication.java:283
  note: DB 12 条；result=1/2 分支虽设置该值，但 throw 早于 saveOrUpdate，实际仅 result=0 会落库
- field: cust_account_info.status
  value: INIT
  java_name: null
  stored_as: 字面量
  label: 账户初始状态
  verdict: reject
  evidence: db
  note: DB 46630 条 INIT，远超代码状态枚举基线；底稿把 StatusEnum(EFFECTIVE/INVALID) 绑定 cust_account_info.status
    不成立，该枚举实为集团关系用途之外的另一套词汇
