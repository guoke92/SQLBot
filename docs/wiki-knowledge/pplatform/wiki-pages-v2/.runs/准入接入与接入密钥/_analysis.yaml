field_semantics:
- table: cust_access_secret
  field: channel
  meaning: 接入渠道/应用ID，开放API按该字段识别渠道并定位租户；DB注释为“应用id”，代码字段语义为渠道
  evidence: db|code
- table: cust_access_secret
  field: db_tenant_code
  meaning: 渠道所属数据租户标识，决定该渠道接入客户落库租户
  evidence: db|code
- table: cust_access_secret
  field: enable
  meaning: 渠道启用标识，Y为有效渠道，N为禁用；接入校验只取Y
  evidence: db|code
- table: cust_access_secret
  field: encry_type
  meaning: 接入密钥加密类型，DB样本全部为rsa
  evidence: db
- table: cust_access_secret
  field: pub_key
  meaning: 公钥文件路径，非公钥内容；DB样本多为/qa/FBP_SYSTEM/cert/**-pub.pem
  evidence: db
- table: cust_access_secret
  field: pri_key
  meaning: 私钥文件路径，非私钥内容；DB样本多为/qa/FBP_SYSTEM/cert/**-pri.pfx或空
  evidence: db
- table: cust_access_secret
  field: password
  meaning: 密钥/证书密码
  evidence: db
- table: cust_access_secret
  field: key_num
  meaning: 密钥对数，DB样本全部为2
  evidence: db
- table: cust_access_secret
  field: rel_lls_secret_id
  meaning: 关联平台密钥记录id；给定接入链路未见读取该字段
  evidence: db
- table: cust_access_secret
  field: status_query_license_enabled
  meaning: 建档状态查询是否返回营业执照并同步SFTP，Y/N；DB实测N=18、Y=3；CustAccessSecretDO给定代码未定义该字段
  evidence: db
- table: cust_access_secret
  field: name
  meaning: 渠道/接入方名称，如天马、天合光能、怡亚通
  evidence: db
- table: cust_access_secret
  field: code
  meaning: 编码；服务层提供getByCode，但给定接入链路未使用
  evidence: db|code
- table: cust_access_secret
  field: app_tenant_code
  meaning: 逻辑租户标识，与db_tenant_code区分
  evidence: db
- table: cust_access_secret
  field: act_procinst_status
  meaning: 流程当前审批状态；接入密钥链路未见读取
  evidence: db
- table: cust_access_secret
  field: organization_id
  meaning: 机构编号
  evidence: db
- table: cust_company_info
  field: cust_build_status
  meaning: 企业建档/准入状态字段，代码写入INIT、CUST_BUILDING、BUILDING、CUST_CONFIRM_AWAIT、AWAIT_CUST_CONFIRM、BUILD_SUCCESS、BUILD_FAIL
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 运营中台审核状态字段，映射CheckStatus枚举，回调时更新
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 企业状态字段，代码出现ADD、EFFECT、FREEZE、WRITEOFF、CHANGE
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证/接入方式字段，代码出现INVITE、INVITE_AGW、SELF、SIMPLE；自主建档实际落INVITE，非自主建档落INVITE_AGW
  evidence: code
state_machines:
- name: 企业建档准入状态机
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始化
    source: code_const
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: CUST_BUILDING
    label: 运营中台审核中
    source: code_enum
  - value: BUILDING
    label: 建档中/审核中（查询分支使用，需核对与CUST_BUILDING关系）
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: BUILD_FAIL
    label: 建档失败
    source: code_enum
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认（简易认证分支，需核对与CUST_CONFIRM_AWAIT关系）
    source: code_enum
  transitions:
  - from: INIT
    event: 提交建档且identify_style为INVITE/SELF
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: INIT
    event: 提交建档且identify_style为INVITE_AGW
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台退回客户确认CUST_CHECK_BACKTOCUSTOM
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户确认提交/运营审核中CUST_CHECK_CHECKING
    to: CUST_BUILDING
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核通过CUST_CHECK_PASS
    to: BUILD_SUCCESS
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 运营中台审核通过CUST_CHECK_PASS
    to: BUILD_SUCCESS
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核拒绝CUST_CHECK_REJECT
    to: BUILD_FAIL
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 运营中台审核拒绝CUST_CHECK_REJECT
    to: BUILD_FAIL
    evidence: code_path:CustAuditMsgService.java:getCustBuildStatus
  - from: BUILD_FAIL
    event: 修改后重新提交且identify_style为INVITE/SELF
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: AWAIT_CUST_CONFIRM
    event: 简易认证确认提交
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:confirmCustInfoForSimpleAuth
- name: 企业状态机
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增/初始
    source: code_const
  - value: EFFECT
    label: 生效
    source: code_enum
  - value: FREEZE
    label: 冻结
    source: code_enum
  - value: WRITEOFF
    label: 注销
    source: code_enum
  - value: CHANGE
    label: 变更中
    source: code_enum
  transitions:
  - from: ADD
    event: 建档成功
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: EFFECT
    event: 冻结
    to: FREEZE
    evidence: code_path:CustCompanyInfoApplication.java:freeze
  - from: FREEZE
    event: 解冻
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java:unfreeze
  - from: EFFECT
    event: 注销/禁用
    to: WRITEOFF
    evidence: code_path:CustCompanyInfoApplication.java:diable
- name: 运营审核状态机
  field: cust_company_info.check_status
  states:
  - value: CUST_CHECK_INIT
    label: 初始/退回
    source: code_enum
  - value: CUST_CHECK_CHECKING
    label: 审核中
    source: code_enum
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户
    source: code_enum
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_enum
  - value: CUST_CHECK_REJECT
    label: 审核拒绝
    source: code_enum
  - value: CUST_BACK
    label: 退回（与CUST_CHECK_INIT映射同一前端状态）
    source: code_enum
  transitions:
  - from: CUST_CHECK_INIT
    event: 运营中台审核中
    to: CUST_CHECK_CHECKING
    evidence: code_path:CustAccessApplication.java:getCheckStatus
  - from: CUST_CHECK_CHECKING
    event: 退回客户
    to: CUST_CHECK_BACKTOCUSTOM
    evidence: code_path:CustAccessApplication.java:getCheckStatus
  - from: CUST_CHECK_CHECKING
    event: 审核通过
    to: CUST_CHECK_PASS
    evidence: code_path:CustAccessApplication.java:getCheckStatus
  - from: CUST_CHECK_CHECKING
    event: 审核拒绝
    to: CUST_CHECK_REJECT
    evidence: code_path:CustAccessApplication.java:getCheckStatus
calibers:
- name: 有效接入渠道
  predicate: cust_access_secret.enable = 'Y'
  scope: 开放API渠道校验、变更渠道校验、天马渠道校验
  evidence: code:CustAccessApplication.validateSetValue/validateChangeChannelAndTenant/validateSetValueOfTianma;
    db:enable Y=19,N=2
- name: 禁用接入渠道
  predicate: cust_access_secret.enable = 'N'
  scope: DB中存在2条禁用渠道，接入校验会拒绝
  evidence: db:enable N=2
- name: 接入密钥加密类型RSA
  predicate: cust_access_secret.encry_type = 'rsa'
  scope: cust_access_secret全量样本
  evidence: db:encry_type distinct=1, rsa
- name: 密钥对数2
  predicate: cust_access_secret.key_num = '2'
  scope: cust_access_secret全量样本
  evidence: db:key_num distinct=1, 2
- name: 建档状态查询返回营业执照并同步SFTP开启
  predicate: cust_access_secret.status_query_license_enabled = 'Y'
  scope: DB中3条渠道开启，代码链路未读取该字段，需REVIEW
  evidence: db:status_query_license_enabled Y=3,N=18
- name: 建档状态查询返回营业执照并同步SFTP关闭
  predicate: cust_access_secret.status_query_license_enabled = 'N'
  scope: DB中18条渠道关闭
  evidence: db:status_query_license_enabled N=18
- name: 渠道映射租户示例天马
  predicate: cust_access_secret.db_tenant_code = 'tianma.beehive-scf.qhhrly.cn'
  scope: 天马渠道接入租户
  evidence: db:db_tenant_code值分布; code:CustAccessApplication.validateSetValue
- name: 渠道映射租户示例怡亚通
  predicate: cust_access_secret.db_tenant_code = 'eascs.beehive-scf.qhhrly.cn'
  scope: 怡亚通渠道接入租户
  evidence: db:db_tenant_code值分布; code:CustAccessApplication.setEsassAuthFlag
- name: 重复建档排除失败建档
  predicate: cust_company_info.cust_build_status = 'BUILD_FAIL'
  scope: 同租户同统一社会信用代码重复建档校验时排除BUILD_FAIL
  evidence: code:CustAccessApplication.validateSetValue/CustAccessApplication.initCust
- name: 天马重复校验排除已注销
  predicate: cust_company_info.cust_status = 'WRITEOFF'
  scope: 天马建档名称/信用代码/组合重复校验时排除WRITEOFF
  evidence: code:CustAccessApplication.validateSetValueOfTianma
term_bridges:
- term: 接入密钥
  aliases:
  - 客户接入秘钥信息
  - 渠道密钥
  - cust_access_secret
  maps_to: cust_access_secret.id
  also_confused_with:
  - cust_sftp.channel
  - tenant_setting_config.db_tenant_code
  adjudication: boundary
  boundary: 接入密钥表存渠道、租户、证书路径；SFTP配置存文件传输账号；租户配置存租户业务配置，三者通过channel/db_tenant_code间接关联。
- term: 渠道
  aliases:
  - channel
  - 应用id
  - appId
  maps_to: cust_access_secret.channel
  also_confused_with:
  - cust_sftp.channel
  - cust_build_record.channel
  adjudication: boundary
  boundary: cust_access_secret.channel是开放接入渠道；cust_sftp.channel是文件通道；cust_build_record.channel是推送记录渠道。
- term: 数据租户标识
  aliases:
  - db_tenant_code
  - 数据租户
  - 租户编码
  maps_to: cust_access_secret.db_tenant_code
  also_confused_with:
  - cust_access_secret.app_tenant_code
  - tenant_setting_config.db_tenant_code
  adjudication: boundary
  boundary: db_tenant_code用于数据隔离与落库租户；app_tenant_code为逻辑租户标识，不能混用。
- term: 逻辑租户标识
  aliases:
  - app_tenant_code
  maps_to: cust_access_secret.app_tenant_code
  also_confused_with:
  - cust_access_secret.db_tenant_code
  adjudication: boundary
  boundary: app_tenant_code与db_tenant_code不同，接入定位使用db_tenant_code。
- term: 启用
  aliases:
  - enable
  - Y/N
  maps_to: cust_access_secret.enable
  also_confused_with:
  - tenant_setting_config.enable
  - cust_company_info.enable
  adjudication: boundary
  boundary: 不同表的enable是各自独立过滤条件，不能跨表复用。
- term: 自主建档
  aliases:
  - independentReg
  - 自主注册
  maps_to: cust_company_info.identify_style = 'INVITE'
  also_confused_with:
  - cust_company_info.identify_style = 'SELF'
  - cust_company_info.identify_style = 'INVITE_AGW'
  adjudication: boundary
  boundary: 代码independentReg实际setIdentifyStyle=INVITE；SELF是自主认证消息分支；INVITE_AGW是非自主/平台录入。
- term: 非自主建档
  aliases:
  - dependentReg
  - 平台录入
  maps_to: cust_company_info.identify_style = 'INVITE_AGW'
  also_confused_with:
  - cust_company_info.identify_style = 'INVITE'
  adjudication: boundary
  boundary: dependentReg落INVITE_AGW，与自主建档INVITE不同。
- term: 审核通过
  aliases:
  - CUST_CHECK_PASS
  - 已通过
  maps_to: cust_company_info.check_status = 'CUST_CHECK_PASS'
  also_confused_with:
  - cust_company_info.cust_build_status = 'BUILD_SUCCESS'
  adjudication: boundary
  boundary: check_status是运营中台审核态；cust_build_status是本地建档态，审核通过时联动BUILD_SUCCESS。
- term: 建档成功
  aliases:
  - BUILD_SUCCESS
  - 已通过
  maps_to: cust_company_info.cust_build_status = 'BUILD_SUCCESS'
  also_confused_with:
  - cust_company_info.cust_status = 'EFFECT'
  adjudication: boundary
  boundary: 建档成功同时可能将cust_status置EFFECT。
- term: 待客户确认
  aliases:
  - CUST_CONFIRM_AWAIT
  - AWAIT_CUST_CONFIRM
  maps_to: cust_company_info.cust_build_status = 'CUST_CONFIRM_AWAIT'
  also_confused_with:
  - cust_company_info.cust_build_status = 'AWAIT_CUST_CONFIRM'
  adjudication: boundary
  boundary: 邀请/自主流程用CUST_CONFIRM_AWAIT；简易认证代码用AWAIT_CUST_CONFIRM，需核对dictKey。
rules:
- name: 接入渠道必须存在且启用
  content: 开放API建档、变更、天马建档均按channel + enable=Y查询cust_access_secret，查不到即抛“渠道不存在”。
  impact: 接入请求拒绝，后续租户定位无法进行。
  field_targets:
  - cust_access_secret.channel
  - cust_access_secret.enable
  evidence: code:CustAccessApplication.validateSetValue/validateChangeChannelAndTenant/validateSetValueOfTianma
- name: 渠道所属租户必须存在且启用
  content: 取到渠道db_tenant_code后，再按db_tenant_code + enable=Y查询tenant_setting_config，查不到即抛“渠道所属租户不存在”。
  impact: 渠道配置不完整时接入失败。
  field_targets:
  - cust_access_secret.db_tenant_code
  - tenant_setting_config.db_tenant_code
  - tenant_setting_config.enable
  evidence: code:CustAccessApplication.validateSetValue/validateSetValueOfTianma
- name: 同租户同统一社会信用代码不可重复建档
  content: 普通接入按certification_no + db_tenant_code统计，且排除cust_build_status=BUILD_FAIL，命中则抛“企业已建档”。
  impact: 防止重复建档，失败建档允许复用。
  field_targets:
  - cust_company_info.certification_no
  - cust_company_info.db_tenant_code
  - cust_company_info.cust_build_status
  evidence: code:CustAccessApplication.validateSetValue/initCust
- name: 天马渠道重复建档校验更严格
  content: 天马建档分别按企业名称、信用代码、名称+信用代码组合校验，并排除已注销WRITEOFF；若已BUILD_SUCCESS则提示已通过其他方式完成建档，否则提示正在其他方式建档。
  impact: 天马渠道不允许重复或并行建档。
  field_targets:
  - cust_company_info.name
  - cust_company_info.certification_no
  - cust_company_info.db_tenant_code
  - cust_company_info.cust_build_status
  - cust_company_info.cust_status
  evidence: code:CustAccessApplication.validateSetValueOfTianma
- name: 非自主建档必传影像
  content: 非自主建档校验必须包含AUTHORIZATION_CERTIFICATE、LEGAL_FRONT、LEGAL_BACK、AUTHORIZER_FRONT、AUTHORIZER_BACK、BUSINESS_LICENSE对应影像。
  impact: 影像缺失时接入失败。
  field_targets: []
  evidence: code:CustAccessApplication.validateMedia
- name: 供应商银行账户三项必填
  content: companyType为SUPPLIER时，bankAccountName、bankAccountNo、unitedBankNumber不能为空。
  impact: 供应商接入缺少银行账户时失败。
  field_targets:
  - cust_account_info.account_name
  - cust_account_info.account_no
  - cust_account_info.bank_no
  evidence: code:CustAccessApplication.validateBank
- name: 手机号与身份证格式校验
  content: 手机号按^1[3-9]\d{9}$校验；身份证按18位规则校验；自主建档对空值放宽部分字段，非自主建档严格要求。
  impact: 格式不正确时接入失败。
  field_targets:
  - cust_person_info.phone
  - cust_person_info.certification_no
  - cust_company_info.legal_phone
  - cust_company_info.legal_certification_no
  evidence: code:CustAccessApplication.isValidPhoneNumber/isValidIDCard
- name: 建档提交异步且事务提交后触发
  content: CustAccessAsyncApplication.submit标记@Async，若有事务则注册afterCommit再调用submitCust；异常时将企业cust_status置WRITEOFF、cust_build_status置BUILD_FAIL、check_status置CUST_CHECK_REJECT。
  impact: 主请求不阻塞；异步异常会做失败状态补偿。
  field_targets:
  - cust_company_info.cust_status
  - cust_company_info.cust_build_status
  - cust_company_info.check_status
  evidence: code:CustAccessAsyncApplication.submit
- name: 渠道定位租户优先级
  content: query接口getDbTenantCode优先projectName查TenantProjectDO，其次projectId查TenantProjectDO，最后channel查cust_access_secret；注意channel查询未加enable=Y。
  impact: 查询渠道状态时可能命中禁用渠道，需REVIEW。
  field_targets:
  - tenant_project.name
  - tenant_project.id
  - cust_access_secret.channel
  - cust_access_secret.db_tenant_code
  evidence: code:CustAccessApplication.getDbTenantCode
- name: 建档状态查询映射
  content: query/batchQuery按企业名称、信用代码、租户、企业类型模糊匹配；查不到返回CUST404；再按check_status映射CUSTS001/CUSTS002/CUSTS003/CUSTS004/CUSTS005及AUTH0001/AUTH0003。
  impact: 对外状态查询结果依赖check_status与cust_build_status组合。
  field_targets:
  - cust_company_info.name
  - cust_company_info.certification_no
  - cust_company_info.db_tenant_code
  - cust_company_info.cust_company_type
  - cust_company_info.check_status
  - cust_company_info.cust_build_status
  evidence: code:CustAccessApplication.query/batchQuery/getCheckStatus
- name: status_query_license_enabled控制营业执照返回与SFTP同步
  content: DB字段注释表明Y时建档状态查询返回营业执照并同步SFTP，但给定代码链路未读取该字段。
  impact: 行为未在代码中确认，需REVIEW。
  field_targets:
  - cust_access_secret.status_query_license_enabled
  evidence: db:cust_access_secret.status_query_license_enabled comment/value
- name: 运营平台企业ID取值以角色表优先
  content: resolveBuildPlatformCustIdForOper同时查cust_build_record.plat_cust_id与cust_role_info.platform_cust_id；不一致时告警并以cust_role_info为准。
  impact: 变更/终止流程使用平台企业ID时需避免取错。
  field_targets:
  - cust_role_info.platform_cust_id
  - cust_build_record.plat_cust_id
  evidence: code:CustAccessApplication.resolveBuildPlatformCustIdForOper
reqdoc_claims:
- claim: 企业准入流程：提交准入申请后自动审核或人工审核，通过/驳回后更新企业状态并通知。
  code_status: confirmed
  code_evidence: code_path:CustAccessApplication.java:reg/submitCust + CustAccessAsyncApplication.java:submit
    + CustCompanyInfoApplication.java:submitCust/messageNotify + reqdoc:客户管理平台业务规则文档.md#2.1
  action: anchor
- claim: 自动审核规则：企业征信评分>=60、法人无不良记录、经营状态正常、行业不在黑名单。
  code_status: uncovered
  code_evidence: 给定链路未见AutoVerifyService全文或评分/黑名单判断
