  action: anchor
- claim: 监听器子接口：租户、项目、产品、角色、协议等扩展监听器（PlatTenantEventListener/PlatProjectEventListener/PlatProductEventListener等）均继承基接口
  code_status: confirmed
  code_evidence: PlatTenantEventListener.java / PlatProjectEventListener.java / PlatProductEventListener.java
  action: anchor
- claim: PlatProjectEventListener 提供 queryProject/importProject/queryProjectLandTime
    等查询与导入契约
  code_status: confirmed
  code_evidence: PlatProjectEventListener.java
