relation_audit:
- left: PlatProductEventListener
  right: IPlatListener
  kind: extends
  verdict: confirm
  evidence: PlatProductEventListener.java:public interface PlatProductEventListener
    extends IPlatListener<PlatProductEvent>
  note: 泛型 <PlatProductEvent>
- left: PlatProjectEventListener
  right: IPlatListener
  kind: extends
  verdict: confirm
  evidence: PlatProjectEventListener.java:extends IPlatListener<PlatProjectEvent>
  note: 额外定义 queryProject/importProject/queryProjectLandTime 默认方法
- left: PlatTenantEventListener
  right: IPlatListener
  kind: extends
  verdict: confirm
  evidence: PlatTenantEventListener.java:extends IPlatListener<PlatTenantEvent>
  note: 仅覆写 onEvent
- left: CustSyncEventProvider
  right: CustEventListener
  kind: implements
  verdict: confirm
  evidence: CustSyncEventProvider.java:@DubboService(interfaceClass = CustEventListener.class),
    public class CustSyncEventProvider implements CustEventListener
  note: 运营中台→产融 Dubbo 服务，非 lowcode-client 的 IPlatListener 体系
- left: TmCustEventListener
  right: ITmCustEventListener
  kind: implements
  verdict: confirm
  evidence: TmCustEventListener.java:@DubboService, implements ITmCustEventListener
  note: 天马客户信息同步，落 TianmaService.companyArchiveDetail
- left: CheckBusiOnWayService
  right: BaseClientSyncService
  kind: extends
  verdict: confirm
  evidence: CheckBusiOnWayService.java:extends BaseClientSyncService<CheckBusiOnWayDto,BusiOnWayDto,Void>
    且 @Rpc(RpcPoint.CUST_CHECK_BUSI_ON_WAY)
  note: 服务路由注解 @Rpc 决定 RpcGroup+RpcPoint
- left: CustSyncEventProvider.onEvent
  right: CustSyncEventProcessor.doEvent
  kind: derived
  evidence: CustSyncEventProvider.java:processCustEvent(custSyncEventProcessor.doEvent(event,isChangeBroadcast))
