field_semantics:
- table: client_api_sync_error
  field: id
  meaning: 表主键
  evidence: db
- table: client_api_sync_error
  field: service_class_name
  meaning: 失败的客户端同步服务类名，标识具体同步链路（客户/经办人/影像/产品/租户/项目/KA等），实测 TopK 以 ClientCustSyncService(1453)
    与 ClientOperatorSyncService(555) 为最多
  evidence: db
- table: client_api_sync_error
  field: retry_num
  meaning: 已重试次数，实测存量记录常驻 3（达最大重试上限）
  evidence: db
- table: client_api_sync_error
  field: enable
  meaning: 启用标识，表默认 Y，但实测存量失败记录全为 N（失败记录登记后置 N）
  evidence: db
- table: client_api_sync_error
  field: param
  meaning: RPC 调用的请求参数原文
  evidence: code
- table: client_api_sync_error
  field: name
  meaning: 名称/标签，实测出现“直推变更回调连通性”等自检标签
  evidence: db
- table: client_api_sync_error
  field: remark
  meaning: 备注，实测出现 self-test retry 等自检说明
  evidence: db
- table: client_api_sync_error
  field: app_tenant_code
  meaning: 逻辑租户标识，实测恒为 base
  evidence: db
- table: client_api_sync_error
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: db
- table: client_api_sync_error
  field: act_procinst_id
  meaning: 运营中台流程实例ID
  evidence: db
- table: client_api_sync_error
  field: act_procinst_no
  meaning: 流程申请编号
  evidence: db
- table: client_api_sync_error
  field: act_procinst_status
  meaning: 当前审批状态
  evidence: db
- table: client_api_sync_error
  field: act_procinst_date
  meaning: 审批结束时间
  evidence: db
- table: cust_build_record
  field: retryStatus
  meaning: 建档异步流程补偿重试状态（PENDING/RETRYING/SUCCESS/FAILED）
  evidence: code
- table: cust_build_record
  field: remark
  meaning: 补偿标记：COMPENSATION_FILE_PUSH_FAIL / COMPENSATION_START_FLOW_FAIL，重试成功追加
    _RETRY_SUCCESS，达上限追加 _FAILED_MAX_RETRY_n
  evidence: code
- table: cust_build_record
  field: pushData
  meaning: RegAsyncContext 序列化 JSON，供补偿任务反序列化后重放 orchestrateAsync
  evidence: code
- table: cust_build_record
  field: returnData
  meaning: 错误信息 JSON（failType/errorMessage/errorCode/stackTrace/retryCount/lastRetryTime）
  evidence: code
- table: cust_build_record
  field: dbTenantCode
  meaning: 建档企业所属数据租户，补偿任务据此切换租户上下文
  evidence: code
state_machines:
- name: 建档异步补偿重试状态
  field: cust_build_record.retry_status
  states:
  - value: PENDING
    label: 待重试
    source: code_const
  - value: RETRYING
    label: 重试中
    source: code_const
  - value: SUCCESS
    label: 重试成功
    source: code_const
  - value: FAILED
    label: 重试失败/放弃
    source: code_const
  transitions:
  - from: (新建)
    event: saveCompensationRecord
    to: PENDING
    evidence: code_path:RegAsyncService.java:saveCompensationRecord
  - from: PENDING
    event: xxl-job 命中补偿记录
    to: RETRYING
    evidence: code_path:RegAsyncCompensationJobHandler.java:processCompensationRecord(record.setRetryStatus(RETRYING))
  - from: RETRYING
    event: retryCompensation 成功
    to: SUCCESS
    evidence: code_path:RegAsyncCompensationJobHandler.java:handleRetrySuccess
  - from: RETRYING
    event: 重试失败且 retryCount<maxRetryCount
    to: PENDING
    evidence: code_path:RegAsyncCompensationJobHandler.java:updateRetryCount(setRetryStatus(PENDING))
  - from: RETRYING
    event: retryCount>=maxRetryCount 或类型未知
    to: FAILED
    evidence: code_path:RegAsyncCompensationJobHandler.java:markAsFailed
- name: 运营中台客户事件检查状态
  field: ClientCustEvent.custEnterprise.checkStatus
  states:
  - value: CUST_CHECK_INIT
    label: 提交/审核发起
    source: code_const
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_const
  - value: CUST_CHECK_REJECT
    label: 审核拒绝
    source: code_const
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户确认
    source: code_const
  transitions:
  - from: CUST_CHECK_PASS
    event: 外部回调 onEvent(isChangeBroadcast=false)
    to: (跳过/由工作流执行器处理)
    evidence: code_path:CustSyncEventProvider.java:onEvent
  - from: CUST_CHECK_REJECT
    event: 外部回调 onEvent(isChangeBroadcast=false)
    to: (跳过/由工作流执行器处理)
    evidence: code_path:CustSyncEventProvider.java:onEvent
  - from: (其它)
    event: processCustEvent → custSyncEventProcessor.doEvent
    to: 按客户事件类型落库
    evidence: code_path:CustSyncEventProvider.java:processCustEvent
- name: 客户建档状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始
    source: code_const
  - value: BUILD_FAIL
    label: 审核拒绝/建档失败
    source: code_const
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认/待提交审核
    source: code_const
  - value: CUST_BUILDING
    label: 运营中台审核中
    source: code_const
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_const
  - value: AWAIT_CUST_CONFIRM
    label: 简易认证待确认
    source: code_const
  transitions:
  - from: INIT/BUILD_FAIL
    event: 邀请认证客户录入提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify/updateCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交运营中台
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: CUST_BUILDING
    event: 审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
calibers:
- name: 同步失败记录存量口径
  predicate: client_api_sync_error.enable = 'N'
  scope: 存量 2227 行全部为 N，作为“已登记失败/已终止重试”记录保留
  evidence: db
- name: 补偿记录筛选
  predicate: cust_build_record.remark LIKE 'COMPENSATION_%'
  scope: xxl-job 只处理 remark 以 COMPENSATION_ 开头的记录
  evidence: code:RegAsyncCompensationJobHandler.java:getCompensationRecords
- name: 补偿重试任务状态筛选
  predicate: cust_build_record.retry_status IN ('PENDING','RETRYING')
  scope: xxl-job regAsyncCompensationJobHandler 待重试集合
  evidence: code:RegAsyncCompensationJobHandler.java:getCompensationRecords
- name: 经办人角色冻结口径
  predicate: sys_cust_user_rel.is_freeze = 'Y'
  scope: DELETE 且同手机号既为经办人又为管理员时，仅冻结经办人记录对应 accountNormal 角色关联
  evidence: code:CustSyncEventProvider.java:syncOperatorUser
term_bridges:
- term: 重试次数
  aliases:
  - retryNum
  - retryCount
  - 重试计数
  maps_to: client_api_sync_error.retry_num
  also_confused_with:
  - cust_build_record.return_data(retryCount)
  adjudication: boundary
  boundary: client_api_sync_error 用独立列 retry_num；cust_build_record 无独立列，重试次数塞在 returnData
    JSON 的 retryCount 中
- term: 逻辑租户
  aliases:
  - appTenantCode
  - AppTenantCode
  maps_to: client_api_sync_error.app_tenant_code
  also_confused_with:
  - client_api_sync_error.db_tenant_code
  adjudication: boundary
  boundary: app_tenant_code 为逻辑/应用租户标识（实测 base），db_tenant_code 为数据隔离租户
- term: 数据租户
  aliases:
  - dbTenantCode
  - db_tenant_code
  maps_to: client_api_sync_error.db_tenant_code
  also_confused_with:
  - client_api_sync_error.app_tenant_code
  adjudication: boundary
  boundary: MetaDataThreadLocalConfig.setDbTenantCode 使用 db_tenant_code；全量查询用 'all'
- term: 启用标识
  aliases:
  - enable
  - EnableEnum
  maps_to: client_api_sync_error.enable
  also_confused_with:
  - cust_company_info.enable
  adjudication: synonym
  boundary: 统一由 EnableEnum(Y/N) 表达
rules:
- name: 外部回调不处理 PASS/REJECT
  content: onEvent(isChangeBroadcast=false) 时若 checkStatus 为 CUST_CHECK_PASS 或 CUST_CHECK_REJECT，直接
    return，交由工作流审核执行器 CustWorkflowAuditCommitProcessor 处理
  impact: 避免与工作流审核双写；变更广播 isChangeBroadcast=true 时仍走本方法
  field_targets: []
  evidence: code:CustSyncEventProvider.java:onEvent
- name: 补偿重试上限规则
  content: retryCount>=maxRetryCount(默认3) → markAsFailed；否则 retryStatus 重置 PENDING、retryCount+1
    并写 lastRetryTime
  impact: 决定补偿记录是否最终放弃
  field_targets:
  - cust_build_record.retry_status
  - cust_build_record.return_data
  evidence: code:RegAsyncCompensationJobHandler.java:updateRetryCount
- name: 补偿失败类型识别
  content: 按 remark 是否包含 FILE_PUSH_FAIL / START_FLOW_FAIL 判定失败类型，重试时整体重放 regAsyncService.orchestrateAsync(context)
  impact: 补偿任务按失败类型定位但重试粒度为全流程
  field_targets:
  - cust_build_record.remark
  evidence: code:RegAsyncCompensationJobHandler.java:extractFailType/retryCompensation
- name: 经办人同步操作分支
  content: INSERT/UPDATE→addOperator/editOperator；FREEZE/THAW/DELETE→走冻结/解冻；DELETE
    且同手机号既为经办人又为管理员时，仅将经办人记录 enable=N 并冻结其对 accountNormal 角色的 SysCustUserRel
  impact: 避免误冻管理员权限
  field_targets:
  - cust_person_info.enable
  - sys_cust_user_rel.is_freeze
  evidence: code:CustSyncEventProvider.java:syncOperatorUser
- name: 企业状态同步口径
  content: FREEZE→CustStatusEnum.FREEZE；UNFREEZE→EFFECT；DISABLE→WRITEOFF，同时 clientCustStatusSyncService.call
    与逐联系人 clientUserStatusSyncService.call
  impact: 企业状态变更联动用户冻结/解冻
  field_targets: []
  evidence: code:CustCompanyInfoApplication.java:custStatusSync/userStatusSync
- name: 简易认证不支持开通电子签章
  content: 简易认证提交时若 needRegisterCa=Y，强制校正为不开通并落库（CustCompanyCaPolicy.enforceMustNotOpenCa）
  impact: 阻断简易认证走 CA 开通
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  evidence: code:CustCompanyInfoApplication.java:submitForSimpleAuth
- name: 客户同步按角色维度
  content: syncByRoleOn=true 时按企业全部角色同步，false 时仅同步指定 companyType 对应角色；每次同步先 MetaDataThreadLocalConfig.setDbTenantCode(dbTenantCode)
  impact: 决定同步广播范围
  field_targets: []
  evidence: code:CustSyncService.java:getRoles/syncByRole
reqdoc_claims:
- claim: 用户邀请→激活→同步用户到 SSO、同步用户到 AMS 运营中台
  code_status: confirmed
  code_evidence: CustSyncEventProvider.java:syncOperatorUser
  action: anchor
- claim: 企业准入审核通过则更新企业状态为已通过，驳回则更新为已驳回
  code_status: confirmed
  code_evidence: CustCompanyInfoApplication.java:updateCustBuildStatus
  action: anchor
- claim: 企业信息变更流程：创建变更记录（待提交）→审核→生效/驳回
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 权限与角色管理：管理员配置角色、分配菜单/数据权限、用户按角色加载
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 企业名称/统一社会信用代码同一租户下唯一
  code_status: uncovered
  code_evidence: CustCompanyInfoApplication.java:importCustCompany(存在“录入统一社会信用代码已存在”校验，但唯一性为租户维度)
  action: prose_only
