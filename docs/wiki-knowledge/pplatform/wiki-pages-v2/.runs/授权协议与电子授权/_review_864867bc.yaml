body: 源语义分析在第八条规则处被截断（`field_targets` 与 `evidence` 不完整）。本页 `field_targets` 中的 `cust_company_info.need_register_ca`、`cust_company_info.identify_style`
  与 `evidence` 的 `code:CustCompanyCaPolicy.java:enforceMustNotOpenCa` 系依据 rule content
  中逐字出现的字段名与类名补全，需与 extract 结果核对确认。
title: 简易认证强制关闭电子签章
type: rule
