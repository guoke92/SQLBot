field_semantics:
- table: argeement_migratory_record
  field: status
  meaning: 协议迁移拉取状态：'0'（BooleanEnum.no）=待拉取/未处理；'1'（BooleanEnum.yes）=拉取流程已结束（客户端返回了协议，或确认客户端无该协议后置终态，置
    1 后不再进入待拉取队列）
  evidence: db
- table: argeement_migratory_record
  field: pull_num
  meaning: 已拉取尝试次数；pull() 只捞 pull_num < 配置值（cust.agreemeent.pull.num，默认 20）的记录，失败时
    +1
  evidence: code
- table: argeement_migratory_record
  field: is_new
  meaning: 是否新数据：'yes'/'no'（BooleanEnum.name()）；迁移初始化写 isNew，用于区分新老渠道协议
  evidence: db
- table: argeement_migratory_record
  field: sign_mode
  meaning: 协议签署模式，语义对应 SignModeEnum 三态（NO_SIGN / OFF_LINE / ON_LINE）；DB 实存 '01' /
    '02' / '03'，代码未给出数值与枚举的显式映射
  evidence: db
- table: argeement_migratory_record
  field: agreement_type
  meaning: 协议类型 key（AgreementDocType.getAgreementType()）：BS_Auth（AMS 上上签）/CFCA_Auth/ProductProtocol*/CustPersonLicense/UserProtocol/PrivacyPolicy
  evidence: db
- table: argeement_migratory_record
  field: agreement_path
  meaning: 协议文件在对象存储（COS，FBP_SYSTEM 桶）的存储路径；为空表示未取到文件，createContractInfo 会过滤掉
  evidence: code
- table: argeement_migratory_record
  field: agreement_no
  meaning: 协议编号（客户端 contractAgreementNo），agreementExist 用它做合同表判重，避免重复迁移
  evidence: code
- table: argeement_migratory_record
  field: platform_product_code
  meaning: 产品编码（AMS/ACFLOW/BEECREDIT/ORDER/RVSFACTOR_PC/STORAGE/VOUCHER），决定拉取哪一产品的协议及产品协议类型映射
  evidence: db
- table: authorization_agreement
  field: authed_status
  meaning: 授权书认证状态：'Y'=已授权，'N'=未授权；DDL 默认 '0'，实测仅 N/Y 两值。平台级（platform_product_code='PLATFORM'）为
    Y 即视为企业已完成授权
  evidence: db
- table: authorization_agreement
  field: platform_product_code
  meaning: 授权所属产品编码；'PLATFORM' 为平台级授权书（代码常量 PLATFORM_PRODUCT_TYPE），其余为具体业务产品（ACFLOW/AMS/ORDER/RVSFACTOR_PC…）的存量授权
  evidence: db
- table: authorization_agreement
  field: creation_type
  meaning: 授权书产生场景/创建类型。DB 实测 AUTO、COMPANY_MANAGER_CHANGE_CODE、CUST_BUILD_INIT；代码在管理员变更场景写入
    AuthAgreementCreationTypeEnum.CHANGE_COMPANY_MANAGER.getDictKey()，建档场景写 CUST_BUILD_INIT
  evidence: db
- table: authorization_agreement
  field: enable
  meaning: 记录有效标志；企业管理员发生变更时，原管理员的全部授权记录被置为 'N' 并同时把 authed_status 置 N
  evidence: db
- table: authorization_agreement
  field: cust_manager_id
  meaning: 企业管理员用户 id（sys/SSO userId）；授权按人（userid）维度判定，同人多企业角色只需一份平台级授权
  evidence: code
- table: authorization_agreement
  field: cust_id
  meaning: 产融侧企业 id（cust_company_info.id）
  evidence: code
- table: authorization_agreement
  field: company_type
  meaning: 企业角色，一般单值（SUPPLIER/CORE/FINANCE/PROJECT_COMPANY…）；DB 存在 '["CORE"]' 这类 JSON
    数组形态异常值
  evidence: db
- table: authorization_agreement
  field: original_cust_id
  meaning: 源系统 custId，仅存量迁移产生的授权记录有值
  evidence: db
- table: authorization_agreement
  field: act_procinst_id
  meaning: 流程实例 ID；简易认证无流程实例，createAuthorizationAgreement 遇到空 actProcinstId 直接返回不落表
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通电子签章（CFCA）：'Y'=需开通；与 ca_register_status 一起构成 isCaRegistered 判定
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CFCA 开通状态：'Y'=已开通；线下电子授权书签署的前置条件（若正在重开 CA，则等开通成功后链式触发签署）
  evidence: code
- table: cust_company_info
  field: need_register_bs
  meaning: 是否需要开通上上签（BestSign）：AMS 产品走 BS 通道，setSignRegister 中 AMS 会把 needRegisterBs
    置 'Y'
  evidence: code
- table: cust_company_info
  field: bs_register_status
  meaning: 上上签开通状态：'Y'=已开通；AMS 产品线幂等判断依据
  evidence: code
- table: cust_company_info
  field: cust_source
  meaning: 建档数据来源（CustSourceEnum）：PLATFORM_PUSH=外部平台推送（免补签授权书）、MIGRATORY=存量迁移等
  evidence: code
- table: cust_company_info
  field: migarory_auth_aggrement_flag
  meaning: 迁移到授权书新渠道标识：存量迁移走新渠道时置 'Y'
  evidence: code
- table: cust_company_info
  field: auth_aggrement_supplement_flag
  meaning: 是否需展示/允许授权书补签：旧渠道迁移置 'Y'（需补签），新渠道置 'N'（不需补签）；updateAuthAggrementFlag 可人工翻转
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证方式（IdentifyTypeConstant）：INVITE=邀请认证客户录入、INVITE_AGW=邀请认证平台录入、SELF=自主注册、SIMPLE=简易认证
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 建档/认证状态（CustBuildStatusEnum）：INIT/CUST_CONFIRM_AWAIT/CUST_BUILDING/BUILD_SUCCESS/BUILD_FAIL
    等
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 审核（运营中台）状态：'CUST_CHECK_PASS'=审核通过，是电子授权书签署编排的硬条件之一
  evidence: code
- table: cust_company_info
  field: sign_mode
  meaning: 产品协议签署方式（企业维度）
  evidence: code
- table: tenant_setting_config
  field: generate_electronic_auth_flag
  meaning: 租户是否开启线下授权书电子签约版能力：'Y'=开启；未开启/为空/查询异常一律按关闭处理（保持现网跳过签署行为）
  evidence: code
- table: cust_change_record
  field: alter_mode
  meaning: 变更方式（AlterModeEnum）：SELF_ALTER=企业自行变更（可触发电子授权签署）、PLAT_ALTER=平台代变更
  evidence: code
- table: cust_change_record
  field: alter_type_id
  meaning: 变更项配置 id 列表（逗号分隔，对应 cust_change_cfg.id），据此反查 item_code 判断变更项是否在允许签署范围
  evidence: code
- table: cust_change_cfg
  field: item_code
  meaning: 变更项编码，如 UN0008/UN0012/UN0013/UN0015/UN0016
  evidence: code
state_machines:
- name: 授权书认证状态
  field: authorization_agreement.authed_status
  states:
  - value: N
    label: 未授权/待授权
    source: db_dist
  - value: Y
    label: 已授权
    source: db_dist
  transitions:
  - from: N
    event: 建档通过/完善资料时的管理员认证（含简易认证直接通过）
    to: Y
    evidence: code_path:CustAuthAgreementDomainService.java#passAuthorizationAgreementDirectly
  - from: N
    event: 企业管理员变更（换人），为新管理员建/更新平台级授权记录
    to: Y
    evidence: code_path:CustAuthAgreementDomainService.java#changeAuthorizationAgreement
  - from: Y
    event: 企业管理员变更，原管理员所有授权记录被禁用
    to: N
    evidence: code_path:CustAuthAgreementDomainService.java#disabledAllAuthorizationAgreement
- name: 协议迁移拉取状态
  field: argeement_migratory_record.status
  states:
  - value: '0'
    label: 待拉取（BooleanEnum.no）
    source: code_enum
  - value: '1'
    label: 拉取结束/不再拉取（BooleanEnum.yes；含客户端确认无此协议）
    source: code_enum
  transitions:
  - from: '0'
    event: 拉取到协议并落库，或客户端返回该类型协议缺失
    to: '1'
    evidence: code_path:AgreementMigratoryService.java#setAgreement
  - from: '0'
    event: 拉取失败（异常/返回空），主记录回置 no 且 pullNum+1
    to: '0'
    evidence: code_path:AgreementMigratoryService.java#setStatus
- name: 协议签署模式
  field: argeement_migratory_record.sign_mode
  states:
  - value: '01'
    label: 签署模式取值之一（对应 SignModeEnum 的 NO_SIGN/OFF_LINE/ON_LINE，数值映射代码未显式给出）
    source: db_dist
  - value: '02'
    label: 签署模式取值之一（同上）
    source: db_dist
  - value: '03'
    label: 签署模式取值之一（同上）
    source: db_dist
  transitions: []
- name: 客户建档/认证状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 待提交/初始化
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: CUST_BUILDING
    label: 认证审核中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 认证通过
    source: code_enum
  - value: BUILD_FAIL
    label: 认证驳回
    source: code_enum
  transitions:
  - from: INIT
    event: 提交（邀请-客户录入/自主注册）
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#getCustBuildStatus
  - from: INIT
    event: 提交（邀请-平台录入 INVITE_AGW）
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户在客户端提交，进入运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核驳回
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify
calibers:
- name: 外部推送企业免补签授权书
  predicate: cust_company_info.cust_source = 'PLATFORM_PUSH'
  scope: 授权书补签判定（enableCompanyManagerAuthAggrement / hasCompanySignedAuthAggrement
    直接返回不需签约）
  evidence: code_path:CustAuthAgreementDomainService.java#enableCompanyManagerAuthAggrement
- name: 存量迁移企业免补签授权书
  predicate: cust_company_info.cust_source = 'MIGRATORY' AND cust_company_info.auth_aggrement_supplement_flag
    = 'N'
  scope: 授权书补签判定
  evidence: code_path:CustAuthAgreementDomainService.java#enableCompanyManagerAuthAggrement
- name: 平台级授权已完成
  predicate: authorization_agreement.platform_product_code = 'PLATFORM' AND authorization_agreement.authed_status
    = 'Y'
  scope: 企业/管理员是否已签署平台授权书（按人维度，一个角色签过即全部免签）
  evidence: code_path:CustAuthAgreementDomainService.java#hasCompanySignedAuthAggrement
- name: 线下电子授权书签署触发条件
  predicate: cust_company_info.check_status = 'CUST_CHECK_PASS' AND <企业用户>.auth_model
    = 'off_auth' AND tenant_setting_config.generate_electronic_auth_flag = 'Y' AND
    cust_company_info.need_register_ca = 'Y' AND cust_company_info.ca_register_status
    = 'Y'
  scope: 审核回调 afterCommit 编排；不满足仅记日志跳过，不阻断主流程
  evidence: code_path:CustAuthSignOrchestrationApplication.java#evaluateIneligibilityReason
- name: 可触发电子授权签署的企业类型
  predicate: cust_company_info.cust_company_type ∈ {'SUPPLIER','CORE','FINANCE','PROJECT_COMPANY'}
  scope: 电子授权书签署编排
  evidence: code_path:CustAuthSignOrchestrationApplication.java#ALLOWED_COMPANY_TYPE_KEYS
- name: 建档类签署仅限邀请/自主录入
  predicate: cust_company_info.identify_style ∈ {'INVITE','SELF'}
  scope: processType=CHECK 分支
  evidence: code_path:CustAuthSignOrchestrationApplication.java#ALLOWED_BUILD_IDENTIFY_STYLES
- name: 变更类签署仅限企业自行变更且变更项命中
  predicate: cust_change_record.alter_mode = 'SELF_ALTER' AND cust_change_cfg.item_code
    ∈ {'UN0016','UN0012','UN0013','UN0008','UN0015'}
  scope: processType=CHANGE 分支
  evidence: code_path:CustAuthSignOrchestrationApplication.java#isAllowedChangeScenario
- name: 待拉取协议记录
  predicate: argeement_migratory_record.status = '0' AND argeement_migratory_record.enable
    = 'Y' AND argeement_migratory_record.pull_num < 20
  scope: 协议拉取定时任务（20 为 cust.agreemeent.pull.num 默认值）
  evidence: code_path:AgreementMigratoryService.java#pull
- name: AMS 走 BS/上上签通道
  predicate: argeement_migratory_record.platform_product_code = 'AMS' → agreement_type
    = 'BS_Auth'；其他产品 → agreement_type = 'CFCA_Auth'
  scope: 协议迁移初始化与签署机构选择（BEST_SIGN vs PAPER_LESS）
  evidence: code_path:PlatFormMigratoryApplication.java#getCaAgreement
- name: 迁移初始化五类协议
  predicate: argeement_migratory_record.agreement_type IN ('CFCA_Auth'|'BS_Auth',
    产品协议, 'CustPersonLicense', 'UserProtocol', 'PrivacyPolicy')
  scope: 每个客户×每个产品各生成一条待拉取记录（按 custId+productCode+type 计数为 0 才插入）
  evidence: code_path:PlatFormMigratoryApplication.java#setAgreementMigratory
term_bridges:
- term: 授权书
  aliases:
  - 授权确认书
  - 授权协议
  - 客户管理员授权认证
  - 企业授权书
  maps_to: authorization_agreement（表注释：授权确认书表）——记录企业管理员是否完成平台/产品级授权，authed_status=Y
    视为已授权
  also_confused_with:
  - 线下电子授权书（OfflineElectronicAuth 协议文件）
  - 平台协议文本（用户协议/隐私政策）
  adjudication: boundary
  boundary: authorization_agreement 是「谁授过权」的关系记录；线下电子授权书是「授权书这一份文件」的生成与签章，二者通过 cust_id
    关联但生命周期不同
- term: 协议
  aliases:
  - 用户协议
  - 隐私政策
  - 产品协议
  - CA 协议
  - BS 协议
  maps_to: argeement_migratory_record（协议迁移记录）+ 底层 BaseContractProvider/IContractInfoProvider
    维护的合同表；agreement_type 取 AgreementDocType
  also_confused_with:
  - 授权书
  adjudication: boundary
  boundary: 协议是文本文件与签署事实（含 sign_mode、agreement_path、agreement_no）；授权书是管理员授权状态记录，不含文件落库
- term: 线下电子授权书
  aliases:
  - 电子签约版授权书
  - OfflineElectronicAuth
  maps_to: 预览接口生成的 OfflineElectronicAuth ON_LINE 合同，由 custDocFacade.signOfflineElectronicAuthAndUpload
    签署并上传影像 A0050；是否启用由 tenant_setting_config.generate_electronic_auth_flag 控制
  also_confused_with:
  - authorization_agreement 授权记录
  - 线下纸质授权书（现网 OFF_AUTH 直接跳过签署）
  adjudication: boundary
  boundary: 开关为 N 时该方法直接返回 true（保持现网线下纸质行为），不会产生电子合同
- term: 线下授权（off_auth）
  aliases:
  - OFF_AUTH
  - 线下签署模式
  maps_to: CustEnterpriseUserDTO.authModel = AuthModel.OFF_AUTH.getCode()（代码注释与日志字面为
    off_auth），签署编排的硬条件之一
  also_confused_with:
  - 线上签署（on_auth）
  - 邀请认证-平台录入（业务上必然线下签署）
  adjudication: boundary
  boundary: authModel 是企业用户在运营中台的授权模式；与企业建档方式 identify_style 正交
- term: CA / CFCA
  aliases:
  - 电子签章
  - 数字证书
  - PAPER_LESS
  maps_to: cust_company_info.need_register_ca / ca_register_status；非 AMS 产品走 CFCA（SignAgencyTransferEnum.PAPER_LESS），协议类型
    DATA_SOURCE_CFCA_AUTH
  also_confused_with:
  - 上上签 / BS（BEST_SIGN）
  adjudication: boundary
  boundary: AMS 产品走 BS：need_register_bs / bs_register_status、协议类型 BS_Auth、签署机构 BEST_SIGN；两者开通过程在
    openCa 中互斥判断
- term: 平台产品编码 PLATFORM
  aliases:
  - 平台级授权书
  - PLATFORM_PRODUCT_TYPE
  maps_to: authorization_agreement.platform_product_code = 'PLATFORM'，表示平台级授权而非某个业务产品的存量授权
  also_confused_with:
  - 业务产品编码（ACFLOW/AMS/ORDER/RVSFACTOR_PC…）
  adjudication: boundary
  boundary: 是否补签只看 PLATFORM 行；具体产品行的 Y 表示存量系统已授权，用于免补签判定
rules:
- name: 电子授权书签署编排前置条件（全满足才签署）
  content: checkStatus=CUST_CHECK_PASS；企业用户 authModel=off_auth；租户 generate_electronic_auth_flag=Y；企业类型
    ∈{SUPPLIER,CORE,FINANCE,PROJECT_COMPANY}；流程为建档（identifyStyle ∈{INVITE,SELF}）或企业自行变更（alterMode=SELF_ALTER
    且变更项命中 UN0016/UN0012/UN0013/UN0008/UN0015）；need_register_ca=Y 且 ca_register_status=Y。任一不满足仅记日志跳过。
  impact: 不阻断 CustSyncEventProcessor 主流程；CA 未开通时等待重开 CA 成功后链式触发
  field_targets:
  - cust_company_info.check_status
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.identify_style
  - cust_change_record.alter_mode
  - cust_change_cfg.item_code
  - tenant_setting_config.generate_electronic_auth_flag
  evidence: code_path:CustAuthSignOrchestrationApplication.java#evaluateIneligibilityReason
- name: 签署幂等与并发控制
  content: 以 cust_auth_sign_done:{sourceMainId}:{appNo} 作为已完成标记，以 cust_auth_sign_after_audit:{sourceMainId}:{appNo}
    做 Redis 分布式锁（默认获取超时 1000ms、锁超时 120000ms）；签署成功才写 done 标记，失败仅记日志。
  impact: 重复回调/并发回调不会重复签署；签署失败不回滚审核主流程
  field_targets:
  - cust_company_info.id
  - cust_company_info.app_no
  evidence: code_path:CustAuthSignOrchestrationApplication.java#executeOfflineElectronicAuthSignSafely
- name: 租户开关关闭时保持现网行为
  content: tenant_setting_config.generate_electronic_auth_flag 非 Y（含配置不存在、为空、查询异常）时，signOfflineElectronicAuthOnLine
    直接返回 true，不做 CFCA 校验也不发起签署。
  impact: 开关是灰度/回退的唯一入口
  field_targets:
  - tenant_setting_config.generate_electronic_auth_flag
  evidence: code_path:ElectronicAuthLetterApplication.java#isGenerateElectronicAuthEnabled
- name: 简易建档不支持开通电子签章
  content: 简易认证提交时若 need_register_ca=Y，强制按 CustCompanyCaPolicy.enforceMustNotOpenCa
    校正并落库 need_register_ca/ca_register_status/need_register_bs/bs_register_status。
  impact: 简易认证企业不会触发电子签章相关协议与签署
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.need_register_bs
  - cust_company_info.bs_register_status
  evidence: code_path:CustCompanyInfoApplication.java#submitForSimpleAuth
- name: 授权书按人（管理员 userid）维度判定
  content: 同一个人多企业角色只需一份平台级授权；已存在 PLATFORM 且 authed_status=Y 即免补签，其次看该产品存量授权是否 Y。
  impact: 避免多角色重复签署授权书
  field_targets:
  - authorization_agreement.cust_manager_id
  - authorization_agreement.platform_product_code
  - authorization_agreement.authed_status
  evidence: code_path:CustAuthAgreementDomainService.java#enableCompanyManagerAuthAggrement
- name: 授权书记录唯一性
  content: authorization_agreement 唯一索引为 (db_tenant_code, act_procinst_id, cust_id,
    cust_manager_id, platform_product_code, company_type)，即「租户+流程实例+企业+管理员+产品+角色」唯一。
  impact: saveOrUpdate 语义按该维度幂等；角色不同会各留一条
  field_targets:
  - authorization_agreement.db_tenant_code
  - authorization_agreement.act_procinst_id
  - authorization_agreement.cust_id
  - authorization_agreement.cust_manager_id
  - authorization_agreement.platform_product_code
  - authorization_agreement.company_type
  evidence: db
- name: 简易认证不创建授权书记录、直接置为已授权
  content: createAuthorizationAgreement 在 actProcinstId 为空或企业为简易建档类型时直接 return；简易认证/资金方直接生效路径调用
    passAuthorizationAgreementDirectly 写 authed_status=Y。
  impact: 简易认证企业无授权书流程记录但有授权结果
  field_targets:
  - authorization_agreement.act_procinst_id
  - authorization_agreement.authed_status
  - cust_company_info.cust_build_type
  evidence: code_path:CustAuthAgreementDomainService.java#createAuthorizationAgreement
- name: CA 开通成功后链式触发签署
  content: CaActivateResult.activateSuccess=true 时重新评估条件并直接执行签署；此时即使本地 ca_register_status
    仍非 Y 也继续尝试（签章层二次校验）。
  impact: 覆盖「审核通过时 CA 未开通」的场景，避免授权书漏签
  field_targets:
  - cust_company_info.ca_register_status
  evidence: code_path:CustAuthSignOrchestrationApplication.java#tryOfflineElectronicAuthSignAfterCaSuccess
- name: 协议迁移初始化幂等
  content: 按 custId + platformProductCode + agreementType 计数为 0 才插入待拉取记录；每产品每客户最多
    5 类协议（CA/产品/授权书/用户协议/隐私政策）。
  impact: 重复迁移不会产生重复协议记录
  field_targets:
  - argeement_migratory_record.cust_id
  - argeement_migratory_record.platform_product_code
  - argeement_migratory_record.agreement_type
  evidence: code_path:PlatFormMigratoryApplication.java#setAgreementMigratory
- name: 协议拉取判重与出错回退
  content: 落库前用 agreementExist(custId, contractAgreementNo) 查合同表判重；文件路径为空不落合同；单条异常时该记录
    pullNum+1 保留在待拉取集合。
  impact: 协议迁移可重试且不重复落合同
  field_targets:
  - argeement_migratory_record.agreement_no
  - argeement_migratory_record.agreement_path
  - argeement_migratory_record.pull_num
  evidence: code_path:AgreementMigratoryService.java#setAgreement
- name: 协议拉取任务执行频率
  content: AreementPullTask 用 scheduleAtFixedRate(this, 0, 30, TimeUnit.SECONDS) 每
    30 秒执行一次；代码注释写「每隔15分钟拉执行一次」，与实现不一致，以实现（30 秒）为准，并由 cust_argeement_pull 分布式锁保证单实例执行。
  impact: 注释与实现不一致，评估任务压力/时效时以 30 秒为准
  field_targets:
  - argeement_migratory_record.status
  evidence: code_path:AgreementMigratoryService.java#AreementPullTask
- name: 协议同步入口必填 productAppId
  content: syncAgreementDoc 对 productAppId 为空抛 SyncException("productAppId不能为空")；客户
    custId 不存在抛 SyncException("custId记录不存在，请检查！")。
  impact: 外部系统推送协议的前置校验
  field_targets:
  - argeement_migratory_record.cust_id
  - argeement_migratory_record.platform_product_code
  evidence: code_path:PlatFormAgreementProviderImpl.java#syncAgreementDoc
