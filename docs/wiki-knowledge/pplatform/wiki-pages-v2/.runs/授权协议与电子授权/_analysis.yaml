field_semantics:
- table: authorization_agreement
  field: authed_status
  meaning: 授权确认书认证状态：Y=已授权，N=未授权/已禁用；DB 分布 Y=11617 / N=19547
  evidence: db
- table: authorization_agreement
  field: platform_product_code
  meaning: 授权书归属平台产品编码；PLATFORM=产融平台级管理员授权书（代码常量 PLATFORM_PRODUCT_TYPE），其余为业务线产品码（ACFLOW/AMS/ORDER/RVSFACTOR_PC/...）
  evidence: code
- table: authorization_agreement
  field: company_type
  meaning: 企业角色（CustCompanyTypeEnum.getDictKey()，如 SUPPLIER/CORE/FINANCE/PROJECT_COMPANY）；DB
    中另存有 JSON 数组与拼写异常值
  evidence: db
- table: authorization_agreement
  field: creation_type
  meaning: 授权书创建类型：CUST_BUILD_INIT=建档初始化自动授权，AUTO=自动，COMPANY_MANAGER_CHANGE_CODE=管理员变更
  evidence: db
- table: authorization_agreement
  field: cust_id
  meaning: 企业ID，指向 cust_company_info.id（逻辑外键，非物理 FK）
  evidence: code
- table: authorization_agreement
  field: cust_manager_id
  meaning: 签署/被授权企业管理员用户ID（对应 cust_person_info.user_id / sys 用户）
  evidence: code
- table: authorization_agreement
  field: enable
  meaning: 逻辑启用标识，Y/N；管理员变更时原记录置 N
  evidence: code
- table: authorization_agreement
  field: original_cust_id
  meaning: 源系统 custId（迁移来源企业标识）
  evidence: db
- table: argeement_migratory_record
  field: agreement_type
  meaning: 协议类型（AgreementDocType.getAgreementType()）：PrivacyPolicy/UserProtocol/CustPersonLicense/CFCA_Auth/BS_Auth/ProductProtocol*
  evidence: code
- table: argeement_migratory_record
  field: status
  meaning: 协议拉取状态：0=待拉取（BooleanEnum.no），1=已拉取完成（BooleanEnum.yes）；列为 int 但存字符串数字
  evidence: code
- table: argeement_migratory_record
  field: sign_mode
  meaning: 协议签署模式：01=线上，02=线下，03=无需签署（SignModeEnum.getDictKey()）
  evidence: code
- table: argeement_migratory_record
  field: is_new
  meaning: 是否新数据，存 BooleanEnum 的 java name（yes/no）而非 dictKey
  evidence: code
- table: argeement_migratory_record
  field: pull_num
  meaning: 拉取次数，用于失败重试上限（pull_num < 配置的 pullNum）
  evidence: code
- table: argeement_migratory_record
  field: agreement_path
  meaning: 协议文件在 COS 上的存储路径（协议实体文件）
  evidence: code
- table: argeement_migratory_record
  field: cust_id
  meaning: 产融客户ID，指向 cust_company_info.id（逻辑外键）
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通电子签章(CFCA)，Y/N
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CFCA 开通状态（OpenStatus，Y/N）；仅 need_register_ca=Y 且本字段=Y 才算已开通
  evidence: code
- table: cust_company_info
  field: need_register_bs
  meaning: 是否需要开通上上签(BEST_SIGN)，Y/N；AMS 产品签章通道
  evidence: code
- table: cust_company_info
  field: bs_register_status
  meaning: 上上签开通状态 Y/N；迁移开通时与 ca_register_status 同时置 Y
  evidence: code
- table: cust_company_info
  field: auth_aggrement_supplement_flag
  meaning: 是否展示/开启授权书补签：Y=需补签；迁移新渠道企业置 N
  evidence: code
- table: cust_company_info
  field: migarory_auth_aggrement_flag
  meaning: 迁移到授权书新渠道标识（Y/N，注意字段名拼写为 migarory）
  evidence: code
- table: cust_company_info
  field: cust_source
  meaning: 建档数据来源：PLATFORM_PUSH=外部平台推送（无需授权书）、MIGRATORY=存量迁移、其他为产融自建
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证方式：INVITE=邀请客户录入、INVITE_AGW=邀请平台录入、SELF=自主注册、SIMPLE=简易认证
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 企业认证/建档状态，取 CustBuildStatusEnum 的 name 落库（代码用 CustBuildStatusEnum.valueOf
    反解）
  evidence: code
- table: tenant_setting_config
  field: generate_electronic_auth_flag
  meaning: 租户是否开启线下授权书电子签约版：Y=是（注释「是否生成电子版授权书」）
  evidence: code
- table: cust_change_record
  field: alter_mode
  meaning: 变更方式：SELF_ALTER=企业自行变更、PLAT_ALTER=平台发起变更
  evidence: code
- table: cust_change_record
  field: alter_type_id
  meaning: 变更项配置ID列表（逗号分隔的 cust_change_cfg.id），用于反查 item_code
  evidence: code
- table: cust_change_record
  field: cust_id
  meaning: 变更所属企业ID
  evidence: code
- table: cust_change_record
  field: oper_cust_id
  meaning: 运营中台客户ID，用于定位对应变更单
  evidence: code
- table: cust_change_cfg
  field: item_code
  meaning: 变更项编码（UN0008/UN0009/UN0012/UN0013/UN0015/UN0016 等），授权书签署白名单依据
  evidence: code
state_machines:
- name: 授权确认书认证状态
  field: authorization_agreement.authed_status
  states:
  - value: N
    label: 未授权/已禁用
    source: db_dist
  - value: Y
    label: 已授权
    source: db_dist
  transitions:
  - from: N
    event: 企业管理员授权认证通过（新增企业认证/补授权/完善资料）
    to: Y
    evidence: code_path:CustAuthAgreementDomainService.java:passAuthorizationAgreementDirectly
  - from: N
    event: 存在未签署记录且当前用户为企业管理员（admin）
    to: Y
    evidence: code_path:CustAuthAgreementDomainService.java:passAuthorizationAgreementDirectly
  - from: N
    event: 非管理员用户被指定授权
    to: N
    evidence: code_path:CustAuthAgreementDomainService.java:passAuthorizationAgreementDirectly
  - from: Y
    event: 企业管理员变更（换人）
    to: N
    evidence: code_path:CustAuthAgreementDomainService.java:disabledAllAuthorizationAgreement
- name: 协议迁移拉取状态
  field: argeement_migratory_record.status
  states:
  - value: '0'
    label: 待拉取
    source: db_dist
  - value: '1'
    label: 已拉取完成
    source: db_dist
  transitions:
  - from: '0'
    event: 从业务系统拉取到协议并落库
    to: '1'
    evidence: code_path:AgreementMigratoryService.java:setAgreement
  - from: '0'
    event: 拉取失败，pull_num+1 后等待重试
    to: '0'
    evidence: code_path:AgreementMigratoryService.java:updateAgreementPullNum
  - from: '0'
    event: 客户端返回空协议集，标记为已完成
    to: '1'
    evidence: code_path:AgreementMigratoryService.java:setAgreement（agreementDocs
      为空分支）
- name: 企业认证/建档状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 待提交
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认（简易认证）
    source: code_enum
  - value: CUST_BUILDING
    label: 审核中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 已通过
    source: code_enum
  - value: BUILD_FAIL
    label: 已驳回
    source: code_enum
  transitions:
  - from: INIT
    event: 提交建档（邀请客户录入/自主注册）
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: BUILD_FAIL
    event: 驳回后修改重新提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:appenUpdateCustBulidStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交，运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核通过（简易/资金方直接生效）
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 审核驳回
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
calibers:
- name: 平台级授权确认书
  predicate: authorization_agreement.platform_product_code = 'PLATFORM'
  scope: 产融平台管理员授权书（PLATFORM_PRODUCT_TYPE），与业务线产品码并列
  evidence: code:CustAuthAgreementDomainService.java:PLATFORM_PRODUCT_TYPE + db:PLATFORM=25156
- name: 授权书已授权
  predicate: authorization_agreement.authed_status = 'Y'
  scope: 判断企业/管理员是否已签署授权书（enable=Y 时有效）
  evidence: code:CustAuthAgreementDomainService.java:hasCompanySignedAuthAggrement
    + db
- name: 授权书未授权
  predicate: authorization_agreement.authed_status = 'N'
  scope: 需补签授权书的判定口径
  evidence: code + db
- name: 待拉取协议记录
  predicate: argeement_migratory_record.status = '0'
  scope: 协议迁移拉取任务取数（复合条件 enable='Y' AND pull_num<配置值）
  evidence: code:AgreementMigratoryService.java:pull + db
- name: 已拉取协议记录
  predicate: argeement_migratory_record.status = '1'
  scope: 迁移协议拉取结果终态
  evidence: code + db
- name: 协议迁移有效记录
  predicate: argeement_migratory_record.enable = 'Y'
  scope: 协议拉取一律过滤 enable=Y（DB 中全为 Y，无 N）
  evidence: code:AgreementMigratoryService.java:pull + db
- name: 电子授权书租户开关
  predicate: tenant_setting_config.generate_electronic_auth_flag = 'Y'
  scope: 租户是否开启线下授权书电子签约版；查询另带 enable='Y'
  evidence: code:ElectronicAuthLetterApplication.java:isGenerateElectronicAuthEnabled
- name: CFCA 已开通
  predicate: cust_company_info.ca_register_status = 'Y'
  scope: 电子授权书在线签署前置校验（需同时 need_register_ca='Y'）
  evidence: code:CustAuthSignOrchestrationApplication.java:isCaRegistered
- name: 需开通电子签章
  predicate: cust_company_info.need_register_ca = 'Y'
  scope: 判断企业是否需要 CFCA 电子签章能力
  evidence: code:CustAuthSignOrchestrationApplication.java:isCaRegistered
- name: 授权书补签开关
  predicate: cust_company_info.auth_aggrement_supplement_flag = 'Y'
  scope: 存量迁移企业是否仍需补签平台授权书；N 且 cust_source=MIGRATORY 则免签
  evidence: code:CustAuthAgreementDomainService.java:enableCompanyManagerAuthAggrement
- name: 线下签署协议
  predicate: argeement_migratory_record.sign_mode = '02'
  scope: 协议签署模式为线下（SignModeEnum.OFF_LINE）
  evidence: code:AgreementMigratoryService.java:setMigrateContract + db
term_bridges:
- term: 授权书（授权确认书）
  aliases:
  - 客户管理员授权确认书
  - 平台授权书
  - 授权协议
  maps_to: authorization_agreement（表注释「授权确认书表」）
  also_confused_with:
  - argeement_migratory_record
  - contract_info（底层协议组件合同表）
  adjudication: boundary
  boundary: authorization_agreement 记录「企业管理员对平台」的授权确认（authed_status），不是业务协议文件；业务协议文件（产品协议/隐私政策/用户协议/CA
    协议）走 argeement_migratory_record + 底层 BaseContractProvider，两者不可互换。
- term: 电子授权书（电子签约版授权书）
  aliases:
  - 线下电子授权书
  - off_auth 授权书
  maps_to: cust_company_info.need_register_ca + ca_register_status + tenant_setting_config.generate_electronic_auth_flag
  also_confused_with:
  - 线上签署授权确认书
  - authorization_agreement.authed_status
  adjudication: boundary
  boundary: 「电子授权书」指线下授权（off_auth）场景下把纸质授权书改为 CFCA 在线签署，需租户开关 generate_electronic_auth_flag=Y
    且企业已开通 CA；与「授权确认书」的授权状态字段不是同一语义。
- term: 电子签章开通
  aliases:
  - CA 开通
  - CFCA 注册
  - 上上签开通
  maps_to: cust_company_info.ca_register_status / cust_company_info.bs_register_status
  also_confused_with:
  - need_register_ca
  - need_register_bs
  adjudication: boundary
  boundary: need_register_* 是「要不要开」的意愿标识，*_register_status 是「已经开了」的落库结果；签署判定必须两者同时为
    Y（isCaRegistered）。CFCA(PAPER_LESS) 与上上签(BEST_SIGN，AMS 使用) 是两个签章通道。
- term: 协议类型（agreementType）
  aliases:
  - AgreementDocType
  - serviceKey
  - 协议 code
  maps_to: argeement_migratory_record.agreement_type
  also_confused_with:
  - platform_product_code
  adjudication: boundary
  boundary: agreement_type 区分协议种类（PrivacyPolicy/UserProtocol/CustPersonLicense/CFCA_Auth/BS_Auth/ProductProtocol*），platform_product_code
    区分业务线产品（ACFLOW/AMS/BEECREDIT/ORDER/RVSFACTOR_PC/STORAGE/VOUCHER）；同一协议类型在每个产品码下各有一条迁移记录。
- term: 产品协议
  aliases:
  - ProductProtocol
  maps_to: argeement_migratory_record.agreement_type
  also_confused_with:
  - 平台协议（PLATFORM_PRODUCT_TYPE）
  adjudication: synonym
  boundary: getProductAgreement(productCode) 按产品码返回不同 ProductProtocol* 协议类型（AMS/BEECREDIT/RVSFACTOR_PC/ACFLOW/ORDER/DEALER/STORAGE/VOUCHER）。
rules:
- name: 线下电子授权书签署触发条件（多重与门）
  content: 仅当 ①审核通过(checkStatus=CUST_CHECK_PASS) ②授权模式为 off_auth ③租户 generate_electronic_auth_flag=Y
    ④企业类型∈{供应商,核心企业,金融机构,项目公司} ⑤建档流程且建档方式∈{INVITE客户录入,SELF自主注册} 或 变更流程且 alterMode=SELF_ALTER
    且变更项∈{UN0016,UN0012,UN0013,UN0008,UN0015} ⑥need_register_ca=Y 且 ca_register_status=Y
    时，才在事务提交后触发签署；任一不满足仅记日志跳过，不阻断主流程
  impact: 决定线下授权书是否自动发起电子签署
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.identify_style
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_change_record.alter_mode
  - cust_change_record.alter_type_id
  - tenant_setting_config.generate_electronic_auth_flag
  evidence: code:CustAuthSignOrchestrationApplication.java:evaluateIneligibilityReason
    + isCaRegistered
- name: CFCA 未开通时的延迟补偿签署
  content: 审核通过时若本地 ca_register_status≠Y 则跳过签署；待 CA 重开成功回调（CaActivateResult.activateSuccess=true）后再链式触发一次签署，此时即使本地状态仍非
    Y 也继续尝试（由签章层二次校验）
  impact: 保证 CA 开通后授权书能补签，避免永久漏签
  field_targets:
  - cust_company_info.ca_register_status
  evidence: code:CustAuthSignOrchestrationApplication.java:tryOfflineElectronicAuthSignAfterCaSuccess
- name: 授权书签署幂等（Redis 锁 + 完成标记）
  content: 签署前用 cust_auth_sign_done:{sourceMainId}:{appNo} 判重，再用 cust_auth_sign_after_audit:{sourceMainId}:{appNo}
    抢锁（acquire-timeout 1000ms / lock-timeout 120000ms）执行，成功后写 done 标记；签署失败仅记日志不回滚主流程
  impact: 避免重复签署与并发重复提交
  field_targets: []
  evidence: code:CustAuthSignOrchestrationApplication.java:executeOfflineElectronicAuthSignSafely
- name: 企业管理员变更即作废原授权书
  content: 管理员换人时先把原管理员在该企业下的全部授权记录 enable=N、authed_status=N（remark 记录 to|新管理员|原因），再为新管理员按企业各角色创建/更新
    authed_status=Y 的授权记录
  impact: 保证授权主体与当前管理员一致
  field_targets:
  - authorization_agreement.enable
  - authorization_agreement.authed_status
  - authorization_agreement.cust_manager_id
  - authorization_agreement.creation_type
  evidence: code:CustAuthAgreementDomainService.java:changeCompanyAuthorizationAgreement
    + disabledAllAuthorizationAgreement
- name: 存量迁移企业授权书补签的豁免
  content: cust_source=PLATFORM_PUSH（外部平台推送）一律视为已授权；cust_source=MIGRATORY 且 auth_aggrement_supplement_flag=N（新渠道迁移）不需要签署；其余情况需检查平台授权(PLATFORM)或存量产品授权
  impact: 决定迁移/外部企业在开通产品时是否弹补签授权书
  field_targets:
  - cust_company_info.cust_source
  - cust_company_info.auth_aggrement_supplement_flag
  - cust_company_info.migarory_auth_aggrement_flag
  evidence: code:CustAuthAgreementDomainService.java:enableCompanyManagerAuthAggrement
- name: 协议迁移拉取的重试与上限
  content: 协议迁移任务每 30 秒执行，用 Redis 锁 cust_argeement_pull 防重；取 status=0 且 enable=Y、pull_num<配置值
    的记录按产品/客户分组拉取，失败时 pull_num+1 后重试，超过上限不再拉取
  impact: 保证协议迁移的最终一致性与有限重试
  field_targets:
  - argeement_migratory_record.status
  - argeement_migratory_record.pull_num
  - argeement_migratory_record.enable
  evidence: code:AgreementMigratoryService.java:pull + AreementPullTask
- name: 协议签署模式映射
  content: 迁移协议将业务系统 signMode 映射为 SignModeEnum：NO_SIGN=03 无需签署、OFF_LINE=02 线下、ON_LINE=01
    线上；并落 sign_type=SIGNED、business_type=cust_company_info
  impact: 迁移后协议在产融侧的签署方式可追溯
  field_targets:
  - argeement_migratory_record.sign_mode
  evidence: code:AgreementMigratoryService.java:setMigrateContract
- name: 简易认证强制关闭电子签章
  content: 简易认证提交时如 need_register_ca=Y 则通过 CustCompanyCaPolicy.enforceMustNotOpenCa
    强制校正为不开通并落库
  impact: 简易建档不支持开通电子签章
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.need_register_bs
  - cust_company_info.bs_register_status
  evidence: code:CustCompanyInfoApplication.java:submitForSimpleAuth
reqdoc_claims:
- claim: 协议组件按协议 code + productCode 路由到对应 *Datasource，未匹配抛 BaseException("未找到协议数据源")（BR-001）
  code_status: uncovered
  code_evidence: PlatAgreementService.java:getPrivacyPolicyPdf/getUserAttachmentPdf（仅见按
    serviceKey 直调 baseContractProvider，未见路由/未匹配异常实现）
  action: review
- claim: 企业签署辅助 CompanySignHelper 统一封装：查询企业法人/经办人信息后调底层签署组件（BR-002）
  code_status: uncovered
  code_evidence: 未在给出的代码中出现 CompanySignHelper；PlatFormMigratoryApplication.java:setSignRegister
    有「优先法人→管理员→经办人」的同类取值逻辑
  action: prose_only
