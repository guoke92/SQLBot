field_semantics:
- table: ca_fee_company
  field: certification_no
  meaning: 统一社会信用代码，CA服务费企业主数据唯一键，用于关联订单、企业主数据
  evidence: db
- table: ca_fee_company
  field: company_name
  meaning: 企业名称
  evidence: db
- table: ca_fee_company
  field: pay_status
  meaning: 企业维度缴费状态：PAID 已缴费 / UNPAID 未缴费
  evidence: db
- table: ca_fee_company
  field: ca_status
  meaning: CA签章状态，由签章中台状态归一化后同步，如 NORMAL/CANCELLED/UNKNOWN
  evidence: db
- table: ca_fee_company
  field: service_start
  meaning: 当前 CA 服务费服务周期起始日
  evidence: db
- table: ca_fee_company
  field: service_end
  meaning: 当前 CA 服务费服务周期截止日
  evidence: db
- table: ca_fee_company
  field: source_project_id
  meaning: 首次锁定来源项目 ID
  evidence: db
- table: ca_fee_company
  field: source_company_type
  meaning: 首次锁定来源企业角色：CORE/SUPPLIER/PROJECT_COMPANY
  evidence: db
- table: ca_fee_company
  field: locked_annual_fee
  meaning: 首次缴费成功后锁定的年费标准
  evidence: db
- table: ca_fee_company
  field: special_annual_fee
  meaning: 特殊配置后应缴年费
  evidence: db
- table: ca_fee_company
  field: special_config_flag
  meaning: 是否存在生效中的特殊配置快照
  evidence: db
- table: ca_fee_company
  field: fee_locked
  meaning: 是否已锁定年费标准
  evidence: db
- table: ca_fee_company
  field: renew_remind_sent
  meaning: 本期续费待办是否已生成：Y/N
  evidence: db
- table: ca_fee_company
  field: enable
  meaning: 有效标识
  evidence: db
- table: ca_fee_company
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: db
- table: ca_fee_order
  field: order_no
  meaning: CA服务费订单号
  evidence: code
- table: ca_fee_order
  field: order_status
  meaning: 订单状态：PENDING 未缴费 / PAID 已缴费 / CLOSED 已关闭；EXPIRED 枚举存在但未使用
  evidence: code
- table: ca_fee_order
  field: order_type
  meaning: 订单类型：FIRST 首次缴费 / RENEW 即将到期续费 / RENEW_EXPIRED 已到期续费 / STOCK 存量补录
  evidence: code
- table: ca_fee_order
  field: agreement_signed
  meaning: 是否已签署收费协议：Y/N
  evidence: db
- table: ca_fee_order
  field: agreement_version
  meaning: 签署时绑定的收费协议版本号
  evidence: db
- table: ca_fee_order
  field: annual_fee
  meaning: 应缴年费
  evidence: db
- table: ca_fee_order
  field: pay_amount
  meaning: 实缴金额
  evidence: code
- table: ca_fee_order
  field: pay_method
  meaning: 支付方式，当前代码主要支持 BOCOM 交e保
  evidence: code
- table: ca_fee_order
  field: pay_time
  meaning: 支付时间
  evidence: code
- table: ca_fee_order
  field: service_start
  meaning: 订单服务周期起始日快照
  evidence: code
- table: ca_fee_order
  field: service_end
  meaning: 订单服务周期截止日快照
  evidence: code
- table: ca_fee_order
  field: invoice_status
  meaning: 发票状态：NONE/PENDING/ISSUED/FAILED
  evidence: code
- table: ca_fee_order
  field: bocom_txn_sts
  meaning: 交e保划扣响应状态：00 成功 / 01 明确失败 / 02 待查证
  evidence: db
- table: ca_fee_order
  field: bocom_plfm_ser_no
  meaning: 交e保平台流水号
  evidence: db
- table: ca_fee_order
  field: bocom_plfm_bsn_id
  meaning: 交e保平台业务编号
  evidence: db
- table: ca_fee_order
  field: bocom_req_sn
  meaning: 交e保请求流水号
  evidence: db
- table: ca_fee_order
  field: close_reason
  meaning: 订单关闭原因
  evidence: db
- table: ca_fee_order
  field: project_id
  meaning: 订单所属项目 ID
  evidence: code
- table: ca_fee_order
  field: company_id
  meaning: 企业 ID
  evidence: code
- table: ca_fee_order
  field: company_type
  meaning: 企业角色：CORE/SUPPLIER/PROJECT_COMPANY
  evidence: db
- table: ca_fee_project_config
  field: project_id
  meaning: CA收费配置所属项目 ID
  evidence: code
- table: ca_fee_project_config
  field: charge_enabled
  meaning: 项目是否开启CA收费：Y/N
  evidence: code
- table: ca_fee_project_config
  field: core_annual_fee
  meaning: 项目核企年费标准
  evidence: code
- table: ca_fee_project_config
  field: supplier_annual_fee
  meaning: 项目供应商年费标准
  evidence: code
- table: ca_fee_project_config
  field: special_company_list
  meaning: 项目特殊企业配置 JSON，承载 WHITELIST/SPECIAL_PRICE/DEFER_PAY
  evidence: code
- table: ca_fee_project_config
  field: pay_channel
  meaning: 支付渠道配置 JSON
  evidence: code
- table: ca_fee_project_config
  field: agreement_version
  meaning: 项目绑定收费协议版本
  evidence: code
- table: ca_fee_project_config
  field: enable
  meaning: 有效标识
  evidence: code
state_machines:
- name: CA服务费订单状态
  field: ca_fee_order.order_status
  states:
  - value: PENDING
    label: 未缴费
    source: code_enum
  - value: PAID
    label: 已缴费
    source: code_enum
  - value: CLOSED
    label: 已关闭
    source: code_enum
  - value: EXPIRED
    label: 已过期
    source: code_enum
  transitions:
  - from: PENDING
    event: 支付成功 markPaid
    to: PAID
    evidence: code_path:CaFeeOrderService.java:279 + CaFeePaymentApplication.java
  - from: PENDING
    event: 关闭订单 closeOrder
    to: CLOSED
    evidence: code_path:CaFeeOrderApplication.java + CaFeeOrderService.java
  - from: PENDING
    event: 批量白名单命中并关闭待缴单
    to: CLOSED
    evidence: code_path:CaFeeLedgerOperateService.java
- name: 企业缴费状态
  field: ca_fee_company.pay_status
  states:
  - value: PAID
    label: 已缴费
    source: code_enum
  - value: UNPAID
    label: 未缴费
    source: code_enum
  transitions:
  - from: UNPAID
    event: 订单缴费成功回写企业缴费状态
    to: PAID
    evidence: code_path:CaFeeOrderService.java:450
  - from: PAID
    event: 服务到期处理 markServiceExpired
    to: UNPAID
    evidence: code_path:CaFeeRenewalService.java
- name: 收费协议签署状态
  field: ca_fee_order.agreement_signed
  states:
  - value: N
    label: 未签署
    source: code_const
  - value: Y
    label: 已签署
    source: code_const
  transitions:
  - from: N
    event: 签署收费协议 markAgreementSigned
    to: Y
    evidence: code_path:CaFeeOrderService.java:337 + CaFeeAgreementApplication.java
- name: CA签章状态
  field: ca_fee_company.ca_status
  states:
  - value: NORMAL
    label: CA正常
    source: db_dist
  - value: CANCELLED
    label: CA注销/作废/失效
    source: db_dist
  - value: UNKNOWN
    label: CA状态未知
    source: db_dist
  - value: APPLYING
    label: CA申请中
    source: code_const
  - value: EXPIRED
    label: CA已过期
    source: code_const
  - value: FAIL
    label: CA申请失败
    source: code_const
  transitions: []
- name: 发票状态
  field: ca_fee_order.invoice_status
  states:
  - value: NONE
    label: 无需开票
    source: code_enum
  - value: PENDING
    label: 开票中
    source: code_enum
  - value: ISSUED
    label: 已开票
    source: code_enum
  - value: FAILED
    label: 开票失败
    source: code_enum
  transitions:
  - from: NONE
    event: 缴费成功后异步申请开票
    to: PENDING
    evidence: code_path:CaFeeInvoiceApplication.java:49
calibers:
- name: 项目开启CA收费
  predicate: ca_fee_project_config.charge_enabled = 'Y'
  scope: 规则引擎评估收费项目的前置条件
  evidence: CaFeeRuleEngineService.java
- name: 有效企业主数据
  predicate: ca_fee_company.enable = 'Y'
  scope: 台账查询、规则引擎、企业快照
  evidence: CaFeeLedgerQueryService.java
- name: 企业已缴费口径
  predicate: ca_fee_company.pay_status = 'PAID'
  scope: 台账统计、已缴费企业筛选
  evidence: db + CaFeeLedgerQueryService.java
- name: 企业未缴费口径
  predicate: ca_fee_company.pay_status = 'UNPAID'
  scope: 台账统计、未缴费企业筛选
  evidence: db + CaFeeLedgerQueryService.java
- name: 订单未缴费口径
  predicate: ca_fee_order.order_status = 'PENDING'
  scope: 协议签署、支付、关闭订单可操作范围
  evidence: CaFeeOrderApplication.java
- name: 订单已缴费口径
  predicate: ca_fee_order.order_status = 'PAID'
  scope: 缴费成功、台账展示、编辑限制
  evidence: CaFeeOrderApplication.java
- name: 订单已关闭口径
  predicate: ca_fee_order.order_status = 'CLOSED'
  scope: 台账历史过滤、重新评估建单
  evidence: CaFeeLedgerQueryService.java
- name: 收费协议已签署
  predicate: ca_fee_order.agreement_signed = 'Y'
  scope: 交e保支付前置校验
  evidence: CaFeePaymentApplication.java
- name: 企业存在特殊配置快照
  predicate: ca_fee_company.special_config_flag = 'Y'
  scope: 白名单/定向减免判定
  evidence: db + CaFeeRuleEngineService.java
- name: 企业已锁定年费
  predicate: ca_fee_company.fee_locked = 'Y'
  scope: 年费定价链锁定价优先
  evidence: db + CaFeeRuleEngineService.java
- name: 交e保划扣成功
  predicate: ca_fee_order.bocom_txn_sts = '00'
  scope: 补单/幂等拦截
  evidence: db + CaFeeConstants.java
- name: 交e保划扣明确失败
  predicate: ca_fee_order.bocom_txn_sts = '01'
  scope: 禁止重复划扣
  evidence: CaFeeConstants.java
- name: 交e保划扣待查证
  predicate: ca_fee_order.bocom_txn_sts = '02'
  scope: 定时补偿查证、台账编辑拦截
  evidence: CaFeeConstants.java
- name: 发票开票中
  predicate: ca_fee_order.invoice_status = 'PENDING'
  scope: 缴费成功页提示、异步开票前置
  evidence: CaFeeInvoiceApplication.java
- name: CA状态正常
  predicate: ca_fee_company.ca_status = 'NORMAL'
  scope: CA有效性判断
  evidence: db + CaCertificationPreCheckApplication.java
- name: CA状态失效
  predicate: ca_fee_company.ca_status = 'CANCELLED'
  scope: CA失效提示与重置开通状态
  evidence: db + CaCertificationPreCheckApplication.java
- name: CA状态未知
  predicate: ca_fee_company.ca_status = 'UNKNOWN'
  scope: 查询失败/未注册兜底展示
  evidence: db + CaCertificationPreCheckApplication.java
term_bridges:
- term: CA服务费
  aliases:
  - CA证书收费
  - CA收费
  - 电子认证服务费
  maps_to: ca_fee_order.annual_fee
  also_confused_with:
  - ca_fee_company.ca_status
  adjudication: boundary
  boundary: 费用金额字段是 annual_fee；ca_status 是证书状态，不是收费金额
- term: 缴费订单
  aliases:
  - CA服务费订单
  - 订单
  maps_to: ca_fee_order.order_no
  also_confused_with:
  - ca_fee_company.certification_no
  adjudication: boundary
  boundary: 订单维度以 order_no 标识；企业维度以 certification_no 一统码一行
- term: 待缴费
  aliases:
  - 未缴费
  - PENDING
  - UNPAID
  maps_to: ca_fee_order.order_status = 'PENDING'
  also_confused_with:
  - ca_fee_company.pay_status = 'UNPAID'
  adjudication: boundary
  boundary: 订单级待缴是 PENDING；企业级未缴汇总是 UNPAID
- term: 已缴费
  aliases:
  - PAID
  maps_to: ca_fee_company.pay_status = 'PAID'
  also_confused_with:
  - ca_fee_order.order_status = 'PAID'
  adjudication: boundary
  boundary: 企业已缴费是汇总状态；订单已缴费是单笔订单状态
- term: 服务期
  aliases:
  - 服务周期
  maps_to: ca_fee_company.service_end
  also_confused_with:
  - ca_fee_order.service_end
  adjudication: boundary
  boundary: 企业主数据保存当前服务期；订单表保存该订单对应的服务期快照
- term: 白名单
  aliases:
  - WHITELIST
  maps_to: ca_fee_company.special_config_flag = 'Y'
  also_confused_with:
  - ca_fee_project_config.special_company_list
  adjudication: boundary
  boundary: 企业快照用于规则快速判断；项目 JSON 是配置源，二者需交叉校验
- term: 交e保
  aliases:
  - 交e保对公打款
  maps_to: ca_fee_order.pay_method = 'BOCOM'
  also_confused_with:
  - ca_fee_order.bocom_txn_sts
  adjudication: boundary
  boundary: pay_method 表示支付渠道；bocom_txn_sts 表示该渠道划扣响应状态
- term: 收费协议
  aliases:
  - CA服务费收费协议
  maps_to: ca_fee_order.agreement_signed = 'Y'
  also_confused_with:
  - ca_fee_order.agreement_version
  adjudication: boundary
  boundary: agreement_signed 表示是否已签；agreement_version 表示签署时绑定的版本
rules:
- name: 项目收费开关规则
  content: 项目无 ca_fee_project_config 或 charge_enabled<>'Y' 时，规则引擎直接返回 EXEMPT，needPay=false，exemptReason=PROJECT_DISABLED
  impact: 决定是否进入CA服务费收费流程
  field_targets:
  - ca_fee_project_config.charge_enabled
  evidence: CaFeeRuleEngineService.evaluate
- name: 多项目放行规则
  content: 多项目企业遍历所有已开启收费项目 evaluate，任一命中白名单、0元特殊定价、延期豁免或服务期内已缴费，即 pass=true 放行
  impact: 企业有多个项目时避免因单个项目未缴被拦截
  field_targets:
  - ca_fee_project_config.charge_enabled
  - ca_fee_company.pay_status
  - ca_fee_company.special_config_flag
  evidence: CaFeePaymentCheckApplication.doCheckFeePayment
- name: 白名单豁免规则
  content: 企业快照 special_config_flag=Y 且 special_annual_fee=0，并与项目 special_company_list
    中生效 WHITELIST 交叉校验后，needPay=false，exemptReason=WHITELIST，服务期截止取零元豁免特殊值
  impact: 白名单企业免缴CA服务费
  field_targets:
  - ca_fee_company.special_config_flag
  - ca_fee_company.special_annual_fee
  - ca_fee_project_config.special_company_list
  evidence: CaFeeRuleEngineService.isWhitelistExempt
- name: 延期支付豁免规则
  content: 无生效定向减免时，项目 special_company_list 中存在 DEFER_PAY 且 today<=deferServiceEnd，则
    needPay=false，exemptReason=DEFER_PAY
  impact: 延期企业暂不缴费
  field_targets:
  - ca_fee_project_config.special_company_list
  evidence: CaFeeRuleEngineService.resolveDeferPay
- name: 服务期内已缴费规则
  content: ca_fee_company.service_end>=today，或存在 PAID 且服务期覆盖今天的订单，则 feeStatus=PAID，needPay=false，exemptReason=ALREADY_PAID
  impact: 服务期内不重复收费
  field_targets:
  - ca_fee_company.service_end
  - ca_fee_order.order_status
  - ca_fee_order.service_end
  evidence: CaFeeRuleEngineService.evaluate
- name: 年费定价链规则
  content: 应缴年费按 special_annual_fee -> locked_annual_fee（fee_locked=Y） -> 项目角色价 core_annual_fee/supplier_annual_fee
    解析；角色价0元时视同豁免
  impact: 决定订单 annual_fee 和是否需缴费
  field_targets:
  - ca_fee_company.special_annual_fee
  - ca_fee_company.locked_annual_fee
  - ca_fee_company.fee_locked
  - ca_fee_project_config.core_annual_fee
  - ca_fee_project_config.supplier_annual_fee
  evidence: CaFeeRuleEngineService.resolveAnnualFee
- name: 协议签署前置规则
  content: 交e保开户和确认打款前，订单必须 agreement_signed=Y；否则抛出“请先签署收费协议”
  impact: 收费协议是支付前置条件
  field_targets:
  - ca_fee_order.agreement_signed
  evidence: CaFeePaymentApplication.requirePendingSignedOrder
- name: 交e保划扣幂等与查证规则
  content: 订单已有 txnSts=00/01/02 时拦截重复扣款；02 待查证由定时任务向银行查证，成功则补 markPaid，明确失败则禁止再次划扣
  impact: 防止重复支付和状态不一致
  field_targets:
  - ca_fee_order.bocom_txn_sts
  - ca_fee_order.order_status
  evidence: CaFeePaymentApplication.tryResolveByBocomVerify + CaFeeBocomPayReconcileService
- name: 续费提醒与到期规则
  content: service_end 剩余≤7天且 renew_remind_sent=N 时生成续费待办；service_end<today 时完结即将到期待办、关闭
    RENEW 待缴单、企业 pay_status 置 UNPAID，并按需创建 RENEW_EXPIRED 订单发已过期待办
  impact: 到期续费提醒和服务状态刷新
  field_targets:
  - ca_fee_company.service_end
  - ca_fee_company.renew_remind_sent
  - ca_fee_company.pay_status
  - ca_fee_order.order_type
  evidence: CaFeeScheduledJobHandler + CaFeeRenewalService
- name: Dubbo业务节点校验规则
  content: 统码维度若不存在生效主数据的供应商/核企角色，Dubbo dualCheck 直接放行；存在收费角色才进入缴费校验
  impact: 讯易链签章前拦截只针对收费对象
  field_targets:
  - cust_company_info.certification_no
  - cust_company_info.cust_company_type
  evidence: CaFeeBizNodeCheckApplication.check
- name: 台账编辑限制规则
  content: 台账订单编辑仅支持 PENDING/PAID；已缴费订单不允许改为未缴费；交e保查证中 bocom_txn_sts=02 不允许人工标记已缴费
  impact: 保障台账状态与支付状态一致
  field_targets:
  - ca_fee_order.order_status
  - ca_fee_order.bocom_txn_sts
  evidence: CaFeeLedgerOperateService.editOrder
- name: 批量白名单与延期规则
  content: 批量白名单写入项目 WHITELIST，关闭 PENDING 订单并创建0元已缴订单；批量延期写入 DEFER_PAY，记录操作日志
  impact: 运营后台批量豁免与延期
  field_targets:
  - ca_fee_project_config.special_company_list
  - ca_fee_order.order_status
  evidence: CaFeeLedgerOperateService.batchWhitelist/batchDefer
- name: 发票异步规则
  content: 缴费成功后异步 requestInvoiceAsync，先将订单 invoice_status 置 PENDING，已存在非 NONE 状态则跳过
  impact: 开票不阻塞缴费主流程
  field_targets:
  - ca_fee_order.invoice_status
  evidence: CaFeeInvoiceApplication.requestInvoiceAsync
reqdoc_claims:
- claim: CA证书收费是产融平台V1.32版本推出的全新商业模式/产品功能点，对使用电子认证服务（CA证书）的用户开通收费模式
  code_status: confirmed
  code_evidence: CaFeeController.java + CaFeePaymentCheckApplication.java + CaFeeRuleEngineService.java
  action: anchor
- claim: CA证书收费需求由产品经理张彬伟（Vincent）负责
  code_status: uncovered
  code_evidence: ''
