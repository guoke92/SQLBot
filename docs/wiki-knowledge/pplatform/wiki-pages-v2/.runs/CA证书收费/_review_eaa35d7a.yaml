body: '语义分析中「服务到期规则」的条目在传输中被**截断**：`content` 取值止于「按需创建 RENEW_EXPIRED 」，`evidence`
  字段完全缺失（条目在 JSON 中被切断）。


  - 已知（可作为上下文、但不构成锚点）：内容涉及 `service_end < 当日` 时完结即将到期待办、关闭 RENEW 待缴单、将企业 `pay_status`
  置为 `UNPAID`；与状态机 [[processes/ca_fee_order_state]] 中的 `processServiceExpired`、[[processes/ca_fee_company_pay_status]]
  的 `markServiceExpired`、[[processes/ca_fee_renew_remind]] 的复位动作可相互印证。

  - 缺失：完整的 `content` 结尾（"按需创建 RENEW_EXPIRED …" 之后的条件与动作）、`impact`、`field_targets`、`evidence`
  代码路径。


  未生成 `rules/service_expired_rule.md`，以免在锚点块中写入非逐字、可能被发明的内容。请补充该规则的完整条目（尤其 `evidence`
  的 `code_path:文件:方法`）后重新触发本页生成。'
title: 服务到期规则
type: rule
