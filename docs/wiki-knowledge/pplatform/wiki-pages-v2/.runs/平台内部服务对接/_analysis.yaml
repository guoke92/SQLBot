- table: cust_company_info
  field: cust_email
  meaning: 企业邮箱
  evidence: code
- table: cust_company_info
  field: contact_address
  meaning: 联系地址
  evidence: code
- table: cust_company_info
  field: head_company
  meaning: 总部/集团企业标识，为空时（简易认证）置为 'Y'
  evidence: code
- table: cust_company_info
  field: ext
