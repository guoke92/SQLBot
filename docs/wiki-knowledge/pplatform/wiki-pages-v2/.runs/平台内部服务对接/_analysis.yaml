  meaning: 直接父集团节点 / 根集团节点 id（树形结构键）
  evidence: code
- table: cust_group_rel
  field: cust_type
  meaning: 成员角色，JSON 数组字符串
  evidence: code
- table: cust_group_rel
  field: status
  meaning: 生效状态 INEFFECTIVE/EFFECTIVE
  evidence: code
- table: cust_group_rel
  field: root_flag
