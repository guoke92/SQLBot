- table: sys_cust_user_rel
  field: is_freeze
  meaning: 关联是否冻结 'Y'/'N'（UserFreezeEnum.FREEZE/UN_FROZEN）
  evidence: code
- table: tenant_setting_config
  field: db_tenant_code
  meaning: 租户数据编码，全局隔离键
  evidence: code
- table: tenant_setting_config
  field: enable / status
  meaning: 有效标志 / 生效标志（查询生效租户 activeList、'Y' 判定）
