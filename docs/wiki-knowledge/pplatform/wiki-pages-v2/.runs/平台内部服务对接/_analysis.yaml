- table: cust_project_rel
  field: company_type
  meaning: 关联关系对应的企业角色
  evidence: code
- table: cust_project_rel
  field: show_flag
  meaning: 是否展示 'Y'/'N'
  evidence: code
- table: cust_project_rel
