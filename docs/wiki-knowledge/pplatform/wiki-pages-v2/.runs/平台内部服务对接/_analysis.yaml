    用于运营中台 id
  evidence: code
state_machines:
- name: 企业建档/认证状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始化（新建临时企业）
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认（简易认证路径）
    source: code_enum
  - value: CUST_BUILDING
    label: 客户已提交/运营中台审核中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: BUILD_FAIL
    label: 建档失败/被拒
    source: code_enum
  transitions:
  - from: INIT
    event: RVS 调 getAndCreateTempCompany 创建临时企业
    to: INIT
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/PlatFormRvsApplication.java#getAndCreateTempCompany
  - from: INIT
    event: 邀请认证-客户录入/注册认证提交
    to: CUST_CONFIRM_AWAIT
    evidence: 'code_path:CustCompanyInfoApplication.java#submitCust + #getCustBuildStatus(IdentifyTypeConstant.INVITE/SELF)'
  - from: INIT
    event: 邀请认证-平台录入提交
    to: CUST_BUILDING
    evidence: 'code_path:CustCompanyInfoApplication.java#submitCust + #getCustBuildStatus(IdentifyTypeConstant.INVITE_AGW)'
  - from: BUILD_FAIL
    event: 被拒后重新提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(条件 before==INIT||before==BUILD_FAIL
      && after==CUST_CONFIRM_AWAIT)
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交进入运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(#updateCustBuildStatus
      分支 before==CUST_CONFIRM_AWAIT && after==CUST_BUILDING)
  - from: CUST_BUILDING
    event: 运营中台审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(分支 before==CUST_BUILDING
      && after==CUST_CONFIRM_AWAIT)
  - from: CUST_BUILDING
    event: 审核通过（同时置 cust_status=EFFECT）
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus(after==BUILD_SUCCESS
      → custCompanyInfoService.updateById(custStatus=EFFECT))
  - from: CUST_CONFIRM_AWAIT
    event: 平台录入客户点击确认提交
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(IdentifyTypeConstant.INVITE_AGW
      且 after==BUILD_SUCCESS)
  - from: CUST_BUILDING
    event: 运营中台审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(after==BUILD_FAIL
      发送拒绝通知/短信)
  - from: CUST_CONFIRM_AWAIT
    event: 审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(after==BUILD_FAIL)
  - from: INIT
    event: 简易认证提交
    to: AWAIT_CUST_CONFIRM
    evidence: code_path:CustCompanyInfoApplication.java#submitForSimpleAuth(companyInfoDO.setCustBuildStatus(AWAIT_CUST_CONFIRM))
  - from: AWAIT_CUST_CONFIRM
    event: 客户确认（简易认证）
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#confirmCustInfoForSimpleAuth(custCompanyInfoDao.updateStatus(custId,
      BUILD_SUCCESS, CustStatusEnum.EFFECT))
- name: 客户生命周期状态
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增/待处理（新建企业与自主注册初始态）
    source: code_enum
  - value: CHANGE
    label: 变更中（走变更流程，token 取变更记录上的运营中台 id）
    source: code_enum
  - value: EFFECT
    label: 已生效
    source: code_enum
  - value: FREEZE
    label: 已冻结
    source: code_enum
  - value: WRITEOFF
    label: 已注销
    source: code_enum
  transitions:
  - from: ADD
    event: 建档成功
    to: EFFECT
    evidence: 'code_path:CustCompanyInfoApplication.java#updateCustBuildStatus(custStatus=EFFECT)
      / #confirmCustInfoForSimpleAuth'
  - from: EFFECT
    event: 冻结企业
    to: FREEZE
    evidence: 'code_path:CustCompanyInfoApplication.java#freeze → #custStatusOperator
      + #custStatusSync(CustStatusEnum.FREEZE)'
  - from: FREEZE
    event: 解冻企业
    to: EFFECT
    evidence: 'code_path:CustCompanyInfoApplication.java#unfreeze → #custStatusSync(CustStatusEnum.EFFECT)'
  - from: EFFECT
    event: 注销/停用企业
    to: WRITEOFF
    evidence: 'code_path:CustCompanyInfoApplication.java#diable → #custStatusOperator(WRITEOFF)
      + #custStatusSync(CustStatusEnum.WRITEOFF)'
  - from: ADD
    event: 发起变更流程
    to: CHANGE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/service/oper/facade/cust/OperCustFacade.java#queryCustAutoCheck(process!=CHECK
      → CustStatusEnum.CHANGE)
- name: 经办人产品关联冻结状态
  field: sys_cust_user_rel.is_freeze
  states:
  - value: N
    label: 未冻结
    source: code_enum
  - value: Y
    label: 已冻结
    source: code_enum
  transitions:
  - from: N
    event: 冻结经办人（operationType=FREEZE）
    to: Y
    evidence: code_path:CustCompanyInfoApplication 同仓 PlatFormUserApplication.java#freezeOrThawOperatorUser(sysCustUserRelDO.setIsFreeze("Y"))
  - from: Y
    event: 解冻经办人（operationType=THAW）
    to: N
    evidence: code_path:PlatFormUserApplication.java#freezeOrThawOperatorUser(THAW
      分支 setIsFreeze("N"))
  - from: N
    event: 冻结企业管理员关联
    to: Y
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/sys/provider/impl/SysProviderImpl.java#freezeUser(updateFreezeFlag
      FREEZE)
  - from: Y
    event: 解冻用户关联
    to: N
    evidence: code_path:SysProviderImpl.java#activeUser(updateFreezeFlag UN_FROZEN)
- name: 集团成员关系状态
  field: cust_group_rel.status
  states:
  - value: INEFFECTIVE
    label: 未生效
    source: code_enum
  - value: EFFECTIVE
    label: 已生效
    source: code_enum
  transitions:
  - from: INEFFECTIVE
    event: 企业建档成功
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java#addExistRootGroupRel(if BUILD_SUCCESS
      == companyInfo.getCustBuildStatus() → setStatus(EFFECTIVE))
  - from: INEFFECTIVE
    event: 新建成员关系默认落库
    to: INEFFECTIVE
    evidence: code_path:CustGroupRelApplication.java#addExistSubCustGroupRel(setStatus(CustGroupRelStatusEnum.INEFFECTIVE))
- name: 联系人状态
  field: cust_person_info.status
  states:
  - value: ADD
    label: 新增（CustPersonStatusConstant.ADD）
    source: code_enum
  - value: EFFECT
    label: 生效（CustPersonStatusConstant.EFFECT）
    source: code_enum
  transitions: []
- name: 认证方式
  field: cust_company_info.identify_style
  states:
  - value: SELF
    label: 自主注册/自主认证
    source: code_enum
  - value: INVITE
    label: 邀请认证-客户录入
    source: code_enum
  - value: INVITE_AGW
    label: 邀请认证-平台录入
    source: code_enum
  - value: SIMPLE
    label: 简易认证
    source: code_enum
  transitions: []
- name: 租户产品迁移状态
  field: tenant_product.is_migratory
  states:
  - value: Y
    label: 已迁移
    source: code_enum
  - value: N
    label: 未迁移
    source: code_enum
  transitions: []
calibers:
- name: 有效企业
  predicate: cust_company_info.enable = 'Y'
  scope: 企业查询/证件号反查/名称反查的通用口径
  evidence: code:CustFacade.getCustCompanyByCertificationNo / getDbTenantCodeById
    等
- name: 企业主数据行
  predicate: cust_company_info.data_type = 'MAIN' AND cust_company_info.enable = 'Y'
  scope: 建档状态与客户状态更新时必须命中主数据行
  evidence: 'code:CustCompanyInfoApplication#appenUpdateCustBulidStatus / #updateCustBuildStatus'
- name: 有效联系人
  predicate: cust_person_info.enable = 'Y' AND cust_person_info.status IN ('ADD','EFFECT')
  scope: listCompanyUser 按企业查联系人
  evidence: code:PlatFormUserApplication#listCompanyUser
- name: 企业管理员
  predicate: cust_person_info.user_type = 'admin' AND cust_person_info.enable = 'Y'
  scope: 取管理员作为授权/推送操作人
  evidence: code:PlatFormUserApplication#viewOperAuthFileUrl / CustFacade#getCompanyPersonByUserId
