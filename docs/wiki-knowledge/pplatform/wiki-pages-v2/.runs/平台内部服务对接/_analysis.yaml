term_bridges:
- term: 经办人
  aliases:
  - operator
  - 被授权人
  - 子账号
  - cust_person_info.user_type=operator
  maps_to: cust_person_info.user_type = 'operator'（会话中以 UserTypeEnum.operator 判定）
  also_confused_with:
  - admin（客户管理员）
  - guest（游客）
  - sys_cust_user_rel 中 role_id 指向的普通角色
  adjudication: boundary
  boundary: admin 代表企业管理员、是授权/推送的操作主体；operator 为经办人，需先签署子账号授权书并可按产品冻结；guest 为游客，查询经办人时被显式过滤（filter
    掉 guest 角色关联）。用户类型判定入口 SysProviderImpl#getUserType，取不到角色时降级为 guest。
- term: 冻结
  aliases:
  - FREEZE
  - is_freeze=Y
  - freezeCustAdminUsers
  - freezeCustAllUsers
  - userType 冻结
  maps_to: sys_cust_user_rel.is_freeze = 'Y'（企业-用户-角色-产品关联维度）
  also_confused_with:
  - cust_company_info.cust_status = 'FREEZE'（企业整体冻结）
  - sys_user 登录态冻结（ISysUserProvider.freeze，代码中该分支已注释）
  adjudication: boundary
  boundary: 三者层级不同：企业冻结改 cust_status=FREEZE 并冻结管理员关联（freezeCustAdminUsers）；企业注销冻结全部用户（freezeCustAllUsers）；经办人冻结只改对应产品行的
    is_freeze='Y'，且当该企业下所有关联都被冻结时把 cust_person_info.enable 置 'N'，解冻时恢复 'Y'。登录冻结代码当前被注释，不要据
    is_freeze 推断登录态。
- term: 建档状态
  aliases:
  - cust_build_status
  - 认证状态
  - CustBuildStatusEnum
  maps_to: cust_company_info.cust_build_status
  also_confused_with:
  - cust_company_info.cust_status（客户状态）
  - cust_person_info.cust_build_status
  - cust_company_info.check_status
  adjudication: boundary
  boundary: cust_build_status 描述认证/建档流程（INIT→CUST_CONFIRM_AWAIT→CUST_BUILDING→BUILD_SUCCESS/BUILD_FAIL，简易认证另有
    AWAIT_CUST_CONFIRM），cust_status 描述客户生命周期（ADD/CHANGE/EFFECT/FREEZE/WRITEOFF）；两者在建档成功时联动（BUILD_SUCCESS
    同时写 EFFECT），但企业冻结/注销只动 cust_status。
- term: 认证方式
  aliases:
  - identifyStyle
  - SELF/INVITE/INVITE_AGW/SIMPLE
  - 自主认证/邀请认证/简易认证
  maps_to: cust_company_info.identify_style
  also_confused_with:
  - cust_build_type（PC_BUILD/AGW_BUILD）
  - cust_from（平台邀请）
  - cust_source（PLATFORM_PUSH）
  - oper_channel（运营中台渠道）
  adjudication: boundary
  boundary: identify_style 决定提交后落到哪个建档状态与是否推运营中台；cust_build_type 只表达入口渠道；cust_from/cust_source
    是来源展示字段；oper_channel 是运营中台侧渠道编码，勿混用。
- term: 租户编码
  aliases:
  - dbTenantCode
  - tenantFlgEn
  - appTenantCode
  - tenantFlag
  - ssoTenantChanel
  maps_to: tenant_setting_config.db_tenant_code（数据隔离键）
  also_confused_with:
  - sso_tenant_chanel（SSO 渠道，作为 sysChannel 用）
  - tenant_flg_en / tenantFlag / appTenantCode（外部请求标识）
  adjudication: boundary
  boundary: dbTenantCode 是库内数据隔离与查询条件；ssoTenantChanel 是 SSO 渠道，对外请求运营中台时充当 sysChannel；appTenantCode/tenantFlag
    是外部系统传入的租户标识，服务端需查回 dbTenantCode（getFirstByDbTenantCode），不存在时走假贴牌（TenantSettingConfigShareDO→主租户）。
- term: 产品编码
  aliases:
  - productCode
  - platformProductCode
  - ProductCodeEnum
  maps_to: platform_product.product_code / tenant_product.platform_product_code
  also_confused_with:
  - '''ACCOUNT_PRODUCT''（平台产品编码常量，侧边栏查询用）'
  - ProductCodeEnum.ACFLOW/ORDER/ACCOUNTPRODUCT/RVSFACTOR/AMS
  - Nacos 补充产品 supplement（默认 ORDER）
  adjudication: boundary
  boundary: ACCOUNT_PRODUCT 是平台侧产品编码，ACFLOW 等是业务系统产品码；ACFLOW 新增权限时会把 supplement 配置的其他产品一并加入、冻结/解冻时也按同一集合展开，因此权限判定不能只看单产品。
- term: 企业角色
  aliases:
  - companyType
  - custType
  - roleType
  - cust_company_type
  maps_to: cust_company_info.cust_company_type（JSON 数组）/ cust_role_info.role_type
    / cust_person_info.company_type
  also_confused_with:
  - sys_role（系统角色，如 guest、ROLE_CODE_NORMAL）
  - userType（admin/operator/guest）
  adjudication: boundary
  boundary: 企业角色取值来自 CustCompanyTypeEnum（CORE/FINANCE/SUPPLIER/CORE_MANAGER/PROJECT_COMPANY/DEALER/PLATFORM_OPERATOR_COMPANY/CORPORATION_COMPANY），存
    JSON 数组；sys_role 是用户系统角色，userType 是用户类型，三者维度不同。侧边栏只暴露其中 8 类。
- term: 运营中台企业 id
  aliases:
  - platformCustId
  - custEnterpriseId
  - operPlatCustId
  - platCustId
  maps_to: cust_role_info.platform_cust_id（按企业 code + 角色一行）
  also_confused_with:
  - cust_company_info.id（产融内部企业 id）
  - cust_person_info.id / user_id
  - cust_enterprise_user_id
  adjudication: boundary
  boundary: 内部企业 id 与运营中台 id 必须通过 cust_role_info（或变更记录 oper_cust_info.custEnterpriseId）换算；获取
    token 时若 cust_status=CHANGE 必须改从 cust_change_record 最新记录取 custEnterpriseId，否则用
    cust_role_info.platform_cust_id。
- term: 渠道
  aliases:
  - sysChannel
  - channel
  - operChannel
  - targetSysChannel
  - sourceSysChannel
  maps_to: sso_tenant_chanel（来源渠道）/ 运营中台返回的 channel（运营渠道）
  also_confused_with:
  - tenant_setting_config.platform_secret_key（按 sysChannel 反查的秘钥）
  - systemLinkFacade 的 commonChannel/editChannel 配置
  adjudication: boundary
  boundary: sourceSysChannel 表示发起系统（取自 ssoTenantChanel），targetSysChannel 表示目标互通系统；operChannel
    是运营中台返回的获客渠道，当 identify_style=INVITE_AGW 且 channel==commonChannel 时回落变更记录的 oper_channel
    或 editChannel。
- term: 集团/成员
  aliases:
  - rootCustId
  - parentCustId
  - rootGroupId
  - parentGroupId
  - CustGroupRelDO
  maps_to: cust_group_rel 的企业维度（cust/parent/root cust_id）与节点维度（parent/root group_id）
  also_confused_with:
  - cust_company_info.head_company（总部标识）
  adjudication: boundary
  boundary: cust_id/root_cust_id 是企业身份，parent_group_id/root_group_id 是树节点身份；同一企业在不同
    root 集团下可有多行，逐行以 cust_type（角色）区分；CORPORATION_COMPANY 企业不可再被挂为他人子级。
- term: 授权书/协议文件
  aliases:
  - operAuthAgreement
  - filePath
  - contractPath
  - 子账号授权书
  maps_to: cust_doc_facade 生成的合同文件路径，写入 PlatClientUserInfoDto.ext.filePath；模板取 tenant_setting_config.oper_auth_agreement
  also_confused_with:
  - CFCA 授权协议（PlatformConstant.DATA_SOURCE_CFCA_AUTH，businessType='cust_company_info'）
  - AMS 外部 http 链接（需下载转存 COS）
  adjudication: boundary
  boundary: 子账号授权书用于新增/修改经办人（且仅 ACFLOW/ORDER/ACCOUNTPRODUCT 产品）；CFCA 授权协议用于开通电子签章场景；外部
    http 链接先落产融桶再生成短链。
rules:
- name: 新增经办人前必须签署子账号授权书
  content: addBatchOperatorUser/updateOperUser 在写用户前先校验手机号重复与 checkAddPersonInfo，再调
    createAndSignUserContract 生成并（在已开通 CA 时）在线签署子账号授权书，把 filePath 写入 ext；仅当 productCode
    ∈ {ACFLOW, ORDER, ACCOUNTPRODUCT} 才生成合同，RVSFACTOR 不生成。
  impact: 签署失败直接抛出并阻断经办人新增/修改；已开通 CA 的企业走 signOperuserAuthOnLine 真正签署，未开通只生成合同文件。
  field_targets:
  - cust_person_info.phone
  - cust_person_info.user_name
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - PlatClientUserInfoDto.ext.filePath
  evidence: 'code:PlatFormUserApplication#addBatchOperatorUser / #createAndSignUserContract
    / #checkAddPersonInfo'
- name: 线上保理(RVSFACTOR)经办人识别以 SSO 为准且必须分配产品角色
  content: productCode=RVSFACTOR 时，若 sso_user 已存在则强制把入参 userName 覆盖为 SSO 的 userName（因其
    userName 恒传手机号）；且 productTypeCodeRoleList 为空时抛「请先分配产品角色！」。
  impact: 避免同名/改名导致的历史用户错乱；未分配角色直接失败。
  field_targets:
  - sso_user.user_name
  - PlatClientUserInfoDto.userName
  - PPlatformLocalTypeUserDTO.productTypeCodeRoleList
  evidence: 'code:PlatFormUserApplication#addOrUpdateOperatorUser / #updateOperUser'
- name: 经办人冻结与联系人有效标志联动
  content: 冻结：把该企业该用户在所有相关产品（ACFLOW 时会展开 supplement 配置的产品集合）上的 sys_cust_user_rel.is_freeze
    置 'Y'；若该用户全部关联都被冻结，则把 cust_person_info.enable 置 'N'。解冻：is_freeze 置 'N'，若联系人曾被置
    'N' 则恢复 'Y'；不支持的 operationType 抛异常。
  impact: 决定经办人是否仍出现在企业联系人列表（查询条件含 enable='Y'）。
  field_targets:
  - sys_cust_user_rel.is_freeze
  - cust_person_info.enable
  - sys_user.update_time
  evidence: code:PlatFormUserApplication#freezeOrThawOperatorUser
- name: 企业冻结/解冻/注销联动用户
  content: custStatusOperator 先校验 config.allowStatusList 是否包含当前 cust_status，不满足抛「当前操作不允许」；冻结=改
    cust_status 并冻管理员关联（FREEZE），解冻=改回 EFFECT 并解冻管理员（UNFREEZE），注销=WRITEOFF 并冻结该企业全部用户（DISABLE），同时按企业角色逐个同步用户状态到业务系统。
  impact: 企业级状态与用户级冻结强绑定，误操作会连带大面积用户被冻结。
  field_targets:
  - cust_company_info.cust_status
  - cust_role_info.status
  - sys_cust_user_rel.is_freeze
  - cust_person_info.enable
  evidence: 'code:CustCompanyInfoApplication#custStatusOperator / #freeze / #unfreeze
    / #diable / #execCustUserStatusOperation / #performOperation'
- name: 简易认证不支持开通电子签章
  content: submitForSimpleAuth 中若历史/运营侧标记 need_register_ca='Y'，调用 CustCompanyCaPolicy.enforceMustNotOpenCa
    强制校正为不开通，并把 need/ca/bs 相关字段落库修正。
  impact: 简易建档企业不会走 CA 开通与协议同步（资金方例外分支也被该校正约束）。
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.need_register_bs
  - cust_company_info.bs_register_status
  evidence: code:CustCompanyInfoApplication#submitForSimpleAuth
- name: 简易认证资金方直接生效
  content: companyType=FINANCE 时，简易认证无需运营中台审批，直接 custCompanyInfoDao.updateStatus(custId,
    BUILD_SUCCESS, EFFECT)，直签授权协议，推送企业数据到中台并初始化根组织。
  impact: 资金方建档路径与普通企业不同，不产生运营中台审核在途。
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.cust_status
  evidence: 'code:CustCompanyInfoApplication#submitForSimpleAuth(FINANCE 分支) / #confirmCustInfoForSimpleAuth'
- name: 空字段补全只填空不覆盖
  content: handleEmptyFieldsUpdate 依次处理 cust_person_info、sys_user、sso_user：仅当目标字段为空且入参非空时才更新
    name/user_name/email，单条失败只 warn 不阻断主流程；cust_person_info 更新使用加密手机号匹配。
  impact: 保证既有数据不被覆盖，同时让上游（AMS）补全的历史缺失字段落库；异常不外抛。
  field_targets:
  - cust_person_info.name
  - cust_person_info.user_name
  - cust_person_info.email
  - sys_user.name
  - sys_user.user_name
  - sys_user.email
  - sso_user.user_name
  evidence: 'code:PlatFormUserApplication#handleEmptyFieldsUpdate / #updateCustPersonInfoEmptyFields
    / #updateSysUserEmptyFields / #updateSsoUserEmptyFields'
- name: 业务邮箱变更回写登录邮箱的条件
  content: 仅当「旧业务邮箱 == 当前登录邮箱」或「该 userId 只关联 1 个企业」时，才把新业务邮箱同步为 sys_user 登录邮箱（sysProvider.updateEmail）；否则仅记日志不同步。
  impact: 多企业用户的业务邮箱变更不会误改登录邮箱。
  field_targets:
  - cust_person_info.email
  - sys_user.email
  evidence: 'code:PlatFormUserApplication#updateOperUser → #updateUserLoginEmail'
- name: 资产审核运营人员同步限供应商且只补空/离职
  content: syncAssetOperator 仅当 companyType=SUPPLIER 才执行；目标运营人员必须存在于 operCustFacade.getOperatorList()；仅对
    operator_id 为空或原运营人员已离职（不在有效集合中）的联系人更新 operator_id/operator_realname/operator，其余跳过并计数；更新后异步推送运营人员（custPersonSyncApplication.asyncPushOperator2Oper）并写变更记录（ASSET_AUDIT_SYNC）。
  impact: 非供应商企业返回「企业角色不适用」；已占用运营人员不被覆盖，返回体含 updateCount/skipCount。
  field_targets:
  - cust_person_info.operator_id
  - cust_person_info.operator_realname
  - cust_person_info.operator
  - cust_person_info.ref_cust_company_info
  - cust_person_info.enable
  evidence: code:AssetOperatorSyncApplication#syncAssetOperator
- name: AMS 新增企业联系人加锁防并发
  content: addEnterpriseContact 以 'PPB:ADDENTERPRISECONTACT:' + companyName + '-'
    + bizLabel 为 key 获取 Redis 锁（超时 60000ms，持有 120000ms），失败抛「获取锁失败，请稍后重试」，异常时回写 code=500/resultCode=04
    并 final 内用 Lua 释放锁。
  impact: 并发同名+同品牌联系人请求串行化；异常不中断上游而是以响应码返回。
  field_targets:
  - cust_company_info.name
  evidence: code:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/client/cust/PlatFormAmsProviderImpl.java#addEnterpriseContact
- name: Provider 层跨租户查询开关
  content: PlatFormUserProviderImpl 所有方法进入应用层前统一 MetaDataThreadLocalConfig.setDbTenantCode("all")；PlatFormRvsApplication
    与 CustGroupRelApplication 同样先置 "all"，之后按需按企业 dbTenantCode 再过滤。
  impact: 内部服务对接默认跨租户可见，租户过滤必须显式加条件，否则会读到其他租户数据。
  field_targets:
  - cust_company_info.db_tenant_code
  - cust_person_info.db_tenant_code
  evidence: code:PlatFormUserProviderImpl（全部方法）/ PlatFormRvsApplication#getAndCreateTempCompany
- name: RVS 临时企业初始化
  content: getAndCreateTempCompany 按 name + certificationNo + enable='Y' + dbTenantCode
    查企业，查不到则新建：code=uuid、custBuildStatus=INIT、custStatus=ADD、custCompanyType='[]'；查到则取第一条返回。
  impact: RVS 侧可安全幂等调用；新建企业处于初始态，后续必须走建档流程才能生效。
  field_targets:
  - cust_company_info.code
  - cust_company_info.name
  - cust_company_info.certification_no
  - cust_company_info.enable
  - cust_company_info.cust_build_status
  - cust_company_info.cust_status
  - cust_company_info.cust_company_type
  evidence: code:PlatFormRvsApplication#getAndCreateTempCompany
- name: CA 状态对外返回的双重校验
  content: queryCompanyByCustId 先取 cust_company_info.ca_register_status，再调 caCertificationPreCheckApplication.caRegisterStatusY(id)；默认返回
    'N'，bflag 为真则 'Y'，但若 bflag 为真而库中 ca_register_status='N' 则回落 'N'。
  impact: 对外 CA 开通状态以「实时校验 + 库值」双重收敛，避免状态超前暴露。
  field_targets:
  - cust_company_info.ca_register_status
  evidence: code:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/client/cust/PlatFormCustProviderImpl.java#queryCompanyByCustId
- name: 运营中台同步鉴权
  content: getToken 用 md5(getSecretKey(sysChannel) + sysChannel + loginName) 作 sysSecret，秘钥取自
    tenant_setting_config.platform_secret_key（按 sso_tenant_chanel 反查，缺失抛「租户配置秘钥信息不存在」）；返回
    code!='200' 抛「请求token返回错误」。
  impact: 所有跨系统同步（syncOperation/getAuthUrl/queryAuthPass）依赖该 token，租户配置缺失会整体不可用。
  field_targets:
  - tenant_setting_config.sso_tenant_chanel
  - tenant_setting_config.platform_secret_key
  evidence: 'code:SystemLinkFacade#getToken / #getSecretKey'
- name: 互通产品授权角色区分
  content: isOperator=true 时 role 取 OPERATOR_PER，并在请求中额外带 companyUserLoginName（企业管理员手机号）与
    cellphone（当前经办人）；否则 role=AUTH_PER。管理员缺失抛「公司管理员信息不存在」。
  impact: 经办人授权链接必须能定位到管理员作为授权主体。
  field_targets:
  - cust_person_info.phone
