  also_confused_with:
  - sys_user
  adjudication: boundary
  boundary: 联系人用于业务身份，sys_user 用于登录身份，通过 user_id 关联
- term: 管理员
  aliases:
  - admin
  maps_to: cust_person_info.user_type = 'admin'
  also_confused_with: []
  adjudication: synonym
  boundary: 企业管理员角色
- term: 经办人
  aliases:
  - operator
  maps_to: cust_person_info.user_type = 'operator'
  also_confused_with: []
  adjudication: synonym
  boundary: 企业经办人角色
- term: 游客
  aliases:
  - guest
  maps_to: cust_person_info.user_type = 'guest'
  also_confused_with: []
  adjudication: synonym
  boundary: 企业游客角色
- term: 租户
  aliases:
  - 租户配置
  maps_to: tenant_setting_config
  also_confused_with: []
  adjudication: synonym
  boundary: 租户主数据
- term: 产品
  aliases:
  - 平台产品
  maps_to: platform_product
  also_confused_with:
  - tenant_product
  adjudication: boundary
  boundary: 平台产品定义为 platform_product，租户开通产品为 tenant_product
- term: 项目
  aliases: []
  maps_to: tenant_project
  also_confused_with:
  - cust_project_rel
  adjudication: boundary
  boundary: 租户项目为 tenant_project，客户关联项目为 cust_project_rel
rules:
- name: 企业建档提交状态变更
  content: 根据认证方式(identifyStyle)决定提交后的企业建档状态：邀请认证-平台录入进入CUST_BUILDING；邀请认证-客户录入/注册认证进入CUST_CONFIRM_AWAIT；简易认证进入AWAIT_CUST_CONFIRM；资金方简易认证直接进入BUILD_SUCCESS。
  impact: 影响企业认证流程和后续权限开通
  field_targets:
  - cust_company_info.cust_build_status
  evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus + submitCust
    + submitForSimpleAuth
- name: 企业冻结级联冻结管理员
  content: 冻结企业时同时调用 freezeCustAdminUsers 冻结该企业下的所有管理员用户；解冻企业时同时解冻管理员。
  impact: 企业冻结后管理员无法登录
  field_targets:
  - sys_cust_user_rel.is_freeze
  - sys_user.status
  evidence: code_path:CustCompanyInfoApplication.java:freeze -> freezeCustAdminUsers
- name: 经办人添加校验重复
  content: 添加经办人时校验手机号在企业产品下是否已存在，用户名是否已存在，重复则报错。
  impact: 防止重复添加经办人
  field_targets:
  - sys_cust_user_rel
  - sso_user.user_name
  evidence: code_path:PlatFormUserApplication.java:checkAddPersonInfo
- name: 经办人添加签署授权书
  content: 添加经办人时根据产品编码(ACFLOW/ORDER/ACCOUNTPRODUCT)创建并签署子账号授权书，并将文件路径写入ext字段。
  impact: 满足合规要求
  field_targets:
  - cust_person_info.ext
  evidence: code_path:PlatFormUserApplication.java:createAndSignUserContract
- name: 企业删除级联删除
  content: 删除企业时级联删除联系人、关联项目、开通产品、企业关联用户，若用户无其他未冻结关联则删除系统用户。
  impact: 保证数据一致性
  field_targets:
  - cust_person_info
  - cust_project_rel
  - cust_auth_application
  - sys_cust_user_rel
  evidence: code_path:CustCompanyInfoApplication.java:deleteCustInfo
- name: 资产审核运营人员同步更新规则
  content: 仅当企业角色为SUPPLIER时，将企业下联系人中运营人员为空或已离职的更新为新的运营人员，并记录变更。
  impact: 资产审核运营人员分配
  field_targets:
  - cust_person_info.operator_id
  - cust_person_info.operator_realname
  - cust_person_info.operator
  evidence: code_path:AssetOperatorSyncApplication.java:syncAssetOperator
reqdoc_claims: []
