state_machines:
- name: 短链有效期状态
  field: short_link.is_forever
  states:
  - value: Y
    label: 永久有效
    source: db_dist
  - value: N
    label: 限时有效
    source: code_const
  transitions: []
calibers:
- name: 永久短链不校验到期时间
  predicate: short_link.is_forever = 'Y'
  scope: 短链访问跳转
  evidence: ShortLinkController.java:48 + db
- name: 限时短链到期校验
  predicate: short_link.is_forever = 'N'
  scope: 短链访问跳转
  evidence: ShortLinkController.java:48
- name: 普通短链直接跳转
  predicate: short_link.type = 'NORMAL'
  scope: 短链访问跳转
  evidence: ShortLinkController.java:52
- name: 文件短链加密后跳转
  predicate: short_link.type = 'FILE'
  scope: 短链访问跳转
  evidence: ShortLinkController.java:55 + db
- name: 企业认证需要审核
  predicate: cust_setting_config.need_auth_verify = 'yes'
  scope: 企业变更/认证审核
  evidence: CustSettingConfigEnhanceService.java + db
- name: 非关键信息变更需要审核
  predicate: cust_setting_config.need_verify_no_key = 'yes'
  scope: 企业变更审核
  evidence: CustSettingConfigEnhanceService.java + db
- name: 人脸识别关闭
  predicate: cust_setting_config.face_recognition = 'no'
  scope: 企业认证配置
  evidence: db
- name: 打款验证开启
  predicate: cust_setting_config.payment_verification = 'yes'
  scope: 企业认证配置
  evidence: db
term_bridges:
- term: 永久短链
  aliases:
  - 永久有效短链
  - isForever=Y
  maps_to: short_link.is_forever = 'Y'
  also_confused_with:
  - 限时短链
  adjudication: boundary
  boundary: is_forever='Y' 时完全不校验 expire_time；'N' 时校验
- term: 限时短链
  aliases:
  - 非永久短链
  - isForever=N
  maps_to: short_link.is_forever = 'N'
  also_confused_with:
  - 永久短链
  adjudication: boundary
  boundary: 需 expire_time > now，否则过期
- term: 普通短链
  aliases:
  - NORMAL 短链
  maps_to: short_link.type = 'NORMAL'
  also_confused_with:
  - 文件短链
  adjudication: boundary
  boundary: 直接使用 source_url 重定向
- term: 文件短链
  aliases:
  - FILE 短链
  maps_to: short_link.type = 'FILE'
  also_confused_with:
  - 普通短链
  adjudication: boundary
  boundary: source_url 需 filePathEncrypt 后重定向
- term: 企业认证审核
  aliases:
  - needAuthVerify
  maps_to: cust_setting_config.need_auth_verify = 'yes'
  also_confused_with:
  - 非关键信息变更审核
  adjudication: boundary
  boundary: 代码中 'no' 直接返回不需要审批；'yes' 继续判断
- term: 非关键信息变更审核
  aliases:
  - needVerifyNoKey
  maps_to: cust_setting_config.need_verify_no_key = 'yes'
  also_confused_with:
  - 企业认证审核
  adjudication: boundary
  boundary: 关键信息有变更时先返回需要审核，非关键信息再按此开关判断
- term: 邀请码有效期
  aliases:
  - invitationCodePeriod
  maps_to: cust_setting_config.invitation_code_period
  also_confused_with:
  - 邀请码重复发送时间间隔
  adjudication: boundary
  boundary: 数值列，单位在 invitation_code_period_unit
rules:
- name: 短信发送失败不抛异常
  content: PlatMessageApplication.sendSmsMessage 捕获异常并返回 fail，不向调用方抛出
  impact: 短信发送失败不影响主流程
  field_targets: []
  evidence: PlatMessageApplication.java:34-45
- name: 微信验证码通知失败不抛异常
  content: WechatNotificationService.sendVerificationCodeNotification 捕获异常记录日志并返回
    true
  impact: 微信通知失败不影响主流程
  field_targets: []
  evidence: WechatNotificationService.java:70-80
- name: 验证码场景白名单
  content: MessageFacade.VERIFY_CODE_SCENES 指定需要走 sendVerifyCode 的场景：批量签署、落地手机、重置密码、注册手机、法人授权、客户建档认证、CA意向确认
  impact: 决定是否生成并注入验证码
  field_targets: []
  evidence: MessageFacade.java:VERIFY_CODE_SCENES
- name: 验证码有效期配置缺失抛异常
  content: sendVerifyCode 中若 indentifycodeFacade.getIndentifyConfigDTO 返回空，抛 CommonException
    缺少验证码有效期配置
  impact: 验证码发送依赖有效期配置
  field_targets: []
  evidence: MessageFacade.java:sendVerifyCode
- name: 合同签署验证码多笔限制
  content: CustVerifyCodeController.sendVerifyCode 中 serviceKey 与 businessId 不能同时为多笔，否则抛异常
  impact: 限制批量签署验证码入参组合
  field_targets: []
  evidence: CustVerifyCodeController.java:sendVerifyCode
- name: 短信验证码手机号回填合同签署表
  content: 当消息类型为 PHONE 时，CustVerifyCodeApplication 将接收手机号通过 contractSignInfoProvider.setVerifyContractPhone
    写入合同签署信息
  impact: 验证码接收人落库到合同签署侧
  field_targets: []
  evidence: CustVerifyCodeApplication.java:sendVerifyCode
- name: 微信验证码通知模板固定
  content: 微信验证码通知使用 sysCode=beehive，templateNo=1000001，dataMap 含 phone_number/code/system_name
  impact: 固定短信/企微验证码模板
  field_targets: []
  evidence: WechatNotificationService.java:TemplateNo/SysCode
- name: 站内信本地与下游路由
  content: CustNoticeService.pageTodo 对 ACCOUNT_PRODUCT 映射本地 system=pplatform，BEECREDIT
    映射本地 system=BEECREDIT，其余走 Dubbo 下游产品
  impact: 决定待办查询走本库还是下游
  field_targets: []
  evidence: CustNoticeService.java:resolveLocalNoticeSystem
- name: 待办未读口径
  content: 待办查询与统计使用 noticeStatus='0' 作为未完成/未读条件
  impact: 待办数量统计口径
  field_targets: []
  evidence: CustNoticeService.java:pageTodo + NoticeFacade.java:pageTodoCount
- name: 短链过期校验
  content: is_forever='N' 且 expire_time <= now 时抛出链接已过期
  impact: 短链访问拦截
  field_targets:
  - short_link.is_forever
  - short_link.expire_time
  evidence: ShortLinkController.java:48,83
- name: 短链类型路由
  content: type='NORMAL' 直接跳转 source_url；type='FILE' 先 filePathEncrypt(source_url,false)
    再跳转
  impact: 文件短链需走文件服务加密
  field_targets:
  - short_link.type
  - short_link.source_url
  evidence: ShortLinkController.java:52-55,92-95
- name: 短链 ID 映射校验
  content: shortLink 接口取 number 最后一位为校验码，LongBase64Utils.decode 得到 id，并用 generateVerifyCode(link.number)
    校验
  impact: 防止短链被枚举
  field_targets:
  - short_link.number
  - short_link.id
  evidence: ShortLinkController.java:71-90
reqdoc_claims:
- claim: 通知组件以邮件/短信/微信三类抽象承载触达场景
  code_status: confirmed
  code_evidence: MessageFacade.java:MessageTypeEnum + WechatNotificationService.java:1
    + reqdoc:平台基础组件业务规则文档#2.2
  action: anchor
- claim: 发送失败记录日志，不抛异常给业务
  code_status: confirmed
  code_evidence: PlatMessageApplication.java:34 + WechatNotificationService.java:70
    + reqdoc:平台基础组件业务规则文档#2.2
  action: anchor
- claim: 需要短链时由 ShortLinkAppication 生成短链
  code_status: uncovered
  code_evidence: ShortLinkController.java:1 仅见访问，未见 ShortLinkAppication 生成逻辑全文 + reqdoc:平台基础组件业务规则文档#2.2
  action: review
- claim: 短信需要幂等时使用 RedisSmsLock 检查/加锁
  code_status: uncovered
  code_evidence: 链路上未出现 RedisSmsLock 调用 + reqdoc:平台基础组件业务规则文档#2.2
  action: review
- claim: 所有通知同步发送站内信
  code_status: refuted
  code_evidence: CustMessageSendService.java:sendAllMessageForSubmit 分别发送站内信、待办、短信，未统一强制站内信
    + reqdoc:客户管理平台业务规则文档#3.5.3
  action: prose_only
- claim: 邀请码随机生成8位、30天有效
  code_status: uncovered
  code_evidence: 未在代码中见邀请码生成逻辑；DB cust_setting_config.invitation_code_period=1 + reqdoc:客户管理平台业务规则文档#3.2.2
  action: review
