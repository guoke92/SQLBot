state_machines:
- name: 企业建档状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始
    source: code_enum
  - value: BUILD_FAIL
    label: 建档失败/拒绝
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: CUST_BUILDING
    label: 客户提交/运营中台审核中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认（简易认证）
    source: code_enum
  transitions:
  - from: INIT
    event: submit
    to: CUST_CONFIRM_AWAIT
    evidence: CustCompanyInfoApplication.java:getCustBuildStatus
  - from: INIT
    event: submit(INVITE_AGW)
    to: CUST_BUILDING
    evidence: CustCompanyInfoApplication.java:getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交
    to: CUST_BUILDING
    evidence: CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核通过
    to: BUILD_SUCCESS
    evidence: CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核拒绝
    to: BUILD_FAIL
    evidence: CustCompanyInfoApplication.java:messageNotify
  - from: BUILD_FAIL
    event: 重新提交
    to: CUST_CONFIRM_AWAIT
    evidence: CustCompanyInfoApplication.java:messageNotify
