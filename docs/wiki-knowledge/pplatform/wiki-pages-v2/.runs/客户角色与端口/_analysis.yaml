field_semantics:
- table: cust_role_info
  field: id
  meaning: 表主键
  evidence: db
- table: cust_role_info
  field: code
  meaning: 编码，新增角色时通过 DataModelUtils.uuid() 生成
  evidence: code
- table: cust_role_info
  field: role_type
  meaning: 企业角色编码，如 CORE、SUPPLIER、FINANCE 等；写入时去除 JSON 引号
  evidence: db+code
- table: cust_role_info
  field: status
  meaning: 角色状态：ADD-未激活/新增，EFFECT-已激活/生效，FREEZE-冻结，WRITEOFF-注销
  evidence: db+code
- table: cust_role_info
  field: ref_cust_company_info
  meaning: 关联客户企业编码，指向 cust_company_info.code
  evidence: code
- table: cust_role_info
  field: ref_cust_auth_application
  meaning: 应用客户角色（关联客户开通产品），当前代码未直接使用
  evidence: db
- table: cust_role_info
  field: platform_cust_id
  meaning: 关联平台企业ID
  evidence: db
- table: cust_role_info
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: db
- table: cust_role_info
  field: enable
  meaning: 逻辑启用标识（Y/N），查询时常用 enable=Y 过滤
  evidence: db+code
- table: platform_product_cust_role
  field: company_type_code
  meaning: 企业角色编码，产品下支持的企业角色（端口）
  evidence: db
- table: platform_product_cust_role
  field: company_type_name
  meaning: 企业角色名称，如核心企业、供应商等
  evidence: db
- table: platform_product_cust_role
  field: product_code
  meaning: 产品编码，如 ACCOUNT_PRODUCT、ACFLOW、AMS 等
  evidence: db
- table: platform_product_cust_role
  field: enable
  meaning: 逻辑启用标识（Y/N）
  evidence: db
- table: cust_project_rel
  field: company_type
  meaning: 客户在项目中的企业角色，添加角色后同步为第一个角色值
  evidence: code
state_machines:
- name: 客户角色状态机
  field: cust_role_info.status
  states:
  - value: ADD
    label: 未激活
    source: code_enum
  - value: EFFECT
    label: 已激活
    source: code_enum
  - value: FREEZE
    label: 冻结
    source: db_dist
  - value: WRITEOFF
    label: 注销
    source: db_dist
  transitions:
  - from: '*'
    event: freeze
    to: FREEZE
    evidence: code_path:CustRoleApplication.java:freeze -> operatorCustRoleStatus(role,
      CustRoleStatusConstant.FREEZE)
  - from: FREEZE
    event: unFreeze
    to: EFFECT
    evidence: code_path:CustRoleApplication.java:unFreeze -> operatorCustRoleStatus(role,
      CustRoleStatusConstant.EFFECT)
  - from: '*'
    event: logout
    to: WRITEOFF
    evidence: code_path:CustRoleApplication.java:logout -> operatorCustRoleStatus(role,
      CustRoleStatusConstant.WRITEOFF)
  - from: '*'
    event: updateStatusByCustCompany
    to: 传入状态
    evidence: code_path:CustRoleApplication.java:updateStatusByCustCompany，跳过已有 WRITEOFF
      的记录
  - from: 无
    event: addRoleInfo
    to: ADD
    evidence: code_path:CustCompanyIfoEnchanceService.java:setCustCompany 中 custRoleInfoDO.setStatus(CustStatusEnum.ADD.getDictKey())
calibers:
- name: 有效客户角色
  predicate: cust_role_info.enable = 'Y'
  scope: 查询当前企业已存在的企业角色
  evidence: code_path:CustRoleApplication.java:getCompanyTypeByCompanyCode 使用 enable=Y
- name: 已激活客户角色
  predicate: cust_role_info.status = 'EFFECT'
  scope: 客户角色状态为已激活
  evidence: 'code_path:CustRoleApplication.java:unFreeze；db_dist: EFFECT 19791'
- name: 已冻结客户角色
  predicate: cust_role_info.status = 'FREEZE'
  scope: 客户角色状态为冻结
  evidence: 'code_path:CustRoleApplication.java:freeze；db_dist: FREEZE 11'
- name: 已注销客户角色
  predicate: cust_role_info.status = 'WRITEOFF'
  scope: 客户角色状态为注销
  evidence: 'code_path:CustRoleApplication.java:logout；db_dist: WRITEOFF 44'
- name: 平台产品有效端口
  predicate: platform_product_cust_role.enable = 'Y'
  scope: 产品下支持的企业角色（端口）列表
  evidence: 'code_path:LocalTypeMenuService.java:listTenantProductMenuConfig；db_dist:
    enable Y 53'
term_bridges:
- term: 企业角色
  aliases:
  - 客户角色
  - companyType
  - roleType
  - company_type_code
  - role_type
  maps_to: cust_role_info.role_type / platform_product_cust_role.company_type_code
  also_confused_with:
  - cust_company_info.cust_company_type
  - cust_person_info.company_type
  adjudication: boundary
  boundary: cust_role_info.role_type 是客户与产品的角色关联，单个角色值；cust_company_info.cust_company_type
    是企业主数据上的角色列表（JSON 数组）；cust_person_info.company_type 是联系人所属角色。
- term: 端口
  aliases:
  - 产品端口
  - 企业角色端口
  maps_to: platform_product_cust_role
  also_confused_with:
  - 菜单端口
  - 系统接入端口
  adjudication: synonym
  boundary: 在客户角色与菜单配置语境中，'端口'指 platform_product_cust_role 表中定义的产品下可支持的企业角色（company_type_code），每个端口对应一个企业角色。
rules:
- name: 角色全量覆盖规则
  content: 客户角色通过 addRoleInfo 全量覆盖：先按企业 code 删除旧角色，再按 roleType JSON 数组逐个插入新角色，默认状态为
    ADD；每个角色 code 重新生成，roleType 去除引号，dbTenantCode 取自关联企业。
  impact: 影响 cust_role_info 表记录增删和 role_type 值
  field_targets:
  - cust_role_info.role_type
  - cust_role_info.status
  - cust_role_info.ref_cust_company_info
  evidence: code_path:CustRoleApplication.java:addRoleInfo
- name: 角色状态冻结/解冻/注销规则
  content: 冻结置 status=FREEZE，解冻置 status=EFFECT，注销置 status=WRITEOFF；批量更新企业角色状态时跳过已注销（WRITEOFF）的记录。
  impact: 影响 cust_role_info.status
  field_targets:
  - cust_role_info.status
  evidence: code_path:CustRoleApplication.java:freeze, unFreeze, logout, updateStatusByCustCompany
- name: 项目关联角色同步规则
  content: 添加客户角色后，将该企业所有 cust_project_rel 记录的 companyType 更新为第一个角色值。
  impact: 影响 cust_project_rel.company_type
  field_targets:
  - cust_project_rel.company_type
  evidence: code_path:CustRoleApplication.java:addRoleInfo
- name: 角色同步下游规则
  content: SysRole 的 roleClass 按 "custType_custId" 格式生成，同步下游时解析出 companyType 和 companyId。
  impact: 影响角色事件同步（PlatClientRoleDto）
  field_targets:
  - SysRoleDO.roleClass
  evidence: code_path:RoleFacade.java:generateRoleClass, ClientCustRoleSyncService.java:setInvokeArg
- name: 菜单端口筛选规则
  content: 根据产品 code 查询 platform_product_cust_role 获取所有端口（企业角色），再按租户和产品查询已配置菜单，标记选中状态。
  impact: 影响 tenant_product_menu 配置
  field_targets:
  - platform_product_cust_role.company_type_code
  - tenant_product_menu.company_type
  evidence: code_path:LocalTypeMenuService.java:listTenantProductMenuConfig, listProductCustMenu
reqdoc_claims: []
