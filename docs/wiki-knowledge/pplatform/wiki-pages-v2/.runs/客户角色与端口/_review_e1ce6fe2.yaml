body: '诉求（document_claim）：客户加入产品项目时进行企业角色组合校验——企业在同一产品下存在 2+ 角色时读取 PlatformProductDO.custRoleCombine
  合法组合，非法组合抛 BaseException『系统暂不支持该角色组合』。


  状态：code_status = uncovered。未在给定代码片段中找到 TenantProductApplication#checkProjectProductByCustType
  / checkCustRoleCombine 的实现体，故本主题下不产出对应 process/rule 页。


  待确认：

  1) 校验落点究竟在租户产品应用、平台产品配置还是前端；

  2) custRoleCombine 的存储形态（分隔串/JSON）与合法组合的判定单元（是否以 [[concepts/port]] 的 product_code
  + company_type_code 组合为键）；

  3) 校验失败信息文案是否与文档一致。

  确认后可升格为 rule 页并补 ground:rule 锚点。'
title: 客户角色组合校验
type: process
