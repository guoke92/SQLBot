field_semantics:
- table: ca_certification_info
  field: id
  meaning: CFCA 一证四步认证主键，落库后用于回填 intent_h5_face_json / file_refs_json 等 JSON 块
  evidence: code
- table: ca_certification_info
  field: cust_id
  meaning: 产融企业 id；总公司/分公司行按同一 custId 但 headCompanyData 区分
  evidence: code
- table: ca_certification_info
  field: cust_type
  meaning: 客户类型，默认 COMPANY（企业）
  evidence: code
- table: ca_certification_info
  field: data_date
  meaning: 数据日期 yyyyMMdd，幂等键之一
  evidence: code
- table: ca_certification_info
  field: op_type
  meaning: 上报操作类型，首次落库固定 INSERT
  evidence: code
- table: ca_certification_info
  field: batch_no
  meaning: 上报流水号，INC_yyyyMMddHHmmssSSS_6位hex，总分公司各自独立
  evidence: code
- table: ca_certification_info
  field: data_source
  meaning: CFCA 认证数据来源，路由不同业务场景
  evidence: code
- table: ca_certification_info
  field: head_company_data
  meaning: 是否总公司数据，Y/N；分公司双行场景用于幂等键
  evidence: code
- table: ca_certification_info
  field: submit_status
  meaning: 上送签章中台状态：PENDING/SUCCESS/FAIL（CaSubmitStatusEnum.name()）
  evidence: code
- table: ca_certification_info
  field: notify_agreement_json
  meaning: 协议告知 JSON 列，上送时包装为 notifyAgreementList + notifyTextList
  evidence: code
- table: ca_certification_info
  field: enterprise_four_json
  meaning: 企业工商核验 JSON 列；按 verifyMethod 在 enterprise_four_json 与 enterprise_three_json
    上送键间路由
  evidence: code
- table: ca_certification_info
  field: police_two_json
  meaning: 法人/人员公安二要素核验 JSON 列
  evidence: code
- table: ca_certification_info
  field: intent_sms_json
  meaning: 短信验证码意愿认证 JSON 列
  evidence: code
- table: ca_certification_info
  field: intent_h5_face_json
  meaning: H5 刷脸意愿认证 JSON 列；FaceVerifyController 在人脸通过时回填 DBaaS 请求/响应原文
  evidence: code
- table: ca_certification_info
  field: file_refs_json
  meaning: 附件清单 JSON 列；embeddedFiles.path 存 COS key，上送前转 HTTP 下载链
  evidence: code
- table: ca_certification_info
  field: sign_platform_result
  meaning: 签章中台请求+响应原文，异常/markFailed 追加
  evidence: code
- table: cust_certification_info
  field: ref_cust_company_info
  meaning: 关联企业 code；与企业主表 code 对应
  evidence: code
- table: cust_certification_info
  field: certification_type
  meaning: 认证类型（COMPANY_FOUR_ELEMENTS / FACE_VERIFY 等），写入用 CustCertificationTypeEnum.getDictParam()
  evidence: code
- table: cust_certification_info
  field: auto_verify_status
  meaning: 自动核查结果；写入用 getDictParam()，人脸通过判断用 getDictKey()，存在读写键不一致风险
  evidence: code
- table: cust_certification_info
  field: manual_verify_status
  meaning: 人工核查结果；写入用 getDictParam()，人脸通过判断用 getDictKey()
  evidence: code
- table: cust_certification_info
  field: auto_verify_count
  meaning: 自动核查次数，saveOrUpdate 每次 +1
  evidence: code
- table: cust_certification_info
  field: face_business_no
  meaning: 人脸识别业务流水号，用于影像查询
  evidence: code
- table: cust_person_info
  field: face_status
  meaning: 人脸认证结果；finishedVerifyFace 写入 CustCertificationResultTypeEnum.getDictKey()
  evidence: code
- table: cust_person_info
  field: phone_realname_status
  meaning: 手机号实名状态；verifyThree/finishedVerifyFace 写入 getDictKey()
  evidence: code
- table: cust_person_info
  field: real_name_result
  meaning: 综合实名结果；由 face_status + phone_realname_status 计算 getDictKey()
  evidence: code
- table: cust_person_info
  field: operator_push_system
  meaning: 经办人需推送的系统列表，逗号分隔
  evidence: code
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 关联企业 code
  evidence: code
- table: cust_person_info
  field: company_type
  meaning: 客户角色，与企业类型匹配
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 联系人类型：admin/operator/guest 等（UserTypeEnum.getDictKey()）
  evidence: code
- table: cust_person_info
  field: enable
  meaning: 逻辑 enable：Y/N
  evidence: code
- table: cust_person_info
  field: status
  meaning: 联系人账号状态，listCompanyUser 过滤 ADD/EFFECT
  evidence: code
- table: cust_company_info
  field: code
  meaning: 企业编码，被 cust_person_info.ref_cust_company_info / cust_certification_info.ref_cust_company_info
    引用
  evidence: code
- table: cust_company_info
  field: certification_no
  meaning: 统一社会信用代码
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CA 开通状态，Y 时签署经办人授权书走在线签署
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通签章，Y 时签署前做 CA 状态前置校验
  evidence: code
- table: cust_company_info
  field: db_tenant_code
  meaning: 数据租户标识，用于租户隔离和 sso channel 解析
  evidence: code
- table: cust_company_info
  field: main_data_id
  meaning: 主数据 id，同步人脸影像时从主数据企业复制到当前企业
  evidence: code
- table: sys_cust_user_rel
  field: is_freeze
  meaning: 产品-用户关系冻结标记，Y/N
  evidence: code
state_machines:
- name: 人脸/实名认证结果状态
  field: cust_certification_info.auto_verify_status / cust_certification_info.manual_verify_status
  states:
  - value: AUTOMATIC_AUTHENTICATION_PASSED
    label: 自动认证通过
    source: code_enum
  - value: AUTOMATIC_AUTHENTICATION_FAILED
    label: 自动认证失败
    source: code_enum
  - value: MANUAL_AUTHENTICATION_PASSED
    label: 人工认证通过
    source: code_enum
  transitions:
  - from: AUTOMATIC_AUTHENTICATION_FAILED
    event: 自动核查再次通过
    to: AUTOMATIC_AUTHENTICATION_PASSED
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/service/verify/impl/AutoVerifyServiceImpl.java:saveOrUpdate
  - from: AUTOMATIC_AUTHENTICATION_FAILED
    event: 人工核查通过
    to: MANUAL_AUTHENTICATION_PASSED
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/service/verify/impl/AutoVerifyServiceImpl.java:saveManual
  - from: 未通过
    event: 人脸查询结果自动或人工任一通过
    to: 人脸认证通过
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/FaceVerifyController.java:isFaceVerifyPassed
  - from: 未通过
    event: 人工认证已通过时短路返回
    to: MANUAL_AUTHENTICATION_PASSED
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/service/verify/impl/AutoVerifyServiceImpl.java:verifyThree
- name: CFCA 上送状态
  field: ca_certification_info.submit_status
  states:
  - value: PENDING
    label: 待上送
    source: code_enum
  - value: SUCCESS
    label: 上送成功
    source: code_enum
  - value: FAIL
    label: 上送失败
    source: code_enum
  transitions:
  - from: 无
    event: createOrGetByKey 新建行
    to: PENDING
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:createOrGetByKey
  - from: PENDING
    event: cbsSubmitBizData 成功，DBaaS code=0/200 且 biz.status=SAVED
    to: SUCCESS
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:submitToSignCenter
  - from: PENDING
    event: cbsSubmitBizData 异常或失败
    to: FAIL
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:writeSubmitResult
  - from: SUCCESS
    event: 再次 submitToSignCenter
    to: SUCCESS
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:submitToSignCenter
  - from: FAIL
    event: markFailed 追加上送失败原因
    to: FAIL
    evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:markFailed
calibers:
- name: 人脸认证通过
  predicate: cust_certification_info.auto_verify_status = 'AUTOMATIC_AUTHENTICATION_PASSED'
    OR cust_certification_info.manual_verify_status = 'MANUAL_AUTHENTICATION_PASSED'
  scope: faceVerifyQuery 回填 CFCA H5_FACE 意愿数据前的人脸通过判断
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/FaceVerifyController.java:isFaceVerifyPassed
- name: 人工认证通过
  predicate: cust_certification_info.manual_verify_status = 'MANUAL_AUTHENTICATION_PASSED'
  scope: 人工核查与实名短路返回
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/service/verify/impl/AutoVerifyServiceImpl.java:saveManual
- name: 企业联系人有效
  predicate: cust_person_info.enable = 'Y' AND cust_person_info.status IN ('ADD','EFFECT')
  scope: listCompanyUser 查询企业联系人"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/PlatFormUserApplication.java:listCompanyUser
- name: 产品关系未冻结
  predicate: sys_cust_user_rel.is_freeze = 'N'
  scope: 企业联系人按产品过滤有效用户"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/PlatFormUserApplication.java:listCompanyUser
- name: CA 上送成功
  predicate: ca_certification_info.submit_status = 'SUCCESS'
  scope: 取企业最新成功上报数据、幂等跳过重复上送"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:findLatestSuccessRow
- name: CA 待上送
  predicate: ca_certification_info.submit_status = 'PENDING'
  scope: createOrGetByKey 幂等命中"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:createOrGetByKey
- name: 总公司数据
  predicate: ca_certification_info.head_company_data = 'Y'
  scope: 分公司双行场景总公司行"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:normalizeHeadCompanyData
- name: 分公司数据
  predicate: ca_certification_info.head_company_data = 'N'
  scope: 分公司双行场景分公司行"
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:normalizeHeadCompanyData
term_bridges:
- term: 扫脸
  aliases:
  - 人脸认证
  - 人脸识别
  - H5刷脸
  - CFCA H5_FACE
  - 意愿认证H5_FACE
  maps_to: cust_certification_info.certification_type='FACE_VERIFY'
  also_confused_with:
  - cust_certification_info.auto_verify_status
  - ca_certification_info.intent_h5_face_json
  adjudication: boundary
  boundary: 扫脸是意愿认证/活体人脸链路；auto_verify_status 是核查结果状态，intent_h5_face_json 是 CFCA 上报意愿块，不等同于实名认证。
- term: H5刷脸意愿
  aliases:
  - CFCA 一证四步意愿认证
  - intent_h5_face_json
  - authType=H5_FACE
  maps_to: ca_certification_info.intent_h5_face_json
  also_confused_with:
  - ca_certification_info.intent_sms_json
  - cust_certification_info.auto_verify_status
  adjudication: boundary
  boundary: H5_FACE 是 CFCA 签章中台意愿认证块；短信意愿写 intent_sms_json，人脸核查结果写 cust_certification_info。
- term: 人脸认证通过
  aliases:
  - 核查通过
  - automatic passed
  - manual passed
  maps_to: cust_certification_info.auto_verify_status
  also_confused_with:
  - cust_certification_info.manual_verify_status
  - cust_person_info.phone_realname_status
  adjudication: boundary
  boundary: 自动通过写 auto_verify_status，人工通过写 manual_verify_status；联系人手机实名写 phone_realname_status。
- term: 企微人员
  aliases:
  - 企微通讯录
  - WechatUserDTO
  - 审批人下拉
  maps_to: tenant_project_approval_flow.approver_user_id
  also_confused_with:
  - sys_user.id
  adjudication: boundary
  boundary: approver_user_id 是企微 userId，经 WechatContactFacade.existsUser 到企微通讯录校验；不是平台
    sys_user.id。
- term: 企微消息
  aliases:
  - 企业微信消息
  - textcard
  - 待办提醒
  maps_to: tenant_project_approval_flow.approver_user_id
  also_confused_with:
  - 微信服务号消息
  - DBASS 微信通知 WechatNotificationService
  adjudication: boundary
  boundary: 项目审批消息直连企业微信 message/send；服务号通知与 DBASS IWeiXinApi 是另一链路，不可混用。
- term: 总公司数据
  aliases:
  - headCompanyData=Y
  - 总公司行
  maps_to: ca_certification_info.head_company_data='Y'
  also_confused_with:
  - ca_certification_info.head_company_data='N'
  adjudication: boundary
  boundary: Y 表示总公司行，N 表示分公司行；分公司场景两行共用幂等键但 headCompanyData 不同。
- term: 上送成功
  aliases:
  - SUCCESS
  - cbsSubmitBizData 成功
  maps_to: ca_certification_info.submit_status='SUCCESS'
  also_confused_with:
  - ca_certification_info.submit_status='PENDING'
  - ca_certification_info.submit_status='FAIL'
  adjudication: boundary
  boundary: SUCCESS 需要 DBaaS code 0/200 且业务 status=SAVED；仅 HTTP 成功不等于业务成功。
rules:
- name: 人脸通过才回填 CFCA H5_FACE 意愿
  content: faceVerifyQuery 仅在 certificationId 非空、人脸结果为自动或人工通过、DBaaS 请求/响应快照已捕获时，回填
    ca_certification_info.intent_h5_face_json；写入异常弱失败，不阻断查询主流程。
  impact: CFCA 一证四步 H5 刷脸意愿数据的落库时机与容错边界
  field_targets:
  - ca_certification_info.intent_h5_face_json
  - ca_certification_info.file_refs_json
  - cust_certification_info.auto_verify_status
  - cust_certification_info.manual_verify_status
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/FaceVerifyController.java:persistH5FaceIntentIfPassed
- name: H5_FACE 上送必填补全
  content: H5_FACE 意愿上送前补全 bodyCheckResult=1、idTypeCode=01、从 police_two_json 补姓名/证件号，并校验
    name/idNo/bodyCheckResult/similarity 必填。
  impact: CFCA 签章中台 intentJson.h5Face 的必填字段完整性
  field_targets:
  - ca_certification_info.intent_h5_face_json
  - ca_certification_info.police_two_json
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/util/CfcaH5FaceIntentHelper.java:prepareForPersist
- name: 小程序 accessToken 缓存与重试
  content: 获取微信 accessToken 时，缓存 key 为 FBP_WECHAT_TOKEN_PREFIX+appid+secret；失败最多重试
    5 次；获取成功后按 expires_in-300 秒缓存；未取到 access_token 返回微信原始报文。
  impact: 小程序 Scheme 生成、微信接口调用频控与 token 复用
  field_targets: []
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/MiniProgramController.java:getOrigAccessToken
- name: 小程序 Scheme 失败清缓存重试一次
  content: generateMiniProgramScheme 遇到微信 errcode 非 0 且未重试时，删除缓存 accessToken 后递归重试一次；再失败抛
    IOException。
  impact: 小程序跳转链接生成的可用性
  field_targets: []
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/MiniProgramController.java:generateMiniProgramScheme
- name: 企微通讯录缓存 30 分钟
  content: 企微通讯录通过 department/list 与各部门 user/list 全量拉取，过滤 status 为空或 MEMBER_STATUS_ACTIVATED
    的成员，写入 Redis，TTL 30 分钟。
  impact: 审批人下拉与转审校验的数据来源与缓存时效
  field_targets: []
  evidence: lowcode-pplatform-components/lowcode-pplatform-sso-component/src/main/java/com/lls/lowcode/pplatform/service/WechatContactService.java:pullContactList
- name: 企微人员模糊查询
  content: listUser 不传 keyword 返回全量；传 keyword 时按 userId/userName/mobile 忽略大小写模糊匹配，keyword
    超过 KEYWORD_MAX_LENGTH 抛异常。
  impact: 审批人下拉检索行为
  field_targets: []
  evidence: lowcode-pplatform-components/lowcode-pplatform-sso-component/src/main/java/com/lls/lowcode/pplatform/facade/WechatContactFacade.java:listUser
- name: 企微审批消息异步且失败不阻断
  content: 待办、通过、拒绝消息使用 textcard，缺方案经理提醒使用 text；均异步提交到 emailSendExecutor，异常只记日志，不抛给业务。
  impact: 项目上线审批消息触达的可靠性与主流程隔离
  field_targets: []
  evidence: lowcode-pplatform-components/lowcode-pplatform-sso-component/src/main/java/com/lls/lowcode/pplatform/facade/WechatNotifyFacade.java:sendApprovalTodo
- name: 人脸二维码要求管理员证件号已录入
  content: getFaceQrCode 查询当前登录用户在本企业的管理员联系人，若 certificationNo 为空抛 BaseException 客户管理员证件号未录入。
  impact: 人脸识别小程序二维码生成前置条件
  field_targets:
  - cust_person_info.certification_no
  - cust_person_info.user_type
  - cust_person_info.enable
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/controller/FaceVerifyController.java:getFaceQrCode
- name: 空字段跨表补齐不阻断
  content: handleEmptyFieldsUpdate 在 cust_person_info、sys_user、sso_user 中仅当 name/user_name/email
    为空时补齐，异常只 warn 不抛。
  impact: 经办人新增/修改时多系统用户资料一致性
  field_targets:
  - cust_person_info.name
  - cust_person_info.user_name
  - cust_person_info.email
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/PlatFormUserApplication.java:handleEmptyFieldsUpdate
- name: CA 上送幂等
  content: submitToSignCenter 若行已 SUCCESS 直接返回原结果；markFailed 禁止对 SUCCESS 行操作；上送成功条件为
    DBaaS code 0/200 且业务 status=SAVED。
  impact: CFCA 签章中台上送幂等与失败保护
  field_targets:
  - ca_certification_info.submit_status
  - ca_certification_info.sign_platform_result
  - ca_certification_info.submit_time
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:submitToSignCenter
- name: 上送 data 字段 1000 字符裁剪
  content: 组装签章中台请求体时，对 authRealNameJson 与 intentJson 下指定子项的 data 字段做 1000 字符校验，超长按
    JSON 叶子从长到短剔除，再做硬截断兜底。
  impact: 避免签章中台 data 超长拒绝
  field_targets:
  - ca_certification_info.police_two_json
  - ca_certification_info.enterprise_four_json
  - ca_certification_info.intent_sms_json
  - ca_certification_info.intent_h5_face_json
  evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/cfca/impl/CaCertificationInfoAppServiceImpl.java:truncateOversizedDataFieldsInSubmitPayload
- name: 附件 COS path 转下载链
