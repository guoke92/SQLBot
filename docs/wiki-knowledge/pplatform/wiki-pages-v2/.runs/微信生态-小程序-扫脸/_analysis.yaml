field_semantics:
- table: ca_certification_info
  field: intent_h5_face_json
  meaning: CFCA 一证四步『意愿认证 - H5 刷脸』落库块。存 CfcaIntentItemDto JSON：authType=H5_FACE、sysId（Nacos
    dbass.appId）、custId、custType=COMPANY、dataDate(yyyyMMdd)、opType=INSERT、authTime(yyyyMMddHHmmss)、result、similarity（人脸相似度）、videoPath（刷脸视频
    COS path）、busiSeqNo、noticeId、requestData（DBaaS 原始请求 JSON）、data（DBaaS 原始响应 JSON）、name、idNo、idTypeCode=01、bodyCheckResult。Java
    属性名 intentHFaceJson。
  evidence: code
- table: ca_certification_info
  field: submit_status
  meaning: 签章中台上送状态。落库初始 PENDING；submitToSignCenter 成功后 SUCCESS、失败 FAIL；markFailed
    强制 FAIL（已 SUCCESS 行拒绝改）。
  evidence: code
- table: ca_certification_info
  field: sign_platform_result
  meaning: 签章中台 cbsSubmitBizData 的完整『[requestId]+[payload]+[resp]』原文，失败时含异常信息或 markFailed
    追加段，不截断。
  evidence: code
- table: ca_certification_info
  field: batch_no
  meaning: 上送流水号，格式 INC_<yyyyMMddHHmmssSSS>_<UUID前6位hex>；总公司行与分公司行各自独立生成，不要求一致。
  evidence: code
- table: ca_certification_info
  field: head_company_data
  meaning: 是否总公司数据：Y/N，仅接受 Y（大小写不敏感），其余/空回退 N；参与 (custId,dataDate,headCompanyData,submitStatus=PENDING)
    幂等键。
  evidence: code
- table: ca_certification_info
  field: data_source
  meaning: CA 数据来源，CaDataSourceEnum；CHANNEL_OPENAPI 时豁免『至少一项意愿认证』的完整性校验。
  evidence: code
- table: ca_certification_info
  field: notify_agreement_json
  meaning: 协议告知块。新格式存 JSONArray，上送时包装为 {notifyAgreementList:[...], notifyTextList:[]}；老格式单
    JSONObject 兼容包成单元素数组。
  evidence: code
- table: ca_certification_info
  field: enterprise_four_json
  meaning: 企业工商核验块；按 verifyMethod 分键上送：ENTERPRISE_THREE → authEnterpriseThree，ENTERPRISE_FOUR（含解析失败兜底）→
    authEnterpriseFour。
  evidence: code
- table: ca_certification_info
  field: police_two_json
  meaning: 公安二要素（姓名+身份证）实名核验块，上送键 authPersonPoliceTwo。
  evidence: code
- table: ca_certification_info
  field: intent_sms_json
  meaning: 短信验证码意愿认证块，上送键 intentJson.checkCode。
  evidence: code
- table: ca_certification_info
  field: file_refs_json
  meaning: 附件清单块，内含 embeddedFiles[{multipartField,path}]；path 落库为 COS key，上送前转带签名
    HTTP 下载链。
  evidence: code
- table: cust_certification_info
  field: certification_type
  meaning: 核查项类型，CustCertificationTypeEnum.getDictParam()；出现值：COMPANY_FOUR_ELEMENTS、COMPANY_TWO_ELEMENTS、LEGAL_THREE_ELEMENTS、AUTH_THREE_ELEMENTS、LEGAL_OCR、AUTH_OCR、LICENSE_OCR、LEGAL_MEDIA_OCR、AUTH_MEDIA_OCR、FACE_VERIFY。
  evidence: code
- table: cust_certification_info
  field: auto_verify_status
  meaning: 自动核查结果，取 CustCertificationResultTypeEnum 的 dictParam（自动通过/自动不通过等）。
  evidence: code
- table: cust_certification_info
  field: manual_verify_status
  meaning: 人工核查结果；与 auto_verify_status 任一为『通过』即视为人脸/核查通过（FaceVerifyController.isFaceVerifyPassed）。
  evidence: code
- table: cust_certification_info
  field: face_business_no
  meaning: 人脸识别业务流水号，用于按流水号拉取人脸影像文件（A0024）并回溯刷脸结果。
  evidence: code
- table: cust_certification_info
  field: auto_verify_count / manual_verify_count
  meaning: 自动/人工核查累计次数，每次 write 自增 1；实名三要素链路有 >=3 次的注释校验位（当前被注释掉，未生效）。
  evidence: code
- table: cust_person_info
  field: face_status
  meaning: 该联系人的人脸认证结果，取 CustCertificationResultTypeEnum dictKey。
  evidence: code
- table: cust_person_info
  field: phone_realname_status
  meaning: 手机号实名认证状态（三要素/人脸回写），与 face_status 合成 real_name_result。
  evidence: code
- table: cust_person_info
  field: real_name_result
  meaning: RealNameResultEnum.computeRealNameResult(faceStatus, phoneRealnameStatus)
    的合成实名结果。
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 联系人类型：admin（客户管理员，刷脸意愿主体）/ operator（经办人）/ guest（游客，查询时被剔除）。
  evidence: code
- table: cust_person_info
  field: status
  meaning: 联系人账号状态；查询有效联系人时限定 ADD、EFFECT（CustPersonStatusConstant）。
  evidence: code
- table: cust_person_info
  field: operator_push_system
  meaning: 经办人已推送系统列表（逗号分隔 sysChannel），修改后按此列表逐个推送运营中台。
  evidence: code
- table: cust_company_info
  field: need_register_ca / ca_register_status / bs_register_status
  meaning: 分别表示是否需要开通签章、CA 开通状态、上上签开通状态；need_register_ca=Y 时签署子账号授权书前要做 CA 状态预检。
  evidence: code
- table: tenant_project_approval_flow
  field: node_status / node_code / node_order / is_optional / approver_user_id
  meaning: 租户项目审批流程节点定义：节点状态、节点编码、从 1 开始的顺序、是否可选节点(Y/N)、审批人企微 userId。
  evidence: code
state_machines:
- name: CA 一证四步上送状态机
  field: ca_certification_info.submit_status
  states:
  - value: PENDING
    label: 待上送
    source: code_enum
  - value: SUCCESS
    label: 上送成功
    source: code_enum
  - value: FAIL
    label: 上送失败
    source: code_enum
  transitions:
  - from: (新建)
    event: createOrGetByKey 建行
    to: PENDING
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#createOrGetByKey
  - from: PENDING
    event: submitToSignCenter 中台返回 DBaaS code∈{0,200} 且 biz.status=SAVED
    to: SUCCESS
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter
  - from: PENDING
    event: submitToSignCenter 抛异常 / DBaaS code 不成功 / biz.status≠SAVED
    to: FAIL
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter
  - from: FAIL
    event: markFailed 人工补录强制置失败
    to: FAIL
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#markFailed
  - from: SUCCESS
    event: submitToSignCenter 重复调用（幂等短路）
    to: SUCCESS
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter
  - from: SUCCESS
    event: markFailed（被拒绝，抛 CA_CERT_SUBMIT_ALREADY_SUCCESS）
    to: SUCCESS
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#markFailed
- name: 实名/人脸核查结果状态
  field: cust_certification_info.auto_verify_status / manual_verify_status / cust_person_info.face_status
    / cust_person_info.phone_realname_status
  states:
  - value: AUTOMATIC_AUTHENTICATION_PASSED
    label: 自动核查通过
    source: code_enum
  - value: AUTOMATIC_AUTHENTICATION_FAILED
    label: 自动核查不通过
    source: code_enum
  - value: MANUAL_AUTHENTICATION_PASSED
    label: 人工核查通过
    source: code_enum
  transitions:
  - from: (新建)
    event: verifyThree 落实名三要素结果
    to: AUTOMATIC_AUTHENTICATION_PASSED / FAILED
    evidence: code_path:AutoVerifyServiceImpl.java#verifyThree
  - from: (新建)
    event: finishedVerifyFace 拉小程序人脸结果回写 face_status + phone_realname_status
    to: AUTOMATIC_AUTHENTICATION_PASSED / FAILED
    evidence: code_path:AutoVerifyServiceImpl.java#finishedVerifyFace
  - from: AUTOMATIC_AUTHENTICATION_FAILED
    event: saveManual 人工核查
    to: MANUAL_AUTHENTICATION_PASSED
    evidence: code_path:AutoVerifyServiceImpl.java#saveManual
  - from: 任意
    event: verifyFlag=YES 且自动失败 → 提前 return，不继续走三要素
    to: AUTOMATIC_AUTHENTICATION_FAILED
    evidence: code_path:AutoVerifyServiceImpl.java#verifyThree
- name: 经办人冻结状态（SysCustUserRel）
  field: sys_cust_user_rel.is_freeze
  states:
  - value: N
    label: 解冻/正常
    source: code_enum
  - value: Y
    label: 已冻结
    source: code_enum
  transitions:
  - from: N
    event: freezeOrThawOperatorUser operationType=FREEZE
    to: Y
    evidence: code_path:PlatFormUserApplication.java#freezeOrThawOperatorUser
  - from: Y
    event: freezeOrThawOperatorUser operationType=THAW
    to: N
    evidence: code_path:PlatFormUserApplication.java#freezeOrThawOperatorUser
  - from: N
    event: 运营中台 syncOperatorUser OperatorType=DELETE（同手机号兼管理员时只冻经办人角色）
    to: Y
    evidence: code_path:CustSyncEventProvider.java#syncOperatorUser
calibers:
- name: 人脸核查通过
  predicate: cust_certification_info.auto_verify_status = 'AUTOMATIC_AUTHENTICATION_PASSED'
    OR cust_certification_info.manual_verify_status = 'MANUAL_AUTHENTICATION_PASSED'
  scope: FaceVerifyController#persistH5FaceIntentIfPassed 决定是否回填 intent_h5_face_json；两者任一通过即视为通过。
  evidence: code_path:FaceVerifyController.java#isFaceVerifyPassed
- name: 有效联系人（可展示）
  predicate: cust_person_info.enable = 'Y' AND cust_person_info.status IN ('ADD','EFFECT')
  scope: listCompanyUser 按企业 id 查联系人；再按 productTypes 过滤 is_freeze='N' 的 SysCustUserRel。
  evidence: code_path:PlatFormUserApplication.java#listCompanyUser
- name: 刷脸意愿主体（客户管理员）
  predicate: cust_person_info.user_type = 'admin' AND cust_person_info.enable = 'Y'
    AND cust_person_info.ref_cust_company_info = <企业 code> AND cust_person_info.user_id
    = <当前登录用户>
  scope: getFaceQrCode / resolveFaceIntentPerson 取当前登录用户在本企业的管理员作为刷脸主体。
  evidence: code_path:FaceVerifyController.java#resolveFaceIntentPerson
- name: CA 幂等行
  predicate: ca_certification_info.cust_id = ? AND data_date = ? AND head_company_data
    = ? AND submit_status = 'PENDING'
  scope: createOrGetByKey 命中则直接返回既有 id，不新建；batch_no 不进幂等键。
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#createOrGetByKey
- name: 企业最新成功上送记录
  predicate: ca_certification_info.cust_id = ? AND submit_status = 'SUCCESS' AND enable
    = 'Y' ORDER BY submit_time DESC, id DESC LIMIT 1
  scope: assembleLatestSuccessBizRequest / submitLatestSuccessBizRequest 取基准行。
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#findLatestSuccessRow
- name: 企微有效成员
  predicate: wx_work_user.status IS NULL OR wx_work_user.status = MEMBER_STATUS_ACTIVATED
  scope: WechatContactService.pullContactList 全量拉取通讯录时过滤停用/未激活成员。
  evidence: code_path:WechatContactService.java#isActiveMember
- name: 上送 data 字段长度上限
  predicate: LENGTH(authRealNameJson.*.data / intentJson.*.data) <= 1000
  scope: 仅裁剪 authPersonPoliceTwo / authEnterpriseThree / authEnterpriseFour / checkCode
    / h5Face 五处 data，超长按 JSON 叶子从长到短剔除，最后硬截断兜底。
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#truncateOversizedDataFieldsInSubmitPayload
term_bridges:
- term: 扫脸 / 人脸识别
  aliases:
  - H5_FACE
  - H5刷脸
  - 意愿认证
  - faceVerify
  - 刷脸
  maps_to: cust_certification_info.certification_type = 'FACE_VERIFY' 与 ca_certification_info.intent_h5_face_json（authType=H5_FACE）
  also_confused_with:
  - OCR 身份证核查（LEGAL_OCR/AUTH_OCR）
  - 三要素手机号实名（LEGAL_THREE_ELEMENTS/AUTH_THREE_ELEMENTS）
  adjudication: boundary
  boundary: 扫脸=人脸比对（FaceVerifyController + miniFaceService），走小程序二维码；OCR/三要素属于证照识别与实名比对，同一张
    cust_certification_info 表不同 certification_type 行，不可互相替代。
- term: 微信
  aliases:
  - 微信通知
  - WechatNotificationService
  - 企微
  maps_to: 需拆分：WechatNotifyFacade/WechatWorkMessageService 直连『企业微信 message/send』；WechatNotificationService（sso
    组件）为另一路微信触达抽象。
  also_confused_with:
  - 企业微信（企微）
  - 微信服务号
  - 小程序
  adjudication: boundary
  boundary: 企微消息面向内部审批人（touser=企微 userId，textcard）；小程序链路（MiniProgramController）面向
    C 端小程序，用 api.weixin.qq.com accessToken。二者接入主体与 token 体系不同。
- term: 小程序二维码
  aliases:
  - getFaceQrCode
  - getCustBuildQrCode
  - 二维码
  maps_to: MiniFaceService.getFaceQrCode（扫脸/建档场景）与 MiniFaceService.getCustBuildQrCode（建档场景）
  also_confused_with:
  - CA 关联的 certificationId 生成的二维码
  adjudication: boundary
  boundary: 当传 certificationId 时 busiSeqNo=certificationId+LocalDate.now()，否则 busiSeqNo=custId+LocalDate.now()；busiSeqNo
    语义随入参改变，是同一接口内的分支语义，不是同一个业务标识。
- term: accessToken
  aliases:
  - 小程序 accessToken
  - 微信 token
  maps_to: MiniProgramController.getOrigAccessToken：api.weixin.qq.com/cgi-bin/token，Redis
    key = FBP_WECHAT_TOKEN_PREFIX + appid + secret
  also_confused_with:
  - 企业微信 access_token（WechatWorkApiClient 内部，未在本层给出）
  - SSO token
  adjudication: boundary
  boundary: 小程序 accessToken 由 appid+secret 换取并缓存（expires_in-300 秒）；企微消息走 WechatWorkApiClient
    的另一套凭证，缓存 key 与刷新逻辑不同。
- term: faceBusinessNo / businessNo / busiSeqNo
  aliases:
  - 业务流水号
  maps_to: cust_certification_info.face_business_no；MiniFaceService.queryResult(businessNo)；GetFaceQrCodeReqDTO.busiSeqNo
  also_confused_with:
  - ca_certification_info.batch_no
  adjudication: boundary
  boundary: busiSeqNo 是生成二维码时组装的查询键（custId/certificationId + 日期）；faceBusinessNo 是人脸服务返回的流水号，回写时
    busiSeqNo 优先取 faceResult.getFaceBusinessNo()，其次取 snapshot.getBusinessNo()；batch_no
    是签章中台上送流水号，三者不同源。
- term: certificationId
  aliases:
  - 认证 id
  maps_to: 在 FaceVerifyController.faceVerifyQuery / getFaceQrCode 中为 ca_certification_info.id（Long，CFCA
    一证四步链路）
  also_confused_with:
  - cust_certification_info.id（低代码核查记录主键）
  adjudication: boundary
  boundary: 凡 FaceVerifyController 入参 certificationId 均指 ca_certification_info.id，用于
    updateIntentByType/mergeEmbeddedFilePath 定位行；cust_certification_info 表行通过 certification_type
    + ref_cust_company_info 定位，无 certificationId 入参。
rules:
- name: 小程序 accessToken 缓存与重试
  content: 以 appid+secret 为 key 查 Redis；未命中则调 api.weixin.qq.com/cgi-bin/token，失败最多重试
    5 次（间隔 200ms），成功按 expires_in-300 秒缓存；未取到 access_token 时直接返回微信原始报文，5 次后抛 IOException。
  impact: 并发下多实例可能同时刷新；缓存过期窗口留 300 秒冗余。
  field_targets:
  - FBP_WECHAT_TOKEN_PREFIX+appid+secret
  evidence: code_path:MiniProgramController.java#getOrigAccessToken
- name: 小程序 Scheme 生成失败重试一次
  content: generateMiniProgramScheme 首次失败（errcode≠0）且 reTry=false 时，删除 Redis accessToken
    缓存后以 reTry=true 重试一次；仍失败抛 IOException。expire_type=1、expire_interval=1（有效期 1 天）。
  impact: 避免 token 失效导致的 Scheme 生成失败；重试仅一次。
  field_targets:
  - FBP_WECHAT_TOKEN_PREFIX+appid+secret
  evidence: code_path:MiniProgramController.java#generateMiniProgramScheme
- name: H5 刷脸落库弱失败
  content: persistH5FaceIntentIfPassed 中 updateIntentByType / mergeEmbeddedFilePath
    异常仅 error 日志，不抛出，不阻断 faceVerifyQuery 返回人脸结果；未传 certificationId、人脸未通过、快照缺失（snapshot
    为空或 !isCaptured）均直接跳过回填。
  impact: 主链路可用性优先；代价是落库可能静默缺失，需靠日志审计。
  field_targets:
  - ca_certification_info.intent_h5_face_json
  - ca_certification_info.file_refs_json
  evidence: code_path:FaceVerifyController.java#persistH5FaceIntentIfPassed
- name: CA 上送完整性校验
  content: submitToSignCenter 前校验：notify_agreement_json 非空；enterprise_four_json 或
    police_two_json 至少一项非空；intent_sms_json 或 intent_h5_face_json 至少一项非空（dataSource=CHANNEL_OPENAPI
    豁免）；file_refs_json 非空。任一不满足抛 CA_CERT_INFO_INCOMPLETE。
  impact: 缺块直接拒发中台，不允许部分上送。
  field_targets:
  - ca_certification_info.notify_agreement_json
  - ca_certification_info.enterprise_four_json
  - ca_certification_info.police_two_json
  - ca_certification_info.intent_sms_json
  - ca_certification_info.intent_h5_face_json
  - ca_certification_info.file_refs_json
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#assertCompleteForSubmit
- name: 上送报文 data 超长裁剪
  content: 上送前对 authRealNameJson.authPersonPoliceTwo.data、authEnterpriseThree.data、authEnterpriseFour.data、intentJson.checkCode.data、intentJson.h5Face.data
    做 1000 字符校验；超长在 data JSON 内按叶子属性值长度从大到小剔除（不删 request/response 中间节点），失败则硬截断前 1000
    字符。
  impact: 保护签章中台 1000 字符限制，代价是部分原文被丢弃（库内保留完整原文）。
  field_targets:
  - ca_certification_info.enterprise_four_json
  - ca_certification_info.police_two_json
  - ca_certification_info.intent_sms_json
  - ca_certification_info.intent_h5_face_json
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#truncateOversizedDataFieldsInSubmitPayload
- name: 企微通讯录 Redis 缓存 30 分钟
  content: 全量拉取 department/list → 各部门 user/list，按 userId 去重、过滤停用成员后写 Redis（CACHE_TTL_MINUTES）；读取失败返回
    null 并回退实时拉取；查询关键词长度超过 KEYWORD_MAX_LENGTH 抛异常。
  impact: 30 分钟内通讯录变更不可见；查询接口不支持分页，命中全量返回。
  field_targets:
  - WechatContactConstants.REDIS_KEY_CONTACT_USER_LIST
  evidence: code_path:WechatContactService.java#pullContactList, WechatContactFacade.java#listUser
- name: 企微通知异步 + 弱失败
  content: sendApprovalTodo / sendApprovalPass / sendApprovalReject / sendApprovalTodoBatchRemind
    / sendMissingSolutionManagerRemind 均为 @Async("emailSendExecutor")，内部 try-catch
    只打日志不抛出；textcard 需 url（无 url 会报 41010），无跳转场景改用 text。
  impact: 通知失败不影响审批主流程；无 url 场景误用 textcard 会静默 41010。
  field_targets:
  - tenant_project_approval_flow.approver_user_id
  evidence: code_path:WechatNotifyFacade.java#sendApprovalTodo, WechatWorkMessageService.java#sendTextCard
- name: 小程序测试接口用户名白名单
  content: invokeWithTypes / invokeRpcEnhanced / invokeRpcMultiParams 三个反射/RPC 调试接口，仅
    allowUser={ouyangpengfei, wudongyang, pengshaobin} 允许调用，否则返回 error(10001,"拒绝访问")。
  impact: 安全边界：白名单硬编码在类中，不可配置。
  field_targets: []
  evidence: code_path:MiniProgramController.java#invokeMethodWithTypes / invokeRpcEnhanced
    / invokeRpcMultiParams
- name: 企微用户姓名/部门解析降级
  content: WxUserInfoFacade 走 ISysWxUserProvider；姓名取 SysWxUserDO.name（空则回退 wxUserid），部门优先
    mainDepartment，否则取 department 逗号串首个非空并 listWxDepartmentById 转名；任何远程异常返回 fallback，不抛给调用方。进程内
    ConcurrentHashMap 无 TTL 无上限全量缓存。
  impact: 远程失败时调用方拿到 wxUserid 兜底值而非空；改名后必须显式 invalidate 才生效。
  field_targets:
