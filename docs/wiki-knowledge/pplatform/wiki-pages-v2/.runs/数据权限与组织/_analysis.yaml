field_semantics:
- table: sys_cust_org_user_permission
  field: permission_type
  meaning: 数据权限类型，取值 ALL / SPECIFIED / SAME_AS_USER_ORG（String 字面量常量，非枚举）
  evidence: code
- table: sys_cust_org_user_permission
  field: user_id
  meaning: 数据权限归属的用户 ID（sys_user.id）
  evidence: code
- table: sys_cust_org_user_permission
  field: company_id
  meaning: 数据权限所属企业 ID（cust_company_info.id），保存时必须等于当前登录企业
  evidence: code
- table: sys_cust_org_user_permission
  field: company_type
  meaning: 企业角色类型（companyType），与当前登录角色必须一致才可保存
  evidence: code
- table: sys_cust_org_user_permission
  field: org_id_list
  meaning: 数据范围组织 ID 列表；SPECIFIED 时来自请求，SAME_AS_USER_ORG 且为空时由用户组织绑定回填
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 用户在企业内的类型：admin（管理员）/operator（经办人）/guest（游客）；数据权限判定只看 admin
  evidence: code
- table: cust_person_info
  field: company_type
  meaning: 该联系人所归属的企业角色类型（companyType），组织绑定与数据权限均按此维度隔离
  evidence: code
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 所属企业业务编码，指向 cust_company_info.code（非主键 id）
  evidence: code
- table: cust_person_info
  field: enable
  meaning: 联系人启用标识 Y/N；查管理员/绑定用户均要求 Y
  evidence: code
- table: cust_person_info
  field: phone
  meaning: 手机号（加密存储）；管理员判定用 encryptAndBase64Str(sysUser.userName) 等值比较
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 企业建档/认证状态，组织初始化与组织操作的前置门槛（BUILD_SUCCESS）
  evidence: code
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色类型，JSON 数组字符串（如 ["SUPPLIER"]），支持多角色
  evidence: code
- table: cust_company_info
  field: db_tenant_code
  meaning: 数据租户标识，查 sys 用户、集团关系与运营方范围的隔离键
  evidence: code
- table: cust_company_info
  field: enable
  meaning: 企业启用标识 Y/N
  evidence: code
- table: cust_company_info
  field: test_data
  meaning: 测试数据标识 Y；同租户存在多个运营方时过滤该标记保留真实运营方
  evidence: code
- table: cust_group_rel
  field: status
  meaning: 集团关系状态：INEFFECTIVE（未生效）/EFFECTIVE（已生效），导入建关系默认 INEFFECTIVE
  evidence: code
- table: cust_group_rel
  field: cust_type
  meaning: 该集团关系记录对应的企业角色类型，JSON 数组字符串
  evidence: code
- table: cust_group_rel
  field: root_flag
  meaning: 根标识，根集团关系写死 "Y"
  evidence: code
- table: cust_group_rel
  field: level
  meaning: 集团层级，根节点 = 1
  evidence: code
- table: operation_user
  field: deleted
  meaning: 删除标识（实测 N=119 / Y=22），与 enable 为两套独立开关
  evidence: db
- table: operation_user
  field: enable
  meaning: 启用标识（实测 Y=132 / N=9）
  evidence: db
- table: operation_user
  field: operation_id
  meaning: 运营中台人员 ID，被 cust_person_info.operator_id 引用
  evidence: db
- table: org_manage
  field: org_type
  meaning: 机构类型，写值来自 OrgTypeEnum（ORG 根/SUB 子）
  evidence: code
- table: org_manage
  field: status
  meaning: 机构状态（varchar(10)），本链路未见写值点
  evidence: db
state_machines:
- name: 数据权限类型
  field: sys_cust_org_user_permission.permission_type
  states:
  - value: ALL
    label: 全部数据（管理员固定）
    source: code_const
  - value: SPECIFIED
    label: 指定组织范围
    source: code_const
  - value: SAME_AS_USER_ORG
    label: 与用户组织绑定一致（默认兜底）
    source: code_const
  transitions:
  - from: ALL
    event: 保存/批量保存并传入 permissionType
    to: ALL
    evidence: code_path:DataPermissionApplication.java:saveDataPermission
  - from: SPECIFIED
    event: 保存且 orgIdList 非空
    to: SPECIFIED
    evidence: code_path:DataPermissionApplication.java:saveDataPermission
  - from: SPECIFIED
    event: 保存但 orgIdList 为空
    to: SPECIFIED
    evidence: code_path:DataPermissionApplication.java:saveDataPermission（抛 CommonException
      中断）
  - from: ''
    event: 查询：无记录或 permissionType 为空（非管理员）
    to: SAME_AS_USER_ORG
    evidence: code_path:DataPermissionApplication.java:getByUserCompanyType
  - from: ALL
    event: 查询：判断为企业管理员（userType=admin 且 enable=Y）
    to: ALL
    evidence: code_path:DataPermissionApplication.java:isEnterpriseAdmin
- name: 集团关系状态
  field: cust_group_rel.status
  states:
  - value: INEFFECTIVE
    label: 未生效
    source: code_const
  - value: EFFECTIVE
    label: 已生效
    source: code_const
  transitions:
  - from: INEFFECTIVE
    event: effectGroupRel(custId, custType)
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java:effectGroupRel
  - from: INEFFECTIVE
    event: 建档成功集团简易认证确认
    to: EFFECTIVE
    evidence: code_path:CustCompanyInfoApplication.java:confirmCustInfoForSimpleAuth
- name: 企业建档/认证状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始
    source: code_const
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_const
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认（简易认证提交态）
    source: code_const
  - value: CUST_BUILDING
    label: 审核中
    source: code_const
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_const
  - value: BUILD_FAIL
    label: 建档驳回
    source: code_const
  transitions:
  - from: ''
    event: 提交（按 identifyStyle 判定）
    to: CUST_CONFIRM_AWAIT / CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: INIT
    event: 提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交送审
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: CUST_BUILDING
    event: 审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
calibers:
- name: 企业管理员判定范围
  predicate: cust_person_info.user_type = 'admin'
  scope: 数据权限编辑准入、管理员固定 ALL 判定
  evidence: code_path:DataPermissionApplication.java:assertCurrentUserIsAdminOfTargetCompany,isEnterpriseAdmin
- name: 启用联系人范围
  predicate: cust_person_info.enable = 'Y'
  scope: 管理员/经办人查询、组织绑定校验
  evidence: code_path:DataPermissionApplication.java:isEnterpriseAdmin
- name: 建档成功企业范围
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS'
  scope: 初始化根组织、加/改组织的准入条件
  evidence: code_path:CustSysOrgApplication.java:checkCustBuildStatus,listBuildSuccessCusts
- name: 有效企业范围
  predicate: cust_company_info.enable = 'Y'
  scope: 组织初始化批处理、用户绑定查企业
  evidence: code_path:CustSysOrgApplication.java:listBuildSuccessCusts
- name: 集团关系生效范围
  predicate: cust_group_rel.status = 'EFFECTIVE'
  scope: listSubCust 子公司平铺结果过滤
  evidence: code_path:CustGroupRelApplication.java:listSubCust
- name: 根集团关系范围
  predicate: cust_group_rel.level = 1
  scope: 根节点识别
  evidence: code_path:CustGroupRelApplication.java:processGroupByParent
- name: 指定组织权限范围
  predicate: sys_cust_org_user_permission.permission_type = 'SPECIFIED'
  scope: 保存时强制校验 orgIdList 非空
  evidence: code_path:DataPermissionApplication.java:saveDataPermission
- name: 默认数据权限范围
  predicate: sys_cust_org_user_permission.permission_type = 'SAME_AS_USER_ORG'
  scope: 非管理员无记录/类型为空时的兜底
  evidence: code_path:DataPermissionApplication.java:getByUserCompanyType,listByCompany
- name: 管理员数据权限范围
  predicate: sys_cust_org_user_permission.permission_type = 'ALL'
  scope: 企业管理员查询固定返回值（不读库）
  evidence: code_path:DataPermissionApplication.java:getByUserCompanyType
- name: 租户隔离范围
  predicate: cust_company_info.db_tenant_code = 入参租户
  scope: 组织初始化、集团导入、运营方查询
  evidence: code_path:CustSysOrgApplication.java:listBuildSuccessCusts；CustGroupRelApplication.java:queryTenantOperatorCompany
term_bridges:
- term: org（机构/组织）
  aliases:
  - 机构
  - 组织
  - org_manage
  - sys_org
  - SysOrgDO
  - sys_cust_org
  - SysCustOrgDO
  maps_to: org_manage.id / sys_cust_org.id
  also_confused_with:
  - OrgFacade/OrgController 的租户级机构
  - CustSysOrgApplication/CustSysOrgController 的客户组织架构
  adjudication: boundary
  boundary: 两条完全不同的链路：OrgFacade 面向 org_manage（OrgTypeEnum ORG/SUB、tenant_code/apaaS
    tenant 维度，CustOrgController /cust-web/org）；CustSysOrgApplication 面向客户组织架构 sys_cust_org
    + sys_cust_org_rel（custId + companyType 维度，CustSysOrgController /cust-web/sysOrg）。同名不可互推。
- term: companyType
  aliases:
  - company_type
  - custType
  - roleType
  - 企业角色类型
  - custCompanyType
  maps_to: cust_person_info.company_type / cust_company_info.cust_company_type / cust_role_info.role_type
  also_confused_with: []
  adjudication: synonym
  boundary: 同一取值域（SUPPLIER/CORE/DEALER/FINANCE/CORPORATION_COMPANY/PLATFORM_OPERATOR_COMPANY
    等）。cust_company_info.cust_company_type 为 JSON 数组字符串，cust_person_info.company_type
    与 cust_role_info.role_type 为单值；initRootOrgBatchOneCompany 直接把 roleType 当 companyType
    使用。
- term: permissionType（数据权限类型）
  aliases:
  - permission_type
  - ALL
  - SPECIFIED
  - SAME_AS_USER_ORG
  - PERMISSION_ALL
  - PERMISSION_SPECIFIED
  - PERMISSION_SAME_AS_USER_ORG
  maps_to: sys_cust_org_user_permission.permission_type
  also_confused_with:
  - UserTypeEnum（admin/operator/guest）
  - 菜单权限 code
  - UserInfoFacade.ROLE_CODE_*
  adjudication: boundary
  boundary: permission_type 描述数据可见范围；userType 描述用户在企业中的身份；菜单/角色权限是另一套（code、ROLE_CODE_*）。DataPermissionApplication
    注释明确只支持 ALL、SPECIFIED、SAME_AS_USER_ORG，不做 SAME_AS_ORG 映射。
- term: 管理员
  aliases:
  - admin
  - 企业管理员
  - 平台管理员
  maps_to: cust_person_info.user_type = 'admin'
  also_confused_with:
  - 需求文档中的平台管理员（跨企业）
  adjudication: boundary
  boundary: 代码中可判定的只有企业内管理员（cust_person_info.user_type='admin' 且 enable='Y'，phone
    与登录用户一致）。数据权限保存额外要求 companyId 必须等于当前登录企业，即无法跨企业代理配置。
- term: custId / companyId
  aliases:
  - 企业id
  - cust_company_info.id
  maps_to: cust_company_info.id
  also_confused_with:
  - cust_company_info.code（ref_cust_company_info / custCode）
  adjudication: boundary
  boundary: custId/companyId 为自增主键；refCustCompanyInfo 与 ref_cust_project_rel_cust_company_info
    是 code 业务编码。cust_person_info 同时保存 cust_company_id（主键）与 ref_cust_company_info（code），查询条件混用需注意。
- term: groupId
  aliases:
  - rootGroupId
  - parentGroupId
  - id
  maps_to: cust_group_rel.id
  also_confused_with:
  - cust_group_rel.cust_id / root_cust_id
  adjudication: boundary
  boundary: rootGroupId/parentGroupId 指向 cust_group_rel 自身记录 id；rootCustId/parentCustId
    指向 cust_company_info.id。树构建一律用 group id，业务归属一律用 cust id。
- term: orgIdList
  aliases:
  - orgIds
  - org_id_list
  maps_to: sys_cust_org_user_permission.org_id_list
  also_confused_with:
  - PlatCustOrgDTO.orgId
  adjudication: synonym
  boundary: 均为 sys_cust_org 的 id 集合；SAME_AS_USER_ORG 回填时经 listCustUserOrgs 得到并按 orgId
    去重。
- term: SAME_AS_USER_ORG
  aliases: []
  maps_to: sys_cust_org_user_permission.permission_type = 'SAME_AS_USER_ORG'
  also_confused_with:
  - SAME_AS_ORG
  adjudication: boundary
  boundary: saveDataPermission 注释明确『不做 SAME_AS_ORG 映射』；查询/列表遇到空类型才回填该值，且回填的 orgIdList
    是用户组织绑定而非角色默认组织。
rules:
- name: 数据权限仅本企业管理员可保存
  content: 保存/批量保存前校验：companyId 必须等于当前登录企业、companyType 与当前登录角色一致、当前用户为 cust_person_info.user_type='admin'
    且 enable='Y' 且 phone 匹配登录用户名密文。
  impact: 越权配置数据权限被拒绝；业务侧无法替其它企业配置。
  field_targets:
  - cust_person_info.user_type
  - cust_person_info.enable
  - cust_person_info.phone
  - sys_cust_org_user_permission.company_id
  evidence: code_path:DataPermissionApplication.java:assertCurrentUserIsAdminOfTargetCompany
- name: SPECIFIED 必须携带组织列表
  content: permissionType=SPECIFIED 且 orgIdList 为空时抛 CommonException('指定组织时，请选择组织列表')。
  impact: 阻止『指定组织但无范围』的悬空权限。
  field_targets:
  - sys_cust_org_user_permission.permission_type
  - sys_cust_org_user_permission.org_id_list
  evidence: code_path:DataPermissionApplication.java:saveDataPermission,saveDataPermissionBatch
- name: 企业管理员数据权限固定 ALL
  content: getByUserCompanyType 先判 isEnterpriseAdmin，命中则直接构造 permissionType=ALL、orgIdList=null
    返回，不读权限库。
  impact: 管理员不受组织范围限制，且无需预先配置权限记录。
  field_targets:
  - sys_cust_org_user_permission.permission_type
  evidence: code_path:DataPermissionApplication.java:getByUserCompanyType,isEnterpriseAdmin
- name: 无记录/空类型默认 SAME_AS_USER_ORG 并回填组织
  content: 非管理员且未查出记录或 permissionType 为空时置 SAME_AS_USER_ORG，再由该用户在该企业+角色下的组织绑定填充 orgIdList（异常仅告警不抛出）。
  impact: 数据范围兜底为『本人所属组织』，避免默认全量可见。
  field_targets:
  - sys_cust_org_user_permission.permission_type
  - sys_cust_org_user_permission.org_id_list
  evidence: code_path:DataPermissionApplication.java:fillOrgIdsIfSameAsUserOrg
- name: 组织操作前置：企业建档成功
  content: addSubOrg 调用 checkCustBuildStatus 校验 cust_build_status=BUILD_SUCCESS；initRootOrg
    同样要求建档成功；批量初始化按 enable='Y' + BUILD_SUCCESS 翻页扫描。
  impact: 未认证企业无法创建/初始化组织。
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.enable
  evidence: code_path:CustSysOrgApplication.java:checkCustBuildStatus,listBuildSuccessCusts
- name: 组织导入一级组织名称必须等于企业名称
  content: checkExcelData 中 parentOrgName='/' 的根行只能一条且 orgName 必须等于 cust_company_info.name，否则报错。
  impact: 防止导入产生与主数据不一致的根组织。
  field_targets:
  - cust_company_info.name
  evidence: code_path:CustSysOrgApplication.java:checkExcelData
- name: 二级组织绑定不得跨（企业, 角色）分组
  content: Sheet1 中同一 orgId 只能属于一个 (custId, companyType) 分组，且每组在 Sheet2 中必须至少有一行用户绑定。
  impact: 保证组织归属唯一、避免空分组落库。
  field_targets: []
  evidence: code_path:CustSysOrgApplication.java:importSecondaryOrgUserBind
- name: 绑定组织用户要求联系人在该企业角色下启用
  content: 按 userId + refCustCompanyInfo + companyType + enable='Y' 计数，为 0 则报『用户未加入该企业或未启用』。
  impact: 禁用/未加入企业的用户不能被挂到组织下。
  field_targets:
  - cust_person_info.enable
  - cust_person_info.company_type
  - cust_person_info.ref_cust_company_info
  evidence: code_path:CustSysOrgApplication.java:importSecondaryOrgUserBind
- name: 集团成员导入父子角色一致性
  content: 若父级企业已存在，其 cust_company_type 必须包含子级申报的企业角色；父级尚未存在时，同一父级下所有子级角色必须一致。
  impact: 阻断同链角色混挂的集团树。
  field_targets:
  - cust_company_info.cust_company_type
  evidence: code_path:CustGroupRelApplication.java:checkRoleExcelData
- name: 运营方查询过滤测试数据
  content: 同一 db_tenant_code 下运 cust_company_type 含 PLATFORM_OPERATOR_COMPANY 的企业
    >1 时，过滤 test_data='Y' 仅保留真实运营方。
  impact: 避免测试运营方污染运营方解析结果。
  field_targets:
  - cust_company_info.test_data
  - cust_company_info.db_tenant_code
  evidence: code_path:CustGroupRelApplication.java:queryTenantOperatorCompany
- name: 组织并发写用分布式锁串行化
  content: initRootOrg / addSubOrg / editOrg / delSysOrg / importForCustOrg / bindCustOrgUser
    均先 acquireLock（key 带 custId 或 orgId），失败抛『请稍后再试』。
  impact: 同一企业/组织的组织架构写入串行执行。
  field_targets: []
  evidence: code_path:CustSysOrgApplication.java:initRootOrg,addSubOrg,bindCustOrgUser
reqdoc_claims:
- claim: 数据权限：用户只能查看和操作本企业数据，管理员可以查看所有企业数据
  code_status: confirmed
  code_evidence: DataPermissionApplication.java:assertCurrentUserIsAdminOfTargetCompany
    / isEnterpriseAdmin
  action: prose_only
  note: 『本企业隔离』已在代码中锚定（companyId 必须等于当前登录企业）；『管理员可以查看所有企业数据』与实现不符——管理员仅在本企业内固定 ALL，跨企业配置被显式拒绝，差异以代码为准。
- claim: 租户维度隔离：数据库级别隔离，通过 db_tenant_code 区分，SQL 自动添加租户过滤条件，跨租户访问严格禁止
  code_status: uncovered
  code_evidence: CustSysOrgApplication.java:listBuildSuccessCusts（.eq(dbTenantCode)）；CustCompanyInfoApplication.java:MetaDataThreadLocalConfig.setDbTenantCode("all")
  action: review
  note: 代码中可见 dbTenantCode 作为显式查询条件与线程上下文开关，但『SQL 自动注入租户过滤』发生在框架切面层，本链路未给出实现证据，需人工核查。
- claim: 菜单权限：code='0891344a3a4442179e98819cbe926ced' 的菜单记录在列表中自动过滤
  code_status: uncovered
  code_evidence: ''
  action: review
  note: 本链路（cust 应用/门面/控制器）未出现该字面量，过滤逻辑可能在 sso-component 的 LocalTypeMenuService 中，需另行核查。
- claim: 角色分配：一个用户可拥有多个角色，角色权限取并集
  code_status: confirmed
  code_evidence: CustGroupRelApplication.java:processCompanyRole（cust_company_type
    为 JSON 数组）；CustCompanyInfoApplication.java:getCompanyTypeList
  action: prose_only
  note: 多角色在 cust_company_info.cust_company_type / cust_group_rel.cust_type 上以 JSON
    数组承载并逐角色建关系记录；但『权限取并集』的求并实现未在本链路出现。
- claim: 企业关键信息修改需审核、变更前后信息对比记录、审核通过后变更生效
  code_status: confirmed
  code_evidence: CustGroupRelApplication.java:addExistRootGroupRel / effectGroupRel（INEFFECTIVE→EFFECTIVE）
  action: anchor
  note: 集团关系采用先建 INEFFECTIVE 记录、审核/建档案通过后置 EFFECTIVE 的两段式，构成变更审核锚点。
- claim: 企业状态为已冻结或已注销时不允许变更
  code_status: uncovered
  code_evidence: CustPersonApplication.java:adminChangeSaveOrUpdate（仅拦截 cust_status=CHANGE
    在途变更）
  action: review
  note: 代码中管理员变更只校验『有在途变更流程』，未见冻结/注销态拦截分支。
