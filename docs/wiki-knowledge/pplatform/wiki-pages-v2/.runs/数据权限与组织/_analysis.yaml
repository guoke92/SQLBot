field_semantics:
- table: operation_user
  field: id
  meaning: 运营中台人员主键
  evidence: db
- table: operation_user
  field: code
  meaning: 编码（运营人员业务编码）
  evidence: db
- table: operation_user
  field: name
  meaning: 名称
  evidence: db
- table: operation_user
  field: operation_id
  meaning: 运营中台人员ID（对接运营中台的用户标识，产融侧 cust_person_info.operator_id 存放的值）
  evidence: db
- table: operation_user
  field: operation_name
  meaning: 运营人员姓名（产融侧 cust_person_info.operator_realname 的来源）
  evidence: db
- table: operation_user
  field: operation_group
  meaning: 运营组别
  evidence: db
- table: operation_user
  field: organization_id
  meaning: 机构编号（指向机构域 org_manage.organization_id）
  evidence: db
- table: operation_user
  field: status
  meaning: 用户状态标识
  evidence: db
- table: operation_user
  field: enable
  meaning: 启用标识；实测 Y=132 / N=9
  evidence: db
- table: operation_user
  field: deleted
  meaning: 逻辑删除标识；实测 N=119 / Y=22（存在已删除数据，查询必须带 deleted 过滤）
  evidence: db
- table: operation_user
  field: db_tenant_code
  meaning: 数据租户标识；实测仅出现 'base'（7 条），说明该表当前仅承载 base 租户运营人员
  evidence: db
- table: operation_user
  field: app_tenant_code
  meaning: 逻辑租户标识（与 db_tenant_code 分属逻辑/数据两层）
  evidence: db
- table: operation_user
  field: act_procinst_id
  meaning: 流程实例ID（运营人员的审批流实例）
  evidence: db
- table: operation_user
  field: act_procinst_no
  meaning: 流程申请编号
  evidence: db
- table: operation_user
  field: act_procinst_status
  meaning: 当前审批状态
  evidence: db
- table: operation_user
  field: act_procinst_date
  meaning: 审批结束时间
  evidence: db
- table: operation_user
  field: create_by
  meaning: 创建人id；实测全部为 ''（空串），该表审计字段实际未落值
  evidence: db
- table: operation_user
  field: create_user
  meaning: 创建人名称；实测全部为 ''
  evidence: db
- table: operation_user
  field: update_by
  meaning: 更新人id；实测全部为 ''
  evidence: db
- table: operation_user
  field: update_user
  meaning: 更新人名称；实测全部为 ''
  evidence: db
- table: org_manage
  field: id
  meaning: 机构管理主键
  evidence: db
- table: org_manage
  field: org_name
  meaning: 机构名称（面向展示的名称字段，区别于 name）
  evidence: db
- table: org_manage
  field: org_no
  meaning: 机构号
  evidence: db
- table: org_manage
  field: org_level
  meaning: 机构层级（int，机构树的深度）
  evidence: db
- table: org_manage
  field: org_type
  meaning: 机构类型（varchar32，与代码侧 OrgTypeEnum：ORG 根机构 / SUB 子机构 对应）
  evidence: code
- table: org_manage
  field: parent_code
  meaning: 父机构编号（自引用，构成机构树；对应代码 SysOrgDO.parentId/selectByCode 链路）
  evidence: db
- table: org_manage
  field: organization_id
  meaning: 机构编号（与 operation_user.organization_id 同域的机构主键）
  evidence: db
- table: org_manage
  field: status
  meaning: 状态
  evidence: db
- table: org_manage
  field: client_type
  meaning: 端类型（区分 AGW/客户端等来源；代码 OrgFacade 中以 clientType=='AGW' 判断是否跳过租户过滤）
  evidence: code
- table: org_manage
  field: enable
  meaning: enable（默认 Y）
  evidence: db
- table: org_manage
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: db
- table: org_manage
  field: app_tenant_code
  meaning: 逻辑租户标识
  evidence: db
- table: cust_company_info
  field: code
  meaning: 企业业务编码（对外引用键，子表以 ref_cust_company_info 指向它，而非 id）
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 企业认证/建档状态（CustBuildStatusEnum）
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 企业经营状态（CustStatusEnum：ADD/EFFECT/FREEZE/WRITEOFF/CHANGE）
  evidence: code
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色类型，JSON 数组字符串（如 ["SUPPLIER"]），可多角色
  evidence: code
- table: cust_company_info
  field: db_tenant_code
  meaning: 数据租户标识（跨企业/跨租户查询与写库路由依据）
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证方式（IdentifyTypeConstant：INVITE 邀请-客户录入 / INVITE_AGW 邀请-平台录入 / SELF 自主认证
    / SIMPLE 简易认证）
  evidence: code
- table: cust_company_info
  field: certification_no
  meaning: 统一社会信用代码（同租户内企业唯一键之一）
  evidence: code
- table: cust_company_info
  field: enable
  meaning: 启用标识 Y/N，所有企业查询默认过滤 enable='Y'
  evidence: code
- table: cust_company_info
  field: test_data
  meaning: 测试数据标识（Y 为测试运营方；queryTenantOperatorCompany 在多运营方时过滤 test_data='Y'）
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通电子签章 CA（Y/N，简易认证时被强制校正为不开通）
  evidence: code
- table: cust_company_info
  field: head_company
  meaning: 是否总部企业（为空时提交登记为 Y）
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 用户类型（UserTypeEnum：admin 企业管理员 / operator 经办人 / guest 游客），决定是否可参与数据权限与管理动作
  evidence: code
- table: cust_person_info
  field: company_type
  meaning: 该联系人归属的企业角色类型（与 cust_company_info.cust_company_type 对应）
  evidence: code
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 关联企业业务编码（指向 cust_company_info.code）
  evidence: code
- table: cust_person_info
  field: phone
  meaning: 手机号，加密后以 Base64 存储（写入用 encryptAndBase64Str，展示用 decryptStr）
  evidence: code
- table: cust_person_info
  field: enable
  meaning: 启用标识 Y/N（冻结用户置 N）
  evidence: code
- table: cust_person_info
  field: status
  meaning: 用户状态（CustPersonStatusConstant：ADD/EFFECT/FREEZE）
  evidence: code
- table: cust_person_info
  field: operator_id
  meaning: 归属运营人员ID（指向 operation_user.operation_id）
  evidence: code
- table: cust_person_info
  field: operator_realname
  meaning: 归属运营人员姓名（冗余自 operation_user.operation_name）
  evidence: code
- table: cust_person_info
  field: operator
  meaning: 归属运营人员登录名
  evidence: code
- table: cust_person_info
  field: phone_realname_status
  meaning: 手机号实名状态（CustCertificationResultTypeEnum：待认证/自动通过/人工通过）
  evidence: code
- table: cust_person_info
  field: face_status
  meaning: 人脸认证状态
  evidence: code
- table: cust_person_info
  field: real_name_result
  meaning: 实名结果（RealNameResultEnum.VERIFIED_SUCCESS）
  evidence: code
- table: cust_role_info
  field: role_type
  meaning: 企业角色类型（与 cust_company_info.cust_company_type 同域；initRootOrg 按此字段逐角色初始化根组织）
  evidence: code
- table: cust_role_info
  field: platform_cust_id
  meaning: 运营中台企业ID（未同步时置空，作为待补推标记）
  evidence: code
- table: cust_role_info
  field: ref_cust_company_info
  meaning: 关联企业业务编码
  evidence: code
- table: cust_role_info
  field: status
  meaning: 角色状态（随企业状态联动更新）
  evidence: code
- table: cust_user_rel
  field: is_freeze
  meaning: 用户-产品关系冻结标识（'N' 表示未冻结；全部冻结才允许删除 sys 用户）
  evidence: code
- table: cust_user_rel
  field: product_id
  meaning: 产品（系统）ID，决定经办人推送哪些业务系统
  evidence: code
- table: sys_user
  field: name
  meaning: 登录用户姓名（组织树 createUser/updateUser 缺失时按 createBy/updateBy 反查填充）
  evidence: code
- table: sys_user
  field: email
  meaning: 登录邮箱（业务邮箱变更时按条件同步更新）
  evidence: code
- table: sys_cust_org_user_permission
  field: user_id
  meaning: 数据权限主体用户ID（与 company_id、company_type 构成唯一三维）
  evidence: code
- table: sys_cust_org_user_permission
  field: company_id
  meaning: 数据权限归属企业ID
  evidence: code
- table: sys_cust_org_user_permission
  field: company_type
  meaning: 数据权限归属企业角色类型
  evidence: code
- table: sys_cust_org_user_permission
  field: permission_type
  meaning: 数据权限类型：ALL / SPECIFIED / SAME_AS_USER_ORG；无记录或为空时按 SAME_AS_USER_ORG 处理
  evidence: code
- table: sys_cust_org_user_permission
  field: org_id_list
  meaning: 数据范围组织ID列表（仅 SPECIFIED 必填；SAME_AS_USER_ORG 时由用户组织绑定回填）
  evidence: code
state_machines:
- name: 企业认证/建档状态机
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始/待提交
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: CUST_BUILDING
    label: 审核中（运营中台）
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: BUILD_FAIL
    label: 审核驳回/建档失败
    source: code_enum
  - value: AWAIT_CUST_CONFIRM
    label: 简易认证提交后的待确认
    source: code_enum
  transitions:
  - from: INIT
    event: 邀请认证（客户录入）/自主认证提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#getCustBuildStatus
  - from: INIT
    event: 邀请认证-平台录入（INVITE_AGW）提交
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#getCustBuildStatus
  - from: BUILD_FAIL
    event: 驳回后重新提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交，推送运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核退回（客户录入场景）
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_BUILDING
    event: 运营中台审核通过，流转到客户确认（平台录入场景）
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_BUILDING
    event: 认证审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 平台录入客户点击确认提交
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 认证审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: INIT
    event: 简易认证提交（非建档成功、非变更）
    to: AWAIT_CUST_CONFIRM
    evidence: code_path:CustCompanyInfoApplication.java#submitForSimpleAuth
  - from: AWAIT_CUST_CONFIRM
    event: 简易认证确认（含资金方直接生效）
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#confirmCustInfoForSimpleAuth
- name: 企业经营状态机
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增/待生效
    source: code_enum
  - value: EFFECT
    label: 生效
    source: code_enum
  - value: FREEZE
    label: 冻结
    source: code_enum
  - value: WRITEOFF
    label: 注销
    source: code_enum
  - value: CHANGE
    label: 变更在途
    source: code_enum
  transitions:
  - from: ADD
    event: 建档成功生效
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus
  - from: EFFECT
    event: 冻结企业（同时冻结企业管理员）
    to: FREEZE
    evidence: code_path:CustCompanyInfoApplication.java#freeze
  - from: FREEZE
    event: 解冻企业（同时解冻企业管理员）
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java#unfreeze
  - from: EFFECT
    event: 注销企业
    to: WRITEOFF
    evidence: code_path:CustCompanyInfoApplication.java#custStatusOperator
  - from: WRITEOFF
    event: 注销前先冻结企业下全部用户
    to: WRITEOFF
    evidence: code_path:CustCompanyInfoApplication.java#custStatusOperator(freezeCustAllUsers)
  - from: EFFECT
    event: 发起企业信息变更
    to: CHANGE
    evidence: code_path:CustPersonApplication.java#adminChangeSaveOrUpdate
- name: 数据权限类型机
  field: sys_cust_org_user_permission.permission_type
  states:
  - value: ALL
    label: 全部数据
    source: code_enum
  - value: SPECIFIED
    label: 指定组织
    source: code_enum
  - value: SAME_AS_USER_ORG
    label: 同用户所属组织
    source: code_enum
  transitions:
  - from: 空（无记录）
    event: 查询且非企业管理员
    to: SAME_AS_USER_ORG
    evidence: code_path:DataPermissionApplication.java#getByUserCompanyType
  - from: 空（permissionType 为空）
    event: 列表查询补默认值
    to: SAME_AS_USER_ORG
    evidence: code_path:DataPermissionApplication.java#listByCompany
  - from: 任意
    event: 用户为该企业该角色启用中的管理员
    to: ALL
    evidence: code_path:DataPermissionApplication.java#isEnterpriseAdmin
  - from: SAME_AS_USER_ORG
    event: 保存指定组织（orgIdList 必填）
    to: SPECIFIED
    evidence: code_path:DataPermissionApplication.java#saveDataPermission
  - from: SPECIFIED
    event: 保存为全部
    to: ALL
    evidence: code_path:DataPermissionApplication.java#saveDataPermissionBatch
- name: 企业联系人类型机
  field: cust_person_info.user_type
  states:
  - value: admin
    label: 企业管理员
    source: code_enum
  - value: operator
    label: 经办人
    source: code_enum
  - value: guest
    label: 游客
    source: code_enum
  transitions:
  - from: guest
    event: 新增/编辑经办人（AMS 以外来源默认认证通过）
    to: operator
    evidence: code_path:CustPersonApplication.java#insertOrUpdatePerson
  - from: guest
    event: 建档成功赋予管理员权限
    to: admin
    evidence: code_path:CustCompanyInfoApplication.java#endueCompanyAdminUser
  - from: admin
    event: 管理员变更：旧管理员置 enable=N/status=FREEZE，新建管理员记录
    to: admin
    evidence: code_path:CustPersonApplication.java#ifNessaryFrzAdm
  - from: admin
    event: 简易认证管理员换手机号：旧记录冻结、新记录生效
    to: admin
    evidence: code_path:CustPersonApplication.java#simpleChangePerson
- name: 集团关系生效状态机
  field: cust_group_rel.status
  states:
  - value: INEFFECTIVE
    label: 未生效
    source: code_enum
  - value: EFFECTIVE
    label: 已生效
    source: code_enum
  transitions:
  - from: （新增）
    event: 新增根集团关系：企业建档成功则直接生效，否则未生效
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java#addExistRootGroupRel
  - from: INEFFECTIVE
    event: 集团/成员企业建档成功触发生效
    to: EFFECTIVE
    evidence: code_path:CustGroupRelApplication.java#effectGroupRel
  - from: EFFECTIVE
    event: 删除集团成员前校验在途业务与额度，随后删除
    to: （删除）
    evidence: code_path:CustGroupRelApplication.java#removeRootGroup
calibers:
- name: 建档成功企业
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS' AND cust_company_info.enable
    = 'Y'
  scope: 组织根节点初始化、机构管理员绑定定时任务、企业查询前置校验
  evidence: 'code_path:CustSysOrgApplication.java#listBuildSuccessCusts / #checkCustBuildStatus'
- name: 企业管理员
  predicate: cust_person_info.user_type = 'admin' AND cust_person_info.enable = 'Y'
  scope: 数据权限保存鉴权、数据权限查询默认 ALL、组织绑定
  evidence: 'code_path:DataPermissionApplication.java#assertCurrentUserIsAdminOfTargetCompany
    / #isEnterpriseAdmin'
- name: 非游客用户
  predicate: cust_person_info.user_type != 'guest'
  scope: 联系人分页、运营人员展示
  evidence: 'code_path:CustPersonApplication.java#pagePerson / #getOperatorByCompanyCode'
- name: 运营方企业
  predicate: cust_company_info.cust_company_type 包含 'PLATFORM_OPERATOR_COMPANY' AND
    cust_company_info.enable = 'Y'
  scope: 租户运营方查询
  evidence: code_path:CustGroupRelApplication.java#queryTenantOperatorCompany
- name: 真实运营方
  predicate: test_data ！= 'Y'
  scope: 同一租户存在多个运营方时的过滤（兼容 test_data 为空）
  evidence: code_path:CustGroupRelApplication.java#queryTenantOperatorCompany
- name: 集团有效成员
  predicate: cust_group_rel.status = 'EFFECTIVE'
  scope: 子公司平铺列表 listSubCust 过滤
  evidence: code_path:CustGroupRelApplication.java#listSubCust
- name: 二级组织绑定合法用户
  predicate: cust_person_info.user_id = ? AND cust_person_info.ref_cust_company_info
    = ? AND cust_person_info.company_type = ? AND cust_person_info.enable = 'Y'
  scope: 二级机构及用户绑定导入的成员校验
  evidence: code_path:CustSysOrgApplication.java#importSecondaryOrgUserBind
- name: 本租户企业
  predicate: cust_company_info.db_tenant_code = ?
  scope: 批量初始化根组织、按租户隔离查询
  evidence: code_path:CustSysOrgApplication.java#listBuildSuccessCusts
- name: 用户-产品关系未冻结
  predicate: cust_user_rel.is_freeze = 'N'
  scope: 删除企业后判断用户是否可连带删除 sys_user
  evidence: code_path:CustCompanyInfoApplication.java#deleteCustInfo
- name: org_manage 有效机构
  predicate: org_manage.enable = 'Y'
  scope: 机构查询（DB 默认值 Y）
  evidence: db
term_bridges:
- term: 企业角色类型
  aliases:
  - companyType
  - custType
  - custCompanyType
  - cust_company_type
  - 企业类型
  maps_to: cust_company_info.cust_company_type / cust_role_info.role_type，取值 CustCompanyTypeEnum：CORPORATION_COMPANY、CORE、SUPPLIER、DEALER、FINANCE、PROJECT_COMPANY、PLATFORM_OPERATOR_COMPANY
  also_confused_with:
  - 机构类型 org_manage.org_type / SysOrgDO.orgType（OrgTypeEnum：ORG 根机构 / SUB 子机构）
  adjudication: boundary
  boundary: companyType 描述客户企业在业务中的角色，是客户域的过滤/隔离键（组织、数据权限、集团关系都按 (custId, companyType)
    三元组区分）；org_type 描述租户机构层级，属机构域，两者不可互相替代。
- term: 组织
  aliases:
  - 组织架构
  - sysCustOrg
  - custOrg
  - 二级机构
  maps_to: 客户企业内部的部门树（SysCustOrgDO / SysCustOrgRelDO，parentOrgId + level，按 custId
    + companyType 隔离）
  also_confused_with:
  - 机构 org_manage / SysOrgDO（租户级法人机构，按 tenantCode 隔离，OrgFacade 维护）
  adjudication: boundary
  boundary: 组织=客户企业内的组织树，是企业内数据权限（SAME_AS_USER_ORG/SPECIFIED）的粒度载体；机构=租户下的机构，用 tenantCode/apaasTenantCode
    过滤，二者由不同 Facade（SysOrgFacade vs OrgFacade）负责。
- term: 运营人员
  aliases:
  - operator
  - operatorId
  - operatorRealname
  - operation_id
  - operation_name
  maps_to: operation_user 表中的运营中台人员；产融侧冗余在 cust_person_info.operator_id / operator_realname
    / operator
  also_confused_with:
  - 经办人（cust_person_info.user_type='operator'）
  - 企业管理员（user_type='admin'）
  adjudication: boundary
  boundary: 运营人员是平台/运营中台侧人员，靠 operation_id/operation_name 标识；经办人是客户企业侧用户，靠 user_type='operator'
    标识。cust_person_info.operator_* 是分配给企业联系人的运营归属，不是该联系人的身份类型。
- term: 数据权限
  aliases:
  - permissionType
  - dataPermission
  maps_to: sys_cust_org_user_permission.permission_type ∈ {ALL, SPECIFIED, SAME_AS_USER_ORG}，三维键
    userId+companyId+companyType
  also_confused_with:
  - 菜单权限（角色-菜单）
  - 操作权限（新增/修改/删除）
  - 角色权限取并集
  adjudication: boundary
  boundary: 数据权限只约束「可见数据范围（组织/企业）」；菜单与操作权限属角色体系，本链路未见对应实现，不可混用。
- term: 租户编码
  aliases:
  - dbTenantCode
  - appTenantCode
  - tenantCode
  - tenantFlag
  - apaasTenantCode
  - ssoTenantChanel
  maps_to: db_tenant_code = 数据租户标识（决定落库与查询过滤）；app_tenant_code = 逻辑租户标识
  also_confused_with:
  - apaasTenantCode（机构查询用）
  - ssoTenantChanel（SSO 渠道）
  - tenantCode（机构表 SysOrgDO.tenantCode）
  adjudication: boundary
  boundary: 跨企业查系统用户必须用 dbTenantCode（sysUserProvider.getSysUserDO(dbTenantCode, phone)）；OrgFacade
    查机构却用 apaasTenantCode；批量任务中用 MetaDataThreadLocalConfig.setDbTenantCode('all')
    显式跨租户。三者取值域不同。
- term: 企业
  aliases:
  - 客户
  - 公司
  - custId
  - companyId
  - cust_company_info
  maps_to: cust_company_info（id=custId=companyId；code 为对外业务编码，子表 ref_cust_company_info
    指向 code）
  also_confused_with:
  - 集团成员单位（cust_group_rel.cust_id 指向同一企业表的不同角色关系）
  adjudication: synonym
  boundary: 「企业/客户/公司」在本链路同义；但 id 与 code 是两个键——URL/接口传 custId(id) 与 companyId(id)，而联系人、角色、项目、集团关系等子表用
    code 关联。
- term: 建档成功
  aliases:
  - BUILD_SUCCESS
  - 认证通过
  maps_to: cust_company_info.cust_build_status = 'BUILD_SUCCESS'（认证维度）
  also_confused_with:
  - 企业状态生效 cust_company_info.cust_status = 'EFFECT'（经营维度）
  adjudication: boundary
  boundary: 两者常被联动写入（审核通过时同时置 BUILD_SUCCESS 与 EFFECT），但是两个独立字段：组织初始化、集团关系生效、机构管理员绑定只看
    cust_build_status；冻结/注销只看 cust_status。
rules:
- name: 数据权限默认值规则
  content: 非企业管理员在 sys_cust_org_user_permission 无记录或 permission_type 为空时，一律按 SAME_AS_USER_ORG
    处理；并在 orgIdList 为空时按该用户在企业+企业角色下的组织绑定回填组织ID列表（回填失败仅告警，不影响主流程）。
  impact: 前端数据范围展示与后续 SQL 过滤的默认口径；写库仍是无记录状态，需注意「默认值」与「已配置」不可区分。
  field_targets:
  - sys_cust_org_user_permission.permission_type
  - sys_cust_org_user_permission.org_id_list
  evidence: 'code_path:DataPermissionApplication.java#getByUserCompanyType / #listByCompany
    / #fillOrgIdsIfSameAsUserOrg'
- name: 数据权限鉴权规则
  content: 保存数据权限时要求当前登录人是目标企业的管理员：companyId 必须等于当前企业、companyType 必须等于当前会话企业角色、当前用户手机号必须命中
    cust_person_info(user_type='admin', enable='Y', ref_cust_company_info=当前企业code,
    company_type=当前角色)。
  impact: 禁止跨企业、跨角色配置数据权限。
  field_targets:
  - cust_person_info.user_type
  - cust_person_info.ref_cust_company_info
  - cust_person_info.company_type
  - sys_cust_org_user_permission.company_id
  evidence: code_path:DataPermissionApplication.java#assertCurrentUserIsAdminOfTargetCompany
- name: SPECIFIED 必填组织列表
  content: permission_type=SPECIFIED 时 orgIdList 不得为空，否则抛「指定组织时，请选择组织列表」；批量保存时多个 userId
    共用同一 companyId/companyType/permissionType/orgIdList，一次 Dubbo saveOrUpdate(List)。
  impact: 保证 SPECIFIED 语义完整，避免空范围被误解为 ALL。
  field_targets:
  - sys_cust_org_user_permission.permission_type
  - sys_cust_org_user_permission.org_id_list
  evidence: 'code_path:DataPermissionApplication.java#saveDataPermission / #saveDataPermissionBatch'
- name: 根组织初始化前置与幂等
  content: 初始化根组织要求企业存在且 cust_build_status=BUILD_SUCCESS，companyType 必须为合法企业角色（否则抛「企业未配置企业角色类型（companyType）」）；全量初始化加分布式锁
    initAllCustRootOrg，按 id 分页（LIMIT 500 游标）扫描。批量场景按 cust_role_info.role_type 逐角色初始化，单角色失败仅告警跳过。
  impact: 组织树以「企业 + 企业角色」为根，多角色企业会有多棵根组织树；失败不阻断整体任务。
  field_targets:
  - cust_company_info.cust_build_status
  - cust_role_info.role_type
  - cust_company_info.db_tenant_code
  evidence: 'code_path:CustSysOrgApplication.java#initRootOrg / #doInitRootOrg / #initRootOrgBatchOneCompany'
- name: 组织变更串行化
  content: 新增子组织（addSubOrg:{custId}）、编辑组织（editOrg:{orgId}）、删除组织（delSysOrg:{orgId}）、组织导入（importForCustOrg:{custId}）、绑定用户（bindCustOrgUser:{custId}:{phone}）、全量初始化（initAllCustRootOrg）均使用
    Redis 分布式锁（等待 20s，持有 30s），获取失败提示「正在处理，请稍后再试」。
  impact: 避免同一企业/同一组织的并发写导致树结构错乱。
  field_targets: []
  evidence: 'code_path:CustSysOrgApplication.java#addSubOrg / #editOrg / #delSysOrg
    / #importForCustOrg / #bindCustOrgUser'
- name: 组织导入校验规则
  content: Excel 导入时：必须存在且仅允许一条一级组织（parentOrgName='/'），其名称必须与企业名称一致；组织名称不得重复；父级组织名称必须在本次导入中存在；父级或组织名称缺失按行报错；若该企业非一级组织下已存在经办人（checkCustOrgHasOperator），则禁止导入并要求先去用户中心解绑。
  impact: 保证导入结果与企业根组织一致、不破坏已有用户绑定。
  field_targets:
  - cust_company_info.name
  - cust_person_info.user_type
  evidence: 'code_path:CustSysOrgApplication.java#checkExcelData / #checkBusiness'
- name: 组织绑定用户校验规则
  content: 绑定前须企业存在，并按企业 db_tenant_code + 手机号到 sys 域查用户，用户不存在则拒绝；companyType（客户角色）必填。组织树的
    createUser/updateUser 缺失时按 createBy/updateBy 反查 sys_user.name 回填。
  impact: 保证组织成员是真实存在的登录用户且归属明确的角色。
  field_targets:
  - cust_company_info.db_tenant_code
  - sys_user.name
  - cust_person_info.company_type
  evidence: 'code_path:CustSysOrgApplication.java#bindCustOrgUser / #getOrgTree'
- name: 二级机构及用户绑定导入分组规则
  content: Sheet1 按（企业id + 企业角色）分组维护二级组织：同一二级组织id 不得跨分组重复声明，同分组内 orgId 与 orgName 均不得重复；每个分组在
    Sheet2 中必须至少有一条绑定；绑定行须能解析到分组，用户必须已加入该企业且该角色启用（cust_person_info 四条件计数>0）。
  impact: 一次导入可覆盖多企业多角色，且强约束组织与用户的归属一致性。
  field_targets:
  - cust_person_info.user_id
  - cust_person_info.ref_cust_company_info
  - cust_person_info.company_type
  - cust_person_info.enable
  evidence: code_path:CustSysOrgApplication.java#importSecondaryOrgUserBind
- name: 集团关系唯一性与删除前置校验
  content: 同一（企业、租户数据源、父企业、根企业、企业角色）只允许一条集团关系；已是集团公司的企业不能被设为其他公司的子级；新增/导入的集团关系在成员企业建档成功时才置
    EFFECTIVE 并发待办；删除集团（根）前需先校验成员单位是否存在在途业务（checkGroupMemberDeleteService）与额度状态（limitFacade），并对未生效的建档成功子节点回收待办。
  impact: 防止重复挂靠、角色互斥与带业务删除。
  field_targets:
  - cust_group_rel.status
  - cust_company_info.cust_build_status
  - cust_company_info.cust_company_type
  evidence: 'code_path:CustGroupRelApplication.java#addExistSubCustGroupRel / #addNewSubCustGroupRel
    / #removeRootGroup / #effectGroupRel'
- name: 敏感字段加密口径
  content: 联系人手机号等敏感字段以 encryptAndBase64Str 加密后 Base64 存库；查询按密文等值匹配（如按 phone 查管理员、按手机号查联系人）；对外展示时用
    decryptStr 解密。
  impact: 所有以手机号做条件的查询必须走同一加密口径，否则查不到。
  field_targets:
  - cust_person_info.phone
  evidence: 'code_path:CustPersonApplication.java#getPersonListByUser / #decryptPhone；code_path:DataPermissionApplication.java#isEnterpriseAdmin'
- name: 跨租户显式放行规则
  content: 常规查询按 dbTenantCode 过滤；跨租户场景由 MetaDataThreadLocalConfig.setDbTenantCode("all")
    显式放行（集团树构建、企业删除、批量运营人员变更、组织批量任务等），任务结束后需复位。
  impact: 「all」是数据隔离的显式逃生门，滥用会突破租户隔离。
  field_targets:
  - cust_company_info.db_tenant_code
  evidence: code_path:CustGroupRelApplication.java#buildAllTree；code_path:CustCompanyInfoApplication.java#getShardBuildSuccessCompanies
reqdoc_claims:
- claim: 业务规则文档 3.1.4：企业状态流转 待提交→审核中→已通过；已驳回→待提交（修改后重新提交）；已通过→已冻结/已注销。
  code_status: confirmed
  code_evidence: 'CustCompanyInfoApplication.java#updateCustBuildStatus / #custStatusOperator'
  action: prose_only
  diff: 状态机成立，但状态取值以代码为准：认证维度为 INIT/CUST_CONFIRM_AWAIT/CUST_BUILDING/BUILD_SUCCESS/BUILD_FAIL（另简易认证有
    AWAIT_CUST_CONFIRM），经营维度为 ADD/EFFECT/FREEZE/WRITEOFF/CHANGE；文档的中文状态名未在任何字段字面出现，且两个维度未在文档中区分。
- claim: 业务规则文档 3.3.2：企业维度隔离——用户只能查看和操作本企业数据，管理员可以查看所有企业数据。
  code_status: confirmed
  code_evidence: 'DataPermissionApplication.java#assertCurrentUserIsAdminOfTargetCompany
    / #getByUserCompanyType；CustPersonApplication.java#ifNessaryFrzAdm'
  action: anchor
- claim: 业务规则文档 3.3.2：租户维度隔离——通过 db_tenant_code 区分，SQL 自动添加租户过滤条件，跨租户访问严格禁止。
  code_status: confirmed
  code_evidence: CustSysOrgApplication.java#listBuildSuccessCusts（.eq(getDbTenantCode,
    dbTenantCode)）；CustCompanyInfoApplication.java#getShardBuildSuccessCompanies
  action: anchor
- claim: 业务规则文档 3.3.3：不支持物理删除，只支持逻辑删除（冻结/注销）。
  code_status: refuted
  code_evidence: CustCompanyInfoApplication.java#deleteCustInfo（custCompanyInfoService.removeById
    / remove，对 cust_company_info、cust_person_info、cust_project_rel、cust_auth_application
    均为物理删除）；同时 operation_user.deleted 实测存在 Y=22 的删除数据
  action: prose_only
  diff: 冻结/注销确为 cust_status 逻辑状态，但 deleteCustInfo 链路是物理删除（并级联删除联系人、项目、开通产品、集团关系及孤立
    sys 用户）。文档「不支持物理删除」在删除企业场景不成立。
- claim: 业务规则文档 2.4/3.2.3：一个用户可拥有多个角色，角色权限取并集；管理员角色不能自我删除。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 业务规则文档 3.2.2：邀请码随机生成 8 位字符串、包含大小写字母和数字、30 天内有效；同一手机号/邮箱不能重复邀请。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 业务规则文档 3.3.1：菜单权限中 code='0891344a3a4442179e98819cbe926ced' 的菜单记录在列表中自动过滤。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 业务规则文档 3.4.3：同一变更项同时只能有一个待审核的变更申请；企业状态为已冻结/已注销时不允许变更。
  code_status: confirmed
  code_evidence: CustPersonApplication.java#adminChangeSaveOrUpdate（cust_status=CHANGE
    时抛「有在途变更流程，请检查!」；企业不存在/未生效时不进入变更流程）
  action: anchor
- claim: 业务规则文档 3.5.3：所有通知同步发送站内信，发送失败不影响主流程。
  code_status: confirmed
  code_evidence: 'CustCompanyInfoApplication.java#messageNotify / #sendNoticeToCustomerAuth（try-catch
    捕获异常仅返回 false/记日志）'
  action: anchor
- claim: 业务规则文档 2.2：邀请注册完成后同步用户到 SSO、同步用户到 AMS 运营中台。
  code_status: confirmed
  code_evidence: 'CustPersonApplication.java#insertOrUpdatePerson / #syncOperUser
    / #sendProduct（ssoFacade.getByLoginName、operatorSyncService.put）'
  action: prose_only
  diff: 代码中同步是「按用户已有产品关系（cust_user_rel）排除 PPLATFORM 后逐产品推送」，并非无条件同步到 AMS；AMS 是否为推送目标取决于该用户的产品关系。
- claim: 业务规则文档 3.1.1：统一社会信用代码必填 18 位且同一租户下唯一。
  code_status: confirmed
  code_evidence: CustGroupRelApplication.java#validateCertificationNo（Validator.isCreditCode）；#checkCompanyNameAndCertificationNo；CustCompanyInfoApplication.java#importCustCompany（按租户+统码查重）
  action: anchor
- claim: 业务规则文档 3.1.3：自动审核规则——企业征信评分>=60、法人无不良记录、企业经营正常、行业不在黑名单。
  code_status: uncovered
  code_evidence: ''
  action: review
