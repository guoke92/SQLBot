reqdoc_claims:
- claim: BR-001 保存前置校验：dbTenantCode 合法、关键字段非空、配置间约束（如默认项目 ID 必须为该租户下已生效项目），失败抛 BaseException
  code_status: refuted
  code_evidence: lowcode-pplatform-tenant-management/.../TenantDomainService.java:checkBeforeSave
    —— 实际只做统一社会信用码合法性、唯一性检查与「项目码必填→默认项目非空」联动；未见「默认项目必须为该租户下已生效项目」的校验，且校验失败抛 PlatformEnumsExceptionEnum
    而非文档所述 BaseException
  action: prose_only
- claim: BR-002 租户配置查询不走事务：以 enable='Y' 为条件调用 getOne(..., false) 跳过事务路径
  code_status: confirmed
  code_evidence: lowcode-pplatform-tenant-management/.../controller/TenantProfileController.java:getFirstByDbTenantCodeWithoutTransactional
  action: anchor
- claim: BR-003 灰度颜色缓存：通过 RedisClient 按 RedisKeyConstants key 缓存 BgColorCacheDto，过期由
    BgColorGrayTtlDto 控制，Redis 异常降级直读 DB
  code_status: refuted
  code_evidence: lowcode-pplatform-tenant-management/.../controller/TenantSettingConfigController.java:getBgColor
    / setBgColor —— 缓存与 TTL 逻辑确认存在，但读取路径无 try/catch 降级，Redis 为 null/过期时是重置租户背景色并删缓存，并非「降级直读
    DB」
  action: prose_only
- claim: BR-010 Excel 模板列校验：表头必须按顺序包含项目标识、项目码是否必填、默认项目ID，列名错位则整体失败并抛 BaseException('Excel
    模板列名不匹配')
