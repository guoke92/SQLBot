field_semantics:
- table: tenant_setting_config
  field: db_tenant_code
  meaning: 数据租户标识，租户级数据隔离键，表上为 UNI 唯一；全模块按此列取租户配置
  evidence: db
- table: tenant_setting_config
  field: enable
  meaning: 启用标记 Y/N，DB 全量 364 行均为 Y；所有读取路径（getFirstByDbTenantCode / getByTenantFlagEn
    / listActicveAll）都以 enable='Y' 为前置条件
  evidence: db
- table: tenant_setting_config
  field: status
  meaning: 租户生效状态，Y=已生效；仅 effective 八项配置校验全部通过后才回写 Y，否则保持 N/空（导出时展示为『待生效』）
  evidence: code
- table: tenant_setting_config
  field: tenant_flg_en
  meaning: 项目标识（英文），XYC 体系下的租户唯一标识；afterCreate 初始化时会被强制置为 db_tenant_code
  evidence: code
- table: tenant_setting_config
  field: code
  meaning: 租户编码，UNI 唯一，保存前做唯一性校验并给出『已存在』提示；与 db_tenant_code 语义不同
  evidence: db
- table: tenant_setting_config
  field: bg_color
  meaning: 背景颜色，L=彩色 G=灰色；实际生效受 Redis 灰度开关缓存（BGCOLOR_SWITCH_TTL）控制
  evidence: db
- table: tenant_setting_config
  field: ai_resource_color
  meaning: 智能客服按钮颜色，自由字符串（DB 存在 '#2664fd'、'222' 等脏值）；基础信息保存后若为空会以 main_theme_color
    兜底
  evidence: db
- table: tenant_setting_config
  field: operator_ai_customer
  meaning: '是否开启智能客服，取值是字符 ''0''/''1'' 而非 Y/N（DB: ''0''=108、''1''=15）'
  evidence: db
- table: tenant_setting_config
  field: project_code_required
  meaning: 项目码是否必填 Y/N；等于 Y 时强制要求 default_project_id 非空
  evidence: code
- table: tenant_setting_config
  field: default_project_id
  meaning: 默认关联项目，指向 tenant_project.id
  evidence: code
- table: tenant_setting_config
  field: share_flag
  meaning: 租户共享标识；为 Y 且同 db_tenant_code 已有主记录但 tenant_flg_en 不同时，按『自营假租户』走 tenant_setting_config_share
    而不新建主表记录
  evidence: code
- table: tenant_setting_config
  field: source
  meaning: 租户来源：平台自建写常量 'pplatform'，迁移租户直接写 BizSystemDTO.bizSystemCode（DB 出现 ACFLOW
    198 行）
  evidence: code
- table: tenant_setting_config
  field: source_id
  meaning: 来源方唯一 id；平台自建时取自身主键的字符串形式
  evidence: code
- table: tenant_setting_config
  field: pushing_status
  meaning: 创建事件是否已推送 Y/N，是非 CREATED 租户事件推送（变更/生效）的前置门控
  evidence: code
- table: tenant_setting_config
  field: platform_operator
  meaning: 平台运营方，JSON 数组字符串（如 ["platform","tenant"]），需解析后与 PlatformOperatorEnum.dictKey
    比较
  evidence: db
- table: tenant_setting_config
  field: send_email
  meaning: 是否发送运营邮件 Y/N，与 operator_email 配合决定触达对象
  evidence: code
- table: tenant_setting_config
  field: operator_email
  meaning: 运营人员邮箱，运营邮件收件人；DB 中存在测试脏值（如 1198273@qq.com）
  evidence: db
- table: tenant_setting_config
  field: customer_card_type
  meaning: 客服名片类型，WX_WORK=发送企微名片，WX=发送微信名片
  evidence: db
- table: tenant_setting_config
  field: generate_electronic_auth_flag
  meaning: 是否生成电子版授权书 Y/N，由 updateOperationConfigById 直写（不做空串转 null 之外的规范化）
  evidence: code
- table: tenant_setting_config
  field: migratory_flag
  meaning: 迁移标志，实际是 JSON 串 '{"billMigratory":true}'（DB 全量同值），不是 Y/N 布尔
  evidence: db
- table: tenant_setting_config
  field: dbass_app_id
  meaning: DBAss 应用 id，初始化时统一写入 Nacos 配置的产融 appId（DB 仅两个值，243 行集中在 app_ChanRongPin336_20240529）
  evidence: code
- table: tenant_setting_config
  field: sso_sys_channel
  meaning: PC 端 SSO 渠道号，取 dbass tenantAndAppIdAuth 返回中 scpr-pplatform-pc 对应的 sysChannel
  evidence: code
- table: async_io_task
  field: task_no
  meaning: 任务号，MySQL 自增生成（应用层不 set），同时作为分片调度键 MOD(task_no, shardTotal)
  evidence: code
- table: async_io_task
  field: status
  meaning: 异步任务状态，落库为枚举 name() 大写值 PENDING/RUNNING/SUCCESS/FAILED
  evidence: db
- table: async_io_task
  field: is_deleted
  meaning: 软删标记 '0'=否 '1'=是（字符串，非 Y/N）
  evidence: code
- table: async_io_task
  field: file_url
  meaning: 成功=结果文件 / 失败=错误文件 的 COS object key；IMPORT 登记时刻意不写用户上传源文件 path，避免被当成结果文件下载
  evidence: code
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 关联企业 code，与 cust_company_info.code 对应（注意不是主键 id）
  evidence: code
- table: cust_person_info
  field: operator_id
  meaning: 运营人员 id，指向运营中台人员（operCustFacade.getOperatorList 返回），不是本地表主键
  evidence: code
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色，JSON 数组字符串（如 ["SUPPLIER"]）；资产审核同步仅对 SUPPLIER 生效
  evidence: db
state_machines:
- name: 租户生效状态
  field: tenant_setting_config.status
  states:
  - value: N
    label: 待生效
    source: db_dist
  - value: Y
    label: 已生效
    source: db_dist
  - value: ''
    label: 空/未生效（迁移租户初始态，导出展示为『待生效』）
    source: code_const
  transitions:
  - from: N
    event: effective() 八项配置（合同模板/通知/待办/短信/平台运营方/门户页/产品/基础信息）全部校验通过
    to: Y
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/service/TenantDomainService.java:effective#L108
  - from: N
    event: 任一配置项未完成 → 返回 WindowAlertDTO.alertEnabled=true，状态不变
    to: N
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/service/TenantDomainService.java:predicateEffective
  - from: 任意
    event: syncTenant 迁移租户落库（不显式设置 status，保持待生效）
    to: ''
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/application/TenantAppliactionService.java:syncTenant
- name: 异步导入导出任务状态
  field: async_io_task.status
  states:
  - value: PENDING
    label: 待执行
    source: code_enum
  - value: RUNNING
    label: 执行中
    source: db_dist
  - value: SUCCESS
    label: 成功
    source: db_dist
  - value: FAILED
    label: 失败
    source: db_dist
  transitions:
  - from: PENDING
    event: CAS markRunning（where status=PENDING）
    to: RUNNING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/service/AsyncIoTaskManager.java:markRunning
  - from: RUNNING
    event: 业务方法正常返回且无 stream
    to: SUCCESS
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/service/AsyncIoTaskManager.java:markSuccessWithResult
  - from: RUNNING
    event: 业务方法返回下载字节流并上传 COS 成功
    to: SUCCESS
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/service/AsyncIoTaskManager.java:markSuccessWithFile
  - from: RUNNING
    event: 业务方法抛 Throwable（handleFailure 兜底生成错误文件）
    to: FAILED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/job/AsyncIoTaskXxlJobHandler.java:handleFailure
  - from: RUNNING
    event: IMPORT 正常返回但存在失败行
    to: FAILED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/service/AsyncIoTaskManager.java:markImportFailed
  - from: RUNNING
    event: RUNNING 停留超过 timeoutMinutes（节点强杀/OOM 兜底）
    to: FAILED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/asyncio/service/AsyncIoTaskManager.java:markRunningTimeout
- name: 租户背景颜色/灰度
  field: tenant_setting_config.bg_color
  states:
  - value: L
    label: 彩色
    source: code_const
  - value: G
    label: 灰色
    source: code_const
  transitions:
  - from: ''
    event: 全局灰度窗口生效且租户未自定义颜色 → updateTenantColorGray() 批量置 G
    to: G
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/application/TenantAppliactionService.java:updateTenantColorGray
  - from: G
    event: 灰度期内租户选择彩色 setColorlight(id) 落 L
    to: L
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/application/TenantAppliactionService.java:setColorlight
  - from: L
    event: 灰度窗口内租户颜色为 L 时对前端返回 state=OFF（仅展示态，不落库）
    to: L
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/controller/TenantSettingConfigController.java:getBgColor
  - from: 任意
    event: 缓存过期 / bgcolor/reset/light → updateTenantColorNull() 置 NULL
    to: ''
    evidence: code_path:lowcode-pplatform-tenant-management/src/main/java/com/lls/lowcode/pplatform/tenant/application/TenantAppliactionService.java:updateTenantColorNull
calibers:
- name: 启用租户配置
  predicate: tenant_setting_config.enable = 'Y'
  scope: 所有按 dbTenantCode/tenantFlgEn/appTenantCode/source+sourceId 的租户配置读取路径
  evidence: code:TenantDomainService.getFirstByDbTenantCode / getByTenantFlagEn /
    listAll / listActicveAll；db:enable 364 行全为 Y
- name: 已生效租户
  predicate: tenant_setting_config.status = 'Y'
  scope: activeList() 生效租户列表、导出状态展示
  evidence: code:TenantDomainService.listActicveAll；db:Y=124 / N=240
- name: 待生效租户
  predicate: tenant_setting_config.status = 'N'
  scope: 未通过 effective 校验的租户（含全部迁移租户）
  evidence: db:status N=240
- name: 创建事件已推送
  predicate: tenant_setting_config.pushing_status = 'Y'
  scope: pushTenant / pushTenantSync 中非 CREATED 事件的推送门控
  evidence: code:TenantAppliactionService.pushTenant
- name: 迁移占位审批状态
  predicate: tenant_setting_config.act_procinst_status = 'N'
  scope: syncTenant 迁移租户，避免触发新增 create 事件
  evidence: code:TenantAppliactionService.syncTenant#L217；db:N=204
- name: 灰色背景
  predicate: tenant_setting_config.bg_color = 'G'
  scope: 全局灰度生效期内的租户默认色
  evidence: code:ColorConstants.GRAY 写值点 updateTenantColorGray / getBgColor；db comment『背景颜色(L:彩色
    G：灰色)』
- name: 彩色背景
  predicate: tenant_setting_config.bg_color = 'L'
  scope: 租户主动选择彩色或灰度重置
  evidence: code:TenantAppliactionService.setColorlight；db comment
- name: 开启智能客服
  predicate: tenant_setting_config.operator_ai_customer = '1'
  scope: 智能客服入口开关（注意非 Y/N 口径）
  evidence: db:'1'=15 / '0'=108；code:TenantDomainService.updateOperationConfigById
    直写
- name: 企微名片
  predicate: tenant_setting_config.customer_card_type = 'WX_WORK'
  scope: 客服名片下发渠道
  evidence: db:WX_WORK=128 / WX=6；db comment『与 operCardType 枚举一致』
- name: 未删除异步任务
  predicate: async_io_task.is_deleted = '0'
  scope: 文件管理分页、按任务号查询、任务号软删
  evidence: code:AsyncIoTaskManager.pageByUser / getByTaskNo / softDelete 中 NOT_DELETED='0'
- name: 待执行异步任务
  predicate: async_io_task.status = 'PENDING'
  scope: XXL-Job 分片拉取
  evidence: code:AsyncIoTaskManager.listPendingByShard
- name: 运行超时异步任务
  predicate: async_io_task.status = 'RUNNING'
  scope: 超时清理任务扫描集合
  evidence: code:AsyncIoTaskManager.markRunningTimeout；db:RUNNING=3
- name: 启用联系人
  predicate: cust_person_info.enable = 'Y'
  scope: 资产审核运营人员同步时筛选企业下联系人
  evidence: code:AssetOperatorSyncApplication.syncAssetOperator 中 .eq(CustPersonInfoDO::getEnable,
    "Y")
- name: 启用企业
  predicate: cust_company_info.enable = 'Y'
  scope: 存量运营方推送全量扫描
  evidence: code:CustGeneralProductApplication.syncExistingPlatformOperatorToProducts
    中 .eq(getEnable, BooleanEnum.Y.getDictKey())
term_bridges:
- term: 数据租户标识
  aliases:
  - dbTenantCode
  - db_tenant_code
  maps_to: tenant_setting_config.db_tenant_code
  also_confused_with:
  - tenant_setting_config.app_tenant_code
  - tenant_setting_config.code
  - tenant_setting_config.apaas_tenant_code
  adjudication: boundary
  boundary: db_tenant_code 是数据隔离键（UNI）；app_tenant_code 是逻辑租户标识；code 是租户编码；apaas_tenant_code
    是 aPaaS 侧编码。四者不可互换，getFirstByDbTenantCode 只按 db_tenant_code + enable='Y' 命中。
- term: 项目标识(英文)
  aliases:
  - tenantFlgEn
  - tenant_flg_en
  - projectMark
  - 租户英文标识
  maps_to: tenant_setting_config.tenant_flg_en
  also_confused_with:
  - tenant_setting_config.tenant_flag_zh
  - tenant_project.tenant_flg_en
  - cust_company_info.tenant_flg_en
  adjudication: boundary
  boundary: Excel 导入的『项目标识(产融 tenant_flg_en)』实际定位的是 tenant_setting_config.tenant_flg_en（getFirstByTenantFlgEn），不是
    tenant_project；tenantFlagZh 只是中文展示名。
- term: 灰度颜色 / 背景颜色
  aliases:
  - bgColor
  - bg_color
  - 灰色
  - 彩色
  maps_to: tenant_setting_config.bg_color
  also_confused_with:
  - tenant_setting_config.ai_resource_color
  - tenant_setting_config.main_theme_color
  - tenant_setting_config.adapt_colour
  adjudication: boundary
  boundary: bg_color 是 L/G 的全局灰度开关结果；ai_resource_color 是智能客服按钮色（HEX），main_theme_color
    是主题色，adapt_colour 是适配背景色，三者不参与灰度缓存判断。
- term: 运营邮件
  aliases:
  - sendEmail
  - send_email
  - operator_email
  maps_to: tenant_setting_config.send_email
  also_confused_with:
  - tenant_project.send_email
  - tenant_setting_config.operator_email
  adjudication: boundary
  boundary: send_email 是『是否发送』的 Y/N 开关，operator_email 是收件地址；tenant_project 与 tenant_setting_config
    各有一份同名开关，分别对应项目级与租户级运营触达。
- term: 运营人员 / 运营对接人
  aliases:
  - operatorId
  - operator_id
  - opContactA
  - operationId
  maps_to: cust_person_info.operator_id
  also_confused_with:
  - operation_user.operation_id
  - tenant_setting_config.operator_id
  - cust_project_rel.op_contact_a
  adjudication: boundary
  boundary: cust_person_info.operator_id 存的是运营中台人员 id（用 operCustFacade.getOperatorList
    的 OperUserDTO.id 比对）；operation_user.operation_id 是运营中台库内主键；tenant_setting_config.operator_id
    是租户级运营人员；op_contact_a 是项目/企业关联表上的对接人字段。
- term: 项目码是否必填
  aliases:
  - projectCodeRequired
  - project_code_required
  maps_to: tenant_setting_config.project_code_required
  also_confused_with:
  - tenant_setting_config.default_project_id
  adjudication: boundary
  boundary: project_code_required='Y' 是触发条件，default_project_id 是被约束对象；前者为 Y 时后者必填。
rules:
- name: 项目码必填联动默认项目
  content: projectCodeRequired='Y' 时必须提供 defaultProjectId，否则抛 COMMON_EXCEPTION『项目码为必填时，请先配置默认关联项目』
  impact: 租户保存/迁移被拦截
  field_targets:
  - tenant_setting_config.project_code_required
  - tenant_setting_config.default_project_id
  evidence: code_path:TenantDomainService.java:checkBeforeSave（注释 TASK-0003）+ reqdoc:租户管理业务规则文档
- name: 租户唯一性校验
  content: 对 uniSocialCreditCode / code / name / dbTenantCode / tenantFlgEn / devDomain
    / sitDomain / uatDomain / prdDomain 逐个做 count==0 校验；needHfive='Y' 时追加四个 H5 域名唯一；bandName
    的唯一校验已被注释禁用
  impact: 保存/迁移去重；命中唯一约束给出『已存在，请确认!』
  field_targets:
  - tenant_setting_config.code
  - tenant_setting_config.db_tenant_code
  - tenant_setting_config.tenant_flg_en
  - tenant_setting_config.uni_social_credit_code
  evidence: code_path:TenantDomainService.java:checkUnique
- name: 自营假租户共享落表
  content: 同 dbTenantCode 已存在主记录、且 tenant_flg_en 不同、且既有记录 share_flag='Y' 时判定为自营假租户：不新增主表，改写入
    tenant_setting_config_share（仅对 name/bandName/tenantFlgEn 做 share 表内唯一校验），返回既有租户
    id
  impact: XYC 自营租户下可挂多个项目标识
  field_targets:
  - tenant_setting_config.db_tenant_code
  - tenant_setting_config.share_flag
  - tenant_setting_config_share.tenant_flg_en
  evidence: code_path:TenantDomainService.java:existEarlyLLsTenant / doSaveTenantShare
- name: Excel 导入定位与写入范围
  content: 按 tenant_flg_en 查 tenant_setting_config（查不到报『租户不存在』）；projectCodeRequired
    非空才覆盖；defaultProjectId 仅在数据库原值为 null 时写入，且只用 tenantProjectService.getById 校验存在性；空
    projectMark 行在解析阶段被静默丢弃；每行异常写入错误列表并计入 failCount
  impact: 存量租户运营配置批量回写
  field_targets:
  - tenant_setting_config.tenant_flg_en
  - tenant_setting_config.project_code_required
  - tenant_setting_config.default_project_id
  evidence: code_path:TenantAppliactionService.java:importTenantOperationConfig /
    importTenantOperationConfigByFile
- name: 运营配置专用更新通道
  content: updateOperationConfigById 将入参空串/空白统一写 NULL；显式把原 update_time/update_user/update_by
    回写为原值（保持标准更新人不变），另写 op_update_user=当前用户名、op_update_time=now；更新后调用 afterSaveOrUpdateBaseInfoAndPushTenant
    清域名元数据缓存并推 TENANT_SYNC CHANGED 事件
  impact: 运营侧改动不污染标准审计字段，同时联动下游业务系统
  field_targets:
  - tenant_setting_config.op_update_user
  - tenant_setting_config.op_update_time
  - tenant_setting_config.operator_email
  - tenant_setting_config.send_email
  evidence: code_path:TenantDomainService.java:updateOperationConfigById
- name: 租户生效八项校验
  content: effective 依次校验合同模板、消息模板-通知、消息模板-待办、消息模板-短信、平台运营方企业、门户页配置、租户产品、基础信息（含 H5/小程序必填组）；任一失败拼装提示『请先完成租户维度的…配置！』并返回
    alertEnabled=true，不写 status='Y'；platformTenantEffectiveExcludeDbTenantCode 白名单内的租户跳过校验直接返回
  impact: 租户上线门禁
  field_targets:
  - tenant_setting_config.status
  - tenant_setting_config.platform_operator
  - tenant_setting_config.portal_flag
  - tenant_setting_config.need_hfive
  - tenant_setting_config.need_mp_wx
  evidence: code_path:TenantDomainService.java:effective + PlatformComponentFacade.java:predicateEffective
- name: 灰度缓存与生效判定
  content: BGCOLOR_SWITCH_TTL 缓存 BgColorCacheDto（startTime=startDate 00:00:00，endTime=endDate
    23:59:59），TTL 取当前时间到 endTime 的秒数；灰度窗口内租户未设色则批量置 G；窗口未生效时不允许修改设置（『背景颜色设置已经生效，不支持修改!』）；缓存为空或过期时
    updateTenantColorNull 并删缓存
  impact: 全平台背景灰度开关
  field_targets:
  - tenant_setting_config.bg_color
  evidence: code_path:TenantSettingConfigController.java:setBgColor / setCache / getBgColor
- name: 租户事件推送门控
  content: CREATED 事件必须指定 platformProductCode，且先 pushing(id) 置 pushing_status='Y'
    再推送；非 CREATED 事件先校验 pushing_status='Y'，否则打印『推数租户需先推[创建]事件』直接 return，不推送全量对接产品
  impact: 防止下游收到无创建上下文的变更事件
  field_targets:
  - tenant_setting_config.pushing_status
  evidence: code_path:TenantAppliactionService.java:pushTenant / pushTenantSync
- name: SSO/DBAss 通道初始化
  content: 统一社会信用码必填且需通过 CreditCodeUtil 校验；ssoSysChannel/ssoTenantChanel/mpSsoSysChannel/mpSsoTenantChanel
    任一为空才调 unionAuthApi.tenantAndAppIdAuth，按返回的 scpr-pplatform-pc / scpr-pplatform-mp
    回填四字段；dbassAppId/dbassPrivateKey 为空时统一写 Nacos 的产融 appId/privateKey（所有租户共用）；随后以
    authSmsMsg 幂等开通短信能力
  impact: 租户开通基础设施初始化；迁移租户在事务提交后异步触发且要求统一社会信用码非空
  field_targets:
  - tenant_setting_config.dbass_app_id
  - tenant_setting_config.dbass_private_key
  - tenant_setting_config.sso_sys_channel
  - tenant_setting_config.sso_tenant_chanel
  evidence: code_path:SsoSysChannelInitService.java:initDbassAndSsoConfig + TenantAppliactionService.java:syncTenant
- name: 运营配置更新后清理元数据缓存
  content: afterSaveOrUpdateBaseInfoAndPushTenant 先按 devDomain/sitDomain/uatDomain/prdDomain
    调 platformMetadataGetRequestPrm.clearCache，再推 CHANGED 事件；未启用的域名参数也会传入（不做非空过滤）
  impact: 多环境域名元数据一致性
  field_targets:
  - tenant_setting_config.dev_domain
  - tenant_setting_config.prd_domain
  evidence: code_path:TenantAppliactionService.java:afterSaveOrUpdateBaseInfoAndPushTenant
- name: 异步任务文件语义约定
  content: IMPORT 登记时只写 file_name（源 Excel 展示名），file_url 留空；仅 markImportFailed/markFailed
    时把 file_url 改写为错误文件 COS path；EXPORT 成功后由 markSuccessWithFile 写结果文件；入库存 COS path
    不存签名 URL，查询时实时换签名直链
  impact: 避免前端把用户上传源文件误当结果文件下载
  field_targets:
  - async_io_task.file_url
  - async_io_task.file_name
  - async_io_task.result_text
  evidence: code_path:AsyncIoTaskManager.java:createPending / markImportFailed / markFailed
    / toDownloadUrl
- name: 异步任务分片调度
  content: asyncIoTaskShardingJobHandler 按 MOD(task_no, shardTotal)=shardIndex 拉 PENDING
    任务并行执行；task_no 由 MySQL 自增保证均匀；超时清理由独立单机任务把 RUNNING 超时置 FAILED
  impact: 多节点不重不漏执行异步任务
  field_targets:
  - async_io_task.task_no
  - async_io_task.status
  evidence: code_path:AsyncIoTaskManager.java:listPendingByShard / AsyncIoTaskXxxJobHandler.java:shardingExecute
- name: 资产审核运营人同步前置条件
  content: 仅当 companyType == SUPPLIER 且企业存在、有启用联系人、operatorId 能在运营中台列表中命中时才继续；仅对 operator_id
    为空或已离职（不在有效运营人集合内）的联系人更新，其余跳过并计入 skipCount；更新后异步推送并写变更记录（changeType=ASSET_AUDIT_SYNC）
  impact: 业务系统资产审核人同步到企业联系人
  field_targets:
  - cust_person_info.operator_id
  - cust_person_info.operator_realname
  - cust_company_info.cust_company_type
  evidence: code_path:AssetOperatorSyncApplication.java:syncAssetOperator
