  code_evidence: lowcode-pplatform-tenant-management/.../TenantAppliactionService.java:importTenantOperationConfigByFile
    —— 仅 EasyExcel.headRowNumber(1) 按 DTO 映射解析，无表头列名顺序校验，也无该异常；解析异常统一抛 RuntimeException('文件解析失败，请检查Excel格式是否正确')
  action: prose_only
- claim: BR-011 项目标识存在性校验：以 tenant_flg_en 在 tenant_project 中查询，未命中视为非法行
