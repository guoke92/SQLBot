body: '语义分析中该规则条目被截断：content 尾部（"…project_code_requ" 处）与 evidence 字段均未采集完整，无法逐字回填
  ground:rule 的 content / field_targets / evidence，因此本版暂不产出 rules/rule_tenant_config_excel_import.md。


