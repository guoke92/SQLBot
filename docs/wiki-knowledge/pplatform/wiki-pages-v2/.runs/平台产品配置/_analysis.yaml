field_semantics:
- table: platform_product
  field: product_code
  meaning: 平台产品编码（业务唯一键，用于跨表引用、事件路由、列表白名单过滤）
  evidence: db
- table: platform_product
  field: product_type
  meaning: 产品分类：GENERAL=通用产品，INTERWORKING=互通产品
  evidence: db
- table: platform_product
  field: product_status
  meaning: 产品生效状态：'1'=已生效，'0'=待生效
  evidence: db
- table: platform_product
  field: cust_role_combine
  meaning: 平台产品允许的企业角色组合（文本解析为 Set<Set<String>>，反欺诈校验用）
  evidence: code
- table: platform_product
  field: multiple_cust_role_flag
  meaning: 是否支持多企业角色(Y/N)，为 Y 时进入产品需校验企业角色
  evidence: code
- table: platform_product
  field: multiple_project_flag
  meaning: 是否有多项目配置(Y/N)，为 Y 时进入产品需校验关联项目生效状态
  evidence: code
- table: platform_product
  field: platform_flag
  meaning: 是否平台标识(Y/N)
  evidence: db
- table: platform_product
  field: platform_code
  meaning: 平台编码，用于 listPlatformByProductCode 按平台聚合产品
  evidence: db
- table: platform_product
  field: product_cate
  meaning: 产品增信类型：STRONG/CREDIT/WEAKLY
  evidence: db
- table: platform_product
  field: multiple_client_type
  meaning: 多端口过滤类型：default=按产品(BY_PRODUCT)，CompanyType=按企业角色(BY_COMPANY_TYPE)
  evidence: code
- table: platform_product
  field: wkfl_flag
  meaning: 产品是否启用工作流，映射 PlatformProductDTO.platformProductWfklConfigFlag
  evidence: code
- table: platform_product
  field: product_construction_status
  meaning: 产品建设情况，N=未建成时直接返回 GOTO_DETAIL 步骤
  evidence: code
- table: platform_product
  field: basic_product
  meaning: 是否是产融底座
  evidence: db
- table: platform_product
  field: enable
  meaning: 逻辑启用标记 Y/N
  evidence: db
- table: platform_product
  field: logo_icon_url
  meaning: 产品 logo（附件 JSON，经 FileUtils 转真实 url）
  evidence: db
- table: cust_auth_application
  field: open_status
  meaning: 客户产品开通状态：OPENED/OPENING/NOT_OPENED
  evidence: code
- table: cust_auth_application
  field: ref_cust_auth_application_tenant_product
  meaning: 关联 tenant_product.code，客户产品与租户产品的关联键
  evidence: code
- table: tenant_product
  field: platform_product_code
  meaning: 租户产品对应的平台产品编码，引用 platform_product.product_code
  evidence: code
- table: tenant_product
  field: open_status
  meaning: 租户产品开通/上架状态：Y=已开通，P=处理中(多级回调)
  evidence: code
- table: cust_config_mapping
  field: outer_channel
  meaning: 配置映射外部渠道，实现中被用作 platformProductCode 过滤键
  evidence: code
state_machines:
- name: 平台产品生效状态
  field: platform_product.product_status
  states:
  - value: '0'
    label: 待生效
    source: code_enum
  - value: '1'
    label: 已生效
    source: db_dist
  transitions:
  - from: '0'
    event: 人工提交生效 effective()
    to: '1'
    evidence: code_path:PlatformProductApplication.java#effective -> PlatformProductDomainService.java#effective
      -> PlatformProduct.java:100
- name: 客户产品开通状态
  field: cust_auth_application.open_status
  states:
  - value: NOT_OPENED
    label: 未开通
    source: code_const
  - value: OPENING
    label: 开通中
    source: code_const
  - value: OPENED
    label: 已开通
    source: code_const
  transitions:
  - from: NOT_OPENED
    event: initProduct 初始化客户产品
    to: OPENING
    evidence: code_path:CustProductDomainService.java#initProduct
  - from: OPENING
    event: doActiveProduct 开通完成
    to: OPENED
    evidence: code_path:CustProductDomainService.java#doActiveProduct
  - from: OPENED
    event: 查无授权记录回退
    to: NOT_OPENED
    evidence: code_path:CustProductDomainService.java#listTenantProductWithOpenedCustProduct;PlatFormProductProvierImpl.java#queryProductStatus
- name: 租户产品开通状态
  field: tenant_product.open_status
  states:
  - value: Y
    label: 已开通/已上架
    source: code_const
  - value: P
    label: 处理中(等待多级回调)
    source: code_const
  transitions:
  - from: P
    event: activeAndNotify：ACFLOW/ORDER 产品置 P 等待多级回调
    to: P
    evidence: code_path:TenantProductApplication.java#activeAndNotify
  - from: P
    event: activeAndNotify：其他产品 domainService.active 生效
    to: Y
    evidence: code_path:TenantProductApplication.java#activeAndNotify
calibers:
- name: 客户产品已开通
  predicate: cust_auth_application.open_status = 'OPENED'
  scope: 客户端已开通产品列表/进入产品校验/queryProductStatus 默认判活
  evidence: code
- name: 客户产品开通中
  predicate: cust_auth_application.open_status = 'OPENING'
  scope: 我的产品列表/初始化开通
  evidence: code
- name: 客户产品未开通
  predicate: cust_auth_application.open_status = 'NOT_OPENED'
  scope: 租户产品未开通回退与展示
  evidence: code
- name: 平台产品已生效
  predicate: platform_product.product_status = '1'
  scope: 平台产品列表/生效
  evidence: db
- name: 通用产品
  predicate: platform_product.product_type = 'GENERAL'
  scope: listPlatformProduct/客户产品扩展点 GENERAL
  evidence: code
- name: 互通产品
  predicate: platform_product.product_type = 'INTERWORKING'
  scope: 互通产品扩展点
  evidence: code
- name: 平台产品启用
  predicate: platform_product.enable = 'Y'
  scope: 产品列表/唯一性检查
  evidence: db
- name: 租户产品已上架
  predicate: tenant_product.open_status = 'Y'
  scope: 开通客户产品前置校验/租户产品列表
  evidence: code
- name: 配置映射启用
  predicate: cust_config_mapping.enable = 'Y'
  scope: getConfig/listConfig 查询
  evidence: code
term_bridges:
- term: 产品开通状态
  aliases:
  - openStatus
  - open_status
  - product_status
  - 开通状态
  maps_to: cust_auth_application.open_status
  also_confused_with:
  - tenant_product.open_status
  - platform_product.product_status
  adjudication: boundary
  boundary: 三张表语义不同：platform_product.product_status 为产品定义层生效状态('0'/'1')；tenant_product.open_status
    为租户上架状态(Y/P)；cust_auth_application.open_status 为企业级开通状态(OPENED/OPENING/NOT_OPENED)。需求文档称
    PENDING/ACTIVE/CANCEL 与实现不符。
- term: 平台产品编码
  aliases:
  - productCode
  - platformProductCode
  - product_code
  - platform_product_code
  maps_to: platform_product.product_code
  also_confused_with:
  - platform_product.platform_code
  adjudication: boundary
  boundary: product_code 为产品级编码(ACFLOW/AMS/DRAFT/ORDER/RVSFACTOR_PC/STORAGE/VOUCHER)；platform_code
    为平台级编码(AMS/DRAFT/HTCP*/PPLATFORM/XYC)，两者不可互换。
- term: 配置映射过滤键
  aliases:
  - outerChannel
  - productCode
  - platformProductCode
  maps_to: cust_config_mapping.outer_channel
  also_confused_with:
  - cust_config_mapping.inner_code
  adjudication: boundary
  boundary: getProductCompanyTypeConfig 实际传参为 (type='COMPANY_TYPE_MAPPING', innerCode=companyType,
    outerChannel=platformProductCode)，outer_channel 存的是平台产品编码而非渠道。
- term: 企业角色
  aliases:
  - companyType
  - custCompanyType
  - company_type_code
  - roleType
  maps_to: cust_company_info.cust_company_type
  also_confused_with:
  - cust_project_rel.company_type
  - platform_product_cust_role.company_type_code
  adjudication: synonym
  boundary: 均为同一 CustCompanyTypeEnum 取值域(CORE/SUPPLIER/DEALER/FINANCE/PLATFORM_OPERATOR_COMPANY
    等)，在多表以不同列名出现。
rules:
- name: 平台产品编码/名称唯一
  content: platform_product.product_code 与 name 建唯一索引，保存前 checkBeforeSave 校验产品基本信息、code
    唯一与类型枚举
  impact: 重复编码/名称阻断保存
  field_targets:
  - platform_product.product_code
  - platform_product.name
  evidence: db:platform_product.product_code(UNI)/uq_name + code:PlatformProductApplication.java#checkBeforeSave
- name: 企业角色组合反欺诈
  content: 聚合同一企业在同一产品下的 companyType 集合，仅当角色数>=2 且集合不在 platform_product.cust_role_combine
    允许集合内时抛 BaseException(系统暂不支持该角色组合)
  impact: 阻断企业加入项目/开通产品，防止一企业一产品扮演多角色
  field_targets:
  - platform_product.cust_role_combine
  - cust_project_rel.company_type
  evidence: code:TenantProductApplication.java#checkCustRoleCombine
- name: 进入产品项目生效校验
  content: platform_product.multiple_project_flag=Y 且产品为通用类型时，需企业关联项目生效(projectRelProductRangeAdapter.listProject)，否则返回
    暂无操作权限
  impact: 未关联生效项目禁止进入产品
  field_targets:
  - platform_product.multiple_project_flag
  - tenant_project.project_status
  evidence: code:PlatformProductApplication.java#gotoProductSupplierFirstRelatedProject
- name: 平台运营方豁免
  content: 平台运营方不检查项目状态，且在 custProductInclusion 中直接返回 true
  impact: 运营方可进入/开通全部产品
  field_targets:
  - cust_company_info.cust_company_type
  evidence: code:PlatformProductApplication.java#gotoProductSupplierByCompanyType;CustProductDomainService.java#custProductInclusion
- name: 列表白名单过滤
  content: Nacos 配置 platform.limit.product.support 非空时，仅返回包含 productCode 的产品
  impact: 控制客户端可见平台产品集合
  field_targets:
  - platform_product.product_code
  evidence: code:PlatformProductController.java#filterLimitProduct;PlatformProductProviderImpl.java#listOpenProductByCompanyId
- name: 多级产品回调置中
  content: ACFLOW/ORDER 产品开通时把 tenant_product.open_status 置 P 等待多级回调，其他产品直接生效并推送 EFFECTED
    事件
  impact: 租户产品开通状态流转
  field_targets:
  - tenant_product.open_status
  evidence: code:TenantProductApplication.java#activeAndNotify
- name: 产品扩展配置来源 Nacos
  content: getProductExtConfig/getProductConfig 读取 app-list.yml 的 extConfig/clientConfig，而非
    cust_config_mapping 表
  impact: 产品扩展/页面配置查询不落库
  field_targets:
  - platform_product.product_code
  evidence: code:PlatformProductApplication.java#getProductExtConfig;NacosFacade.java#listProductApp
reqdoc_claims:
- claim: BR-001 保存或更新 PlatformProductDO 前调用 checkBeforeSave 校验产品基本信息、code 唯一性、产品类型枚举，失败抛
    BaseException
  code_status: confirmed
  code_evidence: PlatformProductController.java#checkBeforeSave;PlatformProductApplication.java#checkBeforeSave;PlatformProductDomainService.java#checkBeforeSave
  action: anchor
- claim: BR-002 平台产品列表过滤：AGW 直接返回，非 AGW 取当前 dbTenantCode 按 tenant_product 已开通列表过滤，再经
    Nacos platform.limit.product.support 白名单过滤
  code_status: confirmed
  code_evidence: PlatformProductController.java#listTenantProduct;PlatformProductController.java#filterLimitProduct
    + reqdoc:BR-002
  action: anchor
- claim: BR-003 平台产品扩展配置按 productCode+key+expectedValue 三元组查询 cust_config_mapping
  code_status: refuted
  code_evidence: PlatformProductApplication.java#getProductExtConfig（实际读 nacosFacade.listProductApp()
    的 extConfig/clientConfig，cust_config_mapping 仅用于 getConfig/listConfig 的 type+innerCode+outerChannel
    查询）
  action: prose_only
- claim: 租户产品开通状态取值为 PENDING / ACTIVE / CANCEL（ProductOpenStatusEnum）
  code_status: refuted
  code_evidence: TenantProductApplication.java#activeAndNotify（使用 ProductOpenStatusEnum.Y
    与 .P，并与 BooleanEnum.Y 的 'Y' 同域比较）
  action: prose_only
- claim: 2.1 租户产品开通：TenantProductController.create/activeAndNotify → 生成 tenant_product
    状态 PENDING → checkOnTheWay 在途校验 → activeAndNotify 置 ACTIVE
  code_status: uncovered
  code_evidence: TenantProductController.java#create/#active;TenantProductApplication.java#activeAndNotify（create→domainService.create
    落库状态与 domainService.checkOnTheWay 在途逻辑未在证据中展开）
  action: review
- claim: 激活后发布 PlatProductEventType 事件并同步下游 client
  code_status: confirmed
  code_evidence: TenantProductApplication.java#activeAndNotify（migratoryPointService.push(RpcPoint.PRODUCT_SYNC,
    PlatProductEventType.EFFECTED, ...)） + reqdoc:2.1
  action: anchor
- claim: 2.3 客户加入项目-角色组合校验：聚合企业在所有产品下 companyType 集合，2+ 角色时读取 platform_product.cust_role_combine，不在合法集合抛
    BaseException 系统暂不支持该角色组合
  code_status: confirmed
  code_evidence: TenantProductApplication.java#checkCustRoleCombine;TenantProductApplication.java#checkProjectProductByCustType
  action: anchor
- claim: 2.2 租户项目生命周期 effective/invalid/change/delete 与 SyncTenantProjectJobHandle
    下游同步
  code_status: uncovered
  code_evidence: TenantProjectApplication 未在证据中展开，仅 codemap 提及 SyncTenantProjectJobHandle
  action: review
