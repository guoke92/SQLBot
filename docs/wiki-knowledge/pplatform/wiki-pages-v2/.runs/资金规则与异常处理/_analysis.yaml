field_semantics:
- table: funding_exception_resolution
  field: exception_no
  meaning: 异常编号，系统按 fundingPartyCode 生成的业务流水号，非用户录入
  evidence: code
- table: funding_exception_resolution
  field: funding_party_code
  meaning: 对接方标识（资方标识 code），导入时经 ClientQueryFunderCodeService RPC 校验存在性后可写入；唯一键成员
  evidence: db
- table: funding_exception_resolution
  field: funding_party_name
  meaning: 资金方名称，展示/模糊查询用，非关联键
  evidence: db
- table: funding_exception_resolution
  field: error_keyword
  meaning: 报错关键字，与 errorMessage 做 contains 匹配的命中词；唯一键成员
  evidence: db
- table: funding_exception_resolution
  field: error_reason
  meaning: 报错原因（选填，导入不校验）
  evidence: db
- table: funding_exception_resolution
  field: suggestion
  meaning: 建议处理方案（导入必填列）
  evidence: db
- table: funding_exception_resolution
  field: file_path
  meaning: 附件，存 JSON（files[].filePath），Provider 侧解密为 fileUrl 返回
  evidence: code
- table: funding_exception_resolution
  field: product_code
  meaning: 产品 code，导入时可由产品名称反查映射为 code；唯一键成员
  evidence: db
- table: funding_exception_resolution
  field: enable
  meaning: 有效标识，导入/保存固定写 'Y'，查询固定过滤 'Y'
  evidence: code
- table: funding_rule_info
  field: funding_party_mark
  meaning: 资方标识（规则域的表达，与异常域 funding_party_code 同源不同名）
  evidence: code
- table: funding_rule_info
  field: rule_status
  meaning: 规则状态：PENDING(待生效)/ACTIVE(生效中)/INACTIVE(已失效)
  evidence: code
- table: funding_rule_info
  field: version
  meaning: 版本号，新增=1，每次更新明细自增 1
  evidence: code
- table: funding_rule_info
  field: code
  meaning: 规则信息唯一编码，DataModelUtils.getUniqueKey() 生成，被 funding_rule_detail.fund_rule_code_ref
    引用
  evidence: code
- table: funding_rule_detail
  field: rule_key
  meaning: 规则字段 key，语义等于 funding_rule_front_cfg.front_key（应用层匹配，非 SQL JOIN）
  evidence: code
- table: funding_rule_detail
  field: rule_value
  meaning: 规则值（字符串）
  evidence: code
- table: funding_rule_detail
  field: rule_layer
  meaning: 规则层，保存时取自 frontCfg.rule_layer，取值为 UNDERLYING/FINANCING/OTHER
  evidence: db
- table: funding_rule_detail
  field: rule_info_id
  meaning: 关联 funding_rule_info.id
  evidence: code
- table: funding_rule_detail
  field: fund_rule_code_ref
  meaning: 关联 funding_rule_info.code
  evidence: code
- table: funding_rule_detail
  field: check_scene
  meaning: 校验场景（DB 实测仅 SUBMIT_VALIDATE，但本主题 Application/Provider 写值点均未 setCheckScene，来源在其他链路）
  evidence: db
- table: funding_rule_front_cfg
  field: front_key
  meaning: 前端字段 key，detail.rule_key 的匹配目标
  evidence: code
- table: funding_rule_front_cfg
  field: key_name
  meaning: 字段名称描述，对外展示为 desc；导入按 (product, rule_layer, key_name) 三元组定位 front_key
  evidence: code
- table: funding_rule_front_cfg
  field: key_type
  meaning: 字段业务规则类型（FIELD_REQUIRED/FILE_TYPE_LIMIT/DATE_CHECK_WORKDAY 等），对外展示为 type
  evidence: db
- table: funding_rule_front_cfg
  field: rule_key
  meaning: 规则字段 key，对外输出 item.key
  evidence: code
state_machines:
- name: 资方规则状态机
  field: funding_rule_info.rule_status
  states:
  - value: PENDING
    label: 待生效
    source: code_enum
  - value: ACTIVE
    label: 生效中
    source: code_enum
  - value: INACTIVE
    label: 已失效
    source: code_enum
  transitions:
  - from: NEW
    event: saveRuleInfo 新增（ruleInfoId 为空）
    to: PENDING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:380
  - from: PENDING
    event: activeRule
    to: ACTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:296
  - from: ACTIVE
    event: inActiveRule
    to: INACTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:311
  - from: INACTIVE
    event: activeRule（无前置状态校验，可回到生效）
    to: ACTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:296
  - from: PENDING
    event: inActiveRule（无前置状态校验，可直接置为失效）
    to: INACTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:311
calibers:
- name: 异常解析有效数据
  predicate: funding_exception_resolution.enable = 'Y'
  scope: 列表/导出/Provider 查询统一过滤；导入固定写 Y
  evidence: code
- name: 资方规则有效数据
  predicate: funding_rule_info.enable = 'Y'
  scope: 导出查询过滤；saveRuleInfo 新增固定写 Y
  evidence: code
- name: 资方规则明细有效数据
  predicate: funding_rule_detail.enable = 'Y'
  scope: 详情/Provider 查询过滤；saveRuleInfo 固定写 Y
  evidence: code
- name: 前端规则配置有效数据
  predicate: funding_rule_front_cfg.enable = 'Y'
  scope: 导入校验与 Provider 查询过滤
  evidence: code
- name: 异常解析产品范围（DB 实际落库值）
  predicate: funding_exception_resolution.product_code = 'ACFLOW'
  scope: DB 实测 58/90；另一取值 RVSFACTOR_PC 32/90
  evidence: db
- name: 资方规则明细产品范围（DB 实际落库值）
  predicate: funding_rule_detail.product_code = 'ACFLOW'
  scope: DB 实测 1062/1530；另一取值 RVSFACTOR_PC 468/1530
  evidence: db
- name: 规则层枚举（DB 实测）
  predicate: funding_rule_detail.rule_layer = 'FINANCING'
  scope: DB 925/1530；UNDERLYING 499、OTHER 106
  evidence: db
- name: 校验场景枚举（DB 实测）
  predicate: funding_rule_detail.check_scene = 'SUBMIT_VALIDATE'
  scope: DB 实测 50 条，本主题代码未见写值点
  evidence: db
term_bridges:
- term: 资方标识
  aliases:
  - 资金方标识
  - 对接方标识
  - fundingPartyMark
  - fundingPartyCode
  - fundingPartyId
  maps_to: funding_rule_info.funding_party_mark
  also_confused_with:
  - funding_exception_resolution.funding_party_code
  adjudication: boundary
  boundary: 规则域统一落 funding_rule_info.funding_party_mark / funding_rule_detail.funding_party_mark；异常域统一落
    funding_exception_resolution.funding_party_code。两域同源（都来自资方 RPC 的 fundingKey），但列名不同、表不同，不可互换
    join。
- term: 资金方名称
  aliases:
  - 资方名称
  - fundingPartyName
  maps_to: funding_exception_resolution.funding_party_name
  also_confused_with:
  - funding_rule_info.funding_party_name
  adjudication: synonym
  boundary: 两表各自冗余存储资方名称，均非关联键，仅模糊查询与展示用。
- term: 规则层级
  aliases:
  - 规则层
  - ruleLayer
  maps_to: funding_rule_detail.rule_layer
  also_confused_with:
  - funding_rule_front_cfg.rule_layer
  adjudication: synonym
  boundary: front_cfg.rule_layer 是配置侧定义，detail.rule_layer 保存时从 frontCfg 复制；同值但不是外键关系。
- term: 规则字段 key
  aliases:
  - frontKey
  - front_key
  - rule_key
  maps_to: funding_rule_detail.rule_key
  also_confused_with:
  - funding_rule_front_cfg.rule_key
  - funding_rule_front_cfg.front_key
  adjudication: boundary
  boundary: detail.rule_key 语义等价于 front_cfg.front_key（应用层 Map 匹配）；front_cfg.rule_key
    是另一个对外输出字段，Provider 里被写成 item.key，三者不可混用。
- term: 报错关键字
  aliases:
  - errorKeyword
  - errorMessage
  maps_to: funding_exception_resolution.error_keyword
  also_confused_with: []
  adjudication: synonym
  boundary: ProviderImpl 中局部变量名为 errorMessage，实际取的是 DTO.errorKeyword，命名混淆但语义同一字段。
rules:
- name: 异常解析导入全量校验通过才入库
  content: 阶段1 Excel 行级必填校验（产品code/对接方标识/资金方名称/报错关键字/建议处理方案 5 列）→ 阶段2 productCode
    枚举比对 → 阶段3 按 productCode 分组各调一次 RPC 校验对接方标识 + 唯一键 (productCode,fundingPartyCode,errorKeyword)
    查重；任一错误直接返回错误列表且不写库；全部通过才在单事务内 saveOrUpdateBatch。
  impact: 任何一行错误都会导致整批不落库；单次导入上限 5000 行
  field_targets:
  - funding_exception_resolution.product_code
  - funding_exception_resolution.funding_party_code
  - funding_exception_resolution.error_keyword
  evidence: code_path:ExceptionResolutionApplication.java:importRecords/doUpsertAll
    + DB:funding_exception_resolution_un(funding_party_code,error_keyword,product_code)
- name: 异常解析产品名→code 与资金方名→code 二次翻译
  content: 阶段2 用 listPlatformProduct(GENERAL) 构 productName→productCode 映射回填；阶段3 用
    RPC 结果构 "fundingPartyName-fundingKey"→fundingKey 映射回填，再校验回填值是否在合法集合内。
  impact: 导入模板允许填产品名称/资金方名称-标识，系统会翻译；翻译失败则报“不在允许范围内/不存在”
  field_targets:
  - funding_exception_resolution.product_code
  - funding_exception_resolution.funding_party_code
  evidence: code_path:ExceptionResolutionApplication.java:collectProductCodeErrors/collectFundingPartyCodeErrors
- name: 异常解析保存前唯一性校验
  content: checkBeforeSave 按 productCode + fundingPartyCode + errorKeyword（并排除自身 id）查询，命中即抛
    BaseException('报错关键字已经存在')。
  impact: 页面手工新增/编辑同样受唯一键约束
  field_targets:
  - funding_exception_resolution.product_code
  - funding_exception_resolution.funding_party_code
  - funding_exception_resolution.error_keyword
  evidence: code_path:ExceptionResolutionApplication.java:checkBeforeSave
- name: 异常解析对上游只按关键字 contains 命中
  content: ProviderImpl 先按 fundingPartyCode + productCode + enable='Y' 批量查，再在内存中过滤
    errorMessage.contains(errorKeyword)，可命中多条全部返回；参数缺失或系统异常一律返回空列表不抛错。
  impact: 上游拿到的结果不带模糊度控制，关键字长度/大小写敏感（实际为大小写敏感 contains）
  field_targets:
  - funding_exception_resolution.error_keyword
  - funding_exception_resolution.funding_party_code
  - funding_exception_resolution.product_code
  evidence: code_path:FundingPartyExceptionResolutionProviderImpl.java:doQuery/queryByFundingPartyId
- name: 资方规则导入的资方校验产品被硬编码为 ACFLOW
  content: collectFundingPartyMarkErrors 里 dto.setProductCode(ProductCodeEnum.ACFLOW)
    后调 ClientQueryFunderMarkService，合法资方集合与 mark→name 映射均以 ACFLOW 为准，但错误文案中拼的是行自身的
    productCode。
  impact: 为 RVSFACTOR_PC 导入规则时，资方合法性仍按 ACFLOW 名单判断，且落库的 fundingPartyName 可能来自 ACFLOW
    映射；与 DB 实测两产品并存存在语义张力
  field_targets:
  - funding_rule_info.product_code
  - funding_rule_info.funding_party_mark
  - funding_rule_info.funding_party_name
  evidence: code_path:FundRuleInfoApplication.java:collectFundingPartyMarkErrors
- name: 资方规则导入四阶段校验
  content: 阶段1 Excel 必填（产品/资方标识code/规则层级/规则名称/规则值）→ 阶段2 productCode 枚举 → 阶段3 资方标识
    RPC 校验 → 阶段4 规则层级 displayName→dictKey 且按 (product,rule_layer,key_name) 反查 funding_rule_front_cfg
    拿 frontKey；任一失败不落库；通过后按 (productCode,fundingPartyMark) 分组调 saveRuleInfo。
  impact: 导入按组写入，组内 ruleMap.key=frontKey、value=ruleValue
  field_targets:
  - funding_rule_detail.rule_key
  - funding_rule_detail.rule_value
  - funding_rule_front_cfg.key_name
  evidence: code_path:FundRuleInfoApplication.java:importRecords/validateRuleLayerAndFrontCfg/persistFundRuleImportGroups
- name: 资方规则列表/导出查询条件实际忽略时间区间
  content: buildExportQueryParam 中 create_time/update_time 的 ge/le 条件被注释掉，parseTimeRange
    成为死代码；Controller 的 ApiOperation 注释仍宣称支持时间区间查询。
  impact: 按创建/更新时间范围导出无效，只是忽略条件而非报错；导出上限 50000 行、分页 500
  field_targets:
  - funding_rule_info.create_time
  - funding_rule_info.update_time
  evidence: code_path:FundRuleInfoApplication.java:buildExportQueryParam:237
- name: 资方规则保存的版本与明细联动
  content: 新增：查重 (productCode,fundingPartyMark) → 插 funding_rule_info(ruleStatus=PENDING,version=1,code=唯一键,enable=Y)；更新：version+1
    并覆盖 fundingPartyName；随后按 productCode 查 front_cfg，用 ruleMap.key 匹配 frontKey，命中已有
    enable='Y' 明细则更新否则新增。
  impact: ruleMap 中不存在的 frontKey 静默跳过不中断；产品无前端配置直接抛异常
  field_targets:
  - funding_rule_info.version
  - funding_rule_info.rule_status
  - funding_rule_detail.rule_key
  - funding_rule_detail.rule_value
  evidence: code_path:FundRuleInfoApplication.java:saveRuleInfo
- name: 对外规则查询只暴露已生效规则
  content: FundingPartyRuleProviderImpl 按 fundingPartyMark + productCode + ruleStatus=ACTIVE
    查询，无生效规则返回 null；再按 ruleInfoId + enable='Y' 查明细，按 ruleLayer 分组为 UNDERLYING/FINANCING/OTHER。
  impact: PENDING/INACTIVE 规则对外不可见
  field_targets:
  - funding_rule_info.rule_status
  - funding_rule_detail.rule_layer
  evidence: code_path:FundingPartyRuleProviderImpl.java:doQuery
- name: 批量删除为物理删除
  content: 异常解析 batchDelete 用 removeByIds、规则 batchDelete 用 removeBatchByIds，均非 enable='N'
    逻辑删除。
  impact: 删除不可恢复，且 enable 字段并不承担软删职责
  field_targets:
  - funding_exception_resolution.enable
  - funding_rule_info.enable
  evidence: code_path:ExceptionResolutionApplication.java:batchDelete / FundRuleInfoApplication.java:batchDelete
reqdoc_claims:
- claim: 平台产品保存前置校验：调用 PlatformProductApplication.checkBeforeSave 校验产品 code 唯一性、类型枚举等，失败抛
    BaseException 阻断保存（BR-001）
  code_status: confirmed
  code_evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/PlatformProductApplication.java:checkBeforeSave
  action: anchor
- claim: 平台产品列表过滤：非 AGW 端按当前租户已开通 tenant_product 列表过滤，并通过 Nacos 白名单进一步过滤（BR-002）
  code_status: uncovered
  code_evidence: PlatformProductApplication.java 仅有 listPlatformProduct(type) 直连 domainService，未在本主题代码中见
    listTenantProduct/filterLimitProduct 实现
  action: review
- claim: 资源导入遵循“全量校验通过才入库；任一失败直接返回，不做任何保存/更新”
  code_status: confirmed
  code_evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/ExceptionResolutionApplication.java:importRecords
    + lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/FundRuleInfoApplication.java:importRecords
  action: anchor
- claim: 资方规则查询按 fundingPartyMark + productCode 只取 ACTIVE 规则并聚合为底层/融资/其他三组
  code_status: confirmed
  code_evidence: lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/client/fundingparty/provider/FundingPartyRuleProviderImpl.java:doQuery
  action: anchor
- claim: 系统文档未对资金规则与异常处理主题给出独立业务规则章节，仅产品与项目管理文档中提及平台产品校验与列表过滤
  code_status: uncovered
  code_evidence: ''
  action: prose_only
