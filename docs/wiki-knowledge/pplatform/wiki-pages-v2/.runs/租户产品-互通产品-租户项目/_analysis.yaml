field_semantics:
- table: tenant_product
  field: id
  meaning: 租户产品配置主键
  evidence: db
- table: tenant_product
  field: code
  meaning: 租户产品编码，唯一键
  evidence: db
- table: tenant_product
  field: name
  meaning: 租户产品名称，如应收易融、订单融资、融易单
  evidence: db
- table: tenant_product
  field: open_status
  meaning: 租户产品开通状态，DB 实测 N/P/Y，对应 ProductOpenStatusEnum 未开通/开通中/已开通
  evidence: db
- table: tenant_product
  field: platform_product_code
  meaning: 平台产品编号，DB 实测 ACFLOW/ORDER/RVSFACTOR_PC/STORAGE/VOUCHER/BEECREDIT 等
  evidence: db
- table: tenant_product
  field: platform_product_id
  meaning: 平台产品主键，与 tenant_id 组成唯一键 tenant_product_id
  evidence: db
- table: tenant_product
  field: ref_tenant_product_project_code
  meaning: 租户产品-平台产品关联 code，DB 中为 platform_product 业务 code
  evidence: db
- table: tenant_product
  field: ref_tenant_product_tenant_setting_config
  meaning: 租户-产品关联 tenant_setting_config code
  evidence: db
- table: tenant_product
  field: tenant_id
  meaning: 租户 id
  evidence: db
- table: tenant_product
  field: product_cate
  meaning: 产品类型，DB 实测 STRONG/WEAKLY/CREDIT
  evidence: db
- table: tenant_product
  field: is_migratory
  meaning: 是否迁移标识，DB 实测 Y/N，Y 代表已迁移
  evidence: db
- table: tenant_product
  field: max_financing_amount_flag
  meaning: 是否限额融资资金上线，DB 实测 N/Y/0/1 混存
  evidence: db
- table: tenant_product
  field: max_financing_period
  meaning: 融资期限上限，DB 中既有 6/12/36 也有 6个月/12个月 等文本
  evidence: db
- table: tenant_product
  field: enable
  meaning: 逻辑有效标记，DB 实测全部 Y
  evidence: db
- table: tenant_product_menu
  field: product_code
  meaning: 产品 code，DB 实测 ACCOUNT_PRODUCT/BEECREDIT/RVSFACTOR_PC
  evidence: db
- table: tenant_product_menu
  field: company_type
  meaning: 企业角色，DB 实测 CORE/SUPPLIER/DEALER/FINANCE/PLATFORM_OPERATOR/CORPORATION_COMPANY/PROJECT_COMPANY
    等
  evidence: db
- table: tenant_product_menu
  field: menu_id
  meaning: 菜单 id
  evidence: db
- table: tenant_project
  field: id
  meaning: 租户项目主键
  evidence: db
- table: tenant_project
  field: name
  meaning: 项目名称
  evidence: db
- table: tenant_project
  field: project_status
  meaning: 项目状态，代码 ProjectStatusEnum：0 待生效、1 已生效、2 已失效；导出代码按 1 判断已生效
  evidence: code
- table: tenant_project
  field: source
  meaning: 项目来源/产品来源，DB 实测 pplatform 1532、ACFLOW 1255、RVSFACTOR_PC 480、ORDER 226、STORAGE
    8；代码存在 PlatformConstant.PPLATFORM_SYSTEM=pplatform 写值
  evidence: db
- table: tenant_project
  field: channel_code
  meaning: 项目码/渠道码，依据 queryByChannelCode、导出 setChannelCode(project.getChannelCode())
  evidence: code
- table: tenant_project
  field: project_code
  meaning: 项目编码，导出查询条件使用 project_code
  evidence: code
- table: tenant_project
  field: enable
  meaning: 逻辑有效标记，导出只查 enable='Y'，删除方法走逻辑删除
  evidence: code
- table: tenant_project
  field: is_prd
  meaning: 是否生产数据，导出判断 Y 为是、N 为否；洞察平台导出另有 1/0 兼容逻辑
  evidence: code
- table: tenant_project
  field: project_tag
  meaning: 项目标签，导入校验可选值生产项目/测试项目/暂停项目，存枚举值
  evidence: code
- table: tenant_project
  field: op_contact_a
  meaning: 运营对接人A，存运营人员 ID，导出转姓名；导入按姓名转 ID
  evidence: code
- table: tenant_project
  field: op_contact_b
  meaning: 运营对接人B，存 JSON 数组字符串，导出转逗号分隔姓名
  evidence: code
- table: tenant_project
  field: op_contact_a_group
  meaning: 运营组别，跟随运营对接人A 变化，为空时置空
  evidence: code
- table: tenant_project
  field: verification_contact
  meaning: 查验对接人，存运营人员 ID
  evidence: code
- table: tenant_project
  field: verification_contact_group
  meaning: 查验组别
  evidence: code
- table: tenant_project
  field: risk_control_contact_a
  meaning: 风控对接人A，存运营人员 ID
  evidence: code
- table: tenant_project
  field: risk_control_contact_b
  meaning: 风控对接人B，存 JSON 数组字符串
  evidence: code
- table: tenant_project
  field: risk_control_contact_a_group
  meaning: 风控组别
  evidence: code
- table: tenant_project
  field: solution_manager
  meaning: 方案经理
  evidence: code
- table: tenant_project
  field: business_manager
  meaning: 业务经理
  evidence: code
- table: tenant_project
  field: business_group
  meaning: 关联业务部门
  evidence: code
- table: tenant_project
  field: custom_field_one
  meaning: 自定义字段一，导入限制 500 字
  evidence: code
- table: tenant_project
  field: custom_field_two
  meaning: 自定义字段二，导入限制 500 字
  evidence: code
- table: tenant_project
  field: custom_field_three
  meaning: 自定义字段三，导入限制 500 字
  evidence: code
- table: tenant_project
  field: bussiness_project_relation
  meaning: 运营项目归属，导入限制 50 字
  evidence: code
- table: tenant_project
  field: wechat_audit_no
  meaning: 企微审批编号/立项审批编号，审批提交可回填
  evidence: code
- table: tenant_project
  field: wechat_audit_pass_time
  meaning: 项目立项审批通过时间
  evidence: code
- table: tenant_project
  field: config_json
  meaning: 项目配置 JSON，信用证生效前校验其中项目配置状态
  evidence: code
- table: tenant_project
  field: project_config_version
  meaning: 项目配置版本，生效项目查询按版本过滤
  evidence: code
- table: tenant_project
  field: product_id
  meaning: 关联 tenant_product.id
  evidence: code
- table: tenant_project
  field: tenant_id
  meaning: 租户 id
  evidence: code
- table: tenant_project
  field: ref_tenant_project_product_code
  meaning: 关联租户产品 code，创建、失效、有效项目查询使用
  evidence: code
- table: tenant_project
  field: ref_tenant_project_tenant_code
  meaning: 关联租户 code，创建时查租户信息
  evidence: code
- table: tenant_project
  field: ref_tenant_project_platform_product
  meaning: 关联平台产品 code，导出产品类型、有效项目查询使用
  evidence: code
- table: tenant_project
  field: platform_product_code
  meaning: 平台产品 code，审批与项目推送中使用
  evidence: code
- table: tenant_project
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: code
- table: tenant_project
  field: app_tenant_code
  meaning: 逻辑租户标识
  evidence: code
- table: cust_project_rel
  field: project_id
  meaning: 项目 id，String 类型，对应 tenant_project.id
  evidence: code
- table: cust_project_rel
  field: product_id
  meaning: 租户产品 id，对应 tenant_product.id
  evidence: code
- table: cust_project_rel
  field: company_type
  meaning: 企业在该项目下的角色，如 CORE/FINANCE
  evidence: code
- table: cust_project_rel
  field: ref_cust_project_rel_cust_company_info
  meaning: 企业编码，关联 cust_company_info.code
  evidence: code
- table: cust_project_rel
  field: op_contact_a
  meaning: 项目企业关联维度的运营对接人A
  evidence: code
- table: cust_project_rel
  field: op_contact_b
  meaning: 项目企业关联维度的运营对接人B
  evidence: code
- table: cust_project_rel
  field: op_contact_a_group
  meaning: 项目企业关联维度的运营组别
  evidence: code
- table: cust_project_rel
  field: verification_contact
  meaning: 项目企业关联维度的查验对接人
  evidence: code
- table: cust_project_rel
  field: risk_control_contact_a
  meaning: 项目企业关联维度的风控对接人A
  evidence: code
- table: cust_project_rel
  field: risk_control_contact_b
  meaning: 项目企业关联维度的风控对接人B
  evidence: code
- table: cust_project_rel
  field: enable
  meaning: 逻辑有效标记，查询导出时用 enable='Y'
  evidence: code
- table: tenant_interworking_product
  field: id
  meaning: 租户互通产品主键
  evidence: db
- table: tenant_interworking_product
  field: open_status
  meaning: 租户互通产品开通状态，代码写值使用 ProductOpenStatusEnum
  evidence: code
- table: tenant_interworking_product
  field: platform_product_code
  meaning: 平台产品 code
  evidence: db
- table: tenant_interworking_product
  field: tenant_id
  meaning: 租户 id
  evidence: db
- table: cust_interworking_product
  field: open_status
  meaning: 客户互通产品开通状态，DB 实测 OPENED，代码使用 CustProductActiveConstant.OPENED/OPENING/NOT_OPENED
  evidence: db
state_machines:
- name: 租户产品开通状态
  field: tenant_product.open_status
  states:
  - value: N
    label: 未开通
    source: db_dist
  - value: P
    label: 开通中
    source: code_enum
  - value: Y
    label: 已开通
    source: db_dist
  transitions:
  - from: N
    event: 开通ACFLOW/ORDER多级产品
    to: P
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:334
  - from: P
    event: 多级回调后置成功
    to: Y
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
  - from: N
    event: 非多级产品直接生效
    to: Y
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
  - from: Y
    event: 取消开通产品
    to: N
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:cancel
- name: 租户项目状态
  field: tenant_project.project_status
  states:
  - value: '0'
    label: 待生效
    source: code_enum
  - value: '1'
    label: 已生效
    source: code_enum
  - value: '2'
    label: 已失效
    source: code_enum
  transitions:
  - from: '0'
    event: 项目生效
    to: '1'
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:effective
  - from: '1'
    event: 项目失效
    to: '2'
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:invalid
  - from: '1'
    event: 上线审批终态通过
    to: '1'
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:effectiveProjectOnApprovalFinished
  - from: '2'
    event: 上线审批终态通过重新生效
    to: '1'
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:effectiveProjectOnApprovalFinished
  - from: '1'
    event: 非新增项目正式发起上线审批
    to: '2'
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:663
- name: 项目上线审批工作流状态
  field: tenant_project_approval.wf_status
  states:
  - value: PENDING
    label: 待发起
    source: code_enum
  - value: RUNNING
    label: 审批中
    source: code_enum
  - value: FINISHED
    label: 已完成
    source: code_enum
  - value: TERMINATED
    label: 已终止
    source: code_enum
  transitions:
  - from: PENDING
    event: 正式提交并启动工作流
    to: RUNNING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:startWorkflowAndUpdateStatus
  - from: PENDING
    event: 暂存
    to: PENDING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:submit
  - from: RUNNING
    event: 审批完成
    to: FINISHED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus
  - from: RUNNING
    event: 审批终止
    to: TERMINATED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus
- name: 客户互通产品开通状态
  field: cust_interworking_product.open_status
  states:
  - value: NOT_OPENED
    label: 未开通
    source: code_enum
  - value: OPENING
    label: 开通中：带客户确认 forams
    source: code_enum
  - value: OPENED
    label: 已开通
    source: db_dist
  transitions: []
calibers:
- name: 租户产品已开通
  predicate: tenant_product.open_status = 'Y'
  scope: tenant_product
  evidence: db+code:ProductOpenStatusEnum.Y 与 DB 分布 Y
- name: 租户产品开通中
  predicate: tenant_product.open_status = 'P'
  scope: tenant_product
  evidence: db+code:ProductOpenStatusEnum.P 与 DB 分布 P
- name: 租户产品未开通
  predicate: tenant_product.open_status = 'N'
  scope: tenant_product
  evidence: db+code:ProductOpenStatusEnum.N 与 DB 分布 N
- name: 有效租户产品
  predicate: tenant_product.enable = 'Y'
  scope: tenant_product
  evidence: db:enable 全为 Y
- name: 项目已生效
  predicate: tenant_project.project_status = '1'
  scope: tenant_project
  evidence: code:ProjectStatusEnum.EFFECTIVE; ProjectReportApplication 按 1 转已生效
- name: 项目待生效
  predicate: tenant_project.project_status = '0'
  scope: tenant_project
  evidence: code:ProjectStatusEnum.TO_BE_EFFECTIVE
- name: 项目已失效
  predicate: tenant_project.project_status = '2'
  scope: tenant_project
  evidence: code:ProjectStatusEnum.INVLIAD
- name: 有效项目
  predicate: tenant_project.enable = 'Y'
  scope: tenant_project
  evidence: code:exportProjectInfo/updateProjectData 均按 enable='Y' 查询
- name: 项目生产数据
  predicate: tenant_project.is_prd = 'Y'
  scope: tenant_project
  evidence: code:导出判断 Y 为是，N 为否
- name: 有效项目企业关联
  predicate: cust_project_rel.enable = 'Y'
  scope: cust_project_rel
  evidence: code:queryRelatedCompanies 按 enable='Y' 查询
- name: 核心企业角色
  predicate: cust_project_rel.company_type = 'CORE'
  scope: cust_project_rel
  evidence: code:CustCompanyTypeEnum.CORE，导出关联企业时过滤 CORE/FINANCE
- name: 金融机构角色
  predicate: cust_project_rel.company_type = 'FINANCE'
  scope: cust_project_rel
  evidence: code:CustCompanyTypeEnum.FINANCE，导出关联企业时过滤 CORE/FINANCE
- name: 租户互通产品已开通
  predicate: tenant_interworking_product.open_status = 'Y'
  scope: tenant_interworking_product
  evidence: code:ProductOpenStatusEnum 写值绑定
- name: 客户互通产品已开通
  predicate: cust_interworking_product.open_status = 'OPENED'
  scope: cust_interworking_product
  evidence: db:CustProductActiveConstant.OPENED；DB 分布 OPENED
- name: 平台互通产品类型
  predicate: platform_product.product_type = 'INTERWORKING'
  scope: platform_product
  evidence: code:PlatformProductTypeEnum.INTERWORKING 用于互通产品查询
- name: 平台通用产品类型
  predicate: platform_product.product_type = 'GENERAL'
  scope: platform_product
  evidence: code:PlatformProductTypeEnum.GENERAL 用于通用产品查询
- name: 项目标签生产项目
  predicate: tenant_project.project_tag = '生产项目'
  scope: tenant_project
  evidence: code:convertProjectTagFromChinese 校验可选值
- name: 项目标签测试项目
  predicate: tenant_project.project_tag = '测试项目'
  scope: tenant_project
  evidence: code:convertProjectTagFromChinese 校验可选值
- name: 项目标签暂停项目
  predicate: tenant_project.project_tag = '暂停项目'
  scope: tenant_project
  evidence: code:convertProjectTagFromChinese 校验可选值
- name: 上线审批中
  predicate: tenant_project_approval.wf_status = 'RUNNING'
  scope: tenant_project_approval
  evidence: code:ProjectBusinessConfigApplication 只处理 RUNNING
term_bridges:
- term: 租户产品
  aliases:
  - tenant_product
  - 租户产品配置
  maps_to: tenant_product
  also_confused_with:
  - tenant_interworking_product
  - cust_interworking_product
  adjudication: boundary
  boundary: tenant_product 是租户级通用产品开通表；tenant_interworking_product/cust_interworking_product
    是互通产品线，产品查询扩展点 scenario=INTERWORKING/GENERAL 区分。
- term: 互通产品
  aliases:
  - 互联互通产品
  - tenant_interworking_product
  - cust_interworking_product
  maps_to: tenant_interworking_product
  also_confused_with:
  - tenant_product
  adjudication: boundary
  boundary: 互通产品通过 TenantInterworkingProductApplication/CustInterworkingProductApplication
    查询；租户产品通过 TenantProductApplication/CustGeneralProductApplication 查询。
- term: 租户项目
  aliases:
  - tenant_project
  - 项目运营配置
  maps_to: tenant_project
  also_confused_with:
  - cust_project_rel
  adjudication: boundary
  boundary: tenant_project 是项目主表；cust_project_rel 是项目与企业关联表，导出分两个 sheet。
- term: 项目企业关联
  aliases:
  - cust_project_rel
  - 项目关联企业
  maps_to: cust_project_rel
  also_confused_with:
  - tenant_project
  adjudication: boundary
  boundary: cust_project_rel 承载项目+企业+角色关系，project_id 为 String 指向 tenant_project.id。
- term: 产品开通状态
  aliases:
  - open_status
  - productOpenStatus
  maps_to: tenant_product.open_status
  also_confused_with:
  - cust_interworking_product.open_status
  - tenant_interworking_product.open_status
  adjudication: boundary
  boundary: tenant_product.open_status 使用 N/P/Y；cust_interworking_product.open_status
    使用 NOT_OPENED/OPENING/OPENED；tenant_interworking_product.open_status 代码绑定 ProductOpenStatusEnum。
- term: 项目状态
  aliases:
  - project_status
  maps_to: tenant_project.project_status
  also_confused_with:
  - tenant_project_approval.wf_status
  adjudication: boundary
  boundary: project_status 是项目生命周期 0/1/2；wf_status 是上线审批工作流状态 PENDING/RUNNING/FINISHED/TERMINATED。
- term: 项目码
  aliases:
  - channel_code
  - project_code
  maps_to: tenant_project.channel_code
  also_confused_with:
  - tenant_project.project_code
  adjudication: boundary
  boundary: 代码 queryByChannelCode 使用 channel_code；导出另有 project_code 查询条件，二者并存但项目码生成走
    initChannelCode。
- term: 运营对接人A
  aliases:
  - op_contact_a
  maps_to: tenant_project.op_contact_a
  also_confused_with:
  - cust_project_rel.op_contact_a
  adjudication: boundary
  boundary: tenant_project 是项目级字段；cust_project_rel 是项目企业关联级字段，导出时分别落到不同 sheet。
- term: 运营对接人B
  aliases:
  - op_contact_b
  maps_to: tenant_project.op_contact_b
  also_confused_with:
  - cust_project_rel.op_contact_b
  adjudication: boundary
  boundary: tenant_project 与 cust_project_rel 同名字段，代码存在 JSON 数组与展示姓名转换逻辑。
- term: 运营组别
  aliases:
  - op_contact_a_group
  - verification_contact_group
  - risk_control_contact_a_group
  maps_to: tenant_project.op_contact_a_group
  also_confused_with:
  - cust_project_rel.op_contact_a_group
  adjudication: boundary
  boundary: 组别字段跟随对应联系人，导入更新联系人时同步更新组别，为空则置空。
- term: 项目标签
  aliases:
  - project_tag
  maps_to: tenant_project.project_tag
  also_confused_with: []
  adjudication: synonym
  boundary: 导入校验可选值生产项目/测试项目/暂停项目，存储为枚举值。
- term: 运营项目归属
  aliases:
  - bussiness_project_relation
  maps_to: tenant_project.bussiness_project_relation
  also_confused_with: []
  adjudication: synonym
  boundary: 注意拼写为 bussiness 而非 business。
- term: 产品类型
  aliases:
  - product_cate
  maps_to: tenant_product.product_cate
  also_confused_with:
  - platform_product.product_type
  adjudication: boundary
  boundary: tenant_product.product_cate 为 STRONG/WEAKLY/CREDIT；platform_product.product_type
    为 GENERAL/INTERWORKING 等平台产品线维度。
- term: 平台产品
  aliases:
  - platform_product
  - platformProductCode
  maps_to: tenant_product.platform_product_code
  also_confused_with:
  - tenant_product.ref_tenant_product_project_code
  adjudication: boundary
  boundary: platform_product_code 存产品业务 code；ref_tenant_product_project_code 是租户产品到平台产品的关联
    code。
rules:
- name: 租户项目创建前置校验
  content: 创建项目时校验租户存在、租户产品已开通，再写 tenant_project 并推送 PROJECT_SYNC/CREATED 事件。
  impact: 租户或租户产品不存在时项目创建失败。
  field_targets:
  - tenant_project.ref_tenant_project_tenant_code
  - tenant_project.ref_tenant_project_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:create
- name: 租户项目复制
  content: 复制项目时按 id 查原项目，再按 refTenantProjectProductCode 查租户产品，推送 PROJECT_SYNC/COPY
    事件。
  impact: 项目复制依赖原项目和租户产品存在。
  field_targets:
  - tenant_project.id
  - tenant_project.ref_tenant_project_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:copy
- name: 租户项目变更
  content: 变更调用 tenantProjectDomainService.change，成功后推送 PROJECT_SYNC/CHANGED，reason
    固定为“变更名字”。
  impact: 项目名称类变更触发下游同步。
  field_targets:
  - tenant_project.name
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:change
- name: 项目生效规则
  content: 生效时若平台产品为 BEECREDIT，则 config_json 中每个项目配置 statusDictKey 必须为 EFFECTIVE 或
    Y，否则阻断；非 BEECREDIT 推送 EFFECTED；ACFLOW/RVSFACTOR 会在 configJson 为空时查询项目配置并开户。
  impact: 信用证项目配置不完整不能生效；交e保产品生效触发开户。
  field_targets:
  - tenant_project.project_status
  - tenant_project.config_json
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:effective
- name: 项目失效规则
  content: 失效调用 tenantProjectDomainService.invalid，并推送 PROJECT_SYNC/INVALID。
  impact: 项目状态变更为已失效并同步下游。
  field_targets:
  - tenant_project.project_status
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:invalid
- name: 项目删除规则
  content: 删除调用 tenantProjectDomainService.delete，并推送 PROJECT_SYNC/DELETED，应为逻辑删除
    enable=N。
  impact: 项目逻辑删除并同步下游。
  field_targets:
  - tenant_project.enable
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:delete
- name: 创建项目初始上线审批
  content: isAdd=Y、项目上线审批挡板开启、平台产品为 ACFLOW/RVSFACTOR/ORDER 时，创建初始审批记录；否则跳过。
  impact: 仅指定产品的新增项目自动生成待发起上线审批。
  field_targets:
  - tenant_project.id
  - tenant_project.platform_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:tryCreateInitialApprovalOnProjectCreate
- name: 审批回填立项编号
  content: 新增项目首次正式提交时，若 isAdd=Y、非重新发起、wechat_audit_no 为空，则将 spNo 回写 tenant_project.wechat_audit_no
    并推送 EFFECTED。
  impact: 项目立项审批编号自动回填并同步业务系统。
  field_targets:
  - tenant_project.wechat_audit_no
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:backfillProjectSpNoOnSubmit
- name: 上线审批完成置项目生效
  content: 审批工作流 FINISHED 后调用 tenantProjectApplication.effective，将项目置为已生效。
  impact: 审批通过与项目生效联动。
  field_targets:
  - tenant_project.project_status
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:effectiveProjectOnApprovalFinished
- name: 企业角色组合校验
  content: 同一企业在同一平台产品下已有角色集合加上当前角色，若角色数大于1且组合不在 platform_product.cust_role_combine
    允许集合中，则抛异常或移除该产品。
  impact: 防止同一企业同一产品多角色诈骗。
  field_targets:
  - cust_project_rel.company_type
  - platform_product.cust_role_combine
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:checkCustRoleCombine
- name: 租户产品多级开通回调
  content: activeAndNotify 若已是 Y 直接返回；先推送租户事件；ACFLOW/ORDER 先置 P 等待多级回调，其他产品直接 domainService.active
    置 Y 并推送 PRODUCT_SYNC/EFFECTED。
  impact: 多级产品开通状态先开通中再已开通。
  field_targets:
  - tenant_product.open_status
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:334
- name: 取消租户产品
  content: cancel 调用 domainService.cancel 后推送 PRODUCT_SYNC/INVALID，注释说明关联项目后不允许取消。
  impact: 取消开通产品触发下游失效同步。
  field_targets:
  - tenant_product.open_status
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:cancel
- name: 项目导出有效数据
  content: exportProjectInfo 只查询 enable='Y'，按 update_time 降序，每页 500 循环导出；第一个 sheet
    为项目运营配置，第二个 sheet 为关联企业。
  impact: 导出结果不含逻辑删除项目。
  field_targets:
  - tenant_project.enable
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:exportProjectInfo
- name: 项目导入校验
  content: 项目 ID 必填、在导入列表内唯一、在库存在且 enable=Y；对接人姓名必须在运营人员列表；自定义字段一/二/三 ≤500 字，运营项目归属
    ≤50 字，项目标签只允许生产项目/测试项目/暂停项目。
  impact: 非法行不入库并回写错误行。
  field_targets:
  - tenant_project.id
  - tenant_project.op_contact_a
  - tenant_project.project_tag
  - tenant_project.custom_field_one
  - tenant_project.bussiness_project_relation
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:validateProjectData
- name: 项目运营配置导入更新
  content: updateProjectData 将姓名转 ID 写入 tenant_project，运营对接人A/查验对接人/风控对接人A 为空时同步清空组别，否则按运营人员组别回写。
  impact: 导入更新联系人及组别。
  field_targets:
  - tenant_project.op_contact_a
  - tenant_project.op_contact_a_group
  - tenant_project.verification_contact
  - tenant_project.risk_control_contact_a
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:updateProjectData
- name: 业务系统推送项目配置落库条件
  content: savePush 先校验来源系统与项目平台产品匹配；仅当项目存在 wf_status=RUNNING 的最新上线审批且当前节点为 PROJECT_MANAGER
    或 PROJECT_CONFIG 时落库更新，否则跳过或丢弃。
  impact: 非方案经理/方案配置节点推送不更新配置。
  field_targets:
  - tenant_project_approval_business_info.source_system
  - tenant_project_approval.wf_status
  - tenant_project_approval_flow.node_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectBusinessConfigApplication.java:savePush
