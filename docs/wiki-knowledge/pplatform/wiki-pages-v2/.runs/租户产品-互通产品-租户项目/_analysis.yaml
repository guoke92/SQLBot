field_semantics:
- table: tenant_product
  field: open_status
  meaning: 租户产品开通状态；DB 实测值为 N/P/Y，N 未开通，P 开通中/等待多级回调，Y 已开通；代码 ProductOpenStatusEnum
    使用 Y/P
  evidence: db
- table: tenant_product
  field: platform_product_code
  meaning: 平台产品编号；DB 实测 ACFLOW/BEECREDIT/DRAFT/DRAFTQA/ORDER/RVSFACTOR_PC/STORAGE/VOUCHER；代码
    ProductCodeEnum 使用 ACFLOW/BEECREDIT/ORDER/RVSFACTOR_PC 等
  evidence: db
- table: tenant_product
  field: product_cate
  meaning: 产品类型；DB 实测 CREDIT/STRONG/WEAKLY
  evidence: db
- table: tenant_product
  field: is_migratory
  meaning: 是否迁移标识；DB 实测 Y/N，注释 N 未迁移、Y 已迁移
  evidence: db
- table: tenant_product
  field: max_financing_amount_flag
  meaning: 是否限额融资资金上线；DB 实测 Y/N/0/1 混合值，N 为不限额，Y 为限额
  evidence: db
- table: tenant_product
  field: max_financing_amount
  meaning: 融资金额上限；DB 实测 0/88888888/不限 等
  evidence: db
- table: tenant_product
  field: max_financing_period
  meaning: 融资期限上限；DB 实测 12/36/6/12个月/36个月/6个月/6-12个月/0
  evidence: db
- table: tenant_product
  field: multiple
  meaning: 是否多个；DB 实测均为 0
  evidence: db
- table: tenant_product
  field: name
  meaning: 租户产品名称；DB 实测供票、保理易融、融易单、应收易融、票据易融、国内信用证等
  evidence: db
- table: tenant_product
  field: enable
  meaning: 启用标记；DB 实测均为 Y
  evidence: db
- table: tenant_product
  field: tenant_id
  meaning: 租户 id；与 platform_product_id 组成唯一键 tenant_product_id
  evidence: db
- table: tenant_product
  field: platform_product_id
  meaning: 平台产品 id；普通索引，与 tenant_id 唯一
  evidence: db
- table: tenant_product
  field: ref_tenant_product_project_code
  meaning: 租户产品-平台产品关联编码；DB 有多个业务 code 分布
  evidence: db
- table: tenant_product
  field: ref_tenant_product_tenant_setting_config
  meaning: 租户-产品关联配置；普通索引
  evidence: db
- table: tenant_product_menu
  field: product_code
  meaning: 产品 code；DB 实测 ACCOUNT_PRODUCT/BEECREDIT/RVSFACTOR_PC
  evidence: db
- table: tenant_product_menu
  field: company_type
  meaning: 企业角色；DB 实测 CORE/CORE_MANAGER/CORPORATION_COMPANY/DEALER/FINANCE/PLATFORM_OPERATOR/PLATFORM_OPERATOR_COMPANY/PROJECT_COMPANY/SUPPLIER
  evidence: db
- table: tenant_product_menu
  field: menu_id
  meaning: 菜单 id；关联产品菜单
  evidence: db
- table: tenant_product_menu
  field: enable
  meaning: 启用标记；DB 实测均为 Y
  evidence: db
- table: tenant_product_menu_res
  field: product_code
  meaning: 产品 code；DB 实测 ACCOUNT_PRODUCT/RVSFACTOR_PC
  evidence: db
- table: tenant_product_menu_res
  field: company_type
  meaning: 企业角色；DB 实测 CORE/CORPORATION_COMPANY/PLATFORM_OPERATOR_COMPANY/SUPPLIER
  evidence: db
- table: tenant_product_menu_res
  field: db_tenant_code
  meaning: 数据租户标识；DB 实测 LN1/beehive-scf.qhhrly.cn/ning
  evidence: db
- table: tenant_product_menu_res
  field: enable
  meaning: 启用标记；DB 实测均为 Y
  evidence: db
- table: tenant_interworking_product
  field: app_tenant_code
  meaning: 逻辑租户标识；DB 实测 GREENTOWNAT/JHYL/base/hylg
  evidence: db
- table: tenant_interworking_product
  field: db_tenant_code
  meaning: 数据租户标识；DB 实测 ISOLATE_TAG_*/LN1/beehive-scf.qhhrly.cn/mengniu/yunyingzhongtai
  evidence: db
- table: tenant_interworking_product
  field: credit_measures
  meaning: 增信措施；DB 实测 HTCP15/ddd/共同债务人增信、差额补足
  evidence: db
- table: tenant_interworking_product
  field: customer_group
  meaning: 客户群体；DB 实测 HTCP15/sdsd/供应商/拥有优质资产并存在融资需求的企业或机构/金融机构/项目公司
  evidence: db
- table: tenant_interworking_product
  field: max_financing_amount_flag
  meaning: 是否限额融资资金上线；DB 实测 N/Y
  evidence: db
- table: tenant_interworking_product
  field: max_financing_period
  meaning: 融资期限上限；DB 实测 1-3年 等
  evidence: db
- table: tenant_interworking_product
  field: enable
  meaning: 启用标记；DB 实测均为 Y
  evidence: db
- table: cust_interworking_product
  field: open_status
  meaning: 客户互通产品开通状态；DB 对账值 OPENED，代码侧常量 CustProductActiveConstant.OPENED 未在代码枚举基线上覆盖该表值
  evidence: db
- table: tenant_project
  field: project_status
  meaning: 项目状态；代码使用 ProjectStatusEnum.EFFECTIVE 与 ProjectStatusEnum.INVLIAD，分别表示已生效、已失效
  evidence: code
- table: tenant_project
  field: enable
  meaning: 逻辑删除/有效标记；代码查询与导出普遍限定 enable='Y'，删除操作调用 domainService.delete
  evidence: code
- table: tenant_project
  field: source
  meaning: 项目来源/渠道；DB 对账实测 ACFLOW/ORDER/RVSFACTOR_PC/STORAGE/pplatform，代码未见完整枚举声明
  evidence: db
- table: tenant_project
  field: platform_product_code
  meaning: 平台产品编号；项目所属平台产品
  evidence: code
- table: tenant_project
  field: ref_tenant_project_product_code
  meaning: 关联租户产品 code；用于按产品查询、生效、失效、同步
  evidence: code
- table: tenant_project
  field: ref_tenant_project_tenant_code
  meaning: 关联租户 code；创建项目时校验租户存在
  evidence: code
- table: tenant_project
  field: ref_tenant_project_platform_product
  meaning: 关联平台产品 code；导出时用于查平台产品名称
  evidence: code
- table: tenant_project
  field: config_json
  meaning: 项目配置 JSON；BEECREDIT 生效前解析校验配置状态，ACFLOW/RVSFACTOR 生效时用于开户/查询业务系统配置
  evidence: code
- table: tenant_project
  field: channel_code
  meaning: 项目码/渠道码；queryByChannelCode 可按渠道码查项目
  evidence: code
- table: tenant_project
  field: is_prd
  meaning: 是否生产数据；代码导出时 Y 转“是”、N 转“否”
  evidence: code
- table: tenant_project
  field: wechat_audit_no
  meaning: 企微审批编号/立项审批编号；可由上线审批提交时回填
  evidence: code
- table: tenant_project
  field: op_contact_a
  meaning: 运营对接人A；导入导出时按运营人员姓名/ID 转换
  evidence: code
- table: tenant_project
  field: op_contact_b
  meaning: 运营对接人B；数据库以 JSON 数组字符串存储，DTO 转为 List<String>
  evidence: code
- table: tenant_project
  field: op_contact_a_group
  meaning: 运营组别；导入时按运营对接人A的组别刷新
  evidence: code
- table: tenant_project
  field: verification_contact
  meaning: 查验对接人；导入导出时按运营人员姓名/ID 转换
  evidence: code
- table: tenant_project
  field: risk_control_contact_a
  meaning: 风控对接人A；导入导出时按运营人员姓名/ID 转换
  evidence: code
- table: tenant_project
  field: risk_control_contact_b
  meaning: 风控对接人B；数据库以 JSON 数组字符串存储，DTO 转为 List<String>
  evidence: code
- table: tenant_project
  field: solution_manager
  meaning: 方案经理；可由洞察平台补全，导入时校验运营人员存在
  evidence: code
- table: tenant_project
  field: business_group
  meaning: 关联业务部门；可由洞察平台补全
  evidence: code
- table: tenant_project
  field: project_tag
  meaning: 项目标签；中文可选生产项目、测试项目、暂停项目，入库转枚举值
  evidence: code
- table: tenant_project
  field: bussiness_project_relation
  meaning: 运营项目归属；导入长度限制不超过 50
  evidence: code
- table: tenant_project
  field: invite_customer_service_words
  meaning: 邀请信息-客服话术；导入时长度限制不超过 500
  evidence: code
- table: tenant_project
  field: project_approval_id
  meaning: 项目最新上线审批 ID；创建审批后回写项目
  evidence: code
state_machines:
- name: 租户产品开通状态
  field: tenant_product.open_status
  states:
  - value: N
    label: 未开通/默认
    source: db_dist
  - value: P
    label: 开通中/等待多级回调
    source: code_enum
  - value: Y
    label: 已开通
    source: code_enum
  transitions:
  - from: N
    event: activeAndNotify 非 ACFLOW/ORDER 产品主动开通
    to: Y
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
  - from: N
    event: activeAndNotify 产品为 ACFLOW/ORDER，先置为开通中等待多级回调
    to: P
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
  - from: Y
    event: activeAndNotify 幂等命中已开通直接返回
    to: Y
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
- name: 租户项目状态
  field: tenant_project.project_status
  states:
  - value: EFFECTIVE
    label: 已生效
    source: code_enum
  - value: INVLIAD
    label: 已失效
    source: code_enum
  transitions:
  - from: 未生效
    event: effective 生效项目
    to: EFFECTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:effective
  - from: EFFECTIVE
    event: invalid 失效项目
    to: INVLIAD
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:invalid
  - from: INVLIAD
    event: 上线审批完成通过后 effectiveProjectOnApprovalFinished 调 effective
    to: EFFECTIVE
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:effectiveProjectOnApprovalFinished
- name: 项目上线审批工作流状态
  field: tenant_project_approval.wf_status
  states:
  - value: PENDING
    label: 待发起/待审批
    source: code_enum
  - value: RUNNING
    label: 审批中
    source: code_enum
  - value: FINISHED
    label: 已完成
    source: code_enum
  - value: TERMINATED
    label: 已终止
    source: code_enum
  transitions:
  - from: PENDING
    event: startWorkflowAndUpdateStatus 启动工作流
    to: RUNNING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:startWorkflowAndUpdateStatus
  - from: RUNNING
    event: handleFlowAndNodeStatus 判断为 FINISHED
    to: FINISHED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus
  - from: RUNNING
    event: handleFlowAndNodeStatus 判断为 TERMINATED
    to: TERMINATED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus
  - from: PENDING
    event: submit 暂存 isDraft=Y
    to: PENDING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:submit
  - from: FINISHED/TERMINATED
    event: createApproval/doCreateApproval 复制新审批记录置 PENDING
    to: PENDING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:doCreateApproval
- name: 项目上线审批节点状态
  field: tenant_project_approval_flow.node_status
  states:
  - value: PENDING
    label: 待处理
    source: code_enum
  - value: APPROVING
    label: 审批中
    source: code_enum
  - value: APPROVED
    label: 已通过
    source: code_enum
  transitions:
  - from: PENDING
    event: handleFlowAndNodeStatus 写入节点状态
    to: APPROVING
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus
  - from: APPROVING
    event: 业务经理节点通过且 is_back_agreement=Y 触发后补合作协议判断
    to: APPROVED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:isStartBackAgreement
- name: 客户互通产品开通状态
  field: cust_interworking_product.open_status
  states:
  - value: OPENED
    label: 已开通
    source: db_dist
  - value: OPENING
    label: 开通中
    source: code_enum
  transitions:
  - from: 未开通
    event: TenantInterworkingProductApplication.active 开通互通产品
    to: OPENED
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantInterworkingProductApplication.java:active
  - from: OPENED
    event: TenantInterworkingProductApplication.cancel 取消开通，关联项目后不允许取消
    to: 未开通
    evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantInterworkingProductApplication.java:cancel
calibers:
- name: 租户产品已开通
  predicate: tenant_product.open_status = 'Y'
  scope: 租户产品开通状态口径；代码 CustProductApplication 与 GotoProductApplication 使用 OPENED/Y
    判断已开通
  evidence: db_dist:tenant_product.open_status=Y:397；code_path:TenantProductApplication.java:activeAndNotify
- name: 租户产品开通中
  predicate: tenant_product.open_status = 'P'
  scope: ACFLOW/ORDER 多级产品开通中间态
  evidence: db_dist:tenant_product.open_status=P:28；code_path:TenantProductApplication.java:activeAndNotify
- name: 租户产品未开通
  predicate: tenant_product.open_status = 'N'
  scope: 默认未开通状态
  evidence: db_dist:tenant_product.open_status=N:75；tenant_product.open_status default
    N
- name: 租户产品有效
  predicate: tenant_product.enable = 'Y'
  scope: 启用中的租户产品
  evidence: db_dist:tenant_product.enable 全为 Y
- name: ACFLOW 租户产品
  predicate: tenant_product.platform_product_code = 'ACFLOW'
  scope: ACFLOW 产品口径；生效时可能触发交e保开户，跨租户查询项目
  evidence: db_dist:ACFLOW:231；code_path:TenantProjectApplication.java:effective/listEffectiveProjects
- name: ORDER 租户产品
  predicate: tenant_product.platform_product_code = 'ORDER'
  scope: ORDER 产品口径；activeAndNotify 置于 P 等待多级回调
  evidence: db_dist:ORDER:75；code_path:TenantProductApplication.java:activeAndNotify
- name: RVSFACTOR_PC 租户产品
  predicate: tenant_product.platform_product_code = 'RVSFACTOR_PC'
  scope: RVSFACTOR_PC 产品口径；生效时可能触发交e保开户
  evidence: db_dist:RVSFACTOR_PC:108；code_path:TenantProjectApplication.java:effective
- name: 客户互通产品已开通
  predicate: cust_interworking_product.open_status = 'OPENED'
  scope: 客户互通产品开通口径；代码常量 CustProductActiveConstant.OPENED
  evidence: db_dist:OPENED:304；code_path:CustInterworkingProductApplication.java:listOpenProduct
- name: 租户项目有效
  predicate: tenant_project.enable = 'Y'
  scope: 项目有效/未删除口径；导出、审批、查询大量使用
  evidence: code_path:TenantProjectApplication.java:exportProjectInfo；ProjectApprovalApplication.java:listApprovalSelectableProjects
- name: 租户项目已生效
  predicate: tenant_project.project_status = ProjectStatusEnum.EFFECTIVE.getDictKey()
  scope: 已生效项目；上线审批选择项目允许 EFFECTIVE/INVLIAD
  evidence: code_path:ProjectApprovalApplication.java:listApprovalSelectableProjects；TenantProjectApplication.java:effective
- name: 租户项目已失效
  predicate: tenant_project.project_status = ProjectStatusEnum.INVLIAD.getDictKey()
  scope: 已失效项目；上线审批选择项目允许 EFFECTIVE/INVLIAD
  evidence: code_path:ProjectApprovalApplication.java:listApprovalSelectableProjects；TenantProjectApplication.java:invalid
- name: 项目关联企业有效
  predicate: cust_project_rel.enable = 'Y'
  scope: 项目-企业关联有效口径
  evidence: code_path:TenantProjectApplication.java:queryRelatedCompanies；ProjectReportApplication.java:getCompaniesByProjectId
- name: 项目导出关联企业范围
  predicate: cust_project_rel.company_type IN ('CORE','FINANCE') AND cust_project_rel.enable
    = 'Y'
  scope: 项目运营配置导出 Sheet2 只导出核心企业和金融机构
  evidence: code_path:TenantProjectApplication.java:queryRelatedCompanies
- name: 平台产品角色组合配置
  predicate: PlatformProductDO.custRoleCombine IS NOT NULL AND custRoleCombine !=
    ''
  scope: 角色组合校验只处理配置了 cust_role_combine 的平台产品
  evidence: code_path:TenantProductApplication.java:checkCustRoleCombine
- name: 产品菜单启用
  predicate: tenant_product_menu.enable = 'Y'
  scope: 租户产品菜单启用口径
  evidence: db_dist:tenant_product_menu.enable 全为 Y
- name: 产品菜单资源启用
  predicate: tenant_product_menu_res.enable = 'Y'
  scope: 租户产品菜单资源启用口径
  evidence: db_dist:tenant_product_menu_res.enable 全为 Y
- name: 我的产品口径
  predicate: CustProductDTO.openStatus IN (CustProductActiveConstant.OPENED, CustProductActiveConstant.OPENING)
  scope: listMyProduct 返回企业已开通和开通中的产品
  evidence: code_path:CustGeneralProductApplication.java:listMyProduct；CustInterworkingProductApplication.java:listMyProduct
term_bridges:
- term: 租户产品
  aliases:
  - tenantProduct
  - tenant_product
  maps_to: tenant_product：租户维度开通/配置的产品实例
  also_confused_with:
  - 平台产品 platform_product
  - 客户产品 cust_product
  adjudication: boundary
  boundary: 租户产品是租户开通的产品实例；平台产品是全局产品定义；客户产品是企业维度开通授权，三者不可混用
- term: 平台产品
  aliases:
  - platformProduct
  - platform_product
  - platform_product_code
  maps_to: platform_product：平台级产品定义，如 ACFLOW/BEECREDIT/ORDER/RVSFACTOR_PC
  also_confused_with:
  - 租户产品
  adjudication: boundary
  boundary: 平台产品用 productCode 标识，租户产品用 tenant_id + platform_product_id 唯一
- term: 互通产品
  aliases:
  - INTERWORKING
  - tenant_interworking_product
  - cust_interworking_product
  maps_to: 互通产品查询/开通场景，PlatformProductTypeEnum.INTERWORKING
  also_confused_with:
  - 通用产品 GENERAL
  adjudication: boundary
  boundary: 互通产品与通用产品通过 PlatformProductTypeEnum 区分，扩展点场景为 INTERWORKING
- term: 租户项目
  aliases:
  - tenantProject
  - tenant_project
  maps_to: tenant_project：租户下项目实体
  also_confused_with:
  - 客户项目关联 CustProjectRelDO
  - 项目上线审批 TenantProjectApprovalDO
  adjudication: boundary
  boundary: tenant_project 是项目主数据；关联企业存 CustProjectRelDO；审批数据存 TenantProjectApprovalDO
- term: 项目状态
  aliases:
  - projectStatus
  - project_status
  - rule_status
  maps_to: tenant_project.project_status，代码枚举 ProjectStatusEnum.EFFECTIVE/INVLIAD
  also_confused_with:
  - 需求文档中的 rule_status
  adjudication: boundary
  boundary: 代码字段为 project_status；需求文档中 rule_status -> ACTIVE/INACTIVE 与代码不一致，以代码为准
- term: 产品开通状态
  aliases:
  - openStatus
  - open_status
  maps_to: tenant_product.open_status 的 N/P/Y；客户产品侧使用 CustProductActiveConstant.OPENED/OPENING
  also_confused_with:
  - ProductOpenStatusEnum
  - CustProductActiveConstant
  adjudication: boundary
  boundary: 租户产品状态为 N/P/Y；客户产品状态为 OPENED/OPENING；互通产品 DB 对账出现 OPENED
- term: 上线审批工作流状态
  aliases:
  - wfStatus
  - wf_status
  maps_to: ProjectApprovalWorkflowStatusEnum.PENDING/RUNNING/FINISHED/TERMINATED
  also_confused_with:
  - 节点状态 node_status
  adjudication: boundary
  boundary: wf_status 是审批主记录状态；node_status 是单个流程节点状态
- term: 项目上线审批
  aliases:
  - tenant_project_approval
  - ProjectApproval
  maps_to: TenantProjectApprovalDO/ProjectApprovalApplication：项目上线审批主流程
  also_confused_with:
  - 项目状态 project_status
  adjudication: boundary
  boundary: 审批完成可驱动项目生效，但审批状态不等于项目状态
rules:
- name: 租户产品开通幂等与多级产品中间态
  content: activeAndNotify 先查租户产品；若 open_status 已为 Y 直接返回；ACFLOW/ORDER 设置 open_status=P
    等待多级回调后置成功；其他产品调用 domainService.active 置为已开通；推送 PlatProductEventType.EFFECTED
    并同步下游
  impact: 控制租户产品开通状态与下游事件同步
  field_targets:
  - tenant_product.open_status
  - tenant_product.platform_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:activeAndNotify
- name: 租户产品取消限制
  content: cancel 调用 domainService.cancel，并推送 PlatProductEventType.INVALID；注释明确关联项目后不允许取消
  impact: 租户产品取消开通
  field_targets:
  - tenant_product.open_status
  - tenant_product.id
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:cancel
- name: 租户产品在途校验
  content: checkOnTheWay 委托 domainService.checkOnTheWay，用于检查产品在途逻辑；但 activeAndNotify
    中未直接调用该检查
  impact: 产品开通/变更在途控制
  field_targets:
  - tenant_product.id
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:checkOnTheWay
- name: 企业角色组合校验
  content: 同一企业在同一产品下若已有多个 companyType，需命中 PlatformProductDO.custRoleCombine 允许的角色组合集合；不命中时若
    removeProductList 为空抛 BaseException“系统暂不支持该角色组合”，否则加入 removeProductList 过滤产品
  impact: 防止同一企业在同一产品下承担多个不合规角色进行欺诈
  field_targets:
  - PlatformProductDO.custRoleCombine
  - CustProjectRelDO.companyType
  - tenant_product.platform_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:checkCustRoleCombine/checkProjectProductByCustType
- name: 运营方添加企业角色校验
  content: checkProjectProductByCustType 调用 checkCustRoleCombine，校验运营方添加已存在企业角色时是否满足产品角色组合
  impact: 运营方添加企业到项目/产品前的角色组合校验
  field_targets:
  - CustProjectRelDO.companyType
  - PlatformProductDO.custRoleCombine
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductApplication.java:checkProjectProductByCustType
- name: 租户项目创建
  content: create 校验租户信息存在、租户产品存在；调用 TenantProjectDomainService.create 创建项目；满足 isAdd=Y、挡板
    project.online.approval.enable 开启、平台产品为 ACFLOW/RVSFACTOR/ORDER 时创建初始上线审批；推送 PROJECT_SYNC
    CREATED
  impact: 项目创建、审批初始化与下游同步
  field_targets:
  - tenant_project.*
  - tenant_product.platform_product_code
  - tenant_project.is_add
  - tenant_project.project_approval_id
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:create/tryCreateInitialApprovalOnProjectCreate
- name: 租户项目生效
  content: effective 先查项目与租户产品；BEECREDIT 产品要求 config_json 中项目配置状态为 EFFECTIVE 或 Y，否则抛异常；调用
    domainService.effective；非 BEECREDIT 推送 EFFECTED；ACFLOW/RVSFACTOR 生效时查询/补全业务系统配置并调用
    bocomFactory.openPaymentBocomAccount 开户
  impact: 项目生效、配置校验、下游同步与交e保开户
  field_targets:
  - tenant_project.project_status
  - tenant_project.config_json
  - tenant_product.platform_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:effective
- name: 租户项目失效/删除/变更/复制事件
  content: invalid 调 domainService.invalid 并推送 INVALID；delete 调 domainService.delete
    并推送 DELETED；change 调 domainService.change 成功后推送 CHANGED；copy 推送 COPY；updateIsPrd
    推送 CHANGED
  impact: 项目生命周期状态与下游同步
  field_targets:
  - tenant_project.project_status
  - tenant_project.enable
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:invalid/delete/change/copy/updateIsPrd
- name: ACFLOW 项目跨租户查询
  content: listEffectiveProjects 中若 refTenantProjectProductCode 对应平台产品为 ACFLOW，则调用
    tenantProjectDao.listAcflowAllEffectiveProjects(ACFLOW, projectConfigVersion)
    跨租户查询有效项目
  impact: ACFLOW 多级产品允许跨租户查询项目
  field_targets:
  - tenant_project.ref_tenant_project_product_code
  - tenant_project.platform_product_code
  - tenant_project.project_config_version
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:listEffectiveProjects
- name: 项目导入校验
  content: 导入项目和企业信息时校验项目ID非空、不重复、能解析为 Long、项目存在、对接人存在、项目标签合法、自定义字段长度<=500、运营项目归属<=50；有错误则生成错误文件且不更新
  impact: 保证项目运营配置导入数据质量
  field_targets:
  - tenant_project.project_id
  - tenant_project.op_contact_a
  - tenant_project.op_contact_b
  - tenant_project.verification_contact
  - tenant_project.risk_control_contact_a
  - tenant_project.risk_control_contact_b
  - tenant_project.project_tag
  - tenant_project.custom_field_one/two/three
  - tenant_project.bussiness_project_relation
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:importProjectAndCompanyInfo/validateProjectData/updateProjectData
- name: 项目导出范围
  content: exportProjectInfo 只查询 tenant_project.enable='Y'，按 update_time 降序；Sheet1
    项目运营配置，Sheet2 关联企业；关联企业只取 cust_project_rel.company_type in (CORE, FINANCE) 且 enable='Y'；企业信息只取
    data_type='1' 主数据
  impact: 项目运营配置导出数据范围
  field_targets:
  - tenant_project.enable
  - cust_project_rel.company_type
  - cust_project_rel.enable
  - CustCompanyInfoDO.dataType
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/TenantProjectApplication.java:exportProjectInfo/queryRelatedCompanies
- name: 业务系统推送项目配置落库条件
  content: ProjectBusinessConfigApplication.savePush 要求项目存在、sourceSystem 合法且与项目 platformProductCode
    匹配；必须存在 wf_status=RUNNING 且 node_status=APPROVING 的上线审批节点；仅当当前节点为 PROJECT_MANAGER
    或 PROJECT_CONFIG 时落库更新，否则记录日志并返回已有配置ID
  impact: 控制业务系统推送项目配置是否写入审批业务信息
  field_targets:
  - tenant_project.platform_product_code
  - TenantProjectApprovalDO.wf_status
  - TenantProjectApprovalFlowDO.node_status
  - TenantProjectApprovalFlowDO.node_code
  - TenantProjectApprovalBusinessInfoDO.*
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectBusinessConfigApplication.java:savePush
- name: 上线审批发起与暂存
  content: submit 要求审批记录为 PENDING；isDraft=Y 仅落库不启动工作流；正式提交校验流程节点审批人、影像文件，生成流程定义；首次新增项目正式提交时回填立项审批编号到
    tenant_project.wechat_audit_no
  impact: 项目上线审批提交与暂存
  field_targets:
  - TenantProjectApprovalDO.wf_status
  - TenantProjectApprovalDO.is_draft
  - tenant_project.wechat_audit_no
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:submit/backfillProjectSpNoOnSubmit
- name: 上线审批完成驱动项目生效与推送
  content: handleFlowAndNodeStatus 在 wfStatus=FINISHED 或 TERMINATED 时更新完成时间；FINISHED
    时调用 effectiveProjectOnApprovalFinished 使项目生效；标准项目或常规项目+低风险推送 AMS；业务经理节点通过且 is_back_agreement=Y
    启动后补合作协议
  impact: 审批终态联动项目生效、AMS 推送、后补合作协议
  field_targets:
  - TenantProjectApprovalDO.wf_status
  - TenantProjectApprovalDO.project_type
  - TenantProjectApprovalDO.is_low_risk
  - TenantProjectApprovalFlowDO.is_back_agreement
  - tenant_project.project_status
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/approval/ProjectApprovalApplication.java:handleFlowAndNodeStatus/effectiveProjectOnApprovalFinished/isPushToAms/isStartBackAgreement
- name: 客户开通产品需租户产品已上架
  content: CustGeneralProductApplication.activeProduct 校验 tenantProductDTO.openStatus
    必须为 Y，否则抛“请联系管理员上架产品”；AMS 产品开通后同步企业信息到 client
  impact: 客户产品开通前置校验
  field_targets:
  - tenant_product.open_status
  - tenant_product.platform_product_code
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/custproduct/CustGeneralProductApplication.java:activeProduct
- name: 登录后跳转产品决策
  content: determineProduct 按优先级：新用户回产融；问卷星白名单回产融；产品未开通回产融；产融有待办回产融；产融无待办时按业务待办数量、指定
    targetProduct 和已开通产品集合决定跳转产品
  impact: 登录后跳转产品
  field_targets:
  - CustProductDTO.openStatus
  - CustProductDTO.platformProductCode
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/cust/application/GotoProductApplication.java:determineProduct
- name: 互通产品租户创建/开通/取消
  content: TenantInterworkingProductApplication.create 校验 tenantId 与 platformProductId；active
    调用 domainService.active；cancel 调用 domainService.cancel，注释明确关联项目后不允许取消；afterSaveOrUpdate
    当前为空实现
  impact: 租户互通产品生命周期
  field_targets:
  - tenant_interworking_product.open_status
  - tenant_interworking_product.tenant_id
  - tenant_interworking_product.platform_product_id
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantInterworkingProductApplication.java:create/active/cancel
- name: Nacos 扩展产品类型白名单
  content: TenantProductQueryAggregateApplication 使用 @NacosValue("${platform.avaliableExtProductType:INTERWORKING}")
    配置可用的扩展产品类型，默认 INTERWORKING
  impact: 控制扩展产品类型查询范围
  field_targets:
  - PlatformProductTypeEnum
  evidence: code_path:lowcode-pplatform-customer-management/src/main/java/com/lls/lowcode/pplatform/product/application/producttype/TenantProductQueryAggregateApplication.java
