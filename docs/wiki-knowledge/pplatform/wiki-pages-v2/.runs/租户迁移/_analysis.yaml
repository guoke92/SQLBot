field_semantics:
- table: tenant_migarory_log
  field: type
  meaning: 推数/迁移接口标识。入向为迁移 RPC 名称（migratoryTenant/migratoryProject/migratoryCust/migratoryOnTheWayCust，配合
    name 中的中文『迁移租户/迁移项目/迁移客户/迁移在途客户信息』）；出向为 RpcPoint 名称（TENANT_SYNC/PROJECT_SYNC/PRODUCT_SYNC/CUST_PRODUCT_SYNC/PROJECT_QUERY）及其校验器
    *_SYNC_VALIDATE、syncProduct/syncProject
  evidence: db+code
- table: tenant_migarory_log
  field: name
  meaning: 业务动作/事件名称。中文族=迁移类接口入向（迁移项目 92213、迁移客户 13228、迁移租户 363、迁移在途客户信息 293、同步产品
    640、同步项目 16668）；英文族=事件类型（CREATED/EFFECTED/CHANGED/INVALID/DELETED/QUERY/ACTIVE_CFCA_SIGN/ACTIVE_BS_SIGN）
  evidence: db+code
- table: tenant_migarory_log
  field: direction
  meaning: 数据方向：IN=外部业务系统调用产融迁移/同步接口（123405 条为主流）；OUT=产融反向推数给业务系统（29764 条），pushByLog
    只处理 direction=OUT 的重推
  evidence: db+code
- table: tenant_migarory_log
  field: status
  meaning: 处理状态：Y=处理成功（145743），N=未成功/待重试（7426，DB 默认 N）。写入点为 BooleanEnum 字典键，非 StatusEnum
  evidence: db+code
- table: tenant_migarory_log
  field: platform_product_code
  meaning: 推数目标产品编码，一个事件可横向铺开到多个产品（productCodes 数组），与 product_code 的租户开通产品对应
  evidence: code
- table: tenant_migarory_log
  field: req_no
  meaning: 单次推数请求编号，唯一键 uk_req_no；pushByLog(reqNo) 以此为幂等/重推依据
  evidence: db+code
- table: tenant_migarory_log
  field: req_sn
  meaning: 业务流水号（非唯一），迁移记录里用于关联同批业务
  evidence: db
- table: tenant_migarory_log
  field: batch_no
  meaning: 批次号，用于分批迁移标记；代码链路中未见写入点
  evidence: db
- table: tenant_migarory_log
  field: request
  meaning: 出/入向报文原文（EventNode JSON），重推时被反序列化成 EventNode
  evidence: code
- table: tenant_migarory_log
  field: response
  meaning: 推数返回体，logOut 落库
  evidence: code
- table: tenant_migarory_log
  field: data
  meaning: 迁移数据快照（迁移企业/项目/租户主体内容）
  evidence: db
- table: tenant_migarory_log
  field: message
  meaning: 错误信息（bizErrorMsg 提取 detailMessage 后写入类字段）
  evidence: code
- table: tenant_migarory_log
  field: act_procinst_id
  meaning: 外部审批流程实例ID，用于把审批结果回写到推数记录
  evidence: db
- table: migratory_user_record
  field: user_id
  meaning: 迁移存量用户对应的产融用户ID（企业管理员/经办人落库时 person.getUserId()，即 FBP/产融用户ID），非 sys_user
    主键直接引用
  evidence: code
- table: migratory_user_record
  field: is_login
  meaning: 该迁移用户是否已在产融登录过：N=未登录（5228，首次登录弹升级提示），Y=已登录（1433，不再弹）。迁移落库时硬编码写 "N"
  evidence: db+code
- table: migratory_user_record
  field: db_tenant_code
  meaning: 数据租户标识，与 user_id 组成迁移用户判定条件
  evidence: code
- table: argeement_migratory_record
  field: status
  meaning: 协议拉取状态：N=待拉取（字典键 BooleanEnum.no），Y=已拉取/已确认无协议
  evidence: code
- table: argeement_migratory_record
  field: pull_num
  meaning: 已拉取次数，pull_num<pullNum(默认20) 才继续拉取；失败时 +1 且 status 保持 N
  evidence: code
- table: argeement_migratory_record
  field: is_new
  meaning: 新/旧渠道协议标记，代码用 isNew.name() 落库（与同表 status 用 getDictKey 写法不一致）
  evidence: code
- table: argeement_migratory_record
  field: agreement_type
  meaning: 协议类型：CA授权(CFCA/BS)、产品协议、企业授权书、用户协议、隐私政策（AgreementDocType）
  evidence: code
- table: cust_company_info
  field: cust_source
  meaning: 企业来源，迁移落库固定写 CustSourceEnum.MIGRATORY
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 迁移时直接采用上游推送值：EFFECT=已生效、ADD=在途（未生效）
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 迁移映射：cust_status=EFFECT→BUILD_SUCCESS；cust_status=ADD→INIT
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 迁移映射：cust_status=EFFECT→CUST_CHECK_PASS；cust_status=ADD→置 null
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否开通CFCA：先写上游 openCa，随后被 "Y"/"N" 字面量覆盖；openCa 链路开启后写 ca_register_status="Y"
  evidence: code
- table: cust_company_info
  field: migarory_auth_aggrement_flag
  meaning: 迁移授权书标记：新渠道(Y) 时 supplement_flag 置 N（无需补签），旧渠道(N) 时 supplement_flag 置 Y（需展示补签）
  evidence: code
state_machines:
- name: 迁移存量用户登录提示状态
  field: migratory_user_record.is_login
  states:
  - value: N
    label: 迁移存量用户、尚未登录（可弹升级提示）
    source: db_dist
  - value: Y
    label: 已登录过（不再弹提示）
    source: db_dist
  transitions:
  - from: N
    event: 登录后调用 /cust-web/migratory/isEjectMsg（isExist 且 hasNotLogin）
    to: Y
    evidence: code_path:CustMigratoryService.java#loginAfterEjectMsg
  - from: 新增
    event: 迁移落库时为每个迁移人员创建记录并写 is_login="N"
    to: N
    evidence: code_path:PlatFormMigratoryApplication.java#migratoryCust
- name: 推数/迁移记录处理状态
  field: tenant_migarory_log.status
  states:
  - value: N
    label: 未成功/待重试（DB 默认 N）
    source: db_dist
  - value: Y
    label: 处理成功
    source: db_dist
  transitions:
  - from: N
    event: 推数执行并 logOut 回写（BooleanEnum 字典键）
    to: Y
    evidence: code_path:TenantMigaroryLogDaoImpl.java:87
  - from: N
    event: 按 reqNo 重新推送 pushByLog（仅 direction=OUT 且非 *_SYNC_VALIDATE）
    to: Y
    evidence: code_path:MigratoryPointServiceImpl.java#pushByLog
- name: 迁移协议拉取状态
  field: argeement_migratory_record.status
  states:
  - value: N
    label: 待拉取（BooleanEnum.no）
    source: code_enum
  - value: Y
    label: 已拉取完成 / 客户端确认无该协议
    source: code_enum
  transitions:
  - from: N
    event: 定时任务 pull() 按产品+客户分组拉取到协议并写回
    to: Y
    evidence: code_path:AgreementMigratoryService.java#updateAgreement
  - from: N
    event: 拉取失败（pull_num+1，状态保持 N，等待下一轮）
    to: N
    evidence: code_path:AgreementMigratoryService.java#updateAgreementPullNum
  - from: N
    event: 协议推送同步 syncAgreementDoc
    to: Y
    evidence: code_path:AgreementMigratoryService.java#syncAgreementDoc
calibers:
- name: 待拉取协议集合
  predicate: argeement_migratory_record.status = 'N'
  scope: 协议拉取定时任务 pull()：叠加 enable='Y'、pull_num < pullNum(默认20)、排除 excludeProductCode
    产品
  evidence: code:AgreementMigratoryService.java#pull
- name: 存量迁移用户首登提示口径
  predicate: migratory_user_record.is_login = 'N'
  scope: 登录后 isEjectMsg 判定：记录存在且未登录才弹『平台已升级…』，弹后置 Y
  evidence: code:CustMigratoryService.java#loginAfterEjectMsg + db(N:5228/Y:1433)
- name: 迁移来源企业
  predicate: cust_company_info.cust_source = 'MIGRATORY'
  scope: 迁移接口落库企业统一标记来源，区别于平台建档/邀请建档
  evidence: code:PlatFormMigratoryApplication.java#setCompany
- name: 在途（未生效）迁移企业
  predicate: cust_company_info.cust_status = 'ADD'
  scope: cust_build_status 置 INIT、check_status 置 null；人员 status 强制置 CustPersonStatusConstant.ADD，不采信上游推送状态
  evidence: code:PlatFormMigratoryApplication.java#setCompany,#setPersonAdm,#setPersonOper
- name: 出向推数口径
  predicate: tenant_migarory_log.direction = 'OUT'
  scope: pushByLog 只重推 OUT 方向、且 type 不含 SYNC_VALIDATE 的记录
  evidence: code:MigratoryPointServiceImpl.java#pushByLog + db(IN:123405/OUT:29764)
- name: 未成功推数/迁移记录
  predicate: tenant_migarory_log.status = 'N'
  scope: 默认值 N，作为待重试集合（7426 条）
  evidence: db+code:TenantMigaroryLogDaoImpl.java:87
- name: 推数白名单租户
  predicate: tenant_setting_config.db_tenant_code = '<白名单值>'
  scope: platformPointServiceExcludeDbTenantCode 命中的租户直接 return，不推数
  evidence: code:MigratoryPointServiceImpl.java#push
term_bridges:
- term: 迁移
  aliases:
  - migratory
  - 迁移租户/迁移项目/迁移客户/迁移在途客户信息
  - migratoryTenant/migratoryProject/migratoryCust/migratoryOnTheWayCust
  maps_to: tenant_migarory_log.type
  also_confused_with:
  - 同步
  - syncProduct
  - PROJECT_SYNC
  adjudication: boundary
  boundary: 『迁移』=业务系统把存量数据推到产融的一次性入向接口（direction=IN，PlatFormMigratoryProvider）；『同步/推数』=产融反向推给业务系统的出向事件（direction=OUT，RpcPoint）。二者共用
    tenant_migarory_log，必须靠 direction+type 区分，不能按中文名混用
- term: 同步
  aliases:
  - 推数
  - push
  - syncProduct
  - syncProject
  - TENANT_SYNC/PROJECT_SYNC/PRODUCT_SYNC
  maps_to: tenant_migarory_log.direction
  also_confused_with:
  - 迁移
  adjudication: boundary
  boundary: 出向推数以 direction=OUT 标识，含 *_SYNC_VALIDATE 校验器记录；迁移类记录 direction=IN。数据量上
    IN 远大于 OUT，不能按记录数判断业务重要性
- term: 租户标识
  aliases:
  - dbTenantCode
  - db_tenant_code
  - tenantCode
  maps_to: cust_company_info.db_tenant_code
  also_confused_with:
  - app_tenant_code
  - tenant_id
  - tenant_flg_en
  adjudication: boundary
  boundary: db_tenant_code=数据租户标识（业务数据隔离边界，迁移/推数/锁键都用它）；app_tenant_code=逻辑租户标识（DB
    分布仅 base/common）；tenant_id=租户配置主键（查租户产品用）；tenant_flg_en=项目标识/产融渠道码（存于 cust_company_info.tenant_flg_en）
- term: 在途
  aliases:
  - 在途企业
  - 在途客户
  - migratoryOnTheWayCust
  - 迁移在途客户信息
  maps_to: cust_company_info.cust_status
  also_confused_with:
  - EFFECT 生效企业
  adjudication: boundary
  boundary: 在途=迁移时 cust_status='ADD' 的企业：建档状态 INIT、审核状态 null、人员状态强制 ADD、影像不接收授权书（CATGID_A0004
    跳过）；与生效迁移企业（EFFECT→BUILD_SUCCESS+CUST_CHECK_PASS）走不同分支
- term: 贴牌
  aliases:
  - 品牌
  - bandName
  - platName
  maps_to: tenant_setting_config.band_name
  also_confused_with:
  - app_tenant_code
  - tenant_flg_en
  adjudication: boundary
  boundary: 代码中贴牌名仅作为展示/推送字段出现（tenantDTO.getBandName() 填 PlatClientOpenCaReq.brand；租户配置
    platName 拼登录提示语）；需求侧『假贴牌/二级贴牌』无独立字段与标识，只有 app_tenant_code、tenant_flg_en 等近似字段，属
    REVIEW
- term: 产品编码
  aliases:
  - platformProductCode
  - productAppId
  - productCode
  maps_to: tenant_migarory_log.platform_product_code
  also_confused_with:
  - platformProductId
  - tenant_product.id
  - productId
  adjacidation: boundary
  adjudication: boundary
  boundary: platformProductCode/productAppId 是字符串产品码（AMS/ACFLOW/ORDER…），用于推数与协议类型分支；platformProductId、cust_project_rel.product_id
    是数值主键。setCustProjectRel 中仅金融机构角色才把 product_id 换成 tenant_product.id
rules:
- name: 迁移企业防重锁
  content: 迁移企业加 Redis 锁，key = dbTenantCode + '_' + companyName + '_' + socialUnifiedCode；获取失败直接抛
    SyncException『迁移企业信息重复同步』，方法级 @Transactional 回滚
  impact: 保证同一租户下同名同证件企业不被并发/重复迁移
  field_targets:
  - cust_company_info.db_tenant_code
  - cust_company_info.name
  - cust_company_info.certification_no
  evidence: code:PlatFormMigratoryApplication.java#migratoryCust
- name: AMS 迁移去重（企业已存在则只补人员）
  content: productAppId=AMS 时，先用统一社会信用代码（为空则 companyNameVagueCheckService 按名称反查）+dbTenantCode
    查已存在企业；命中则不重建企业，只按 手机号+companyType+userType 过滤出增量管理员/经办人、按 roleType 过滤增量角色，走客户变更流程补齐
  impact: 实现『讯易链与 AMS 都有建档时保留一条』的企业合并
  field_targets:
  - cust_company_info.certification_no
  - cust_person_info.phone
  - cust_person_info.company_type
  - cust_person_info.user_type
  - cust_role_info.role_type
  evidence: code:PlatFormMigratoryApplication.java#migratoryCust
- name: 迁移企业状态映射
  content: cust_status=EFFECT → cust_build_status=BUILD_SUCCESS 且 check_status=CUST_CHECK_PASS；cust_status=ADD
    → cust_build_status=INIT 且 check_status=null
  impact: 在途企业不计入生效口径，避免误开通产品与审核状态
  field_targets:
  - cust_company_info.cust_status
  - cust_company_info.cust_build_status
  - cust_company_info.check_status
  evidence: code:PlatFormMigratoryApplication.java#setCompany
- name: 已存在企业不回溯覆盖
  content: 若上游 updateTime 早于库内 update_time 且 cust_build_status=BUILD_SUCCESS，则『以系统为准，不更新』直接返回
  impact: 防止迁移把产融侧更新的企业信息回退成旧值
  field_targets:
  - cust_company_info.update_time
  - cust_company_info.cust_build_status
  evidence: code:PlatFormMigratoryApplication.java#setCompany
- name: 在途企业人员状态强制初始化
  content: company.cust_status=ADD 时，管理员/经办人 status 一律置 CustPersonStatusConstant.ADD，不采用上游推送状态
  impact: 防止在途数据把人员置为已生效
  field_targets:
  - cust_person_info.status
  - cust_company_info.cust_status
  evidence: code:PlatFormMigratoryApplication.java#setPersonAdm,#setPersonOper
- name: 迁移用户记录落库
  content: 人员落库后，按 user_id+db_tenant_code 查 migratory_user_record，不存在则插入并置 is_login='N'
  impact: 为『首登弹升级提示、仅弹一次』提供判定依据
  field_targets:
  - migratory_user_record.user_id
  - migratory_user_record.db_tenant_code
  - migratory_user_record.is_login
  evidence: code:PlatFormMigratoryApplication.java#migratoryCust
- name: 迁移授权书补签标记
  content: newAuthAggrementFlag=true → migarory_auth_aggrement_flag=Y 且 auth_aggrement_supplement_flag=N；false
    → N 且 Y
  impact: 控制旧渠道企业是否展示授权书补签入口
  field_targets:
  - cust_company_info.migarory_auth_aggrement_flag
  - cust_company_info.auth_aggrement_supplement_flag
  evidence: code:PlatFormMigratoryApplication.java#setCompany
- name: 迁移协议初始化（5 类，按客户+产品去重）
  content: 对每个产品编码，逐一 count(custId+platformProductCode+agreementType) 为 0 才插入：CA授权（AMS→BS_AUTH，其他→CFCA_AUTH）、产品协议（按产品分支）、企业授权书、用户协议、隐私政策；初始
    status='N'、pull_num=0、is_new=Y
  impact: 为后续协议拉取任务生成待办清单
  field_targets:
  - argeement_migratory_record.cust_id
  - argeement_migratory_record.platform_product_code
  - argeement_migratory_record.status
  - argeement_migratory_record.pull_num
  evidence: code:PlatFormMigratoryApplication.java#setAgreementMigratory
- name: 协议拉取任务节流
  content: 应用启动后由单线程调度器每 30 秒执行 pull()；Redis 锁 cust_argeement_pull；查询 status='N'/enable='Y'/pull_num<pullNum(默认20)，按产品分组→按客户分组拉取，成功写
    status='Y'，失败 pull_num+1
  impact: 控制对业务系统协议接口的调用频次与重试
  field_targets:
  - argeement_migratory_record.status
  - argeement_migratory_record.pull_num
  evidence: code:AgreementMigratoryService.java#AreementPullTask
- name: 协议文件落地与合同归档
  content: 拉取到的 fileUrl 先本地落地再上传 COS（PROJECT=FBP_SYSTEM），path 非空才 migrateConctract
    写入合同记录；已存在同 客户+合同编号 的跳过
  impact: 保证影像/协议不重复、不丢
  field_targets:
  - argeement_migratory_record.agreement_path
  - argeement_migratory_record.agreement_no
  evidence: code:AgreementMigratoryService.java#createContractInfo,#agreementExist
- name: 推数产品范围推导
  content: 未指定 productCodes 时用租户已开通产品；推租户同步时按平台产品推；企业存在 AMS 经办人或已开 AMS 互通产品时自动追加 AMS
  impact: 决定迁移/推数落到哪些业务系统
  field_targets:
  - tenant_migarory_log.platform_product_code
  evidence: code:MigratoryPointServiceImpl.java#deduceProductCodes,#call
- name: 推数白名单短路
  content: tenantId 对应租户 dbTenantCode 命中 platformPointServiceExcludeDbTenantCode 时直接
    return，不产生推数记录
  impact: 灰度/隔离特定租户的推数
  field_targets:
  - tenant_migarory_log.db_tenant_code
  evidence: code:MigratoryPointServiceImpl.java#push,#call
- name: 迁移企业开 CA 幂等
  content: openCa 前判定：AMS 看 bs_register_status，非 AMS 看 ca_register_status，已为 'Y' 直接返回；开通成功后
    AMS 同时置 bs/ca 为 Y，其他仅置 ca 为 Y
  impact: 避免重复向签章中台注册
  field_targets:
  - cust_company_info.ca_register_status
  - cust_company_info.bs_register_status
  evidence: code:PlatFormMigratoryApplication.java#openCa；CustAccessAsyncApplication.java#openCa
- name: 迁移人员手机号加密匹配
  content: 以 metaDataEncryptionHandler/IMetaDataEncryptionService.encryptAndBase64Str(phone)
    后 .eq 查询 cust_person_info.phone（已存在则先删旧记录再插）
  impact: 保证加密列上的去重与覆盖正确
  field_targets:
  - cust_person_info.phone
  - cust_person_info.ref_cust_company_info
  evidence: code:PlatFormMigratoryApplication.java#setPersonAdm,#setPersonOper
reqdoc_claims:
- claim: 存量用户首次登录（当前迁移批次内）弹出『【贴牌名称】平台已升级，新增【产品中心】，期待为您提供更好的服务』，一个用户仅弹一次
  code_status: confirmed
  code_evidence: CustMigratoryService.java#loginAfterEjectMsg + CustMigratoryController.java#isEjectMsg
    + PlatFormMigratoryApplication.java#migratoryCust
  action: anchor
- claim: 迁移时为迁移企业初始化协议待拉取记录，覆盖 CA 授权书、产品协议、企业授权书、用户协议、隐私政策
  code_status: confirmed
  code_evidence: PlatFormMigratoryApplication.java#setAgreementMigratory + AgreementMigratoryService.java#pull
  action: anchor
- claim: 讯易链与 AMS 都建过档的存量企业需做数据合并，保留一条
  code_status: confirmed
  code_evidence: PlatFormMigratoryApplication.java#migratoryCust（AMS 分支按 certNo+dbTenantCode
    命中已存在企业后只补增量人员/角色）
  action: anchor
- claim: 合并策略：导出多条建档企业、RPA 抓取最新关键字段对比定位最准确一条，关键字段一致时取建档/变更时间最晚的一条，影像件留用对应那套
  code_status: uncovered
  code_evidence: PlatFormMigratoryApplication.java#setCompany（仅有『上游 updateTime 早于库内且已建档成功则不更新』的时间取向，无字段级对比/RPA/影像件择取）
  action: review
- claim: 按批次迁移：多级流转 3 批、订单融资同节奏、线上保理 2 批、AMS 2 批，首批 8 月初、自营租户 9 月 6 日
  code_status: uncovered
  code_evidence: 仅存在 tenant_migarory_log.batch_no 列，代码链路未见批次路由/开关
  action: review
- claim: 假贴牌迁移后在租户配置表单不可见、挂自营贴牌下作二级贴牌；需产融新建租户和定制项目映射表，租户迁移接口存映射关系、项目迁移存定制项目标志、项目同步接口加标志
  code_status: uncovered
  code_evidence: PlatFormMigratoryProviderImpl.java#migratoryTenant/#migratoryProject
    仅透传 tenantMigratoryApplicationService.migratory("tenant"/"project", ...)，可见切片中无定制项目映射/标志字段
  action: review
- claim: AMS 迁移后原域名不再使用，打开旧域名弹窗提示跳转产融
  code_status: uncovered
  code_evidence: CustMigratoryController.java 仅 /cust-web/migratory/isEjectMsg 一个迁移相关入口
  action: review
- claim: 注册/登录入口统一到产融：已迁移存量用户用原账号可登录，进入内页可见企业状态『已认证』、产品中心至少开一个产品（按初始化标签/是否签署产品服务协议判定）
  code_status: confirmed
  code_evidence: PlatFormMigratoryApplication.java#saveAdminSysUser/#saveOperSysUser（写
    SSO 通道+同步 sys_user+绑角色）、#migratoryCust（按迁移项目 platformProductCode 调 custProductApplicationService.autoActiveProduct
    自动开通）
  action: prose_only
- claim: 用户注册协议维度调整：多级流转 1 阶段维持项目维度、2 阶段迁到产融；线上保理与订单融资迁到租户维度做强制阅读
  code_status: uncovered
  code_evidence: PlatFormMigratoryApplication.java#setAgreementMigratory 生成的用户协议/隐私政策记录按
    cust_id + platform_product_code 维度，未体现租户维度强制阅读开关
  action: prose_only
- claim: 逐批迁移中，假贴牌下的数据随用户维度一起迁移至产融平台
  code_status: uncovered
  code_evidence: PlatFormMigratoryApplication.java#migratoryCust 以企业+用户维度落库，无假贴牌标识参与分支
  action: review
