field_semantics:
- table: cust_company_info
  field: cust_build_status
  meaning: 企业建档/认证流程主状态（区分初始化、待客户认证、运营中台审批中、认证成功/失败、待激活、变更等）
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 企业生命周期状态（ADD 新增建档中 / EFFECT 生效 / CHANGE 变更中 / FREEZE 冻结 / WRITEOFF 注销）
  evidence: db
- table: cust_company_info
  field: identify_style
  meaning: 认证方式：INVITE_AGW 平台录入邀请认证、INVITE 客户录入邀请认证、SELF 自主认证、SIMPLE 简易认证
  evidence: db
- table: cust_company_info
  field: cust_build_type
  meaning: 录入方式（AGW_BUILD 运营/内管端录入，PC_BUILD 客户端录入）；与 identify_style 是不同维度，DB 中出现的
    SIMPLE 属脏值
  evidence: db
- table: cust_company_info
  field: check_status
  meaning: 运营中台审核状态：CUST_CHECK_INIT/CHECKING/PASS/BACKTOCUSTOM/REJECT（写自 OperApiConstants.CheckStatus），非
    Enum 底稿中的字段
  evidence: db
- table: cust_company_info
  field: ca_register_status
  meaning: CA(电子签章)开通状态：N 未开通 / Y 已开通 / P 开通中
  evidence: db
- table: cust_company_info
  field: bs_register_status
  meaning: 上上签开通状态 N/Y
  evidence: db
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通 CFCA 电子签章 Y/N
  evidence: db
- table: cust_company_info
  field: need_register_bs
  meaning: 是否需要开通上上签 Y/N
  evidence: db
- table: cust_company_info
  field: data_type
  meaning: 数据类型：'1' 主数据(main) / '0' 记录数据(record) / '2' 流程申请数据(apply)
  evidence: code
- table: cust_company_info
  field: apply_type
  meaning: 流程类型，字面量直写 add / update
  evidence: code
- table: cust_company_info
  field: main_data_id
  meaning: 流程数据指向的主数据 id（认证/变更流程数据回归档用）
  evidence: code
- table: cust_company_info
  field: apply_data_id
  meaning: 主数据上挂的最近一次认证流程数据 id
  evidence: code
- table: cust_company_info
  field: certification_no
  meaning: 统一社会信用代码
  evidence: db
- table: cust_company_info
  field: cust_source
  meaning: 建档数据来源：PPLATFORM/PLATFORM_PUSH/MIGRATORY/PLATFORM
  evidence: db
- table: cust_company_info
  field: sign_mode
  meaning: 签署方式；DB 实际值 ONLINE，与 SignModeEnum(01/02/03) 不一致
  evidence: db
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色 JSON 数组字符串，如 ["SUPPLIER"]
  evidence: code
- table: cust_company_info
  field: back_reason
  meaning: 流程退回原因
  evidence: db
- table: cust_company_info
  field: pc_task_id
  meaning: 客户端补充资料节点的流程 taskId
  evidence: code
- table: cust_company_info
  field: audit_back_flag
  meaning: 审核退回标记 Y/N
  evidence: db
state_machines:
- name: 企业建档/认证状态机
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始化
    source: code_enum
  - value: TO_BE_BUILD
    label: 未建档
    source: code_enum
  - value: BUILDING
    label: 建档中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 认证成功
    source: db_dist
  - value: BUILD_FAIL
    label: 认证失败
    source: db_dist
  - value: BUILD_BACK
    label: 退回
    source: db_dist
  - value: BUILD_ACTIVATE
    label: 待激活
    source: db_dist
  - value: CUST_CONFIRM_AWAIT
    label: 待客户认证
    source: db_dist
  - value: CUST_AUDIT_AWAIT
    label: 待审核
    source: db_dist
  - value: CUST_BUILDING
    label: 审核中/审批中
    source: db_dist
  - value: CUST_BUILD_SUCCESS
    label: 审核通过
    source: code_enum
  - value: CUST_BUILD_FAIL
    label: 审核拒绝
    source: code_enum
  - value: CUST_CHANGE
    label: 变更
    source: db_dist
  - value: AWAIT_CUST_CONFIRM
    label: 待客户确认(简易认证)
    source: db_dist
  transitions:
  - from: INIT
    event: 邀请认证-客户录入提交(submitCust)
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:submitCust:getCustBuildStatus
  - from: INIT
    event: 邀请认证-平台录入提交(submitCust)
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:submitCust:getCustBuildStatus
  - from: BUILD_FAIL
    event: 自主认证重提交(INIT/BUILD_FAIL→CUST_CONFIRM_AWAIT)
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_CONFIRM_AWAIT
    event: 客户向运营中台提交
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 运营中台退回客户确认
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus:after==BUILD_SUCCESS
  - from: CUST_CONFIRM_AWAIT
    event: 运营中台审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify:after==BUILD_FAIL
  - from: CUST_CONFIRM_AWAIT
    event: 重新认证
    to: INIT
    evidence: code_path:CustCompanyOperationApplication.java:reAuthentication
  - from: INIT
    event: 简易认证提交(非资金方)
    to: AWAIT_CUST_CONFIRM
    evidence: code_path:CustCompanyInfoApplication.java:submitForSimpleAuth
  - from: AWAIT_CUST_CONFIRM
    event: 简易认证确认/资金方直接生效
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:confirmCustInfoForSimpleAuth
  - from: INIT
    event: '内管发起建档流程(addCustApplyWorkFlow: INIT+CUST_CONFIRM_AWAIT+BUILD_FAIL 允许)'
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:ApplyCompanyInfoApplication.java:addCustApplyWorkFlow
  - from: CUST_CONFIRM_AWAIT
    event: 企业信息变更提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:ApplyCompanyInfoApplication.java:custChangeApplyWorkFlow
- name: 企业生命周期状态机
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增(建档中)
    source: db_dist
  - value: CHANGE
    label: 变更中
    source: db_dist
  - value: EFFECT
    label: 生效
    source: db_dist
  - value: FREEZE
    label: 冻结
    source: db_dist
  - value: WRITEOFF
    label: 注销
    source: db_dist
  transitions:
  - from: EFFECT
    event: 企业冻结(freeze)
    to: FREEZE
    evidence: code_path:CustCompanyInfoApplication.java:freeze:custStatusOperator
  - from: FREEZE
    event: 企业解冻(unfreeze)
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java:unfreeze:custStatusOperator
  - from: EFFECT
    event: 企业注销(diable)
    to: WRITEOFF
    evidence: code_path:CustCompanyInfoApplication.java:diable:custStatusOperator
  - from: ADD
    event: 认证通过
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus:after==BUILD_SUCCESS:setCustStatus(EFFECT)
calibers:
- name: 在途认证/变更流程判定
  predicate: cust_company_info.cust_build_status NOT IN ('BUILD_SUCCESS','BUILD_FAIL')
    AND cust_company_info.data_type = '2' AND cust_company_info.main_data_id = ?
  scope: 企业是否存在在途流程，禁止重复变更
  evidence: code_path:ApplyCompanyInfoApplication.java:judgeHaveApplyingRecord
- name: 主数据判定
  predicate: cust_company_info.data_type = '1'
  scope: 状态变更/生效企业查询均限定主数据
  evidence: code_path:CustCompanyInfoApplication.java:appenUpdateCustBulidStatus
- name: 生效企业口径
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS' AND cust_company_info.cust_status
    = 'EFFECT' AND cust_company_info.data_type = '1' AND cust_company_info.enable
    = 'Y'
  scope: 有生效企业的租户集合
  evidence: code_path:CustCompanyUtilApplication.java:getTenantCodesWithEffectCompany
- name: 建档成功企业口径(影像批处理)
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS' AND cust_company_info.enable
    = 'Y'
  scope: CompanyImageUpdateJobHandler 扫描范围
  evidence: code_path:CompanyImageUpdateJobHandler.java:getAllBuildSuccessCompanies
- name: 待客户确认可重新认证
  predicate: cust_company_info.cust_build_status = 'CUST_CONFIRM_AWAIT'
  scope: 仅该状态允许 reAuthentication
  evidence: code_path:CustCompanyOperationApplication.java:reAuthentication
- name: 简易认证在建档中判定
  predicate: cust_company_info.identify_style = 'SIMPLE' AND cust_company_info.cust_build_status
    != 'CUST_CHANGE' AND cust_company_info.cust_build_status != 'BUILD_SUCCESS'
  scope: 简易建档流程中
  evidence: code_path:CustCompanyUtilApplication.java:isSimpleBuilding
- name: 需开通CA且未开通
  predicate: cust_company_info.need_register_ca = 'Y' AND cust_company_info.ca_register_status
    = 'N'
  scope: 判断客户是否需签署 CFCA 协议
  evidence: code_path:ApplyCompanyInfoApplication.java:selectCustNeedSingCfca
term_bridges:
- term: 认证方式
  aliases:
  - identify_style
  maps_to: cust_company_info.identify_style
  also_confused_with:
  - cust_company_info.cust_build_type
  adjudication: boundary
  boundary: identify_style 表示 INVITE/INVITE_AGW/SELF/SIMPLE 认证路径；cust_build_type 表示
    AGW_BUILD/PC_BUILD 录入端，两者独立，勿混用
- term: 建档成功 / 认证成功
  aliases:
  - BUILD_SUCCESS
  maps_to: cust_company_info.cust_build_status = 'BUILD_SUCCESS'
  also_confused_with:
  - CUST_BUILD_SUCCESS
  - cust_company_info.cust_status = 'EFFECT'
  adjudication: synonym
  boundary: 业务上‘认证成功’即 BUILD_SUCCESS 且 cust_status 记 EFFECT；CUST_BUILD_SUCCESS 为枚举中另一值，DB
    仅 1 条，疑为历史遗留
- term: 待客户认证
  aliases:
  - CUST_CONFIRM_AWAIT
  maps_to: cust_company_info.cust_build_status = 'CUST_CONFIRM_AWAIT'
  also_confused_with:
  - AWAIT_CUST_CONFIRM
  adjudication: boundary
  boundary: 两值字面近似：CUST_CONFIRM_AWAIT 为邀请/自主认证待客户确认；AWAIT_CUST_CONFIRM 由简易认证提交写入(submitForSimpleAuth)，语义不同
- term: 审批中/审核中
  aliases:
  - CUST_BUILDING
  - BUILDING
  maps_to: cust_company_info.cust_build_status
  also_confused_with:
  - BUILDING
  adjudication: boundary
  boundary: CUST_BUILDING 表示提交运营中台后审核中(2909 条)；BUILDING 为枚举‘建档中’(仅 2 条)，勿等同
- term: 注销
  aliases:
  - WRITEOFF
  - DISABLE
  maps_to: cust_company_info.cust_status = 'WRITEOFF'
  also_confused_with:
  - cust_company_info.enable
  adjudication: synonym
  boundary: 注销通过 diable() 将 cust_status 置 WRITEOFF，同时冻结全部用户；enable 字段另有含义
- term: 冻结
  aliases:
  - FREEZE
  maps_to: cust_company_info.cust_status = 'FREEZE'
  also_confused_with: []
  adjudication: synonym
  boundary: 冻结企业时同时冻结企业管理员
rules:
- name: 在途流程唯一性
  content: 同一企业主数据存在未结束的 apply 数据(状态非 BUILD_SUCCESS/BUILD_FAIL)时禁止再次发起变更
  impact: 重复变更被拒
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.data_type
  - cust_company_info.main_data_id
  evidence: code_path:ApplyCompanyInfoApplication.java:judgeHaveApplyingRecord
- name: 状态更新乐观匹配
  content: 更新 cust_build_status 时要求 before 状态、enable=Y、data_type=主数据同时匹配，否则更新 0 行
  impact: 并发/脏数据下状态不被覆盖
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.enable
  - cust_company_info.data_type
  evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
- name: 简易建档不支持电子签章
  content: 简易认证提交时若 need_register_ca=Y，强制校正为不开通并落库 CA/BS 字段
  impact: 简易建档不会走 CA 开通链路
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.need_register_bs
  - cust_company_info.bs_register_status
  evidence: code_path:CustCompanyInfoApplication.java:submitForSimpleAuth:CustCompanyCaPolicy.enforceMustNotOpenCa
- name: 自主/邀请认证需运营中台审核
  content: identify_style=SELF/INVITE/INVITE_AGW 提交后进入 CUST_CONFIRM_AWAIT/CUST_BUILDING
    并推送运营中台审核；仅简易认证无需审批
  impact: 决定是否发起运营中台审批
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.identify_style
  evidence: code_path:CustCompanyInfoApplication.java:submitCust
- name: 资金方简易认证直接生效
  content: 简易认证且企业类型为 FINANCE 时，提交即置 BUILD_SUCCESS + cust_status=EFFECT，不待确认
  impact: 资金方建档零审批落库
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.cust_status
  - cust_company_info.cust_company_type
  evidence: code_path:CustCompanyInfoApplication.java:submitForSimpleAuth
- name: 流程数据归档回主数据
  content: 认证成功后 APPLY 数据回写 MAIN（copy 企业/人员/账户/关联方/开通产品/影像），并回写 apply_data_id
  impact: 主数据与流程数据一致性
  field_targets:
  - cust_company_info.data_type
  - cust_company_info.main_data_id
  - cust_company_info.apply_data_id
  evidence: code_path:ApplyCompanyInfoApplication.java:setApplyDataToMain
- name: 状态同步第三方
  content: 客户状态变更(冻结→FREEZE、解冻→EFFECT、注销→WRITEOFF)通过 clientCustStatusSyncService 同步业务系统；用户状态同步
    operateType 直传
  impact: 跨系统状态一致性
  field_targets:
  - cust_company_info.cust_status
  evidence: code_path:CustCompanyInfoApplication.java:custStatusSync
reqdoc_claims:
- claim: 企业状态流转规则：待提交→审核中→已通过；已驳回→待提交(修改后重新提交)
  code_status: confirmed
  code_evidence: CustCompanyInfoApplication.java:messageNotify / updateCustBuildStatus
  action: anchor
  note: 实现为 INIT/BUILD_FAIL→CUST_CONFIRM_AWAIT→CUST_BUILDING→BUILD_SUCCESS，与文档语义一致，仅值名不同；同时存在
    AWAIT_CUST_CONFIRM(简易)分支
- claim: 自动审核：企业信息完整、未命中风控即自动通过准入
  code_status: confirmed
  code_evidence: ApplyCompanyInfoApplication.java:addCustApplyWorkFlow:autoVerifyService.asyncAuthCheck
  action: anchor
  note: 代码为触发 asyncAuthCheck 企业信息核查(异步)，非直接自动通过，实质是核查而非放行
- claim: 企业信息变更流程：创建变更记录(待提交)→提交审核→通过生效/驳回
  code_status: confirmed
  code_evidence: ApplyCompanyInfoApplication.java:custChangeApplyWorkFlow
  action: anchor
  note: 变更走 applyType=update + CUST_CHANGE + copyCustRecordData 流程数据
- claim: 已通过 → 已冻结(违规冻结) / 已注销(主动注销)
  code_status: confirmed
  code_evidence: CustCompanyInfoApplication.java:freeze / unfreeze / diable
  action: anchor
  note: cust_status EFFECT↔FREEZE↔WRITEOFF 迁移在 custStatusOperator 中校验 allowStatusList
- claim: 企业状态为已冻结或已注销时不允许变更
  code_status: uncovered
  code_evidence: CustCompanyInfoApplication.java:custStatusOperator:config.getNeedCheckInWay()
    为 TODO 空实现
  action: review
  note: 在途流程校验开关需要开启，但当前 needCheckInWay 分支未实现，变更限制未真正落地
- claim: 营业执照/法人身份证必传、文件类型与大小限制
  code_status: uncovered
  code_evidence: 未在给定链路文件中发现对应校验
  action: review
  note: 需在影像/表单校验链路确认
- claim: 用户邀请与注册流程（邀请码8位30天有效、邮件异步、SSO/AMS 同步）
  code_status: uncovered
  code_evidence: 未在给定链路文件中发现实现
  action: review
  note: 涉及 UserFacade/EmailAsyncService，属另一模块
- claim: 菜单权限过滤：code='0891344a3a4442179e98819cbe926ced' 自动过滤
  code_status: uncovered
  code_evidence: 未在给定链路文件中发现
  action: review
  note: 在权限/菜单模块，非本次建档主题
- claim: 企业名称、统一社会信用代码同一租户下唯一
  code_status: confirmed
  code_evidence: CustCompanyInfoApplication.java:importCustCompany(录入时按 certificationNo+tenant
    查重)
  action: anchor
  note: 仅针对导入录入路径校验统一社会信用代码重复；企业管理员对同租户唯一性校验路径未全见
enum_audit:
- field: cust_company_info.cust_build_status
  value: BUILDING
  java_name: BUILDING
  stored_as: same
  label: 建档中
  verdict: confirm
  evidence: CustBuildStatusEnum.java
  note: DB 仅 2 条，枚举存在但主流程几乎只用 CUST_BUILDING
- field: cust_company_info.cust_build_status
  value: CUST_BUILDING
  java_name: CUST_BUILDING
  stored_as: getDictKey/same
  label: 审核中
  verdict: confirm
  evidence: CustCompanyInfoApplication.java:messageNotify
  note: DB 2909 条，主流程提交运营中台后的真实状态
- field: cust_company_info.cust_build_status
  value: CUST_BUILD_SUCCESS
  java_name: CUST_BUILD_SUCCESS
  stored_as: same
  label: 审核通过
  verdict: reject
  evidence: CustBuildStatusEnum.java
  note: 枚举声明但 DB 仅 1 条且主流程写值点均用 BUILD_SUCCESS，疑历史遗留/未使用常量
- field: cust_company_info.cust_build_status
  value: AWAIT_CUST_CONFIRM
  java_name: AWAIT_CUST_CONFIRM
  stored_as: getDictKey/same
  label: 待客户确认
  verdict: correct
  evidence: CustCompanyInfoApplication.java:submitForSimpleAuth:setCustBuildStatus(AWAIT_CUST_CONFIRM)
  note: 与 CUST_CONFIRM_AWAIT 并存，专用于简易认证；勿混用两值
- field: cust_company_info.cust_build_status
  value: CUST_BUILD_FAIL
  java_name: CUST_BUILD_FAIL
  stored_as: same
  label: 审核拒绝
  verdict: reject
  evidence: CustBuildStatusEnum.java
  note: DB 无该值，实际失败状态用 BUILD_FAIL(6200 条)
- field: cust_company_info.cust_build_status
  value: TO_BE_BUILD
  java_name: TO_BE_BUILD
  stored_as: same
  label: 未建档
  verdict: reject
  evidence: CustBuildStatusEnum.java
  note: DB 无该值，疑似保留值
- field: cust_company_info.sign_mode
  value: ONLINE
  java_name: ON_LINE
  stored_as: 字面量/非getDictKey
  label: 线上
  verdict: reject
  evidence: SignModeEnum.java(01/02/03) vs DB ONLINE(94276)
  note: DB 真实值为 ONLINE，与枚举 getDictKey('01') 不符，说明落库未走 SignModeEnum.getDictKey，需 REVIEW
    落库规格
- field: cust_company_info.legal_certification_type
  value: 身份证
  java_name: CRET_ID
  stored_as: 中文名直写
  label: 二代居民身份证
  verdict: correct
  evidence: CustCompanyInfoApplication.java:createCustCompany:IDTypeEnum.getByDictName
    后 name() 落库
  note: DB 出现裸中文'身份证'脏值，属历史数据未按 name() 落库
- field: cust_company_info.legal_certification_type
  value: CREDENTIALS_ID
  java_name: null
  stored_as: unknown
  label: '-'
