field_semantics:
- table: cust_person_info
  field: user_type
  meaning: 联系人类型（同一企业角色下的用户身份）：accountAdmin=企业管理员、accountNormal=经办人、accountGuest=游客；查询时通常以
    user_type 过滤业务语义
  evidence: db
- table: cust_person_info
  field: status
  meaning: 联系人账号状态：ADD=新增待生效、EFFECT=生效、FREEZE=冻结（管理员被换人后旧记录置 FREEZE）
  evidence: db
- table: cust_person_info
  field: enable
  meaning: 逻辑启用标志 Y/N；管理员变更后旧记录 enable=N，退出所有按 enable=Y 的查询
  evidence: db
- table: cust_person_info
  field: cust_build_status
  meaning: 联系人维度的建档状态（与 cust_company_info.cust_build_status 同码值，另存一份）；参与 sys_cust_user_rel
    重建判定的取企业侧值
  evidence: db
- table: cust_person_info
  field: face_status
  meaning: 人脸认证结果，取值与实名认证结果共用一套码：TO_BE_VERIFIED / AUTOMATIC_AUTHENTICATION_PASSED
    / MANUAL_AUTHENTICATION_PASSED / AUTOMATIC_AUTHENTICATION_FAILED
  evidence: db
- table: cust_person_info
  field: phone_realname_status
  meaning: 手机号实名认证状态，码值同 face_status；AUTO/MANUAL_AUTHENTICATION_PASSED 时前端不再弹认证框
  evidence: db
- table: cust_person_info
  field: real_name_result
  meaning: 实名认证结果：INIT=待认证、VERIFIED_SUCCESS=认证成功、VERIFIED_FAILED=认证失败（另一套码值，勿与 phone_realname_status
    混用）
  evidence: db
- table: cust_person_info
  field: skip_auth_flag
  meaning: 跳过实名认证标识 Y/N，由 /skip/real/name/auth 写入
  evidence: db
- table: cust_person_info
  field: source
  meaning: 联系人来源：AMS=运营中台同步（新增时默认不置建档成功）、longteng=龙腾（DB 69 行，代码枚举未声明）
  evidence: db
- table: cust_person_info
  field: operator_id
  meaning: 平台分配的运营人员ID（运营中台 OperUserDTO.id，字符串），非 sys_user.id
  evidence: db
- table: cust_person_info
  field: operator
  meaning: 运营人员登录名（运营中台 userName）
  evidence: db
- table: cust_person_info
  field: operator_realname
  meaning: 运营人员真实姓名，用于批量换运营模板导出
  evidence: db
- table: cust_person_info
  field: operator_push_system
  meaning: 经办人已推送的第三方系统渠道列表：ams_finance_pc / ams_proj_pc / ams_supplier_pc / smebee_pc（对应租户产品
    targetSysChannel）
  evidence: db
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 关联企业编码（对应 cust_company_info.code），企业维度过滤主键
  evidence: db
- table: cust_person_info
  field: cust_company_id
  meaning: 冗余企业自增id（对应 cust_company_info.id），支持按 id 维度查询
  evidence: db
- table: cust_person_info
  field: user_id
  meaning: 关联登录用户id（sys_user.id），为空表示尚未开户/未同步用户中心
  evidence: db
- table: cust_person_info
  field: phone
  meaning: 手机号，落库为密文（查询需 metaDataEncryptionHandler.encryptAndBase64Str 后比较）
  evidence: code
- table: cust_person_info
  field: certification_type
  meaning: 证件类型，默认 CRET_ID；DB 存在代码枚举未声明的 CREDENTIALS_ID
  evidence: db
- table: cust_person_info
  field: auth_application
  meaning: 联系人开通产品（JSON 数组字符串）；但“联系人已开通产品”查询实际以 sys_cust_user_rel 为准，该字段非查询口径
  evidence: db
- table: cust_person_info
  field: company_type
  meaning: 联系人所属企业角色类型（CORE/SUPPLIER/FINANCE/DEALER/PROJECT_COMPANY/CORPORATION_COMPANY/PLATFORM_OPERATOR_COMPANY/CORE_MANAGER），决定管理员角色码
  evidence: db
state_machines:
- name: 联系人账号状态
  field: cust_person_info.status
  states:
  - value: ADD
    label: 新增待生效
    source: db_dist
  - value: EFFECT
    label: 生效
    source: db_dist
  - value: FREEZE
    label: 冻结
    source: db_dist
  transitions:
  - from: ''
    event: 新建联系人/法人同步为管理员（新增时置 ADD）
    to: ADD
    evidence: code_path:CustPersonApplication.java:saveFromCustLegal
  - from: EFFECT
    event: 管理员变更（旧管理员冻结：enable=N, status=FREEZE）
    to: FREEZE
    evidence: code_path:CustPersonApplication.java:ifNessaryFrzAdm
  - from: ''
    event: 生成新管理员记录
    to: EFFECT
    evidence: code_path:CustPersonApplication.java:ifNessaryFrzAdm(cpf.setStatus(CustPersonStatusConstant.EFFECT))
  - from: EFFECT
    event: 简易认证变更管理员且手机号变化
    to: FREEZE
    evidence: code_path:CustPersonApplication.java:simpleChangePerson(setStatus(CustPersonStatusConstant.FREEZE))
- name: 联系人实名认证状态
  field: cust_person_info.phone_realname_status
  states:
  - value: TO_BE_VERIFIED
    label: 待核查
    source: db_dist
  - value: AUTOMATIC_AUTHENTICATION_PASSED
    label: 自动认证通过
    source: code_enum
  - value: MANUAL_AUTHENTICATION_PASSED
    label: 人工认证通过
    source: code_enum
  - value: AUTOMATIC_AUTHENTICATION_FAILED
    label: 自动认证不通过
    source: db_dist
  transitions:
  - from: ''
    event: 新增经办人默认待核查
    to: TO_BE_VERIFIED
    evidence: code_path:CustPersonApplication.java:insertOrUpdatePerson(setPhoneRealnameStatus(TO_BE_VERIFIED))
  - from: TO_BE_VERIFIED
    event: 同租户下已存在认证通过记录，新增时继承
    to: AUTOMATIC_AUTHENTICATION_PASSED
    evidence: code_path:CustPersonApplication.java:insertOrUpdatePerson
  - from: TO_BE_VERIFIED
    event: 人工实名核验通过
    to: MANUAL_AUTHENTICATION_PASSED
    evidence: code_path:CustPersonApplication.java:updateVerifyNameStatus
  - from: AUTOMATIC_AUTHENTICATION_PASSED
    event: 运营/风控侧回写不通过
    to: AUTOMATIC_AUTHENTICATION_FAILED
    evidence: db_dist:cust_person_info.phone_realname_status
- name: 联系人实名结果
  field: cust_person_info.real_name_result
  states:
  - value: INIT
    label: 初始化/待认证
    source: db_dist
  - value: VERIFIED_SUCCESS
    label: 认证成功
    source: code_enum
  - value: VERIFIED_FAILED
    label: 认证失败
    source: db_dist
  transitions:
  - from: INIT
    event: 人脸认证回写
    to: VERIFIED_SUCCESS
    evidence: code_path:CustPersonApplication.java:updateFaceStatus
  - from: INIT
    event: 人工实名核验通过
    to: VERIFIED_SUCCESS
    evidence: code_path:CustPersonApplication.java:updateVerifyNameStatus
  - from: INIT
    event: 认证不通过
    to: VERIFIED_FAILED
    evidence: db_dist:cust_person_info.real_name_result
- name: 企业建档状态（决定管理员是否赋权）
  field: cust_person_info.cust_build_status
  states:
  - value: INIT
    label: 初始化
    source: db_dist
  - value: CUST_CONFIRM_AWAIT
    label: 待客户认证
    source: db_dist
  - value: CUST_BUILDING
    label: 审核中
    source: db_dist
  - value: BUILD_SUCCESS
    label: 认证成功
    source: db_dist
  - value: BUILD_FAIL
    label: 认证失败
    source: db_dist
  transitions:
  - from: INIT
    event: 邀请认证-客户录入/自主注册提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: INIT
    event: 邀请认证-平台录入提交
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:getCustBuildStatus
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交送运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 运营中台审核退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java:messageNotify
  - from: CUST_BUILDING
    event: 审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java:updateCustBuildStatus
  - from: ''
    event: 非 AMS 来源新增经办人直接置建档成功
    to: BUILD_SUCCESS
    evidence: code_path:CustPersonApplication.java:insertOrUpdatePerson
calibers:
- name: 有效联系人
  predicate: cust_person_info.enable = 'Y'
  scope: 所有联系人查询/管理员定位
  evidence: code:CustPersonApplication.java#listCompanyPerson/getAdminByCustCodeCompanyType
- name: 企业管理员
  predicate: cust_person_info.user_type = 'accountAdmin'
  scope: 管理员定位、管理员唯一性校验、关联重建
  evidence: db:cust_person_info.user_type 分布(55375) + code:CustPersonApplication.java#listCompanyManagerUserId
- name: 经办人
  predicate: cust_person_info.user_type = 'accountNormal'
  scope: 经办人列表、实名认证待办判定
  evidence: db:cust_person_info.user_type 分布(4205) + code:CustPersonController.java#getOperInfo
- name: 排除游客
  predicate: cust_person_info.user_type <> 'accountGuest'
  scope: 联系人分页、运营人汇总，避免游客污染列表
  evidence: code:CustPersonApplication.java#pagePerson(.ne("user_type", UserTypeEnum.guest.getDictKey()))
- name: 可参与关联重建的企业
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS'
  scope: sys_cust_user_rel 重建（含 CUST_CHANGE）
  evidence: code:CustCompanyUserRelApplication.java#processSingleCompany
- name: 已开通产品
  predicate: cust_auth_application.open_status = 'OPENED'
  scope: 关联重建、产品开通状态展示（另含 OPENING）
  evidence: code:CustCompanyUserRelApplication.java#processSingleCompany + CustCompanyQueryApplication.java#queryOpenedProductsByCompanies
- name: 未冻结的关联关系
  predicate: sys_cust_user_rel.is_freeze = 'N'
  scope: 企业删除时判断是否可清理 sys_user
  evidence: code:CustCompanyInfoApplication.java#deleteCustInfo
term_bridges:
- term: 联系人
  aliases:
  - 经办人
  - 客户联系人
  - cust_person_info
  - accountNormal
  maps_to: cust_person_info.user_type = 'accountNormal'
  also_confused_with:
  - cust_person_info.user_type = 'accountAdmin'
  - cust_person_info.user_type = 'accountGuest'
  adjudication: boundary
  boundary: cust_person_info 是表级统称（客户联系人表），“经办人”仅指 user_type=accountNormal 的行，管理员为
    accountAdmin、游客为 accountGuest；接口入参常直接叫 CustPersonInfoDO，不代表就是经办人。
- term: 管理员
  aliases:
  - 企业管理员
  - accountAdmin
  - 授权人
  maps_to: cust_person_info.user_type = 'accountAdmin'
  also_confused_with:
  - cust_person_info.operator_id
  adjudication: boundary
  boundary: 本主题的“管理员”是企业侧管理员（同一企业+角色只能有一个）；operator_id/operator/operator_realname
    指平台分派的运营人员（运营中台 OperUserDTO），是另一个实体，切勿混同。
- term: 运营人员
  aliases:
  - 运营
  - 客户经理
  - custManagerName
  - operator
  maps_to: cust_person_info.operator_id
  also_confused_with:
  - cust_person_info.user_id
  adjudication: boundary
  boundary: operator_id 来自运营中台（OperUserDTO.id），不是 sys_user.id，也不是 cust_person_info.user_id；发送邀请码/客服名片前要求
    operator_id 非空。
- term: 实名认证状态
  aliases:
  - phone_realname_status
  - face_status
  - realname_status
  maps_to: cust_person_info.phone_realname_status
  also_confused_with:
  - cust_person_info.real_name_result
  - cust_person_info.face_status
  - cust_person_info.realname_status
  adjudication: boundary
  boundary: phone_realname_status 与 face_status 共用同一套认证结果码值（TO_BE_VERIFIED/AUTO_PASSED/MANUAL_PASSED/AUTO_FAILED），real_name_result
    是另一套 INIT/VERIFIED_* 码值；DB 中 realname_status 与 phone_realname_status 并存但分布差异极大，需区分使用。
- term: 建档状态
  aliases:
  - cust_build_status
  - custBuildStatus
  maps_to: cust_person_info.cust_build_status
  also_confused_with:
  - cust_company_info.cust_build_status
  adjudication: boundary
  boundary: 同名同码值，企业表与联系人表各存一份；重建 sys_cust_user_rel 时判定用企业侧，联系人侧仅表示该联系人自身建档进度。
- term: 来源
  aliases:
  - source
  - AMS
  - longteng
  maps_to: cust_person_info.source = 'AMS'
  also_confused_with:
  - cust_person_info.user_type
  adjudication: boundary
  boundary: source 表示数据来路（AMS=运营中台同步，longteng=龙腾），不是联系人身份；代码对比用 .name()/字面量，DB 中 AMS=417、longteng=69。
rules:
- name: 企业内手机号/身份证号唯一
  content: 保存联系人前按 ref_cust_company_info 汇总存量，手机号或身份证号重复则抛“当前组织下已存在手机号【x】成员！/身份证号【x】成员！”
  impact: 新增/编辑联系人被拦截
  field_targets:
  - cust_person_info.phone
  - cust_person_info.certification_no
  - cust_person_info.ref_cust_company_info
  evidence: code_path:CustPersonApplication.java#checkBeforeSave
- name: 同企业同角色唯一管理员
  content: 统计同一 company_type + ref_cust_company_info 下 user_type=accountAdmin 且 enable=Y
    的记录数必须为 0，否则抛“当前企业已经存在该客户角色的管理员”
  impact: 管理员新增/变更前置校验
  field_targets:
  - cust_person_info.user_type
  - cust_person_info.company_type
  - cust_person_info.enable
  evidence: code_path:CustPersonApplication.java#checkBeforeSave,#updateAuthorAndApply
- name: 管理员变更走企业变更流程
  content: 仅当企业 cust_company_info.cust_status=EFFECT 时才 copyCustRecordAndStartApply
    启动变更流程；非 EFFECT 时静默不启动（不抛异常）
  impact: 冻结/注销企业无法发起管理员变更
  field_targets:
  - cust_company_info.cust_status
  evidence: code_path:CustPersonApplication.java#updateAuthorAndApply
- name: 管理员换人=冻结旧+新建
  content: isAdminChange(ext alterTypes 命中 UN0012/UN0013/UN0014) 时：旧记录 enable=N、status=FREEZE，删除其在
    sys 的角色关联，复制生成新记录（status=EFFECT, 清空 userId/userName），再绑组织与授权协议
  impact: 同一时刻只有一个有效管理员用户
  field_targets:
  - cust_person_info.enable
  - cust_person_info.status
  - cust_person_info.user_id
  evidence: code_path:CustPersonApplication.java#ifNessaryFrzAdm
- name: 简易认证换手机号即换人
  content: simpleChangePerson 中手机号变化：冻结旧管理员、删角色关联、删组织用户、新建管理员记录、绑机构并直通授权书；手机号未变时仅更新并同步登录邮箱（旧业务邮箱=登录邮箱或仅关联一个企业才同步）
  impact: 简易认证企业管理员变更路径
  field_targets:
  - cust_person_info.phone
  - cust_person_info.enable
  - cust_person_info.status
  evidence: code_path:CustPersonApplication.java#simpleChangePerson
- name: 新增经办人继承已认证信息
  content: 同 db_tenant_code 下若存在 phone_realname_status ∈ {AUTOMATIC_AUTHENTICATION_PASSED,
    MANUAL_AUTHENTICATION_PASSED} 的记录，则新经办人直接置自动认证通过 + real_name_result=VERIFIED_SUCCESS，并继承证件号/证件类型/有效期
  impact: 跨企业复用实名结果，减少重复认证
  field_targets:
  - cust_person_info.phone_realname_status
  - cust_person_info.real_name_result
  - cust_person_info.certification_no
  evidence: code_path:CustPersonApplication.java#insertOrUpdatePerson
- name: AMS 来源不置建档成功
  content: 新增经办人仅当 source ≠ AMS 时才 setCustBuildStatus(BUILD_SUCCESS)；AMS 来源交由运营中台流程驱动
  impact: 防止外部同步数据被误标为已建档
  field_targets:
  - cust_person_info.source
  - cust_person_info.cust_build_status
  evidence: code_path:CustPersonApplication.java#insertOrUpdatePerson
- name: 关联重建前置条件
  content: processSingleCompany/ reBuildSysCustUserRel 要求：企业 enable=Y、cust_build_status
    ∈ {BUILD_SUCCESS, CUST_CHANGE}、存在 open_status=OPENED 的产品、管理员 user_id>0；管理员角色码取
    custNacosProperties.getAuthUserRoleCode(companyType)，经办人固定 ROLE_CODE_NORMAL；已在关联集（productId_roleId）中则跳过
  impact: 决定 sys_cust_user_rel 是否写入
  field_targets:
  - cust_company_info.cust_build_status
  - cust_person_info.user_type
  - cust_person_info.user_id
  evidence: code_path:CustCompanyUserRelApplication.java#processSingleCompany,#reBuildSysCustUserRel
- name: 跳过实名认证白名单
  content: 仅当租户 mainTenantFlgEn=HBLT 或 company_type ∈ {CORE, PROJECT_COMPANY} 时允许置
    skip_auth_flag=Y，否则抛“不支持该角色的经办人跳过实名认证”
  impact: 限制免认证范围
  field_targets:
  - cust_person_info.skip_auth_flag
  - cust_person_info.company_type
  evidence: code_path:CustPersonController.java#skipRealNameAuth
- name: 企业状态级联到联系人
  content: 冻结企业同时冻结企业管理员；注销企业冻结全部用户并按 company_type 逐个同步用户状态
  impact: 企业级操作对联系人账号的连带影响
  field_targets:
  - cust_person_info.enable
  - cust_company_info.cust_status
  evidence: code_path:CustCompanyInfoApplication.java#freeze,#diable,#userStatusSync
- name: 发送邀请码/客服名片需先分配运营
  content: sendHaveInvitationCode 与 sendOperationQrCode 接口校验 operator_id 非空，否则提示“请先完成分配运营”。客服名片要求角色表/企业表能取到
    platformCustId 且租户配置了 customer_card_type
  impact: 运营未分配时业务不可用
  field_targets:
  - cust_person_info.operator_id
  evidence: code_path:CustPersonController.java#sendHaveInvitationCode,#sendOperationQrCode
    + CustPersonApplication.java#getCustomerOperatorQrCode
- name: 批量更换运营模板二选一
  content: batchChangeOperatorTemplateDownload 要求 operatorIds 与 projectIds 互斥（XOR），且各自勾选数量
    ≤ BATCH_CHANGE_OPERATOR_TEMPLATE_SELECTION_MAX；导入按“企业名+租户名”定位企业，同名新运营人员（>1）报错
  impact: 限制批量换运营的输入规模与歧义
  field_targets:
  - cust_person_info.operator_id
  - cust_person_info.operator_realname
  evidence: code_path:CustPersonApplication.java#batchChangeOperatorTemplateDownload,#batchChangeOperator
- name: 运营人员变更留痕
  content: 手动/批量变更运营人均调用 operChangeRecordHelper.recordOperatorChange(..., "MANUAL"/"BATCH",
    ...) 记录前后运营人员，并 asyncPushOperator2Oper 异步推送
  impact: 运营人员变更可追溯
  field_targets:
  - cust_person_info.operator_id
  - cust_person_info.operator_realname
  evidence: code_path:CustPersonApplication.java#changePersonOperator,#changeOperator,#applyBatchChangeOperatorValidatedInTx
- name: 联系人已开通产品口径
  content: queryOpenedProductsByPerson 的注释称按 cust_person_info.auth_application 过滤，但实现实际调用
    userFacade.getCustUserRelDOList(custType, companyId, userId)（sys_cust_user_rel）再换算产品码，未使用
    auth_application
  impact: 产品可见范围的真实来源是关联表而非联系人字段
  field_targets:
  - cust_person_info.auth_application
  evidence: code_path:CustCompanyQueryApplication.java#queryOpenedProductsByPerson
reqdoc_claims:
- claim: 用户邀请：管理员发起邀请→系统生成邀请码→创建用户记录（待激活状态）→异步发送邀请邮件
  code_status: refuted
  code_evidence: CustPersonApplication.java#sendHaveInvitationCodeForInviteToSign
  action: prose_only
  note: 代码中为按 personId 通过 messageProvider.sendMessage(businessType=cust_person_info,
    scenesType=invite) 发送短信/站内信；未发现“生成邀请码”与邀请邮件逻辑，也无“待激活”状态位（status 取值 ADD/EFFECT/FREEZE）。
- claim: 用户状态流转：待激活(邀请后) → 正常(注册完成) → 已冻结 → 已注销
  code_status: confirmed
  code_evidence: CustPersonApplication.java#ifNessaryFrzAdm + db_dist:cust_person_info.status
  action: prose_only
  note: 差异：实际状态值为 ADD(33167)/EFFECT(26275)/FREEZE(1170)，无独立“待激活”“已注销”值；注销通过企业侧冻结全部用户+enable=N
    表达。
- claim: 角色类型：平台管理员/企业管理员/普通用户，一个用户可拥有多个角色，角色权限取并集
  code_status: confirmed
  code_evidence: CustCompanyInfoApplication.java#endueCompanyAdminUser + CustCompanyUserRelApplication.java#processSingleCompany
  action: prose_only
  note: 差异：cust_person_info.user_type 为单值(accountAdmin/accountNormal/accountGuest)，多角色通过
    userInfoFacade.addCustUserRoleToSys(userId,custId,companyType,productCode,roleCode)
    落到 sys_cust_user_rel，按 (用户, 企业, 企业角色, 产品) 维度并存。
- claim: 管理员角色不能自我删除
  code_status: uncovered
  code_evidence: CustPersonApplication.java#adminChangeSaveOrUpdate
  action: review
  note: 代码只做“变更前后手机号不能相同”“同企业同角色唯一管理员”等校验，未见“不能自我删除”针对性校验。
- claim: 企业状态为已冻结/已注销时不允许变更
  code_status: confirmed
  code_evidence: CustPersonApplication.java#updateAuthorAndApply
  action: prose_only
  note: 差异：实现为“仅 cust_status=EFFECT 才启动变更流程”，非 EFFECT 静默跳过而非报错。
- claim: 同一变更项同时只能有一个待审核的变更申请
  code_status: confirmed
  code_evidence: CustPersonApplication.java#adminChangeSaveOrUpdate
  action: prose_only
  note: 差异：判断的是企业 cust_status=CustStatusEnum.CHANGE 这一整体在途标志，并非按单个变更项(alterType)粒度控制。
- claim: 不支持物理删除，只支持逻辑删除（冻结/注销）
  code_status: refuted
  code_evidence: CustCompanyInfoApplication.java#deleteCustInfo
  action: prose_only
  note: deleteCustInfo 对 cust_company_info / 联系人 / 项目关联 / 开通产品执行 removeById/remove
    物理删除，并清理 sys_cust_user_rel 与无关联的 sys_user；与“只支持逻辑删除”相悖。
- claim: 菜单权限：code='0891344a3a4442179e98819cbe926ced' 的菜单记录在列表中自动过滤
  code_status: uncovered
  code_evidence: ''
  action: review
  note: 提供的代码链路中未见该菜单 code 的过滤写值点。
