- claim: 企业加入项目需做角色组合校验 custRoleCombine，不合法抛『系统暂不支持该角色组合』（系统文档：2.3 角色组合校验 + BR）
  code_status: uncovered
  code_evidence: 本层代码未覆盖 TenantProductApplication#checkCustRoleCombine 与 cust_config_mapping，无从核对
  action: review
- claim: 租户产品开通状态由 ProductOpenStatusEnum 表达（PENDING/ACTIVE/CANCEL），在途校验 checkOnTheWay
    阻断激活（系统文档：2.1 租户产品开通流程）
  code_status: uncovered
  code_evidence: 本层代码未包含 TenantProductApplication/TenantProductController
  action: review
- claim: 企业关联项目入口 POST /custCompanyInfo/relateProject → CustCompanyInfoApplication#relateProject，写
