  action: anchor
- claim: 项目上线审批条件包含『标准项目』与『常规项目』区分（系统文档未明示，代码显式）
  code_status: confirmed
  code_evidence: 'ProjectApprovalApplication.java#resolveFlowCode（ProjectApprovalProjectTypeEnum.STANDARD→STANDARD
    flow；否则 REGULAR）+ #isPushToAms'
  action: anchor
