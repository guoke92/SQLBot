- field: wechat_project_approval_apply.data_source
  value: WECHAT
  java_name: DATA_SOURCE_WECHAT / EXPORT_REQUIRED_DATA_SOURCE
  stored_as: 字面量
  label: 真实立项（企微同步）
  verdict: confirm
  evidence: WechatProjectApprovalApplication.java
  note: 企微同步数据来源，与 DB 分布一致。
- field: tenant_project_approval_flow.node_status
