field_semantics:
- table: wechat_project_approval_apply
  field: act_procinst_status
  meaning: 企微审批实例状态：1=审批中，2=已通过，3/4 未在代码中显式声明（DB 分布存在）
  evidence: db
- table: wechat_project_approval_apply
  field: data_source
  meaning: 数据来源：MANUAL=模拟立项，WECHAT=真实立项（企微同步）
  evidence: code
- table: wechat_project_approval_apply
  field: prd
  meaning: 是否投产：Y=已投产，N=未投产
  evidence: code
- table: wechat_project_approval_apply
  field: ka_white_label
  meaning: KA是否贴牌：Y=是，N=否
  evidence: code
- table: wechat_project_approval_apply
  field: project_phase
  meaning: 项目阶段：INITIATION=立项阶段，IMPLEMENTATION=实施阶段，OPERATION=持续运营，HANG=挂起；历史值 TERMINATION
    归一为 HANG
  evidence: code
- table: wechat_project_approval_apply
  field: sp_type
  meaning: 类型，项目统计默认过滤金融科技业务
  evidence: code
- table: wechat_project_approval_apply
  field: system_delivery
  meaning: 系统交付方式：SaaS、Saas+本地化
  evidence: code
- table: wechat_project_approval_apply
  field: project_type
  meaning: 项目类型：MAIN=主项目，SUB=子项目
  evidence: code
- table: wechat_project_approval_apply
  field: op_contact
  meaning: 运营对接人，存储 operation_id，展示时反查姓名
  evidence: code
- table: wechat_project_approval_apply
  field: solution_manager
  meaning: 方案经理姓名，多个以逗号分隔
  evidence: code
- table: wechat_project_approval_apply
  field: solution_manager_wxid
  meaning: 方案经理企微 userId 列表的 JSON 数组字符串，如 ["id1","id2"]
  evidence: code
- table: wechat_project_approval_apply
  field: old_solution_manager
  meaning: 前方案经理，姓名 CSV，由变更入口联动维护
  evidence: code
- table: wechat_project_approval_apply
  field: first_settlement_time
  meaning: 首笔落地时间（DB 注释为首笔放款时间），审批通过后更新会联动项目阶段为持续运营
  evidence: code
- table: tenant_project_approval
  field: wf_status
  meaning: 项目上线审批工作流状态：PENDING=待发起，RUNNING=审批中，FINISHED=审批通过，TERMINATED=审批拒绝；DB 另有
    REVOKED=已撤销（代码枚举未声明）
  evidence: db
- table: tenant_project_approval_flow
  field: node_status
  meaning: 审批流程节点状态：PENDING=待审批，APPROVING=审批中，APPROVED=已通过，REJECTED=已拒绝
  evidence: code
- table: tenant_project_approval_flow_node
  field: operate_type
  meaning: 节点操作类型：PASS=同意，BACK=退回，REJECT=驳回，DELEGATE=转审
  evidence: code
- table: tenant_project_approval_flow_file
  field: catg_id
  meaning: 影像分类 ID，代码枚举含 FBP_PROJECT_CONFIG 等，DB 另有 FBP_OA_ATTACHMENT、FBP_OA_COMMENT_FILE
    未在枚举中
  evidence: db
state_machines:
- name: 企微立项审批状态
  field: wechat_project_approval_apply.act_procinst_status
  states:
  - value: '1'
    label: 审批中
    source: code_const
  - value: '2'
    label: 已通过
    source: code_const
  - value: '3'
    label: 未知
    source: db_dist
  - value: '4'
    label: 未知
    source: db_dist
  transitions: []
- name: 项目上线审批工作流状态
  field: tenant_project_approval.wf_status
  states:
  - value: PENDING
    label: 待发起
    source: code_enum
  - value: RUNNING
    label: 审批中
    source: code_enum
  - value: FINISHED
    label: 审批通过
    source: code_enum
  - value: TERMINATED
    label: 审批拒绝
    source: code_enum
  - value: REVOKED
    label: 已撤销
    source: db_dist
  transitions:
  - from: PENDING
    event: 启动工作流
    to: RUNNING
    evidence: code_path:ProjectApprovalApplication.java:startWorkflowAndUpdateStatus
  - from: RUNNING
    event: 审批通过
    to: FINISHED
    evidence: code_path:ProjectApprovalApplication.java:handleFlowAndNodeStatus
  - from: RUNNING
    event: 审批拒绝/驳回
    to: TERMINATED
    evidence: code_path:ProjectApprovalApplication.java:handleFlowAndNodeStatus
- name: 审批流程节点状态
  field: tenant_project_approval_flow.node_status
  states:
  - value: PENDING
    label: 待审批
    source: code_enum
  - value: APPROVING
    label: 审批中
    source: code_enum
  - value: APPROVED
    label: 已通过
    source: code_enum
  - value: REJECTED
    label: 已拒绝
    source: code_enum
  transitions:
  - from: PENDING
    event: 节点激活
    to: APPROVING
    evidence: code_path:ProjectOnlineProcessOperateListener.java:resolveFlowNodeStatusUpdate
  - from: APPROVING
    event: 同意
    to: APPROVED
    evidence: code_path:ProjectOnlineProcessOperateListener.java:resolveFlowNodeStatusUpdate
  - from: APPROVING
    event: 退回
    to: PENDING
    evidence: code_path:ProjectOnlineProcessOperateListener.java:resolveFlowNodeStatusUpdate
  - from: APPROVING
    event: 驳回
    to: REJECTED
    evidence: code_path:ProjectOnlineProcessOperateListener.java:resolveFlowNodeStatusUpdate
- name: 项目阶段
  field: wechat_project_approval_apply.project_phase
  states:
  - value: INITIATION
    label: 立项阶段
    source: code_const
  - value: IMPLEMENTATION
    label: 实施阶段
    source: code_const
  - value: OPERATION
    label: 持续运营
    source: code_const
  - value: HANG
    label: 挂起
    source: code_const
  transitions:
  - from: 任何
    event: 审批通过后首笔落地时间更新
    to: OPERATION
    evidence: code_path:ProjectStatisticsApplication.java:applyOperationPhaseWhenFirstSettlementUpdatedUnderApproved
  - from: TERMINATION
    event: 遗留值转换
    to: HANG
    evidence: code_path:ProjectStatisticsApplication.java:normalizeLegacyProjectPhaseCode
calibers:
- name: 企微审批导出硬过滤
  predicate: wechat_project_approval_apply.act_procinst_status = '2' AND wechat_project_approval_apply.data_source
    = 'WECHAT'
  scope: 导出企微审批申请信息
  evidence: code_path:WechatProjectApprovalApplication.java:exportWechatApprovalInfo
- name: 审批中记录
  predicate: wechat_project_approval_apply.act_procinst_status = '1'
  scope: 项目立项统计导入跳过审批中记录
  evidence: code_path:ProjectStatisticsApplication.java:validateAndApply
- name: 项目统计默认范围
  predicate: wechat_project_approval_apply.sp_type = '金融科技业务' AND wechat_project_approval_apply.system_delivery
    IN ('SaaS','Saas+本地化')
  scope: 项目立项统计列表/导出
  evidence: code_path:ProjectStatisticsApplication.java:buildPageWrapper
- name: 关联审批编号下拉
  predicate: tenant_project_approval.wf_status IN ('RUNNING','FINISHED') AND tenant_project_approval.is_online_approval
    = 'Y' AND tenant_project_approval.enable = 'Y'
  scope: 关联审批编号下拉
  evidence: code_path:ProjectApprovalApplication.java:listRelatedApprovalNo
- name: 可发起上线审批的项目
  predicate: tenant_project.project_status IN ('EFFECTIVE','INVLIAD') AND tenant_project.enable
    = 'Y'
  scope: 历史项目发起上线审批可选项目
  evidence: code_path:ProjectApprovalApplication.java:listApprovalSelectableProjects
- name: 正在审批的最新流程
  predicate: tenant_project_approval.wf_status = 'RUNNING' AND tenant_project_approval.is_latest
    = 'Y' AND tenant_project_approval.enable = 'Y'
  scope: 业务系统推送项目配置时定位审批中流程
  evidence: code_path:ProjectBusinessConfigApplication.java:findRunningApproval
- name: 正在审批的节点
  predicate: tenant_project_approval_flow.node_status = 'APPROVING' AND tenant_project_approval_flow.enable
    = 'Y'
  scope: 业务系统推送项目配置时定位当前节点
  evidence: code_path:ProjectBusinessConfigApplication.java:findApprovingFlow
term_bridges:
- term: 微企链立项
  aliases: []
  maps_to: wechat_project_approval_apply
  also_confused_with:
  - tenant_project_approval
  adjudication: boundary
  boundary: 微企链立项指企微审批申请，项目上线审批指产融平台工作流审批，两者通过 sp_no 关联但表不同。
- term: 方案经理
  aliases:
  - solution_manager
  - solution_manager_wxid
  maps_to: wechat_project_approval_apply.solution_manager
  also_confused_with:
  - tenant_project_approval.solution_manager_id
  adjudication: synonym
  boundary: 姓名与企微 ID 双存储，姓名列用于展示，wxid 列用于企微通知。
- term: 运营对接人
  aliases:
  - op_contact
  - operation_id
  maps_to: wechat_project_approval_apply.op_contact
  also_confused_with: []
  adjudication: synonym
  boundary: 库中存 operation_id，页面显示姓名。
- term: 数据来源
  aliases:
  - data_source
  maps_to: wechat_project_approval_apply.data_source
  also_confused_with: []
  adjudication: synonym
  boundary: MANUAL 模拟立项，WECHAT 真实立项。
- term: 审批状态
  aliases:
  - act_procinst_status
  - wf_status
  maps_to: wechat_project_approval_apply.act_procinst_status
  also_confused_with:
  - tenant_project_approval.wf_status
  adjudication: boundary
  boundary: act_procinst_status 是企微审批实例状态；wf_status 是产融平台项目上线审批工作流状态。
rules:
- name: 企微审批导出硬过滤
  content: 导出企微审批申请时，固定过滤 act_procinst_status=2 且 data_source=WECHAT，前端查询条件不能改写该过滤。
  impact: 确保只导出已通过的企微同步记录。
  field_targets:
  - wechat_project_approval_apply.act_procinst_status
  - wechat_project_approval_apply.data_source
  evidence: code_path:WechatProjectApprovalApplication.java:exportWechatApprovalInfo
- name: 企微审批导入仅更新
  content: 导入企微审批申请时仅允许更新已存在的审批编号，不允许新增；为空不更新，"/"置空；审批编号重复、不存在、对接人不存在、字段超长等任一校验失败则整批不更新；更新后运营对接人A或风控对接人A至少一列有值则触发下游同步。
  impact: 保证企微审批数据质量并触发下游项目配置同步。
  field_targets:
  - wechat_project_approval_apply.sp_no
  - wechat_project_approval_apply.prd
  - wechat_project_approval_apply.op_contact
  - wechat_project_approval_apply.risk_control_contact
  - wechat_project_approval_apply.comment
  evidence: code_path:WechatProjectApprovalApplication.java:validateAndImportData
- name: 项目上线审批提交规则
  content: isDraft=Y 暂存仅落库不启动工作流；isDraft=N 提交时校验审批流程节点（除方案配置外审批人必填）、必须上传商务批复报价文件，生成审批编号后启动工作流。
  impact: 保证上线审批数据完整并驱动工作流。
  field_targets:
  - tenant_project_approval.wf_status
  - tenant_project_approval.sp_no
  evidence: code_path:ProjectApprovalApplication.java:submit
- name: 重新发起上线审批复制规则
  content: 重新发起时复制原审批主记录、业务信息、流程配置和影像文件，原审批 is_latest 置 N，新审批 is_latest=Y，wf_status=PENDING。
  impact: 保留历史审批版本并生成新草稿。
  field_targets:
  - tenant_project_approval.is_latest
  - tenant_project_approval.wf_status
  - tenant_project_approval.ref_tenant_project_approval_tenant_project_approval
  evidence: code_path:ProjectApprovalApplication.java:doCreateApproval
- name: 审批通过生效项目
  content: 上线审批终态为 FINISHED 时，将审批关联的项目置为已生效（effective），并推送业务系统。
  impact: 项目生效自动化。
  field_targets:
  - tenant_project.project_status
  - tenant_project_approval.wf_status
  evidence: code_path:ProjectApprovalApplication.java:effectiveProjectOnApprovalFinished
- name: 后补合作协议触发规则
  content: 业务经理节点同意且该节点记录 is_back_agreement=Y 时，启动后补合作协议工作流。
  impact: 自动发起后补协议流程。
  field_targets:
  - tenant_project_approval_flow_node.is_back_agreement
  - tenant_project_approval_flow_node.node_code
  evidence: code_path:ProjectApprovalApplication.java:isStartBackAgreement
- name: 推送AMS规则
  content: 审批通过后，若项目类型为标准项目，或项目类型为常规项目且 is_low_risk=Y，则推送审批信息至 AMS。
  impact: 下游 AMS 系统同步审批结果。
  field_targets:
  - tenant_project_approval.project_type
  - tenant_project_approval.is_low_risk
  evidence: code_path:ProjectApprovalApplication.java:isPushToAms
- name: 方案经理批量变更部门校验
  content: 批量变更方案经理时，新方案经理姓名必须在「SaaS方案部」人员名单内，spNo 必须存在，变更写入字段历史（source=BATCH）。
  impact: 保证方案经理归属正确。
  field_targets:
  - wechat_project_approval_apply.solution_manager
  - wechat_project_approval_apply.sp_no
  evidence: code_path:ProjectStatisticsApplication.java:validateBatchChangePlanMgrRows
- name: 模拟立项规则
  content: 模拟立项 spNo 由后端生成（MN-yyyyMMdd-XXXX），dataSource 强制 MANUAL，方案经理固定为当前登录用户，写
    MANUAL_CREATE 字段历史。
  impact: 支持手工创建测试或补录立项数据。
  field_targets:
  - wechat_project_approval_apply.sp_no
  - wechat_project_approval_apply.data_source
  - wechat_project_approval_apply.solution_manager
  evidence: code_path:ProjectStatisticsApplication.java:manualCreate
- name: 项目阶段自动流转规则
  content: 审批通过后，若首笔落地时间被更新且项目阶段不是持续运营，则自动将项目阶段置为 OPERATION（持续运营）。
  impact: 项目阶段随业务进展自动推进。
  field_targets:
  - wechat_project_approval_apply.project_phase
  - wechat_project_approval_apply.first_settlement_time
  - wechat_project_approval_apply.act_procinst_status
  evidence: code_path:ProjectStatisticsApplication.java:applyOperationPhaseWhenFirstSettlementUpdatedUnderApproved
- name: 业务系统推送项目配置节点校验
  content: 业务系统推送项目运营配置时，仅当项目存在 wf_status=RUNNING 且 is_latest=Y 的上线审批，且当前节点为方案经理（PROJECT_MANAGER）或项目配置（PROJECT_CONFIG）且
    node_status=APPROVING 时才落库更新；其他节点静默成功不落库。
  impact: 控制项目配置推送时机，避免无效更新。
  field_targets:
  - tenant_project_approval.wf_status
  - tenant_project_approval.is_latest
  - tenant_project_approval_flow.node_code
  - tenant_project_approval_flow.node_status
  evidence: code_path:ProjectBusinessConfigApplication.java:savePush
reqdoc_claims: []
enum_audit:
- field: tenant_project_approval.wf_status
  value: REVOKED
  java_name: ''
  stored_as: 字面量
  label: 已撤销
  verdict: reject
  evidence: DB对账 + ProjectApprovalWorkflowStatusEnum.java
  note: 代码枚举 ProjectApprovalWorkflowStatusEnum 未包含 REVOKED，但 DB 有 18 条记录，可能由工作流撤销操作产生，需补充枚举或映射。
- field: tenant_project_approval_flow_file.catg_id
  value: FBP_OA_ATTACHMENT
  java_name: ''
  stored_as: 字面量
  label: 未知
  verdict: reject
  evidence: DB对账 + ProjectApprovalMediaCatgEnum.java
  note: 代码枚举 ProjectApprovalMediaCatgEnum 未声明 FBP_OA_ATTACHMENT，DB 有 31 条，可能来自其他模块或硬编码。
- field: tenant_project_approval_flow_file.catg_id
  value: FBP_OA_COMMENT_FILE
  java_name: ''
  stored_as: 字面量
  label: 未知
  verdict: reject
  evidence: DB对账 + ProjectApprovalMediaCatgEnum.java
  note: 代码枚举 ProjectApprovalMediaCatgEnum 未声明 FBP_OA_COMMENT_FILE，DB 有 83 条，可能来自其他模块或硬编码。
- field: wechat_project_approval_apply.act_procinst_status
  value: '1'
  java_name: ACT_PROCINST_IN_PROGRESS
  stored_as: 字面量
  label: 审批中
  verdict: confirm
  evidence: ProjectStatisticsApplication.java
  note: 代码常量用于跳过审批中记录，与 DB 分布一致。
- field: wechat_project_approval_apply.act_procinst_status
  value: '2'
  java_name: ACT_PROCINST_APPROVED / EXPORT_REQUIRED_ACT_PROCINST_STATUS
  stored_as: 字面量
  label: 已通过
  verdict: confirm
  evidence: WechatProjectApprovalApplication.java
  note: 导出固定过滤值，与 DB 分布一致。
- field: wechat_project_approval_apply.data_source
  value: MANUAL
  java_name: DATA_SOURCE_MANUAL
  stored_as: 字面量
  label: 模拟立项
  verdict: confirm
  evidence: ProjectStatisticsApplication.java
