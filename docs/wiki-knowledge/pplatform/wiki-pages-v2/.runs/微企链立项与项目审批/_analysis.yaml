- claim: 项目创建/生效/失效链路会同步至下游 client 侧（系统文档：事件 + Sync 服务保证最终一致）
  code_status: confirmed
  code_evidence: TenantProjectApplication.java#create（migratoryPointService.push PROJECT_SYNC/CREATED）、ProjectApprovalApplication.java#backfillProjectSpNoOnSubmit（PlatProjectEventType.EFFECTED）
  action: anchor
- claim: 项目审批含退回/驳回/转审等办理动作（系统文档：项目管理代码地图相关上下文）
  code_status: confirmed
  code_evidence: 'ProjectApprovalDeskApplication.java#back / #reject / #transfer /
