- name: 企业类型按 JSON 数组字符串存储
  content: custCompanyType 字段存储格式为 JSON 数组，如 ["FINANCE"] 或 ["CORE","FINANCE"]；查询时使用
    like 匹配 "FINANCE" 精确匹配类型值。
  impact: 企业角色查询、平台运营方判断、供票校验均需按 JSON 数组解析或 like 匹配。
