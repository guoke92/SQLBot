- name: 企业统一社会信用代码唯一与格式校验
  content: checkCertificationRepeat 校验 isCreditCode，查询同租户主数据中相同 certification_no，冲突则抛“已存在该企业，统一社会信用代码冲突”。
  impact: 同一租户主数据下统一社会信用代码不可重复。
