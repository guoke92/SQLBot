- name: 一个租户只能有一个平台运营方
  content: 企业角色包含 PLATFORM_OPERATOR_COMPANY 时，统计同租户 enable=Y 且排除当前 id 的记录，count>0
    则抛“一个租户只能有一个平台运营方”。
  impact: 平台运营方在租户内唯一。
