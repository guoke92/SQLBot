field_semantics:
- table: gpt_learn_poster_log
  field: id
  meaning: 智能审核引流卡片埋点记录主键，checkPosterStatus 返回给前端作为 recordId，点击时回传
  evidence: code
- table: gpt_learn_poster_log
  field: user_id
  meaning: 埋点归属用户ID（登录用户 userId，Long.valueOf(currentUser.getUserId())）
  evidence: code
- table: gpt_learn_poster_log
  field: company_id
  meaning: 埋点归属企业ID（登录企业 companyId）
  evidence: code
- table: gpt_learn_poster_log
  field: user_name
  meaning: 弹出时写入的用户真实姓名（currentUser.getRealName()），非登录账号
  evidence: code
- table: gpt_learn_poster_log
  field: company_name
  meaning: 弹出时写入的企业名称（cust_company_info.name）
  evidence: code
- table: gpt_learn_poster_log
  field: popup_time
  meaning: 卡片弹出时间；有值即视为已弹出，弹出次数统计口径
  evidence: db
- table: gpt_learn_poster_log
  field: click_time
  meaning: 卡片点击时间；recordClick 成功即写入，全表仅 252 行埋点
  evidence: db
- table: gpt_learn_poster_log
  field: db_tenant_code
  meaning: 数据租户标识；实测仅 beehive-scf.qhhrly.cn 一个值，与 isPosterAllowedTenant 灰度口径对应
  evidence: db
- table: gpt_learn_poster_log
  field: enable
  meaning: 逻辑有效标记，实测全为 Y
  evidence: db
- table: cust_survey_answer
  field: survey_code
  meaning: 问卷编码；实测全表唯一值 XYL_2024_Q1，代码链路中未见常量定义
  evidence: db
- table: cust_survey_answer
  field: question_no
  meaning: 题号（1~N）；实测 1-6 题各约 56 行
  evidence: db
- table: cust_survey_answer
  field: answer_value
  meaning: 选项明文，多选时每个选项单独一行
  evidence: db
- table: cust_survey_answer
  field: other_text
  meaning: 选项为「其他」时填写的自由文本；实测存在 '1'、'hjhh'、'饿啊讽德诵功' 等脏数据
  evidence: db
- table: cust_survey_answer
  field: company_id
  meaning: 答题企业ID（当前登录企业），与 survey_code 组成普通索引
  evidence: db
- table: cust_survey_answer
  field: user_id
  meaning: 答题用户ID（当前登录用户）
  evidence: db
- table: cust_survey_answer
  field: submit_time
  meaning: 问卷提交时间
  evidence: db
- table: cust_company_survey_state
  field: company_id
  meaning: 企业ID，问卷活动「首个访问用户」claim 的判定键
  evidence: db
- table: cust_company_survey_state
  field: respondent
  meaning: 问卷星答题人标识；实现写入的是 String.valueOf(companyId)，即企业ID字符串，并非答题人ID
  evidence: code
- table: cust_company_survey_state
  field: first_visit_time
  meaning: 企业首个用户首次访问时间
  evidence: db
- table: cust_company_survey_state
  field: first_visitor_lottery_shown
  meaning: 首个用户转盘抽奖是否已展示（Y/N）；实测 11 行全为 Y，无 N 样本
  evidence: db
- table: cust_company_survey_state
  field: db_tenant_code
  meaning: 数据租户标识；实测 all(10) 与 LN1(1) 并存，与代码强制 setDbTenantCode("all") 存在不一致样本
  evidence: db
- table: cust_company_survey_whitelist
  field: company_id
  meaning: 参与问卷活动白名单的企业ID（isParticipating 判定键）
  evidence: code
- table: cust_company_survey_whitelist
  field: company_name
  meaning: 白名单企业名称；实测 11 家，含「测试抽奖企业」系列测试数据
  evidence: db
- table: cust_company_survey_whitelist
  field: enable
  meaning: 白名单有效标记，实测全为 Y
  evidence: db
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色，JSON 数组字符串（如 ["FINANCE"]）；GP学习引流要求必须为 FINANCE，代码用 CustCompanyTypeEnum.FINANCE.getDictKey()
    比较
  evidence: code
- table: cust_company_info
  field: name
  meaning: 企业名称，被写入 gpt_learn_poster_log.company_name 与 cust_company_survey_whitelist.company_name
  evidence: code
state_machines:
- name: 问卷星活动首页展示场景（非落库，接口返回的展示决策）
  field: WenjuanHomeDisplayConfigDTO.displayScene
  states:
  - value: NONE
    label: 不展示任何活动UI
    source: code_enum
  - value: FIRST_VISITOR_LOTTERY
    label: 转盘抽奖+中奖弹窗+右下角问卷入口
    source: code_enum
  - value: GUIDE_ONLY
    label: 指引弹窗+右下角问卷入口
    source: code_enum
  transitions:
  - from: NONE
    event: 活动未配置 / userId或companyId为空 / 企业不在白名单
    to: NONE
    evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay
  - from: NONE
    event: 白名单企业但非企业首个访问用户
    to: NONE
    evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay
  - from: NONE
    event: 白名单企业 + 首个访问用户 + 转盘未展示
    to: FIRST_VISITOR_LOTTERY
    evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay
  - from: FIRST_VISITOR_LOTTERY
    event: 前端动效结束调用 /cust-web/wenjuan/mark-lottery-shown
    to: GUIDE_ONLY
    evidence: code_path:WenjuanController.java:markLotteryShown + WenjuanDisplayService.java:markLotteryShown
  - from: FIRST_VISITOR_LOTTERY
    event: 转盘已展示且问卷星 isSurveyCompleted=true（只留右下角入口，不弹指引）
    to: GUIDE_ONLY
    evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay
- name: 首个用户转盘抽奖展示标记
  field: cust_company_survey_state.first_visitor_lottery_shown
  states:
  - value: Y
    label: 已展示（防刷新重复）
    source: db_dist
  - value: N
    label: 未展示（初始态，代码仅单向置 Y，DB 未观测到 N 样本）
    source: code_const
  transitions:
  - from: N
    event: POST /cust-web/wenjuan/mark-lottery-shown（异步线程执行，先 setDbTenantCode(all)）
    to: Y
    evidence: code_path:WenjuanController.java:markLotteryShown + WenjuanDisplayService.java:markLotteryShown
- name: 智能审核引流卡片埋点生命周期
  field: gpt_learn_poster_log.popup_time / gpt_learn_poster_log.click_time
  states:
  - value: INIT
    label: 未评估
    source: code_const
  - value: NOT_SHOW
    label: 不弹出（非金融机构 / 租户不允许 / 已达弹出上限）
    source: code_const
  - value: SHOWN
    label: 已弹出并落埋点（popup_time 有值）
    source: code_const
  - value: CLICKED
    label: 已点击（click_time 有值）
    source: code_const
  transitions:
  - from: INIT
    event: 企业类型非 CustCompanyTypeEnum.FINANCE（validateFinanceUser 抛「仅金融机构用户可使用」）
    to: NOT_SHOW
    evidence: code_path:GptLearnService.java:validateFinanceUser
  - from: INIT
    event: isPosterAllowedTenant(dbTenantCode)=false
    to: NOT_SHOW
    evidence: code_path:GptLearnService.java:checkPosterStatus
  - from: INIT
    event: countByUserAndCompany(userId,companyId) >= maxPosterCount
    to: NOT_SHOW
    evidence: code_path:GptLearnService.java:checkPosterStatus
  - from: INIT
    event: 校验通过，createPopupRecord 写入 gpt_learn_poster_log(popup_time)
    to: SHOWN
    evidence: code_path:GptLearnService.java:checkPosterStatus
  - from: SHOWN
    event: POST /app-web/gptlearn/recordPosterClick(recordId) 且 recordId+userId+companyId
      匹配成功
    to: CLICKED
    evidence: code_path:GptLearnService.java:recordPosterClick
  - from: SHOWN
    event: recordClick 未匹配（抛「埋点记录不存在或已记录点击」）
    to: SHOWN
    evidence: code_path:GptLearnService.java:recordPosterClick
calibers:
- name: 问卷活动参与企业白名单
  predicate: cust_company_survey_whitelist.enable = 'Y'
  scope: WenjuanDisplayService.isParticipating(companyId) 判定是否展示活动与获取专属答题链接
  evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay + db:cust_company_survey_whitelist.enable
    全 Y（11 行）
- name: 引流卡片埋点有效记录
  predicate: gpt_learn_poster_log.enable = 'Y'
  scope: 弹出次数统计 countByUserAndCompany 与点击记录 recordClick
  evidence: code_path:GptLearnService.java:checkPosterStatus + db:gpt_learn_poster_log.enable
    全 Y（252 行）
- name: 调研答案有效记录
  predicate: cust_survey_answer.enable = 'Y'
  scope: 调研问卷答案查询
  evidence: db:cust_survey_answer.enable 全 Y（338 行）
- name: 问卷活动数据跨租户口径（all）
  predicate: cust_company_survey_state.db_tenant_code = 'all'
  scope: 问卷活动首个访问用户 claim 与抽奖标记读写前强制 MetaDataThreadLocalConfig.setDbTenantCode("all")
  evidence: code_path:WenjuanController.java:markLotteryShown + WenjuanDisplayService.java:resolveHomeDisplay
    + db:cust_company_survey_state.db_tenant_code all=10
- name: 调研答案跨租户口径（all）
  predicate: cust_survey_answer.db_tenant_code = 'all'
  scope: 调研问卷答案为全租户统一数据
  evidence: db:cust_survey_answer.db_tenant_code 唯一值 all（338 行）
- name: 当前唯一在用问卷
  predicate: cust_survey_answer.survey_code = 'XYL_2024_Q1'
  scope: 调研问卷答案范围（代码中未常量定义，属数据驱动）
  evidence: db:cust_survey_answer.survey_code 唯一值 XYL_2024_Q1（338 行）
term_bridges:
- term: 问卷（两套并存）
  aliases:
  - Wenjuan
  - 问卷星活动
  - Survey
  - 调研问卷
  - 调研答案
  maps_to: cust_survey_answer.survey_code
  also_confused_with:
  - cust_company_survey_state.company_id
  - cust_company_survey_whitelist.company_id
  adjudication: boundary
  boundary: CustSurveyController(/cust-web/survey) 走落库题库问卷，答案写 cust_survey_answer；WenjuanController(/cust-web/wenjuan)
    走外部问卷星，答卷完成态不落库，只落企业级活动状态 cust_company_survey_state。两者互不读写。
- term: respondent（受访者）
  aliases:
  - 答题人
  - 受访人
  maps_to: cust_company_survey_state.respondent
  also_confused_with:
  - cust_company_survey_state.company_id
  adjudication: boundary
  boundary: 字段名像个人，实际写入 String.valueOf(companyId)，存的是企业ID；DB 值形如 1993860367081840641，与
    snowflake 企业ID量级一致，不能当作答题用户ID使用。
- term: 企业首个访问用户
  aliases:
  - firstVisitor
  - first_visitor_user_id
  - claimFirstVisitor
  maps_to: cust_company_survey_state.company_id
  also_confused_with:
  - cust_survey_answer.user_id
  adjudication: boundary
  boundary: 「首个用户」由 claimFirstVisitor(companyId,userId,respondent,dbTenantCode) 动态判定，当前可见表结构中未出现独立的
    first_visitor_user_id 列（表结构在该列后截断），判定结果不落用户字段，仅落 first_visitor_lottery_shown；与
    cust_survey_answer.user_id（答题人）不同概念。
- term: GP学习 / 智能审核引流
  aliases:
  - GptLearn
  - 引流卡片
  - 智能审核
  - saas中登
  maps_to: gpt_learn_poster_log.id
  also_confused_with:
  - cust_company_survey_state.company_id
  adjudication: boundary
  boundary: 非在线学习业务，实为向外部 SaaS 中登同步登录信息并引流跳转的埋点链路（recordId 即 gpt_learn_poster_log.id），仅对
    FINANCE 企业开放。
- term: 企业画像 / Profile
  aliases:
  - profile-web
  - 性能测试接口
  maps_to: cust_company_info.id
  also_confused_with:
  - gpt_learn_poster_log.company_id
  adjudication: boundary
  boundary: ProfileController 的 @Api 标注为「性能测试接口」，路径 /profile-web/，仅提供取企业简要信息、按 dbTenantCode
    取租户、分页用户、取 token 四个测试能力；代码链路中不存在画像标签/画像表/画像计算实现，主题名与实际实现不符。
rules:
- name: GP学习/智能审核引流仅限金融机构用户
  content: syncLoginInfo / checkPosterStatus / recordPosterClick 入口均先执行 validateFinanceUser：currentUser
    非空且 companyType 必须等于 CustCompanyTypeEnum.FINANCE.getDictKey()，否则抛「仅金融机构用户可使用」；企业信息不存在抛「企业信息不存在」
  impact: 非 FINANCE 企业用户调用引流接口直接失败，不产生埋点
  field_targets:
  - cust_company_info.cust_company_type
  evidence: code_path:GptLearnService.java:validateFinanceUser + GptLearnService.java:checkPosterStatus
- name: 引流卡片弹出次数上限
  content: 同一 user_id + company_id 的埋点记录数 >= gptLearnProperties.getMaxPosterCount()
    时返回 notShow，不再创建弹出记录
  impact: 控制打扰频次，决定是否新增 gpt_learn_poster_log 行
  field_targets:
  - gpt_learn_poster_log.user_id
  - gpt_learn_poster_log.company_id
  - gpt_learn_poster_log.popup_time
  evidence: code_path:GptLearnService.java:checkPosterStatus + GptLearnPosterLogDao.countByUserAndCompany
- name: 引流卡片仅白名单租户可弹
  content: isPosterAllowedTenant(companyInfo.getDbTenantCode()) 为 false 时直接 notShow
  impact: 按 db_tenant_code 灰度投放引流卡片；DB 实测埋点仅落在 beehive-scf.qhhrly.cn
  field_targets:
  - gpt_learn_poster_log.db_tenant_code
  evidence: code_path:GptLearnService.java:checkPosterStatus + db:gpt_learn_poster_log.db_tenant_code
- name: 问卷活动仅白名单企业参与
  content: companySurveyWhitelistDao.isParticipating(companyId) 为 false 时首页返回 NONE；getSurveyUrl
    时抛「企业不在白名单列表中！」
  impact: 控制活动可见范围与专属答题链接获取
  field_targets:
  - cust_company_survey_whitelist.company_id
  - cust_company_survey_whitelist.enable
  evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay + WenjuanDisplayService.java:getSurveyUrl
- name: 仅企业首个访问用户可见活动UI
  content: claimFirstVisitor 判定 isFirstVisitor；非首个访问用户时 displayScene 固定 NONE（不展示抽奖、指引、右下角入口）
  impact: 同企业其他用户不展示任何活动 UI
  field_targets:
  - cust_company_survey_state.company_id
  evidence: code_path:WenjuanDisplayService.java:resolveHomeDisplay
- name: 答卷完成态不落库，实时调问卷星
  content: syncAndResolve 即 resolveHomeDisplay，每次实时调 wenjuanOpenApiClient.isSurveyCompleted(respondent)；接口注释明确「答卷状态不落库」
  impact: cust_company_survey_state 中不存在问卷完成态字段，本地无法离线判断完成情况
  field_targets:
  - cust_company_survey_state.company_id
  evidence: code_path:WenjuanController.java:syncAndDisplayConfig + WenjuanDisplayService.java:syncAndResolve
- name: 转盘抽奖防刷新重复（幂等标记）
  content: mark-lottery-shown 先 setDbTenantCode(all)，再异步执行 markFirstVisitorLotteryShownIfMatch(userId,
    companyId) 将 first_visitor_lottery_shown 置 Y（仅匹配当前企业首个用户）
  impact: 刷新首页不重复展示转盘；DB 实测该字段 11 行全为 Y
  field_targets:
  - cust_company_survey_state.first_visitor_lottery_shown
  evidence: code_path:WenjuanController.java:markLotteryShown + WenjuanDisplayService.java:markLotteryShown
    + db:cust_company_survey_state.first_visitor_lottery_shown
- name: 问卷活动留首页策略
  content: shouldStayOnHomeForGotoProduct：活动有效 + 企业在白名单 + 问卷未完成 + 当前用户为企业首个访问用户时，gotoProduct
    不自动跳转默认业务产品
  impact: 首个访问用户被停留在产融首页以完成问卷
  field_targets:
  - cust_company_survey_state.company_id
  - cust_company_survey_whitelist.company_id
  evidence: code_path:WenjuanDisplayService.java:shouldStayOnHomeForGotoProduct
- name: 问卷活动数据跨租户兜底(all)
  content: WenjuanController.markLotteryShown/surveyUrl 与 WenjuanDisplayService.resolveHomeDisplay/shouldStayOnHomeForGotoProduct
    均先 MetaDataThreadLocalConfig.setDbTenantCode("all")
  impact: 问卷活动状态与答案不按租户隔离；DB 实测 cust_company_survey_state 仍有 1 行 db_tenant_code=LN1，存在与代码口径不一致的历史数据
  field_targets:
  - cust_company_survey_state.db_tenant_code
  - cust_survey_answer.db_tenant_code
  evidence: code_path:WenjuanController.java:markLotteryShown + db:cust_company_survey_state.db_tenant_code（all=10,
    LN1=1）
- name: 调研问卷答案落库路径未在本链路给出（REVIEW）
  content: CustSurveyController.submit 调用 custSurveyAnswerService.submit(req, companyId,
    userId)，checkPopup 调用 checkPopup(companyId, currentCompanyType)；apaas 侧 CustSurveyAnswerService
    仅提供通用 BaseService/查询 helper，无 submit/checkPopup 实现，写值点与 answer_value/other_text/question_no
    的赋值逻辑无法核对
  impact: cust_survey_answer 338 行数据字段填充规则不可验证，checkPopup 的「已过期或已填写则不弹」判定逻辑不可验证
  field_targets:
  - cust_survey_answer.answer_value
  - cust_survey_answer.other_text
  - cust_survey_answer.question_no
  - cust_survey_answer.submit_time
  evidence: code_path:CustSurveyController.java:submit + pplatform-apaas-service/CustSurveyAnswerService.java
    + db:cust_survey_answer 338 行（survey_code 恒 XYL_2024_Q1）
reqdoc_claims:
- claim: 需求/系统文档层（客户管理平台业务规则文档、运营配置管理业务规则文档）通篇未出现 GP学习引流、问卷星活动、企业画像（Profile）的任何业务规则或流程表述，无法形成双源锚点
  code_status: uncovered
  code_evidence: GptLearnService.java:checkPosterStatus;WenjuanDisplayService.java:resolveHomeDisplay;ProfileController.java:getAppId
  action: review
enum_audit:
- field: cust_company_survey_state.first_visitor_lottery_shown
  value: Y
  java_name: (字面量 'Y'，无枚举类)
  stored_as: 字面量 Y
  label: 首个用户转盘抽奖已展示
  verdict: confirm
  evidence: code_path:WenjuanDisplayService.java:markLotteryShown + db:cust_company_survey_state.first_visitor_lottery_shown
    全 Y（11 行）
  note: DB 无 N 样本，N 仅由代码语义推断；写出点为 markFirstVisitorLotteryShownIfMatch，非 getDictKey
    统一字典
- field: cust_company_survey_state.db_tenant_code
  value: LN1
  java_name: (无)
  stored_as: 字面量 LN1
  label: 非活动兜底租户样本
  verdict: correct
  evidence: db:cust_company_survey_state.db_tenant_code LN1=1
  note: 代码在 Wenjuan 链路强制 setDbTenantCode("all")，该行属口径外历史/异常数据，需人工核实
- field: gpt_learn_poster_log.enable
  value: Y
  java_name: (DB default 'Y')
  stored_as: 数据库默认值
  label: 有效埋点记录
  verdict: confirm
  evidence: db:gpt_learn_poster_log.enable 全 Y（252 行）
  note: 代码链路无显式 enable 赋值，依赖建表默认值
- field: WenjuanHomeDisplayConfigDTO.displayScene
  value: NONE
  java_name: WenjuanDisplaySceneEnum.NONE
  stored_as: 不落库（DTO 枚举序列化）
  label: 不展示活动UI
  verdict: confirm
  evidence: code_path:WenjuanDisplayService.java:emptyConfig
