- name: 同一企业同一客户角色仅一个管理员
  content: checkBeforeSave/updateAuthorAndApply 统计同 refCustCompanyInfo、companyType、enable=Y、userType=admin
    且排除当前 id 的记录，count>0 则抛“当前企业已经存在该客户角色的管理员”。
  impact: 管理员在客户角色维度唯一。
