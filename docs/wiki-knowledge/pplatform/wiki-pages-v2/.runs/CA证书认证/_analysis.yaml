field_semantics:
- table: ca_certification_info
  field: cust_id
  meaning: 报数主体企业id（产融 cust_company_info.id）；head_company_data='Y' 行取总公司 cust_head_company_info.id
  evidence: code
- table: ca_certification_info
  field: cust_type
  meaning: 客户类型，代码落库值恒为字面量 COMPANY（CUST_TYPE_COMPANY），非数字字典键
  evidence: db
- table: ca_certification_info
  field: data_source
  meaning: 数据来源，.name() 落库：OPERATION_PLATFORM（运营中台推送）/ FBP_PORTAL（产融门户一证四步）/ CHANNEL_OPENAPI（开放渠道）
  evidence: db
- table: ca_certification_info
  field: data_date
  meaning: 数据日期 yyyyMMdd；createOrGetByKey 缺省取当天，CaActivationApplication 的 resolvePersistRowDataDate
    已定义但无调用点
  evidence: code
- table: ca_certification_info
  field: head_company_data
  meaning: 是否总公司行：Y=总公司主体行（来源 head_company_info），N=本企业/分公司自身行；用字面量 'Y'/'N' 写入
  evidence: db
- table: ca_certification_info
  field: op_type
  meaning: 操作类型，代码仅写 INSERT（OP_TYPE_INSERT），UPDATE 未使用
  evidence: db
- table: ca_certification_info
  field: submit_status
  meaning: 上送签章中台（cbsSubmitBizData）状态，.name() 落库 PENDING/SUCCESS/FAIL
  evidence: db
- table: ca_certification_info
  field: batch_no
  meaning: 批次流水号 INC_<yyyyMMddHHmmssSSS>_<6位hex>；已不再进入幂等键，总/分公司两行各自独立
  evidence: code
- table: ca_certification_info
  field: notify_agreement_json
  meaning: 协议告知留痕：CfcaNotifyAgreementItemDto 列表序列化为 JSONArray（固定数组结构）
  evidence: code
- table: ca_certification_info
  field: enterprise_four_json
  meaning: 企业实名核验 JSON；四要素(ENTERPRISE_FOUR)与企业三要素(ENTERPRISE_THREE)共用本列
  evidence: code
- table: ca_certification_info
  field: police_two_json
  meaning: 被授权人公安二要素（POLICE_TWO）核验 JSON（含请求/响应快照）
  evidence: code
- table: ca_certification_info
  field: intent_sms_json
  meaning: 短信意愿（SMS_CODE）留痕 JSON
  evidence: code
- table: ca_certification_info
  field: intent_h_face_json
  meaning: H5 刷脸意愿（H5_FACE）留痕 JSON，含 similarity / videoPath
  evidence: code
- table: ca_certification_info
  field: file_refs_json
  meaning: 附件引用：embeddedFiles[{multipartField,path}]，上送前 path 临时转 HTTP 下载链，库内保留 COS
    key
  evidence: code
- table: ca_certification_info
  field: sign_platform_result
  meaning: 签章中台上送的请求+响应（或异常）原文，用于事后回查
  evidence: code
- table: ca_certification_info
  field: submit_time
  meaning: 上送签章中台完成时间（writeSubmitResult 写入）
  evidence: code
- table: ca_certification_info
  field: enable
  meaning: 逻辑有效标识，创建恒为 Y
  evidence: db
- table: ca_cfca_upgrade_report
  field: authorized_user_name
  meaning: CA 升级授权书被授权人姓名
  evidence: db
- table: ca_cfca_upgrade_report
  field: company_type
  meaning: 企业角色（CORE/SUPPLIER/FINANCE/PLATFORM_COMPANY 等）
  evidence: db
- table: ca_cfca_upgrade_report
  field: source_system
  meaning: 升级授权书影像来源系统（ACFLOW/RVSFACTOR_PC/ORDER/国内信用证）
  evidence: db
- table: ca_cfca_upgrade_report
  field: biz_module
  meaning: 业务模块标识，实际存在 CFCA_CA_UPGRADE 与中文 CFCA证书升级 两种写法
  evidence: db
- table: ca_cfca_upgrade_report
  field: todo_triggered
  meaning: 是否已触发待办/消息 Y/N
  evidence: db
- table: cust_company_info
  field: ca_register_status
  meaning: CFCA 数字证书注册状态（Y=已注册/N=未注册/P=处理中），签章中台失效时被回写为 N
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通 CA 的意愿位，N 时直接判定无需开通
  evidence: code
state_machines:
- name: CA 签章中台上送状态
  field: ca_certification_info.submit_status
  states:
  - value: PENDING
    label: 待上送
    source: code_enum
  - value: SUCCESS
    label: 上送成功
    source: code_enum
  - value: FAIL
    label: 上送失败
    source: code_enum
  transitions:
  - from: PENDING
    event: cbsSubmitBizData 返回 DBaaS code in {0,200} 且 biz.status=SAVED
    to: SUCCESS
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter/writeSubmitResult
  - from: PENDING
    event: cbsSubmitBizData 抛异常或业务体非 SAVED
    to: FAIL
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter/writeSubmitResult
  - from: PENDING
    event: markFailed 人工/补偿置失败
    to: FAIL
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#markFailed
  - from: SUCCESS
    event: 再次 submitToSignCenter（幂等短路，不重复上送）
    to: SUCCESS
    evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter（CA_CERT_SUBMIT_ALREADY_SUCCESS）
  - from: SUCCESS
    event: 短信意愿再次落库（拒绝）
    to: SUCCESS
    evidence: code_path:CaCertificationIntentSmsApplication.java#persistIntentSmsAfterVerify
- name: 企业 CA 注册状态
  field: cust_company_info.ca_register_status
  states:
  - value: Y
    label: 已注册
    source: code_enum
  - value: N
    label: 未注册
    source: code_enum
  - value: P
    label: 处理中
    source: code_enum
  transitions:
  - from: N
    event: custDocFacade.openCa / cbsCompanyRegister 注册成功
    to: Y
    evidence: code_path:CaActivationApplication.java#activateByOpCompanyId（第 5 步注释）；CaCertificationConfirmApplication.java#confirm
  - from: P
    event: 注册成功回写
    to: Y
    evidence: code_path:CaCertificationConfirmApplication.java#confirm（读取 caRegisterStatus）
  - from: Y
    event: pre4Step 预检发现证书 CANCELLED/EXPIRED/FAIL 或中台登记企业名与库中不一致
    to: N
    evidence: code_path:CaCertificationPreCheckApplication.java#resetCaRegisterStatusToN
  - from: Y
    event: caEval.isInvalid() 时局部视为未开通（仅内存，不落库）
    to: N
    evidence: code_path:CaOpenCaApplication.java#isOpenCa
- name: 签章中台证书状态（外部态归一化，非落库字段）
  field: cfca_sign_center.cert_status
  states:
  - value: NORMAL
    label: 正常
    source: code_const
  - value: APPLYING
    label: 申请中
    source: code_const
  - value: CANCELLED
    label: 注销/作废（含未注册记录按失效处理）
    source: code_const
  - value: EXPIRED
    label: 到期失效
    source: code_const
  - value: FAIL
    label: 申请失败
    source: code_const
  - value: UNKNOWN
    label: 未知/查询失败
    source: code_const
  transitions: []
  note: 由 mapSignCenterStatus 把中台 SUCCESS/NEW_APPLY/INVALID/TIME_OUT 等归一到上述集合（CaCertificationPreCheckApplication），不落
    ca_certification_info 列
calibers:
- name: 运营中台推送来源口径
  predicate: ca_certification_info.data_source = 'OPERATION_PLATFORM'
  scope: 运营中台 notifyActivateCa 主动通知触发的 CA 落库行（db 分布 453）
  evidence: code_path:CaActivationApplication.java#persistActivateData + db_dist:OPERATION_PLATFORM=453
- name: 产融门户一证四步来源口径
  predicate: ca_certification_info.data_source = 'FBP_PORTAL'
  scope: 门户 /cust-web/ca/realName/verify 落库行（db 分布 865）
  evidence: code_path:CaCertificationRealNameApplication.java#initCertificationRow
    + db_dist:FBP_PORTAL=865
- name: 开放渠道来源口径（免意愿校验）
  predicate: ca_certification_info.data_source = 'CHANNEL_OPENAPI'
  scope: assertCompleteForSubmit 对本来源跳过 intent_sms_json/intent_h_face_json 必填校验
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#assertCompleteForSubmit
    + db_dist:CHANNEL_OPENAPI=49
- name: 增量落库幂等键
  predicate: ca_certification_info.submit_status = 'PENDING'
  scope: 幂等命中条件为 (cust_id, data_date, head_company_data, submit_status=PENDING)；batch_no
    不参与；因此跨日重发会产生新行
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#createOrGetByKey
- name: 总公司主体行口径
  predicate: ca_certification_info.head_company_data = 'Y'
  scope: 分公司场景下以总公司四要素落库的独立行（db 分布 101/1367）
  evidence: code_path:CaCertificationHeadCompanySupport.java + db_dist:Y=101
- name: 存量打包企业口径
  predicate: cust_company_info.ca_register_status = 'Y'
  scope: 同时要求 enable='Y'、update_time >= since、identify_style != 'SIMPLE'（简易认证不打包）；指定
    custIds 时改为内存过滤
  evidence: code_path:CfcaOneCertFourStepPackageApplication.java#queryEligibleCompanies
- name: 需开通 CFCA 判定口径
  predicate: cust_company_info.need_register_ca = 'Y'
  scope: 且 ca_register_status in ('N','P') 或签章中台判定 CA 失效；否则 needOpenCa=N
  evidence: code_path:CaOpenCaApplication.java#isOpenCa
- name: 上送完成口径
  predicate: ca_certification_info.submit_status = 'SUCCESS'
  scope: AMS 复用数据时取最新一条 SUCCESS 行重新组装上报（findLatestSuccessRow）
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#findLatestSuccessRow
- name: 一证四步上送完整性口径
  predicate: ca_certification_info.notify_agreement_json != null
  scope: 且（enterprise_four_json 或 police_two_json 至少一项）且（intent_sms_json 或 intent_h_face_json
    至少一项，CHANNEL_OPENAPI 除外）且 file_refs_json 非空
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#assertCompleteForSubmit
term_bridges:
- term: CA（数字证书）
  aliases:
  - CFCA
  - 一证四步
  - 电子签章开通
  maps_to: cust_company_info.ca_register_status
  also_confused_with:
  - cust_company_info.bs_register_status（上上签/BS）
  adjudication: boundary
  boundary: need_register_ca/ca_register_status 属 CFCA 数字证书；need_register_bs/bs_register_status
    属另一签章渠道，二者在 isOpenCa 中分别组装 serviceKeys（DATA_SOURCE_CFCA_AUTH / DATA_SOURCE_BS_AUTH），不可互换
- term: 协议告知
  aliases:
  - notifyAgreementList
  - notify_agreement_json
  maps_to: ca_certification_info.notify_agreement_json
  also_confused_with:
  - ca_certification_info.file_refs_json
  adjudication: boundary
  boundary: 协议告知是留痕 JSON 数组；同一条协议的文件路径另有 embeddedFiles 映射进 file_refs_json，两者通过 serviceKey/agreementUrl
    关联但不共列
- term: 企业实名四要素
  aliases:
  - ENTERPRISE_FOUR
  - 企业三要素 ENTERPRISE_THREE
  maps_to: ca_certification_info.enterprise_four_json
  also_confused_with:
  - ca_certification_info.police_two_json
  adjudication: boundary
  boundary: 四要素与三要素在 updateRealNameByMethod 中同样落到 enterprise_four_json（靠 verifyMethod
    区分），个人侧公安二要素落 police_two_json
- term: 被授权人
  aliases:
  - authPerson
  - 经办人
  - 管理员
  maps_to: cust_person_info.user_type
  also_confused_with:
  - 法人 cust_company_info.legal_name
  adjudication: boundary
  boundary: 被授权人取 cust_person_info（user_type=admin + enable=Y + companyType=登录角色）；法人为
    cust_company_info 法人三件套，H5 刷脸意愿优先取法人命中数据，公安二要素取被授权人
- term: 总公司行
  aliases:
  - headCompanyData=Y
  - head_company_data
  maps_to: ca_certification_info.head_company_data
  also_confused_with:
  - ca_certification_info.cust_id
  adjudication: boundary
  boundary: Y 行 cust_id 是总公司 id（cust_head_company_info.id），不是分公司 cust_company_info.id；N/Y
    两行靠 cust_id+data_date+batch_no+head_company_data 共同定位
- term: CA 升级授权书
  aliases:
  - CaUpgradeAuth
  - otherAgreementFile1
  maps_to: ca_certification_info.file_refs_json
  also_confused_with:
  - CFCA_Auth（数字证书服务协议，agreementFile1）
  adjudication: boundary
  boundary: 两者 serviceKey 不同（CaUpgradeAuth vs CFCA_Auth），在 notify_agreement_json 的
    data.service_key 与 embeddedFiles.multipartField 上分别落位，filterUpgradeAuthContracts
    还需排除 CFCA_Auth 文件
- term: 签章中台证书状态
  aliases:
  - certStatus
  - rawCertStatus
  maps_to: cust_company_info.ca_register_status
  also_confused_with:
  - ca_certification_info.submit_status
  adjudication: boundary
  boundary: 中台 NORMAL/APPLYING 视为产融 ca_register_status 有效；CANCELLED/EXPIRED/FAIL 触发回写
    N；submit_status 只描述本系统到中台的一次上送，不代表证书生命周期
- term: 批次号
  aliases:
  - batch_no
  - data_date
  maps_to: ca_certification_info.batch_no
  also_confused_with:
  - ca_certification_info.data_date
  adjudication: boundary
  boundary: batch_no 是每次新建行的唯一流水号（INC_ 前缀），已从幂等键移除；幂等只依赖 cust_id+data_date+head_company_data+PENDING
rules:
- name: 增量幂等建行
  content: createOrGetByKey 以 (cust_id, data_date, head_company_data, submit_status='PENDING')
    命中即复用已有行，未命中才新建并生成 batch_no；batchNo 不再进入幂等键
  impact: 重复触发不产生重复行；跨天重发会产生新行
  field_targets:
  - ca_certification_info.cust_id
  - ca_certification_info.data_date
  - ca_certification_info.head_company_data
  - ca_certification_info.submit_status
  - ca_certification_info.batch_no
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#createOrGetByKey
- name: 上送幂等短路
  content: submit_status=SUCCESS 的行再次 submitToSignCenter 直接返回成功，不重复调用 cbsSubmitBizData
  impact: 协议确认页可重复点击
  field_targets:
  - ca_certification_info.submit_status
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitToSignCenter
- name: 上送前完整性校验
  content: notify_agreement_json 必填、实名 JSON 至少一项、意愿 JSON 至少一项（CHANNEL_OPENAPI 免）、file_refs_json
    必填
  impact: 缺项时抛 CA_CERT_INFO_INCOMPLETE 阻断上送
  field_targets:
  - ca_certification_info.notify_agreement_json
  - ca_certification_info.enterprise_four_json
  - ca_certification_info.police_two_json
  - ca_certification_info.intent_sms_json
  - ca_certification_info.intent_h_face_json
  - ca_certification_info.file_refs_json
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#assertCompleteForSubmit
- name: 协议确认只上送本企业行
  content: CaCertificationConfirmApplication.confirm 中总公司行 submitOrThrow 被注释，仅上送 head_company_data='N'
    主行；与类 Javadoc「先总后分」表述不一致
  impact: 分公司场景总公司行不会在协议确认阶段上送（仅运营推送链路 CaActivationApplication 并行上送 N/Y 两行）
  field_targets:
  - ca_certification_info.head_company_data
  - ca_certification_info.submit_status
  evidence: code_path:CaCertificationConfirmApplication.java#confirm（//submitOrThrow(ctx.headCertId...)
    被注释）
- name: 上送 data 字段长度裁剪
  content: 上送前对 authPersonPoliceTwo/authEnterpriseThree/authEnterpriseFour/checkCode/h5Face
    的 data 做 1000 字符限制，超长按 JSON 叶子节点从长到短剔除，失败则硬截断
  impact: 避免签章中台因 data 超长拒收
  field_targets:
  - ca_certification_info.police_two_json
  - ca_certification_info.enterprise_four_json
  - ca_certification_info.intent_sms_json
  - ca_certification_info.intent_h_face_json
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#truncateOversizedDataFieldsInSubmitPayload
- name: 中台调用置于事务外
  content: activateByOpCompanyId 标 @Transactional(NOT_SUPPORTED)，confirm 不加事务，submitToSignCenter/openCa
    均跨网络调用
  impact: 避免长 IO 占用数据库事务
  field_targets:
  - ca_certification_info.submit_status
  evidence: code_path:CaActivationApplication.java#activateByOpCompanyId
- name: CA 开通操作人必须是企业管理员
  content: pre4Step 校验当前登录用户手机号命中 cust_person_info（user_type=admin、enable=Y、company_type=登录角色、ref_cust_company_info=企业
    code），否则抛 CA_CERT_NOT_ADMIN
  impact: 非管理员无法进入一证四步
  field_targets:
  - cust_person_info.user_type
  - cust_person_info.enable
  - cust_person_info.company_type
  - cust_person_info.ref_cust_company_info
  evidence: code_path:CaCertificationPreCheckApplication.java#assertCurrentUserIsAdmin
- name: 企业变更中禁止开通 CA
  content: cust_status='CHANGE' 或 cust_build_status='CUST_CHANGE' 时抛异常「先走完变更流程再处理
    CA 开通」
  impact: 变更期间阻断 CA 预检与开通
  field_targets:
  - cust_company_info.cust_status
  - cust_company_info.cust_build_status
  evidence: code_path:CaCertificationPreCheckApplication.java#assertCompanyNotInChange
- name: 非 BUILD_SUCCESS 不判定需开通 CA
  content: cust_build_status != BUILD_SUCCESS 时 needOpenCa=N 并返回变更/未完成提示；升级授权书盖章也要求
    cust_build_status in (BUILD_SUCCESS, CUST_CHANGE)
  impact: 未成功建档企业不生成 CFCA/BS 协议
  field_targets:
  - cust_company_info.cust_build_status
  - cust_company_info.need_register_ca
  evidence: code_path:CaOpenCaApplication.java#isOpenCa；CaUpgradeAuthApplication.java#processUpgradeAuthOnOpsNameChange
- name: 简易认证禁止开通电子签章
  content: 简易认证提交时若 need_register_ca='Y'，调用 CustCompanyCaPolicy.enforceMustNotOpenCa
    校正并落库 need_register_ca/ca_register_status/need_register_bs/bs_register_status
  impact: 简易认证企业强制不开通 CA
  field_targets:
  - cust_company_info.need_register_ca
  - cust_company_info.ca_register_status
  - cust_company_info.need_register_bs
  - cust_company_info.bs_register_status
  evidence: code_path:CustCompanyInfoApplication.java#submitForSimpleAuth
- name: 证书失效/名称变更回写未开通
  content: 预检若 certStatus in (CANCELLED, EXPIRED, FAIL) 或中台登记企业名与库名不一致，以 PK id 为条件把
    ca_register_status 置 N
  impact: 驱动前端重新发起开通
  field_targets:
  - cust_company_info.ca_register_status
  evidence: code_path:CaCertificationPreCheckApplication.java#resetCaRegisterStatusToN
- name: 中台无注册记录按失效处理
  content: cbsQueryCertInfo 返回/异常含「未注册/UN_REGISTER/没有注册信息」类 token 时：若产融 ca_register_status=Y
    则按 CANCELLED（失效）处理，否则按 UNKNOWN；不作为 queryFailed
  impact: 首开场景不误判为查询失败，也不会误生成升级授权书
  field_targets:
  - cust_company_info.ca_register_status
  evidence: code_path:CaCertificationPreCheckApplication.java#queryCertInfo/CertInfoQueryOutcome.noRegistrationAsInvalid
- name: 升级授权书生成与时点
  content: 中台已有 CA 记录（needUpAuth/isCertExists）或登记名与运营 enterpriseName 不一致且证书 NORMAL
    时，在线签署升级授权书，并上传运营中台+产融影像 A0049，回写 file_refs_json 的 otherAgreementFile1/authFile1/agreementFile1
  impact: 名称变更场景补齐授权书文件
  field_targets:
  - ca_certification_info.file_refs_json
  - ca_certification_info.notify_agreement_json
  evidence: code_path:CaUpgradeAuthApplication.java#processUpgradeAuthOnOpsNameChange；CaCertificationConfirmApplication.java#processCaUpgradeAuthBeforeRegister
- name: 被授权人身份证影像定位
  content: 影像树 modelCode=MA001、catgId=A0011 人像面/A0012 国徽面，busiKey=companyId、userBusiKey=cust_person_info.id；查不到时回退只按
    busiKey 查询；PLATFORM_PUSH 企业可先触发运营影像同步，仍缺失抛异常
  impact: idCardVerify OCR 需要正反面
  field_targets:
  - cust_person_info.id
  evidence: code_path:CaCertificationRealNameApplication.java#lookupLatestIdImage/syncIdImagesFromOperPlatIfNeeded
- name: H5 刷脸意愿主体优先级
  content: 法人 PASS 且有认证时间则整套取法人字段；否则被授权人 PASS 且有认证时间取被授权人；两者都不满足则不落 H5 意愿
  impact: 避免法人与被授权人字段混用
  field_targets:
  - ca_certification_info.intent_h_face_json
  evidence: code_path:CaActivationApplication.java#resolveH5FaceIntentSource
- name: 短信意愿场景白名单
  content: 仅 scenesType=RSA 常量 SMS_CA_INTENT_CONFIRM 时才落 intent_sms_json；校验码统一走 indentifycodeInfoProvider.checkIndentifyCode
  impact: 其他场景只校验不落库
  field_targets:
  - ca_certification_info.intent_sms_json
  evidence: code_path:CaCertificationIntentSmsApplication.java#verifyAndPersist
- name: AMS 复用最新 SUCCESS 数据
  content: 按统码+品牌定位租户与企业，取最新 submit_status=SUCCESS 行组装请求，用入参 appId 覆盖 sysId、amsCompanyId
    覆盖 custId，并重生成 batchNo 后推送中台
  impact: AMS 推送不新增 ca_certification_info 行，只复刻上送
  field_targets:
  - ca_certification_info.submit_status
  - ca_certification_info.batch_no
  - ca_certification_info.cust_id
  evidence: code_path:CaCertificationInfoAppServiceImpl.java#submitLatestSuccessBizRequest；PlatFormAmsCaProviderImpl.java#getCaCertificationInfo
reqdoc_claims:
- claim: 协议确认（POST /cust-web/ca/protocol/confirm）按「先总后分」顺序上送签章中台
  code_status: refuted
  code_evidence: CaCertificationConfirmApplication.java#confirm（总公司行 submitOrThrow(ctx.headCertId...)
    已被注释，仅上送 N 行）
  action: prose_only
- claim: 分公司场景下 headCompanyData='N'/'Y' 两行可并行上送签章中台以缩短耗时
  code_status: confirmed
  code_evidence: CaActivationApplication.java#activateByOpCompanyId（CompletableFuture
    + docProcessExecutor 并行 N/Y 两行）
  action: anchor
- claim: CA 注册完成后回写 cust_company_info.ca_register_status='Y'
  code_status: confirmed
  code_evidence: CaActivationApplication.java#activateByOpCompanyId（第 5 步 custDocFacade.openCa
    内部回写）；CaCertificationConfirmApplication.java#confirm（读取 refreshed.caRegisterStatus）
  action: anchor
- claim: 一证四步聚合确认后需异步广播 openCA 事件给业务系统，且该广播失败不阻断主流程
  code_status: confirmed
  code_evidence: CaCertificationConfirmApplication.java#notifyBusinessSystems（try/catch
    返回 false）
  action: anchor
- claim: 预检发现企业处于变更流程时禁止开通 CA
  code_status: confirmed
  code_evidence: CaCertificationPreCheckApplication.java#assertCompanyNotInChange
  action: anchor
- claim: 协议告知 data 为审计留痕必填，需拼装最小快照 JSON（含 cust_id/cust_name/agreement_url/read_time/agree_time/status）
  code_status: confirmed
  code_evidence: CaActivationApplication.java#buildAgreementDataPayload；CaCertificationRealNameApplication.java#buildAgreementItem
  action: anchor
- claim: 系统文档（客户管理平台业务规则文档 / 运营配置管理业务规则文档）未覆盖 CA 数字证书一证四步的流程与状态规则
  code_status: uncovered
  code_evidence: 无对应文档段落，CA 流程仅在代码与代码注释引用的《CFCA整改-产融平台-开发设计文档V2.md》中描述
  action: review
