field_semantics:
- table: cust_change_record
  field: status
  meaning: 变更记录审核状态，取值来自 OperApiConstants.CheckStatus 常量（以 name() 落库）；DB 默认 '1' 为历史初始值
  evidence: db
- table: cust_change_record
  field: alter_mode
  meaning: 变更方式：1=平台变更(PLAT_ALTER)，2=企业自行变更(SELF_ALTER)，AlterModeEnum.getDictKey 落库
  evidence: db
- table: cust_change_record
  field: alter_type_id
  meaning: 本次变更所选变更项在 cust_change_cfg.id 上的逗号分隔主键列表（非单一外键）
  evidence: code
- table: cust_change_record
  field: alter_data
  meaning: 变更项编码(item_code)的 JSON 数组快照
  evidence: db
- table: cust_change_record
  field: alter_type
  meaning: 变更类型文本描述
  evidence: db
- table: cust_change_record
  field: cust_id
  meaning: 发起变更的平台企业主键，对应 cust_company_info.id（非 code）
  evidence: code
- table: cust_change_record
  field: cust_type
  meaning: 客户类型：1个人客户/2企业客户/3运营方企业客户/4企业客户(全部)
  evidence: db
- table: cust_change_record
  field: cust_company_type
  meaning: 客户企业角色（CORE/SUPPLIER/FINANCE/DEALER/...）
  evidence: db
- table: cust_change_record
  field: oper_cust_id
  meaning: 运营中台侧客户ID（外部系统ID，不能与本平台 cust_id 混用）
  evidence: code
- table: cust_change_record
  field: oper_cust_info
  meaning: 运营中台返回的客户信息 JSON，其中 personId=变更后管理员、oldPersonId=变更前管理员
  evidence: code
- table: cust_change_record
  field: oper_channel
  meaning: 运营中台变更渠道标识（DIRECT_INIT / operation-pplatform-common-new / operation-pplatform-not-edit-new）
  evidence: db
- table: cust_change_record
  field: need_cust_confirm
  meaning: 是否需要客户确认 Y/N
  evidence: db
- table: cust_change_record
  field: electronic_auth_sign_status
  meaning: 电子授权书签署状态（PENDING/SIGNED）
  evidence: db
- table: cust_change_record
  field: need_resign_auth
  meaning: 是否需要重签授权书 Y/N（直推识别变更项时写入，后续只读）
  evidence: db
- table: cust_change_record
  field: msg_send
  meaning: 变更结果通知是否已发送 Y/N
  evidence: db
- table: cust_change_record
  field: admin_auth
  meaning: 企业管理授权材料标记 Y/N
  evidence: db
- table: cust_change_record
  field: legal_auth
  meaning: 法人代表授权材料标记 Y/N
  evidence: db
- table: cust_change_record
  field: enable
  meaning: 逻辑有效标记，实测仅 Y
  evidence: db
- table: cust_change_cfg
  field: item_code
  meaning: 变更项字典编码 UN0001~UN0016（UN0012=企业管理员变更，UN0013=管理员手机号变更）
  evidence: db
- table: cust_change_cfg
  field: plat_item
  meaning: 平台侧变更项展示名称
  evidence: db
- table: cust_change_cfg
  field: oper_item
  meaning: 运营中台侧变更项名称，与 plat_item 非一一对应（如平台'法定代表人手机号码变更'对应运营'法人手机号变更'）
  evidence: db
- table: cust_change_cfg
  field: client_type
  meaning: 端类型：AGW=平台录入端，ACCOUNT_PRODUCT=账号产品端
  evidence: db
- table: cust_change_cfg
  field: identify_style
  meaning: 认证方式：INVITE/INVITE_AGW/SELF/SIMPLE，用于匹配可用变更项
  evidence: db
- table: cust_change_cfg
  field: head_company
  meaning: 是否总公司维度配置 Y/N（企业客户需按企业 head_company 过滤）
  evidence: db
- table: cust_change_cfg
  field: open_process
  meaning: 该变更项是否开启流程 Y/N
  evidence: db
- table: cust_change_cfg
  field: cust_type
  meaning: 适用客户类型 1/2/3，与 cust_change_record.cust_type 同源
  evidence: db
- table: cust_change_cfg
  field: data_desc
  meaning: 变更所需材料说明文案（仅展示，未参与校验）
  evidence: db
- table: cust_oper_change_record
  field: person_id
  meaning: 企业联系人ID，对应 cust_person_info.id
  evidence: code
- table: cust_oper_change_record
  field: change_type
  meaning: 运营人员变更类型：MANUAL/BATCH/AUTO_ASSIGN/AUTO_UPDATE/ASSET_AUDIT_SYNC/CUST_CHANGE_CALLBACK（字面量落库，非枚举
    name）
  evidence: code
- table: cust_oper_change_record
  field: before_operator_id
  meaning: 变更前运营人员ID
  evidence: db
- table: cust_oper_change_record
  field: after_operator_id
  meaning: 变更后运营人员ID
  evidence: db
- table: cust_oper_change_record
  field: change_reason
  meaning: 变更原因文案（手动变更运营人员/批量变更运营人员/资产审核同步/企业变更回调运营人员变更）
  evidence: db
- table: cust_oper_change_record
  field: source_system
  meaning: 变更来源系统标识
  evidence: db
- table: cust_oper_change_record
  field: asset_id
  meaning: 资产审核同步场景关联的资产ID
  evidence: db
- table: cust_oper_change_record
  field: enable
  meaning: 逻辑有效标记；查询口径固定 enable='Y'（字面量直写，非 EnableEnum）
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 企业客户生命周期状态：ADD/EFFECT/FREEZE/WRITEOFF/CHANGE（CHANGE=变更中）
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 企业准入审核状态，取值同 CheckStatus（CUST_CHECK_CHECKING 等）
  evidence: code
- table: cust_company_info
  field: head_company
  meaning: 是否总公司 Y/N，决定加载哪一套变更项配置
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 企业认证方式，作为变更项配置匹配键之一
  evidence: code
- table: cust_person_info
  field: phone
  meaning: 联系人手机号；管理员手机号变更判定时用于新旧对比
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 联系人类型：admin=企业管理员，operator=经办人
  evidence: code
state_machines:
- name: 企业变更记录审核状态机
  field: cust_change_record.status
  states:
  - value: CUST_CHECK_INIT
    label: 变更发起
    source: code_const
  - value: CUST_CHECK_CHECKING
    label: 审核中
    source: code_const
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户补充
    source: code_const
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_const
  - value: CUST_CHECK_REJECT
    label: 审核拒绝
    source: code_const
  - value: '1'
    label: 历史默认值（语义未声明）
    source: db_dist
  transitions:
  - from: CUST_CHECK_INIT
    event: 发起变更同步运营中台
    to: CUST_CHECK_CHECKING
    evidence: code_path:CustCompanyInfoApplication.java#submitCust(CheckStatus.CUST_CHECK_INIT)
      + OperApiConstants.CheckStatus
  - from: CUST_CHECK_CHECKING
    event: 运营中台审核退回
    to: CUST_CHECK_BACKTOCUSTOM
    evidence: code_path:CustCompanyInfoApplication.java#syncClientForSimple(CheckStatus.CUST_CHECK_BACKTOCUSTOM)
  - from: CUST_CHECK_CHECKING
    event: 客户操作重新发起/拒绝旧流程
    to: CUST_CHECK_REJECT
    evidence: code_path:CustChangeApplication.java#changeRebuild
  - from: '*非终态'
    event: 流程重建
    to: CUST_CHECK_REJECT
    evidence: code_path:CustChangeApplication.java#changeRebuild(notIn PASS,REJECT
      取最新非终态记录后调用 operCustFacade.changeRejectProcess)
- name: 企业客户生命周期状态机
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 待建档/新增
    source: code_const
  - value: EFFECT
    label: 已生效
    source: code_const
  - value: FREEZE
    label: 已冻结
    source: code_const
  - value: WRITEOFF
    label: 已注销
    source: code_const
  - value: CHANGE
    label: 变更中
    source: code_const
  transitions:
  - from: EFFECT
    event: 冻结
    to: FREEZE
    evidence: code_path:CustCompanyInfoApplication.java#freeze→custStatusOperator(CustStatusOperatorConstant.FREEZE)
  - from: FREEZE
    event: 解冻
    to: EFFECT
    evidence: code_path:CustCompanyInfoApplication.java#unfreeze→custStatusOperator(UNFREEZE)
  - from: EFFECT
    event: 注销
    to: WRITEOFF
    evidence: code_path:CustCompanyInfoApplication.java#diable→custStatusOperator(DISABLE)
  - from: EFFECT
    event: 发起企业变更（运营中台同步变更状态）
    to: CHANGE
    evidence: code_path:CustChangeApplication.java#getRedirectPage(判定 cust_status=CHANGE)
      + CustCompanyInfoApplication.java#doIfNecessaryChange(operCustFacade.change)
- name: 企业认证/建档状态机（变更项'重新建档'相关）
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始
    source: code_const
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_const
  - value: CUST_BUILDING
    label: 运营中台审核中
    source: code_const
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_const
  - value: BUILD_FAIL
    label: 建档拒绝
    source: code_const
  transitions:
  - from: INIT/BUILD_FAIL
    event: 客户提交资料
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(before INIT|BUILD_FAIL
      → after CUST_CONFIRM_AWAIT)
  - from: CUST_CONFIRM_AWAIT
    event: 推运营中台审核
    to: CUST_BUILDING
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(before CUST_CONFIRM_AWAIT
      → after CUST_BUILDING)
  - from: CUST_BUILDING
    event: 运营中台退回
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(before CUST_BUILDING
      → after CUST_CONFIRM_AWAIT)
  - from: CUST_BUILDING
    event: 审核通过
    to: BUILD_SUCCESS
    evidence: code_path:CustCompanyInfoApplication.java#updateCustBuildStatus(after
      BUILD_SUCCESS → cust_status=EFFECT)
  - from: CUST_BUILDING
    event: 审核拒绝
    to: BUILD_FAIL
    evidence: code_path:CustCompanyInfoApplication.java#messageNotify(after BUILD_FAIL)
calibers:
- name: 有效变更项配置
  predicate: cust_change_cfg.enable = 'Y'
  scope: 客户变更配置列表查询
  evidence: code_path:CustChangeApplication.java#list(EnableEnum.Y.name())
- name: 有效变更记录
  predicate: cust_change_record.enable = 'Y'
  scope: 变更记录读取/跳转判定
  evidence: code_path:CustChangeApplication.java#getRedirectPage
- name: 有效运营变更记录
  predicate: cust_oper_change_record.enable = 'Y'
  scope: 运营人员变更记录查询（字面量 'Y' 直写）
  evidence: code_path:OperChangeRecordApplication.java#queryByPersonId
- name: 可重建的变更流程
  predicate: cust_change_record.status NOT IN ('CUST_CHECK_PASS','CUST_CHECK_REJECT')
  scope: 变更流程重建前置条件
  evidence: code_path:CustChangeApplication.java#changeRebuild(notIn CheckStatus.PASS/REJECT)
- name: 变更中企业
  predicate: cust_company_info.cust_status = 'CHANGE'
  scope: 变更待办页/变更提交成功页跳转判定
  evidence: code_path:CustChangeApplication.java#getRedirectPage
- name: 审核中企业不可发起变更
  predicate: cust_company_info.check_status = 'CUST_CHECK_CHECKING'
  scope: 是否可变更申请校验
  evidence: code_path:CustChangeApplication.java#changeEnable
- name: 企业管理员联系人
  predicate: cust_person_info.user_type = 'admin'
  scope: 管理员变更/手机号变更时定位联系人
  evidence: code_path:CustChangeApplication.java#getRedirectPage + CustSyncEventProvider.java#getAuthChangeCompanyType(UserTypeEnum.admin)
- name: 管理员手机号类变更项
  predicate: cust_change_cfg.item_code IN ('UN0012','UN0013')
  scope: 触发变更提交成功页跳转的变更项集合
  evidence: code_path:CustChangeApplication.java#getRedirectPage(CustUpdateItemCodeConstants.UN0012/UN0013)
term_bridges:
- term: 变更项编码
  aliases:
  - itemCode
  - UN编码
  maps_to: cust_change_cfg.item_code
  also_confused_with:
  - cust_change_record.alter_type_id
  - cust_change_record.alter_data
  adjudication: boundary
  boundary: item_code 是配置字典编码（UN0001~UN0016）；alter_type_id 是 cust_change_cfg.id 的逗号分隔列表；alter_data
    是编码的 JSON 数组快照。三者不可互换。
- term: 变更状态
  aliases:
  - status
  - 审核状态
  maps_to: cust_change_record.status
  also_confused_with:
  - cust_company_info.check_status
  - cust_company_info.cust_status
  adjudication: boundary
  boundary: cust_change_record.status=单条变更流程状态；cust_company_info.check_status=企业准入审核状态；cust_company_info.cust_status=企业生命周期状态。
- term: 客户变更
  aliases:
  - 企业变更
  - 企业信息变更
  maps_to: cust_change_record
  also_confused_with:
  - cust_oper_change_record
  adjudication: boundary
  boundary: cust_change_record 是企业客户信息/资质变更；cust_oper_change_record 是企业联系人（运营人员）归属变更记录。
- term: 变更方式
  aliases:
  - alterMode
  maps_to: cust_change_record.alter_mode
  also_confused_with: []
  adjudication: synonym
  boundary: 1=平台变更(PLAT_ALTER)，2=企业自行变更(SELF_ALTER)。
- term: 企业ID/客户ID
  aliases:
  - custId
  maps_to: cust_change_record.cust_id
  also_confused_with:
  - cust_change_record.oper_cust_id
  - cust_change_record.id
  adjudication: boundary
  boundary: cust_id=本平台 cust_company_info.id；oper_cust_id=运营中台客户ID（外部）；id=变更记录主键。
- term: 运营人员
  aliases:
  - 运营人
  - operator
  maps_to: cust_person_info.operator_id
  also_confused_with:
  - cust_company_info.manager_id
  adjudication: boundary
  boundary: cust_person_info.operator_id/operator_realname 为联系人维度的运营人员；cust_company_info.manager_id
    为企业维度业务经理，两者不同表不同粒度。
- term: 变更前后信息对比
  aliases:
  - oldPersonId/personId
  maps_to: cust_change_record.oper_cust_info
  also_confused_with:
  - cust_oper_change_record.before_operator_id
  adjudication: boundary
  boundary: oper_cust_info 是运营中台返回的 JSON（含 personId/oldPersonId），用于企业管理员变更对比；before/after_operator_*
    是运营人员变更的独立结构化字段。
rules:
- name: 变更申请前置校验
  content: 企业 check_status=CUST_CHECK_CHECKING（准入审核中）时 changeEnable 返回 false，不允许发起变更
  impact: 阻断变更申请入口
  field_targets:
  - cust_company_info.check_status
  evidence: code_path:CustChangeApplication.java#changeEnable
- name: 变更在途判定
  content: cust_company_info.cust_status='CHANGE' 即视为存在变更在途业务（changeHasBusiOnWay 返回
    true）
  impact: 控制变更入口与页面跳转
  field_targets:
  - cust_company_info.cust_status
  evidence: code_path:CustChangeApplication.java#changeHasBusiOnWay(CustStatusEnum.CHANGE.name())
- name: 变更流程重建
  content: 取该企业最新一条 status 非 CUST_CHECK_PASS/CUST_CHECK_REJECT 的变更记录；不存在则抛'无变更流程，不支持拒绝'；存在则调用运营中台
    changeRejectProcess 结束旧流程并由客户重新发起；且 companyId 必须等于当前登录企业
  impact: 拒绝旧流程、重建新流程；越权校验
  field_targets:
  - cust_change_record.cust_id
  - cust_change_record.status
  - cust_change_record.oper_cust_id
  evidence: code_path:CustChangeApplication.java#changeRebuild
- name: 管理员手机号变更后的页面跳转
  content: 变更项命中 UN0012/UN0013 时解析 oper_cust_info 的 oldPersonId/personId 取新旧管理员手机号；若新旧手机号不同且与登录手机号不同，跳转变更提交成功页并回带新管理员手机号/姓名，否则跳运营中台变更待办页
  impact: 变更后登录人手机号与管理员不一致时引导重新登录/查看
  field_targets:
  - cust_change_record.alter_type_id
  - cust_change_record.oper_cust_info
  - cust_person_info.phone
  evidence: code_path:CustChangeApplication.java#getRedirectPage
- name: 变更项配置匹配
  content: 企业客户按 client_type + identify_style + cust_type + head_company + enable='Y'
    过滤；个人客户(clientType=INDIVIDUALS)不按 head_company 过滤，headCompany 取自当前登录用户 companyCode
    对应企业
  impact: 决定企业可见的变更项清单
  field_targets:
  - cust_change_cfg.client_type
  - cust_change_cfg.identify_style
  - cust_change_cfg.cust_type
  - cust_change_cfg.head_company
  - cust_change_cfg.enable
  evidence: code_path:CustChangeApplication.java#list
- name: 变更项包含性判定
  content: alter_type_id 按逗号拆分后 in cust_change_cfg.id 批量查询，再判断命中记录的 item_code 是否落在目标编码集合中
  impact: 跳转分支判定依据
  field_targets:
  - cust_change_record.alter_type_id
  - cust_change_cfg.id
  - cust_change_cfg.item_code
  evidence: code_path:CustChangeApplication.java#checkChangeItems
- name: 运营变更记录查询口径
  content: 按 person_id 查询且 enable='Y'，按 create_time 倒序；change_type 经 CHANGE_TYPE_DESC
    映射为中文描述，operatorId/operatorName 取自 createBy/createUser
  impact: 运营人员变更历史展示
  field_targets:
  - cust_oper_change_record.person_id
  - cust_oper_change_record.enable
  - cust_oper_change_record.change_type
  evidence: code_path:OperChangeRecordApplication.java#queryByPersonId/#toVO
reqdoc_claims:
- claim: 3.4.3 企业状态为'已冻结'或'已注销'时不允许变更
  code_status: uncovered
  code_evidence: CustChangeApplication.java#changeEnable 仅校验 check_status=CUST_CHECK_CHECKING，未见
    cust_status=FREEZE/WRITEOFF 拦截
  action: review
- claim: 3.4.3 同一变更项同时只能有一个待审核的变更申请
  code_status: refuted
  code_evidence: CustChangeApplication.java#changeRebuild 只取该企业最新一条非终态记录，未做'按变更项'粒度唯一性校验
  action: prose_only
- claim: 3.4.2 所有变更需经过审核（通过后生效）
  code_status: confirmed
  code_evidence: CustChangeApplication.java#changeRebuild + OperApiConstants.CheckStatus(CUST_CHECK_CHECKING/PASS/REJECT)
  action: anchor
- claim: 2.3 企业信息变更流程：创建变更记录→提交变更审核→通过/驳回
  code_status: confirmed
  code_evidence: CustChangeRecordDO.java(alter_type_id/status/oper_cust_id) + CustChangeApplication.java#getRedirectPage
  action: anchor
- claim: 3.4.1 可变更项包含企业名称、注册地址、联系方式、经营范围、法定代表人等
  code_status: confirmed
  code_evidence: CustChangeCfgDO.java(platItem/operItem/itemCode) + DB cust_change_cfg.plat_item
  action: anchor
- claim: 3.4.2 变更前后信息对比记录
  code_status: confirmed
  code_evidence: CustChangeApplication.java#getRedirectPage 解析 oper_cust_info 中 oldPersonId/personId
    并比较新旧管理员手机号
  action: anchor
- claim: 3.4.2 审核通过后变更生效
  code_status: confirmed
  code_evidence: CustSyncEventProvider.java#pushCustChangeInfoToClient（运营中台推送变更信息并落库企业信息）
  action: anchor
- claim: 3.4.1 法人变更需提供工商变更证明（材料强制校验）
  code_status: uncovered
  code_evidence: cust_change_cfg.data_desc 仅保存材料说明文案，未见必传/校验分支
  action: review
