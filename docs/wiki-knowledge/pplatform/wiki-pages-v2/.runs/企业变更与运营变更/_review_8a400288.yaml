body: '三个问题需人工确认：

  1. `scope.databases` 的物理库名在本次语义分析中未给出（仅有 `db` 标记），全部页面暂以 `unknown` 占位，需补充真实库名后统一回填。

  2. 本次输入中 `reqdoc_claims` 内容被截断（仅见 `"claim":` 无正文），无法判定 `action=anchor` / `action=uncovered`，因此本批页面未产出任何双源（`code_path`
  + `reqdoc:slug`）锚点，也未产出 `(document_claim，未证实)` 的版本演进条目；若存在需求文档主张，需重新提供后按规则 4/5 回填。

  3. `cust_change_record.alter_mode`（AlterModeEnum）与 `cust_person_info` 之外的 `act_procinst_status`
  等字段仅在术语边界中被提及，未给出取值定义，暂不建页。'
title: cust_change_record（企业变更单）
type: table
