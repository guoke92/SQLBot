field_semantics:
- table: cust_company_info
  field: cust_build_status
  meaning: 企业建档/认证状态。取值来自 CustBuildStatusEnum，代码中按 getDictKey() 落库与比较。
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 企业认证方式。取值来自 IdentifyTypeConstant：SELF 自主认证、INVITE 客户录入、INVITE_AGW 平台录入、SIMPLE
    简易认证。
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 企业审核状态。取值来自 OperApiConstants.CheckStatus，工作流回调按 .name() 写入；缺省时同步接口会补字面量
    CUST_CHECK_PASS。
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 客户业务状态。代码使用 CustStatusEnum / CustStatusConstant，可见 EFFECT、CHANGE、ADD、WRITEOFF、FAILURE
    等。
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否需要开通电子签章（CA）。取值 OpenStatus.Y/N/P，isOpenCa、createCaDoc 按 Y/N/P 判断。
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CFCA/电子签章开通状态。取值 OpenStatus.Y/N/P，审核/开通链路按 Y、N、P 判断并回写。
  evidence: code
- table: cust_company_info
  field: bs_register_status
  meaning: 上上签开通状态。取值 OpenStatus.Y/N/P，setSignRegister、isOpenCa 按 Y、N、P 判断并回写。
  evidence: code
- table: cust_change_record
  field: status
  meaning: 客户变更审核状态。工作流回调写入 CheckStatus.name()，如 CUST_CHECK_PASS、CUST_CHECK_REJECT、CUST_CHECK_BACKTOCUSTOM；自行变更退回时写入动态值
    returnCust-yyyy-MM-dd HH:mm。
  evidence: code
- table: cust_change_record
  field: alter_mode
  meaning: 变更方式。AlterModeEnum，代码区分 PLAT_ALTER（平台提交变更）与 SELF_ALTER（企业自行提交变更）。
  evidence: code
- table: cust_change_record
  field: msg_send
  meaning: 变更审核消息是否已发送。审核回调后写 EnableEnum.Y.name()，用于幂等去重。
  evidence: code
- table: cust_change_record
  field: oper_cust_id
  meaning: 运营中台客户 id。变更回调通过该字段反查本地变更记录。
  evidence: code
- table: cust_change_record
  field: cust_id
  meaning: 本地客户记录 id，关联 cust_company_info.id。
  evidence: code
- table: cust_change_record
  field: alter_type_id
  meaning: 变更项记录 id 列表，逗号分隔，关联 cust_change_cfg.id，用于同步运营中台变更项。
  evidence: code
- table: cust_person_info
  field: user_type
  meaning: 联系人类型。UserTypeEnum，代码使用 admin（管理员）、operator（经办人）、guest（游客）。
  evidence: code
- table: cust_person_info
  field: status
  meaning: 联系人账号状态。CustPersonStatusConstant，代码可见 ADD、EFFECT、FREEZE。
  evidence: code
- table: cust_person_info
  field: phone_realname_status
  meaning: 手机实名状态。CustCertificationResultTypeEnum，代码可见 TO_BE_VERIFIED、AUTOMATIC_AUTHENTICATION_PASSED、MANUAL_AUTHENTICATION_PASSED。
  evidence: code
- table: cust_person_info
  field: face_status
  meaning: 人脸认证状态。与 CustCertificationResultTypeEnum 的自动/人工认证通过值比较。
  evidence: code
- table: cust_person_info
  field: real_name_result
  meaning: 实名认证结果。CustPersonApplication.updateFaceStatus、updateVerifyNameStatus 中写
    RealNameResultEnum.VERIFIED_SUCCESS.getDictKey()。
  evidence: code
- table: cust_certification_info
  field: auto_verify_status
  meaning: 自动核查结果。FaceVerifyController.isFaceVerifyPassed 与 CustCertificationResultTypeEnum.AUTOMATIC_AUTHENTICATION_PASSED
    比较。
  evidence: code
- table: cust_certification_info
  field: manual_verify_status
  meaning: 人工核查结果。FaceVerifyController.isFaceVerifyPassed 与 CustCertificationResultTypeEnum.MANUAL_AUTHENTICATION_PASSED
    比较。
  evidence: code
- table: cust_certification_info
  field: auto_verify_data
  meaning: 自动核查原始数据 JSON。CustPersonApplication.getFaceVerifyQueryVideoDTO 从该字段反序列化
    VerifyResultQueryResp。
  evidence: code
- table: cust_auth_application
  field: open_status
  meaning: 客户产品开通状态。DB 实测取值 NOT_OPENED、OPENING、OPENED。
  evidence: db
state_machines:
- name: 企业建档/认证状态机
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始/待提交
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: CUST_BUILDING
    label: 审核中/建档中
    source: code_enum
  - value: BUILD_SUCCESS
    label: 认证成功
    source: code_enum
  - value: BUILD_FAIL
    label: 认证失败
    source: code_enum
  - value: CUST_CHANGE
    label: 变更中
    source: code_enum
  transitions:
  - from: INIT
    event: 邀请认证客户录入提交
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustStatusCommitProcessor.java:checkMsgSend
  - from: CUST_CONFIRM_AWAIT
    event: 客户提交运营中台审核/客户确认提交
    to: CUST_BUILDING
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
  - from: CUST_BUILDING
    event: 运营中台审核退回/待客户确认
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
  - from: CUST_CONFIRM_AWAIT
    event: CUST_CHECK_CHECKING 回调
    to: CUST_BUILDING
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
  - from: CUST_BUILDING
    event: CUST_CHECK_BACKTOCUSTOM 回调
    to: CUST_CONFIRM_AWAIT
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
  - from: CUST_BUILDING
    event: CUST_CHECK_PASS 回调
    to: BUILD_SUCCESS
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
  - from: CUST_BUILDING
    event: CUST_CHECK_REJECT 回调
    to: BUILD_FAIL
    evidence: code_path:CustStatusCommitProcessor.java:checkMessage
- name: 客户变更审核状态机
  field: cust_change_record.status
  states:
  - value: CUST_CHECK_CHECKING
    label: 审核中
    source: code_const
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_const
  - value: CUST_CHECK_REJECT
    label: 审核拒绝
    source: code_const
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户确认
    source: code_const
  - value: returnCust-yyyy-MM-dd HH:mm
    label: 退回客户（自行变更路径动态状态）
    source: code_const
  transitions:
  - from: CUST_CHECK_CHECKING
    event: 运营中台审核通过
    to: CUST_CHECK_PASS
    evidence: code_path:CustStatusCommitProcessor.java:changeMessage
  - from: CUST_CHECK_CHECKING
    event: 运营中台审核拒绝
    to: CUST_CHECK_REJECT
    evidence: code_path:CustStatusCommitProcessor.java:changeMessage
  - from: CUST_CHECK_CHECKING
    event: 运营中台退回待客户确认
    to: CUST_CHECK_BACKTOCUSTOM
    evidence: code_path:CustStatusCommitProcessor.java:changeMessage
  - from: CUST_CHECK_CHECKING
    event: 审核意见包含“退回”且 alterMode=SELF_ALTER
    to: returnCust-yyyy-MM-dd HH:mm
    evidence: code_path:CustStatusCommitProcessor.java:changeMessage
- name: 自动/人工认证结果状态机
  field: cust_certification_info.auto_verify_status / cust_certification_info.manual_verify_status
  states:
  - value: TO_BE_VERIFIED
    label: 待认证
    source: code_const
  - value: AUTOMATIC_AUTHENTICATION_PASSED
    label: 自动认证通过
    source: code_const
  - value: MANUAL_AUTHENTICATION_PASSED
    label: 人工认证通过
    source: code_const
  transitions:
  - from: TO_BE_VERIFIED
    event: 自动核查通过
    to: AUTOMATIC_AUTHENTICATION_PASSED
    evidence: code_path:FaceVerifyController.java:isFaceVerifyPassed
  - from: TO_BE_VERIFIED
    event: 人工审核通过
    to: MANUAL_AUTHENTICATION_PASSED
    evidence: code_path:CustPersonApplication.java:updateVerifyNameStatus
- name: 联系人账号状态机
  field: cust_person_info.status
  states:
  - value: ADD
    label: 新增/待生效
    source: code_const
  - value: EFFECT
    label: 生效
    source: code_const
  - value: FREEZE
    label: 冻结
    source: code_const
  transitions:
  - from: ADD
    event: 保存法人作为管理员
    to: EFFECT
    evidence: code_path:CustPersonApplication.java:ifNessaryFrzAdm
  - from: EFFECT
    event: 管理员变更/手机号变更冻结旧管理员
    to: FREEZE
    evidence: code_path:CustPersonApplication.java:ifNessaryFrzAdm
calibers:
- name: 人脸认证通过
  predicate: cust_certification_info.auto_verify_status = 'AUTOMATIC_AUTHENTICATION_PASSED'
    OR cust_certification_info.manual_verify_status = 'MANUAL_AUTHENTICATION_PASSED'
  scope: FaceVerifyController.isFaceVerifyPassed
  evidence: code_path:FaceVerifyController.java:isFaceVerifyPassed
- name: 企业生效
  predicate: cust_company_info.cust_build_status = 'BUILD_SUCCESS' AND cust_company_info.cust_status
    = 'EFFECT' AND cust_company_info.data_type = '1'
  scope: listEffectCompany / listEffectCompanyByTenantAndType
  evidence: code_path:CustCompanyIfoEnchanceService.java:listEffectCompany
- name: 可用管理员
  predicate: cust_person_info.user_type = 'admin' AND cust_person_info.enable = 'Y'
  scope: 管理员查询、通知、变更校验
  evidence: code_path:CustPersonApplication.java:listCompanyManagerUserId
- name: 变更在途阻断
  predicate: cust_company_info.cust_status = 'CHANGE'
  scope: adminChangeSaveOrUpdate 发起新变更前阻断
  evidence: code_path:CustPersonApplication.java:adminChangeSaveOrUpdate
- name: CA开通阻断
  predicate: cust_company_info.cust_build_status = 'CUST_CHANGE'
  scope: isOpenCa 返回变更流程处理中阻断提示
  evidence: code_path:CustCompanyIfoEnchanceService.java:isOpenCa
- name: 变更消息已发送
  predicate: cust_change_record.status = '<当前审核状态>' AND cust_change_record.msg_send
    = 'Y'
  scope: isMsgNotify 幂等判断
  evidence: code_path:CustStatusCommitProcessor.java:isMsgNotify
- name: 运营方默认项目
  predicate: cust_company_info.cust_company_type = '["PLATFORM_OPERATOR_COMPANY"]'
  scope: setPlatClientCustProject 运营方走默认项目
  evidence: code_path:ClientCustCommitValidatorSyncService.java:setPlatClientCustProject
term_bridges:
- term: 自动审核
  aliases:
  - 自动核查
  - autoVerify
  - autoMediaVerify
  maps_to: cust_certification_info.auto_verify_status
  also_confused_with:
  - cust_certification_info.manual_verify_status
  - cust_person_info.face_status
  adjudication: boundary
  boundary: 自动审核/自动核查落 auto_verify_status 与 auto_verify_data；人工审核落 manual_verify_status；人脸状态落
    cust_person_info.face_status。
- term: 工作流审核
  aliases:
  - 运营中台审核
  - 工作流审核执行器
  maps_to: cust_company_info.check_status
  also_confused_with:
  - cust_change_record.status
  adjudication: boundary
  boundary: 建档审核写 cust_company_info.check_status；变更审核写 cust_change_record.status。
- term: 审核通过
  aliases:
  - 通过
  - PASS
  maps_to: cust_company_info.check_status = 'CUST_CHECK_PASS'
  also_confused_with:
  - cust_change_record.status = 'CUST_CHECK_PASS'
  - RtfState.PASS
  adjudication: synonym
  boundary: 运营中台 rtfState 通过映射为 CheckStatus.CUST_CHECK_PASS，再按业务写企业或变更记录。
- term: 拒绝
  aliases:
  - 驳回
  - REJECT
  maps_to: cust_company_info.check_status = 'CUST_CHECK_REJECT'
  also_confused_with:
  - cust_change_record.status = 'CUST_CHECK_REJECT'
  - rtfState 包含‘拒绝’
  adjudication: synonym
  boundary: RtfState.REJECT 映射为 CUST_CHECK_REJECT；CustAuthValidatorProcessor 对 rtfState
    包含‘拒绝’直接 return。
- term: 退回
  aliases:
  - 退回客户
  - BACKTOCUSTOM
  - returnCust
  maps_to: cust_change_record.status = 'CUST_CHECK_BACKTOCUSTOM'
  also_confused_with:
  - 动态状态 returnCust-yyyy-MM-dd HH:mm
  adjudication: boundary
  boundary: 标准退回客户确认为 CUST_CHECK_BACKTOCUSTOM；自行变更且审核意见包含‘退回’时写 returnCust-分钟 动态值。
- term: 建档
  aliases:
  - 认证
  - 企业认证
  maps_to: cust_company_info.cust_build_status
  also_confused_with:
  - cust_person_info.cust_build_status
  adjudication: boundary
  boundary: 企业级建档状态在 cust_company_info.cust_build_status；经办人/联系人也有 cust_build_status
    冗余字段。
- term: 管理员
  aliases:
  - 企业管理员
  - admin
  maps_to: cust_person_info.user_type = 'admin'
  also_confused_with:
  - cust_person_info.user_type = 'operator'
  - cust_person_info.user_type = 'guest'
  adjudication: boundary
  boundary: 管理员、经办人、游客均由 cust_person_info.user_type 区分。
- term: 电子签章
  aliases:
  - CA开通
  - CFCA
  - 上上签
  maps_to: cust_company_info.need_register_ca
  also_confused_with:
  - cust_company_info.ca_register_status
  - cust_company_info.bs_register_status
  adjudication: boundary
  boundary: need_register_ca 表示是否需要开通；ca_register_status/bs_register_status 表示 CFCA/上上签实际开通状态。
rules:
- name: 自动审核结果必须为自动认证通过才继续
  content: getFaceQrCodeByCertificationNo 中调用 verifyPersonOCR，若 autoCheckResult 不等于
    AUTOMATIC_AUTHENTICATION_PASSED 则抛出 autoCheckMsg。
  impact: 阻断后续人脸二维码与建档流程。
  field_targets:
  - cust_certification_info.auto_verify_status
  evidence: code_path:FaceVerifyController.java:getFaceQrCodeByCertificationNo
- name: 工作流审核仅处理通过和拒绝
  content: CustWorkflowAuditCommitProcessor.process 判断 rtfState 不等于 PASS 且不等于 REJECT
    时跳过，中间状态由 CustSyncEventProvider 处理。
  impact: 防止审核中状态重复处理，通过/拒绝走统一工作流执行器。
  field_targets:
  - cust_company_info.check_status
  - cust_change_record.status
  evidence: code_path:CustWorkflowAuditCommitProcessor.java:process
- name: 外部回调通过/拒绝由工作流执行器处理
  content: CustSyncEventProvider.onEvent 在非变更广播且 checkStatus 为 CUST_CHECK_PASS 或 CUST_CHECK_REJECT
    时直接 return，由 CustWorkflowAuditCommitProcessor 处理。
  impact: 避免同一审核事件被两个入口重复消费。
  field_targets:
  - cust_company_info.check_status
  evidence: code_path:CustSyncEventProvider.java:onEvent
- name: 退回/拒绝/补充跳过管理员唯一校验
  content: CustAuthValidatorProcessor.validate 中若 rtfState 包含‘拒绝’、‘退回’或‘补充’，直接 return，不进行管理员唯一性校验。
  impact: 退回补充场景不阻断客户提交。
  field_targets:
  - cust_person_info.user_type
  - cust_person_info.phone
  evidence: code_path:CustAuthValidatorProcessor.java:validate
- name: 统一信用代码一致性校验
  content: CustValidatorProcessor.validate 对比回调 socialUnifiedCode 与本地企业 certificationNo，不一致抛‘统一信用代码不一致’。
  impact: 防止运营中台回调匹配错企业。
  field_targets:
  - cust_company_info.certification_no
  evidence: code_path:CustValidatorProcessor.java:validate
- name: 变更记录轮询等待
  content: getChangeRecord 按 operCustId 查询变更记录，最多轮询 15 次，每次 sleep 1 秒，解决推运营中台后立即回调查不到数据的问题。
  impact: 保证变更审核回调能拿到本地记录。
  field_targets:
  - cust_change_record.oper_cust_id
  evidence: code_path:CustStatusCommitProcessor.java:getChangeRecord
- name: 变更消息幂等
  content: isMsgNotify 在 recordDO.status 等于当前状态且 msgSend 为 Y 时返回 false，不再发送消息。
  impact: 避免运营中台多次回调导致重复短信/站内信/待办。
  field_targets:
  - cust_change_record.status
  - cust_change_record.msg_send
  evidence: code_path:CustStatusCommitProcessor.java:isMsgNotify
- name: 多企业角色变更待办去重
  content: 发送待办前调用 custMessageSendService.isSend，若已存在相同 businessId+sceneType 且未处理的待办则跳过发送。
  impact: 多企业角色共用手机号时避免重复待办。
  field_targets:
  - cust_person_info.phone
  evidence: code_path:CustMessageSendService.java:isSend
- name: 变更审核结果写回变更记录
  content: 审核通过/拒绝/退回客户确认时，changeMessage 更新 CustChangeRecordDO.status 与 msgSend=Y，并
    saveOrUpdate。
  impact: 变更记录状态与消息状态持久化。
  field_targets:
  - cust_change_record.status
  - cust_change_record.msg_send
  evidence: code_path:CustStatusCommitProcessor.java:changeMessage
- name: CUST_CHANGE 阻断 CA 开通
  content: isOpenCa 中若 custBuildStatus 为 CUST_CHANGE，返回阻断提示，要求先完成变更流程再处理 CA 开通。
  impact: 变更中不允许开通 CA。
  field_targets:
  - cust_company_info.cust_build_status
  evidence: code_path:CustCompanyIfoEnchanceService.java:isOpenCa
- name: 在途变更阻断新变更
  content: adminChangeSaveOrUpdate 中若企业 custStatus 为 CHANGE，抛异常‘有在途变更流程，请检查!’。
  impact: 同一企业不能同时发起多个变更。
  field_targets:
  - cust_company_info.cust_status
  evidence: code_path:CustPersonApplication.java:adminChangeSaveOrUpdate
- name: 邀请码生成规则
  content: InviteAuthCustInputRemindService 调用 ssoCodeProvider.getInvitationCode(phone,
    6, 3600*24*180, tenantChannel)，生成 6 位、有效期 180 天的邀请码。
  impact: 需求文档所述 8 位、30 天不成立，以代码为准。
  field_targets:
  - cust_person_info.phone
  evidence: code_path:InviteAuthCustInputRemindService.java:getInviteAuthCustInputRemindTransferParam
- name: 一个租户只能有一个平台运营方
  content: checkCustInfoBeforeSave 中若 custCompanyType 包含 PLATFORM_OPERATOR_COMPANY，按
    dbTenantCode 统计已有运营方数量，大于 0 则拒绝。
  impact: 租户级唯一运营方约束。
  field_targets:
  - cust_company_info.cust_company_type
  - cust_company_info.db_tenant_code
  evidence: code_path:CustCompanyIfoEnchanceService.java:checkCustInfoBeforeSave
- name: 统一社会信用代码唯一
  content: checkCertificationRepeat 先校验信用代码格式，再查询同租户主数据中是否存在相同 certificationNo，冲突抛‘统一社会信用代码冲突’。
  impact: 防止同租户重复建档。
  field_targets:
  - cust_company_info.certification_no
  evidence: code_path:CustCompanyIfoEnchanceService.java:checkCertificationRepeat
- name: 简易认证不支持供票产品
  content: checkCustInfoBeforeSaveForDraft 中若产品为 DRAFT，则认证方式不能为 SIMPLE、必须开通电子签章、必须是总公司。
  impact: 供票产品准入限制。
  field_targets:
  - cust_company_info.identify_style
  - cust_company_info.need_register_ca
  - cust_company_info.head_company
  evidence: code_path:CustCompanyIfoEnchanceService.java:checkCustInfoBeforeSaveForDraft
reqdoc_claims:
- claim: 自动审核触发条件：企业信息完整、资质文件齐全、未命中风控规则。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 自动审核维度：企业征信评分 >= 60 分、法人无不良信用记录、企业经营状态正常、行业不在黑名单内。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 企业状态流转：待提交 -> 审核中 -> 已通过；审核中 -> 已驳回 -> 待提交；已通过 -> 已冻结/已注销。
  code_status: confirmed
  code_evidence: CustStatusCommitProcessor.java:checkMessage
  action: prose_only
- claim: 企业信息变更流程：提交变更申请，创建变更记录待提交，提交审核，审核通过后更新企业信息、变更记录生效。
  code_status: confirmed
  code_evidence: CustStatusCommitProcessor.java:changeMessage
  action: anchor
- claim: 变更审核通过后更新企业信息。
  code_status: uncovered
  code_evidence: CustStatusCommitProcessor.java:changeMessage 仅更新备注和变更记录状态，未见企业主信息回写
  action: review
- claim: 邀请码随机生成 8 位字符串，包含大小写字母和数字，30 天内有效。
  code_status: refuted
  code_evidence: InviteAuthCustInputRemindService.java:getInviteAuthCustInputRemindTransferParam
    生成 6 位、180 天
  action: prose_only
- claim: 邀请邮件异步发送，失败记录日志不抛出异常，不影响主流程。
  code_status: confirmed
  code_evidence: CustMessageSendService.java:sendSms/sendEmail/sendNotice 均 try-catch
    只记日志
  action: anchor
- claim: 用户状态流转：待激活 -> 正常 -> 已冻结 -> 正常；已冻结 -> 已注销。
  code_status: uncovered
  code_evidence: cust_person_info.status 可见 ADD/EFFECT/FREEZE，未覆盖待激活与注销
  action: review
- claim: 菜单权限特殊过滤：code='0891344a3a4442179e98819cbe926ced' 的菜单记录自动过滤。
  code_status: uncovered
  code_evidence: ''
  action: review
- claim: 同一租户下统一社会信用代码唯一。
  code_status: confirmed
  code_evidence: CustCompanyIfoEnchanceService.java:checkCertificationRepeat
  action: anchor
- claim: 一个租户只能有一个平台运营方。
  code_status: confirmed
  code_evidence: CustCompanyIfoEnchanceService.java:checkCustInfoBeforeSave
  action: anchor
- claim: 同一变更项同时只能有一个待审核的变更申请。
  code_status: confirmed
  code_evidence: CustPersonApplication.java:adminChangeSaveOrUpdate 检查 cust_status=CHANGE
  action: anchor
- claim: 企业状态为已冻结或已注销时不允许变更。
  code_status: uncovered
  code_evidence: 仅见 cust_status=CHANGE 阻断，未见冻结/注销阻断
  action: review
- claim: 管理员手机号变更、邮箱变更等需审核。
  code_status: confirmed
  code_evidence: CustPersonApplication.java:adminChangeSaveOrUpdate
  action: anchor
- claim: 变更审核通过后发送通过通知，驳回发送驳回通知及原因。
  code_status: confirmed
  code_evidence: CustStatusCommitProcessor.java:changeMessage 发送 SMS/站内信
  action: anchor
