body: '语义分析中 `reqdoc_claims` 只给出 claim 文本，未给出 slug。三个 action=anchor 的主张已分别写入 [[processes/company_build_status_machine]]（2
  条）与 [[processes/change_record_check_machine]]（1 条）的 `ground:process` 块 `reqdoc_anchors`
  的 evidence 双源中，slug 暂按 claim 语义派生：`company-reject-to-fail-resubmit`、`company-status-flow`、`company-change-audit-notify`。请以需求文档真实
  slug 替换。


  另：`cust_change_record.status` 为 `returnCust-yyyy-MM-dd HH:mm` 动态值，语义分析把它列为 `source:
  code_enum` 的 state；若确认为非枚举动态值，应改为 `source: code_dynamic`。'
title: 需求文档主张的 reqdoc slug 未提供
type: process
