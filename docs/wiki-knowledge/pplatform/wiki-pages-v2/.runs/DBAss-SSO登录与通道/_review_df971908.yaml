body: '两条主张在给定语义分析中无代码证据：

  (1) SaaS 登录全链路（SaaSAuthService.login → SsoBlackWhiteListService 黑白名单 → SSO token
  → UserFacade 加载用户 → LocalTypeMenuService 加载菜单）；

  (2) SSO/DBAss 通道初始化（SsoSysChannelInitService.initDbassAndSsoConfig → DBAss 写 appId
  → PlatformTenantLineServiceImpl 同步线路 → PlatformComponentFacade 调 SSO 通道初始化）。

  已分别以（document_claim，未证实）标注写入 processes/login_user_status_state.md 与 concepts/dbass.md
  的版本演进。

  请补充这两个链路的代码位置或修正文档。'
title: 登录链路与通道初始化为 uncovered（document_claim，未证实）
type: process
