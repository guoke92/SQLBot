field_semantics:
- table: open_sso_channel
  field: sys_channel
  meaning: SSO 系统渠道编码（sysChannel），SSO 平台侧系统标识；DB 实测形如 scpr-pplatform-pc 或被追加机构后缀 scpr-pplatform-pc_org{统一社会信用代码}
  evidence: db
- table: open_sso_channel
  field: sys_type
  meaning: SSO sysType；DB 实测值与 sys_channel 同域（scpr-pplatform-pc_org...），用于区分系统类型/机构维度
  evidence: db
- table: open_sso_channel
  field: channel_code
  meaning: 业务/OpenAPI 渠道码；DB 实测 longteng
  evidence: db
- table: open_sso_channel
  field: channel_kind
  meaning: 渠道类型；DB 实测 LOCAL_SYS（本地系统）
  evidence: db
- table: open_sso_channel
  field: channel_name
  meaning: 渠道名称；DB 实测 龙腾
  evidence: db
- table: open_sso_channel
  field: app_id
  meaning: 开放平台 appId；DB 实测 73d62771729e4ffba7f263cb6012746d
  evidence: db
- table: open_sso_channel
  field: sso_client_id
  meaning: 渠道独立 SSO clientId；DB 实测 r6n8u7p3
  evidence: db
- table: open_sso_channel
  field: sso_client_secret
  meaning: SSO 密钥
  evidence: db
- table: open_sso_channel
  field: org_code
  meaning: 同步 SSO 机构编码；代码中以 RpcContext attachment（ContextHelper.orgCodeKey）在调用 SSO
    前透传
  evidence: db
- table: open_sso_channel
  field: sso_sync_status
  meaning: SSO 同步状态；DB 实测 SYNCED（已同步）
  evidence: db
- table: open_sso_channel
  field: sso_sync_msg
  meaning: SSO 同步描述/失败原因；DB 实测“找不到此系统渠道：scpr-pplatform-pc_org91130421356828213h”
  evidence: db
- table: open_sso_channel
  field: open_mode_default
  meaning: 默认打开形态，枚举语义 EMBED/TOP；DB 实测 EMBED
  evidence: db
- table: open_sso_channel
  field: enable
  meaning: 启用标记 Y/N；DB 实测 N=1、Y=1
  evidence: db
- table: open_sso_channel
  field: db_tenant_code
  meaning: 数据租户标识
  evidence: db
- table: open_sso_channel
  field: app_tenant_code
  meaning: 逻辑租户标识（区别于 db_tenant_code）
  evidence: db
- table: operation_user
  field: status
  meaning: 运营中台人员用户状态标识（DB 未给出取值分布）
  evidence: db
- table: operation_user
  field: deleted
  meaning: 删除标识；DB 实测 N=119、Y=22
  evidence: db
- table: operation_user
  field: enable
  meaning: 启用标记 Y/N；DB 实测 Y=132、N=9
  evidence: db
- table: operation_user
  field: operation_group
  meaning: 运营组别
  evidence: db
- table: operation_user
  field: operation_id
  meaning: 运营中台人员 id（外部系统主键）
  evidence: db
- table: operation_user
  field: db_tenant_code
  meaning: 数据租户标识；DB 实测 base
  evidence: db
- table: sys_cust_user_rel
  field: is_freeze
  meaning: 企业-用户-产品-角色关联的冻结标记：N=激活、Y=冻结（代码注释“冻结标记,N表示激活,Y表示冻结”），由 UserFreezeEnum.getDictKey()
    写入
  evidence: code
- table: cust_person_info
  field: status
  meaning: 企业经办人状态，代码以字面量写入：ADD（新增待生效）/EFFECT（生效）
  evidence: code
- table: cust_person_info
  field: enable
  meaning: 联系人启用标记，查询以 'Y' 过滤
  evidence: code
- table: tenant_setting_config
  field: sso_sys_channel
  meaning: 租户配置的 SSO 系统渠道编码，用于 logout 传参、验证码策略判断、DTO 返回
  evidence: code
- table: tenant_setting_config
  field: sso_tenant_chanel
  meaning: 租户 SSO 统码/渠道（代码中被直接赋给 DTO 的 ssoSysChannel 使用）
  evidence: code
- table: tenant_setting_config
  field: db_tenant_code
  meaning: 数据租户标识，租户配置查询主键条件
  evidence: code
- table: tenant_setting_config
  field: enable
  meaning: 启用标记，查询条件固定 'Y'
  evidence: code
- table: tenant_setting_config
  field: dbass_app_id
  meaning: DBAss appId，返回前端前被显式置 null（脱敏）
  evidence: code
- table: cust_company_info
  field: db_tenant_code
  meaning: 企业所属数据租户编码，由 custId 反查得到，是后续租户配置/SSO 渠道的桥梁
  evidence: code
- table: cust_project_rel
  field: ref_cust_project_rel_cust_company_info
  meaning: 关联企业 code（非 id），与 db_tenant_code 联合过滤企业项目
  evidence: code
- table: tenant_project
  field: logo_path
  meaning: 项目 logo 路径，经 cosFileUtil 转换为下载 URL
  evidence: code
state_machines:
- name: 企业用户冻结状态
  field: sys_cust_user_rel.is_freeze
  states:
  - value: N
    label: 激活（未冻结）
    source: code_const
  - value: Y
    label: 冻结
    source: code_const
  transitions:
  - from: N
    event: POST /sys-web/user/freeze（先 SSO freezePerson，再 updateListFreezeFlag）
    to: Y
    evidence: code_path:LocalTypeUserController.java:freeze + UserFacade.java:updateListFreezeFlag
  - from: Y
    event: POST /sys-web/user/active（先 SSO activePerson，再 updateListFreezeFlag）
    to: N
    evidence: code_path:LocalTypeUserController.java:active + UserFacade.java:updateListFreezeFlag
- name: 企业经办人状态
  field: cust_person_info.status
  states:
  - value: ADD
    label: 新增待生效
    source: code_const
  - value: EFFECT
    label: 生效
    source: code_const
  transitions:
  - from: ADD
    event: SSO 登录初始化/切换企业（init / changeCompany）
    to: EFFECT
    evidence: code_path:SaaSAuthController.java:makePersonEffect
- name: SSO 渠道同步状态
  field: open_sso_channel.sso_sync_status
  states:
  - value: SYNCED
    label: 已同步
    source: db_dist
  transitions: []
- name: 登录用户系统状态
  field: sys_user.user_status
  states:
  - value: INIT
    label: 初始
    source: code_enum
  - value: NORMAL
    label: 正常
    source: code_enum
  - value: FREEZE
    label: 冻结
    source: code_enum
  transitions:
  - from: INIT
    event: SSO 登录初始化 init
    to: NORMAL
    evidence: code_path:SaaSAuthController.java:init(ssoFacade.updateSysUserStatus(...,UserStatusEnum.NORMAL))
  - from: NORMAL
    event: 企业冻结/用户冻结（is_freeze=Y 映射）
    to: FREEZE
    evidence: code_path:UserFacade.java:getUserStatusEnum
calibers:
- name: 有效租户配置
  predicate: tenant_setting_config.enable = 'Y'
  scope: getTenantSetting / logout 查询租户配置
  evidence: code_path:SaaSAuthController.java:getTenantSetting + SaaSAuthController.java:logout
- name: 按数据租户查询租户配置
  predicate: tenant_setting_config.db_tenant_code = MetaDataThreadLocalConfig.getDbTenantCode()
  scope: 登录/登出、菜单、验证码策略
  evidence: code_path:SaaSAuthController.java:getTenantSetting
- name: 有效项目关联
  predicate: cust_project_rel.enable = 'Y'
  scope: 登录取企业/项目 logo
  evidence: code_path:SaaSAuthController.java:getPclogPath
- name: 有效项目
  predicate: tenant_project.enable = 'Y'
  scope: 登录取项目 logo
  evidence: code_path:SaaSAuthController.java:getPclogPath
- name: 用户未冻结
  predicate: sys_cust_user_rel.is_freeze = 'N'
  scope: 用户列表/角色查询过滤未冻结
  evidence: code_path:UserFacade.java:updateListFreezeFlag
- name: 启用联系人
  predicate: cust_person_info.enable = 'Y'
  scope: 用户列表补全用户类型/邮箱
  evidence: code_path:UserFacade.java:handUserList
term_bridges:
- term: sysChannel
  aliases:
  - sys_channel
  - ssoSysChannel
  - SsoSystemDO.sysChannel
  maps_to: open_sso_channel.sys_channel
  also_confused_with:
  - tenant_setting_config.sso_tenant_chanel
  adjudication: boundary
  boundary: sysChannel 指 SSO 平台侧系统渠道编码；tenant_setting_config.sso_tenant_chanel 是租户配置的
    SSO 统码，代码中常被直接赋给 DTO.ssoSysChannel（LocalTypeUserController.listUserPage 中 byCode.getSsoTenantChanel()
    → setSsoSysChannel），二者语义相邻但存储位置不同，不可互换。
- term: 租户统码
  aliases:
  - sso_tenant_chanel
  - ssoTenantChanel
  - ssoTenantChannel
  maps_to: tenant_setting_config.sso_tenant_chanel
  also_confused_with:
  - open_sso_channel.sys_channel
  adjudication: boundary
  boundary: 租户统码来自租户配置表，用户/联系人同步 SSO 时作为 sysChannel 传入（UserFacade.getSsoTenantChannel、UserInfoFacade.getSsoTenantChannel）。
- term: dbTenantCode
  aliases:
  - db_tenant_code
  - dbtenantCode
  maps_to: cust_company_info.db_tenant_code
  also_confused_with:
  - open_sso_channel.app_tenant_code
  adjudication: boundary
  boundary: db_tenant_code 为数据租户标识（决定数据隔离）；app_tenant_code 为逻辑租户标识，二者不同层级。
- term: orgCode
  aliases:
  - org_code
  - ContextHelper.orgCodeKey
  maps_to: open_sso_channel.org_code
  also_confused_with:
  - sys_channel
  adjudication: boundary
  boundary: orgCode 是同步到 SSO 的机构编码，代码经 RpcContext attachment 透传，不是渠道编码本身。
- term: appId
  aliases:
  - app_id
  - dbassAppId
  maps_to: open_sso_channel.app_id
  also_confused_with:
  - tenant_setting_config.dbass_app_id
  adjudication: boundary
  boundary: open_sso_channel.app_id 是开放平台 appId；tenant_setting_config.dbass_app_id
    是 DBAss 侧 appId，代码在返回前端前将其置 null（脱敏）。
- term: DBAss
  aliases:
  - dbass
  - DBaaS
  - DbassProvider
  maps_to: tenant_setting_config.dbass_app_id
  also_confused_with:
  - open_sso_channel.app_id
  adjudication: boundary
  boundary: 本主题中 DbassProvider 实际提供营业执照 OCR(getCompanyIndustry/ocrBizLicense) 能力，与
    SSO 渠道初始化并非同一套配置；tenant_setting_config 的 dbass_app_id/dbass_private_key 才是 DBAss
    接入凭据。
rules:
- name: 登录初始化写入企业上下文 Cookie
  content: init 成功后写 fbpccid/fbpcctype/fbpccname(URL编码)/dbtenantCode/fbpcccode 五个
    Cookie，并把 companyId/companyType/companyName/companyCode 回填 LoginUser 并写入 Redis。
  impact: 前端与网关后续请求依赖这些 Cookie/缓存识别当前企业与租户。
  field_targets:
  - cust_company_info.db_tenant_code
  - sys_cust_user_rel.is_freeze
  evidence: code_path:SaaSAuthController.java:init
- name: 冻结/解冻双写 SSO 与本地关联表
  content: freeze 先调 saaSAuthService.freezePerson(custId, idList, companyType) 同步
    SSO，再 userFacade.updateListFreezeFlag(..., UserFreezeEnum.FREEZE) 置 sys_cust_user_rel.is_freeze；active
    反向。
  impact: SSO 登录状态与产融关联表冻结标记必须一致，否则出现能登录但无权限/相反的不一致。
  field_targets:
  - sys_cust_user_rel.is_freeze
  evidence: code_path:LocalTypeUserController.java:freeze/active
- name: 多公司列表去重取默认
  content: getCurrentCustList 按 (companyId+companyType) 去重，重复时取 default_flag='Y' 的记录，其余取首条。
  impact: 同一企业在多角色下只展示一条，默认企业优先。
  field_targets:
  - cust_company_info.id
  - cust_company_info.cust_company_type
  evidence: code_path:SaaSAuthController.java:getCurrentCustList
- name: 登录图形验证码策略
  content: 非 qa/qa2 环境一律需要验证码；qa/qa2 下查 SsoSystemDO.captcha，captcha==0 表示可不加验证码（返回
    false），其余（含查询异常）返回 true。
  impact: 仅测试环境允许免图形验证码，生产始终开启。
  field_targets:
  - open_sso_channel.sys_channel
  evidence: code_path:SaaSAuthController.java:resolveNeedLoginCaptcha
- name: 注册分布式锁
  content: register 使用 Redis 锁 saas:register:{dbTenantCode}:{cellphone}，未取到锁抛“注册处理中，请勿重复提交”；密码用
    RSA 私钥解密。
  impact: 防止同租户同手机并发注册。
  field_targets:
  - cust_company_info.db_tenant_code
  evidence: code_path:SaaSAuthController.java:register
- name: 验证码发送幂等锁
  content: sendLoginCode 以 scenesType+businessId 作为 key 抢 RedisSmsLock，抢不到抛“调用频率过快”；手机号为空时按场景切换为邮箱场景（LANDED_PHONE→LANDED_EMAIL、resetpassword→resetpasswordemail）。
  impact: 短信/邮件发送幂等与场景自动降级。
  field_targets:
  - sys_user.mobile
  - sys_user.email
  evidence: code_path:SaaSAuthController.java:sendLoginCode
- name: 租户 SSO 渠道回填用户查询
  content: listUserPage 由 custId 反查 cust_company_info.db_tenant_code，再取租户 ssoTenantChanel
    写入 userDTO.ssoSysChannel，供下游按租户统码跨系统查询用户。
  impact: 用户列表跨租户/跨 SSO 系统查询依赖该回填。
  field_targets:
  - cust_company_info.db_tenant_code
  - tenant_setting_config.sso_tenant_chanel
  evidence: code_path:LocalTypeUserController.java:listUserPage + getDbTenantCodeById
- name: 登录用户信息同步 SSO 邮箱
  content: updateCustPerson 更新 sys_user 邮箱后，若 sys_user.sso_user_id 非空且 sso_user.email
    为空，则回写 sso_user.email（带 orgCode RpcContext 透传）。
  impact: 保证 SSO 侧邮箱与 sys_user 一致。
  field_targets:
  - sys_user.email
  - sys_user.sso_user_id
  evidence: code_path:UserInfoFacade.java:updateCustPerson
- name: AGW 网关更新邮箱免登录态
  content: updateLoginEmail 取当前登录用户；updateAgwLoginEmail 直接以入参 userId 更新邮箱，不校验登录态。
  impact: 网关侧可代更新邮箱，需注意越权风险。
  field_targets:
  - sys_user.email
  evidence: code_path:SaaSAuthController.java:updateAgwLoginEmail
reqdoc_claims:
- claim: SaaS 登录：SaaSAuthService.login → SsoBlackWhiteListService 黑白名单校验 → SSO 返回
    token → UserFacade 加载用户 → LocalTypeMenuService 加载菜单
  code_status: uncovered
  code_evidence: SaaSAuthController.java:isLogin(verifyWhiteListURL/writeAuthUser)；login
    与 SsoBlackWhiteListService 未在给定链路
  action: review
- claim: 用户拥有多家公司时，前端进入“切换公司”，SaaSAuthController.changeCompany → SaaSAuthService.change(ChangeCompanyDTO)
    → SsoFacade 切换租户上下文并刷新缓存
  code_status: refuted
  code_evidence: SaaSAuthController.java:changeCompany 实际调用 saaSAuthService.getCompanyByUserAndCode(userId,companyId,companyType)
    并改写 Cookie + roleFacade.getAuthUrls + setReisUserInfo，未见 change(ChangeCompanyDTO)/SsoFacade
    切换
  action: prose_only
- claim: SSO/DBAss 通道初始化：SsoSysChannelInitService.initDbassAndSsoConfig(configId)，DBAss
    写 dbass appId，PlatformTenantLineServiceImpl 同步平台线路，PlatformComponentFacade 调 SSO
    通道初始化
  code_status: uncovered
  code_evidence: 给定链路仅见 DbassProvider/DbassProviderImpl（营业执照 OCR/行业查询）及 SaaSAuthController.getTenantSetting
    中对 dbassAppId 的脱敏置空，未见 initDbassAndSsoConfig
  action: review
- claim: 登录后获取菜单接口：LocalTypeMenuService/UserFacade 返回 LoginMenuDTO
  code_status: confirmed
  code_evidence: SaaSAuthController.java:getUserMenuPermList(LoginMenuDTO)→saaSAuthService.getUserMenuPermList
  action: anchor
- claim: 登录验证码场景：测试环境可配置 SSO 系统 captcha 决定是否需要图形验证码
  code_status: confirmed
  code_evidence: SaaSAuthController.java:resolveNeedLoginCaptcha(isLoginCaptchaSkipEnv
    + SsoFacade.getSsoSystemBySysChannel→SsoSystemDO.captcha==0)
  action: anchor
enum_audit:
- field: status
  value: EFFECTIVE
  java_name: EFFECTIVE
  stored_as: same
  label: 有效
  verdict: reject
  evidence: cust/enums/StatusEnum.java
  note: 给定 SSO/登录/用户链路未使用 StatusEnum；cust_person_info.status 实际以字面量 ADD→EFFECT 写入（SaaSAuthController.makePersonEffect），与
    EFFECTIVE/INVALID 不一致，底稿词汇与实际落库点不匹配。
- field: status
  value: INVALID
  java_name: INVALID
  stored_as: same
  label: 无效
  verdict: reject
  evidence: cust/enums/StatusEnum.java
  note: 同上；未见该枚举参与冻结/解冻或用户状态写值。
relation_audit:
- left: cust_company_info.id
  right: cust_company_info.db_tenant_code
  kind: 同表回查（custId→dbTenantCode）
  verdict: derived
  evidence: LocalTypeUserController.java:getDbTenantCodeById(.eq(id).select(dbTenantCode))
  note: 非物理外键，靠代码反查建立企业→租户编码桥接
- left: cust_company_info.db_tenant_code
  right: tenant_setting_config.db_tenant_code
  kind: 租户键关联
  verdict: derived
  evidence: UserFacade.java:getSsoTenantChannel(tenantService.getSimpleFirstByDbTenantCode)
  note: 以 dbTenantCode 作为租户配置查询键
- left: tenant_setting_config.sso_tenant_chanel
  right: open_sso_channel.sys_channel
  kind: 语义映射（统码=sysChannel）
  verdict: derived
  evidence: LocalTypeUserController.java:listUserPage(byCode.getSsoTenantChanel()→userDTO.setSsoSysChannel)；SaaSAuthController.java:getTenantSetting(AGW
    分支二者同值)
  note: 无物理外键；代码把租户统码直接当作 sysChannel 使用
- left: cust_company_info.db_tenant_code
  right: sys_user.tenant_code
  kind: 查询键关联
  verdict: derived
  evidence: CustSysOrgApplication.java:bindCustOrgUser(sysUserProvider.getSysUserDO(dbTenantCode,
    phone))
  note: 企业租户编码用于定位同租户下用户
- left: cust_company_info.db_tenant_code
  right: cust_project_rel.db_tenant_code
  kind: 同租户过滤
  verdict: derived
  evidence: SaaSAuthController.java:getPclogPath(.eq(CustProjectRelDO::getDbTenantCode,
    ...))
  note: 企业项目关联按租户编码过滤
- left: cust_project_rel.project_id
  right: tenant_project.id
  kind: 项目关联
  verdict: derived
  evidence: SaaSAuthController.java:getPclogPath(.in(TenantProjectDO::getId, prjIds))
  note: 由项目关联表 project_id 反查项目配置
- left: sys_user.sso_user_id
  right: sso_user.sso_id
  kind: SSO 用户映射
  verdict: derived
  evidence: UserFacade.java:isNewUser(ssoUserLoginHistoryProvider.list(SsoUserLoginHistoryDO.ssoId=sysUserDO.getSsoUserId()))；UserInfoFacade.java:updateCustPerson(ssoUserProvider.getById(ssoUserDO.getSsoUserId()))
  note: 通过 ssoUserId 跨库关联 SSO 用户与登录历史
- left: cust_person_info.user_id
  right: sys_user.id
  kind: 经办人-账号映射
  verdict: derived
  evidence: UserInfoFacade.java:initAddUserToSsoAndSys(custPersonInfoDO.setUserId(userId))
  note: 建档新增用户后回写 cust_person_info.user_id
