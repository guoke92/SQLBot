field_semantics:
- table: cust_project_rel
  field: company_type
  meaning: 客户角色（只取一个），如 CORE/SUPPLIER/FINANCE 等
  evidence: db
- table: cust_project_rel
  field: op_contact_a
  meaning: 运营对接人A的运营人员ID
  evidence: code
- table: cust_project_rel
  field: op_contact_b
  meaning: 运营对接人B的运营人员ID列表，JSON数组字符串
  evidence: db
- table: cust_project_rel
  field: op_contact_a_group
  meaning: 运营对接人A所属组别
  evidence: db
- table: cust_project_rel
  field: verification_contact
  meaning: 查验对接人
  evidence: code
- table: cust_project_rel
  field: risk_control_contact_a
  meaning: 风控对接人A
  evidence: db
- table: cust_project_rel
  field: risk_control_contact_b
  meaning: 风控对接人B列表，JSON数组字符串
  evidence: db
- table: cust_project_rel
  field: enable
  meaning: 逻辑删除标志，Y有效
  evidence: db
- table: cust_project_rel
  field: project_open_status
  meaning: 项目开通状态，NOT_OPEN/OPENED
  evidence: db
- table: cust_project_pushcust
  field: source_sso_channel
  meaning: 起始系统的SSO渠道
  evidence: db
- table: cust_project_pushcust
  field: target_sso_channel
  meaning: 跳转系统的SSO渠道
  evidence: db
- table: cust_project_code_record
  field: type
  meaning: 类型（如userCompanyRegister、产品中心等）
  evidence: db
- table: cust_project_code_record
  field: status
  meaning: 是否正确状态，Y/N
  evidence: db
- table: wechat_project_approval_apply
  field: sp_type
  meaning: 审批类型，固定为'金融科技业务'
  evidence: code
- table: wechat_project_approval_apply
  field: system_delivery
  meaning: 系统交付方式，SaaS/Saas+本地化
  evidence: code
- table: wechat_project_approval_apply
  field: act_procinst_status
  meaning: 企微审批状态，'2'表示审批通过
  evidence: code
- table: wechat_project_approval_apply
  field: project_type
  meaning: 项目类型，MAIN=主项目，SUB=子项目
  evidence: code
- table: wechat_project_approval_apply
  field: project_phase
  meaning: 项目阶段，IMPLEMENTATION/OPERATION/HANG等
  evidence: code
- table: wechat_project_approval_apply
  field: data_source
  meaning: 数据来源，MANUAL=模拟立项，WECHAT=真实立项
  evidence: code
- table: wechat_project_approval_apply
  field: ka_white_label
  meaning: KA是否贴牌，Y/N
  evidence: code
- table: wechat_project_approval_apply
  field: solution_manager
  meaning: 方案经理姓名CSV
  evidence: code
- table: wechat_project_approval_apply
  field: solution_manager_wxid
  meaning: 方案经理企微userId列表的JSON数组字符串
  evidence: code
- table: wechat_project_approval_apply
  field: old_solution_manager
  meaning: 前方案经理姓名CSV
  evidence: code
- table: wechat_project_approval_apply
  field: product_type_arr
  meaning: 产品类型编码的JSON数组，如["1","9"]
  evidence: code
- table: wechat_project_approval_apply
  field: product_type
  meaning: 产品类型中文CSV
  evidence: code
- table: wechat_project_approval_apply
  field: first_settlement_time
  meaning: 首笔落地时间
  evidence: code
- table: wechat_project_approval_apply
  field: op_contact
  meaning: 运营对接人（单个）
  evidence: code
- table: wechat_project_approval_apply
  field: op_contact_group
  meaning: 运营组别
  evidence: code
- table: tenant_project
  field: text
  meaning: 提示文本，记录离职人员信息
  evidence: code
- table: tenant_project
  field: project_status
  meaning: 项目状态，'1'表示已生效
  evidence: code
- table: tenant_project
  field: is_prd
  meaning: 是否生产数据，1/Y=是，0/N=否
  evidence: code
state_machines:
- name: 项目阶段
  field: wechat_project_approval_apply.project_phase
  states:
  - value: INITIATION
    label: 立项阶段
    source: code_const
  - value: IMPLEMENTATION
    label: 实施阶段
    source: code_const
  - value: OPERATION
    label: 持续运营
    source: code_const
  - value: HANG
    label: 挂起
    source: code_const
  transitions:
  - from: '*'
    event: 首笔落地时间更新且审批通过
    to: OPERATION
    evidence: code_path:ProjectStatisticsApplication.java:applyOperationPhaseWhenFirstSettlementUpdatedUnderApproved
  - from: TERMINATION
    event: 查询时规范化
    to: HANG
    evidence: code_path:ProjectStatisticsApplication.java:normalizeLegacyProjectPhaseCode
- name: 企微审批状态
  field: wechat_project_approval_apply.act_procinst_status
  states:
  - value: '2'
    label: 审批通过
    source: code_const
  transitions: []
- name: 数据来源
  field: wechat_project_approval_apply.data_source
  states:
  - value: MANUAL
    label: 模拟立项
    source: code_const
  - value: WECHAT
    label: 真实立项
    source: code_const
  transitions: []
calibers:
- name: 项目立项统计列表基础范围
  predicate: wechat_project_approval_apply.sp_type = '金融科技业务' AND wechat_project_approval_apply.system_delivery
    IN ('SaaS','Saas+本地化')
  scope: 项目立项统计页列表
  evidence: code_path:ProjectStatisticsApplication.buildPageWrapper
- name: 产融项目台账企业查询口径
  predicate: cust_project_rel.project_id = ? AND cust_project_rel.enable = 'Y'
  scope: 产融项目下的关联企业
  evidence: code_path:ProjectReportApplication.getCompaniesByProjectId
- name: 项目台账导出企业source判定
  predicate: 'tenant_project.channel = ''产融平台'' ? ''产融'' : ''讯易链'''
  scope: 导出时企业数据来源
  evidence: code_path:ProjectReportApplication.exportProjectReport
- name: 缺方案经理提醒范围
  predicate: wechat_project_approval_apply.act_procinst_status = '2' AND wechat_project_approval_apply.solution_manager
    IS NULL
  scope: 提醒Job
  evidence: code_path:ProjectStatisticsApplication.listApprovedMissingSolutionManagerForRemind
term_bridges:
- term: 产融
  aliases:
  - 产融平台
  maps_to: cust_project_rel
  also_confused_with:
  - 讯易链
  adjudication: boundary
  boundary: 数据来源：产融走本地表cust_project_rel，讯易链走洞察平台/wec_project_cust_operation_rel
- term: 项目台账
  aliases:
  - 项目运营配置
  maps_to: tenant_project
  also_confused_with: []
  adjudication: synonym
  boundary: 导出文件名使用'项目运营配置'
- term: 模拟立项
  aliases:
  - MANUAL
  maps_to: wechat_project_approval_apply.data_source='MANUAL'
  also_confused_with:
  - 真实立项
  adjudication: boundary
  boundary: 模拟立项spNo以MN开头，data_source=MANUAL
- term: 真实立项
  aliases:
  - WECHAT
  maps_to: wechat_project_approval_apply.data_source='WECHAT'
  also_confused_with:
  - 模拟立项
  adjudication: boundary
  boundary: 来自企微审批的真实数据
- term: 方案经理
  aliases:
  - solutionManager
  maps_to: wechat_project_approval_apply.solution_manager
  also_confused_with:
  - 业务经理
  adjudication: boundary
  boundary: 方案经理属Saas方案部，业务经理属客户营销部
rules:
- name: 项目阶段联动
  content: 审批通过且首笔落地时间变更为非空时，项目阶段自动置为持续运营(OPERATION)
  impact: 更新/导入时触发
  field_targets:
  - wechat_project_approval_apply.project_phase
  evidence: code_path:ProjectStatisticsApplication.applyOperationPhaseWhenFirstSettlementUpdatedUnderApproved
- name: 方案经理变更联动
  content: 修改方案经理时，同步更新solution_manager_wxid，并将原方案经理合并到old_solution_manager
  impact: 编辑/导入/批量变更
  field_targets:
  - wechat_project_approval_apply.solution_manager
  - wechat_project_approval_apply.solution_manager_wxid
  - wechat_project_approval_apply.old_solution_manager
  evidence: code_path:ProjectStatisticsApplication.update
- name: 导入整批校验
  content: 项目台账导入和项目立项统计导入均整批校验，任一行错误则整批不落库
  impact: 导入操作
  field_targets: []
  evidence: code_path:ProjectStatisticsApplication.validateAndApply
- name: 已离职运营人员提示
  content: top_flag=1的项目/企业，若对接人已离职（operation_user.deleted='Y'且enable='Y'），生成提示文本并更新到text字段
  impact: 项目台账列表/详情
  field_targets:
  - tenant_project.text
  - wec_project_operation_rel.text
  evidence: code_path:ProjectReportController.generateTextForProjectReport
- name: 批量变更方案经理限制
  content: 批量变更方案经理时，新方案经理姓名必须在企微通讯录存在且属于Saas方案部
  impact: 批量变更导入
  field_targets:
  - wechat_project_approval_apply.solution_manager
  evidence: code_path:ProjectStatisticsApplication.validateBatchChangePlanMgrRows
reqdoc_claims:
- claim: cust_project_rel表存储项目与企业关联关系及运营对接人信息
  code_status: confirmed
  code_evidence: ProjectReportApplication.java:getCompaniesByProjectId
  action: anchor
- claim: tenant_project表包含op_contact_a/b, solution_manager, business_group, custom_field_one/two/three,
    project_tag, bussiness_project_relation等字段
  code_status: confirmed
  code_evidence: CustProjectController.java:syncCustInfo
  action: anchor
- claim: 需求文档SSO验证码登录改造与项目报表/统计/上报主题无关
  code_status: uncovered
  code_evidence: ''
  action: review
