  content: CheckStatus→(RegStatus, CompanyUserStatus)：CUST_BACK/CUST_CHECK_INIT→CUSTS001+AUTH0001；CUST_CHECK_BACKTOCUSTOM→CUSTS005+AUTH0001；CUST_CHECK_CHECKING→CUSTS002+AUTH0001；CUST_CHECK_REJECT→CUSTS004+AUTH0001；CUST_CHECK_PASS→CUSTS003+AUTH0003。checkStatus
