field_semantics:
- table: cust_company_info
  field: db_tenant_code
  meaning: 数据租户标识；入站渠道建档期间 ThreadLocal 被置为 'all' 以跨租户查询，业务租户由 cust_access_secret.channel
    反查得到
  evidence: code
- table: cust_company_info
  field: certification_no
  meaning: 统一社会信用代码，渠道建档/查重/查询的主匹配键（socialUnifiedCode → certificationNo）
  evidence: code
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色，JSON 数组字符串（如 ["SUPPLIER"]）；查询用 like 模糊匹配，故单值比对不可靠
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 建档（认证）状态，落库键取自 CustBuildStatusEnum.getDictKey()/CustBuildStatusConstant，如
    INIT/BUILDING/CUST_CONFIRM_AWAIT/BUILD_SUCCESS/BUILD_FAIL
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 审核状态，落库为 OperApiConstants.CheckStatus 的 .name()（CUST_CHECK_INIT/CHECKING/PASS/REJECT/BACKTOCUSTOM/CUST_BACK），读取用
    CheckStatus.getByName
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 客户状态：ADD(新增)/CHANGE(变更中)/WRITEOFF(作废)；变更流程仅在 CHANGE 态才允许终止
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证方式：INVITE(自主认证) / INVITE_AGW(自主建档-渠道)；怡亚通等特定租户被强制改写为 INVITE
  evidence: code
- table: cust_company_info
  field: time_permanent
  meaning: 营业执照有效期 JSON {start,end,status}；end 以 9999 开头时 status=YES 表示长期
  evidence: code
- table: cust_company_info
  field: legal_time_permanent
  meaning: 法人身份证有效期 JSON {start,end,status}，规则同上
  evidence: code
- table: cust_company_info
  field: company_ext_data
  meaning: 企业扩展 JSON：天马写入 INTEREST_RATE(综合利率)，怡亚通写入 BUILD_STYPE=INVITE_AGW
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CA 开通状态，建档初始化固定为 EnableEnum.N.name()（未开通）
  evidence: code
- table: cust_company_info
  field: legal_phone
  meaning: 法人手机号；企业变更时若入参为空/空白则不覆盖库中值，防止在途建档推运营为空
  evidence: code
- table: cust_access_secret
  field: channel
  meaning: 渠道标识（天马 CloudChannel.TIANMA.getDictKey() 等），与 enable 联查后决定该渠道的 dbTenantCode，是渠道鉴权+租户定位的唯一依据
  evidence: code
- table: cust_sftp
  field: channel
  meaning: 渠道影像 SFTP 通道配置（host/port/userName/password），按 channel+enable 联查，用于影像下载/回传
  evidence: code
- table: cust_person_info
  field: ref_cust_company_info
  meaning: 归属企业 code（非主键 id），企业-人员为 code 级软关联
  evidence: code
- table: cust_account_info
  field: ref_cust_company_info
  meaning: 归属企业 code；供应商建档时按联行号查银行信息回填 bank_branch_name/bank_code/bank_no
  evidence: code
- table: cust_account_info
  field: bank_no
  meaning: 联行号(unitedBankNumber)，建档必填校验项之一
  evidence: code
- table: cust_role_info
  field: platform_cust_id
  meaning: 运营中台企业 ID；与 cust_build_record.plat_cust_id 冲突时以本表为准
  evidence: code
- table: cust_project_rel
  field: ref_cust_project_rel_cust_company_info
  meaning: 企业与租户项目的关联（code 级），天马建档时 projectId 由外部项目校验服务返回
  evidence: code
state_machines:
- name: 企业建档(认证)状态
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 初始化
    source: code_const
  - value: BUILDING
    label: 建档中
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待客户确认
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: BUILD_FAIL
    label: 建档失败
    source: code_enum
  transitions:
  - from: '*'
    event: 建档初始化(自主/非自主/天马)
    to: INIT
    evidence: code_path:CustAccessApplication.setCustCompany / initCustOfTianma →
      company.setCustBuildStatus(CustBuildStatusConstant.INIT)
  - from: BUILD_FAIL
    event: 同企业重新建档(复用旧 id/code)
    to: INIT
    evidence: code_path:CustAccessApplication.initCust / initCustOfTianma → query
      custBuildStatus=BUILD_FAIL or custStatus=WRITEOFF 后复用
  - from: BUILDING
    event: 对外查询状态
    to: CUSTS002(对外建档中)
    evidence: code_path:CustAccessApplication.query → CustBuildStatusEnum.BUILDING.getDictKey()
      分支
  - from: '*'
    event: 运营/标准接口终止建档流程 terminateBuildingFlow
    to: BUILD_FAIL
    evidence: code_path:CustAccessApplication.terminateBuildingFlow → update.setCustBuildStatus(CustBuildStatusEnum.BUILD_FAIL.getDictKey())
- name: 企业审核状态
  field: cust_company_info.check_status
  states:
  - value: CUST_CHECK_INIT
    label: 审核初始化
    source: code_enum
  - value: CUST_CHECK_CHECKING
    label: 审核中
    source: code_enum
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_enum
  - value: CUST_CHECK_REJECT
    label: 审核拒绝
    source: code_enum
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户补件
    source: code_enum
  - value: CUST_BACK
    label: 退回
    source: code_enum
  transitions:
  - from: '*'
    event: 终止建档流程
    to: CUST_CHECK_REJECT
    evidence: code_path:CustAccessApplication.terminateBuildingFlow → update.setCheckStatus(CheckStatus.CUST_CHECK_REJECT.name())
  - from: CUST_CHECK_PASS
    event: 对外状态映射
    to: CUSTS003 + AUTH0003
    evidence: code_path:CustAccessApplication.getCheckStatus → case CUST_CHECK_PASS
  - from: CUST_CHECK_CHECKING
    event: 对外状态映射
    to: CUSTS002 + AUTH0001
    evidence: code_path:CustAccessApplication.getCheckStatus → case CUST_CHECK_CHECKING
  - from: CUST_CHECK_REJECT
    event: 对外状态映射
    to: CUSTS004 + AUTH0001
    evidence: code_path:CustAccessApplication.getCheckStatus → case CUST_CHECK_REJECT
- name: 客户状态
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增/在库
    source: code_const
  - value: CHANGE
    label: 变更中
    source: code_enum
  - value: WRITEOFF
    label: 作废
    source: code_const
  transitions:
  - from: '*'
    event: 建档落库
    to: ADD
    evidence: code_path:CustAccessApplication.setCustCompany → company.setCustStatus(CustStatusConstant.ADD)
  - from: ADD
    event: 标准 OpenAPI 发起企业变更
    to: CHANGE(经运营变更流程)
    evidence: code_path:CustAccessApplication.terminateChangingFlow 前置判断 CustStatusEnum.CHANGE.getDictKey().equals(company.getCustStatus())
calibers:
- name: 渠道启用过滤
  predicate: cust_access_secret.enable = 'Y'
  scope: 渠道鉴权、渠道→租户(dbTenantCode)定位、变更渠道校验
  evidence: code:CustAccessApplication.validateSetValue / validateChangeChannelAndTenant
- name: 客户主表启用过滤
  predicate: cust_company_info.enable = 'Y'
  scope: 企业查询/变更/批量查询均排除停用企业
  evidence: code:CustAccessApplication.query / batchQuery / changeCompanyInfo
- name: 建档失败可复用口径
  predicate: cust_company_info.cust_build_status = 'BUILD_FAIL'
  scope: 查重时豁免：已建档判定为 count(cust_build_status != BUILD_FAIL) != 0，失败件允许重建
  evidence: code:CustAccessApplication.validateSetValue / initCust
- name: 作废客户排除
  predicate: cust_company_info.cust_status = 'WRITEOFF'
  scope: 天马撞库校验 notIn(WRITEOFF)，作废件允许重新建档
  evidence: code:CustAccessApplication.validateSetValueOfTianma
- name: 企业+信用代码+租户三元匹配
  predicate: cust_company_info.certification_no = '<socialUnifiedCode>'
  scope: 渠道查询/变更定位企业的核心条件（叠加 db_tenant_code 与 cust_company_type like）
  evidence: code:CustAccessApplication.query / changeCompanyInfo
- name: SFTP 渠道启用
  predicate: cust_sftp.enable = 'Y'
  scope: 影像 SFTP 通道初始化，匹配不到直接抛 SERVER_BUSY
  evidence: code:CustAccessApplication.initSftp
- name: 人员启用过滤
  predicate: cust_person_info.enable = 'Y'
  scope: 定位企业管理员（user_type=admin、按 create_time 倒序 limit 1）
  evidence: code:CustAccessApplication.getCurrentAdmin
- name: 运营企业ID一致性口径
  predicate: cust_build_record.plat_cust_id = cust_role_info.platform_cust_id
  scope: 不一致时以 cust_role_info 为准并告警
  evidence: code:CustAccessApplication.resolveBuildPlatformCustIdForOper
term_bridges:
- term: 渠道
  aliases:
  - channel
  - CloudChannel
  - AlipayAntCloudChannel
  maps_to: cust_access_secret.channel
  also_confused_with:
  - cust_company_info.cust_from
  - cust_company_info.cust_source
  adjudication: boundary
  boundary: channel 是接入方标识，决定租户(dbTenantCode)与 SFTP 通道；cust_from/cust_source 是企业来源展示字段，不可用作渠道路由
- term: 租户
  aliases:
  - dbTenantCode
  - db_tenant_code
  - appTenantCode
  maps_to: cust_company_info.db_tenant_code
  also_confused_with:
  - cust_company_info.app_tenant_code
  adjudication: boundary
  boundary: 入站渠道建档先置 ThreadLocal='all' 做跨租户检索，落库租户须取 cust_access_secret.db_tenant_code；app_tenant_code
    为逻辑租户，与数据租户不同
- term: 企业类型/企业角色
  aliases:
  - companyType
  - custCompanyType
  - CompanyType
  - SPY
  - CE
  - CPT
  - OPE
  maps_to: cust_company_info.cust_company_type
  also_confused_with:
  - cust_person_info.company_type
  - cust_role_info.role_type
  adjudication: boundary
  boundary: 对外协议码(SPY/CE/CPT/OPE)与内部 dictKey(SUPPLIER/CORE/FINANCE/PLATFORM_OPERATOR_COMPANY)
    需经 getCompanyType 转换；主表存 JSON 数组且查询用 like
- term: 统一社会信用代码
  aliases:
  - socialUnifiedCode
  - certificationNo
  - certification_no
  maps_to: cust_company_info.certification_no
  also_confused_with:
  - cust_company_info.invoicing_taxpayer_no
  adjudication: synonym
  boundary: 对外字段名 socialUnifiedCode，落库列 certification_no；开票纳税人识别号是另一字段
- term: 建档
  aliases:
  - companyArchive
  - reg
  - channelArchive
  - 非自主建档
  maps_to: cust_company_info.cust_build_status
  also_confused_with:
  - cust_company_info.check_status
  adjudication: boundary
  boundary: 建档是本地初始化+状态机(cust_build_status)，审核是运营流程状态(check_status)；对外查询 status 由
    check_status 优先映射，无 check_status 时才按 cust_build_status 兜底
- term: 审核状态
  aliases:
  - checkStatus
  - CheckStatus
  - CUST_CHECK_*
  maps_to: cust_company_info.check_status
  also_confused_with:
  - cust_company_info.cust_build_status
  adjudication: boundary
  boundary: check_status 落库为 .name()，读取用 CheckStatus.getByName；为空时对外状态回落到 cust_build_status
    判断
- term: 清分
  aliases:
  - clearing
  - 交e保
  - 中金CFCA
  - 支付宝清分
  - 清分会员登记簿
  maps_to: cust_account_info.account_no
  also_confused_with:
  - cust_company_info.company_ext_data
  adjudication: boundary
  boundary: 本主题为银行/清分渠道对接：支付宝清分走 AlipayClearingProvider（registry=alipay），交e保走 PayProvider/ClearingProvider（registry=clearing），中金走
    ICpcnApi；三者账户数据不落产融库，仅回填 cust_account_info
- term: 建档结果出站
  aliases:
  - archiveCallback
  - notifyArchiveResult
  - ITmCustEventListener
  - IAlipayAntArchiveEventListener
  maps_to: cust_company_info.cust_build_status
  also_confused_with:
  - cust_company_info.check_status
  adjudication: boundary
  boundary: 蚂蚁为 Dubbo 事件→FBP 通知（有效）；天马出站逻辑仅存在于已整体注释的 TianmaConsumer，实际未生效
rules:
- name: 入站渠道全租户上下文
  content: 天马/蚂蚁渠道入站控制器入口先执行 MetaDataThreadLocalConfig.setDbTenantCode("all")，随后由渠道秘钥(cust_access_secret)定位真实租户
  impact: 跨租户检索与落库租户归属
  field_targets:
  - cust_company_info.db_tenant_code
  - cust_access_secret.channel
  evidence: code:TianmaController.companyArchive; AlipayAntArchiveController.channelArchive;
    CustAccessApplication.validateSetValue
- name: 天马默认企业类型为供应商
  content: 天马建档请求 companyType 为空时按 CompanyType.SPY 落库（内部映射 CustCompanyTypeEnum.SUPPLIER）
  impact: cust_company_info.cust_company_type 取值
  field_targets:
  - cust_company_info.cust_company_type
  evidence: code:TianmaService.companyArchive; CustAccessApplication.getCompanyType
- name: 自主/非自主建档校验分档
  content: 自主建档(isIndependent=true)对联系人/法人证件与手机号做非空后校验；非自主建档强制校验且必须提交授权书+法人正反面+经办人正反面+营业执照影像及供应商银行三要素
  impact: 建档准入与影像完整性
  field_targets:
  - cust_company_info.certification_no
  - cust_account_info.bank_no
  evidence: code:CustAccessApplication.validateSetValue / validateMedia / validateBank
- name: 证件有效期 9999 视为长期
  content: 到期日以 9999 开头时 JSON status=YES，否则 NO；同时写 business_license_end_time / legal_certification_end_time
  impact: 营业执照与法人证件有效期表达
  field_targets:
  - cust_company_info.time_permanent
  - cust_company_info.legal_time_permanent
  evidence: code:CustAccessApplication.setCustCompany / initCustOfTianma
- name: 变更时法人手机空值不覆盖
  content: updateSystemData 中法人手机号为空/空白时保留库中旧值，避免在途建档推运营为空
  impact: cust_company_info.legal_phone 不被清空
  field_targets:
  - cust_company_info.legal_phone
  evidence: code:CustAccessApplication.updateSystemData
- name: 产品路由默认 ACFLOW
  content: 支付宝清分配置查询 productCode 为空时默认 ACFLOW；交e保清分银行卡查询的允许产品为 Nacos 配置 bocom.clearing.allowedProductCodes(默认
    ACFLOW,RVSFACTOR_PC)
  impact: 渠道请求的产品维度与 RpcAppVo 路由
  field_targets: []
  evidence: code:ProjectAlipayClearingConfigApplication.isAlipayClearingConfigured;
    ClientProjectAlipayClearingConfigSyncService.getAppId; BocomQueryAccountByXylClientService.getAppId;
    CpcnBankProviderImpl.allowedProductCodes
- name: 蚂蚁建档错误码映射
  content: 消息前缀 CA_CERT_PARAM_INVALID/INIT_PARAM_MISSING/INFO_INCOMPLETE/REALNAME_*/INTENT_UNSUPPORTED
    依次映射 201110~201114，sftp/影像→201120，协议告知与影像→201121；含"企业已建档"→REG_EXIST_EXCEPTION；非业务异常→SERVER_BUSY
  impact: 渠道方错误语义可读性
  field_targets: []
  evidence: code:AntArchiveErrorMapper.toResponse / mapCaOrBusinessCode
- name: 影像 zip 解压安全阈值
  content: 解压总字节超过 512MB 主动中断；entry 归一化后必须落在目标目录内，防 zip 炸弹与路径穿越
  impact: 渠道影像入库安全性
  field_targets: []
  evidence: code:CustAccessApplication.unzipSafely / resolveZipEntry
- name: 运营企业ID冲突以 cust_role_info 为准
  content: cust_build_record.plat_cust_id 与 cust_role_info.platform_cust_id 不一致时告警并取
    role 值
  impact: 是否拉起/终止中台流程的判定
  field_targets:
  - cust_build_record.plat_cust_id
  - cust_role_info.platform_cust_id
  evidence: code:CustAccessApplication.resolveBuildPlatformCustIdForOper
- name: 未拉起中台流程时的待办补偿
  content: 终止建档且 hasOperFlow=false 时按 identify_style 映射待办场景（INVITE→NOTICE_TASK_INVITE_AUTH_CUST_INPUT，INVITE_AGW→NOTICE_TASK_INVITE_AUTH_SYS_INPUT，其余→NOTICE_COMPANY_BUILD_AUTH）主动关单
  impact: 渠道建档终止后的待办一致性
  field_targets:
  - cust_company_info.identify_style
  evidence: code:CustAccessApplication.completeBuildTerminatedWithoutOperTodos
reqdoc_claims:
- claim: 天马供应商建档入站 POST /tianma/companyArchive，入口设置 dbTenantCode="all" 后由 TianmaService
    处理
  code_status: confirmed
  code_evidence: lowcode-pplatform-openapi/lowcode-pplatform-openapi-non-standard-tianma/.../controller/TianmaController.java#companyArchive
  action: anchor
- claim: 天马客户信息同步出站：产融内部事件 → TmCustEventListener → BeanUtils.copyProperties 至 CompanyArchivePushReq
    → 日期格式化为 yyyy-MM-dd → TianmaService.companyArchiveDetail → HTTP POST
  code_status: refuted
  code_evidence: lowcode-pplatform-openapi/lowcode-pplatform-openapi-non-standard-tianma/.../consumer/TianmaConsumer.java（整文件被块注释，@RabbitListener/@Component/@Autowired
    均被注释）
  action: prose_only
- claim: 非标渠道建档复用统一入站 URL，channel 完全由请求体决定（首期支付宝蚂蚁）
  code_status: confirmed
  code_evidence: lowcode-pplatform-openapi/lowcode-pplatform-openapi-non-standard-alipay-ant/.../controller/AlipayAntArchiveController.java#channelArchive（/cloud/std/cust/channelArchive）
  action: anchor
- claim: HSCC 蜂巢出站：WhhimService 组装 → Md5Utils 签名 → WhhimHttpClientOpenApiClient →
    失败抛 WhhimOpenApiException
  code_status: uncovered
  code_evidence: 无对应类出现于本次链路（未提供 WhhimService/WhhimOpenApiException）
  action: review
- claim: BR-003 签名校验：参数排序拼接 + app_secret + MD5 32 位小写，由 CryptoService 统一实现，各渠道复用 Md5Utils/TianmaUtil
  code_status: uncovered
  code_evidence: 本次链路仅有 TianmaUtil.post 的调用点（TianmaService.companyArchiveDetail），未见
    CryptoService/Md5Utils 实现
  action: review
- claim: 渠道通过 CloudChannel 枚举（TIANMA/HSCC/YHKJ）路由分发
  code_status: confirmed
  code_evidence: TianmaService#companyArchive → custDependentReqDto.setChannel(CloudChannel.TIANMA.getDictKey())；AlipayAntArchiveService#channelArchive
    → AlipayAntCloudChannel.ALIPAY_ANT
  action: anchor
- claim: 支付宝清分能力由清分插件负责，产融侧仅做 Dubbo 薄封装（查询状态/生成签署链接/刷新状态）
  code_status: confirmed
  code_evidence: lowcode-pplatform-customer-management/.../cust/facade/AlipayClearingFacade.java（@DubboReference(registry="alipay")
    AlipayClearingProvider）
  action: anchor
- claim: 企业信息变更由 CustAccessFacde / 标准 OpenAPI 触发，并依据场景策略执行
  code_status: confirmed
  code_evidence: CustAccessApplication#changeCompanyInfo（changeCompanySceneResolver.resolve
    → changeCompanySceneStrategyFactory.get(sceneType).execute）
  action: anchor
enum_audit:
- field: cust_access_secret.channel
  value: TIANMA
  java_name: CloudChannel.TIANMA
  stored_as: getDictKey()
  label: 天马渠道
  verdict: confirm
  evidence: code:TianmaService#companyArchive
  note: 写值点为 custDependentReqDto.setChannel(CloudChannel.TIANMA.getDictKey())；dictKey
    字面量未在片段中给出，需与 cust_access_secret 实际值核对
- field: ChannelArchiveReqDto.channel
  value: ALIPAY_ANT
  java_name: AlipayAntCloudChannel.ALIPAY_ANT
  stored_as: 枚举对象直传（未 .name()/getDictKey）
  label: 支付宝蚂蚁渠道
  verdict: correct
  evidence: code:AlipayAntArchiveService#channelArchive
  note: 与天马 getDictKey 写法不一致，DTO 层未做落库键标准化，落库键需确认
- field: cust_company_info.cust_build_status
  value: BUILD_FAIL
