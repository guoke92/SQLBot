field_semantics:
- table: cust_company_info
  field: id
  meaning: 表主键，雪花ID（@TableId IdType.ASSIGN_ID）
  evidence: code
- table: cust_company_info
  field: code
  meaning: 客户业务编码；子表（person/role/account/projectRel）通过 refCustCompanyInfo 关联此编码
  evidence: code
- table: cust_company_info
  field: name
  meaning: 客户名称（企业全称），建档重复校验的第一匹配键
  evidence: code
- table: cust_company_info
  field: certification_no
  meaning: 统一社会信用代码，法人/企业唯一标识，建档重复校验与银行账户查询的主键之一
  evidence: code
- table: cust_company_info
  field: cust_company_type
  meaning: 企业角色，JSON 数组字符串（如 ["SUPPLIER"]），查询时用 like 模糊匹配（query/batchQuery/changeCompanyInfo）
  evidence: code
- table: cust_company_info
  field: cust_status
  meaning: 客户状态：ADD / CHANGE / WRITEOFF（CustStatusConstant、CustStatusEnum）
  evidence: code
- table: cust_company_info
  field: cust_build_status
  meaning: 建档/认证状态（DO 注解为『认证状态』），值取自 CustBuildStatusEnum/CustBuildStatusConstant：INIT
    / BUILDING / CUST_CONFIRM_AWAIT / BUILD_SUCCESS / BUILD_FAIL
  evidence: code
- table: cust_company_info
  field: check_status
  meaning: 审核状态，值取自 OperApiConstants.CheckStatus：CUST_CHECK_INIT / CUST_CHECK_CHECKING
    / CUST_CHECK_PASS / CUST_CHECK_REJECT / CUST_BACK / CUST_CHECK_BACKTOCUSTOM
  evidence: code
- table: cust_company_info
  field: db_tenant_code
  meaning: 数据租户标识（多租户隔离键）；渠道入站/开放接口建档时被强制置为 'all' 或由渠道密钥决定
  evidence: code
- table: cust_company_info
  field: app_tenant_code
  meaning: 逻辑租户标识
  evidence: code
- table: cust_company_info
  field: remark
  meaning: 备注；开放接口查询建档状态时作为 checkDesc（退回原因）回传
  evidence: code
- table: cust_company_info
  field: enable
  meaning: 启用标识 Y/N（EnableEnum），所有查询均带 enable='Y'
  evidence: code
- table: cust_company_info
  field: identify_style
  meaning: 认证方式/录入方式：IdentifyTypeConstant.INVITE（企业录入）、INVITE_AGW（系统录入）；自主建档为 INVITE，挂靠建档为
    INVITE_AGW
  evidence: code
- table: cust_company_info
  field: third_auth_status
  meaning: 第三方认证状态，建档时取自入参 authStatus
  evidence: code
- table: cust_company_info
  field: ca_register_status
  meaning: CA 开通状态，建档初始化固定写 EnableEnum.N
  evidence: code
- table: cust_company_info
  field: bs_register_status
  meaning: 上上签开通状态
  evidence: code
- table: cust_company_info
  field: need_register_ca
  meaning: 是否开通电子签章，建档初始化固定写 EnableEnum.Y
  evidence: code
- table: cust_company_info
  field: need_register_bs
  meaning: 是否需要开通上上签
  evidence: code
- table: cust_company_info
  field: time_permanent
  meaning: 营业执照有效期 JSON：{"start":null,"end":yyyy-MM-dd,"status":"YES|NO"}；end 以 9999
    开头视为长期，status=YES
  evidence: code
- table: cust_company_info
  field: legal_time_permanent
  meaning: 法人证件有效期 JSON，结构同 time_permanent（end/status 语义一致）
  evidence: code
- table: cust_company_info
  field: business_license_start_time
  meaning: 企业营业执照开始时间（结构化列，与 time_permanent 同步写）
  evidence: code
- table: cust_company_info
  field: business_license_end_time
  meaning: 企业营业执照结束时间
  evidence: code
- table: cust_company_info
  field: legal_certification_start_time
  meaning: 法人证件开始日期
  evidence: code
- table: cust_company_info
  field: legal_certification_end_time
  meaning: 法人证件结束日期
  evidence: code
- table: cust_company_info
  field: legal_name
  meaning: 法人姓名
  evidence: code
- table: cust_company_info
  field: legal_certification_no
  meaning: 法人证件号
  evidence: code
- table: cust_company_info
  field: legal_certification_type
  meaning: 法人证件类型，由 IDTypeEnum 映射（默认 CRET_ID）
  evidence: code
- table: cust_company_info
  field: legal_phone
  meaning: 法人手机号；变更场景未传/空白时不覆盖库中值
  evidence: code
- table: cust_company_info
  field: company_ext_data
  meaning: 企业拓展字段 JSON；天马建档写入 interestRate（CompantExtConstants.INTEREST_RATE，综合利率），怡亚通租户写入
    BUILD_STYPE=INVITE_AGW
  evidence: code
- table: cust_company_info
  field: head_company
  meaning: 是否总公司，建档初始化固定写 Y
  evidence: code
- table: cust_company_info
  field: platform_cust_id
  meaning: 运营中台客户 ID（另可由 cust_build_record.plat_cust_id、cust_role_info.platform_cust_id
    解析）
  evidence: code
- table: cust_company_info
  field: cust_source
  meaning: 建档数据来源
  evidence: code
- table: cust_company_info
  field: cust_from
  meaning: 客户来源
  evidence: code
- table: cust_company_info
  field: data_type
  meaning: 数据类型：'1' 主数据、'0' 记录数据
  evidence: code
- table: cust_company_info
  field: main_data_id
  meaning: 主数据 id
  evidence: code
- table: cust_company_info
  field: regist_city
  meaning: 注册市名称；city_code/parent_code 由 address 表（AddressDO.fullName）反查填充
  evidence: code
- table: cust_company_info
  field: regist_city_code
  meaning: 注册城市代码
  evidence: code
- table: cust_company_info
  field: regist_province
  meaning: 注册省份
  evidence: code
- table: cust_company_info
  field: regist_province_code
  meaning: 注册省份代码
  evidence: code
- table: cust_company_info
  field: regist_province_city
  meaning: 注册省市 JSON（province/provinceName/city/cityName）
  evidence: code
- table: cust_company_info
  field: registered_address
  meaning: 注册地址
  evidence: code
- table: cust_company_info
  field: cust_short_name
  meaning: 企业简称
  evidence: code
- table: cust_company_info
  field: cust_english_name
  meaning: 客户英文名称
  evidence: code
- table: cust_company_info
  field: cust_former_name
  meaning: 曾用名
  evidence: code
state_machines:
- name: 客户建档/认证状态机
  field: cust_company_info.cust_build_status
  states:
  - value: INIT
    label: 建档初始化
    source: code_enum
  - value: BUILDING
    label: 建档中
    source: code_enum
  - value: CUST_CONFIRM_AWAIT
    label: 待企业确认
    source: code_enum
  - value: BUILD_SUCCESS
    label: 建档成功
    source: code_enum
  - value: BUILD_FAIL
    label: 建档失败（可重新建档）
    source: code_enum
  transitions:
  - from: BUILDING|CUST_CONFIRM_AWAIT
    event: 标准接口重新建档时终止旧流程（hasOperFlow 分支调用运营中台 completeRejectProcess，随后本地落状态）
    to: BUILD_FAIL
    evidence: code_path:lowcode-pplatform-customer-management/.../cust/application/CustAccessApplication.java#terminateBuildingFlow
- name: 客户审核状态机
  field: cust_company_info.check_status
  states:
  - value: CUST_CHECK_INIT
    label: 审核初始化
    source: code_enum
  - value: CUST_CHECK_CHECKING
    label: 审核中
    source: code_enum
  - value: CUST_CHECK_PASS
    label: 审核通过
    source: code_enum
  - value: CUST_CHECK_REJECT
    label: 审核拒绝/退回
    source: code_enum
  - value: CUST_BACK
    label: 退回
    source: code_enum
  - value: CUST_CHECK_BACKTOCUSTOM
    label: 退回客户补充
    source: code_enum
  transitions:
  - from: CUST_CHECK_CHECKING
    event: 标准接口终止旧建档流程
    to: CUST_CHECK_REJECT
    evidence: code_path:lowcode-pplatform-customer-management/.../cust/application/CustAccessApplication.java#terminateBuildingFlow
  - from: CUST_CHECK_CHECKING
    event: 标准接口终止运营变更流程（changeRejectProcess 落库）
    to: CUST_CHECK_REJECT
    evidence: code_path:lowcode-pplatform-customer-management/.../cust/application/CustAccessApplication.java#terminateChangingFlow（方法内注释：changeRejectProcess
      已在库中落 CUST_CHECK_REJECT）
- name: 客户状态机
  field: cust_company_info.cust_status
  states:
  - value: ADD
    label: 新增/建档态
    source: code_enum
  - value: CHANGE
    label: 变更态
    source: code_enum
  - value: WRITEOFF
    label: 注销态
    source: code_enum
  transitions: []
calibers:
- name: 企业有效口径
  predicate: cust_company_info.enable = 'Y'
  scope: 所有标准开放接口查询/变更/重复校验
  evidence: 'code:CustAccessApplication#query / #batchQuery / #changeCompanyInfo（eq(CustCompanyInfoDO::getEnable,
    EnableEnum.Y.name())）'
- name: 非注销企业口径
  predicate: cust_company_info.cust_status <> 'WRITEOFF'
  scope: 天马建档重复校验（notIn CustStatusConstant.WRITEOFF）
  evidence: code:CustAccessApplication#validateSetValueOfTianma
- name: 建档失败可复用口径
  predicate: cust_company_info.cust_build_status = 'BUILD_FAIL'
  scope: initCust/initCustOfTianma 允许复用旧企业记录（BUILD_FAIL 或 WRITEOFF）覆盖写；天马重复校验对 BUILD_FAIL
    放行
  evidence: 'code:CustAccessApplication#initCust / #initCustOfTianma / #validateSetValueOfTianma'
- name: 标准接口已建档口径
  predicate: count(cust_company_info.certification_no = ? AND cust_company_info.db_tenant_code
    = ? AND cust_company_info.cust_build_status <> 'BUILD_FAIL') <> 0
  scope: independentReg/dependentReg 前置校验，命中抛 REG_EXIST_EXCEPTION『企业已建档！』
  evidence: code:CustAccessApplication#validateSetValue
- name: 渠道-租户映射口径
  predicate: cust_access_secret.channel = ? AND cust_access_secret.enable = 'Y' →
    db_tenant_code
  scope: 渠道入站建档、查询、变更均以渠道密钥表反查租户；查不到抛『渠道不存在』
  evidence: 'code:CustAccessApplication#validateSetValue / #getDbTenantCode / #validateChangeChannelAndTenant'
- name: 全租户上下文口径
  predicate: dbTenantCode = 'all'
  scope: MethDataThreadLocalConfig.setDbTenantCode("all")，用于渠道入站与开放接口跨租户检索；changeCompanyInfo
    在 finally 中还原原租户
  evidence: code:TianmaController#companyArchive / AlipayAntArchiveController#channelArchive
    / CustAccessApplication#reg、#query、#batchQuery、#changeCompanyInfo
- name: 批量查询条数上限口径
  predicate: size(queryReqs) <= 100
  scope: batchQuery 入参校验
  evidence: code:CustAccessApplication#batchQuery
- name: 交e保清分产品口径
  predicate: productCode IN ${bocom.clearing.allowedProductCodes:ACFLOW,RVSFACTOR_PC}
  scope: CpcnBankProviderImpl.listXylCustAccountBanks 遍历该集合逐产品查清分银行卡
  evidence: code:CpcnBankProviderImpl（@NacosValue bocom.clearing.allowedProductCodes）
- name: 支付宝清分默认产品口径
  predicate: productCode = 'ACFLOW'（入参为空时兜底）
  scope: ProjectAlipayClearingConfigApplication.isAlipayClearingConfigured；ClientProjectAlipayClearingConfigSyncService.getAppId
    同口径
  evidence: code:ProjectAlipayClearingConfigApplication#isAlipayClearingConfigured
- name: 交e保账户存在性口径
  predicate: certificationNos = [cust_company_info.certification_no] AND dbTenantCode
    = cust_company_info.db_tenant_code AND platformCode='pplatform' AND productCode='ACFLOW'
    AND readLocalFlag=true
  scope: BocomFacade.existBocomAccount
  evidence: code:BocomFacade#existBocomAccount
term_bridges:
- term: 渠道（channel）
  aliases:
  - channel
  - CloudChannel
  - AlipayAntCloudChannel
  - cust_access_secret.channel
  maps_to: 渠道字典键：代码中可见 CloudChannel.TIANMA.getDictKey()（天马）与 AlipayAntCloudChannel.ALIPAY_ANT（支付宝蚂蚁）；同时用作
    cust_access_secret 的渠道键与 SFTP 配置（cust_sftp.channel）的键
  also_confused_with:
  - HTTP 路径（/tianma、/cloud/std/cust/channelArchive）
  adjudication: boundary
  boundary: 渠道 ≠ URL 路径：AlipayAntArchiveController 注释明确『路径与 channel 无关，channel 完全由请求体决定』，而天马走独立
    /tianma 路径。判定渠道应以渠道密钥表/请求体 channel 字段为准
- term: 建档
  aliases:
  - reg
  - independentReg
  - dependentReg
  - companyArchiveOfTianma
  - channelArchive
  maps_to: cust_company_info 建档流程：CustAccessApplication#reg(isIndependent=true/false)、#companyArchiveOfTianma、以及
    ChannelArchiveProvider#execute→ChannelCustArchiveOrchestrator
  also_confused_with:
  - 渠道建档（channelArchive）
  - 天马建档（companyArchiveOfTianma）
  - 运营中台建档（submitCust）
  adjudication: boundary
  boundary: ChannelArchiveProvider 注释明确『Orchestrator 编排，不经过 reg / companyArchiveOfTianma』，是与标准建档并列的第三条入口；天马入站走
    companyArchiveOfTianma，蚂蚁入站走 ChannelArchiveProvider
- term: 企业状态三字段
  aliases:
  - custStatus
  - custBuildStatus
  - checkStatus
  maps_to: cust_company_info 的三个独立状态列：cust_status（客户状态 ADD/CHANGE/WRITEOFF）、cust_build_status（建档/认证状态
    INIT/BUILDING/BUILD_SUCCESS/BUILD_FAIL/CUST_CONFIRM_AWAIT）、check_status（审核状态 CUST_CHECK_*）
  also_confused_with:
  - RegStatus（对外编码 CUSTS001~CUSTS005/CUST404）
  - CompanyUserStatus（AUTH0001/AUTH0003）
  adjudication: boundary
  boundary: 对外查询接口不直接回传库内枚举，而是 CheckStatus→RegStatus 映射后再返回；CUSTS001~CUSTS005 属于开放接口协议值，不能当库存值使用
- term: 产品编码 productCode
  aliases:
  - productCode
  - platformProductCode
  - ProductCodeEnum.ACFLOW
  - refPlatformProductCode
  maps_to: 平台产品编码；RPC 路由（RpcAppVo.productAppId）与清分默认产品均以此为键，代码中默认值恒为 ACFLOW
  also_confused_with:
  - tenantProductId（租户产品主键）
  - platformProductId（平台产品主键）
  adjudication: synonym
  boundary: productCode 是编码字符串，platformProductId 是主键 ID；validateSetValue 中由 project→TenantProductDO→PlatformProductDO→pp.getCode()/getProductCode()
    逐级解析，两者不可混用
- term: 天马入站 / 天马出站
  aliases:
  - TianmaService.companyArchive
  - TianmaService.companyArchiveDetail
  maps_to: companyArchive = 天马→产融入站建档；companyArchiveDetail = 产融→天马出站推送建档结果（baseUrl
    + TianmaConst.COMPANY_ARCHIVE_DETAIL）
  also_confused_with:
  - TianmaConsumer.platformCompanyAuditPassNotice（整类被注释）
  adjudication: boundary
  boundary: 入站方法在 TianmaController 链路中真实生效；出站方法体存在，但其唯一调用方 TianmaConsumer 全类处于注释状态，出站链路当前不可用
rules:
- name: 渠道建档统一入站入口
  content: 渠道建档使用与渠道无关的固定路径 POST /cloud/std/cust/channelArchive，channel 由请求体决定（AlipayAntArchiveService
    强制 setChannel(AlipayAntCloudChannel.ALIPAY_ANT)），便于后续渠道复用同一 URL；刻意避开 /cloud/std/cust/importNonIndependentCompanyInfo
  impact: 新增渠道只需新增 Request/Service 层解析，网关与路径不需变更
  field_targets:
  - cust_company_info.db_tenant_code
  evidence: code:AlipayAntArchiveController（类注释 + @RequestMapping("/cloud/std/cust")
    + @PostMapping("/channelArchive")）, AlipayAntArchiveService#channelArchive
- name: 非标入站强制全租户上下文
  content: TianmaController 与 AlipayAntArchiveController 在处理前调用 MetaDataThreadLocalConfig.setDbTenantCode("all")，使跨租户建档/查询可行；标准接口
    reg/query/batchQuery 同样置 all，changeCompanyInfo 使用 try/finally 还原原租户
  impact: 渠道数据不落在单一租户上下文，需由企业记录自身 db_tenant_code 决定后续操作租户
  field_targets:
  - cust_company_info.db_tenant_code
  evidence: code:TianmaController#companyArchive, AlipayAntArchiveController#channelArchive,
    CustAccessApplication#changeCompanyInfo（finally 还原）
- name: 天马入站参数强校验
  content: 必填：specifityCptSocialUnifiedCode（资金方统一社会信用证）、coreSocialUnifiedCode（核心企业）、companyName、socialUnifiedCode（且长度必须为18）、authorizerPersonName、authorizerPersonCellphone、interestRate（综合利率）；缺失分别抛
    CloudPcExceptionEnum.PARAM_NULL / PARAM_ERROR
  impact: 天马侧字段缺失或不合法会在入站即被拒绝，不进建档流程
  field_targets:
  - cust_company_info.name
  - cust_company_info.certification_no
  - cust_company_info.company_ext_data
  evidence: code:TianmaService#companyArchive（Assert 串）
- name: 天马建档默认企业角色为供应商
  content: req.getCompanyType() 为空时写入 CompanyType.SPY.name()，否则取入参枚举名；随后 getCompanyType
    将 SPY 映射为 CustCompanyTypeEnum.SUPPLIER
  impact: 天马入站默认识别为供应商角色
  field_targets:
  - cust_company_info.cust_company_type
  evidence: code:TianmaService#companyArchive, CustAccessApplication#getCompanyType
- name: 天马渠道键写入
  content: custDependentReqDto.setChannel(CloudChannel.TIANMA.getDictKey())，由 validateSetValueOfTianma
    用该渠道反查 cust_access_secret 得到 dbTenantCode
  impact: 天马入站租户由渠道密钥表决定，而非请求参数
  field_targets:
  - cust_company_info.db_tenant_code
  evidence: code:TianmaService#companyArchive, CustAccessApplication#validateSetValueOfTianma
- name: 天马重复建档三分支拦截
  content: ①同企业名（非注销）且非 BUILD_FAIL → REG_EXIST_EXCEPTION『已存在相同的企业名称！』；②同统一社会信用代码（非注销）且非
    BUILD_FAIL → REG_EXIST_EXCEPTION『企业已建档！』；③同名+同码均命中时：custBuildStatus=BUILD_SUCCESS
    → COMPANY_EXIST『已经通过其他方式完成建档』，否则 → COMPANY_PROCESS『正在通过其他方式进行建档』
  impact: 天马渠道无法覆盖已在产融以其它方式在建或已建档成功的企业
  field_targets:
  - cust_company_info.name
  - cust_company_info.certification_no
  - cust_company_info.cust_build_status
  - cust_company_info.cust_status
  evidence: code:CustAccessApplication#validateSetValueOfTianma
- name: 蚂蚁渠道错误码映射
  content: Throwable→AlipayAntArchiveResp.code 映射：message 含『企业已建档』→REG_EXIST_EXCEPTION；含『建档处理中』→COMMON_EXCEPTION；CA_CERT_PARAM_INVALID→201110；CA_CERT_INIT_PARAM_MISSING→201111；CA_CERT_INFO_INCOMPLETE→201112；CA_CERT_REALNAME_METHOD_MISMATCH/CA_CERT_REALNAME_UNSUPPORTED→201113；CA_CERT_INTENT_UNSUPPORTED→201114；含
    sftp/SFTP/影像文件→201120；含『协议告知与影像』/notifyAgreement→201121；其余 CommonException/BaseException→COMMON_EXCEPTION；非受控异常→SERVER_BUSY。对外
    msg 对 CA_CERT_ 前缀做『冒号后截断』出参
  impact: 蚂蚁侧可按固定错误码分流重试/补件，避免内部异常串号外泄
  field_targets: []
  evidence: 'code:AntArchiveErrorMapper#toResponse / #mapCaOrBusinessCode / #extractOutwardMsg'
- name: 蚂蚁入站流水号必填
  content: outerSerialNo 为空抛 COMMON_EXCEPTION『流水号不能为空』；非空时 trim 后透传为 ChannelArchiveReqDto.serialNo
  impact: 渠道侧必须提供可对账的外部流水号
  field_targets: []
  evidence: code:AlipayAntArchiveService#channelArchive
- name: 影像件 SFTP 拉取与安全解压
  content: 按渠道（channel）取 cust_sftp 配置（enable='Y'）建 SftpUtil 并缓存于 SFTPS；支持 zip 解压后逐文件上传影像，解压前做规范化路径防穿越（resolveZipEntry
    校验 startsWith(destDir)），总解压体积超 512MB 抛 IOException 中止（防 zip 炸弹）
  impact: 渠道影像接入有边界保护，异常统一转『sftp文件下载异常』业务错误
  field_targets: []
  evidence: 'code:CustAccessApplication#initMeida / #unzipSafely / #resolveZipEntry
    / #initSftp'
