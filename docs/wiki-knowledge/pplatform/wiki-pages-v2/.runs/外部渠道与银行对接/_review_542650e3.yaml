body: '问题：语义分析中两处对 check_status 落库值的写法不一致。

  - field_semantics.check_status：落库为 OperApiConstants.CheckStatus 的 .name()，值为 `CUST_CHECK_INIT/CHECKING/PASS/REJECT/BACKTOCUSTOM/CUST_BACK`（疑似省略前缀的简写）。

  - state_machines[企业审核状态].states：`CUST_CHECK_INIT` / `CUST_CHECK_CHECKING` / `CUST_CHECK_PASS`
  / `CUST_CHECK_REJECT` / `CUST_CHECK_BACKTOCUSTOM` / `CUST_BACK`。

  v0 页面（[[cust_check_status]]、[[cust_company_info]]）采用 state_machines 的全称写法，并以 `.name()`
  作为落库形式。需以 OperApiConstants.CheckStatus 源码逐字确认枚举常量名后再固化 dict。'
title: 企业审核状态
type: process
