facts:
  - {fact_id: REVIEW-001, subject: 建档完成, predicate: requires_business_confirmation, object: "是否始终要求 BUILD_SUCCESS + EFFECT，还是包含 CUST_CHANGE + CHANGE 的在途变更企业？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-002, subject: 建档时间, predicate: requires_business_confirmation, object: "默认指首次提交认证时间、运营流程创建时间、审核通过时间，还是企业主记录创建时间？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-003, subject: 首次提交认证时间, predicate: requires_business_confirmation, object: "cust_first_submit_auth 只覆盖 SELF 和 INVITE，其他录入方式应使用哪个时间字段？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-004, subject: 建档中状态, predicate: requires_business_confirmation, object: "BUILDING 与 CUST_BUILDING 是否仍在不同生产场景使用，还是前者仅为历史兼容状态？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-005, subject: 建档成功失败状态, predicate: requires_business_confirmation, object: "CUST_BUILD_SUCCESS/CUST_BUILD_FAIL 与 BUILD_SUCCESS/BUILD_FAIL 的产品口径边界是什么？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-006, subject: cust_build_record, predicate: requires_database_confirmation, object: "是否存在业务唯一键；一企是否可能存在多条建档、后置处理或补偿记录？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-007, subject: 企业联系人关系, predicate: requires_database_confirmation, object: "企业与联系人应优先使用 id=cust_company_id 还是 code=ref_cust_company_info？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-008, subject: 企业关系有效性, predicate: requires_business_confirmation, object: "企业、角色、项目关系表上的 status、enable、project_open_status 分别控制什么业务有效性？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-009, subject: 租户边界, predicate: requires_security_confirmation, object: "db_tenant_code 是否应作为所有关系的必要等值谓词，还是数据源层已经做物理租户隔离？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-010, subject: 审核通过时间, predicate: requires_database_confirmation, object: "位于哪个可稳定查询字段或历史表；仅凭 update_time 无法证明就是建档成功时间。", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-011, subject: 补偿任务, predicate: requires_database_confirmation, object: "补偿成功后更新原 cust_build_record 还是新增记录？", confidence: 1.0, status: candidate}
  - {fact_id: REVIEW-012, subject: 状态流转权威来源, predicate: requires_business_confirmation, object: "文档简化状态流转与当前代码枚举、回调分支不完全一致，应由业务负责人认证最终表述。", confidence: 1.0, status: candidate}
