k4_exemplar_candidates:
  - candidate_id: QUERY-001
    question: 按月统计首次提交认证的企业数
    intended_contract:
      subject: cust_company_info.id
      aggregation: count_distinct
      time_field: cust_company_info.cust_first_submit_auth
      group_bucket: month
      predicates: ["data_type='1'", "enable='Y'", "identify_style IN ('SELF','INVITE')"]
    status: specification_only_not_executed
  - candidate_id: QUERY-002
    question: 查询某项目下已建档成功的核心企业及其管理员
    intended_contract:
      subject: cust_company_info.id
      relations: [REL-002, REL-004]
      predicates:
        - "cust_project_rel.project_id = 用户指定项目"
        - "cust_project_rel.company_type = 'CORE'"
        - "cust_person_info.user_type = 'accountAdmin'"
        - "CAL-001"
    status: specification_only_not_executed
  - candidate_id: QUERY-003
    question: 查询建档后置任务失败及重试情况
    intended_contract:
      subject: cust_build_record.id
      predicates: ["remark LIKE 'COMPENSATION_%' OR retry_status IS NOT NULL"]
      outputs: [fail_type, retry_status, create_time, update_time, cust_id]
    status: specification_only_not_executed

k5_rule_candidates:
  - candidate_id: RULE-001
    label: 建档阶段不可混用
    rule: 不得把推送完成、流程启动完成或 cust_build_record 存在解释为建档审核成功。
    status: needs_manual_certification
  - candidate_id: RULE-002
    label: 企业查询租户边界
    rule: 多租户查询必须保留 SQLBot 数据源自身的租户隔离机制；不得只依赖自然语言知识注入 db_tenant_code。
    status: needs_security_review

