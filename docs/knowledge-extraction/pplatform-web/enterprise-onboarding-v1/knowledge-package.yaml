  provenance: {}
  kind: example
  question: 按月统计首次提交认证的企业数
  query: SELECT DATE_FORMAT(cust_first_submit_auth, '%Y-%m') AS month, COUNT(DISTINCT
    id) AS company_count FROM cust_company_info WHERE data_type = '1' AND enable =
    'Y' AND identify_style IN ('SELF', 'INVITE') AND cust_first_submit_auth IS NOT
    NULL GROUP BY DATE_FORMAT(cust_first_submit_auth, '%Y-%m')
