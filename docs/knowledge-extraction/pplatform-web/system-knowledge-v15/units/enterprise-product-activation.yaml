unit_id: enterprise-product-activation
revision: 1
title: 企业产品开通与变更
aliases:
- 开通产品
- 产品授权
- 变更单
- 变更记录
- 银行账户认证
- 邀请进度
domain: 客户与建档
applicability: 用户问"已开通产品的企业""开通中产品""在途变更单""变更通过率""默认还款账户" "银行账户验证状态""邀请进度/邀请完成"等企业产品/变更/账户类问题时使用。
description: 企业维度的产品开通（cust_auth_application open_status 状态机）、企业信息变更 （cust_change_record 审核状态机 + 在途判定）、银行账户小额打款认证（cust_account_info auth_state 状态机）、邀请进度（cust_invite_info progress 派生自 cust_build_status）。 所有表经 ref_cust_company_info（=cust_company_info.code）弱关联主数据。
content:
  concepts:
  - concept_id: open-status
    name: 产品开通状态
    aliases:
    - 已开通
    - 开通中
    - 未开通
    - 产品开通
    - 产品授权状态
    - 开通产品记录
    definition: cust_auth_application.open_status 三值（企业侧，与租户侧 tenant_product 的 Y/P/N 是不同体系）：NOT_OPENED 未开通 → OPENING 开通中（initProduct 签署前预置，待客户确认）→ OPENED 已开通（终态）。已 OPENED 再遇开通幂等跳过；未发现关闭链路。读取口径：open_status IN ('OPENED','OPENING') 即视为已开通产品。
    dictionary:
      NOT_OPENED: 未开通
      OPENING: 开通中（带客户确认）
      OPENED: 已开通
    field_targets:
    - dataset: auth_application
      field: open_status
    evidence_refs:
    - ev-epa-open-write
    - ev-epa-open-init-opening
    - ev-epa-open-enum
    - ev-epa-open-read-both
    - ev-epa-open-activated
  - concept_id: change-status
    name: 变更单状态
    aliases:
    - 变更审核
    - 在途变更
    - 变更通过
    - 变更拒绝
    - 变更单
    - 变更流程
    - 企业变更
    definition: cust_change_record.status 与企业 check_status 共用 CheckStatus 六值； 在途判定 = status IS NULL OR NOT IN (CUST_CHECK_PASS, CUST_CHECK_REJECT)。
    dictionary:
      CUST_CHECK_INIT: 待审核
      CUST_CHECK_CHECKING: 审核中
      CUST_CHECK_PASS: 审核通过
      CUST_CHECK_REJECT: 审核不通过
      CUST_CHECK_BACKTOCUSTOM: 待客户确认
      CUST_BACK: 退回
    field_targets:
    - dataset: change_record
      field: status
    evidence_refs:
    - ev-epa-change-write
    - ev-epa-change-callback
    - ev-epa-check-enum
    - ev-epa-change-onway
  - concept_id: auth-state
    name: 银行账户认证状态
    aliases:
    - 小额打款
    - 账户验证
    - 打款认证
    - 打款验证
    - 账户认证进度
    - 银行账户验证
    definition: cust_account_info.auth_state 六值枚举（APPLY_00~50），其中 APPLY_00/APPLY_50 全仓无写点（死值）：APPLY_10 申请受理（cnapsPaymentApply，payment_remaining_count-1）→ APPLY_20/30 打款成功/失败（银行查询映射）→ APPLY_40 验证终态（result=0 成功；result=1/2 失败且 error_try_count+1）。APPLY_40 兼容成功与失败，判成败须看 error_try_count。
    dictionary:
      APPLY_00: 初始化
      APPLY_10: 申请受理中
      APPLY_20: 受付打款成功
      APPLY_30: 打款失败
      APPLY_40: 验证完成（成功/失败终态）
      APPLY_50: 验证失败
    field_targets:
    - dataset: account_info
      field: auth_state
    evidence_refs:
    - ev-epa-auth-apply
    - ev-epa-auth-result
    - ev-epa-auth-confirm
    - ev-epa-auth-enum
    - ev-epa-auth-state
  - concept_id: invite-progress
    name: 邀请进度
    aliases:
    - 邀请完成
    - 邀请中企业
    - 邀请状态
    - 邀请进度跟踪
    - 已邀请企业
    definition: cust_invite_info.progress 是 cust_company_info.cust_build_status 的直接拷贝 （回调时 updateInviteCustProcess，按企业名+租户匹配写入）。progress=BUILD_SUCCESS 即"邀请完成"。
    dictionary:
      INIT: 初始化
      BUILDING: 建档中
      BUILD_SUCCESS: 认证成功（邀请完成）
      BUILD_FAIL: 认证失败
      CUST_CHANGE: 变更
    field_targets:
    - dataset: invite_info
      field: progress
    evidence_refs:
    - ev-epa-invite-write
    - ev-epa-invite-progress-copy
    - ev-epa-invite-progress
  processes:
  - stage_id: activate-product
    name: 产品开通
    description: 签署事件触发或自动开通：已有 OPENED 幂等返回；新建写 ref_cust_company_info=code、ref_cust_auth_application_tenant_product=tenant_product.code、open_status=OPENED、open_time=now、main_data_id=company.id；并发插入靠 DuplicateKeyException 吞掉。initProduct 在签署前预置 OPENING（待客户确认）。
    trigger: 签署事件 / 自动开通 / initProduct 初始化
    enter_conditions:
    - 企业已建档
    next_stages: []
    data_effects:
    - operation: upsert
      dataset: auth_application
      fields:
      - ref_cust_company_info
      - ref_cust_auth_application_tenant_product
      - open_status
      - open_time
      condition: 新建→OPENED 或 OPENING；已 OPENED 幂等
    evidence_refs:
    - ev-epa-open-write
    - ev-epa-open-init-opening
    - ev-epa-open-enum
  - stage_id: submit-change
    name: 发起变更
    description: 平台变更或企业自行变更：Redis 锁 + 在途互斥校验后 ChangeRecordService.init/update 落变更单；企业侧同步写 cust_status=CHANGE、cust_build_status=CUST_CHANGE、 check_status=CUST_CHECK_INIT。
    trigger: 管理端 /change/submit 或企业自行变更推送
    enter_conditions:
    - 无在途变更单
    - 分布式锁获取
    next_stages:
    - change-callback
    data_effects:
    - operation: insert
      dataset: change_record
      fields:
      - cust_id
      - oper_cust_id
      - status
      - alter_type
      - alter_mode
      - msg_send
      condition: 产融自处理→PASS；运营中台→CHECKING
    evidence_refs:
    - ev-epa-change-init
  - stage_id: change-callback
    name: 变更审核回调
    description: 运营中台回调写终态：PASS→CUST_CHECK_PASS、REJECT→CUST_CHECK_REJECT、 BACKTOCUSTOM→待客户确认。isMsgNotify+msg_send 幂等闸门防重复回调。
    trigger: 运营中台审核回调
    next_stages: []
    data_effects:
    - operation: update
      dataset: change_record
      fields:
      - status
      condition: 回调分支映射终态
    evidence_refs:
    - ev-epa-change-callback
  - stage_id: bank-auth-flow
    name: 银行账户小额打款认证
    description: 三步状态机：申请（APPLY_10，payment_remaining_count-1，trans_id/trace_no 写入；次数为 0 拒绝）→ 银行查询（外部 status '10'/'20'/'30' → APPLY_10/20/30）→ 验证确认（result=0→APPLY_40 成功；result=1/2→APPLY_40 且 error_try_count+1+error_try_time=now；前置 APPLY_10/30 时拦截不能验证）。申请次数由 cust_setting_config.payment_maximum_number 重置。
    trigger: 企业端小额打款认证流
    next_stages: []
    data_effects:
    - operation: update
      dataset: account_info
      fields:
      - auth_state
      - trans_id
      - trace_no
      - payment_remaining_count
      - error_try_count
      - error_try_time
      condition: 三步状态机
    evidence_refs:
    - ev-epa-auth-apply
    - ev-epa-auth-result
    - ev-epa-auth-confirm
    - ev-epa-auth-enum
  - stage_id: invite-create
    name: 创建邀请
    description: 单条/批量邀请：invite_time=now、progress=INIT、invite_from=平台邀请(AGW端)/邀请企业名、invite_cust_id=邀请方；级联创建被邀请企业（identify_style=INVITE，AGW_BUILD 时 INVITE_AGW；need_register_ca=Y）+ 角色 + 管理员 + channelCode 匹配租户项目则建 cust_project_rel，最后 submitCust 推审核。后续经回调派生 progress←cust_build_status。
    trigger: 管理端 /invite/save 或 /invite/batch
    next_stages: []
    data_effects:
    - operation: insert
      dataset: invite_info
      fields:
      - invite_time
      - invite_from
      - progress
      - invite_cust_id
      condition: progress=INIT
    evidence_refs:
    - ev-epa-invite-write
    - ev-epa-invite-cascade
  - stage_id: default-account-switch
    name: 切换默认还款账户
    description: 先把现默认（default_account_flag=1）置 0，再把目标账户置 1（两步非原子）；首账户保存时若无默认则自动置默认。
    trigger: 企业端设置默认账户 / 账户保存 afterSave
    enter_conditions:
    - 账户存在且非重复（accountNo+companyCode 唯一）
    next_stages: []
    data_effects:
    - operation: update
      dataset: account_info
      fields:
      - default_account_flag
      condition: 旧默认→0；目标→1
    evidence_refs:
    - ev-epa-auth-default
    - ev-epa-auth-init
  datasets:
  - dataset_id: auth_application
    name: cust_auth_application
    description: 企业产品开通授权（一企业一产品一行，open_status 状态机）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业（=cust_company_info.code）
    - field_id: ref_cust_auth_application_tenant_product
      name: ref_cust_auth_application_tenant_product
      data_type: varchar
      description: 租户产品（=tenant_product.code）
    - field_id: open_status
      name: open_status
      data_type: varchar
      description: 开通状态
      dictionary:
        NOT_OPENED: 未开通
        OPENING: 开通中（带客户确认）
        OPENED: 已开通
      evidence_refs:
      - ev-epa-open-activated
    - field_id: open_time
      name: open_time
      data_type: datetime
      description: 开通时间
    evidence_refs:
    - ev-epa-open-write
    - ev-epa-open-init-opening
    - ev-epa-open-enum
  - dataset_id: change_record
    name: cust_change_record
    description: 企业信息变更记录（在途判定 + 审核状态机；变更拒绝安全更新的 EXISTS 锚点表）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID（=cust_company_info.id）
    - field_id: oper_cust_id
      name: oper_cust_id
      data_type: bigint
      description: 运营中台企业ID（外部锚）
    - field_id: status
      name: status
      data_type: varchar
      description: 审核状态
      dictionary:
        CUST_CHECK_INIT: 待审核
        CUST_CHECK_CHECKING: 审核中
        CUST_CHECK_PASS: 审核通过
        CUST_CHECK_REJECT: 审核不通过
        CUST_CHECK_BACKTOCUSTOM: 待客户确认
        CUST_BACK: 退回
      evidence_refs:
      - ev-epa-change-onway
    - field_id: alter_type
      name: alter_type
      data_type: varchar
      description: 变更项（逗号分隔）
    - field_id: alter_mode
      name: alter_mode
      data_type: varchar
      description: 变更方式
      dictionary:
        PLAT_ALTER: 平台变更
        SELF_ALTER: 企业自行变更
    - field_id: msg_send
      name: msg_send
      data_type: varchar
      description: 消息已发送标记（Y，幂等闸门）
    evidence_refs:
    - ev-epa-change-write
    - ev-epa-change-init-insert
    - ev-epa-change-onway
  - dataset_id: account_info
    name: cust_account_info
    description: 企业银行账户（含小额打款认证 auth_state 状态机 + 默认账户标记）。 全局共享不参与租户行过滤。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业（=cust_company_info.code）
    - field_id: auth_state
      name: auth_state
      data_type: varchar
      description: 认证状态
      dictionary:
        APPLY_00: 初始化
        APPLY_10: 申请受理中
        APPLY_20: 受付打款成功
        APPLY_30: 打款失败
        APPLY_40: 验证完成（成功/失败终态）
        APPLY_50: 验证失败
      evidence_refs:
      - ev-epa-auth-state
    - field_id: default_account_flag
      name: default_account_flag
      data_type: varchar
      description: 默认账户标记（1=默认，每企业至多一个）
    - field_id: payment_remaining_count
      name: payment_remaining_count
      data_type: int
      description: 剩余打款次数（0=不可再申请）
    - field_id: error_try_count
      name: error_try_count
      data_type: int
      description: 验证失败重试计数
    - field_id: error_try_time
      name: error_try_time
      data_type: datetime
      description: 验证失败重试时间
    - field_id: trans_id
      name: trans_id
      data_type: varchar
      description: 交易ID
    - field_id: trace_no
      name: trace_no
      data_type: varchar
      description: 追踪号
    evidence_refs:
    - ev-epa-auth-apply
    - ev-epa-auth-confirm
    - ev-epa-auth-enum
    - ev-epa-auth-init
  - dataset_id: invite_info
    name: cust_invite_info
    description: 供应商邀请记录（progress 派生自企业 cust_build_status，按企业名+租户匹配写入）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: invite_time
      name: invite_time
      data_type: datetime
      description: 邀请时间
    - field_id: invite_from
      name: invite_from
      data_type: varchar
      description: 邀请来源（平台邀请/邀请企业名）
    - field_id: progress
      name: progress
      data_type: varchar
      description: 邀请进度（=cust_company_info.cust_build_status 快照）
      dictionary:
        INIT: 初始化
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功（邀请完成）
        BUILD_FAIL: 认证失败
        CUST_CHANGE: 变更
      evidence_refs:
      - ev-epa-invite-progress
    - field_id: invite_cust_id
      name: invite_cust_id
      data_type: bigint
      description: 邀请方企业ID（=cust_company_info.id）
    evidence_refs:
    - ev-epa-invite-write
    - ev-epa-invite-progress-copy
  relationships:
  - relationship_id: authapp-company
    left:
      dataset: auth_application
      field: ref_cust_company_info
    right:
      dataset: account_info
      field: ref_cust_company_info
    relationship_type: SHARED_KEY
    cardinality: many_to_many
    business_meaning: 两表同锚 cust_company_info.code（经主表串联的同维度事实）
    status: proposed
    evidence_refs:
    - ev-epa-open-activated
    confidence: 0.7
  calibers:
  - caliber_id: opened-product-company
    label: 已开通产品企业
    description: open_status=OPENED 且启用
    contract_fragment:
      where:
      - open_status = 'OPENED'
      - enable = 'Y'
    field_targets:
    - dataset: auth_application
      field: open_status
    evidence_refs:
    - ev-epa-open-activated
  - caliber_id: onway-change
    label: 在途变更单
    description: 变更单非终态（变更拒绝安全更新的 EXISTS 谓词同源）
    contract_fragment:
      where:
      - status IS NULL OR status NOT IN ('CUST_CHECK_PASS','CUST_CHECK_REJECT')
    field_targets:
    - dataset: change_record
      field: status
    evidence_refs:
    - ev-epa-change-onway
  - caliber_id: default-account
    label: 默认还款账户
    description: default_account_flag=1 的账户（每企业至多一个）
    contract_fragment:
      where:
      - default_account_flag = '1'
    field_targets:
    - dataset: account_info
      field: default_account_flag
    evidence_refs:
    - ev-epa-auth-state
  - caliber_id: invite-completed
    label: 邀请完成
    description: progress=BUILD_SUCCESS（邀请的企业已完成认证）
    contract_fragment:
      where:
      - progress = 'BUILD_SUCCESS'
    field_targets:
    - dataset: invite_info
      field: progress
    evidence_refs:
    - ev-epa-invite-progress
  - caliber_id: verified-account
    label: 打款验证通过账户
    description: APPLY_40 终态且无失败计数
    contract_fragment:
      where:
      - auth_state = 'APPLY_40'
      - error_try_count = 0
    field_targets:
    - dataset: account_info
      field: auth_state
    evidence_refs:
    - ev-epa-auth-confirm
    - ev-epa-auth-enum
  metrics:
  - metric_id: opened-product-company-count
    name: 已开通产品企业数
    description: open_status=OPENED 的企业数（DISTINCT ref_cust_company_info）
    aggregation: COUNT
    field:
      dataset: auth_application
      field: ref_cust_company_info
    filters:
    - open_status: OPENED
      enable: Y
    evidence_refs:
    - ev-epa-open-activated
  - metric_id: onway-change-count
    name: 在途变更单数
    description: 非终态变更单数量
    aggregation: COUNT
    field:
      dataset: change_record
      field: id
    filters:
    - status IS NULL OR NOT IN (PASS,REJECT): true
    grain:
    - dataset: change_record
      field: cust_id
    evidence_refs:
    - ev-epa-change-onway
  - metric_id: invite-conversion
    name: 邀请转化率
    description: progress=BUILD_SUCCESS / 全部邀请
    aggregation: COUNT
    field:
      dataset: invite_info
      field: id
    grain:
    - dataset: invite_info
      field: progress
    evidence_refs:
    - ev-epa-invite-progress
  domain_rules:
  - rule_id: open-idempotent
    label: 产品开通幂等
    content: 已 OPENED 再遇开通直接 return；并发插入靠 DuplicateKeyException 吞掉；initProduct 存在即 return。
    applicability: 开通量统计、重复开通排查
    query_impact: 同企业同产品至多一条记录，无需 DISTINCT 去重。
    field_targets:
    - dataset: auth_application
      field: open_status
    evidence_refs:
    - ev-epa-open-write
    - ev-epa-open-init-opening
  - rule_id: change-onway-exclusive
    label: 变更在途互斥
    content: Redis 锁 operChange前缀+统码 + checkBusiOnWay 在途校验；同企业同时只允许一条 在途变更单。变更拒绝采用乐观并发更新（EXISTS cust_change_record 谓词 + eq(custStatus,CHANGE)）。
    applicability: 变更量统计、并发安全解释
    query_impact: 在途变更数≤1 per 企业；终态后可再发起新变更。
    field_targets:
    - dataset: change_record
      field: status
    evidence_refs:
    - ev-epa-change-write
    - ev-epa-change-onway
    - ev-epa-change-safety-reject
    - ev-epa-change-checking-guard
  - rule_id: invite-progress-derived
    label: 邀请进度是派生快照
    content: progress 由回调时从 cust_company_info.cust_build_status 直接拷贝写入（按企业名+ db_tenant_code 匹配，非 code/id）；存在重名企业写错行的风险。
    applicability: 邀请进度/转化统计
    query_impact: progress 不是独立状态机而是主表快照；企业名不唯一时可能写错。
    field_targets:
    - dataset: invite_info
      field: progress
    evidence_refs:
    - ev-epa-invite-progress-copy
  - rule_id: account-default-unique
    label: 默认账户唯一
    content: 每企业至多一个 default_account_flag=1；CHANGE 回调先全清默认再立回调账户。 账户唯一性：accountNo+企业 code 重复即拒绝。
    applicability: 默认还款账户查询
    query_impact: 按企业查默认账户至多一行，无需去重。
    field_targets:
    - dataset: account_info
      field: default_account_flag
    evidence_refs:
    - ev-epa-auth-init
    - ev-epa-auth-default
  - rule_id: auth-state-dead-values
    label: auth_state 死值警告
    content: APPLY_00（初始化）与 APPLY_50（验证失败）在当前代码中无写点；APPLY_40 同时承接验证成功（result=0）与失败（result=1/2），判成败必须联合 error_try_count>0。
    applicability: 按认证状态统计账户
    query_impact: auth_state='APPLY_40' 不等于'验证通过'；'验证通过'应写 (auth_state='APPLY_40' AND error_try_count=0)。
    field_targets:
    - dataset: account_info
      field: auth_state
    - dataset: account_info
      field: error_try_count
    evidence_refs:
    - ev-epa-auth-enum
    - ev-epa-auth-confirm
  - rule_id: open-status-two-systems
    label: 两套开通状态体系
    content: 企业侧 cust_auth_application.open_status（NOT_OPENED/OPENING/OPENED）与租户侧 tenant_product.open_status（Y/P/N）是两套不同枚举，不能混用。企业侧读取口径 open_status IN ('OPENED','OPENING') 都算已开通；租户侧只有 Y 算。
    applicability: 按开通状态过滤产品/企业
    query_impact: 问'企业开通了哪些产品'用 OPENED/OPENING；问'租户开通了哪些产品'用 Y。
    field_targets:
    - dataset: auth_application
      field: open_status
    evidence_refs:
    - ev-epa-open-enum
    - ev-epa-open-read-both
    - ev-pcf-tp-enum
  - rule_id: payment-count-limit
    label: 打款次数限制
    content: 每次申请 payment_remaining_count-1；为 0 时拒绝再申请（'今天打款次数已用完'）；重置走 cust_setting_config.payment_maximum_number（updatePayCount）。
    applicability: 打款申请频次、失败重试解释
    query_impact: payment_remaining_count=0 的账户不可再发起认证申请。
    field_targets:
    - dataset: account_info
      field: payment_remaining_count
    evidence_refs:
    - ev-epa-auth-apply
    - ev-epa-auth-init
