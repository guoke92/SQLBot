unit_id: interworking-products
revision: 1
title: 互通产品
aliases:
- 跨系统产品
- SSO跳转
- 统一授权
- 跨平台产品
domain: 产品与配置
applicability: 用户问"互通产品清单""某租户开通了哪些互通产品""企业可见的互通产品" "跨系统授权状态"等互通产品类问题时使用。
description: 互通产品是 platform_product.product_type=INTERWORKING 的独立域（扩展点 scenario= INTERWORKING）：tenant_interworking_product（租户开通实例）→ tenant_interworking_project （项目范围关联）→ cust_interworking_product（企业开通，"查询即开通"经统一授权）。 "开通"=跨系统统一授权通过（非本平台审批）。
content:
  concepts:
  - concept_id: interworking-open-status
    name: 互通产品企业开通状态
    definition: 企业侧 cust_interworking_product.open_status：查询即开通——企业查产品列表时对每个租户互通产品调 activeProduct，已 OPENED 幂等返回；未开通且统一授权通过即 insert open_status=OPENED（无 OPENING 中间态，与 cust_auth_application 不同）。scopeRole 不含当前企业类型时不开通不展示。
    dictionary:
      NOT_OPENED: 未开通
      OPENING: 开通中（等统一授权）
      OPENED: 已开通
    field_targets:
    - dataset: cust_interworking
      field: open_status
    evidence_refs:
    - ev-iwp-activate-query-first
    - ev-iwp-scope-role-filter
    - ev-iwp-cust-open
    aliases:
    - 已开通互通产品
    - 互通产品开通
    - 开通状态
    - OPENED
  - concept_id: scope
    name: 可见范围
    definition: tenant_interworking_product.scope：ALL=全部项目可见（tenant_interworking_project 无行）；SOME=部分可见（scopeProject JSON 数组指定项目，relTenantProject 先清后插逐项目建行，name=产品名-项目名）。scopeRole 另行控制哪些企业类型可见。
    dictionary:
      ALL: 全部
      SOME: 指定范围
    field_targets:
    - dataset: tenant_interworking
      field: scope
    evidence_refs:
    - ev-iwp-scope-clear-insert
    - ev-iwp-scope
    aliases:
    - 全部可见
    - 部分可见
    - 适应范围
    - 可见项目
  - concept_id: tenant-interworking-open
    name: 租户互通产品开通状态
    aliases:
    - 租户互通产品
    - 互通产品上架
    - 租户开通互通
    definition: tenant_interworking_product.open_status 三态（Y/P/N，与 tenant_product 同构）：create 幂等新建（默认 N）→ active 置 Y + product_ref_num 增量重算 → cancel 置 N + decrement。属性从 platform_product 拷贝 + ref 锚（platform_product.code、tenant.code）。
    dictionary:
      Y: 已开通
      P: 开通中
      N: 未开通
    field_targets:
    - dataset: tenant_interworking
      field: open_status
    evidence_refs:
    - ev-iwp-tenant-create
    - ev-iwp-tenant-active-cancel
  processes:
  - stage_id: tenant-interworking-create
    name: 租户开通互通产品
    description: 租户开通互通产品：幂等(tenantId+platformProductCode 已存在直接返回)；新建从 platform_product 拷贝 12 属性字段 + ref 锚（ref_tenant_interworking_product_platform_product=platform_product.code、ref_tenant_interworking_product_tenant_setting_config=tenant.code）；默认 open_status=N。active 置 Y + platform_product.product_ref_num 增量重算；cancel 置 N + decrement。
    trigger: 管理端
    next_stages: []
    data_effects:
    - operation: insert
      dataset: tenant_interworking
      fields:
      - platform_product_code
      - tenant_id
      - open_status
      - max_financing_amount
      - scope
      - scope_project
      - scope_role
    evidence_refs:
    - ev-iwp-tenant-create
    - ev-iwp-tenant-active-cancel
  - stage_id: cust-auto-open
    name: 企业查询即开通
    description: 查询即开通：企业查产品列表时对每个租户互通产品调 activeProduct——(1) 已 OPENED 幂等返回；(2) scopeRole 非空且不含当前企业类型 return null（不开通不展示）；(3) 远程拉统一授权 AgreeAuthorization，授权通过即 insert open_status=OPENED + ref_cust_interworking_product_cust_company_info=company.code + open_time；(4) 授权不通过 return null（前端展示 OPENING）。异常吞掉只记日志。
    trigger: 企业端产品列表查询（副作用式）
    next_stages: []
    data_effects:
    - operation: insert
      dataset: cust_interworking
      fields:
      - cust_id
      - product_id
      - open_status
      - open_time
      condition: 统一授权通过→OPENED
    evidence_refs:
    - ev-iwp-activate-query-first
    - ev-iwp-scope-role-filter
    - ev-iwp-cust-open
  - stage_id: scope-config
    name: 配置适应范围
    description: saveOrUpdateScope：先删 tenant_interworking_project 该产品全部行（先清）；scope=ALL 直接返回（不插任何行=全部项目可见）；scope=SOME 解析 scopeProject JSON 数组逐项目插行（name=产品名-项目名、ref 双锚）。
    trigger: 管理端 /tenantInterworkingProduct/cmd/saveOrUpdateScope
    enter_conditions:
    - 租户互通产品已存在
    next_stages: []
    data_effects:
    - operation: upsert
      dataset: tenant_interworking_project
      fields:
      - name
      - product_id
      - project_id
      - platform_product_code
      condition: 先清后插；scope=ALL 时清空不插
    evidence_refs:
    - ev-iwp-scope-clear-insert
    - ev-iwp-scope
  datasets:
  - dataset_id: tenant_interworking
    name: tenant_interworking_product
    description: 租户互通产品开通实例（全局共享不参与租户行过滤）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编码
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      description: 租户ID
    - field_id: open_status
      name: open_status
      data_type: varchar
      description: '租户开通状态, dictionary: {Y: 已开通, N: 未开通}'
    - field_id: scope
      name: scope
      data_type: varchar
      description: '可见范围, dictionary: {ALL: 全部, SOME: 指定范围}, evidence_refs: [ev-iwp-scope]'
    - field_id: scope_project
      name: scope_project
      data_type: varchar
      description: 项目范围 JSON 数组（scope=SOME 时生效）
    - field_id: scope_role
      name: scope_role
      data_type: varchar
      description: 角色范围 JSON 数组（scope=SOME 时生效）
    - field_id: max_financing_amount
      name: max_financing_amount
      data_type: varchar
      description: 最高融资限额
    evidence_refs:
    - ev-iwp-tenant-create
    - ev-iwp-tenant-active-cancel
  - dataset_id: cust_interworking
    name: cust_interworking_product
    description: 企业互通产品开通表（"开通"=跨系统统一授权通过）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID（=cust_company_info.id）
    - field_id: product_id
      name: product_id
      data_type: bigint
      description: 租户互通产品ID（=tenant_interworking_product.id）
    - field_id: open_status
      name: open_status
      data_type: varchar
      description: '企业开通状态, dictionary: {NOT_OPENED: 未开通, OPENING: 开通中, OPENED: 已开通}, evidence_refs: [ev-iwp-cust-open]'
    - field_id: open_time
      name: open_time
      data_type: datetime
      description: 开通时间
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编码
    evidence_refs:
    - ev-iwp-activate-query-first
    - ev-iwp-scope-role-filter
  - dataset_id: tenant_interworking_project
    name: tenant_interworking_project
    description: 互通产品-项目适应范围展开表（tenant_interworking_product scope=SOME 时先清后插；scope=ALL 无行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: name
      name: name
      data_type: varchar
      description: 名称
    - field_id: product_id
      name: product_id
      data_type: bigint
      description: 产品id
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      description: 租户id
    - field_id: project_id
      name: project_id
      data_type: bigint
      description: 项目id
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 平台产品编码
    - field_id: ref_tenant_interworking_project_tenant_interworking_product
      name: ref_tenant_interworking_project_tenant_interworking_product
      data_type: varchar
      description: 租户产品项目
    - field_id: ref_tenant_interworking_project_tenant_setting_config
      name: ref_tenant_interworking_project_tenant_setting_config
      data_type: varchar
      description: 租户项目
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    evidence_refs:
    - ev-iwp-scope-clear-insert
  relationships:
  - relationship_id: cust-to-tenant-interworking
    left:
      dataset: cust_interworking
      field: product_id
    right:
      dataset: tenant_interworking
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 企业开通指向租户互通产品实例
    status: proposed
    evidence_refs:
    - ev-iwp-cust-open
    confidence: 0.95
  calibers:
  - caliber_id: opened-interworking
    label: 已开通互通产品
    description: open_status=OPENED 且启用
    contract_fragment:
      where:
      - open_status = 'OPENED'
      - enable = 'Y'
    field_targets:
    - dataset: cust_interworking
      field: open_status
    evidence_refs:
    - ev-iwp-cust-open
  metrics:
  - metric_id: interworking-open-count
    name: 互通产品开通企业数
    aggregation: COUNT
    field:
      dataset: cust_interworking
      field: cust_id
    filters:
    - open_status: OPENED
    grain:
    - dataset: cust_interworking
      field: platform_product_code
    evidence_refs:
    - ev-iwp-cust-open
  domain_rules:
  - rule_id: query-is-open-side-effect
    label: 查询即开通（副作用式）
    content: 企业互通产品列表查询内部会写 cust_interworking_product 并触发 AMS 签章同步。 授权失败时显示 OPENING 而非落库——OPENING 状态不持久化。
    applicability: 互通产品开通状态查询
    query_impact: DB 中只有 OPENED 行；OPENING 是前端实时状态，不在表里。
    field_targets:
    - dataset: cust_interworking
      field: open_status
    evidence_refs:
    - ev-iwp-activate-query-first
    - ev-iwp-scope-role-filter
  - rule_id: global-shared-tables
    label: 租户表全局共享
    content: tenant_interworking_product/project 在 EXCLUDE_MODELS（跳过租户行过滤）；cust_interworking_product 受租户过滤。
    applicability: 互通产品跨租户查询
    query_impact: 租户侧表查询需 db_tenant_code=all；企业侧表自动按租户过滤。
    field_targets:
    - dataset: tenant_interworking
      field: tenant_id
    evidence_refs:
    - ev-iwp-cust-open
    - ev-iwp-tenant-create
  - rule_id: scope-clear-then-insert
    label: 范围先清后插
    content: tenant_interworking_project 是 tenant_interworking_product 的项目展开表：每次配置先删该产品全部行再按 scopeProject 重建。scope=ALL 时清空且不插（空表=全部可见）。
    applicability: 互通产品可见项目统计
    query_impact: tenant_interworking_project 无行 ≠ 无配置——需联合 scope 字段判断（scope=ALL 或未配置）。
    field_targets:
    - dataset: tenant_interworking
      field: scope
    evidence_refs:
    - ev-iwp-scope-clear-insert
  - rule_id: no-opening-intermediate
    label: 企业侧无 OPENING 中间态
    content: cust_interworking_product.open_status 只有 OPENED 一种写值（查询即开通模式，授权通过直接终态）；无 OPENING/NOT_OPENED。前端展示的 OPENING 是未开通的展示态非落库值。
    applicability: 互通产品开通率统计
    query_impact: cust_interworking_product 有行≈已开通（授权失败不建行）；'未开通企业' = 全部企业 - 有行企业。
    field_targets:
    - dataset: cust_interworking
      field: open_status
    evidence_refs:
    - ev-iwp-activate-query-first
    - ev-iwp-scope-role-filter
  verified_query_patterns:
  - pattern_id: opened-interworking-list
    question: 某企业已开通的互通产品
    query: "SELECT ci.platform_product_code, ci.open_time FROM cust_interworking_product ci JOIN tenant_interworking_product ti ON ti.id = ci.product_id WHERE ci.cust_id = ? AND ci.open_status = 'OPENED' AND ci.enable = 'Y'\n  AND ti.open_status = 'Y' AND ti.enable = 'Y'"
    intended_specification:
      caliber_id: opened-interworking
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-iwp-cust-open
unit_links: []
assumptions: []
confidence: 0.75
