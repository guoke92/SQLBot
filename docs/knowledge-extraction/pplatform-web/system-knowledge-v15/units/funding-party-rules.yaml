unit_id: funding-party-rules
revision: 1
title: 资金方规则配置
aliases:
- 资方规则
- 资金方校验
- 资方标识
- 规则引擎
- 异常解析
domain: 资金方规则
applicability: 用户问"某资金方的校验规则""资方字段限制""异常解析建议""报错关键词匹配" 等资金方规则类问题时使用。
description: 资金方规则三表体系（funding_rule_info 主表 + detail KV 明细 + front_cfg 前端配置 模板）供外部业务系统经 Dubbo 查询校验规则；funding_exception_resolution 按报错 关键词匹配异常解析建议。注意 funding_party_rule_* 三表是废弃骨架（无DDL无调用方）。
content:
  concepts:
  - concept_id: rule-status
    name: 规则状态
    definition: funding_rule_info.rule_status 三值状态机：PENDING 待生效（新建默认）→ ACTIVE 生效中（activeRule 人工激活）→ INACTIVE 已失效（inActiveRule 停用）。更新规则不新建主行只 version+1，rule_status 不随更新重置。
    dictionary:
      PENDING: 待生效
      ACTIVE: 生效中
      INACTIVE: 已失效
    field_targets:
    - dataset: rule_info
      field: rule_status
    evidence_refs:
    - ev-fpr-rule-status-enum
    - ev-fpr-rule-save-new
    - ev-fpr-rule-active
    - ev-fpr-rule-inactive
    aliases:
    - 待生效规则
    - 生效中规则
    - 已失效规则
    - 规则状态机
  - concept_id: rule-layer
    name: 规则层级
    definition: rule_layer 三值：UNDERLYING 底层规则 / FINANCING 融资规则 / OTHER 其他规则。detail 的 rule_layer 从 funding_rule_front_cfg 继承（按 frontKey 匹配），非独立写值。
    dictionary:
      UNDERLYING: 底层资产层
      FINANCING: 融资层
      OTHER: 其他
    field_targets:
    - dataset: rule_detail
      field: rule_layer
    evidence_refs:
    - ev-fpr-layer-enum
    - ev-fpr-detail-upsert
    aliases:
    - 底层规则
    - 融资规则
    - 规则层级分类
  - concept_id: rule-version
    name: 规则版本快照
    aliases:
    - 规则版本
    - 版本号
    - 历史版本
    - 当前生效版本
    definition: funding_rule_info.version 每次更新 +1；funding_rule_detail.version 记录主行当前版本——同一 ruleKey 的新版本行覆盖旧行值（upsert 同一行），不是追加历史。fund_rule_code_ref 指向主行 code，跨表明绑。
    field_targets:
    - dataset: rule_info
      field: version
    - dataset: rule_detail
      field: version
    evidence_refs:
    - ev-fpr-rule-save-update
    - ev-fpr-detail-upsert
  - concept_id: exception-matching
    name: 异常报错匹配
    aliases:
    - 报错关键词
    - 异常解析建议
    - 错误原因
    - 解析建议
    definition: funding_exception_resolution 按 error_keyword 子串匹配运行时报错文本：命中即取 error_reason 报错原因与 suggestion 解析建议。唯一键 (productCode, fundingPartyCode, errorKeyword, enable=Y)。exception_no=资方code-#S4# 序列。
    field_targets:
    - dataset: exception_resolution
      field: error_keyword
    - dataset: exception_resolution
      field: suggestion
    evidence_refs:
    - ev-fpr-exception-unique
    - ev-fpr-exception-upsert
    - ev-fpr-exception
  processes:
  - stage_id: save-rule
    name: 保存规则
    description: 新增：查重(productCode+fundingPartyMark 唯一，重复抛错)→insert 主行(rule_status=PENDING, version=1, code=uuid)。更新：主行 version+1（不新建）。公共：按 frontKey 匹配 funding_rule_front_cfg 批量 upsert 明细——已存在(ruleInfoId+ruleKey+enable=Y)更新值否则新建；版本快照 version=主行当前版本；fund_rule_code_ref=主行 code。ruleMap 中的未知 frontKey 跳过不中断。
    trigger: 管理端 /fund-web/ruleInfo/saveOrUpdateRuleInfo
    next_stages:
    - activate-rule
    data_effects:
    - operation: upsert
      dataset: rule_info
      fields:
      - funding_party_mark
      - product_code
      - rule_status
      - version
    - operation: upsert
      dataset: rule_detail
      fields:
      - rule_info_id
      - rule_key
      - rule_value
      - rule_layer
      - version
    evidence_refs:
    - ev-fpr-rule-save-new
    - ev-fpr-rule-save-update
    - ev-fpr-detail-upsert
  - stage_id: activate-rule
    name: 生效/失效
    description: activeRule：rule_status→ACTIVE（生效中）。inActiveRule：rule_status→INACTIVE（已失效）。无自动状态迁移——全部人工操作。
    trigger: 管理端
    next_stages: []
    data_effects:
    - operation: update
      dataset: rule_info
      fields:
      - rule_status
      condition: →ACTIVE 或 INACTIVE
    evidence_refs:
    - ev-fpr-rule-active
    - ev-fpr-rule-inactive
    - ev-fpr-rule-status-enum
  datasets:
  - dataset_id: rule_info
    name: funding_rule_info
    description: 资方规则主表（一产品一资方一行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: funding_party_mark
      name: funding_party_mark
      data_type: varchar
      description: 资金方标识（RPC 外部来源）
    - field_id: funding_party_name
      name: funding_party_name
      data_type: varchar
      description: 资金方名称
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码（ProductCodeEnum）
    - field_id: rule_status
      name: rule_status
      data_type: varchar
      description: '规则状态, dictionary: {PENDING: 待生效, ACTIVE: 生效中, INACTIVE: 已失效}, evidence_refs: [ev-fpr-rule-status]'
    - field_id: version
      name: version
      data_type: int
      description: 版本号（编辑递增即时生效）
    evidence_refs:
    - ev-fpr-rule-save-new
    - ev-fpr-rule-save-update
    - ev-fpr-rule-status-enum
  - dataset_id: rule_detail
    name: funding_rule_detail
    description: 资方规则 KV 明细（一行=一个规则项）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: rule_info_id
      name: rule_info_id
      data_type: bigint
      description: 规则主表ID（=funding_rule_info.id）
    - field_id: fund_rule_code_ref
      name: fund_rule_code_ref
      data_type: varchar
      description: 规则主表编码（=funding_rule_info.code）
    - field_id: rule_key
      name: rule_key
      data_type: varchar
      description: 规则键（=front_cfg.front_key）
    - field_id: rule_value
      name: rule_value
      data_type: varchar
      description: 规则值
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
      description: '规则层级, dictionary: UNDERLYING=底层, FINANCING=融资, OTHER=其他'
    - field_id: version
      name: version
      data_type: int
      description: 版本快照
    evidence_refs:
    - ev-fpr-detail-upsert
    - ev-fpr-layer-enum
  - dataset_id: front_cfg
    name: funding_rule_front_cfg
    description: 资方规则前端配置模板（定义可配置的规则项及其渲染方式）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
      description: '规则层级, dictionary: UNDERLYING=底层, FINANCING=融资, OTHER=其他'
    - field_id: front_key
      name: front_key
      data_type: varchar
      description: 前端键（=detail.rule_key）
    - field_id: key_name
      name: key_name
      data_type: varchar
      description: 规则名称
    - field_id: rule_key
      name: rule_key
      data_type: varchar
      description: 业务字段标识
    - field_id: key_type
      name: key_type
      data_type: varchar
      description: '规则类型, dictionary: FIELD_REQUIRED=字段必填, FIELD_LENGTH_LIMIT=字段长度限制, FILE_SIZE_SINGLE_LIMIT=单文件大小限制, FILE_COUNT_LIMIT=文件数量限制'
    evidence_refs:
    - ev-fpr-detail-upsert
    - ev-fpr-layer-enum
  - dataset_id: exception_resolution
    name: funding_exception_resolution
    description: 资金方异常解析建议（按报错关键词子串匹配）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: exception_no
      name: exception_no
      data_type: varchar
      description: 异常编号
    - field_id: funding_party_code
      name: funding_party_code
      data_type: varchar
      description: 资方标识
    - field_id: funding_party_name
      name: funding_party_name
      data_type: varchar
      description: 资方名称
    - field_id: error_keyword
      name: error_keyword
      data_type: varchar
      description: 报错关键词（子串匹配）
    - field_id: error_reason
      name: error_reason
      data_type: varchar
      description: 报错原因
    - field_id: suggestion
      name: suggestion
      data_type: varchar
      description: 解析建议
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码
    evidence_refs:
    - ev-fpr-exception-upsert
    - ev-fpr-exception-unique
    - ev-fpr-exception-query
  relationships:
  - relationship_id: detail-to-info
    left:
      dataset: rule_detail
      field: rule_info_id
    right:
      dataset: rule_info
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 规则明细归属主表
    status: proposed
    evidence_refs:
    - ev-fpr-rule-status
    confidence: 0.95
  - relationship_id: detail-to-frontcfg
    left:
      dataset: rule_detail
      field: rule_key
    right:
      dataset: front_cfg
      field: front_key
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 明细键与前端配置模板键关联
    status: proposed
    evidence_refs:
    - ev-fpr-rule-status
    confidence: 0.9
  calibers:
  - caliber_id: active-rule
    label: 生效中规则
    description: rule_status=ACTIVE 且启用
    contract_fragment:
      where:
      - rule_status = 'ACTIVE'
      - enable = 'Y'
    field_targets:
    - dataset: rule_info
      field: rule_status
    evidence_refs:
    - ev-fpr-rule-status
  metrics:
  - metric_id: rule-count-by-party
    name: 资方规则数
    description: 按资方+产品统计规则数
    aggregation: COUNT
    field:
      dataset: rule_info
      field: id
    filters:
    - rule_status: ACTIVE
    grain:
    - dataset: rule_info
      field: funding_party_mark
    - dataset: rule_info
      field: product_code
    evidence_refs:
    - ev-fpr-rule-status
  domain_rules:
  - rule_id: dead-skeleton-tables
    label: funding_party_rule_* 是废弃骨架
    content: funding_party_rule_cfg/detail/front 三表仅有低代码生成的 DO/Mapper 空壳， 全仓库无业务调用方、docs 无 DDL——是 GROUP-0002 设计迭代残留，实现已演进为 funding_rule_*。Dubbo 接口 Javadoc 引用它们属文档误导。
    applicability: 资金方规则数据查找
    query_impact: 查资金方规则数据只能查 funding_rule_info/detail/front_cfg，不能查 funding_party_rule_*。
    field_targets:
    - dataset: rule_info
      field: funding_party_mark
    evidence_refs:
    - ev-fpr-rule-status
  - rule_id: rpc-external-anchor
    label: 资方标识来自外部 RPC
    content: funding_party_mark 经 RPC（QUERY_FUNDER_MARK）来自外部系统，非本库表关联。
    applicability: 资方维度统计的数据来源
    query_impact: 资方标识/名称可能与外部系统不同步。
    field_targets:
    - dataset: rule_info
      field: funding_party_mark
    evidence_refs:
    - ev-fpr-rule-status
  - rule_id: exception-substring-match
    label: 异常关键词子串匹配
    content: 异常解析按 errorMessage.contains(errorKeyword) 子串匹配（注释称忽略大小写 但实现未忽略），多条命中全部返回。唯一键=(fundingPartyCode,errorKeyword,productCode)。
    applicability: 异常解析查询
    query_impact: 关键词越长越精确；短关键词可能误匹配多条。
    field_targets:
    - dataset: exception_resolution
      field: error_keyword
    evidence_refs:
    - ev-fpr-exception
    - ev-fpr-exception-unique
  - rule_id: rule-unique-per-product-party
    label: 产品+资方唯一
    content: funding_rule_info 按 (product_code, funding_party_mark) 唯一——同产品同资方至多一套规则；重复新增抛'不允许重复新增'。
    applicability: 规则数统计、重复配置排查
    query_impact: 按产品统计规则数即按资方数统计（一对一）；无需 DISTINCT。
    field_targets:
    - dataset: rule_info
      field: product_code
    - dataset: rule_info
      field: funding_party_mark
    evidence_refs:
    - ev-fpr-rule-save-new
  - rule_id: rule-version-not-history
    label: 版本是覆盖不是历史
    content: funding_rule_detail 按 (ruleInfoId, ruleKey) upsert 同一行——version 只反映主行更新次数，不保留旧版本值。查'上一版规则值'在本地库不可得。
    applicability: 规则变更历史查询
    query_impact: 只能查当前生效值；历史版本需运营平台审计流。
    field_targets:
    - dataset: rule_detail
      field: version
    evidence_refs:
    - ev-fpr-detail-upsert
    - ev-fpr-rule-save-update
  verified_query_patterns:
  - pattern_id: active-rule-by-party
    question: 某资方某产品的生效校验规则
    query: "SELECT d.rule_key, d.rule_value, d.rule_layer FROM funding_rule_detail d JOIN funding_rule_info i ON i.id = d.rule_info_id WHERE i.funding_party_mark = ? AND i.product_code = ?\n  AND i.rule_status = 'ACTIVE' AND i.enable = 'Y' AND d.enable = 'Y'"
    intended_specification:
      caliber_id: active-rule
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-fpr-rule-status
unit_links: []
assumptions:
- funding_party_rule_cfg/detail/front 三表是废弃骨架（无DDL无调用方），coverage 中列 excluded。
- 资方标识（funding_party_mark/code）来自外部 RPC，非本库表。
confidence: 0.75
