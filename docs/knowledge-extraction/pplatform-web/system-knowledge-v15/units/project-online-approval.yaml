unit_id: project-online-approval
revision: 1
title: 项目上线审批
aliases:
- 项目审批
- 上线审批
- 审批流
- 审批工作台
- 重新发起审批
domain: 项目审批
applicability: 用户问"项目审批清单""审批通过的项目""审批中/待发起的审批""最新一轮审批""审批轨迹/ 审批意见""审批通过率/时长""重新发起"等项目上线审批类问题时使用。
description: 项目上线审批全流程：新增项目自动建 PENDING 草稿 → 提交启动工作流引擎（RUNNING）→ 审批工作台操作（同意/驳回/退回/转审，落 flow_node 操作流水与 flow 节点状态）→ 引擎回调收敛主表 wf_status（FINISHED/TERMINATED）并置项目生效 → 拒绝后复制新单重新发起 （is_latest 轮次标记）。审批域内部以 String
  code 弱关联（ref_* 列存对端 code）。
content:
  concepts:
  - concept_id: wf-status
    name: 审批工作流状态
    aliases:
    - 审批通过
    - 审批中
    - 待发起
    - 审批拒绝
    - 已拒绝
    definition: tenant_project_approval.wf_status 引擎视角整单状态：PENDING 待发起（草稿）→ RUNNING 审批中 → FINISHED 审批通过 / TERMINATED 审批拒绝。无撤回语义， 终态后只能重新发起新一轮。
    dictionary:
      PENDING: 待发起
      RUNNING: 审批中
      FINISHED: 审批通过
      TERMINATED: 审批拒绝
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-enum-wfstatus
    - ev-poa-submit
  - concept_id: is-latest
    name: 最新一轮审批
    aliases:
    - 最新审批
    - 当前审批
    definition: is_latest='Y' 标记每项目至多一条的最新轮审批；列表/详情默认只看最新轮。 重新发起时旧轮置 N、新轮 Y。
    field_targets:
    - dataset: approval
      field: is_latest
    evidence_refs:
    - ev-poa-recreate
  - concept_id: node-status
    name: 审批节点状态
    aliases:
    - 节点审批
    - 待审批
    - 已通过节点
    definition: tenant_project_approval_flow.node_status 节点视角状态（PENDING/APPROVING/APPROVED/REJECTED）， 与主表 wf_status 两级不同："审批通过"整单=FINISHED，节点=APPROVED。
    dictionary:
      PENDING: 待审批
      APPROVING: 审批中
      APPROVED: 已通过
      REJECTED: 已拒绝
    field_targets:
    - dataset: approval_flow
      field: node_status
    evidence_refs:
    - ev-poa-enum-nodestatus
  - concept_id: operate-type
    name: 审批操作类型
    aliases:
    - 同意
    - 驳回
    - 退回
    - 转审
    definition: flow_node 操作流水的动作类型（pass/reject/back/delegate）。
    dictionary:
      pass: 同意
      reject: 驳回
      back: 退回
      delegate: 转审
    field_targets:
    - dataset: approval_flow_node
      field: operate_type
    evidence_refs:
    - ev-poa-desk
  - concept_id: approval-type
    name: 审批类型
    aliases:
    - 上线审批
    - 后补协议
    definition: flow_node 按 approval_type 分域：ONLINE_APPROVAL 项目上线审批 与 BACK_AGREEMENT 后补合作协议（共用流水表，nodeOrder 各自从 1 递增）。 狭义"上线审批"指 ONLINE_APPROVAL。
    dictionary:
      ONLINE_APPROVAL: 项目上线审批
      BACK_AGREEMENT: 后补合作协议
    field_targets:
    - dataset: approval_flow_node
      field: approval_type
    evidence_refs:
    - ev-poa-desk
  - concept_id: project-type
    name: 项目类型
    aliases:
    - 标准项目
    - 常规项目
    definition: STANDARD 标准项目 / REGULAR 常规项目（REGULAR 且低风险决定是否推 AMS）。
    dictionary:
      STANDARD: 标准项目
      REGULAR: 常规项目
    field_targets:
    - dataset: approval
      field: project_type
    evidence_refs:
    - ev-poa-finished
  - concept_id: flow-code
    name: 流程配置编码
    aliases:
    - 无需上线审批
    - 标准流程
    - 常规流程
    definition: NO_ONLINE 无需上线审批 / STANDARD 标准项目流程 / REGULAR 常规项目流程。
    dictionary:
      NO_ONLINE: 无需上线审批
      STANDARD: 标准项目流程
      REGULAR: 常规项目流程
    field_targets:
    - dataset: approval
      field: flow_code
    evidence_refs:
    - ev-poa-enum-flowcode
  processes:
  - stage_id: create-draft
    name: 创建审批草稿
    description: 新增项目（is_add=Y）且挡板开、产品支持时自动建 PENDING 草稿（is_latest=Y）； 历史项目走向导补建。审批编号 SX+日期+序号。
    trigger: 新增项目 / 历史项目向导
    next_stages:
    - submit
    data_effects:
    - operation: insert
      dataset: approval
      fields:
      - approval_no
      - wf_status
      - is_latest
      - is_add
      - enable
      - ref_tenant_project_approval_tenant_project
      condition: wf_status=PENDING, is_latest=Y
    evidence_refs:
    - ev-poa-create
  - stage_id: submit
    name: 提交启动工作流
    description: 两段式：事务内重建流程节点（先删后增，node_order 重排 1..n、node_status=PENDING） 并重置 wf_status=PENDING；事务外调引擎启动，成功则 initiate_time/wf_status=RUNNING/ act_procinst_id，失败降级保持 PENDING。首次正式提交回写 tenant_project.wechat_audit_no。
    trigger: 企业端提交（isDraft 区分暂存/正式）
    enter_conditions:
    - wf_status = PENDING
    next_stages:
    - desk-operate
    data_effects:
    - operation: insert
      dataset: approval_flow
      fields:
      - node_code
      - node_name
      - node_order
      - node_status
      - approver_user_id
      condition: 先删后增，node_status=PENDING
    - operation: update
      dataset: approval
      fields:
      - wf_status
      - initiate_time
      - act_procinst_id
      - wf_procdef_key
      condition: 引擎启动成功 → RUNNING
    - operation: update
      dataset: project
      fields:
      - wechat_audit_no
      condition: is_add=Y 首次提交且原值为空
    evidence_refs:
    - ev-poa-submit
  - stage_id: desk-operate
    name: 审批工作台操作
    description: 同意/驳回/退回/转审（锁 project_approval:node:{approvalId}）：事务内 INSERT flow_node 操作流水（操作人/意见/时间/是否低风险），法务经办节点同步主表 is_low_risk， 业务经理节点落 flow_credit；事务外调引擎，引擎异步回调收敛状态。业务系统在 RUNNING + 方案经理/方案配置节点 APPROVING
      时可推 business_info。
    trigger: 审批人在工作台操作
    next_stages:
    - engine-callback
    data_effects:
    - operation: insert
      dataset: approval_flow_node
      fields:
      - node_code
      - node_order
      - operate_type
      - approval_type
      - approve_comment
      - operator_user_id
      - operator_user_name
      - operate_time
      - is_low_risk
      - is_back_agreement
    - operation: update
      dataset: approval
      fields:
      - is_low_risk
      condition: 法务经办节点同意时回写
    - operation: upsert
      dataset: approval_business
      fields:
      - product_code
      - source_system
      - attachment_json
      - ref_tenant_project_approval_business_info_project_approval
      condition: RUNNING+方案节点 APPROVING 时业务系统推送
    evidence_refs:
    - ev-poa-desk
    - ev-poa-bizinfo
  - stage_id: engine-callback
    name: 引擎回调收敛
    description: 引擎通知驱动节点状态与主表状态：流程结束 pass→wf_status=FINISHED（写 complete_time、 项目置生效、按条件推 AMS）；reject/back→TERMINATED。中间节点 pass 保持 RUNNING、 back 节点回 PENDING。
    trigger: 工作流引擎异步回调（ProjectOnlineProcessOperateListener）
    next_stages: []
    data_effects:
    - operation: update
      dataset: approval_flow
      fields:
      - node_status
      condition: APPROVED/REJECTED/PENDING/APPROVING 按通知类型
    - operation: update
      dataset: approval
      fields:
      - wf_status
      - complete_time
      - wf_last_operator
      - wf_last_operate_time
      condition: 终态 FINISHED/TERMINATED
    evidence_refs:
    - ev-poa-callback
  - stage_id: recreate
    name: 重新发起（多轮）
    description: 拒绝后复制新单：原单 is_latest=N（状态保持 TERMINATED 不改写），新单新编号、 wf_status=PENDING、is_latest=Y、ref 指向原单 code；business_info/flow/五类影像一并复制。 同项目存在 PENDING/RUNNING 审批时禁止再发起。
    trigger: 企业端重新发起 / 复制新草稿
    enter_conditions:
    - is_latest = Y
    - 同项目无 PENDING/RUNNING 审批
    next_stages:
    - submit
    data_effects:
    - operation: update
      dataset: approval
      fields:
      - is_latest
      condition: 原单 → N
    - operation: insert
      dataset: approval
      fields:
      - approval_no
      - wf_status
      - is_latest
      - ref_tenant_project_approval_tenant_project_approval
      condition: 新单 PENDING/Y/指原单
    evidence_refs:
    - ev-poa-recreate
  datasets:
  - dataset_id: approval
    name: tenant_project_approval
    description: 项目上线审批主表（每轮审批一行，is_latest 标记最新轮，引擎视角 wf_status）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码（域内子表 ref_* 外键锚点）
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: approval_no
      name: approval_no
      data_type: varchar
      description: 审批编号（SX+yyyymmdd+序号）
    - field_id: wf_status
      name: wf_status
      data_type: varchar
      description: 工作流状态
      dictionary:
        PENDING: 待发起
        RUNNING: 审批中
        FINISHED: 审批通过
        TERMINATED: 审批拒绝
      evidence_refs:
      - ev-poa-enum-wfstatus
    - field_id: is_latest
      name: is_latest
      data_type: varchar
      description: 是否最新审批（Y/N；每项目至多一条 Y）
    - field_id: is_add
      name: is_add
      data_type: varchar
      description: 是否新增项目（Y/N）
    - field_id: ref_tenant_project_approval_tenant_project
      name: ref_tenant_project_approval_tenant_project
      data_type: varchar
      description: 关联租户项目（=tenant_project.code）
    - field_id: ref_tenant_project_approval_tenant_project_approval
      name: ref_tenant_project_approval_tenant_project_approval
      data_type: varchar
      description: 关联原审批数据（重发起链=原审批.code）
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      description: 立项审批编号（wechat_project_approval_apply.sp_no）
    - field_id: project_type
      name: project_type
      data_type: varchar
      description: 项目类型
      dictionary:
        STANDARD: 标准项目
        REGULAR: 常规项目
      evidence_refs:
      - ev-poa-finished
    - field_id: flow_code
      name: flow_code
      data_type: varchar
      description: 流程配置编码
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-poa-enum-flowcode
    - field_id: is_low_risk
      name: is_low_risk
      data_type: varchar
      description: 是否低风险项目（Y/N，法务经办节点回写）
    - field_id: initiate_time
      name: initiate_time
      data_type: datetime
      description: 发起时间（引擎启动成功才写）
    - field_id: complete_time
      name: complete_time
      data_type: datetime
      description: 完成时间（终态才写）
    - field_id: wf_last_operator
      name: wf_last_operator
      data_type: varchar
      description: 工作流最近操作人
    - field_id: wf_last_operate_time
      name: wf_last_operate_time
      data_type: datetime
      description: 工作流最近操作时间
    - field_id: act_procinst_id
      name: act_procinst_id
      data_type: varchar
      description: 工作流实例 id
    - field_id: wf_procdef_key
      name: wf_procdef_key
      data_type: varchar
      description: 工作流流程定义key
    evidence_refs:
    - ev-poa-create
    - ev-poa-submit
  - dataset_id: approval_flow
    name: tenant_project_approval_flow
    description: 审批流程节点表（提交时先删后增重建，每节点一行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: node_code
      name: node_code
      data_type: varchar
      description: 节点编码
      dictionary:
        PROJECT_CONFIG: 方案配置
        PROJECT_MANAGER: 方案经理
        LEGAL_PROCESS: 法务经办
        LEGAL_REVIEW: 法务复核
        BUSINESS_MANAGER: 业务经理审批
        OPERATION: 运营审批
        OTHER: 其他
        SUPPLEMENT_AGREEMENT: 补充协议
      evidence_refs:
      - ev-poa-enum-nodecode
    - field_id: node_name
      name: node_name
      data_type: varchar
      description: 节点名称（中文）
    - field_id: node_order
      name: node_order
      data_type: int
      description: 节点顺序（从 1 开始）
    - field_id: node_status
      name: node_status
      data_type: varchar
      description: 节点状态
      dictionary:
        PENDING: 待审批
        APPROVING: 审批中
        APPROVED: 已通过
        REJECTED: 已拒绝
      evidence_refs:
      - ev-poa-enum-nodestatus
    - field_id: approver_user_id
      name: approver_user_id
      data_type: varchar
      description: 审批人 userId
    - field_id: ref_tenant_project_approval_flow_tenant_project_approval
      name: ref_tenant_project_approval_flow_tenant_project_approval
      data_type: varchar
      description: 关联项目审批（=approval.code）
    evidence_refs:
    - ev-poa-submit
  - dataset_id: approval_flow_node
    name: tenant_project_approval_flow_node
    description: 审批操作流水（append-only，无状态字段——状态靠 operate_type 表达）； ONLINE_APPROVAL 与 BACK_AGREEMENT 按 approval_type 分域、nodeOrder 各自递增。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: node_code
      name: node_code
      data_type: varchar
      description: 节点编码
    - field_id: node_order
      name: node_order
      data_type: int
      description: 审批顺序（按 approvalType 分域从 1 递增）
    - field_id: approval_type
      name: approval_type
      data_type: varchar
      description: 审批类型
      dictionary:
        ONLINE_APPROVAL: 项目上线审批
        BACK_AGREEMENT: 后补合作协议
      evidence_refs:
      - ev-poa-desk
    - field_id: operate_type
      name: operate_type
      data_type: varchar
      description: 操作类型
      dictionary:
        pass: 同意
        reject: 驳回
        back: 退回
        delegate: 转审
      evidence_refs:
      - ev-poa-desk
    - field_id: approve_comment
      name: approve_comment
      data_type: varchar
      description: 审批意见
    - field_id: operator_user_id
      name: operator_user_id
      data_type: varchar
      description: 操作人 userId
    - field_id: operator_user_name
      name: operator_user_name
      data_type: varchar
      description: 操作人姓名
    - field_id: operate_time
      name: operate_time
      data_type: datetime
      description: 操作时间
    - field_id: is_low_risk
      name: is_low_risk
      data_type: varchar
      description: 是否低风险项目（法务经办操作携带）
    - field_id: is_back_agreement
      name: is_back_agreement
      data_type: varchar
      description: 是否后补合作协议
    - field_id: ref_tenant_project_approval_flow_node_project_approval
      name: ref_tenant_project_approval_flow_node_project_approval
      data_type: varchar
      description: 关联项目审批（=approval.code）
    - field_id: ref_tenant_project_approval_flow_node_project_approval_flow
      name: ref_tenant_project_approval_flow_node_project_approval_flow
      data_type: varchar
      description: 关联项目审批流程（=approval_flow.code）
    evidence_refs:
    - ev-poa-desk
  - dataset_id: approval_business
    name: tenant_project_approval_business_info
    description: 业务系统（讯易链/线上保理/订单融资）在审批中推送的运营配置（仅方案经理/方案配置 节点 APPROVING 时接受落库，否则静默丢弃）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: product_code
      name: product_code
      data_type: varchar
      description: 产品编码code
    - field_id: source_system
      name: source_system
      data_type: varchar
      description: 来源系统
      dictionary:
        ACFLOW: 讯易链
        RVSFACTOR_PC: 线上保理
        ORDER: 订单融资
    - field_id: attachment_json
      name: attachment_json
      data_type: varchar
      description: 附件列表 JSON
    - field_id: ref_tenant_project_approval_business_info_project_approval
      name: ref_tenant_project_approval_business_info_project_approval
      data_type: varchar
      description: 关联项目审批（=approval.code；未绑定记录为空）
    evidence_refs:
    - ev-poa-bizinfo
  - dataset_id: project
    name: tenant_project
    description: 租户项目配置（本单元仅引用关联与回写字段）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码（审批 ref_* 锚点）
    - field_id: wechat_audit_no
      name: wechat_audit_no
      data_type: varchar
      description: 企微审批编号（首次提交回写）
    evidence_refs:
    - ev-poa-submit
    - ev-poa-callback
  relationships:
  - relationship_id: approval-project
    left:
      dataset: approval
      field: ref_tenant_project_approval_tenant_project
    right:
      dataset: project
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 审批归属项目（列表页 JOIN 锚点）
    status: proposed
    evidence_refs:
    - ev-poa-create
    - ev-poa-page
    confidence: 0.95
  - relationship_id: flow-approval
    left:
      dataset: approval_flow
      field: ref_tenant_project_approval_flow_tenant_project_approval
    right:
      dataset: approval
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 流程节点归属审批
    status: proposed
    evidence_refs:
    - ev-poa-submit
    confidence: 0.95
  - relationship_id: flow-node-approval
    left:
      dataset: approval_flow_node
      field: ref_tenant_project_approval_flow_node_project_approval
    right:
      dataset: approval
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 操作流水归属审批
    status: proposed
    evidence_refs:
    - ev-poa-desk
    confidence: 0.95
  - relationship_id: flow-node-flow
    left:
      dataset: approval_flow_node
      field: ref_tenant_project_approval_flow_node_project_approval_flow
    right:
      dataset: approval_flow
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 操作流水归属流程节点
    status: proposed
    evidence_refs:
    - ev-poa-desk
    confidence: 0.9
  - relationship_id: business-approval
    left:
      dataset: approval_business
      field: ref_tenant_project_approval_business_info_project_approval
    right:
      dataset: approval
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 业务推送配置归属审批（未绑定时为空串/NULL，允许悬空）
    status: proposed
    evidence_refs:
    - ev-poa-bizinfo
    confidence: 0.9
  - relationship_id: approval-self-prev
    left:
      dataset: approval
      field: ref_tenant_project_approval_tenant_project_approval
    right:
      dataset: approval
      field: code
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 重新发起链（新轮指向原轮，链式多轮）
    status: proposed
    evidence_refs:
    - ev-poa-recreate
    confidence: 0.95
  calibers:
  - caliber_id: approval-passed
    label: 审批通过（整单）
    description: 工作流终态为通过（列表口径另需 is_latest='Y'）
    contract_fragment:
      where:
      - wf_status = 'FINISHED'
      - enable = 'Y'
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-enum-wfstatus
  - caliber_id: approval-running
    label: 审批中
    description: 引擎运行中（含待办未开始的节点）
    contract_fragment:
      where:
      - wf_status = 'RUNNING'
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-submit
  - caliber_id: approval-pending
    label: 待发起（草稿）
    description: 尚未正式提交（暂存或引擎启动失败降级）
    contract_fragment:
      where:
      - wf_status = 'PENDING'
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-create
  - caliber_id: latest-round
    label: 最新一轮审批
    description: 每项目至多一条 is_latest=Y
    contract_fragment:
      where:
      - is_latest = 'Y'
      - enable = 'Y'
    field_targets:
    - dataset: approval
      field: is_latest
    evidence_refs:
    - ev-poa-recreate
    - ev-poa-page
  - caliber_id: unfinished-no-refile
    label: 未完成审批（防重复发起判据）
    description: 同项目存在待发起或审批中的审批时禁止再发起
    contract_fragment:
      where:
      - wf_status IN ('PENDING','RUNNING')
    field_targets:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-recreate
  - caliber_id: submitted
    label: 已发起（提交成功）
    description: 引擎启动成功才写 initiate_time（统计"已发起"用它而非 wf_status）
    contract_fragment:
      where:
      - initiate_time IS NOT NULL
    field_targets:
    - dataset: approval
      field: initiate_time
    evidence_refs:
    - ev-poa-submit
  metrics:
  - metric_id: approval-count
    name: 审批单量
    description: 审批数量（可按状态/项目类型/产品分组）
    aggregation: COUNT
    field:
      dataset: approval
      field: id
    filters:
    - enable: Y
    grain:
    - dataset: approval
      field: wf_status
    - dataset: approval
      field: project_type
    evidence_refs:
    - ev-poa-page
  - metric_id: approval-pass-rate
    name: 审批通过率
    description: FINISHED / (FINISHED+TERMINATED)，仅终态为分母
    aggregation: COUNT
    field:
      dataset: approval
      field: id
    filters:
    - wf_status IN ('FINISHED','TERMINATED'): true
    grain:
    - dataset: approval
      field: wf_status
    evidence_refs:
    - ev-poa-enum-wfstatus
  - metric_id: approval-avg-duration
    name: 平均审批时长
    description: avg(complete_time - initiate_time)，分母仅终态单
    aggregation: AVG
    field:
      dataset: approval
      field: complete_time
    filters:
    - wf_status IN ('FINISHED','TERMINATED'): true
    evidence_refs:
    - ev-poa-callback
  - metric_id: refile-rounds
    name: 重发起轮次
    description: 同项目审批行数（is_latest=Y 为最新轮）
    aggregation: COUNT
    field:
      dataset: approval
      field: id
    grain:
    - dataset: approval
      field: ref_tenant_project_approval_tenant_project
    evidence_refs:
    - ev-poa-recreate
  domain_rules:
  - rule_id: wf-vs-node-status
    label: 整单状态与节点状态两级边界
    content: wf_status 是引擎视角整单状态（仅 RUNNING/终态由引擎回调写）；flow.node_status 是 节点视角。"审批通过"整单=wf_status=FINISHED、节点=node_status=APPROVED； reject 与 back 在流程结束通知时都落整单 TERMINATED+节点 REJECTED。
    applicability: 按审批状态过滤/统计
    query_impact: 筛"审批通过的审批单"用 wf_status='FINISHED'；筛"某节点已通过"用 flow.node_status； 两者混用会得到不同行集。
    field_targets:
    - dataset: approval
      field: wf_status
    - dataset: approval_flow
      field: node_status
    evidence_refs:
    - ev-poa-callback
    - ev-poa-enum-nodestatus
  - rule_id: latest-round-default
    label: 默认只看最新轮
    content: 列表页固定过滤 is_latest='Y'；历史轮保留（TERMINATED）不计入默认清单。
    applicability: 审批清单/统计
    query_impact: 不过滤 is_latest 会把同项目多轮重复计入单量与通过率。
    field_targets:
    - dataset: approval
      field: is_latest
    evidence_refs:
    - ev-poa-page
  - rule_id: two-phase-submit
    label: 两段式提交与降级
    content: 业务事务先落库，事务外调工作流引擎，引擎异步回调收敛状态；启动失败保持 PENDING 可重提。complete_time 仅终态写。
    applicability: 审批时长统计、状态解释
    query_impact: initiate_time 为空的 RUNNING 不存在（启动成功才写）；时长统计以 initiate_time/complete_time 为准而非 create_time。
    field_targets:
    - dataset: approval
      field: initiate_time
    - dataset: approval
      field: complete_time
    evidence_refs:
    - ev-poa-submit
    - ev-poa-callback
  - rule_id: no-withdraw-recreate-only
    label: 无撤回、拒绝后复制重发
    content: 无撤回语义；TERMINATED 后走 createApproval 复制新单（原单不改写），业务配置/ 流程/影像随复制。同项目存在 PENDING/RUNNING 时禁止再发起。
    applicability: 多轮审批统计、轨迹审计
    query_impact: 同项目多轮审批是不同行（不同 approval_no），轮次=行数； ref_..._tenant_project_approval 串起轮次链。
    field_targets:
    - dataset: approval
      field: ref_tenant_project_approval_tenant_project_approval
    - dataset: approval
      field: approval_no
    evidence_refs:
    - ev-poa-recreate
  - rule_id: business-info-window
    label: 业务配置推送窗口
    content: 业务系统推送 business_info 仅在审批 RUNNING 且方案经理/方案配置节点 APPROVING 时接受落库，窗口外静默丢弃。
    applicability: 业务配置完整性核查
    query_impact: business_info 缺失不等于业务系统没推——可能是推送窗口外被丢弃。
    field_targets:
    - dataset: approval_business
      field: ref_tenant_project_approval_business_info_project_approval
    evidence_refs:
    - ev-poa-bizinfo
  - rule_id: flow-node-domain-split
    label: 操作流水按审批类型分域
    content: flow_node 共用于 ONLINE_APPROVAL 与 BACK_AGREEMENT，nodeOrder 按 approvalType 各自从 1 递增；查"上线审批轨迹"须加 approval_type='ONLINE_APPROVAL'。
    applicability: 审批轨迹/操作流水查询
    query_impact: 不加 approval_type 过滤会把后补协议操作混入上线审批轨迹。
    field_targets:
    - dataset: approval_flow_node
      field: approval_type
    evidence_refs:
    - ev-poa-desk
  verified_query_patterns:
  - pattern_id: page-approval-list
    question: 项目审批分页清单（默认最新轮）
    query: SELECT tpa.*, tp.name AS project_name FROM tenant_project_approval tpa LEFT JOIN tenant_project tp ON tp.code = tpa.ref_tenant_project_approval_tenant_project WHERE tpa.enable = 'Y' AND tpa.is_latest
      = 'Y' ORDER BY tpa.initiate_time IS NULL DESC, tpa.initiate_time DESC, tpa.update_time DESC
    intended_specification:
      caliber_id: latest-round
      note: 列表页固定谓词 enable+is_latest
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-poa-page
  - pattern_id: latest-approval-by-project
    question: 按项目查最新审批
    query: SELECT * FROM tenant_project_approval WHERE ref_tenant_project_approval_tenant_project = ? AND enable = 'Y' AND is_latest = 'Y' ORDER BY initiate_time DESC LIMIT 1
    intended_specification:
      caliber_id: latest-round
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-poa-latest
unit_links: []
assumptions:
- 工作流引擎是外部系统（act_procinst_id 为引擎实例 id）；引擎状态经异步回调收敛，存在短暂不一致窗口。
- flow_credit（授信）与 flow_file（附件）表本包未声明为数据集（见 coverage COVERAGE_GAP）。
- 域内关联全部为 String code 弱关联（ref_* 存对端 code 而非 id），无数据库外键。
confidence: 0.85
