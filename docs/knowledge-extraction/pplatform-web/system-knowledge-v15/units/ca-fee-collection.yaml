unit_id: ca-fee-collection
revision: 1
title: CA 服务费收缴台账
aliases:
- CA服务费
- 服务费缴费
- 缴费台账
- 年费
- 服务费拦截
- 服务费白名单
domain: CA认证与服务费
applicability: 用户问"已缴费/未缴费企业""待缴费订单""服务费台账统计""本月实缴金额""缴费率" "服务费白名单""年费锁定""服务费到期/续费""未缴费拦截哪些业务"等问题时使用。
description: CA 服务费收缴全链路：项目收费配置（ca_fee_project_config，按项目开关+角色年费+拦截场景）、 企业缴费台账（ca_fee_company，按统一社会信用代码一行、全局共享不参与租户行过滤）、 订单流转（ca_fee_order，PENDING→PAID/CLOSED）。计费为按企业按年固定费（默认 100 元）， 首缴锁价；未缴费可按项目配置拦截门户进入/融资申请/确权/转让签收四类业务节点。
content:
  concepts:
  - concept_id: company-pay-status
    name: 企业缴费状态
    aliases:
    - 已缴费企业
    - 未缴费企业
    - 欠费企业
    definition: ca_fee_company.pay_status：PAID 已缴费（在服务期内）/ UNPAID 未缴费。 注意服务到期任务会把 PAID 翻回 UNPAID。
    dictionary:
      PAID: 已缴费
      UNPAID: 未缴费
    field_targets:
    - dataset: fee_company
      field: pay_status
    evidence_refs:
    - ev-cfc-write-paid
    - ev-cfc-write-unpaid
  - concept_id: order-status
    name: 订单状态
    aliases:
    - 待缴费订单
    - 已缴费订单
    - 已关闭订单
    definition: ca_fee_order.order_status：PENDING 未缴费（新建单）→ PAID 已缴费 / CLOSED 已关闭。 EXPIRED 枚举存在但无写值点（残留值）。订单侧无 UNPAID 值——"待缴费"用 PENDING 表达。
    dictionary:
      PENDING: 未缴费
      PAID: 已缴费
      CLOSED: 已关闭
      EXPIRED: 已过期（无写值点，残留值）
    field_targets:
    - dataset: fee_order
      field: order_status
    evidence_refs:
    - ev-cfc-order-pending
    - ev-cfc-order-paid
  - concept_id: order-type
    name: 订单类型
    aliases:
    - 首次缴费
    - 续费
    - 存量补录
    definition: FIRST 首次缴费 / RENEW 即将到期续费 / RENEW_EXPIRED 已到期续费 / STOCK 存量补录 （项目开收费后对存量关联企业补建）。
    dictionary:
      FIRST: 首次缴费
      RENEW: 即将到期续费
      RENEW_EXPIRED: 已到期续费
      STOCK: 存量补录
    field_targets:
    - dataset: fee_order
      field: order_type
    evidence_refs:
    - ev-cfc-trigger
  - concept_id: fee-whitelist
    name: 服务费白名单
    aliases:
    - 白名单企业
    - 豁免企业
    - 0元企业
    definition: 项目特殊配置 WHITELIST：企业豁免年费（special_annual_fee=0、special_config_flag=Y）， 生成 PAID+payAmount=0 订单，服务期截止 2099-01-01（哨兵值，永不到期）。
    field_targets:
    - dataset: fee_company
      field: special_config_flag
    - dataset: fee_company
      field: special_annual_fee
    evidence_refs:
    - ev-cfc-whitelist
  - concept_id: fee-locked
    name: 年费锁定
    aliases:
    - 锁价
    - 锁定年费标准
    definition: 首次缴费成功后锁定当时年费标准（fee_locked=Y + locked_annual_fee）， 之后项目调价不影响已锁企业。
    field_targets:
    - dataset: fee_company
      field: fee_locked
    - dataset: fee_company
      field: locked_annual_fee
    evidence_refs:
    - ev-cfc-lock
  - concept_id: ca-status
    name: CA签章状态
    aliases:
    - CA证书有效
    - CA证书过期
    - CA已注销
    definition: ca_fee_company.ca_status 来自签章中台实时值。注意与服务费状态（pay_status）同名 不同义：ca_status 是证书有效性，pay_status 是缴费。
    dictionary:
      NORMAL: 有效
      EXPIRED: 已过期
      CANCELLED: 已注销
      UNREGISTERED: 未注册
      UNKNOWN: 未注册（兜底）
    field_targets:
    - dataset: fee_company
      field: ca_status
    evidence_refs:
    - ev-cfc-ca-status
  - concept_id: intercept-scene
    name: 未缴费拦截场景
    aliases:
    - 拦截业务
    - 拦截节点
    - 未缴费限制
    definition: 项目 block_scene_list 配置的四类拦截场景：GOTO_PRODUCT 门户进入业务系统、 FINANCE_APPLY 融资申请、RIGHTS_CONFIRM 确权申请、TRANSFER_SIGN 转让签收。 空列表=不拦截。
    dictionary:
      GOTO_PRODUCT: 未缴费限制进入业务系统
      FINANCE_APPLY: 限制融资申请
      RIGHTS_CONFIRM: 限制确权申请
      TRANSFER_SIGN: 限制转让签收
    field_targets:
    - dataset: fee_config
      field: block_scene_list
    evidence_refs:
    - ev-cfc-block
  processes:
  - stage_id: trigger-create-order
    name: 触发建单
    description: CA 认证成功/建档审批通过/关联项目/手动/存量扫描/续费任务触发：规则引擎判定需缴费 且年费>0 时建 PENDING 订单 + 确保企业台账行 UNPAID，并发缴费待办。 分布式锁 cafee:order:{certNo}:{projectId}:{orderType} 幂等，同键 PENDING 复用。
    trigger: CA_AUTH_SUCCESS / BUILD_APPROVED / PROJECT_RELATE / MANUAL / 存量扫描 / 续费任务
    next_stages:
    - pay-success
    data_effects:
    - operation: insert
      dataset: fee_order
      fields:
      - order_no
      - company_id
      - certification_no
      - project_id
      - order_type
      - order_status
      - annual_fee
      - pay_method
      - agreement_signed
      condition: order_status=PENDING
    - operation: upsert
      dataset: fee_company
      fields:
      - certification_no
      - pay_status
      - fee_locked
      condition: 企业行不存在时建 UNPAID
    evidence_refs:
    - ev-cfc-trigger
    - ev-cfc-order-pending
  - stage_id: pay-success
    name: 缴费闭环
    description: 交e保划扣成功（锁 cafee:pay:{orderNo} + CAS 占位 bocom_txn_sts='02'）→ 订单 PENDING→PAID（pay_amount/pay_time/service_start/service_end）→ 同步企业台账 pay_status=PAID + 首缴锁价 → 完结待办 → 异步开票（invoice_status=PENDING）。
    trigger: 企业端缴费确认 / 查证补单 / 台账人工标记已缴 / 0元豁免建单
    next_stages:
    - service-expire
    data_effects:
    - operation: update
      dataset: fee_order
      fields:
      - order_status
      - pay_amount
      - pay_time
      - service_start
      - service_end
      - invoice_status
      condition: →PAID；开票 PENDING
    - operation: update
      dataset: fee_company
      fields:
      - pay_status
      - service_start
      - service_end
      - fee_locked
      - locked_annual_fee
      condition: →PAID；首缴锁价
    evidence_refs:
    - ev-cfc-order-paid
    - ev-cfc-lock
  - stage_id: close-order
    name: 关单
    description: 关收费开关/批量加白名单/服务到期（RENEW 单）/手动 → PENDING→CLOSED（close_reason 记录成因）。
    trigger: 项目开关关闭 / 白名单生效 / 服务到期任务 / 台账手动
    next_stages: []
    data_effects:
    - operation: update
      dataset: fee_order
      fields:
      - order_status
      - close_reason
      condition: →CLOSED
    evidence_refs:
    - ev-cfc-order-close
  - stage_id: service-expire
    name: 服务到期
    description: 定时任务扫描 service_end < today 的 PAID 企业 → pay_status 翻回 UNPAID、 renew_remind_sent=N；service_end<=today+7 生成续费提醒待办（跳过 2099 哨兵）。
    trigger: XXL-Job caFeeServiceExpireJob / caFeeRenewalTodoJob
    next_stages:
    - trigger-create-order
    data_effects:
    - operation: update
      dataset: fee_company
      fields:
      - pay_status
      - renew_remind_sent
      condition: 到期 → UNPAID
    evidence_refs:
    - ev-cfc-expire
  - stage_id: whitelist-exempt
    name: 白名单豁免
    description: 批量加白名单：写项目 special_company_list（WHITELIST, annualFee=0）→ 企业快照 special_config_flag=Y / special_annual_fee=0 → 关闭 PENDING 单 → 生成 0 元 PAID 单 （service_end=2099-01-01）→ 企业 pay_status=PAID。
    trigger: 管理端批量加白名单
    next_stages: []
    data_effects:
    - operation: update
      dataset: fee_config
      fields:
      - special_company_list
      condition: JSON upsert WHITELIST
    - operation: update
      dataset: fee_company
      fields:
      - special_config_flag
      - special_annual_fee
      - pay_status
      condition: Y / 0 / PAID
    - operation: insert
      dataset: fee_order
      fields:
      - order_status
      - pay_amount
      - service_end
      condition: 0元 PAID 单，service_end=2099-01-01
    evidence_refs:
    - ev-cfc-whitelist
  datasets:
  - dataset_id: fee_company
    name: ca_fee_company
    description: CA 服务费企业缴费台账（按统一社会信用代码一行，全局共享：不参与租户行级过滤， tenant_id 仅溯源）。跨租户读需 db_tenant_code=all。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 统一社会信用代码（唯一键，企业锚点）
    - field_id: pay_status
      name: pay_status
      data_type: varchar
      description: 缴费状态
      dictionary:
        PAID: 已缴费
        UNPAID: 未缴费
      evidence_refs:
      - ev-cfc-write-paid
    - field_id: fee_locked
      name: fee_locked
      data_type: varchar
      description: 是否已锁定年费标准
    - field_id: locked_annual_fee
      name: locked_annual_fee
      data_type: int
      description: 首次缴费成功后锁定的年费标准（元）
    - field_id: service_start
      name: service_start
      data_type: date
      description: 当前服务周期起始日（含）
    - field_id: service_end
      name: service_end
      data_type: date
      description: 当前服务周期截止日（含；白名单=2099-01-01 哨兵）
    - field_id: special_config_flag
      name: special_config_flag
      data_type: varchar
      description: 是否存在生效中的特殊配置快照
    - field_id: special_annual_fee
      name: special_annual_fee
      data_type: int
      description: 特殊配置后应缴年费（元；白名单=0）
    - field_id: ca_status
      name: ca_status
      data_type: varchar
      description: CA签章状态
      dictionary:
        NORMAL: 有效
        EXPIRED: 已过期
        CANCELLED: 已注销
        UNREGISTERED: 未注册
        UNKNOWN: 未注册（兜底）
      evidence_refs:
      - ev-cfc-ca-status
    - field_id: renew_remind_sent
      name: renew_remind_sent
      data_type: varchar
      description: 本期续费待办是否已生成（Y/N）
    evidence_refs:
    - ev-cfc-write-paid
    - ev-cfc-lock
  - dataset_id: fee_order
    name: ca_fee_order
    description: CA 服务费订单（全局共享不参与租户行过滤）。乐观锁 version；操作轨迹 operate_logs JSON 追加。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: order_no
      name: order_no
      data_type: varchar
      description: 订单号（唯一键）
    - field_id: company_id
      name: company_id
      data_type: bigint
      description: 企业 ID（=cust_company_info.id）
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 统一社会信用代码（全局检索锚点）
    - field_id: project_id
      name: project_id
      data_type: bigint
      description: 触发项目 ID
    - field_id: order_type
      name: order_type
      data_type: varchar
      description: 订单类型
      dictionary:
        FIRST: 首次缴费
        RENEW: 即将到期续费
        RENEW_EXPIRED: 已到期续费
        STOCK: 存量补录
      evidence_refs:
      - ev-cfc-trigger
    - field_id: order_status
      name: order_status
      data_type: varchar
      description: 订单状态
      dictionary:
        PENDING: 未缴费
        PAID: 已缴费
        CLOSED: 已关闭
        EXPIRED: 已过期（无写值点，残留值）
      evidence_refs:
      - ev-cfc-order-pending
    - field_id: annual_fee
      name: annual_fee
      data_type: int
      description: 应缴年费（元）
    - field_id: pay_amount
      name: pay_amount
      data_type: int
      description: 实缴金额（元）
    - field_id: pay_method
      name: pay_method
      data_type: varchar
      description: 支付方式
      dictionary:
        BOCOM: 交e保对公打款
    - field_id: pay_time
      name: pay_time
      data_type: datetime
      description: 缴费成功时间
    - field_id: service_start
      name: service_start
      data_type: date
      description: 本单服务周期起始日（含）
    - field_id: service_end
      name: service_end
      data_type: date
      description: 本单服务周期截止日（含）
    - field_id: agreement_signed
      name: agreement_signed
      data_type: varchar
      description: 是否已签署收费协议（Y/N）
    - field_id: bocom_txn_sts
      name: bocom_txn_sts
      data_type: varchar
      description: 交e保划扣响应状态
      dictionary:
        '00': 成功
        '01': 银行明确失败（禁再扣）
        '02': 待查证（CAS 占位）
      evidence_refs:
      - ev-cfc-order-paid
    - field_id: invoice_status
      name: invoice_status
      data_type: varchar
      description: 发票状态
      dictionary:
        PENDING: 开票中
        ISSUED: 已开票
        FAILED: 开票失败
        NONE: 无需开票
    - field_id: close_reason
      name: close_reason
      data_type: varchar
      description: 关闭原因（关开关/白名单/到期/手动）
    evidence_refs:
    - ev-cfc-order-pending
    - ev-cfc-order-paid
  - dataset_id: fee_config
    name: ca_fee_project_config
    description: CA 服务费项目收费配置（按项目一行，参与租户过滤）：开关、角色年费、拦截场景、 特殊企业清单。每项目一配置（uk project_id）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: project_id
      name: project_id
      data_type: bigint
      description: 项目ID（=tenant_project.id，唯一键）
    - field_id: charge_enabled
      name: charge_enabled
      data_type: varchar
      description: 是否开启CA收费（Y/N；新建默认 N）
    - field_id: supplier_annual_fee
      name: supplier_annual_fee
      data_type: decimal
      description: 供应商角色年费（元，默认 100）
    - field_id: core_annual_fee
      name: core_annual_fee
      data_type: decimal
      description: 核心企业角色年费（元，默认 100）
    - field_id: block_scene_list
      name: block_scene_list
      data_type: varchar
      description: 拦截场景JSON数组（GOTO_PRODUCT/FINANCE_APPLY/RIGHTS_CONFIRM/TRANSFER_SIGN；空=不拦截）
      dictionary:
        GOTO_PRODUCT: 限制进入业务系统
        FINANCE_APPLY: 限制融资申请
        RIGHTS_CONFIRM: 限制确权申请
        TRANSFER_SIGN: 限制转让签收
      evidence_refs:
      - ev-cfc-block
    - field_id: special_company_list
      name: special_company_list
      data_type: varchar
      description: 特殊企业配置JSON数组（WHITELIST/SPECIAL_PRICE/DEFER_PAY）
      dictionary:
        WHITELIST: 白名单豁免
        SPECIAL_PRICE: 定向减免
        DEFER_PAY: 延期支付
    evidence_refs:
    - ev-cfc-config
  relationships:
  - relationship_id: order-company-certno
    left:
      dataset: fee_order
      field: certification_no
    right:
      dataset: fee_company
      field: certification_no
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 订单按统码归属企业台账行（缴费成功同步 pay_status/服务期/锁价）
    status: proposed
    evidence_refs:
    - ev-cfc-order-paid
    confidence: 0.95
  - relationship_id: order-config-project
    left:
      dataset: fee_order
      field: project_id
    right:
      dataset: fee_config
      field: project_id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: 订单按触发项目关联收费配置（关开关按项目关单）
    status: proposed
    evidence_refs:
    - ev-cfc-order-close
    confidence: 0.9
  calibers:
  - caliber_id: paid-company
    label: 已缴费企业
    description: 企业台账缴费状态 PAID（注意到期任务会翻回 UNPAID，存在时间窗）
    contract_fragment:
      where:
      - pay_status = 'PAID'
      - enable = 'Y'
    field_targets:
    - dataset: fee_company
      field: pay_status
    evidence_refs:
    - ev-cfc-stats
  - caliber_id: pending-order
    label: 待缴费订单
    description: 订单未缴费且启用
    contract_fragment:
      where:
      - order_status = 'PENDING'
      - enable = 'Y'
    field_targets:
    - dataset: fee_order
      field: order_status
    evidence_refs:
    - ev-cfc-order-pending
  - caliber_id: in-service-period
    label: 服务期内
    description: 当前服务周期覆盖今天（含端点）
    contract_fragment:
      where:
      - service_end >= CURRENT_DATE
    field_targets:
    - dataset: fee_company
      field: service_end
    evidence_refs:
    - ev-cfc-rule-engine
  - caliber_id: about-to-expire
    label: 即将到期（7 天窗口）
    description: 服务期截止日在今天起 7 天内，未发过续费提醒
    contract_fragment:
      where:
      - service_end <= CURRENT_DATE + INTERVAL 7 DAY
      - service_end >= CURRENT_DATE
      - renew_remind_sent = 'N'
    field_targets:
    - dataset: fee_company
      field: service_end
    - dataset: fee_company
      field: renew_remind_sent
    evidence_refs:
    - ev-cfc-expire
  - caliber_id: fee-exempt-whitelist
    label: 服务费白名单豁免
    description: 特殊配置快照生效且年费为 0（哨兵 service_end=2099-01-01 永不到期， 续费/到期任务跳过该值）。
    contract_fragment:
      where:
      - special_config_flag = 'Y'
      - special_annual_fee = 0
    field_targets:
    - dataset: fee_company
      field: special_config_flag
    - dataset: fee_company
      field: special_annual_fee
    evidence_refs:
    - ev-cfc-whitelist
  - caliber_id: month-paid-amount
    label: 本月实缴金额
    description: 当月缴费成功的订单实缴合计
    contract_fragment:
      where:
      - order_status = 'PAID'
      - pay_time BETWEEN 月初 AND 月末
      sum: pay_amount
    field_targets:
    - dataset: fee_order
      field: pay_time
    - dataset: fee_order
      field: pay_amount
    evidence_refs:
    - ev-cfc-stats
  metrics:
  - metric_id: ledger-total
    name: 台账企业总数
    description: 服务费台账企业总数（按筛选）
    aggregation: COUNT
    field:
      dataset: fee_company
      field: id
    filters:
    - enable: Y
    evidence_refs:
    - ev-cfc-stats
  - metric_id: paid-company-count
    name: 已缴费企业数
    description: pay_status=PAID 企业数
    aggregation: COUNT
    field:
      dataset: fee_company
      field: id
    filters:
    - pay_status: PAID
      enable: Y
    evidence_refs:
    - ev-cfc-stats
  - metric_id: pay-ratio
    name: 缴费率
    description: 已缴费企业数/总数（百分比保留 2 位）
    aggregation: COUNT
    field:
      dataset: fee_company
      field: id
    filters:
    - enable: Y
    grain:
    - dataset: fee_company
      field: pay_status
    evidence_refs:
    - ev-cfc-stats
  - metric_id: month-paid-amount-sum
    name: 本月实缴金额
    description: 当月 PAID 订单 SUM(pay_amount)
    aggregation: SUM
    field:
      dataset: fee_order
      field: pay_amount
    filters:
    - order_status: PAID
      enable: Y
    grain:
    - dataset: fee_order
      field: certification_no
    evidence_refs:
    - ev-cfc-stats
  domain_rules:
  - rule_id: pricing-rule
    label: 计费规则（按企业按年固定费）
    content: '固定年费制（非费率、无封顶）：annualFee = 生效特殊价（WHITELIST=0/SPECIAL_PRICE>0） ?: 锁定价（fee_locked=Y ? locked_annual_fee）?: 角色价（isCore ? core_annual_fee : supplier_annual_fee，默认各 100 元）。同企业兼核企+供应商按核企价。收费对象仅
      SUPPLIER/CORE 角色；服务期 12 个月。'
    applicability: 计算企业应缴年费、核对订单金额
    query_impact: 应缴金额不能只看项目配置——已锁价企业用 locked_annual_fee、特殊配置企业用 special_annual_fee；三来源优先级 特殊价 > 锁定价 > 角色价。
    field_targets:
    - dataset: fee_company
      field: locked_annual_fee
    - dataset: fee_company
      field: special_annual_fee
    - dataset: fee_config
      field: supplier_annual_fee
    - dataset: fee_config
      field: core_annual_fee
    evidence_refs:
    - ev-cfc-rule-engine
    - ev-cfc-lock
  - rule_id: intercept-rule
    label: 未缴费业务拦截规则
    content: needPay=true 且项目 block_scene_list 含当前场景才拦截；四场景=门户进入业务系统+ 融资申请+确权+转让签收；空列表不拦截。多项目时任一项目豁免（白名单/延期/在期） 即全局放行。拦截对象判定按统码下全部企业行的 SUPPLIER/CORE 角色。
    applicability: 解释企业为何被拦截、拦截统计
    query_impact: '"能否进业务系统"不是单表能判的：需 企业角色 × 项目配置开关 × 拦截场景 × 缴费/豁免状态 四元组合。'
    field_targets:
    - dataset: fee_config
      field: block_scene_list
    - dataset: fee_config
      field: charge_enabled
    - dataset: fee_company
      field: pay_status
    evidence_refs:
    - ev-cfc-block
  - rule_id: order-idempotent
    label: 建单/划扣幂等
    content: 建单分布式锁 + 同键（统码+项目+订单类型）PENDING 复用；划扣锁 + bocom_txn_sts 终态拦截 + CAS 占位（02）防重复划扣；PAID 订单禁止改回 PENDING。
    applicability: 订单数统计（同键只算一单）、重复缴费排查
    query_impact: 统计待缴金额须按 order_no 去重；同一企业同项目同类型最多一张 PENDING。
    field_targets:
    - dataset: fee_order
      field: order_no
    - dataset: fee_order
      field: bocom_txn_sts
    evidence_refs:
    - ev-cfc-order-pending
    - ev-cfc-order-paid
  - rule_id: pay-vs-ca-status-boundary
    label: 缴费状态与CA证书状态边界
    content: pay_status 回答"服务费缴没缴"，ca_status 回答"CA 证书有没有效"——同名 EXPIRED 不同义（服务费过期 vs 证书过期）。portalCheck 是缴费+证书双条件组合校验。
    applicability: 查CA过期/服务费过期类问题
    query_impact: 筛"过期"必须先澄清是服务费过期还是证书过期，两字段两口径。
    field_targets:
    - dataset: fee_company
      field: pay_status
    - dataset: fee_company
      field: ca_status
    evidence_refs:
    - ev-cfc-ca-status
  - rule_id: paid-not-inperiod-window
    label: PAID 不等于在期（时间窗）
    content: 到期任务把 service_end<today 的 PAID 翻回 UNPAID，但任务按日调度存在时间窗； 严格口径用 service_end >= today（服务期内）而非 pay_status=PAID。
    applicability: 精确的"在保企业"统计
    query_impact: pay_status=PAID 可能含刚过期未翻状态的企业；在期统计用服务期谓词。
    field_targets:
    - dataset: fee_company
      field: service_end
    - dataset: fee_company
      field: pay_status
    evidence_refs:
    - ev-cfc-expire
  - rule_id: order-status-no-unpaid
    label: 订单侧无 UNPAID 值
    content: 订单用 PENDING 表达"未缴费"；EXPIRED 枚举无写值点（台账编辑也仅允许 PENDING/PAID）， 查询不应依赖 EXPIRED。
    applicability: 订单状态过滤
    query_impact: 待缴费订单 = order_status='PENDING'；EXPIRED 不会出现于数据。
    field_targets:
    - dataset: fee_order
      field: order_status
    evidence_refs:
    - ev-cfc-order-close
  verified_query_patterns:
  - pattern_id: query-fee-company-by-certno
    question: 按统码查企业缴费台账
    query: SELECT * FROM ca_fee_company WHERE certification_no = ? AND enable = 'Y' LIMIT 1
    intended_specification:
      caliber_id: paid-company
      note: 统码锚定是该域的默认查询范式
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cfc-pattern-certno
  - pattern_id: ledger-statistics
    question: 服务费台账统计（总数/已缴/未缴/缴费率/本月实缴）
    query: "SELECT COUNT(*) AS total,\n       SUM(CASE WHEN pay_status = 'PAID' THEN 1 ELSE 0 END) AS paid\nFROM ca_fee_company WHERE enable = 'Y'; SELECT IFNULL(SUM(pay_amount), 0) FROM ca_fee_order WHERE\
      \ order_status = 'PAID' AND enable = 'Y'\n  AND pay_time BETWEEN ? AND ?;"
    intended_specification:
      caliber_id: month-paid-amount
      note: 台账统计两段式
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cfc-stats
