  domain_rules:
  - rule_id: entry-style-boundary
    label: 录入方式与认证方式边界
    content: identify_style 回答"企业由谁邀请/何种模式认证"（认证产品维度：INVITE 邀请-客户录入/ INVITE_AGW 邀请-内管录入/SIMPLE 简易/SELF 自主注册）；cust_build_type 回答"从哪个 操作端录入建档"（PC_BUILD 客户端 / AGW_BUILD 内管平台端）。固定联动：AGW_BUILD→INVITE_AGW、 PC_BUILD→INVITE
      或 SELF。用户说"平台录入/内管录入"指 cust_build_type=AGW_BUILD； 说"平台邀请认证"指 identify_style=INVITE。两者混用会得到完全不同的企业集合。
    applicability: 按录入方式或认证方式筛选/统计企业清单的查询
    query_impact: 筛"平台录入"若误用 identify_style=INVITE 会混入客户录入的邀请企业； 统计口径必须在两字段间二选一并向用户澄清。
    field_targets:
    - dataset: company
      field: identify_style
    - dataset: company
      field: cust_build_type
    evidence_refs:
    - ev-ebc-write-buildtype
    - ev-ebc-boundary-linkage
  - rule_id: build-vs-check-status
    label: 认证状态与审核状态互译边界
    content: cust_build_status 是本地全生命周期状态（14 态，含变更态），check_status 是运营中台 审核流状态（6 态）。两者由官方映射双向派生（回调方向 BACKTOCUSTOM→CUST_CONFIRM_AWAIT、 CHECKING→CUST_BUILDING、REJECT→BUILD_FAIL、PASS→BUILD_SUCCESS）。查询外部认证进度时
      check_status 优先、为空才回退 cust_build_status 分支。
    applicability: 查询企业认证/审核进度、按状态过滤企业
    query_impact: 用 check_status 过滤会漏掉无审核流的简易/自主认证企业；用 cust_build_status 才是全量口径。
    field_targets:
    - dataset: company
      field: cust_build_status
    - dataset: company
      field: check_status
    evidence_refs:
    - ev-ebc-callback-pass
    - ev-ebc-enum-operapi
  - rule_id: build-vs-cust-status
    label: 认证进度与台账状态边界
    content: cust_build_status 回答认证流程进度，cust_status 回答客户台账可用性。终态联动： 审核通过时 BUILD_SUCCESS 与 EFFECT 成对写；但 EFFECT 企业发起变更进入 CHANGE+CUST_CHANGE 双写，注销后仍保留 BUILD_SUCCESS。
    applicability: 统计"有效企业""可交易企业"等可用性口径
    query_impact: 有效企业 ≠ 认证成功：需 cust_status='EFFECT' 而非仅 BUILD_SUCCESS；注销/冻结企业认证状态仍是成功。
    field_targets:
    - dataset: company
      field: cust_build_status
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-ebc-callback-pass
    - ev-ebc-change-restore
  - rule_id: build-idempotent
    label: 建档幂等与占用
    content: 建档前按统码+租户查重（排除 BUILD_FAIL 后计数须为 0）；失败/注销旧行可复用更新。 导入入口另按统码+租户硬查重，重复即报"录入统一社会信用代码已存在"。
    applicability: 建档类写入与"是否可再建档"判断
    query_impact: 统计建档企业数时同一统码跨租户可能多行；去重粒度是 统码+租户。
    field_targets:
    - dataset: company
      field: certification_no
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-ebc-idempotent
  - rule_id: push-rollback
    label: 中台推送失败回滚
    content: 推送运营中台异常时 cust_build_status 显式回滚 INIT，企业可重新发起。
    applicability: 建档失败企业统计与状态解释
    query_impact: BUILD_FAIL 含推送异常与审核拒绝两种成因，需结合 return_data 区分。
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-ebc-rollback-init
  - rule_id: company-type-json
    label: 企业角色是 JSON 数组
    content: cust_company_info.cust_company_type 存 JSON 数组字符串（如 ["CORE"]）， 一家企业可兼具多角色；匹配须用包含（LIKE/JSON contains）而非相等。
    applicability: 按企业角色（核心企业/供应商/资金方）过滤
    query_impact: 用 = 'CORE' 会漏掉 ["CORE","SUPPLIER"] 企业；统计角色分布会重复计数（一企多角）。
    field_targets:
    - dataset: company
      field: cust_company_type
    evidence_refs:
    - ev-ebc-write-init
  verified_query_patterns:
  - pattern_id: query-company-cert-status
    question: 查某企业当前认证状态（Dubbo 建档状态查询）
    query: SELECT id, code, name, identify_style, cust_build_status, cust_status, check_status FROM cust_company_info WHERE name = ? AND certification_no = ? AND db_tenant_code = ? AND enable = 'Y'
    intended_specification:
      caliber_id: valid-built-company
      note: 查不到时按统码兜底；check_status 优先返回
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ebc-pattern-query
  - pattern_id: list-company-by-admin-phone
    question: 按管理员手机号+统码查跨企业清单
    query: "SELECT c.* FROM cust_company_info c JOIN cust_person_info p ON p.ref_cust_company_info = c.code\n   AND p.phone = ? AND p.user_type = 'admin' AND p.enable = 'Y'\nWHERE c.certification_no = ?\
      \ AND c.cust_build_status = 'BUILD_SUCCESS' AND c.enable = 'Y' ORDER BY c.identify_style, c.create_time DESC"
    intended_specification:
      caliber_id: valid-built-company
      note: 排除当前企业、共享租户场景
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ebc-pattern-mapper
