  calibers:
  - caliber_id: valid-built-company
    label: 有效已建档企业
    description: 认证成功且启用（台账口径另需 cust_status=EFFECT）
    contract_fragment:
      where:
      - cust_build_status = 'BUILD_SUCCESS'
      - enable = 'Y'
    field_targets:
    - dataset: company
      field: cust_build_status
    - dataset: company
      field: enable
    evidence_refs:
    - ev-ebc-caliber-valid
  - caliber_id: buildable-no-occupation
    label: 可再建档（统码无占用）
    description: 同统码+租户下不存在未失败在建档
    contract_fragment:
      not_exists: cust_company_info where certification_no = ? AND db_tenant_code = ? AND cust_build_status != 'BUILD_FAIL'
    field_targets:
    - dataset: company
      field: certification_no
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-ebc-idempotent
  - caliber_id: in-flight-change
    label: 在途变更企业
    description: 企业发起变更且变更单未终态
    contract_fragment:
      where:
      - cust_status = 'CHANGE'
      - cust_build_status = 'CUST_CHANGE'
    field_targets:
    - dataset: company
      field: cust_status
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-ebc-change-copy
  - caliber_id: reg-reuse-row
    label: 建档复用旧行条件
    description: 失败或已注销的旧企业行可被复用更新而非新建
    contract_fragment:
      where:
      - cust_build_status = 'BUILD_FAIL'
      - or cust_status = 'WRITEOFF'
    field_targets:
    - dataset: company
      field: cust_build_status
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-ebc-idempotent
  metrics:
  - metric_id: certified-company-count
    name: 认证成功企业数
    description: 认证状态为 BUILD_SUCCESS 的企业数量
    aggregation: COUNT
    field:
      dataset: company
      field: id
    filters:
    - cust_build_status: BUILD_SUCCESS
    grain:
    - dataset: company
      field: db_tenant_code
    evidence_refs:
    - ev-ebc-caliber-valid
  - metric_id: build-type-distribution
    name: 录入方式分布
