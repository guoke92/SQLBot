    aggregation: COUNT
    field:
      dataset: company
      field: id
    grain:
    - dataset: company
      field: identify_style
    evidence_refs:
    - ev-ebc-enum-identify
  - metric_id: source-distribution
    name: 企业来源分布
    description: 按建档数据来源（中台推送/存量迁移/自建）统计
