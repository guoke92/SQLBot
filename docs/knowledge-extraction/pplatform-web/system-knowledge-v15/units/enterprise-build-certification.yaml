unit_id: enterprise-build-certification
revision: 1
title: 企业建档与认证
aliases:
- 企业录入
- 建档
- 认证
- 企业注册
- 平台录入建档
domain: 客户与建档
applicability: 用户问"某企业是否建档/认证成功""按录入方式（平台录入/客户录入）统计企业""有效企业清单" "认证方式分布""企业来源（存量迁移/中台推送）""企业当前认证进度"等企业主数据建档认证类问题时使用。
description: 企业进入产融平台的建档与认证全流程：从导入/注册/OpenAPI 建档入口建立企业主数据 （cust_company_info）与联系人（cust_person_info）、角色（cust_role_info）、项目关系 （cust_project_rel），推送运营中台审核并经回调落地认证状态（cust_build_record 记录推送）。 覆盖本地认证状态机（cust_build_status
  14 态）、客户台账状态（cust_status）、审核状态 （check_status）三套状态与录入方式（cust_build_type）/认证方式（identify_style）两类入口语义。
content:
  concepts:
  - concept_id: identify-style
    name: 认证方式
    aliases:
    - 邀请认证
    - 简易认证
    - 自主注册
    - 注册认证
    - 平台邀请认证
    - 网关邀请认证
    definition: 企业采用的认证产品模式：谁邀请/何种模式完成认证。INVITE=邀请认证-客户录入、 INVITE_AGW=邀请认证-内管录入、SIMPLE=简易认证、SELF=注册认证（自主）。
    dictionary:
      INVITE: 邀请认证-客户录入
      INVITE_AGW: 邀请认证-内管录入
      SIMPLE: 简易认证
      SELF: 注册认证（自主）
    field_targets:
    - dataset: company
      field: identify_style
    evidence_refs:
    - ev-ebc-enum-identify
    - ev-ebc-write-identify
  - concept_id: cust-build-type
    name: 录入方式
    aliases:
    - 平台录入
    - 客户录入
    - 内管录入
    - PC端录入
    - 网关录入
    definition: 企业建档时从哪个操作端录入：PC_BUILD=客户录入（企业端自主填报）， AGW_BUILD=平台录入（内管/运营代录）。与认证方式（identify_style）语义相邻但不同： 录入方式只区分操作端，认证方式区分认证产品模式。用户说"平台录入"指 cust_build_type=AGW_BUILD。
    dictionary:
      PC_BUILD: 客户录入
      AGW_BUILD: 平台录入
    field_targets:
    - dataset: company
      field: cust_build_type
    evidence_refs:
    - ev-ebc-enum-buildtype
    - ev-ebc-write-buildtype
  - concept_id: build-status
    name: 建档认证状态
    aliases:
    - 认证状态
    - 认证成功
    - 建档成功
    - 认证失败
    - 待客户认证
    - 审核中
    - 退回
    - 变更中
    definition: 企业在本地系统的认证全生命周期状态（14 态）：INIT 初始化 →（邀请流经运营中台回调 / 简易流客户确认）→ BUILD_SUCCESS 认证成功 或 BUILD_FAIL 认证失败；含审核流 （CUST_BUILDING/CUST_BUILD_SUCCESS）、变更流（CUST_CHANGE）、待客户确认 （AWAIT_CUST_CONFIRM 简易流 / CUST_CONFIRM_AWAIT
      邀请流，两值显示名近似但分属两流）。
    dictionary:
      INIT: 初始化
      TO_BE_BUILD: 未建档
      BUILDING: 建档中
      BUILD_SUCCESS: 认证成功
      BUILD_FAIL: 认证失败
      BUILD_BACK: 退回
      BUILD_ACTIVATE: 待激活
      CUST_CONFIRM_AWAIT: 待客户认证（邀请流）
      CUST_AUDIT_AWAIT: 待审核
      CUST_BUILDING: 审核中
      CUST_BUILD_SUCCESS: 审核通过
      CUST_BUILD_FAIL: 审核拒绝
      CUST_CHANGE: 变更
      AWAIT_CUST_CONFIRM: 待客户确认（简易流）
    field_targets:
    - dataset: company
      field: cust_build_status
    evidence_refs:
    - ev-ebc-enum-buildstatus
    - ev-ebc-write-init
    - ev-ebc-callback-pass
  - concept_id: cust-status
    name: 客户台账状态
    aliases:
    - 生效企业
    - 冻结企业
    - 注销企业
    - 失效
    - 在途变更
    definition: 企业作为客户的生命周期台账状态：ADD 新增、EFFECT 生效、FREEZE 冻结、 WRITEOFF 注销、CHANGE 变更中、FAILURE 失效。与认证状态（cust_build_status） 不同维度：认证状态回答"认证流程到哪一步"，台账状态回答"客户当前可用性"。
    dictionary:
      ADD: 新增
      EFFECT: 生效
      FAILURE: 失效
      WRITEOFF: 注销
      FREEZE: 冻结
      CHANGE: 变更
    field_targets:
    - dataset: company
      field: cust_status
    evidence_refs:
    - ev-ebc-enum-custstatus
    - ev-ebc-write-add
  - concept_id: check-status
    name: 审核状态
    aliases:
    - 审核通过
    - 审核拒绝
    - 审核不通过
    - 待审核
    - 退回客户
    definition: 运营中台工作流审核状态（回调写入）：CUST_CHECK_PASS 审核通过时联动写 cust_build_status=BUILD_SUCCESS 与 cust_status=EFFECT。
    dictionary:
      CUST_CHECK_INIT: 待审核
      CUST_CHECK_CHECKING: 审核中
      CUST_CHECK_PASS: 审核通过
      CUST_CHECK_REJECT: 审核不通过
      CUST_CHECK_BACKTOCUSTOM: 待客户确认
      CUST_BACK: 退回
    field_targets:
    - dataset: company
      field: check_status
    evidence_refs:
    - ev-ebc-callback-pass
    - ev-ebc-enum-operapi
  - concept_id: cust-source
    name: 建档数据来源
    aliases:
    - 存量迁移企业
    - 中台推送企业
    - 产融自建企业
    definition: 企业建档数据的系统级来源。
    dictionary:
      PLATFORM_PUSH: 运营中台推送
      MIGRATORY: 存量迁移企业
      PPLATFORM: 产融自建企业
    field_targets:
    - dataset: company
      field: cust_source
    evidence_refs:
    - ev-ebc-write-source
  processes:
  - stage_id: build-init
    name: 建档初始化
    description: 导入/注册/OpenAPI 建档入口创建企业主数据与联系人、角色、项目关系。 写值：cust_build_status=INIT、cust_status=ADD、identify_style 与 cust_build_type 按入口联动（AGW_BUILD→INVITE_AGW，PC_BUILD→INVITE/SELF）。
    trigger: 平台导入 / 用户自主注册 / OpenAPI 建档（independentReg/dependentReg）/ AMS 拉起
    enter_conditions:
    - 统码+租户无在途建档（cust_build_status != BUILD_FAIL 计数为 0）
    exit_conditions:
    - 企业/联系人/角色/项目关系四表落库
    next_stages:
    - push-oper-review
    data_effects:
    - operation: insert
      dataset: company
      fields:
      - code
      - name
      - certification_no
      - cust_build_type
      - identify_style
      - cust_build_status
      - cust_status
      - cust_company_type
      - data_type
      - main_data_id
    - operation: insert
      dataset: person
      fields:
      - code
      - ref_cust_company_info
      - cust_company_id
      - user_type
      - cust_build_status
      - status
      - company_type
      - main_data_id
    - operation: insert
      dataset: role
      fields:
      - code
      - ref_cust_company_info
      - status
    - operation: insert
      dataset: project_rel
      fields:
      - code
      - ref_cust_project_rel_cust_company_info
      - project_id
      - product_id
      - company_type
      - status
      - show_flag
    evidence_refs:
    - ev-ebc-write-init
    - ev-ebc-write-buildtype
    - ev-ebc-flow-company-code
  - stage_id: push-oper-review
    name: 推送运营中台审核
    description: 建档数据推送运营中台（写 cust_build_record 含中台返回 id）；推送异常时 cust_build_status 回滚 INIT。
    trigger: build-init 完成（异步 afterCommit）
    next_stages:
    - callback-landing
    - build-init
    data_effects:
    - operation: insert
      dataset: build_record
      fields:
      - cust_id
      - person_id
      - plat_cust_id
      - plat_person_id
      - channel
      - return_data
    - operation: update
      dataset: company
      fields:
      - check_status
      condition: 推送前写 CUST_CHECK_INIT
    evidence_refs:
    - ev-ebc-push-record
    - ev-ebc-rollback-init
  - stage_id: callback-landing
    name: 审核回调落地
    description: 运营中台工作流回调：通过时 cust_status=EFFECT、check_status=CUST_CHECK_PASS、 cust_build_status=BUILD_SUCCESS 三值成对写；拒绝时 BUILD_FAIL。 变更安全拒绝采用乐观条件更新（eq(custStatus,CHANGE)+在途单存在）防旧回调覆盖。
    trigger: 运营中台工作流回调（CustSyncEventProcessor）
    next_stages: []
    data_effects:
    - operation: update
      dataset: company
      fields:
      - cust_status
      - check_status
      - cust_build_status
      condition: 回调通过：EFFECT + CUST_CHECK_PASS + BUILD_SUCCESS
    - operation: update
      dataset: person
      fields:
      - cust_build_status
      condition: 同步联系人建档状态
    evidence_refs:
    - ev-ebc-callback-pass
  - stage_id: simple-auth-flow
    name: 简易认证流
    description: 简易认证（identify_style=SIMPLE）：提交后 cust_build_status=AWAIT_CUST_CONFIRM， 客户确认后直接 BUILD_SUCCESS+EFFECT（不经运营中台）。
    trigger: 企业端简易认证提交与确认
    enter_conditions:
    - identify_style=SIMPLE
    next_stages: []
    data_effects:
    - operation: update
      dataset: company
      fields:
      - cust_build_status
      condition: 提交→AWAIT_CUST_CONFIRM；确认→BUILD_SUCCESS
    evidence_refs:
    - ev-ebc-simple-auth
  - stage_id: change-flow
    name: 企业信息变更流
    description: 发起变更时主数据行复制为流程行（data_type=0/2、main_data_id 指向主行）， cust_status=CHANGE、cust_build_status=CUST_CHANGE；变更拒绝后乐观恢复 EFFECT/BUILD_SUCCESS；归档时流程行字段拷回主行（apply_data_id 回指）。
    trigger: 企业端发起信息变更
    next_stages:
    - callback-landing
    data_effects:
    - operation: insert
      dataset: company
      fields:
      - main_data_id
      - data_type
      - apply_type
      - cust_build_status
      condition: 复制主数据行为流程行（data_type=0 流程/2 暂存）
    - operation: update
      dataset: company
      fields:
      - cust_status
      - cust_build_status
      condition: 发起变更：CHANGE + CUST_CHANGE
    evidence_refs:
    - ev-ebc-change-copy
    - ev-ebc-change-restore
  datasets:
  - dataset_id: company
    name: cust_company_info
    description: 企业主数据/过程记录，一行一家企业（data_type 区分主数据/流程行/暂存行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 企业编码（uuid，子表外键锚点）
    - field_id: name
      name: name
      data_type: varchar
      description: 客户名称
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: cust_company_type
      name: cust_company_type
      data_type: varchar
      description: 企业角色（JSON 数组，如 CORE+SUPPLIER 多角色）
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      description: 统一信用代码
    - field_id: identify_style
      name: identify_style
      data_type: varchar
      description: 认证方式
      dictionary:
        INVITE: 邀请认证-客户录入
        INVITE_AGW: 邀请认证-内管录入
        SIMPLE: 简易认证
        SELF: 注册认证（自主）
      evidence_refs:
      - ev-ebc-enum-identify
    - field_id: cust_build_type
      name: cust_build_type
      data_type: varchar
      description: 录入方式
      dictionary:
        PC_BUILD: 客户录入
        AGW_BUILD: 平台录入
      evidence_refs:
      - ev-ebc-enum-buildtype
    - field_id: cust_build_status
      name: cust_build_status
      data_type: varchar
      description: 认证状态
      dictionary:
        INIT: 初始化
        TO_BE_BUILD: 未建档
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功
        BUILD_FAIL: 认证失败
        BUILD_BACK: 退回
        BUILD_ACTIVATE: 待激活
        CUST_CONFIRM_AWAIT: 待客户认证（邀请流）
        CUST_AUDIT_AWAIT: 待审核
        CUST_BUILDING: 审核中
        CUST_BUILD_SUCCESS: 审核通过
        CUST_BUILD_FAIL: 审核拒绝
        CUST_CHANGE: 变更
        AWAIT_CUST_CONFIRM: 待客户确认（简易流）
      evidence_refs:
      - ev-ebc-enum-buildstatus
    - field_id: cust_status
      name: cust_status
      data_type: varchar
      description: 客户状态
      dictionary:
        ADD: 新增
        EFFECT: 生效
        FAILURE: 失效
        WRITEOFF: 注销
        FREEZE: 冻结
        CHANGE: 变更
      evidence_refs:
      - ev-ebc-enum-custstatus
    - field_id: check_status
      name: check_status
      data_type: varchar
      description: 审核状态
      dictionary:
        CUST_CHECK_INIT: 待审核
        CUST_CHECK_CHECKING: 审核中
        CUST_CHECK_PASS: 审核通过
        CUST_CHECK_REJECT: 审核不通过
        CUST_CHECK_BACKTOCUSTOM: 待客户确认
        CUST_BACK: 退回
      evidence_refs:
      - ev-ebc-enum-operapi
    - field_id: data_type
      name: data_type
      data_type: varchar
      description: 数据类型
      dictionary:
        '1': 主数据
        '0': 流程数据
        '2': 编辑暂存
      evidence_refs:
      - ev-ebc-enum-datatype
    - field_id: main_data_id
      name: main_data_id
      data_type: bigint
      description: 主数据id（流程行指向主行；主行自身为 0/空）
    - field_id: apply_type
      name: apply_type
      data_type: varchar
      description: 流程类型
    - field_id: cust_source
      name: cust_source
      data_type: varchar
      description: 建档数据来源
      dictionary:
        PLATFORM_PUSH: 运营中台推送
        MIGRATORY: 存量迁移企业
        PPLATFORM: 产融自建企业
      evidence_refs:
      - ev-ebc-write-source
    - field_id: platform_cust_id
      name: platform_cust_id
      data_type: bigint
      description: 运营中台id
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      description: 租户隔离码（建档去重粒度组成部分，非关联）
    evidence_refs:
    - ev-ebc-write-init
    - ev-ebc-callback-pass
  - dataset_id: person
    name: cust_person_info
    description: 企业联系人/经办人（管理员 admin 或访客 guest）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: user_type
      name: user_type
      data_type: varchar
      description: 联系人类型
      dictionary:
        admin: 管理员
        guest: 访客（认证失败/未认证时的管理员降级）
      evidence_refs:
      - ev-ebc-person-admin
    - field_id: cust_build_status
      name: cust_build_status
      data_type: varchar
      description: 建档状态（随企业状态同步）
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业（=cust_company_info.code）
    - field_id: cust_company_id
      name: cust_company_id
      data_type: bigint
      description: 冗余企业id（=cust_company_info.id）
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 客户角色
    - field_id: status
      name: status
      data_type: varchar
      description: 联系人账号状态
    - field_id: main_data_id
      name: main_data_id
      data_type: bigint
      description: 主数据id（主记录标记 0；流程复制时=源 person.id）
    evidence_refs:
    - ev-ebc-flow-company-code
    - ev-ebc-person-admin
  - dataset_id: role
    name: cust_role_info
    description: 企业角色记录（企业建档时随建，status=ADD）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 客户类型（=cust_company_info.code）
    - field_id: status
      name: status
      data_type: varchar
      description: 状态（建档时 ADD）
    - field_id: platform_cust_id
      name: platform_cust_id
      data_type: bigint
      description: 关联平台企业ID（运营中台共享键）
    evidence_refs:
    - ev-ebc-flow-company-code
  - dataset_id: project_rel
    name: cust_project_rel
    description: 企业-项目-产品关系（一个企业在一个项目下一种角色一行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: code
      name: code
      data_type: varchar
      description: 编码
    - field_id: ref_cust_project_rel_cust_company_info
      name: ref_cust_project_rel_cust_company_info
      data_type: varchar
      description: 客户和项目关系（=cust_company_info.code）
    - field_id: project_id
      name: project_id
      data_type: varchar
      description: 项目id（String 存 Long，JOIN tenant_project.id 需 CAST）
    - field_id: product_id
      name: product_id
      data_type: varchar
      description: 产品（String 存 Long）
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 客户角色（只取一个，如 SUPPLIER/CORE）
    - field_id: status
      name: status
      data_type: varchar
      description: 关联状态
      dictionary:
        '0': 默认/待生效
        '1': 已生效（SUPPLIER 且 ACFLOW/ORDER 产品自动置 1）
        Y: 项目开通
    - field_id: show_flag
      name: show_flag
      data_type: varchar
      description: 展示标记（企业默认展示项目，删除后兜底指定其一为 Y）
    evidence_refs:
    - ev-ebc-flow-company-code
    - ev-ebc-rel-status
  - dataset_id: build_record
    name: cust_build_record
    description: 建档推送运营中台记录（含中台返回的企业/人员 id，回调匹配锚点）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID（=cust_company_info.id）
    - field_id: person_id
      name: person_id
      data_type: bigint
      description: 联系人ID（=cust_person_info.id）
    - field_id: plat_cust_id
      name: plat_cust_id
      data_type: bigint
      description: 运营中台企业ID
    - field_id: plat_person_id
      name: plat_person_id
      data_type: bigint
      description: 运营中台人员ID
    - field_id: channel
      name: channel
      data_type: varchar
      description: 渠道
    - field_id: return_data
      name: return_data
      data_type: varchar
      description: 中台返回报文
    evidence_refs:
    - ev-ebc-push-record
  relationships:
  - relationship_id: person-company-code
    left:
      dataset: person
      field: ref_cust_company_info
    right:
      dataset: company
      field: code
    relationship_type: EQUI_JOIN
