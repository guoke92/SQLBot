    aggregation: COUNT
    field:
      dataset: company
      field: id
    grain:
    - dataset: company
      field: cust_build_type
    evidence_refs:
    - ev-ebc-write-buildtype
  - metric_id: identify-style-distribution
    name: 认证方式分布
