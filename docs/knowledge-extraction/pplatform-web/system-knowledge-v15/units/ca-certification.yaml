unit_id: ca-certification
revision: 1
title: CFCA 电子签认证
aliases:
- CA认证
- 一证四步
- CA开通
- 电子签章
- CA证书
- CFCA
domain: CA认证与服务费
applicability: 用户问"CA 开通状态""一证四步进度""CA 认证成功率""企业是否已开 CA""法人认证/人脸认证记录" 等电子签认证类问题时使用。
description: CFCA 一证四步认证全流程：ca_certification_info（CA 认证主记录，submit_status PENDING/SUCCESS/FAIL；分公司双行 N+Y）经门户四步（实名→意愿→附件→提交签章中心） 或运营中台回调写入；成功后回写 cust_company_info.ca_register_status=Y。 cust_certification_info（客户核查记录，12 种认证类型，含人脸/三要素/OCR）与 CA 表 通过 organization_id=ca_certification_info.id 跨表暗链关联。授权书（authorization_agreement） 与全局配置（cust_setting_config）是本域的邻接资产。
content:
  concepts:
  - concept_id: submit-status
    name: CA报数状态
    aliases:
    - CA认证状态
    - 报数成功
    - 报数失败
    - 报数状态
    - 签章中心提交状态
    - 报数成功
    - 报数失败
    definition: ca_certification_info.submit_status 三值状态机：PENDING 采集未提交 → SUCCESS（cbsSubmitBizData 成功：DBaaS code∈{'0','200'} AND biz.status=SAVED 双条件）或 FAIL（可重试）。已 SUCCESS 短路不再上送；markFailed 对已 SUCCESS 行禁止置 FAIL。幂等键 (custId, dataDate, headCompanyData, PENDING)。
    dictionary:
      PENDING: 采集/未提交
      SUCCESS: 报数成功
      FAIL: 报数失败（可重试）
    field_targets:
    - dataset: ca_cert
      field: submit_status
    evidence_refs:
    - ev-ca-submit-idem
    - ev-ca-submit-success-code
    - ev-ca-submit-write
    - ev-ca-submit-markfailed
    - ev-ca-create-idem
    - ev-ca-submit-enum
    - ev-ca-submit
  - concept_id: ca-register-status
    name: CA开通状态
    aliases:
    - 已开通CA
    - 未开通
    - 开通中
    - CA开通状态
    - 证书状态
    - CA已开通
    - CA失效
    definition: cust_company_info.ca_register_status：N→Y（openCa 成功）；Y→N（变更企业名/ 证书失效重置）。与 ca_certification_info.submit_status 不同维度—— ca_register_status 是企业维度开通标记，submit_status 是单次报数行状态。
    dictionary:
      Y: 已开通
      N: 未开通
      P: 开通中（过渡）
    field_targets:
    - dataset: company
      field: ca_register_status
    evidence_refs:
    - ev-ca-open-write
    - ev-ca-open-guard
    - ev-ca-reset-n
    - ev-ca-precheck-block
    - ev-ca-register
  - concept_id: head-company-dual-row
    name: 分公司双行口径
    aliases:
    - 总行分行
    - 总公司CA
    - 总公司行
    - 分公司行
    - 双行结构
    definition: 分公司 CA 认证产生两行：head_company_data=N 行（cust_id=分公司 id）+ head_company_data=Y 行（cust_id=cust_head_company_info.id）。统计时 Y 行不能 直接与 cust_company_info.id join，须经 ref_cust_head_company_info 还原。
    field_targets:
    - dataset: ca_cert
      field: head_company_data
    evidence_refs:
    - ev-ca-dual-row
    - ev-ca-create-idem
  - concept_id: authed-status
    name: 授权书签署状态
    aliases:
    - 已签授权书
    - 未签授权书
    - 平台授权
    - 授权书已签
    - 授权书未签
    - 平台授权
    definition: authorization_agreement.authed_status：N（流程启动建）→ Y（审批通过）；管理员变更旧行停用新行重建。
    dictionary:
      Y: 已签署
      N: 未签署
    field_targets:
    - dataset: auth_agreement
      field: authed_status
    evidence_refs:
    - ev-ca-agreement-create-n
    - ev-ca-agreement-pass
    - ev-ca-agreement-manager-change
    - ev-ca-agreement-read
    - ev-ca-auth-agreement
  - concept_id: cert-type
    name: 认证类型
    aliases:
    - 人脸认证
    - 法人三要素
    - 工商四要素
    - OCR认证
    - 证件核查
    definition: cust_certification_info.certification_type 12 值枚举（COMPANY_FOUR_ELEMENTS/COMPANY_TWO_ELEMENTS/LEGAL_THREE_ELEMENTS/LEGAL_REAL_NAME/FACE_VERIFY/AUTH_THREE_ELEMENTS/AUTH_REAL_NAME/LEGAL_OCR/AUTH_OCR/LICENSE_OCR/LEGAL_MEDIA_OCR/AUTH_MEDIA_OCR）；CFCA 一证四步场景 organization_id=String(ca_certification_info.id) 形成跨表暗链。
    field_targets:
    - dataset: cust_cert
      field: certification_type
    evidence_refs:
    - ev-ca-cert-type-enum
    - ev-ca-cert-face
    - ev-ca-cert-type
  - concept_id: auto-verify-status
    name: 自动核验状态
    aliases:
    - 人脸核验结果
    - 认证通过
    - 认证不通过
    - 人工认证
    definition: cust_certification_info.auto_verify_status 六值：TO_BE_VERIFIED 待核查 / AUTOMATIC_AUTHENTICATION_PASSED 自动通过 / AUTOMATIC_AUTHENTICATION_FAILED 自动不通过 / MANUAL_AUTHENTICATION_PASSED 人工通过 / MANUAL_AUTHENTICATION__FAILED 人工不通过（双下划线）/ NO_RECORD 库无记录。auto_verify_count 递减剩余核验次数。
    dictionary:
      TO_BE_VERIFIED: 待核查
      AUTOMATIC_AUTHENTICATION_PASSED: 自动认证通过
      AUTOMATIC_AUTHENTICATION_FAILED: 自动认证不通过
      MANUAL_AUTHENTICATION_PASSED: 人工认证通过
      MANUAL_AUTHENTICATION__FAILED: 人工认证不通过
      NO_RECORD: 库无记录
    field_targets:
    - dataset: cust_cert
      field: auto_verify_status
    evidence_refs:
    - ev-ca-cert-verify-enum
    - ev-ca-cert-face
  processes:
  - stage_id: pre4step-check
    name: CA 预检（pre4Step）
    description: 登录/进入认证页时预检：调 cbsQueryCertInfo 查证书状态 + 证书登记企业名与 DB 企业名比对；证书失效或名称不匹配 → ca_register_status 重置 N（按主键 update）；企业处于变更流程（custStatus=CHANGE 或 custBuildStatus=CUST_CHANGE）直接阻断 CA 开通。certStatus=APPLYING 时 canProceed=false。
    trigger: 门户登录 / 一证四步入口
    enter_conditions:
    - user_type=admin
    - cust_status≠CHANGE
    - cust_build_status≠CUST_CHANGE
    next_stages:
    - four-step-flow
    data_effects:
    - operation: update
      dataset: company
      fields:
      - ca_register_status
      condition: 证书失效或企业名不匹配时置 N
    evidence_refs:
    - ev-ca-reset-n
    - ev-ca-precheck-block
    - ev-ca-register
  - stage_id: four-step-flow
    name: 一证四步（门户）
    description: pre4Step（预检：查询证书状态+企业名比对，失效/名称不匹配时 ca_register_status 置 N；变更流程中则阻断）→ realName/verify（实名核验按 verifyMethod 分键：ENTERPRISE_THREE/FOUR→enterprise_four_json、POLICE_TWO→police_two_json）→ intent/sms|face（意愿；人脸通过时回填 intent_h5_face_json）→ protocol/confirm（聚合提交 submitToSignCenter（先总后分）→ openCa（ca_register_status=Y）→ 广播 openCA → 触发 CA 计费）。CHANNEL_OPENAPI 源豁免意愿步骤。confirm 无事务（长 IO 刻意事务外），多次点击安全。
    trigger: 门户管理员发起
    enter_conditions:
    - user_type=admin
    - cust_status≠CHANGE
    - cust_build_status≠CUST_CHANGE
    next_stages:
    - submit-sign-center
    data_effects:
    - operation: upsert
      dataset: ca_cert
      fields:
      - cust_id
      - data_source
      - head_company_data
      - submit_status
      - notify_agreement_json
      - enterprise_four_json
      - police_two_json
      - intent_sms_json
      - intent_h5_face_json
      - file_refs_json
      condition: 幂等键=(cust_id,data_date,head_company_data,PENDING)
    evidence_refs:
    - ev-ca-four-step
    - ev-ca-confirm-orchestrate
    - ev-ca-create-idem
    - ev-ca-realname-branch
    - ev-ca-submit-complete
    - ev-ca-cert-face-controller
  - stage_id: submit-sign-center
    name: 提交签章中心
    description: submitToSignCenter：完整性校验（协议+≥1实名+≥1意愿+附件，CHANNEL_OPENAPI 豁免意愿）→ assembleBizRequest 组装（子项 data 超长按叶子属性剔除）→ cbsSubmitBizData（事务外）→ SUCCESS 判定 DBaaS code∈{'0','200'} AND biz.status=SAVED → 回写 submit_status+sign_platform_result（请求+响应全文不截断）+submit_time。已 SUCCESS 短路；异常也写 FAIL。
    trigger: four-step-flow confirm / 运营回调激活
    next_stages: []
    data_effects:
    - operation: update
      dataset: ca_cert
      fields:
      - submit_status
      - sign_platform_result
      - submit_time
      condition: →SUCCESS 或 FAIL
    evidence_refs:
    - ev-ca-submit
    - ev-ca-submit-idem
    - ev-ca-submit-complete
    - ev-ca-submit-success-code
    - ev-ca-submit-write
    - ev-ca-submit-markfailed
    - ev-ca-submit-enum
  - stage_id: auth-agreement-flow
    name: 授权书签署流
    description: 建档流程启动建 authed_status=N 行（creation_type 标来源）→ 审批通过回调 pass 置 Y（管理员维度；非管理员置 N+异常备注）→ 管理员变更时旧管理员全部授权 enable=N+authed_status=N、新管理员新建行 Y。已签署判定：platform_product_code=PLATFORM AND authed_status='Y' 存在；外部推送企业（PLATFORM_PUSH）恒真豁免。
    trigger: 建档/变更流程
    next_stages: []
    data_effects:
    - operation: insert
      dataset: auth_agreement
      fields:
      - act_procinst_id
      - cust_id
      - cust_manager_id
      - platform_product_code
      - authed_status
      condition: N 建行 → 回调通过 Y
    evidence_refs:
    - ev-ca-auth-agreement
    - ev-ca-agreement-create-n
    - ev-ca-agreement-pass
    - ev-ca-agreement-manager-change
    - ev-ca-agreement-read
  datasets:
  - dataset_id: ca_cert
    name: ca_certification_info
    description: CA 认证主记录（一行=一次报数尝试；分公司双行 N+Y；JSON 列存储各步骤结果； 全局共享不参与租户行过滤）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键（雪花）
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID（N行=cust_company_info.id；Y行=cust_head_company_info.id）
    - field_id: cust_type
      name: cust_type
      data_type: varchar
      description: 客户类型（COMPANY/PERSON，默认 COMPANY）
    - field_id: data_date
      name: data_date
      data_type: varchar
      description: 数据日期（yyyyMMdd，幂等键组成）
    - field_id: head_company_data
      name: head_company_data
      data_type: varchar
      description: '总分公司标记（N=本企业行；Y=总公司行）, dictionary: {N: 本企业/分公司行, Y: 总公司行}'
    - field_id: data_source
      name: data_source
      data_type: varchar
      description: '数据来源, dictionary: {OPERATION_PLATFORM: 运营中台, FBP_PORTAL: 产融门户, CHANNEL_OPENAPI: 渠道OpenAPI}'
    - field_id: batch_no
      name: batch_no
      data_type: varchar
      description: 批次号（INC_*；存量 STOCK_*）
    - field_id: submit_status
      name: submit_status
      data_type: varchar
      description: '报数状态, dictionary: {PENDING: 采集/未提交, SUCCESS: 报数成功, FAIL: 报数失败}, evidence_refs: [ev-ca-submit]'
    - field_id: submit_time
      name: submit_time
      data_type: datetime
      description: 提交时间
    - field_id: sign_platform_result
      name: sign_platform_result
      data_type: text
      description: 签章中心结果全文
    - field_id: notify_agreement_json
      name: notify_agreement_json
      data_type: text
      description: 协议告知 JSON
    - field_id: enterprise_four_json
      name: enterprise_four_json
      data_type: text
      description: 企业实名 JSON（三/四要素共用此列）
    - field_id: police_two_json
      name: police_two_json
      data_type: text
      description: 公安二要素 JSON（POLICE_TWO 核验结果）
    - field_id: intent_sms_json
      name: intent_sms_json
      data_type: text
      description: 短信意愿 JSON
    - field_id: intent_h5_face_json
      name: intent_h5_face_json
      data_type: text
      description: H5刷脸意愿 JSON
    - field_id: file_refs_json
      name: file_refs_json
      data_type: text
      description: 附件引用 JSON（COS key）
    evidence_refs:
    - ev-ca-create-idem
    - ev-ca-realname-branch
    - ev-ca-submit-write
    - ev-ca-submit-enum
    - ev-ca-source-enum
  - dataset_id: cust_cert
    name: cust_certification_info
    description: 客户核查记录（一类型一行；含法人三要素/四要素/人脸/OCR 等 12 种； CFCA 人脸行 organization_id=ca_certification_info.id 跨表暗链）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业（=cust_company_info.code）
    - field_id: certification_type
      name: certification_type
      data_type: varchar
      description: '认证类型, dictionary: {LEGAL_THREE_ELEMENTS: 法人三要素, COMPANY_TWO_ELEMENTS: 企业二要素, COMPANY_FOUR_ELEMENTS: 企业四要素, FACE_VERIFY: 联系人人脸, LEGAL_REAL_NAME: 法人实名, AUTH_THREE_ELEMENTS: 联系人三要素, LEGAL_OCR: 法人证件影像, AUTH_MEDIA_OCR: 授权书影像, LICENSE_OCR: 营业执照影像}, evidence_refs: [ev-ca-cert-type]'
    - field_id: auto_verify_status
      name: auto_verify_status
      data_type: varchar
      description: '自动核查结果, dictionary: {TO_BE_VERIFIED: 待核查, AUTOMATIC_AUTHENTICATION_PASSED: 自动通过, AUTOMATIC_AUTHENTICATION_FAILED: 自动失败, MANUAL_AUTHENTICATION_PASSED: 人工通过, MANUAL_AUTHENTICATION__FAILED: 人工失败}, evidence_refs: [ev-ca-cert-type]'
    - field_id: auto_verify_count
      name: auto_verify_count
      data_type: int
      description: 剩余可用次数（人脸失败递减）
    - field_id: organization_id
      name: organization_id
      data_type: varchar
      description: CFCA 场景=ca_certification_info.id（跨表暗链；普通场景 NULL）
    evidence_refs:
    - ev-ca-cert-face
    - ev-ca-cert-type-enum
    - ev-ca-cert-verify-enum
  - dataset_id: auth_agreement
    name: authorization_agreement
    description: 平台授权确认书（一行=企业×管理员×产品×角色；全局共享豁免租户行过滤）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: enable
      name: enable
      data_type: varchar
      description: enable
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 企业ID（=cust_company_info.id）
    - field_id: cust_manager_id
      name: cust_manager_id
      data_type: varchar
      description: 管理员 userId
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      description: 产品编码（PLATFORM=平台授权书）
    - field_id: authed_status
      name: authed_status
      data_type: varchar
      description: '签署状态, dictionary: {Y: 已签署, N: 未签署}, evidence_refs: [ev-ca-auth-agreement]'
    - field_id: act_procinst_id
      name: act_procinst_id
      data_type: varchar
      description: 流程实例 id（唯一键组成）
    - field_id: company_type
      name: company_type
      data_type: varchar
      description: 企业角色（多角色循环建行）
    - field_id: creation_type
      name: creation_type
      data_type: varchar
      description: '创建类型, dictionary: {CUST_BUILD_INIT: 企业发起认证, COMPANY_AUTH_AGGREMENT: 授权书变更, AUTO: 迁移自动开通, COMPANY_MANAGER_CHANGE_CODE: 管理员变更}'
    evidence_refs:
    - ev-ca-agreement-create-n
    - ev-ca-agreement-pass
    - ev-ca-agreement-read
  - dataset_id: company
    name: cust_company_info
    description: 企业主数据/过程记录，一行一家企业（data_type 区分主数据/流程行/暂存行）。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      data_type: bigint
      description: 表主键
    - field_id: ca_register_status
      name: ca_register_status
      data_type: varchar
      description: CA开通状态
      dictionary:
        Y: 已开通
        N: 未开通/失效
      evidence_refs:
      - ev-ca-open-write
      - ev-ca-reset-n
    - field_id: need_register_ca
      name: need_register_ca
      data_type: varchar
      description: 是否需要开通CA（N 时 openCa 直接跳过）
    evidence_refs:
    - ev-ca-open-write
    - ev-ca-reset-n
  relationships:
  - relationship_id: ca-cert-to-ca-row
    left:
      dataset: cust_cert
      field: organization_id
    right:
      dataset: ca_cert
      field: id
    relationship_type: EQUI_JOIN
    cardinality: many_to_one
    business_meaning: CFCA H5 人脸行与 CA 报数行的跨表暗链（普通行人脸 organization_id=NULL 过滤）
    status: proposed
    evidence_refs:
    - ev-ca-cross-link
    confidence: 0.9
  calibers:
  - caliber_id: ca-opened-company
    label: CA已开通企业
    description: cust_company_info.ca_register_status=Y（企业维度开通标记）
    contract_fragment:
      where:
      - cust_company_info.ca_register_status = 'Y'
    field_targets:
    - dataset: cust_cert
      field: certification_type
    evidence_refs:
    - ev-ca-register
  - caliber_id: ca-submit-success
    label: CA报数成功
    description: 最新一次报数 submit_status=SUCCESS（行维度）
    contract_fragment:
      where:
      - submit_status = 'SUCCESS'
      - enable = 'Y'
    field_targets:
    - dataset: ca_cert
      field: submit_status
    evidence_refs:
    - ev-ca-submit
  - caliber_id: auth-agreement-signed
    label: 已签平台授权书
    description: PLATFORM 产品 authed_status=Y 存在行（企业维度）
    contract_fragment:
      where:
      - platform_product_code = 'PLATFORM'
      - authed_status = 'Y'
      - enable = 'Y'
    field_targets:
    - dataset: auth_agreement
      field: authed_status
    evidence_refs:
    - ev-ca-auth-agreement
  metrics:
  - metric_id: ca-open-rate
    name: CA开通率
    description: ca_register_status=Y 企业数 / enable=Y 企业数
    aggregation: COUNT
    field:
      dataset: ca_cert
      field: cust_id
    filters:
    - submit_status: SUCCESS
    grain:
    - dataset: ca_cert
      field: data_source
    evidence_refs:
    - ev-ca-submit
  - metric_id: ca-submit-success-rate
    name: CA报数成功率
    description: SUCCESS/(SUCCESS+FAIL) 行占比（按数据来源分组）
    aggregation: COUNT
    field:
      dataset: ca_cert
      field: id
    grain:
    - dataset: ca_cert
      field: submit_status
    evidence_refs:
    - ev-ca-submit
  domain_rules:
  - rule_id: dual-row-join-trap
    label: 分公司双行统计陷阱
    content: ca_certification_info 的 Y 行（总公司行）cust_id 指向 cust_head_company_info.id 而非 cust_company_info.id——统计 CA 开通企业时直接 join cust_company_info 会漏掉/ 错算 Y 行，须经 ref_cust_head_company_info 还原。
    applicability: CA 开通统计、报数行数统计
    query_impact: 按 cust_id 直接 COUNT DISTINCT 会重复计分公司（N+Y 两行）。
    field_targets:
    - dataset: ca_cert
      field: head_company_data
    evidence_refs:
    - ev-ca-dual-row
    - ev-ca-create-idem
  - rule_id: submit-vs-register-status
    label: 报数状态与开通状态边界
    content: submit_status 是单次报数行状态（一行=一次尝试），ca_register_status 是企业维度 开通标记（openCa 成功即 Y，此后新报数行不改 ca_register_status）。
    applicability: 已开通 CA" vs "报数成功查询
    query_impact: 统计"已开 CA 企业"用 ca_register_status；统计"报数行为"用 submit_status。
    field_targets:
    - dataset: ca_cert
      field: submit_status
    evidence_refs:
    - ev-ca-submit-write
    - ev-ca-open-write
  - rule_id: auth-agreement-per-person
    label: 授权书按人维度
    content: 授权书唯一键含 cust_manager_id（一行=企业×管理员×产品×角色）；企业维度"已签" = 存在任一管理员签过。管理员变更旧行停用、新行重建。
    applicability: 授权书签署状态查询
    query_impact: 按企业查授权书须按 cust_id 维度聚合，不能按行 COUNT。
    field_targets:
    - dataset: auth_agreement
      field: cust_id
    evidence_refs:
    - ev-ca-agreement-pass
    - ev-ca-agreement-read
  - rule_id: submit-success-dual-code
    label: 报数成功双条件
    content: SUCCESS 判定是双条件：DBaaS 层 code ∈ {'0','200'}（两种风格都算）AND 业务层 biz.status='SAVED'；任一不满足都是 FAIL。
    applicability: 报数成功率统计、失败排查
    query_impact: submit_status='SUCCESS' 是唯一可信成功口径；sign_platform_result 全文可追溯失败原因。
    field_targets:
    - dataset: ca_cert
      field: submit_status
    evidence_refs:
    - ev-ca-submit-success-code
    - ev-ca-submit-write
  - rule_id: realname-column-branch
    label: 实名核验分键落列
    content: 实名核验结果按 verifyMethod 落不同 JSON 列：ENTERPRISE_THREE/ENTERPRISE_FOUR 落 enterprise_four_json（共用）；POLICE_TWO 落 police_two_json；其他方式代码直接抛不支持。
    applicability: 按核验方式统计、JSON 列取数
    query_impact: 查'四要素核验记录'看 enterprise_four_json 非空；'二要素'看 police_two_json 非空。
    field_targets:
    - dataset: ca_cert
      field: enterprise_four_json
    - dataset: ca_cert
      field: police_two_json
    evidence_refs:
    - ev-ca-realname-branch
    - ev-ca-submit-complete
  - rule_id: face-cross-link
    label: 人脸记录跨表暗链
    content: cust_certification_info.organization_id 在 CFCA 一证四步场景存 String(ca_certification_info.id)（非本表主键也非企业 id）；通过它可关联出对应 CA 报数行。organization_id 为空的行是非 CFCA 场景的普通人脸记录。
    applicability: 人脸认证与 CA 报数关联分析
    query_impact: JOIN cust_certification_info.organization_id = ca_certification_info.id 需 CAST（varchar←bigint）且只对 organization_id 非空行有效。
    field_targets:
    - dataset: cust_cert
      field: organization_id
    evidence_refs:
    - ev-ca-cert-face
    - ev-ca-cert-face-controller
    - ev-ca-cross-link
  - rule_id: ca-block-during-change
    label: 变更流程阻断 CA
    content: 企业处于变更流程（cust_status=CHANGE 或 cust_build_status=CUST_CHANGE）时 pre4Step 直接阻断 CA 开通（'先走完变更流程再处理 CA 开通'）。
    applicability: CA 开通失败原因排查
    query_impact: CA 未开通企业先看是否在变更流程；变更完成才可重试。
    field_targets:
    - dataset: ca_cert
      field: cust_id
    evidence_refs:
    - ev-ca-precheck-block
  verified_query_patterns:
  - pattern_id: ca-submit-success-query
    question: 企业最新成功报数行
    query: SELECT * FROM ca_certification_info WHERE cust_id = ? AND submit_status = 'SUCCESS' AND enable = 'Y' ORDER BY submit_time DESC, id DESC LIMIT 1
    intended_specification:
      caliber_id: ca-submit-success
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ca-submit
