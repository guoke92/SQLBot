unit_id: tenant-project-lifecycle
revision: 1
title: 租户项目生命周期
aliases:
- 租户项目
- 项目生命周期
- 项目生效
- 项目失效
domain: project
applicability: 租户项目创建、复制、变更、生效、失效、删除及项目-产品关联；不包含项目上线审批流程
description: 租户项目以 tenant_project 表示，project_status 使用 0 待生效 / 1 已生效 / 2 已失效；项目创建后按产品编码关联租户产品。
content:
  concepts:
  - concept_id: tenant-project
    name: 租户项目
    aliases:
    - 项目
    - 业务项目
    definition: tenant_project 一行代表一个租户业务项目实例，归属于租户和产品。
    dictionary: {}
    field_targets:
    - dataset: project
      field: id
      database: ''
    - dataset: project
      field: code
      database: ''
    - dataset: project
      field: name
      database: ''
    evidence_refs:
    - ev-project-schema
  - concept_id: project-status
    name: 项目状态
    aliases:
    - 待生效
    - 已生效
    - 已失效
    definition: tenant_project.project_status 使用 0/1/2 表示项目生命周期状态。
    dictionary:
      '0': 待生效
      '1': 已生效
      '2': 已失效
    field_targets:
    - dataset: project
      field: project_status
      database: ''
    evidence_refs:
    - ev-project-status-enum
  processes:
  - stage_id: create-project
    name: 创建/复制项目
    description: ''
    trigger: TenantProjectController.create / copy
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - effective-project
    data_effects:
    - operation: read
      dataset: project
      fields:
      - id
      - code
      - name
      - tenant_id
      - product_id
      - project_code
      - ref_tenant_project_product_code
      - enable
      condition: 创建/复制时校验并初始化项目
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: project
      fields:
      - id
      - code
      - name
      - tenant_id
      - product_id
      - project_code
      - project_status
      - ref_tenant_project_product_code
      - enable
      condition: 新建项目默认 project_status=0（待生效）
      description: ''
      evidence_refs: []
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - code
      - product_id
      condition: 按项目产品编码定位租户产品
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-project-create
  - stage_id: effective-project
    name: 项目生效
    description: ''
    trigger: TenantProjectController.effective
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - invalid-project
    data_effects:
    - operation: update
      dataset: project
      fields:
      - project_status
      condition: project_status 置 1（已生效）
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-project-effective
  - stage_id: invalid-project
    name: 项目失效/删除
    description: ''
    trigger: TenantProjectController.invalid / delete
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: project
      fields:
      - project_status
      - enable
      condition: 失效置 2；删除逻辑置 enable=N
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-project-invalid
  - stage_id: query-project
    name: 项目查询
    description: ''
    trigger: 列表/详情/按租户查询
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: project
      fields:
      - id
      - code
      - name
      - tenant_id
      - product_id
      - project_code
      - project_status
      - ref_tenant_project_product_code
      - enable
      condition: 按租户/产品/状态/项目编码查询
      description: ''
      evidence_refs: []
    - operation: read
      dataset: tenant_product
      fields:
      - id
      - code
      - product_id
      condition: 按项目产品编码定位租户产品
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-project-query
  datasets:
  - dataset_id: project
    name: tenant_project
    description: 租户业务项目实例。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 项目业务编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: name
      name: name
      description: 项目名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: tenant_id
      name: tenant_id
      description: 租户ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: product_id
      name: product_id
      description: 所属租户产品主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: project_code
      name: project_code
      description: 项目编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: project_status
      name: project_status
      description: 项目状态
      data_type: varchar
      dictionary:
        '0': 待生效
        '1': 已生效
        '2': 已失效
      evidence_refs: []
    - field_id: ref_tenant_project_product_code
      name: ref_tenant_project_product_code
      description: 关联租户产品 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-project-schema
  - dataset_id: tenant_product
    name: tenant_product
    description: 租户产品开通实例。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 租户产品业务编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_id
      name: product_id
      description: 租户产品主键（冗余）
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-project-schema
  relationships:
  - relationship_id: project-product-code
    left:
      dataset: project
      field: ref_tenant_project_product_code
      database: ''
    right:
      dataset: tenant_product
      field: code
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户项目通过产品 code 关联租户产品。
    status: proposed
    evidence_refs:
    - ev-project-create
    confidence: 0.5
  metrics:
  - metric_id: effective-project-count
    name: 已生效项目数
    description: project_status=1 且 enable=Y 的租户项目数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: project
      field: id
      database: ''
    filters: []
    grain:
    - dataset: project
      field: tenant_id
      database: ''
    - dataset: project
      field: product_id
      database: ''
    evidence_refs:
    - ev-project-query
  calibers:
  - caliber_id: caliber-effective-project
    label: 已生效项目
    description: tenant_project.project_status=1 且 enable=Y。
    contract_fragment:
      predicates:
      - field: project.project_status
        operator: eq
        values:
        - '1'
      - field: project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: project
      field: project_status
      database: ''
    - dataset: project
      field: enable
      database: ''
    evidence_refs:
    - ev-project-effective
  - caliber_id: caliber-invalid-project
    label: 已失效项目
    description: tenant_project.project_status=2 且 enable=Y。
    contract_fragment:
      predicates:
      - field: project.project_status
        operator: eq
        values:
        - '2'
      - field: project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: project
      field: project_status
      database: ''
    - dataset: project
      field: enable
      database: ''
    evidence_refs:
    - ev-project-invalid
  domain_rules:
  - rule_id: project-status-transition
    label: 项目状态受控流转
    content: 新建为 0 待生效；生效置 1；失效置 2；删除逻辑 enable=N。
    applicability: 租户项目生命周期
    query_impact: 统计有效项目必须 project_status=1 且 enable=Y
    field_targets:
    - dataset: project
      field: project_status
      database: ''
    - dataset: project
      field: enable
      database: ''
    evidence_refs:
    - ev-project-effective
    - ev-project-invalid
  - rule_id: project-product-link
    label: 项目通过产品编码关联租户产品
    content: tenant_project.ref_tenant_project_product_code 保存 tenant_product.code，创建/查询项目时用于定位产品。
    applicability: 租户项目
    query_impact: 按产品统计项目使用 ref_tenant_project_product_code=tenant_product.code
    field_targets:
    - dataset: project
      field: ref_tenant_project_product_code
      database: ''
    - dataset: tenant_product
      field: code
      database: ''
    evidence_refs:
    - ev-project-create
  verified_query_patterns:
  - pattern_id: count-effective-projects
    question: 已生效的租户项目有多少
    query: SELECT COUNT(DISTINCT id) AS effective_project_count FROM tenant_project
      WHERE project_status = '1' AND enable = 'Y'
    intended_specification:
      grain: project
      caliber_id: caliber-effective-project
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-project-effective
evidence_refs:
- ev-project-schema
- ev-project-status-enum
- ev-project-create
- ev-project-effective
- ev-project-invalid
- ev-project-query
unit_links: []
assumptions:
- 查询范例未在目标库执行。
- 项目与审批的关系见 project-approval 单元。
conflicts: []
confidence: 0.9
