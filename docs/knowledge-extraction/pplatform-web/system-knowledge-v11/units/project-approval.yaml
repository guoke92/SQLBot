unit_id: project-approval
revision: 1
title: 项目上线审批
aliases:
- 项目审批
- 上线审批
- 审批流
- 项目立项审批
domain: project
applicability: 项目上线审批、后补合作协议审批、审批流程节点与文件；不用于项目状态本身统计
description: 按项目发起上线审批或后补合作协议，审批单挂接流程节点、业务信息、授信和文件；工作流状态和节点状态共同表达审批进度。
content:
  concepts:
  - concept_id: approval
    name: 项目审批单
    aliases:
    - 上线审批
    - 审批编号
    definition: tenant_project_approval 一行代表一次项目上线审批或后补合作协议审批；approval_no 为业务编号。
    dictionary: {}
    field_targets:
    - dataset: approval
      field: id
      database: ''
    - dataset: approval
      field: approval_no
      database: ''
    - dataset: approval
      field: project_type
      database: ''
    evidence_refs:
    - ev-approval-schema
  - concept_id: approval-workflow-status
    name: 审批工作流状态
    aliases:
    - 待发起
    - 审批中
    - 审批通过
    - 审批拒绝
    definition: tenant_project_approval.wf_status 表示审批单整体工作流状态。
    dictionary:
      PENDING: 待发起
      RUNNING: 审批中
      FINISHED: 审批通过
      TERMINATED: 审批拒绝
    field_targets:
    - dataset: approval
      field: wf_status
      database: ''
    evidence_refs:
    - ev-approval-wf-enum
  - concept_id: approval-node-status
    name: 审批节点状态
    aliases:
    - 待审批
    - 审批中
    - 已通过
    - 已拒绝
    definition: tenant_project_approval_flow.node_status 表示审批流中每个节点的处理状态。
    dictionary:
      PENDING: 待审批
      APPROVING: 审批中
      APPROVED: 已通过
      REJECTED: 已拒绝
    field_targets:
    - dataset: flow
      field: node_status
      database: ''
    evidence_refs:
    - ev-approval-node-enum
  processes:
  - stage_id: create-approval
    name: 创建审批单
    description: ''
    trigger: ProjectApprovalController.createApproval / prepareWizardApproval
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - submit-approval
    data_effects:
    - operation: insert
      dataset: approval
      fields:
      - id
      - code
      - approval_no
      - project_type
      - wf_status
      - flow_code
      - ref_tenant_project_approval_tenant_project
      - ref_tenant_project_approval_tenant_project_approval
      - enable
      - is_online_approval
      - related_approval_no
      condition: 创建审批单，初始 wf_status=PENDING
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: business_info
      fields:
      - id
      - code
      - business_flow_mode
      - service_fee_quote_type_financing
      - ref_tenant_project_approval_business_info_project_approval
      - enable
      condition: 创建业务信息
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: flow
      fields:
      - id
      - code
      - node_code
      - node_name
      - node_order
      - node_status
      - ref_tenant_project_approval_flow_tenant_project_approval
      - enable
      condition: 按 flow_config 初始化流程节点
      description: ''
      evidence_refs: []
    - operation: read
      dataset: flow_config
      fields:
      - id
      - flow_code
      - node_code
      - node_name
      - node_order
      - enable
      condition: 按 flow_code 取流程配置模板
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-approval-create
  - stage_id: submit-approval
    name: 提交审批/启动工作流
    description: ''
    trigger: ProjectApprovalController.submit
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - handle-workflow
    data_effects:
    - operation: update
      dataset: approval
      fields:
      - wf_status
      - flow_code
      condition: 提交后 wf_status 进入 RUNNING
      description: ''
      evidence_refs: []
    - operation: update
      dataset: flow
      fields:
      - node_status
      condition: 首个节点进入 APPROVING
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-approval-submit
  - stage_id: handle-workflow
    name: 审批节点处理
    description: ''
    trigger: 审批通过/拒绝/退回回调
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: approval
      fields:
      - wf_status
      condition: 全部通过置 FINISHED；拒绝/终止置 TERMINATED
      description: ''
      evidence_refs: []
    - operation: update
      dataset: flow
      fields:
      - node_status
      condition: 节点分别置 APPROVED/REJECTED
      description: ''
      evidence_refs: []
    - operation: update
      dataset: flow_node
      fields:
      - operate_type
      - approval_type
      - id
      - node_code
      - node_order
      - enable
      condition: 记录审批操作类型
      description: ''
      evidence_refs: []
    - operation: update
      dataset: flow_credit
      fields:
      - id
      - code
      - ref_tenant_project_approval_flow_credit_project_approval_node
      - enable
      condition: 记录审批授信与节点关联
      description: ''
      evidence_refs: []
    - operation: update
      dataset: flow_file
      fields:
      - id
      - code
      - enable
      condition: 记录审批文件处理状态
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-approval-workflow
  - stage_id: query-approval
    name: 查询审批
    description: ''
    trigger: 分页、详情、按项目/审批编号查询
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: approval
      fields:
      - id
      - code
      - approval_no
      - project_type
      - wf_status
      - flow_code
      - ref_tenant_project_approval_tenant_project
      - enable
      condition: 按项目 code 或审批编号查询
      description: ''
      evidence_refs: []
    - operation: read
      dataset: flow
      fields:
      - node_code
      - node_name
      - node_order
      - node_status
      - ref_tenant_project_approval_flow_tenant_project_approval
      - enable
      condition: 按审批 code 查流程节点
      description: ''
      evidence_refs: []
    - operation: read
      dataset: tenant_project
      fields:
      - id
      - code
      - project_approval_id
      condition: 查询审批时关联项目
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-approval-query
