unit_id: funding-rule
revision: 1
title: 资金方规则配置与查询
aliases:
- 资金规则
- 资产要素配置
- 资方规则
domain: funding
applicability: 资金方规则版本、明细、前台配置的维护与消费；不包含异常解析台账（见 exception-resolution 单元）
description: 按产品和资金方维护规则版本、分层明细与前台字段配置；管理端可保存/生效/失效，业务 Provider 只消费 ACTIVE 规则。
content:
  concepts:
  - concept_id: rule-status
    name: 规则状态
    aliases:
    - 生效中
    - 待生效
    - 已失效
    definition: funding_rule_info.rule_status 表示规则生命周期：PENDING 待生效、ACTIVE 生效、INACTIVE
      失效；业务查询只取 ACTIVE。
    dictionary:
      PENDING: 待生效
      ACTIVE: 生效
      INACTIVE: 失效
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    evidence_refs:
    - ev-rule-status-enum
  - concept_id: rule-layer
    name: 规则层
    aliases:
    - 底层规则
    - 融资规则
    - 其他规则
    definition: funding_rule_detail.rule_layer / funding_rule_front_cfg.rule_layer
      将规则字段分组：UNDERLYING 底层、FINANCING 融资、OTHER 其他。
    dictionary:
      UNDERLYING: 底层规则
      FINANCING: 融资规则
      OTHER: 其他规则
    field_targets:
    - dataset: funding_rule_detail
      field: rule_layer
      database: ''
    - dataset: funding_rule_front
      field: rule_layer
      database: ''
    evidence_refs:
    - ev-layer-enum
  - concept_id: funding-rule-version
    name: 资金规则版本
    aliases:
    - 资方规则版本
    definition: funding_rule_info 一行代表某产品+资金方标识的一份规则版本；明细通过 rule_info_id 归属。
    dictionary: {}
    field_targets:
    - dataset: funding_rule
      field: id
      database: ''
    - dataset: funding_rule
      field: product_code
      database: ''
    - dataset: funding_rule
      field: funding_party_mark
      database: ''
    evidence_refs:
    - ev-info-fields
  processes:
  - stage_id: configure-rule
    name: 配置规则
    description: ''
    trigger: 管理端 saveOrUpdateRuleInfo 保存或更新规则
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - publish-rule
    data_effects:
    - operation: upsert
      dataset: funding_rule
      fields:
      - code
      - product_code
      - funding_party_mark
      - funding_party_name
      - rule_status
      - version
      - enable
      condition: 新增默认 PENDING/version=1；更新 version+1
      description: ''
      evidence_refs: []
    - operation: upsert
      dataset: funding_rule_detail
      fields:
      - rule_info_id
      - fund_rule_code_ref
      - rule_key
      - rule_value
      - rule_layer
      - version
      - product_code
      - funding_party_mark
      - enable
      condition: ruleMap.key 必须匹配 funding_rule_front_cfg.front_key
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-save-flow
  - stage_id: publish-rule
    name: 生效/失效
    description: ''
    trigger: 管理端 active/inActive
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - consume-active-rule
    data_effects:
    - operation: update
      dataset: funding_rule
      fields:
      - rule_status
      condition: active 置 ACTIVE；inActive 置 INACTIVE
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-controller-status
  - stage_id: consume-active-rule
    name: 业务查询生效规则
    description: ''
    trigger: Dubbo Provider 查询资金方规则
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: funding_rule
      fields:
      - funding_party_mark
      - product_code
      - rule_status
      - id
      - version
      condition: fundingPartyMark+productCode+ruleStatus=ACTIVE
      description: ''
      evidence_refs: []
    - operation: read
      dataset: funding_rule_front
      fields:
      - product_code
      - front_key
      - key_name
      - key_type
      - rule_key
      - rule_layer
      - enable
      condition: productCode+enable=Y 构建 frontKey→DO Map
      description: ''
      evidence_refs: []
    - operation: read
      dataset: funding_rule_detail
      fields:
      - rule_info_id
      - rule_key
      - rule_value
      - rule_layer
      - enable
      condition: ruleInfoId+enable=Y，按 ruleLayer 分组；ruleKey==frontKey 组装
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-provider-query
  datasets:
  - dataset_id: funding_rule
    name: funding_rule_info
    description: 资金方规则版本主表。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 规则业务编码，fund_rule_code_ref 冗余引用
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_mark
      name: funding_party_mark
      description: 资金方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_name
      name: funding_party_name
      description: 资金方名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_status
      name: rule_status
      description: 规则状态
      data_type: varchar
      dictionary:
        PENDING: 待生效
        ACTIVE: 生效
        INACTIVE: 失效
      evidence_refs: []
    - field_id: version
      name: version
      description: 规则版本号
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-info-fields
  - dataset_id: funding_rule_detail
    name: funding_rule_detail
    description: 规则版本键值明细。
    database: lowcode_pplatform
    fields:
    - field_id: rule_info_id
      name: rule_info_id
      description: 关联 funding_rule_info.id
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: fund_rule_code_ref
      name: fund_rule_code_ref
      description: 冗余 funding_rule_info.code，保存时由 ruleInfo.code 回写
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_key
      name: rule_key
      description: 规则字段 key，对应 front_key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_value
      name: rule_value
      description: 规则值
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_layer
      name: rule_layer
      description: 规则层
      data_type: varchar
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
      evidence_refs: []
    - field_id: version
      name: version
      description: 明细对应版本
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_mark
      name: funding_party_mark
      description: 资金方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-detail-fields
  - dataset_id: funding_rule_front
    name: funding_rule_front_cfg
    description: 按产品定义规则前台字段。
    database: lowcode_pplatform
    fields:
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: front_key
      name: front_key
      description: 前端字段 key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: key_name
      name: key_name
      description: 字段名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: key_type
      name: key_type
      description: 字段业务规则类型
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_key
      name: rule_key
      description: 规则字段 key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_layer
      name: rule_layer
      description: 规则层
      data_type: varchar
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-front-fields
  - dataset_id: funding_party_rule_cfg
    name: funding_party_rule_cfg
    description: 资金方规则配置主表（休眠表：无入口调用链，仅登记）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-cfg-schema
  - dataset_id: funding_party_rule_detail
    name: funding_party_rule_detail
    description: 资金方规则配置明细（休眠表：无入口调用链，仅登记）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-detail-schema
  - dataset_id: funding_party_rule_front
    name: funding_party_rule_front
    description: 资金方规则前台配置（休眠表：无入口调用链，仅登记）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-front-schema
  relationships:
  - relationship_id: detail-to-rule-info
    left:
      dataset: funding_rule_detail
      field: rule_info_id
      database: ''
    right:
      dataset: funding_rule
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 规则明细归属规则版本头。
    status: proposed
    evidence_refs:
    - ev-provider-query
    confidence: 0.5
  metrics:
  - metric_id: active-rule-count
    name: 生效资金规则数
    description: 按资金方和产品统计生效规则版本数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: funding_rule
      field: id
      database: ''
    filters: []
    grain:
    - dataset: funding_rule
      field: funding_party_mark
      database: ''
    - dataset: funding_rule
      field: product_code
      database: ''
    evidence_refs:
    - ev-provider-query
  calibers:
  - caliber_id: active-funding-rule
    label: 可供业务使用的生效资金规则
    description: 业务 Provider 仅查询 rule_status=ACTIVE 且明细/前台配置 enable=Y。
    contract_fragment:
      predicates:
      - field: funding_rule.rule_status
        operator: eq
        values:
        - ACTIVE
      - field: funding_rule_detail.enable
        operator: eq
        values:
        - Y
      - field: funding_rule_front.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    - dataset: funding_rule_detail
      field: enable
      database: ''
    - dataset: funding_rule_front
      field: enable
      database: ''
    evidence_refs:
    - ev-provider-query
  domain_rules:
  - rule_id: active-only-consumption
    label: 业务只消费生效规则
    content: PENDING/INACTIVE 规则不会被 Provider 返回。
    applicability: 资金方规则查询
    query_impact: 必须过滤 funding_rule.rule_status=ACTIVE，明细和前台配置过滤 enable=Y
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    - dataset: funding_rule_detail
      field: enable
      database: ''
    - dataset: funding_rule_front
      field: enable
      database: ''
    evidence_refs:
    - ev-provider-query
  - rule_id: detail-key-matches-front
    label: 明细键须映射前台配置
    content: 保存时 ruleMap.key 与 funding_rule_front_cfg.front_key 匹配才写明细；Provider 以
      ruleKey==frontKey 组装。
    applicability: 规则保存与查询
    query_impact: 映射使用 funding_rule_detail.rule_key=funding_rule_front_cfg.front_key
    field_targets:
    - dataset: funding_rule_detail
      field: rule_key
      database: ''
    - dataset: funding_rule_front
      field: front_key
      database: ''
    evidence_refs:
    - ev-save-flow
    - ev-provider-query
  - rule_id: version-increment-on-update
    label: 更新规则递增版本
    content: 新增默认 PENDING/version=1；更新 version+1；同产品+同资金方已存在时禁止重复新增。
    applicability: 管理端保存/更新
    query_impact: 比较版本使用 funding_rule.version，不把明细行数当版本数
    field_targets:
    - dataset: funding_rule
      field: version
      database: ''
    - dataset: funding_rule
      field: rule_status
      database: ''
    - dataset: funding_rule
      field: product_code
      database: ''
    - dataset: funding_rule
      field: funding_party_mark
      database: ''
    evidence_refs:
    - ev-save-flow
  verified_query_patterns:
  - pattern_id: count-active-funding-rules
    question: 生效中的资金规则有多少
    query: SELECT COUNT(DISTINCT id) AS active_rule_count FROM funding_rule_info WHERE
      rule_status = 'ACTIVE' AND enable = 'Y'
    intended_specification:
      grain: funding_rule
      caliber_id: active-funding-rule
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-provider-query
evidence_refs:
- ev-rule-status-enum
- ev-layer-enum
- ev-info-fields
- ev-detail-fields
- ev-front-fields
- ev-party-cfg-schema
- ev-party-detail-schema
- ev-party-front-schema
- ev-save-flow
- ev-controller-status
- ev-provider-query
unit_links: []
assumptions:
- funding_party_rule_* 为休眠表：有 DO/Mapper/Service 但无入口调用链，仅登记不参与问数。
- 查询范例未在目标库执行。
conflicts: []
confidence: 0.92
