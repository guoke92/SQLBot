  - caliber_id: need-pay-cafee
    label: 需缴纳CA服务费企业
    description: 项目 charge_enabled=Y、非白名单/非0元豁免、服务费未在期内的企业。
    contract_fragment:
      predicates:
      - field: project_config.charge_enabled
        operator: eq
        values:
        - Y
      - field: company.pay_status
        operator: eq
        values:
        - UNPAID
    field_targets:
    - dataset: project_config
      field: charge_enabled
      database: ''
    - dataset: company
      field: pay_status
      database: ''
    - dataset: company
      field: service_end
      database: ''
    evidence_refs:
    - ev-cafee-dual-check
  domain_rules:
  - rule_id: charge-enabled-gate
    label: 仅开启收费项目生成缴费
    content: 项目 charge_enabled=Y 时才会创建缴费待办/订单；关闭时关闭 PENDING 订单并完结待办。
    applicability: CA服务费项目配置
    query_impact: 查询缴费企业/订单需关联项目配置的 charge_enabled
    field_targets:
    - dataset: project_config
      field: charge_enabled
      database: ''
    - dataset: order
      field: order_status
      database: ''
    evidence_refs:
    - ev-cafee-admin-config
  - rule_id: order-status-transition
    label: 订单状态受控流转
    content: PENDING 可支付为 PAID 或关闭；PAID 后服务期生效；台账编辑仅支持 PENDING/PAID 且受 version 乐观锁保护。
    applicability: CA服务费订单
    query_impact: 统计已缴费订单需 order_status=PAID 且 enable=Y
    field_targets:
    - dataset: order
      field: order_status
      database: ''
    - dataset: order
      field: version
      database: ''
    evidence_refs:
    - ev-cafee-payment
    - ev-cafee-admin-config
  - rule_id: dual-check-gate
    label: 跳转业务需双条件通过
    content: CA 证书有效且 CA 服务费在期/豁免才放行；仅核企/供应商角色校验。
    applicability: 门户/业务跳转
    query_impact: 按 ca_fee_company.ca_status 与 service_end 判断是否拦截
    field_targets:
    - dataset: company
      field: ca_status
      database: ''
    - dataset: company
      field: service_end
      database: ''
    - dataset: company
      field: pay_status
      database: ''
