unit_id: ca-fee
revision: 1
title: CA服务费收费与缴费
aliases:
- CA服务费
- CA费用
- 服务费缴费
domain: cafee
applicability: CA服务费项目配置、订单、企业宽表、缴费、待办、双条件校验与台账；不包含 CA 一证四步认证流程
description: 按项目配置 CA 服务费收费规则，企业签署协议并交e保打款后订单 PAID，更新 ca_fee_company 服务周期，并在跳转业务/签章前做双条件校验。
content:
  concepts:
  - concept_id: cafee-project-config
    name: CA收费项目配置
    aliases:
    - 项目CA配置
    definition: ca_fee_project_config 一行一个项目的 CA 服务费配置，包含开关、供应商/核心年费、支付渠道、特殊企业名单。
    dictionary: {}
    field_targets:
    - dataset: project_config
      field: project_id
      database: ''
    - dataset: project_config
      field: charge_enabled
      database: ''
    evidence_refs:
    - ev-cafee-project-config-schema
  - concept_id: cafee-order-status
    name: CA服务费订单状态
    aliases:
    - 待缴费
    - 已缴费
    - 已关闭
    definition: ca_fee_order.order_status 表示订单生命周期：PENDING 待缴费、PAID 已缴费、CLOSED/EXPIRED
      关闭或过期。
    dictionary:
      PENDING: 待缴费
      PAID: 已缴费
      CLOSED: 已关闭
      EXPIRED: 已过期
    field_targets:
    - dataset: order
      field: order_status
      database: ''
    evidence_refs:
    - ev-cafee-order-schema
  - concept_id: cafee-company-pay-status
    name: 企业CA服务费状态
    aliases:
    - 已缴费
    - 未缴费
    definition: ca_fee_company.pay_status 表示企业当前服务费缴纳状态，PAID 已缴费 / UNPAID 未缴费；service_end
      表示当前服务期截止。
    dictionary:
      PAID: 已缴费
      UNPAID: 未缴费
    field_targets:
    - dataset: company
      field: pay_status
      database: ''
    - dataset: company
      field: service_end
      database: ''
    evidence_refs:
    - ev-cafee-company-schema
  processes:
  - stage_id: configure-project
    name: 配置/切换CA收费
    description: ''
    trigger: 运营后台保存项目配置或切换收费开关
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - ensure-todo
    data_effects:
    - operation: upsert
      dataset: project_config
      fields:
      - project_id
      - tenant_id
      - charge_enabled
      - supplier_annual_fee
      - core_annual_fee
      - pay_channel
      - special_company_list
      - agreement_version
      - last_toggle_time
      condition: 不存在则新增，存在则更新；charge_enabled 变更触发存量扫描或关单
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-cafee-admin-config
  - stage_id: ensure-todo
    name: 确保缴费待办/创建订单
    description: ''
    trigger: CA认证成功页调用 /todo/ensure 或运营批量生成待办
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - pay
    data_effects:
    - operation: read
      dataset: project_config
      fields:
      - project_id
      - charge_enabled
      - supplier_annual_fee
      - core_annual_fee
      - special_company_list
      condition: 判断项目是否收费、是否白名单/0元/特殊价
      description: ''
      evidence_refs: []
    - operation: upsert
      dataset: order
      fields:
      - order_no
      - company_id
      - certification_no
      - company_name
      - project_id
      - project_name
      - tenant_id
      - company_type
      - order_type
      - order_status
      - annual_fee
      - service_start
      - service_end
      - enable
      condition: 存在 PENDING 订单则复用，否则新增 PENDING
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-cafee-todo-ensure
  - stage_id: pay
    name: 签署协议并交e保打款
    description: ''
    trigger: 企业端协议签署、交e保开户、确认打款
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - ledger
    data_effects:
    - operation: update
      dataset: order
      fields:
      - agreement_signed
      - agreement_version
      - agreement_sign_time
      - agreement_file_path
      - pay_method
      - pay_amount
      - pay_time
      - order_status
      - invoice_status
      - bocom_plfm_ser_no
      - bocom_plfm_bsn_id
      - bocom_req_sn
      - bocom_txn_sts
      - invoice_no
      - invoice_file_path
      - close_reason
      condition: 签署后进入打款；确认划扣成功置 PAID 并记录交e保流水
      description: ''
      evidence_refs: []
    - operation: upsert
      dataset: company
      fields:
      - certification_no
      - company_name
      - tenant_id
      - locked_annual_fee
      - fee_locked
      - pay_status
      - service_start
      - service_end
      - source_project_id
      - source_company_type
      - special_config_flag
      - special_annual_fee
      condition: 首次缴费锁定年费并写服务期；续费顺延或重算服务期
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-cafee-payment
    - ev-cafee-order-service
  - stage_id: dual-check
    name: 双条件校验
    description: ''
    trigger: 门户/业务跳转前调用 /dualCheck 或 /portalCheck
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: company
      fields:
      - certification_no
      - pay_status
      - service_start
      - service_end
      - ca_status
      - special_config_flag
      - special_annual_fee
      condition: CA 有效且服务费在期/豁免才放行
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-cafee-dual-check
  - stage_id: ledger
    name: 台账查询/编辑
    description: ''
    trigger: 运营台账分页、统计、详情、编辑、批量白名单/延期
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: company
      fields:
      - certification_no
      - company_name
      - pay_status
      - service_start
      - service_end
      - source_project_id
      - source_company_type
      - special_config_flag
      - special_annual_fee
      - enable
      - renew_remind_sent
      condition: 企业维度查询，enable=Y
      description: ''
      evidence_refs: []
    - operation: update
      dataset: order
      fields:
      - order_status
      - service_start
      - service_end
      - version
      condition: 台账编辑受 version 乐观锁控制；交e保查证中不可改已缴费
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-cafee-admin-config
  datasets:
