    label: 已缴费CA服务费企业
    description: ca_fee_company.pay_status=PAID 且 enable=Y 的企业。
    contract_fragment:
      predicates:
      - field: company.pay_status
        operator: eq
        values:
        - PAID
      - field: company.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: company
      field: pay_status
      database: ''
    - dataset: company
      field: enable
      database: ''
    evidence_refs:
