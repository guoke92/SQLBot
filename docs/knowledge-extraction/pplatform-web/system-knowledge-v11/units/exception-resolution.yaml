unit_id: exception-resolution
revision: 1
title: 资金方异常解析及建议维护
aliases:
- 异常解析
- 报错建议
- 异常知识库
domain: funding
applicability: 资金方对接异常的报错关键字、原因、建议维护与查询；不用于资金规则配置本身
description: 维护按资金方+报错关键字命中的异常知识库，支持 CRUD、Excel 导入导出；保存/导入均校验唯一键并逻辑删除。
content:
  concepts:
  - concept_id: exception-resolution
    name: 异常解析记录
    aliases:
    - 异常建议
    - 报错建议
    definition: funding_exception_resolution 一行表示一个资金方+产品+报错关键字对应的原因与处理建议。
    dictionary: {}
    field_targets:
    - dataset: exception
      field: id
      database: ''
    - dataset: exception
      field: exception_no
      database: ''
    evidence_refs:
    - ev-exception-do
  - concept_id: enabled-exception
    name: 启用异常建议
    aliases:
    - 有效建议
    definition: enable=Y 的异常解析记录才参与查询与导出。
    dictionary:
      Y: 启用
    field_targets:
    - dataset: exception
      field: enable
      database: ''
    evidence_refs:
    - ev-exception-do
  processes:
  - stage_id: save-exception
    name: 新增/编辑异常建议
    description: ''
    trigger: 管理端 checkBeforeSave + afterSave
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - query-exception
    data_effects:
    - operation: read
      dataset: exception
      fields:
      - product_code
      - funding_party_code
      - error_keyword
      - id
      condition: 按 productCode+fundingPartyCode+errorKeyword 查重
      description: ''
      evidence_refs: []
    - operation: upsert
      dataset: exception
      fields:
      - exception_no
      - funding_party_code
      - funding_party_name
      - error_keyword
      - error_reason
      - suggestion
      - product_code
      - enable
      condition: 新增生成 exceptionNo；保存或更新 enable=Y 记录
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-exception-save
  - stage_id: import-exception
    name: Excel 导入异常建议
    description: ''
    trigger: POST /fund-web/exceptionInfo/importForExceptInput
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - query-exception
    data_effects:
    - operation: upsert
      dataset: exception
      fields:
      - product_code
      - funding_party_code
      - funding_party_name
      - error_keyword
      - error_reason
      - suggestion
      - exception_no
      - enable
      condition: 全量校验通过后单事务 upsert；任一失败不写库
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-exception-import
  - stage_id: query-exception
    name: 查询/导出异常建议
    description: ''
    trigger: 分页查询或导出接口
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: exception
      fields:
      - exception_no
      - funding_party_code
      - funding_party_name
      - error_keyword
      - error_reason
      - suggestion
      - product_code
      - enable
      condition: enable=Y；支持异常编号/对接方/资金方/关键字/操作人/时间条件
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-exception-export
  datasets:
  - dataset_id: exception
    name: funding_exception_resolution
    description: 资金方异常解析及建议主表。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: exception_no
      name: exception_no
      description: 异常编号
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_code
      name: funding_party_code
      description: 对接方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_name
      name: funding_party_name
      description: 资金方名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: error_keyword
      name: error_keyword
      description: 报错关键字
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: error_reason
      name: error_reason
      description: 报错原因
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: suggestion
      name: suggestion
      description: 建议处理方案
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs: []
    evidence_refs:
    - ev-exception-do
  relationships: []
  metrics:
  - metric_id: exception-count
    name: 异常建议记录数
    description: 启用异常建议按主键计数。
    aggregation: COUNT
    field:
      dataset: exception
      field: id
      database: ''
    filters: []
    grain:
    - dataset: exception
      field: product_code
      database: ''
    - dataset: exception
      field: funding_party_code
      database: ''
    evidence_refs:
    - ev-exception-export
  calibers:
  - caliber_id: enabled-exception
    label: 启用的异常建议
    description: enable=Y 的异常解析记录。
    contract_fragment:
      predicates:
      - field: exception.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: exception
      field: enable
      database: ''
    evidence_refs:
    - ev-exception-do
  domain_rules:
  - rule_id: unique-error-keyword
    label: 报错关键字唯一
    content: 同一 productCode+fundingPartyCode+errorKeyword 只允许一条启用记录；新增/导入前校验。
    applicability: 异常建议保存与导入
    query_impact: 按唯一键 upsert，不能直接新增重复关键字
    field_targets:
    - dataset: exception
      field: product_code
      database: ''
    - dataset: exception
      field: funding_party_code
      database: ''
    - dataset: exception
      field: error_keyword
      database: ''
    evidence_refs:
    - ev-exception-save
    - ev-exception-import
  - rule_id: all-or-nothing-import
    label: 导入全量校验通过才入库
    content: Excel 导入任一阶段失败则返回错误列表，不执行任何 DB 写入。
    applicability: 异常建议导入
    query_impact: 导入不会产生部分成功数据
    field_targets:
    - dataset: exception
      field: product_code
      database: ''
    - dataset: exception
      field: funding_party_code
      database: ''
    - dataset: exception
      field: error_keyword
      database: ''
    evidence_refs:
    - ev-exception-import
  - rule_id: only-enabled-visible
    label: 仅启用建议可查
    content: 查询与导出只返回 enable=Y 的记录。
    applicability: 异常建议查询/导出
    query_impact: 必须过滤 funding_exception_resolution.enable=Y
    field_targets:
    - dataset: exception
      field: enable
      database: ''
    evidence_refs:
    - ev-exception-export
  verified_query_patterns:
  - pattern_id: list-exception-by-keyword
    question: 某个资金方报错关键字的建议是什么
    query: SELECT error_keyword, error_reason, suggestion FROM funding_exception_resolution
      WHERE funding_party_code = ? AND error_keyword = ? AND enable = 'Y'
    intended_specification:
      grain: exception
      caliber_id: enabled-exception
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-exception-export
evidence_refs:
- ev-exception-do
- ev-exception-controller
- ev-exception-save
- ev-exception-import
- ev-exception-export
unit_links: []
assumptions:
- 查询范例未在目标库执行。
- 文档中曾出现 funding_party_exception_resolution 命名，实际代码 @TableName 为 funding_exception_resolution，以代码为准。
conflicts: []
confidence: 0.9
