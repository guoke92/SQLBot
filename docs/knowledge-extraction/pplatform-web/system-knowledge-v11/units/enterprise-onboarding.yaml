unit_id: enterprise-onboarding
revision: 1
title: 企业建档与客户录入
aliases:
- 企业建档
- 客户建档
- 客户录入
- 建档
domain: enterprise
applicability: 企业主数据建档、客户录入批量导入、提交认证、建档推送记录；不包含 CA 认证本身
description: 通过平台录入/客户录入/批量导入创建企业主数据、管理员、项目关系与角色；提交后进入待客户认证或审核流，并以 cust_build_record
  记录推送过程。
content:
  concepts:
  - concept_id: enterprise-company
    name: 企业主数据
    aliases:
    - 企业
    - 客户
    definition: cust_company_info 一行代表一个企业主数据/过程记录；data_type=1 为主数据。
    dictionary: {}
    field_targets:
    - dataset: company
      field: id
      database: ''
    - dataset: company
      field: code
      database: ''
    evidence_refs:
    - ev-company-schema
  - concept_id: build-status
    name: 企业建档状态
    aliases:
    - 认证状态
    - 待客户认证
    - 审核通过
    definition: cust_company_info.cust_build_status 表示建档/认证/审核状态；认证流与审核流是两套状态。
    dictionary:
      INIT: 初始化
      TO_BE_BUILD: 未建档
      BUILDING: 建档中
      BUILD_SUCCESS: 认证成功
      BUILD_FAIL: 认证失败
      BUILD_BACK: 退回
      BUILD_ACTIVATE: 待激活
      CUST_CONFIRM_AWAIT: 待客户认证
      CUST_AUDIT_AWAIT: 待审核
      CUST_BUILDING: 审核中
      CUST_BUILD_SUCCESS: 审核通过
      CUST_BUILD_FAIL: 审核拒绝
      CUST_CHANGE: 变更
    field_targets:
    - dataset: company
      field: cust_build_status
      database: ''
    evidence_refs:
    - ev-build-status-enum
  - concept_id: cust-status
    name: 企业状态
    aliases:
    - 生效
    - 注销
    - 冻结
    definition: cust_company_info.cust_status 表示企业生命周期状态：ADD/EFFECT/FAILURE/WRITEOFF/FREEZE/CHANGE。
    dictionary:
      ADD: 新增
      EFFECT: 生效
      FAILURE: 失效
      WRITEOFF: 注销
      FREEZE: 冻结
      CHANGE: 变更
    field_targets:
    - dataset: company
      field: cust_status
      database: ''
    evidence_refs:
    - ev-cust-status-enum
  processes:
  - stage_id: create-company
    name: 创建企业建档
    description: ''
    trigger: 平台录入、客户录入或批量导入 createCustCompany
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - submit-cust
    data_effects:
    - operation: insert
      dataset: company
      fields:
      - id
      - code
      - name
      - certification_no
      - cust_build_status
      - cust_status
      - data_type
      - cust_build_type
      - enable
      condition: 创建企业主数据/过程记录
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: person
      fields:
      - id
      - code
      - name
      - certification_no
      - ref_cust_company_info
      - cust_company_id
      - user_type
      - enable
      condition: 创建客户管理员/联系人
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: project_rel
      fields:
      - id
      - code
      - project_id
      - product_id
      - ref_cust_project_rel_cust_company_info
      - company_type
      - status
      - enable
      condition: 绑定关联项目与角色
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: role
      fields:
      - id
      - code
      - role_type
      - ref_cust_company_info
      - enable
      condition: 创建企业角色
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-company-create
  - stage_id: submit-cust
    name: 提交建档/待客户认证
    description: ''
    trigger: 导入成功后自动 submitCust 或运营手动提交
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - audit
    data_effects:
    - operation: update
      dataset: company
      fields:
      - cust_build_status
      condition: INIT/BUILD_FAIL → CUST_CONFIRM_AWAIT；推送讯易链、发短信/待办
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-submit-flow
  - stage_id: audit
    name: 审核流
    description: ''
    trigger: 运营审核
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: company
      fields:
      - cust_build_status
      - cust_status
      condition: CUST_AUDIT_AWAIT → CUST_BUILDING → CUST_BUILD_SUCCESS/FAIL；成功时 cust_status=EFFECT
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-build-status-enum
  - stage_id: save-build-record
    name: 记录建档推送
    description: ''
    trigger: 认证/推送回调后记录 cust_build_record
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: insert
      dataset: build_record
      fields:
      - id
      - cust_id
      - person_id
      - code
      - enable
      condition: 按 companyId/personId 写推送记录
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-build-record
  datasets:
  - dataset_id: company
    name: cust_company_info
    description: 企业主数据/过程记录。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 企业业务编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: name
      name: name
      description: 客户名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: certification_no
      name: certification_no
      description: 统一信用代码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_build_status
      name: cust_build_status
      description: 建档/认证/审核状态
      data_type: varchar
      dictionary:
        INIT: 初始化
        TO_BE_BUILD: 未建档
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功
        BUILD_FAIL: 认证失败
        BUILD_BACK: 退回
        BUILD_ACTIVATE: 待激活
        CUST_CONFIRM_AWAIT: 待客户认证
        CUST_AUDIT_AWAIT: 待审核
        CUST_BUILDING: 审核中
        CUST_BUILD_SUCCESS: 审核通过
        CUST_BUILD_FAIL: 审核拒绝
        CUST_CHANGE: 变更
      evidence_refs: []
    - field_id: cust_status
      name: cust_status
      description: 企业状态
      data_type: varchar
      dictionary:
        ADD: 新增
        EFFECT: 生效
        FAILURE: 失效
        WRITEOFF: 注销
        FREEZE: 冻结
        CHANGE: 变更
      evidence_refs: []
    - field_id: data_type
      name: data_type
      description: 数据类型：1 主数据，0 记录数据
      data_type: varchar
      dictionary:
        '1': 主数据
        '0': 记录数据
      evidence_refs: []
    - field_id: cust_build_type
      name: cust_build_type
      description: 录入方式
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-company-schema
  - dataset_id: person
    name: cust_person_info
    description: 企业联系人/管理员。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 联系人业务编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: name
      name: name
      description: 姓名
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: certification_no
      name: certification_no
      description: 证件号码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 关联企业 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_company_id
      name: cust_company_id
      description: 冗余企业 id
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: user_type
      name: user_type
      description: 联系人类型
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-person-schema
  - dataset_id: build_record
    name: cust_build_record
    description: 建档推送/过程记录。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 记录编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_id
      name: cust_id
      description: 企业ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: person_id
      name: person_id
      description: 联系人ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-build-record-schema
  - dataset_id: project_rel
    name: cust_project_rel
    description: 企业-项目关系。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 关系编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: project_id
      name: project_id
      description: 项目 id（String 存储）
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_id
      name: product_id
      description: 产品 id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: ref_cust_project_rel_cust_company_info
      name: ref_cust_project_rel_cust_company_info
      description: 关联企业 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: company_type
      name: company_type
      description: 客户角色
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: status
      name: status
      description: 关联状态
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-project-rel-schema
  - dataset_id: role
    name: cust_role_info
    description: 企业角色。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 角色编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: role_type
      name: role_type
      description: 角色类型
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 关联企业 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-role-schema
  - dataset_id: tenant_project
    name: tenant_project
    description: 租户业务项目实例。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-project-rel-schema
  relationships:
  - relationship_id: person-to-company-code
    left:
      dataset: person
      field: ref_cust_company_info
      database: ''
    right:
      dataset: company
      field: code
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 联系人按企业 code 归属企业主数据。
    status: proposed
    evidence_refs:
    - ev-company-create
    confidence: 0.5
  - relationship_id: build-record-to-company
    left:
      dataset: build_record
      field: cust_id
      database: ''
    right:
      dataset: company
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 建档推送记录关联企业。
    status: proposed
    evidence_refs:
    - ev-build-record
    confidence: 0.5
  - relationship_id: build-record-to-person
    left:
      dataset: build_record
      field: person_id
      database: ''
    right:
      dataset: person
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 建档推送记录关联联系人。
    status: proposed
    evidence_refs:
    - ev-build-record
    confidence: 0.5
  - relationship_id: project-rel-to-company
    left:
      dataset: project_rel
      field: ref_cust_project_rel_cust_company_info
      database: ''
    right:
      dataset: company
      field: code
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业-项目关系按企业 code 归属企业。
    status: proposed
    evidence_refs:
    - ev-company-create
    confidence: 0.5
  - relationship_id: project-rel-to-project
    left:
      dataset: project_rel
      field: project_id
      database: ''
    right:
      dataset: tenant_project
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业项目关系关联租户项目；project_id 为 String←Long 存储。
    status: proposed
    evidence_refs:
    - ev-company-create
    confidence: 0.5
  - relationship_id: role-to-company
    left:
      dataset: role
      field: ref_cust_company_info
      database: ''
    right:
      dataset: company
      field: code
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业角色按企业 code 归属企业。
    status: proposed
    evidence_refs:
    - ev-company-create
    confidence: 0.5
  metrics:
  - metric_id: built-company-count
    name: 建档企业数
    description: 按企业主数据 id 去重计数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: company
      field: id
      database: ''
    filters: []
    grain:
    - dataset: company
      field: data_type
      database: ''
    evidence_refs:
    - ev-company-schema
  - metric_id: pending-cust-confirm-count
    name: 待客户认证企业数
    description: cust_build_status=CUST_CONFIRM_AWAIT 的企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: company
      field: id
      database: ''
    filters: []
    grain:
    - dataset: company
      field: cust_build_status
      database: ''
    evidence_refs:
    - ev-submit-flow
  calibers:
  - caliber_id: active-company
    label: 有效企业
    description: 企业状态 EFFECT、主数据 data_type=1、启用 enable=Y 的企业。
    contract_fragment:
      predicates:
      - field: company.cust_status
        operator: eq
        values:
        - EFFECT
      - field: company.data_type
        operator: eq
        values:
        - '1'
      - field: company.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: company
      field: cust_status
      database: ''
    - dataset: company
      field: data_type
      database: ''
    - dataset: company
      field: enable
      database: ''
    evidence_refs:
    - ev-cust-status-enum
  - caliber_id: pending-cust-confirm
    label: 待客户认证企业
    description: cust_build_status=CUST_CONFIRM_AWAIT 的企业。
    contract_fragment:
      predicates:
      - field: company.cust_build_status
        operator: eq
        values:
        - CUST_CONFIRM_AWAIT
    field_targets:
    - dataset: company
      field: cust_build_status
      database: ''
    evidence_refs:
    - ev-submit-flow
  domain_rules:
  - rule_id: build-status-dual-flow
    label: 认证流与审核流不可混用
    content: CUST_CONFIRM_AWAIT/CUST_BUILDING/CUST_BUILD_SUCCESS 是审核流；BUILDING/BUILD_SUCCESS/BUILD_FAIL
      是认证流。
    applicability: 企业建档状态查询
    query_impact: 过滤建档状态需区分用户问的是认证成功还是审核通过
    field_targets:
    - dataset: company
      field: cust_build_status
      database: ''
    evidence_refs:
    - ev-build-status-enum
  - rule_id: import-all-or-nothing
    label: 批量导入整批失败不落库
    content: 客户录入批量导入任一硬校验失败则整批不落库，返回错误文件；软校验（企业名称查码失败）允许继续。
    applicability: 客户录入批量导入
    query_impact: 导入结果不能按行部分成功
    field_targets:
    - dataset: company
      field: name
      database: ''
    - dataset: company
      field: certification_no
      database: ''
    evidence_refs:
    - ev-company-create
  - rule_id: submit-state-transition
    label: 提交建档状态约束
    content: 仅 INIT/BUILD_FAIL 等可提交到 CUST_CONFIRM_AWAIT；提交后触发待办与通知。
    applicability: 建档提交
    query_impact: 统计待客户认证需使用 cust_build_status=CUST_CONFIRM_AWAIT
    field_targets:
    - dataset: company
      field: cust_build_status
      database: ''
    evidence_refs:
    - ev-submit-flow
  verified_query_patterns:
  - pattern_id: count-pending-cust-confirm
    question: 待客户认证的企业有多少
    query: SELECT COUNT(DISTINCT id) AS pending_cust_confirm_count FROM cust_company_info
      WHERE cust_build_status = 'CUST_CONFIRM_AWAIT'
    intended_specification:
      grain: company
      caliber_id: pending-cust-confirm
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-submit-flow
evidence_refs:
- ev-company-schema
- ev-person-schema
- ev-build-record-schema
- ev-project-rel-schema
- ev-role-schema
- ev-build-status-enum
- ev-cust-status-enum
- ev-company-create
- ev-submit-flow
- ev-build-record
unit_links: []
assumptions:
- 查询范例未在目标库执行。
- 批量导入异步能力基于 async_io_task 基建，未作为业务物理表进本单元。
conflicts: []
confidence: 0.9
