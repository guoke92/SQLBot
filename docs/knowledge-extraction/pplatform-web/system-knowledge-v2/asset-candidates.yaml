  label: 查询必须尊重租户作用域
  content: 业务表普遍包含 db_tenant_code/app_tenant_code/tenant_id 等租户字段；跨租户查询只有在明确授权和口径确认后才能执行，不得仅凭表关系自动跨租户汇总。
- item_id: RULE-SYNC-ERROR-GRAIN
