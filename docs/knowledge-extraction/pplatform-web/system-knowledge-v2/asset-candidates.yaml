  label: 有效已建档企业
  summary: 当前建档成功、企业有效、属于企业主数据且记录启用。
  contract_fragment:
    version: 3
    requirements:
    - clause: predicate
      requirement_id: built_success
      business_label: 建档状态为成功
      field:
        resource: cust_company_info
        field: cust_build_status
      operator: eq
      values:
      - BUILD_SUCCESS
      source: knowledge
      confidence: 0.98
    - clause: predicate
      requirement_id: company_effective
      business_label: 企业状态为有效
      field:
        resource: cust_company_info
        field: cust_status
      operator: eq
      values:
      - EFFECT
      source: knowledge
      confidence: 0.98
    - clause: predicate
      requirement_id: company_master
      business_label: 企业主数据
      field:
        resource: cust_company_info
        field: data_type
      operator: eq
      values:
      - '1'
      source: knowledge
      confidence: 0.98
    - clause: predicate
      requirement_id: company_enabled
      business_label: 企业记录启用
      field:
        resource: cust_company_info
        field: enable
      operator: eq
      values:
      - Y
      source: knowledge
      confidence: 0.98
  draft_definition: {}
  field_targets:
  - table_name: cust_company_info
    field_name: cust_build_status
  - table_name: cust_company_info
    field_name: cust_status
  - table_name: cust_company_info
