- item_id: CAL-EFFECTIVE-BUILT-COMPANY
  kind: caliber
  status: candidate
  confidence: 0.99
  evidence_refs:
  - CODE-CUST-CALLBACK
  - CODE-CUST-QUERY
  provenance:
