k5_rule_candidates:
- item_id: RULE-PROCESS-NOT-SUCCESS
  kind: rule
  status: candidate
  confidence: 0.99
  evidence_refs:
  - CODE-CUST-ASYNC
  - CODE-CUST-CALLBACK
  - SKILL-EXTERNAL
  provenance:
    repository_revision: ee434954e465713176e5bd52119eedde5ebe531b
  label: 技术流程完成不得解释为业务成功
  content: 建档推送、事务后动作或推数执行完成只能证明相应技术步骤完成；只有业务状态满足已确认成功口径时，才能称为建档成功、项目成功或下游处理成功。
- item_id: RULE-GRAIN-SEPARATION
  kind: rule
  status: candidate
  confidence: 0.99
  evidence_refs:
  - MODEL-COMPANY
  - MODEL-BUILD
  - MODEL-CHANGE
  - MODEL-SYNC-ERROR
  provenance:
    repository_revision: ee434954e465713176e5bd52119eedde5ebe531b
  label: 主数据与过程记录必须区分粒度
  content: cust_company_info 按企业主数据理解；cust_build_record、cust_change_record、client_api_sync_error 分别按建档过程、变更过程和失败调用理解，不能直接互相替代计数。
- item_id: RULE-PROJECT-COMPANY-CODE
  kind: rule
  status: candidate
  confidence: 0.99
  evidence_refs:
  - CODE-CUST-QUERY
  provenance:
    repository_revision: ee434954e465713176e5bd52119eedde5ebe531b
  label: 企业项目关系使用企业编码关联
  content: 在当前实现中 cust_project_rel.ref_cust_project_rel_cust_company_info 连接 cust_company_info.code；不得因字段名含 ref 或 cust 而自动改用企业
    id。
- item_id: RULE-TOP-FLAG-RISK
  kind: rule
  status: candidate
  confidence: 0.98
  evidence_refs:
  - CODE-TOP-FLAG
  - CODE-OP-SYNC
  provenance:
    repository_revision: ee434954e465713176e5bd52119eedde5ebe531b
  label: topFlag 是离职引用风险提示
  content: tenant_project 或企业项目关系的 top_flag 表示配置中仍可能引用已离职运营人员；它不是人员状态、项目生效状态或删除状态。
- item_id: RULE-AGREEMENT-EXTERNAL
  kind: rule
  status: candidate
  confidence: 0.97
  evidence_refs:
  - DOC-BIZ-COMPONENT
  - SKILL-AGREEMENT
  provenance:
    repository_revision: ee434954e465713176e5bd52119eedde5ebe531b
  label: 协议主数据不在产融本地表
  content: 协议生成和签署主数据由协议插件维护。未发现本地表时不得根据 serviceKey 或 businessId 虚构本地协议主表。
