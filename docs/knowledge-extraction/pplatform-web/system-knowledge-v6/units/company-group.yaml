unit_id: company-group
revision: 1
title: 集团企业与关联方
aliases:
- 集团企业
- 集团成员
- 成员单位
- 总公司
- 股东
- 关联方
domain: enterprise
applicability: 集团树成员、集团根企业、集团内核心企业及其融资关联企业查询；不用于单独统计建档企业或项目开通数
description: cust_group_rel 维护企业集团树，集团查询以已启用关系和企业主数据状态为约束，并可沿企业编码关联总公司与股东信息。
content:
  concepts:
  - concept_id: group-member
    name: 集团成员
    aliases:
    - 成员单位
    - 集团关系
    definition: cust_group_rel 中一行企业节点，记录成员、父级、根集团、企业角色和关系状态。
    dictionary:
      EFFECTIVE: 已生效
      INEFFECTIVE: 未生效
      REJECTED: 已拒绝
    field_targets:
    - dataset: group_rel
      field: id
      database: ''
    - dataset: group_rel
      field: cust_id
      database: ''
    - dataset: group_rel
      field: status
      database: ''
    evidence_refs:
    - ev-group-do
    - ev-group-status
  - concept_id: group-root
    name: 集团根企业
    aliases:
    - 集团公司
    - 根企业
    definition: 集团树根节点；root_flag=Y 表示集团企业，root_cust_id 指向该集团根企业。
    dictionary:
      Y: 集团根企业
      N: 非根企业
    field_targets:
    - dataset: group_rel
      field: root_flag
      database: ''
    - dataset: group_rel
      field: root_cust_id
      database: ''
    evidence_refs:
    - ev-group-do
    - ev-root-flow
  - concept_id: head-company
    name: 总公司信息
    aliases:
    - 集团总部
    - 总公司工商信息
    definition: cust_head_company_info 保存企业总公司工商和法人资料，并以关联企业 code 指向企业主数据。
    dictionary: {}
    field_targets:
    - dataset: head_company
      field: ref_cust_head_company_info_cust_company_info
      database: ''
    - dataset: head_company
      field: certification_no
      database: ''
    - dataset: head_company
      field: legal_name
      database: ''
    evidence_refs:
    - ev-head-do
    - ev-head-rel
  - concept_id: shareholder
    name: 股东关联方
    aliases:
    - 股东
    - 关联方
    definition: cust_shareholder_info 保存企业关联方及出资信息，通过 ref_cust_company_info 按企业 code
      关联客户主表。
    dictionary: {}
    field_targets:
    - dataset: shareholder
      field: id
      database: ''
    - dataset: shareholder
      field: ref_cust_company_info
      database: ''
    evidence_refs:
    - ev-shareholder-do
    - ev-shareholder-rel
  processes:
  - stage_id: maintain-root
    name: 新增或更新集团根节点
    description: ''
    trigger: POST /cust-web/custGroupRel/addRootGroup
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - maintain-member
    data_effects:
    - operation: upsert
      dataset: group_rel
      fields:
      - cust_id
      - root_cust_id
      - db_tenant_code
      - cust_type
      - status
      - root_group_id
      condition: 企业存在；根节点 root_cust_id 等于 cust_id；企业认证状态为 BUILD_SUCCESS 时关系 EFFECTIVE，否则
        INEFFECTIVE
      description: ''
      evidence_refs:
      - ev-root-flow
    evidence_refs:
    - ev-controller
    - ev-root-flow
  - stage_id: maintain-member
    name: 关联集团子级企业
    description: ''
    trigger: POST /cust-web/custGroupRel/addSubCustGroupRel
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - tree-query
    data_effects:
    - operation: insert
      dataset: group_rel
      fields:
      - cust_id
      - parent_cust_id
      - parent_group_id
      - root_cust_id
      - root_group_id
      - cust_type
      - status
      - db_tenant_code
      condition: 父节点和根节点必填；初始状态 INEFFECTIVE；同一企业、父级、根集团、角色、租户的重复关系被拒绝
      description: ''
      evidence_refs:
      - ev-member-flow
    evidence_refs:
    - ev-controller
    - ev-member-flow
  - stage_id: tree-query
    name: 查询集团树
    description: ''
    trigger: GET /cust-web/custGroupRel/showCustGroupTree 或 showSingleCustGroupTree
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: group_rel
      fields:
      - id
      - cust_id
      - parent_group_id
      - parent_cust_id
      - root_group_id
      - root_cust_id
      - cust_type
      - status
      condition: ''
      description: ''
      evidence_refs: []
    - operation: read
      dataset: company
      fields:
      - id
      - name
      - cust_build_status
      - enable
      condition: 按 cust_id 关联且企业 enable='Y'
      description: ''
      evidence_refs:
      - ev-tree-mapper
    evidence_refs:
    - ev-controller
    - ev-tree-mapper
  - stage_id: remove-group
    name: 删除集团树
    description: ''
    trigger: GET /cust-web/custGroupRel/removeRootGroup
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: group_rel
      fields:
      - id
      - cust_id
      - root_cust_id
      - status
      condition: ''
      description: ''
      evidence_refs: []
    - operation: delete
      dataset: group_rel
      fields:
      - id
      condition: 扁平化根节点及全部子节点，先通过在途业务校验后批量删除
      description: ''
      evidence_refs:
      - ev-remove-flow
    evidence_refs:
    - ev-remove-flow
  datasets:
  - dataset_id: group_rel
    name: cust_group_rel
    description: 集团成员单位关系表；一行表示企业在集团树中的节点关系。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 关系主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: cust_id
      name: cust_id
      description: 成员企业ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: parent_group_id
      name: parent_group_id
      description: 父关系节点ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: parent_cust_id
      name: parent_cust_id
      description: 父企业ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: root_cust_id
      name: root_cust_id
      description: 根企业ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: root_group_id
      name: root_group_id
      description: 根关系节点ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: root_flag
      name: root_flag
      description: 是否集团企业，Y=是、N=不是
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_type
      name: cust_type
      description: 企业角色，多角色以逗号或序列化值保存
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: status
      name: status
      description: 集团关系状态
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效行标记
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: db_tenant_code
      name: db_tenant_code
      description: ''
      data_type: ''
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-group-do
    - ev-group-status
  - dataset_id: company
    name: cust_company_info
    description: 企业主/过程记录，一行一家企业。正式企业主数据需 data_type='1' 且 enable='Y'。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: name
      name: name
      description: 企业名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_build_status
      name: cust_build_status
      description: 认证状态（认证流+审核流两套状态机）
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: cust_status
      name: cust_status
      description: 客户状态（生效/注销/冻结等）
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效行标记
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: data_type
      name: data_type
      description: 数据类型 1=主数据 0=记录数据
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: code
      name: code
      description: 企业业务键，联系人/项目关联/角色均按 code 关联
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-tree-mapper
    - ev-finance-query
  - dataset_id: head_company
    name: cust_head_company_info
    description: 客户总公司工商与法人信息。
    database: lowcode_pplatform
    fields:
    - field_id: ref_cust_head_company_info_cust_company_info
      name: ref_cust_head_company_info_cust_company_info
      description: 关联企业主数据 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: certification_no
      name: certification_no
      description: 统一社会信用代码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: legal_name
      name: legal_name
      description: 法人姓名
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-head-do
    - ev-head-rel
  - dataset_id: shareholder
    name: cust_shareholder_info
    description: 客户关联方信息主表，保存企业股东/关联方及出资信息。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 关联企业主数据 code
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: fund_scale
      name: fund_scale
      description: 出资比例（%）
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-shareholder-do
    - ev-shareholder-rel
  relationships:
  - relationship_id: group-member-company
    left:
      dataset: group_rel
      field: cust_id
      database: ''
    right:
      dataset: company
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 集团关系节点指向成员企业
    status: proposed
    evidence_refs:
    - ev-group-rel
    confidence: 0.5
  - relationship_id: group-parent-company
    left:
      dataset: group_rel
      field: parent_cust_id
      database: ''
    right:
      dataset: company
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 集团节点父企业指向企业主数据
    status: proposed
    evidence_refs:
    - ev-group-rel
    confidence: 0.5
  - relationship_id: group-root-company
    left:
      dataset: group_rel
      field: root_cust_id
      database: ''
    right:
      dataset: company
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 集团节点根企业指向企业主数据
    status: proposed
    evidence_refs:
    - ev-group-rel
    confidence: 0.5
  - relationship_id: head-company-by-code
    left:
      dataset: head_company
      field: ref_cust_head_company_info_cust_company_info
      database: ''
    right:
      dataset: company
      field: code
      database: ''
    relationship_type: SHARED_KEY
    cardinality: n:1
    business_meaning: 总公司资料按企业编码共享关联客户主数据
    status: proposed
    evidence_refs:
    - ev-head-rel
    confidence: 0.5
  - relationship_id: shareholder-company-by-code
    left:
      dataset: shareholder
      field: ref_cust_company_info
      database: ''
    right:
      dataset: company
      field: code
      database: ''
    relationship_type: SHARED_KEY
    cardinality: n:1
    business_meaning: 股东关联方按企业编码共享关联客户主数据
    status: proposed
    evidence_refs:
    - ev-shareholder-rel
    confidence: 0.5
  metrics:
  - metric_id: effective-group-member-count
    name: 已生效集团成员数
    description: 按成员企业 cust_id 去重的已生效、已启用集团成员数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: group_rel
      field: cust_id
      database: ''
    filters: []
    grain:
    - dataset: group_rel
      field: cust_id
      database: ''
    evidence_refs:
    - ev-group-status
  - metric_id: shareholder-fund-scale
    name: 股东出资比例
    description: 股东关联方记录中的出资比例字段，不能将记录数当企业数。
    aggregation: VALUE
    field:
      dataset: shareholder
      field: fund_scale
      database: ''
    filters: []
    grain:
    - dataset: shareholder
      field: id
      database: ''
    evidence_refs:
    - ev-shareholder-do
  calibers:
  - caliber_id: effective-group-member
    label: 已生效集团成员
    description: 集团关系状态 EFFECTIVE 且关系行启用；成员企业主数据在需要企业名称或有效企业分析时应 additionally enable='Y'。
    contract_fragment:
      predicates:
      - field: group_rel.status
        operator: eq
        values:
        - EFFECTIVE
      - field: group_rel.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: group_rel
      field: status
      database: ''
    - dataset: group_rel
      field: enable
      database: ''
    evidence_refs:
    - ev-group-status
    - ev-group-mapper
  - caliber_id: effective-finance-companies-in-group
    label: 集团内生效融资企业
    description: 以集团根企业筛选 cust_group_rel 成员（含根企业自身），角色包含 CORE，再通过项目关联筛选 FINANCE 企业，并要求企业
      BUILD_SUCCESS、EFFECT、data_type='1'、enable='Y'。
    contract_fragment:
      predicates:
      - field: group_rel.root_cust_id
        operator: eq
        values:
        - <groupCustId>
      - field: group_rel.enable
        operator: eq
        values:
        - Y
      - field: group_rel.cust_type
        operator: like
        values:
        - CORE
      - field: company.cust_build_status
        operator: eq
        values:
        - BUILD_SUCCESS
      - field: company.cust_status
        operator: eq
        values:
        - EFFECT
      - field: company.data_type
        operator: eq
        values:
        - '1'
      - field: company.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: group_rel
      field: root_cust_id
      database: ''
    - dataset: group_rel
      field: enable
      database: ''
    - dataset: group_rel
      field: cust_type
      database: ''
    - dataset: company
      field: cust_build_status
      database: ''
    - dataset: company
      field: cust_status
      database: ''
    - dataset: company
      field: data_type
      database: ''
    - dataset: company
      field: enable
      database: ''
    evidence_refs:
    - ev-finance-query
  domain_rules:
  - rule_id: only-effective-members-counted
    label: 仅已生效关系计入集团成员
    content: 集团成员统计必须过滤 status='EFFECTIVE' 且 enable='Y'；INEFFECTIVE 和 REJECTED 不计入已生效口径。
    applicability: 集团成员数量与列表
    query_impact: 过滤 group_rel.status 和 group_rel.enable
    field_targets:
    - dataset: group_rel
      field: status
      database: ''
    - dataset: group_rel
      field: enable
      database: ''
    evidence_refs:
    - ev-group-status
  - rule_id: root-self-included-in-finance-query
    label: 集团融资查询包含根企业
    content: listCorporationEffectFinance 的集团成员子查询 UNION 根企业 custId，因此集团根企业自身也进入 CORE
      候选集合。
    applicability: 集团内融资企业查询
    query_impact: 不得只查询 root_cust_id 下级行而遗漏根企业
    field_targets:
    - dataset: group_rel
      field: root_cust_id
      database: ''
    - dataset: group_rel
      field: cust_id
      database: ''
    evidence_refs:
    - ev-finance-query
  - rule_id: group-delete-checks-inflight
    label: 删除集团先校验在途业务
    content: 删除根集团前扁平化整棵树并执行 validateBusinessOnWay，通过后才批量删除关系行。
    applicability: 删除集团
    query_impact: 删除统计或历史分析时不能假设删除操作无业务校验
    field_targets:
    - dataset: group_rel
      field: id
      database: ''
    - dataset: group_rel
      field: root_cust_id
      database: ''
    evidence_refs:
    - ev-remove-flow
  verified_query_patterns:
  - pattern_id: count-effective-group-members
    question: 已生效集团成员有多少
    query: 'SELECT COUNT(DISTINCT cust_id) AS effective_group_member_count

      FROM cust_group_rel

      WHERE status = ''EFFECTIVE'' AND enable = ''Y'''
    intended_specification:
      grain: company
      caliber_id: effective-group-member
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-group-status
  - pattern_id: list-group-finance-companies
    question: 某集团有哪些生效融资企业
    query: "SELECT DISTINCT c4.*\nFROM cust_company_info c1\nJOIN cust_project_rel\
      \ c2 ON c1.code = c2.ref_cust_project_rel_cust_company_info AND c2.enable =\
      \ 'Y'\nJOIN cust_project_rel c3 ON c2.project_id = c3.project_id AND c3.company_type\
      \ = 'FINANCE' AND c3.enable = 'Y'\nJOIN cust_company_info c4 ON c3.ref_cust_project_rel_cust_company_info\
      \ = c4.code\nWHERE c1.id IN (SELECT cust_id FROM cust_group_rel WHERE root_cust_id\
      \ = :groupCustId AND enable = 'Y' AND cust_type LIKE '%CORE%' UNION SELECT :groupCustId)\n\
      \  AND c4.cust_build_status = 'BUILD_SUCCESS' AND c4.cust_status = 'EFFECT'\
      \ AND c4.data_type = '1' AND c4.enable = 'Y'"
    intended_specification:
      grain: company
      caliber_id: effective-finance-companies-in-group
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-finance-query
evidence_refs:
- ev-controller
- ev-group-do
- ev-group-status
- ev-group-mapper
- ev-finance-query
- ev-head-do
- ev-head-rel
- ev-shareholder-do
- ev-shareholder-rel
- ev-root-flow
- ev-member-flow
- ev-remove-flow
- ev-group-rel
unit_links: []
assumptions:
- 查询示例未在目标数据库执行验证。
- cust_group_rel 的 enable 使用物理值 Y 表示启用，源码未为该字段提供独立枚举类。
conflicts: []
confidence: 0.92
