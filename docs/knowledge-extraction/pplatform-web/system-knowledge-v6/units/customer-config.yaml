unit_id: customer-config
revision: 1
title: 客户配置与渠道映射
aliases:
- 客户配置
- 客户认证配置
- 渠道配置映射
- 外部渠道映射
domain: config
applicability: 查询企业认证协议、验证开关、邀请码策略及外部渠道到内部编码映射；不用于企业建档状态或租户品牌配置
description: cust_setting_config 保存客户认证与邀请码等配置，cust_config_mapping 按类型、渠道和分组提供启用的外部编码映射。
content:
  concepts:
  - concept_id: config-mapping
    name: 渠道配置映射
    aliases:
    - 外部渠道映射
    - 变更项映射
    definition: cust_config_mapping 中按 type、outer_channel、groups 匹配并以 inner_code/inner_name
      与 outer_code/outer_name 表示内外部编码名称对应关系的启用记录。
    dictionary:
      Y: 启用
      N: 停用
    field_targets:
    - dataset: config_mapping
      field: type
      database: ''
    - dataset: config_mapping
      field: outer_channel
      database: ''
    - dataset: config_mapping
      field: groups
      database: ''
    - dataset: config_mapping
      field: inner_code
      database: ''
    - dataset: config_mapping
      field: outer_code
      database: ''
    - dataset: config_mapping
      field: enable
      database: ''
    evidence_refs:
    - ev-mapping-model
    - ev-mapping-query
  - concept_id: customer-setting
    name: 客户认证配置
    aliases:
    - 企业级配置
    - 协议配置
    - 验证开关
    definition: cust_setting_config 的客户认证配置记录，包含关键/非关键企业信息审核、协议地址、认证审核、人脸/打款验证及邀请码期限与发送间隔。
    dictionary: {}
    field_targets:
    - dataset: cust_setting
      field: cust_id
      database: ''
    - dataset: cust_setting
      field: need_verify_no_key
      database: ''
    - dataset: cust_setting
      field: need_auth_verify
      database: ''
    - dataset: cust_setting
      field: face_recognition
      database: ''
    - dataset: cust_setting
      field: payment_verification
      database: ''
    - dataset: cust_setting
      field: invitation_code_period
      database: ''
    - dataset: cust_setting
      field: invitation_code_period_unit
      database: ''
    - dataset: cust_setting
      field: sending_interval
      database: ''
    - dataset: cust_setting
      field: sending_interval_unti
      database: ''
    evidence_refs:
    - ev-setting-model
    - ev-setting-read
  processes:
  - stage_id: resolve-channel-mapping
    name: 查询渠道映射
    description: ''
    trigger: 按映射类型、内部编码、外部渠道和分组解析配置
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: config_mapping
      fields:
      - type
      - inner_code
      - outer_channel
      - groups
      - inner_name
      - outer_code
      - outer_name
      - enable
      condition: 可选 inner_code/outer_channel/groups 过滤；固定 enable='Y'
      description: ''
      evidence_refs:
      - ev-mapping-query
    evidence_refs:
    - ev-mapping-query
  - stage_id: resolve-changed-items
    name: 解析企业变更项
    description: ''
    trigger: 企业变更产生 outer_channel 与变更项集合
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: config_mapping
      fields:
      - outer_channel
      - type
      - groups
      - inner_code
      - outer_code
      condition: type='COMPANY_CHANGE_CODE'；按 groups 或 inner_code 匹配变更项
      description: ''
      evidence_refs:
      - ev-changed-mapping
    evidence_refs:
    - ev-changed-mapping
  - stage_id: load-customer-setting
    name: 加载客户认证配置
    description: ''
    trigger: 人脸认证、账户初始化或企业信息变更需要读取全局客户设置
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - apply-verification-policy
    data_effects:
    - operation: read
      dataset: cust_setting
      fields:
      - need_auth_verify
      - need_verify_no_key
      - key_word
      - no_key_word
      - payment_maximum_number
      - cust_id
      condition: service list()/getById() 读取；实现中的默认读取取列表第一个配置
      description: ''
      evidence_refs:
      - ev-setting-read
      - ev-face-setting
      - ev-account-setting
    evidence_refs:
    - ev-setting-read
  - stage_id: apply-verification-policy
    name: 应用审核与验证策略
    description: ''
    trigger: 已加载客户认证配置
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: cust_setting
      fields:
      - need_auth_verify
      - need_verify_no_key
      - key_word
      - no_key_word
      condition: need_auth_verify='no' 时跳过企业认证审核；need_verify_no_key='no' 时跳过非关键字段审核；JSON
        数组字段解析为字段名集合
      description: ''
      evidence_refs:
      - ev-enhance-policy
    - operation: read
      dataset: cust_setting
      fields:
      - face_recognition
      - payment_verification
      condition: 人脸服务读取 need_auth_verify 决定是否启用客户认证审核；其余开关语义未由枚举代码确认
      description: ''
      evidence_refs:
      - ev-face-setting
    evidence_refs:
    - ev-enhance-policy
  datasets:
  - dataset_id: config_mapping
    name: cust_config_mapping
    description: 外部渠道与内部配置编码映射表；一行一条映射记录。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: type
      name: type
      description: 映射类型，用于区分配置类别
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: outer_channel
      name: outer_channel
      description: 外部渠道标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: inner_code
      name: inner_code
      description: 内部编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: inner_name
      name: inner_name
      description: 内部名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: outer_code
      name: outer_code
      description: 外部编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: outer_name
      name: outer_name
      description: 外部名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: groups
      name: groups
      description: 映射分组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效标记，Y=启用，N=停用
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-mapping-model
  - dataset_id: cust_setting
    name: cust_setting_config
    description: 客户认证配置表；源码默认读取配置列表的第一条记录。
    database: lowcode_pplatform
    fields:
    - field_id: cust_id
      name: cust_id
      description: 企业 id
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: key_word
      name: key_word
      description: 企业关键信息字段名 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: need_verify_no_key
      name: need_verify_no_key
      description: 企业非关键信息变更审核开关；代码明确 no 表示不审核
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: need_auth_verify
      name: need_auth_verify
      description: 企业认证审核开关；代码明确 no 表示不审核
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: face_recognition
      name: face_recognition
      description: 人脸识别配置
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: payment_verification
      name: payment_verification
      description: 打款验证配置
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: payment_maximum_number
      name: payment_maximum_number
      description: 最多申请打款次数
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: no_key_word
      name: no_key_word
      description: 企业非关键信息字段名 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: invitation_code_period
      name: invitation_code_period
      description: 邀请码有效期数值
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: invitation_code_period_unit
      name: invitation_code_period_unit
      description: 邀请码有效期单位
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: sending_interval
      name: sending_interval
      description: 邀请码重复发送间隔数值
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: sending_interval_unti
      name: sending_interval_unti
      description: 邀请码重复发送间隔单位
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-setting-model
  relationships: []
  metrics:
  - metric_id: enabled-mapping-count
    name: 启用渠道映射数
    description: enable='Y' 的渠道映射行数，可按 type、outer_channel 或 groups 分组。
    aggregation: COUNT
    field:
      dataset: config_mapping
      field: id
      database: ''
    filters: []
    grain:
    - dataset: config_mapping
      field: type
      database: ''
    evidence_refs:
    - ev-mapping-query
  - metric_id: configured-customer-count
    name: 已配置企业数
    description: cust_setting_config 中 cust_id 去重后的企业数；不等同于认证成功企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: cust_setting
      field: cust_id
      database: ''
    filters: []
    grain:
    - dataset: cust_setting
      field: cust_id
      database: ''
    evidence_refs:
    - ev-setting-model
  calibers:
  - caliber_id: enabled-config-mapping
    label: 启用渠道映射
    description: 仅统计 cust_config_mapping 中 enable='Y' 的映射记录。
    contract_fragment:
      predicates:
      - field: config_mapping.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: config_mapping
      field: enable
      database: ''
    evidence_refs:
    - ev-mapping-query
  - caliber_id: no-verification-setting
    label: 关闭审核配置
    description: 客户配置明确将对应审核开关设为 no 时，服务跳过该审核。
    contract_fragment:
      predicates:
      - field: cust_setting.need_auth_verify
        operator: eq
        values:
        - false
      - field: cust_setting.need_verify_no_key
        operator: eq
        values:
        - false
    field_targets:
    - dataset: cust_setting
      field: need_auth_verify
      database: ''
    - dataset: cust_setting
      field: need_verify_no_key
      database: ''
    evidence_refs:
    - ev-enhance-policy
  domain_rules:
  - rule_id: mapping-enabled-filter
    label: 映射查询必须过滤启用状态
    content: CustConfigMappingDao 的 listConfig/getConfig 均固定 enable='Y'，停用映射不参与解析。
    applicability: 查询渠道映射或变更项映射
    query_impact: 统计或解析可用映射时必须 WHERE enable='Y'
    field_targets:
    - dataset: config_mapping
      field: enable
      database: ''
    evidence_refs:
    - ev-mapping-query
  - rule_id: setting-is-not-mapping
    label: 客户设置与渠道映射不可混查
    content: cust_setting_config 保存企业认证策略，cust_config_mapping 保存外部渠道映射，两表没有源码确认的关系。
    applicability: 客户认证配置与渠道映射查询
    query_impact: 认证开关/邀请码应从 cust_setting_config 读取，渠道编码映射应从 cust_config_mapping 读取。
    field_targets:
    - dataset: cust_setting
      field: need_auth_verify
      database: ''
    - dataset: config_mapping
      field: outer_channel
      database: ''
    evidence_refs:
    - ev-setting-model
    - ev-mapping-model
  - rule_id: json-field-list
    label: 字段清单配置按 JSON 数组解释
    content: key_word 与 no_key_word 由 JSON.parseArray 解析为字段名称集合，不应按普通逗号字符串直接统计。
    applicability: 关键/非关键企业信息审核
    query_impact: 查询字段覆盖范围时需先解析 JSON 数组
    field_targets:
    - dataset: cust_setting
      field: key_word
      database: ''
    - dataset: cust_setting
      field: no_key_word
      database: ''
    evidence_refs:
    - ev-enhance-policy
  verified_query_patterns:
  - pattern_id: count-enabled-mappings
    question: 启用的渠道映射有多少
    query: 'SELECT COUNT(1) AS enabled_mapping_count

      FROM cust_config_mapping

      WHERE enable = ''Y'''
    intended_specification:
      grain: config_mapping
      caliber_id: enabled-config-mapping
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-mapping-query
  - pattern_id: list-customer-verification-settings
    question: 客户认证审核配置是什么
    query: "SELECT cust_id, need_auth_verify, need_verify_no_key, face_recognition,\n\
      \       payment_verification\nFROM cust_setting_config"
    intended_specification:
      grain: cust_setting
      caliber_id: no-verification-setting
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-setting-model
evidence_refs:
- ev-mapping-model
- ev-mapping-query
- ev-setting-model
- ev-setting-read
- ev-enhance-policy
unit_links: []
assumptions:
- 源码未提供 cust_setting_config 与 cust_company_info 的显式等值查询，未在本单元声明跨表关系。
- face_recognition、payment_verification 等字段的 Y/N 展示语义未由本次源码枚举确认。
- 查询范例未在目标数据库执行。
conflicts: []
confidence: 0.88
