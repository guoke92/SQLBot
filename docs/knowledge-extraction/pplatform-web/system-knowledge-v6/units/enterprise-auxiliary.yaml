unit_id: enterprise-auxiliary
revision: 1
title: 企业辅助信息
aliases:
- 股东出资
- 企业邀请
- 推送客户
- 生命周期
- 配置映射
- 定制产品
- 总公司
domain: enterprise
applicability: 企业股东及出资、邀请进度、推送项目、冻结解冻、企业配置映射、快捷入口和总公司信息查询；不用于企业主档建档状态权威统计
description: 企业主数据之外的股东、邀请、推送、生命周期和扩展配置记录。
content:
  concepts:
  - concept_id: shareholder-contribution
    name: 股东出资
    aliases:
    - 关联方出资
    - 股东信息
    definition: cust_shareholder_info 中按企业 code 记录的关联方及其应实际出资信息。
    dictionary: {}
    field_targets:
    - dataset: shareholder
      field: ref_cust_company_info
      database: ''
    - dataset: shareholder
      field: fund_amount_ought
      database: ''
    - dataset: shareholder
      field: fund_amount_act
      database: ''
    - dataset: shareholder
      field: fund_scale
      database: ''
    evidence_refs:
    - ev-shareholder-fields
    - ev-shareholder-copy
  - concept_id: invite-progress
    name: 企业邀请进度
    aliases:
    - 邀请状态
    - 邀请记录
    definition: cust_invite_info 的 progress；运营回调会将企业 cust_build_status 写回同名且同租户的邀请记录。
    dictionary: {}
    field_targets:
    - dataset: invite
      field: progress
      database: ''
    - dataset: invite
      field: name
      database: ''
    - dataset: invite
      field: db_tenant_code
      database: ''
    evidence_refs:
    - ev-invite-fields
    - ev-invite-progress-sync
  - concept_id: company-lifecycle
    name: 企业生命周期
    aliases:
    - 冻结企业
    - 解冻企业
    definition: cust_company_lifecycle_info 以 type 记录冻结或解冻事件；enable 表示记录是否启用。
    dictionary:
      FRZ: 冻结
      UNFRZ: 解冻
      Y: 启用
      N: 停用
    field_targets:
    - dataset: lifecycle
      field: company_id
      database: ''
    - dataset: lifecycle
      field: type
      database: ''
    - dataset: lifecycle
      field: enable
      database: ''
    evidence_refs:
    - ev-lifecycle-fields
    - ev-lifecycle-dict
  - concept_id: head-company
    name: 总公司信息
    aliases:
    - 集团总部
    - 总公司工商信息
    definition: cust_head_company_info 保存企业总公司工商和法人资料，并以关联企业 code 指向企业主数据。
    dictionary: {}
    field_targets:
    - dataset: head_company
      field: ref_cust_head_company_info_cust_company_info
      database: ''
    - dataset: head_company
      field: certification_no
      database: ''
    - dataset: head_company
      field: legal_name
      database: ''
    evidence_refs:
    - ev-head-company-fields
    - ev-head-company-flow
  processes:
  - stage_id: copy-shareholder
    name: 复制企业关联方
    description: ''
    trigger: 企业资料复制到新企业
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: shareholder
      fields:
      - ref_cust_company_info
      - id
      condition: ''
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: shareholder
      fields:
      - ref_cust_company_info
      - main_data_id
      condition: 将原企业 code 改为新企业 code，并保存原记录 id
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-shareholder-copy
  - stage_id: sync-invite-progress
    name: 同步邀请进度
    description: ''
    trigger: 企业运营回调后更新邀请记录
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: invite
      fields:
      - name
      - db_tenant_code
      condition: ''
      description: ''
      evidence_refs: []
    - operation: update
      dataset: invite
      fields:
      - progress
      condition: 按邀请 name 与 db_tenant_code 匹配企业，将 progress 置为 cust_build_status
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-invite-progress-sync
  - stage_id: resolve-push-project
    name: 解析推送默认项目
    description: ''
    trigger: 需要按来源和目标 SSO 渠道选择推送项目
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: pushcust
      fields:
      - source_sso_channel
      - target_sso_channel
      - project_id
      condition: sourceSsoChannel 与 targetSsoChannel 同时匹配
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-push-project-lookup
  - stage_id: maintain-head-company
    name: 维护总公司
    description: ''
    trigger: 企业认证或企业变更时查找/创建总公司资料
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: head_company
      fields:
      - ref_cust_head_company_info_cust_company_info
      - certification_no
      - enable
      condition: ''
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: head_company
      fields:
      - ref_cust_head_company_info_cust_company_info
      condition: 不存在对应企业 code 时创建
      description: ''
      evidence_refs: []
    - operation: update
      dataset: head_company
      fields:
      - ref_cust_head_company_info_cust_company_info
      condition: 企业变更时迁移关联 code
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-head-company-flow
  datasets:
  - dataset_id: shareholder
    name: cust_shareholder_info
    description: 客户关联方信息主表，保存企业股东/关联方及出资信息。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-shareholder-fields
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 关联企业主数据 code
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-shareholder-fields
    - field_id: fund_amount_ought
      name: fund_amount_ought
      description: 应出资金额
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-shareholder-fields
    - field_id: fund_amount_act
      name: fund_amount_act
      description: 实际出资金额
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-shareholder-fields
    - field_id: fund_scale
      name: fund_scale
      description: 出资比例（%）
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-shareholder-fields
    - field_id: main_data_id
      name: main_data_id
      description: 复制来源记录 id
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-shareholder-copy
    evidence_refs: []
  - dataset_id: invite
    name: cust_invite_info
    description: 客户邀请信息记录。
    database: lowcode_pplatform
    fields:
    - field_id: name
      name: name
      description: 被邀请企业名称
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-invite-fields
    - field_id: progress
      name: progress
      description: 邀请/建档进度，回调同步企业 cust_build_status
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-invite-fields
      - ev-invite-progress-sync
    - field_id: db_tenant_code
      name: db_tenant_code
      description: 数据租户隔离键
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-invite-progress-sync
    evidence_refs: []
  - dataset_id: pushcust
    name: cust_project_pushcust
    description: 推送企业使用的默认项目和 SSO 渠道映射。
    database: lowcode_pplatform
    fields:
    - field_id: source_sso_channel
      name: source_sso_channel
      description: 起始系统 SSO 渠道
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-pushcust-fields
    - field_id: target_sso_channel
      name: target_sso_channel
      description: 跳转系统 SSO 渠道
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-pushcust-fields
    - field_id: project_id
      name: project_id
      description: 默认项目 id
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-pushcust-fields
      - ev-push-project-lookup
    evidence_refs: []
  - dataset_id: lifecycle
    name: cust_company_lifecycle_info
    description: 企业生命周期冻结/解冻记录。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-lifecycle-fields
    - field_id: company_id
      name: company_id
      description: 企业 id
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-lifecycle-fields
    - field_id: type
      name: type
      description: 生命周期操作类型
      data_type: varchar
      dictionary:
        FRZ: 冻结
        UNFRZ: 解冻
      evidence_refs:
      - ev-lifecycle-fields
      - ev-lifecycle-dict
    - field_id: enable
      name: enable
      description: 记录启用标识
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-lifecycle-fields
    evidence_refs: []
  - dataset_id: config_mapping
    name: cust_config_mapping
    description: 外部渠道与内部配置编码映射表；一行一条映射记录。
    database: lowcode_pplatform
    fields: []
    evidence_refs: []
  - dataset_id: customized_product
    name: cust_customized_product
    description: 客户快捷入口/定制产品配置。
    database: lowcode_pplatform
    fields:
    - field_id: enable
      name: enable
      description: 启用标识
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-customized-fields
    evidence_refs: []
  - dataset_id: head_company
    name: cust_head_company_info
    description: 客户总公司工商与法人信息。
    database: lowcode_pplatform
    fields:
    - field_id: certification_no
      name: certification_no
      description: 统一社会信用代码
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-head-company-fields
    - field_id: legal_name
      name: legal_name
      description: 法人姓名
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-head-company-fields
    - field_id: ref_cust_head_company_info_cust_company_info
      name: ref_cust_head_company_info_cust_company_info
      description: 关联企业主数据 code
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-head-company-fields
      - ev-head-company-flow
    - field_id: enable
      name: enable
      description: 启用标识
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-head-company-fields
    evidence_refs: []
  relationships: []
  metrics:
  - metric_id: shareholder-actual-fund
    name: 实际出资总额
    description: 按企业或关联方汇总 fund_amount_act；字段物理类型为 varchar，需确认可安全数值转换。
    aggregation: SUM
    field:
      dataset: shareholder
      field: fund_amount_act
      database: ''
    filters: []
    grain:
    - dataset: shareholder
      field: fund_amount_act
      database: ''
    evidence_refs:
    - ev-shareholder-fields
  - metric_id: frozen-company-record-count
    name: 冻结记录数
    description: 符合冻结口径的生命周期记录数。
    aggregation: COUNT
    field:
      dataset: lifecycle
      field: id
      database: ''
    filters: []
    grain:
    - dataset: lifecycle
      field: id
      database: ''
    evidence_refs:
    - ev-lifecycle-fields
  calibers:
  - caliber_id: active-lifecycle-freeze
    label: 当前冻结企业
    description: 存在 type=FRZ 且 enable=Y 的生命周期记录。
    contract_fragment:
      predicates:
      - field: lifecycle.type
        operator: eq
        values:
        - FRZ
      - field: lifecycle.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: lifecycle
      field: type
      database: ''
    - dataset: lifecycle
      field: enable
      database: ''
    evidence_refs:
    - ev-lifecycle-fields
  - caliber_id: enabled-customized-product
    label: 启用的企业快捷入口
    description: 定制产品记录 enable=Y。
    contract_fragment:
      predicates:
      - field: customized_product.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: customized_product
      field: enable
      database: ''
    evidence_refs:
    - ev-customized-fields
  domain_rules:
  - rule_id: lifecycle-type-only
    label: 冻结解冻必须看生命周期类型
    content: FRZ/UNFRZ 只表示生命周期操作，不等同于企业主表 enable 或建档状态。
    applicability: 冻结企业、解冻企业
    query_impact: 使用 lifecycle.type，并通常限定 lifecycle.enable='Y'；不能用企业 enable 替代。
    field_targets:
    - dataset: lifecycle
      field: type
      database: ''
    - dataset: lifecycle
      field: enable
      database: ''
    evidence_refs:
    - ev-lifecycle-fields
  - rule_id: invite-progress-is-denormalized
    label: 邀请进度是回写字段
    content: invite.progress 由企业 cust_build_status 同步而来，匹配条件是邀请 name 与数据租户。
    applicability: 邀请进度统计
    query_impact: 解释邀请进度时应使用 progress，避免把邀请记录当作企业主表记录。
    field_targets:
    - dataset: invite
      field: progress
      database: ''
    - dataset: invite
      field: name
      database: ''
    - dataset: invite
      field: db_tenant_code
      database: ''
    evidence_refs:
    - ev-invite-progress-sync
  verified_query_patterns:
  - pattern_id: count-frozen-lifecycle
    question: 当前冻结记录有多少
    query: SELECT COUNT(*) FROM cust_company_lifecycle_info WHERE type = 'FRZ' AND
      enable = 'Y'
    intended_specification:
      grain: lifecycle
      caliber_id: active-lifecycle-freeze
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-lifecycle-fields
evidence_refs:
- ev-shareholder-fields
- ev-invite-fields
- ev-pushcust-fields
- ev-lifecycle-fields
- ev-config-fields
- ev-customized-fields
- ev-head-company-fields
unit_links: []
assumptions:
- 目标库未连接执行查询，SQL 示例状态保持 PENDING_VALIDATION。
- 跨单元企业主表关联未写入本单元 relationships；代码显示 ref 字段按企业 code 关联。
conflicts: []
confidence: 0.86
