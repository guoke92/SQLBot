evidence:
- evidence_id: ev-build-status-dict
  source_id: src-build-status-enum
  evidence_kind: code_path
  locator: CustBuildStatusEnum
  claim: 建档状态两套语义：认证流 BUILD_SUCCESS=认证成功/BUILD_FAIL=认证失败，审核流 CUST_BUILD_SUCCESS=审核通过/CUST_BUILD_FAIL=审核拒绝。
  confidence: 1.0
- evidence_id: ev-cust-status-dict
  source_id: src-cust-status-enum
  evidence_kind: code_path
  locator: CustStatusEnum
  claim: 客户状态 EFFECT=生效、CHANGE=变更、另有 ADD/FAILURE/WRITEOFF/FREEZE。
  confidence: 1.0
- evidence_id: ev-user-type-dict
  source_id: src-user-type-enum
  evidence_kind: code_path
  locator: UserTypeEnum
  claim: user_type 物理值 accountAdmin=管理员、accountNormal=经办人、accountGuest=游客。
  confidence: 1.0
- evidence_id: ev-check-status-dict
  source_id: src-check-status
  evidence_kind: code_path
  locator: OperApiConstants.CheckStatus
  claim: 运营审核状态 CUST_CHECK_INIT=待审核/CUST_CHECK_CHECKING=审核中/CUST_CHECK_PASS=审核通过/CUST_CHECK_REJECT=审核不通过/CUST_CHECK_BACKTOCUSTOM=待客户确认。
  confidence: 1.0
- evidence_id: ev-company-fields
  source_id: src-company-do
  evidence_kind: database_schema
  locator: CustCompanyInfoDO
  claim: 表 cust_company_info；业务键 code；cust_build_status/cust_status/check_status/enable/data_type/identify_style/cust_first_submit_auth 均在此表。
  confidence: 1.0
- evidence_id: ev-self-reg-flow
  source_id: src-facade
  evidence_kind: code_path
  locator: OperCustFacade#regSelfOld
  claim: 自主注册建档读写链：读企业→按 ref_cust_company_info 读联系人→非管理员升级 accountAdmin→推送运营→置 check_status=CUST_CHECK_INIT→回写 platform_user_id→落 cust_build_record。
  confidence: 1.0
- evidence_id: ev-relate-project
  source_id: src-application
  evidence_kind: code_path
  locator: CustCompanyInfoApplication#relateProject
  claim: 同企业同角色不可重复绑同一项目；非金融机构要求企业租户=项目租户；写入/更新 cust_project_rel 后开通产品；project_id 为 String←Long CAST。
  confidence: 0.9
- evidence_id: ev-supplier-acflow
  source_id: src-facade
  evidence_kind: code_path
  locator: OperCustFacade#saveCustProjectRelDO
  claim: 企业角色 SUPPLIER 且产品为 ACFLOW 或 ORDER 时 cust_project_rel.status='1'，否则 '0'。
  confidence: 0.9
- evidence_id: ev-push-ops
  source_id: src-facade
  evidence_kind: code_path
  locator: OperCustFacade#reg
  claim: 向运营推送成功后 check_status 置为 CUST_CHECK_INIT，该动作不是认证成功。
  confidence: 1.0
- evidence_id: ev-build-record-person
  source_id: src-facade
  evidence_kind: code_path
  locator: OperCustFacade#saveCustBuildRecord
  claim: cust_build_record.person_id 写入经办联系人 id（形参 personId 来自 getCustPerson），对应 cust_person_info.id；cust_id 对应企业 id。
  confidence: 1.0
- evidence_id: ev-update-build-status
  source_id: src-callback
  evidence_kind: code_path
  locator: CustSyncEventProcessor#updateCustBuildStatus
  claim: 状态更新要求 enable='Y' 且 data_type=主数据 且旧状态匹配；PASS 写 BUILD_SUCCESS。
  confidence: 1.0
- evidence_id: ev-effect-cust
  source_id: src-callback
  evidence_kind: code_path
  locator: CustSyncEventProcessor#effectCust
  claim: 建档状态变为 BUILD_SUCCESS 后把 cust_status 更新为 EFFECT。
  confidence: 1.0
- evidence_id: ev-change-reject
  source_id: src-callback
  evidence_kind: code_path
  locator: CustSyncEventProcessor#applyOperationalChangeRejectSafely
  claim: 变更拒绝（process=CHANGE）保持 cust_build_status=BUILD_SUCCESS + cust_status=EFFECT + check_status=CUST_CHECK_PASS，不写 BUILD_FAIL。
  confidence: 0.9
- evidence_id: ev-state-map
  source_id: src-callback
  evidence_kind: code_path
  locator: CustSyncEventProcessor#getCustBuildStatus
  claim: BACKTOCUSTOM→CUST_CONFIRM_AWAIT；INIT/CHECKING→CUST_BUILDING；REJECT→BUILD_FAIL；PASS→BUILD_SUCCESS。
  confidence: 1.0
- evidence_id: ev-active-caliber
  source_id: src-mapper
  evidence_kind: query_usage
  locator: CustCompanyQueryMapper.xml#listEffectCompanyByCustType
  claim: 有效企业查询用 data_type='1' AND enable='Y'，并包含 (BUILD_SUCCESS+EFFECT) 或 (CUST_CHANGE+CHANGE)。
  confidence: 1.0
- evidence_id: ev-reset-status
  source_id: src-facade
  evidence_kind: code_path
  locator: OperCustFacade#resetStatus
  claim: 简易建档且不走变更流程时直接写 cust_status=EFFECT、cust_build_status=BUILD_SUCCESS；否则写 CHANGE+CUST_CHANGE。
  confidence: 1.0
- evidence_id: ev-first-submit-auth
  source_id: src-callback
  evidence_kind: code_path
  locator: CustSyncEventProcessor#updateCustFirstSubmitAuthTime
  claim: cust_first_submit_auth 仅在为空且 identify_style 为 SELF 或 INVITE 时写入当前时间。
  confidence: 1.0
