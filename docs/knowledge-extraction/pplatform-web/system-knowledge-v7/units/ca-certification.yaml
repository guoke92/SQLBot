unit_id: ca-certification
revision: 1
title: CA认证
aliases:
- CA证书认证
- 实名认证
- 四要素认证
domain: certification
applicability: CA 认证提交与结果查询（PENDING/SUCCESS/FAIL）；不用于 CA 服务费缴费或证书到期快照
description: ca_certification_info 记录企业/个人的 CA 认证提交与结果（四要素、实名、意愿认证），submit_status
  表达认证状态。
content:
  concepts:
  - concept_id: ca-certification
    name: CA认证
    aliases:
    - CA证书认证
    - 实名认证
    definition: 企业/个人向 CA 中台提交认证的完整过程，结果以 submit_status 表达。
    dictionary: {}
    field_targets:
    - dataset: ca_cert
      field: cust_id
      database: ''
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  - concept_id: cert-submitted
    name: 认证已提交
    aliases:
    - 认证中
    definition: 认证已提交、尚未收到中台终态结果。
    dictionary:
      PENDING: 待处理
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  - concept_id: cert-success
    name: 认证成功
    aliases:
    - CA认证通过
    definition: CA 认证结果成功。
    dictionary:
      SUCCESS: 成功
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  - concept_id: cert-fail
    name: 认证失败
    aliases:
    - CA认证未通过
    definition: CA 认证结果失败。
    dictionary:
      FAIL: 失败
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  processes:
  - stage_id: submit-ca
    name: 提交CA认证
    description: ''
    trigger: 企业/个人发起 CA 认证
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - callback
    data_effects:
    - operation: insert
      dataset: ca_cert
      fields:
      - cust_id
      - cust_type
      - submit_status
      - submit_time
      - op_type
      - batch_no
      condition: 初次提交 submit_status=PENDING
      description: ''
      evidence_refs:
      - ev-ca-cert-service
    evidence_refs:
    - ev-ca-cert-service
  - stage_id: callback
    name: 认证结果回调
    description: ''
    trigger: CA 中台回调认证结果
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: ca_cert
      fields:
      - submit_status
      - sign_platform_result
      condition: 按中台结果写 SUCCESS 或 FAIL
      description: ''
      evidence_refs:
      - ev-ca-cert-service
    evidence_refs:
    - ev-ca-cert-service
  datasets:
  - dataset_id: ca_cert
    name: ca_certification_info
    description: CA 认证信息记录，一行一次认证提交；submit_status 表达 PENDING/SUCCESS/FAIL。
    database: lowcode_pplatform
    fields:
    - field_id: cust_id
      name: cust_id
      description: 企业/个人ID
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: cust_type
      name: cust_type
      description: PERSON 或 COMPANY
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: submit_status
      name: submit_status
      description: 认证状态 PENDING/SUCCESS/FAIL
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: submit_time
      name: submit_time
      description: 提交时间
      data_type: datetime
      dictionary: {}
      evidence_refs: []
    - field_id: op_type
      name: op_type
      description: INSERT/UPDATE
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: batch_no
      name: batch_no
      description: 批次号
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: sign_platform_result
      name: sign_platform_result
      description: 中台返回结果
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-ca-cert-schema
  relationships: []
  metrics:
  - metric_id: ca-cert-count
    name: CA认证记录数
    description: CA 认证提交记录行数。
    aggregation: COUNT
    field:
      dataset: ca_cert
      field: cust_id
      database: ''
    filters: []
    grain:
    - dataset: ca_cert
      field: cust_id
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  calibers:
  - caliber_id: ca-cert-success
    label: CA认证成功企业/个人
    description: CA 认证结果为 SUCCESS 的记录。
    contract_fragment:
      predicates:
      - field: ca_cert.submit_status
        operator: eq
        values:
        - SUCCESS
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  - caliber_id: ca-cert-pending
    label: CA认证待处理
    description: CA 认证已提交、未收到终态结果。
    contract_fragment:
      predicates:
      - field: ca_cert.submit_status
        operator: eq
        values:
        - PENDING
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  domain_rules:
  - rule_id: ca-cert-status-valid
    label: CA认证状态取值
    content: ca_certification_info.submit_status 只允许 PENDING/SUCCESS/FAIL，结果以中台回调为准。
    applicability: CA 认证状态查询
    query_impact: 认证状态过滤按 submit_status 物理值
    field_targets:
    - dataset: ca_cert
      field: submit_status
      database: ''
    evidence_refs:
    - ev-ca-cert-schema
  verified_query_patterns:
  - pattern_id: count-ca-cert
    question: CA认证成功的企业有多少
    query: "SELECT COUNT(DISTINCT cust_id) AS ca_cert_count FROM ca_certification_info\
      \ WHERE submit_status = 'SUCCESS'\n  AND cust_type = 'COMPANY'\n"
    intended_specification:
      grain: ca_cert
      caliber_id: ca-cert-success
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ca-cert-schema
evidence_refs:
- ev-ca-cert-schema
unit_links: []
assumptions: []
conflicts: []
confidence: 0.8
