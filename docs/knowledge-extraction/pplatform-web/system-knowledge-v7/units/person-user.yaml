unit_id: person-user
revision: 1
title: 人员与用户
aliases:
- 联系人
- 管理员
- 企业账户
- 企业角色
domain: person
applicability: 联系人/管理员、企业账户、企业角色与用户-企业关系查询；不用于建档流程本身（见 enterprise-onboarding）
description: 企业联系人（管理员/经办人）、企业账户（收款/打款账户）、企业角色与用户-企业关系，按企业 code 关联主数据。
content:
  concepts:
  - concept_id: person
    name: 联系人
    aliases:
    - 人员
    - 经办人
    definition: cust_person_info 中的一条联系人记录，user_type 区分管理员/经办人/游客。
    dictionary: {}
    field_targets:
    - dataset: person
      field: id
      database: ''
    - dataset: person
      field: user_type
      database: ''
    evidence_refs:
    - ev-person-schema
  - concept_id: admin-person
    name: 管理员
    aliases:
    - 企业管理员
    definition: user_type=accountAdmin 且启用、生效的联系人。
    dictionary:
      accountAdmin: 管理员
      accountNormal: 经办人
      accountGuest: 游客
    field_targets:
    - dataset: person
      field: user_type
      database: ''
    evidence_refs:
    - ev-user-type-dict
  - concept_id: account
    name: 企业账户
    aliases:
    - 收款账户
    - 打款账户
    definition: cust_account_info 中的一条企业银行账户记录，account_no 为账号。
    dictionary: {}
    field_targets:
    - dataset: account
      field: id
      database: ''
    - dataset: account
      field: account_no
      database: ''
    evidence_refs:
    - ev-account-schema
  - concept_id: role
    name: 企业角色
    aliases:
    - 客户角色
    definition: cust_role_info 中的一条企业角色记录，role_type 为客户角色。
    dictionary: {}
    field_targets:
    - dataset: role
      field: id
      database: ''
    - dataset: role
      field: role_type
      database: ''
    evidence_refs:
    - ev-role-schema
  processes:
  - stage_id: person-query
    name: 查询人员
    description: ''
    trigger: 按企业 code 查联系人/管理员
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: person
      fields:
      - id
      - ref_cust_company_info
      - user_type
      - status
      - enable
      condition: 有效管理员 = user_type=accountAdmin AND enable=Y
      description: ''
      evidence_refs:
      - ev-person-schema
    evidence_refs:
    - ev-person-schema
  - stage_id: account-query
    name: 查询账户
    description: ''
    trigger: 按企业 code 查银行账户
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: account
      fields:
      - account_no
      - account_type
      - status
      - enable
      condition: 有效账户 = account_no 非空 AND enable=Y
      description: ''
      evidence_refs:
      - ev-account-schema
    evidence_refs:
    - ev-account-schema
  - stage_id: role-query
    name: 查询角色
    description: ''
    trigger: 按企业 code 查企业角色
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: role
      fields:
      - ref_cust_company_info
      - role_type
      - status
      - enable
      condition: 有效角色 = enable=Y
      description: ''
      evidence_refs:
      - ev-role-schema
    evidence_refs:
    - ev-role-schema
  datasets:
  - dataset_id: person
    name: cust_person_info
    description: 企业联系人/管理员，通过 ref_cust_company_info 存企业 code。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      evidence_refs: []
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 企业 code 引用
      data_type: varchar
      evidence_refs: []
    - field_id: user_type
      name: user_type
      description: 账号类型 accountAdmin/accountNormal/accountGuest
      data_type: varchar
      evidence_refs: []
    - field_id: status
      name: status
      description: 联系人状态 ADD/EFFECT/WRITEOFF
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效行标记
      data_type: varchar
      evidence_refs: []
    evidence_refs:
    - ev-person-schema
  - dataset_id: account
    name: cust_account_info
    description: 企业银行账户，account_no 为账号，account_type 区分账户类型。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: account_no
      name: account_no
      description: 账户账号
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: account_type
      name: account_type
      description: 账户类型
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: status
      name: status
      description: 账户状态
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效行标记
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-account-schema
  - dataset_id: role
    name: cust_role_info
    description: 企业角色，ref_cust_company_info 为企业 code，role_type 为客户角色。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      description: 企业 code 引用
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: role_type
      name: role_type
      description: 客户角色（CORE/FINANCE/SUPPLIER 等）
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: status
      name: status
      description: 角色状态 ADD/EFFECT/WRITEOFF/FREEZE
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 有效行标记
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-role-schema
  - dataset_id: user_rel
    name: cust_user_rel
    description: 用户-企业关系，user_id 连人员，company_id 连企业。
    database: lowcode_pplatform
    fields:
    - field_id: user_id
      name: user_id
      description: 用户id，连人员
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-user-rel-schema
  relationships:
  - relationship_id: user-rel-of-person
    left:
      dataset: user_rel
      field: user_id
      database: ''
    right:
      dataset: person
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 用户-企业关系按用户id关联人员
    status: proposed
    evidence_refs:
    - ev-user-rel-schema
    confidence: 0.5
  metrics:
  - metric_id: person-count
    name: 联系人数量
    description: 企业联系人记录数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: person
      field: id
      database: ''
    filters: []
    grain:
    - dataset: person
      field: id
      database: ''
    evidence_refs:
    - ev-person-schema
  - metric_id: account-count
    name: 账户数量
    description: 企业银行账户记录数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: account
      field: id
      database: ''
    filters: []
    grain:
    - dataset: account
      field: id
      database: ''
    evidence_refs:
    - ev-account-schema
  calibers:
  - caliber_id: active-person
    label: 有效联系人
    description: 联系人 status=EFFECT 且 enable=Y。
    contract_fragment:
      predicates:
      - field: person.status
        operator: eq
        values:
        - EFFECT
      - field: person.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: person
      field: status
      database: ''
    - dataset: person
      field: enable
      database: ''
    evidence_refs:
    - ev-person-schema
  - caliber_id: active-account
    label: 有效账户
    description: 账户 account_no 非空且 enable=Y。
    contract_fragment:
      predicates:
      - field: account.account_no
        operator: isNotNull
      - field: account.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: account
      field: account_no
      database: ''
    - dataset: account
      field: enable
      database: ''
    evidence_refs:
    - ev-account-schema
  domain_rules:
  - rule_id: person-status-valid
    label: 联系人状态取值
    content: cust_person_info.status 物理值 ADD/EFFECT/WRITEOFF，管理员判定用 user_type=accountAdmin。
    applicability: 联系人/管理员查询
    query_impact: 联系人状态过滤按物理值
    field_targets:
    - dataset: person
      field: status
      database: ''
    - dataset: person
      field: user_type
      database: ''
    evidence_refs:
    - ev-person-schema
  verified_query_patterns:
  - pattern_id: list-admin-persons
    question: 某企业的管理员有哪些
    query: "SELECT id, name, user_type FROM cust_person_info WHERE ref_cust_company_info\
      \ = '<企业code>'\n  AND user_type = 'accountAdmin'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: person
      caliber_id: active-person
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-person-schema
evidence_refs:
- ev-person-schema
- ev-account-schema
unit_links: []
assumptions: []
conflicts: []
confidence: 0.8
