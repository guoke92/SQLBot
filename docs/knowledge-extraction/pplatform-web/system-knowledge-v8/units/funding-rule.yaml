unit_id: funding-rule
revision: 1
title: 资金规则
aliases:
- 资方规则
- 资金方规则
- 资产要素规则
domain: 资金规则
applicability: 资金规则版本、规则明细、前台配置、资金方规则查询及异常解析；不用于项目状态或企业状态统计
description: 按产品和资金方维护规则版本、分层明细与前台配置，业务 Provider 只消费生效规则；异常解析提供对接失败建议。
content:
  concepts:
  - concept_id: rule-status
    name: 规则状态
    aliases:
    - 生效中
    - 待生效
    - 已失效
    definition: funding_rule_info.rule_status 的规则生命周期状态，ACTIVE/PENDING/INACTIVE 分别表示生效、待生效、失效；业务 Provider 只查 ACTIVE。
    dictionary:
      ACTIVE: 生效
      PENDING: 待生效
      INACTIVE: 失效
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    evidence_refs:
    - ev-rule-status-enum
  - concept_id: rule-layer
    name: 规则层
    aliases:
    - 底层规则
    - 融资规则
    - 其他规则
    definition: 规则明细按业务层分组；UNDERLYING、FINANCING、OTHER 分别为底层、融资、其他规则，Provider 按 ruleLayer 分组组装。
    dictionary:
      UNDERLYING: 底层规则
      FINANCING: 融资规则
      OTHER: 其他规则
    field_targets:
    - dataset: funding_rule_detail
      field: rule_layer
      database: ''
    - dataset: funding_rule_front
      field: rule_layer
      database: ''
    evidence_refs:
    - ev-layer-enum
  - concept_id: funding-rule-info
    name: 资金规则版本
    aliases:
    - 资方规则版本
    - 规则配置
    definition: 一条 funding_rule_info 记录代表某产品与资金方标识组合的一份规则版本，明细通过 rule_info_id 归属它；前台配置按产品组织字段。
    dictionary: {}
    field_targets:
    - dataset: funding_rule
      field: id
      database: ''
    - dataset: funding_rule
      field: product_code
      database: ''
    - dataset: funding_rule
      field: funding_party_mark
      database: ''
    evidence_refs:
    - ev-info-fields
  - concept_id: funding-exception
    name: 资金方异常解析
    aliases:
    - 异常建议
    - 对接异常
    definition: funding_exception_resolution 一行记录一个异常关键字及其原因、建议，按产品和资金方标识检索。
    dictionary: {}
    field_targets:
    - dataset: funding_exception
      field: id
      database: ''
    - dataset: funding_exception
      field: exception_no
      database: ''
    evidence_refs:
    - ev-exception-fields
  processes:
  - stage_id: configure-rule
    name: 配置规则
    description: ''
    trigger: 管理端 saveOrUpdateRuleInfo 保存或更新产品与资金方规则（含明细与前台配置）
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - publish-rule
    data_effects:
    - operation: upsert
      dataset: funding_rule
      fields:
      - product_code
      - funding_party_mark
      - funding_party_name
      - rule_status
      - version
      - enable
      condition: 新增默认 PENDING/version=1；更新版本号加一
      description: ''
      evidence_refs: []
    - operation: upsert
      dataset: funding_rule_detail
      fields:
      - rule_info_id
      - rule_key
      - rule_value
      - rule_layer
      - version
      - product_code
      - funding_party_mark
      - enable
      condition: ruleMap key 必须匹配前台配置 front_key，否则跳过
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-controller-save
  - stage_id: publish-rule
    name: 生效失效
    description: ''
    trigger: 管理端 active 或 inActive
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - consume-active-rule
    data_effects:
    - operation: update
      dataset: funding_rule
      fields:
      - id
      - rule_status
      condition: active 置 ACTIVE；inActive 置 INACTIVE
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-controller-status
  - stage_id: consume-active-rule
    name: 业务查询生效规则
    description: ''
    trigger: 资金方规则 Provider 按 fundingPartyMark + productCode 查询
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: funding_rule
      fields:
      - funding_party_mark
      - product_code
      - rule_status
      - id
      - version
      condition: eq fundingPartyMark + productCode + ruleStatus=ACTIVE
      description: ''
      evidence_refs: []
    - operation: read
      dataset: funding_rule_front
      fields:
      - product_code
      - front_key
      - key_name
      - key_type
      - rule_key
      - enable
      condition: 按 productCode 查询前台配置，构建 frontKey → DO Map
      description: ''
      evidence_refs: []
    - operation: read
      dataset: funding_rule_detail
      fields:
      - rule_info_id
      - rule_key
      - rule_value
      - rule_layer
      - enable
      condition: 按 ruleInfoId 查询明细，按 ruleLayer 分组；ruleKey==frontKey 组装
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-provider-query
  - stage_id: resolve-exception
    name: 解析异常
    description: ''
    trigger: 按异常编号、报错关键字、产品或资金方查询异常建议
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: funding_exception
      fields:
      - exception_no
      - funding_party_code
      - funding_party_name
      - error_keyword
      - error_reason
      - suggestion
      - product_code
      - enable
      condition: enable=Y 的启用记录
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-exception-controller
  datasets:
  - dataset_id: funding_rule
    name: funding_rule_info
    description: 资金方规则版本主表。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_mark
      name: funding_party_mark
      description: 资金方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_name
      name: funding_party_name
      description: 资金方名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_status
      name: rule_status
      description: 规则状态 ACTIVE/PENDING/INACTIVE
      data_type: varchar
      dictionary:
        ACTIVE: 生效
        PENDING: 待生效
        INACTIVE: 失效
      evidence_refs: []
    - field_id: version
      name: version
      description: 规则版本号
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-info-fields
  - dataset_id: funding_rule_detail
    name: funding_rule_detail
    description: 规则版本的键值明细，一行一个规则字段值。
    database: lowcode_pplatform
    fields:
    - field_id: rule_info_id
      name: rule_info_id
      description: 关联 funding_rule_info.id
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: rule_key
      name: rule_key
      description: 前台字段 key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_value
      name: rule_value
      description: 规则值
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_layer
      name: rule_layer
      description: 规则层 UNDERLYING/FINANCING/OTHER
      data_type: varchar
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
      evidence_refs: []
    - field_id: version
      name: version
      description: 明细对应版本
      data_type: int
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_mark
      name: funding_party_mark
      description: 资金方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-detail-fields
  - dataset_id: funding_rule_front
    name: funding_rule_front_cfg
    description: 按产品定义规则前台字段、展示样式和规则层。
    database: lowcode_pplatform
    fields:
    - field_id: rule_layer
      name: rule_layer
      description: 规则层
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: front_key
      name: front_key
      description: 前端字段 key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: key_name
      name: key_name
      description: 字段名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: key_type
      name: key_type
      description: 字段业务规则类型
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: rule_key
      name: rule_key
      description: 规则字段 key
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-front-fields
  - dataset_id: funding_exception
    name: funding_exception_resolution
    description: 资金方异常解析及建议，一行一个异常记录。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: exception_no
      name: exception_no
      description: 异常编号
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_code
      name: funding_party_code
      description: 对接方标识
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: funding_party_name
      name: funding_party_name
      description: 资金方名称
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: error_keyword
      name: error_keyword
      description: 报错关键字
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: error_reason
      name: error_reason
      description: 报错原因
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: suggestion
      name: suggestion
      description: 建议处理方案
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: product_code
      name: product_code
      description: 产品编码
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记 Y/N
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-exception-fields
  - dataset_id: funding_party_rule_cfg
    name: funding_party_rule_cfg
    description: 资金方规则配置主表（休眠表：无入口调用链，仅登记不参与问数）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-cfg-schema
  - dataset_id: funding_party_rule_detail
    name: funding_party_rule_detail
    description: 资金方规则配置明细（休眠表：无入口调用链，仅登记不参与问数）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-detail-schema
  - dataset_id: funding_party_rule_front
    name: funding_party_rule_front
    description: 资金方规则前台配置（休眠表：无入口调用链，仅登记不参与问数）。
    database: lowcode_pplatform
    inactive: true
    fields: []
    evidence_refs:
    - ev-party-front-schema
  relationships:
  - relationship_id: detail-to-rule-info
    left:
      dataset: funding_rule_detail
      field: rule_info_id
      database: ''
    right:
      dataset: funding_rule
      field: id
      database: ''
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 规则明细归属规则版本头。
    status: proposed
    evidence_refs:
    - ev-provider-query
    confidence: 0.5
  metrics:
  - metric_id: active-rule-count
    name: 生效资金规则数
    description: 按资金方和产品统计生效规则版本数，规则版本主表按 id 计数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: funding_rule
      field: id
      database: ''
    filters: []
    grain:
    - dataset: funding_rule
      field: funding_party_mark
      database: ''
    - dataset: funding_rule
      field: product_code
      database: ''
    evidence_refs:
    - ev-provider-query
  - metric_id: exception-count
    name: 异常解析记录数
    description: 启用异常解析记录按异常记录主键计数。
    aggregation: COUNT
    field:
      dataset: funding_exception
      field: id
      database: ''
    filters: []
    grain:
    - dataset: funding_exception
      field: product_code
      database: ''
    - dataset: funding_exception
      field: funding_party_code
      database: ''
    evidence_refs:
    - ev-exception-fields
  calibers:
  - caliber_id: active-funding-rule
    label: 可供业务使用的生效资金规则
    description: 业务 Provider 仅查询 rule_status=ACTIVE 且明细、前台配置 enable=Y。
    contract_fragment:
      predicates:
      - field: funding_rule.rule_status
        operator: eq
        values:
        - ACTIVE
      - field: funding_rule_detail.enable
        operator: eq
        values:
        - Y
      - field: funding_rule_front.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    - dataset: funding_rule
      field: enable
      database: ''
    - dataset: funding_rule_detail
      field: enable
      database: ''
    - dataset: funding_rule_front
      field: enable
      database: ''
    evidence_refs:
    - ev-provider-query
  - caliber_id: enabled-exception
    label: 启用的异常建议
    description: 异常解析仅取 enable=Y 的记录。
    contract_fragment:
      predicates:
      - field: funding_exception.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: funding_exception
      field: enable
      database: ''
    evidence_refs:
    - ev-exception-controller
  domain_rules:
  - rule_id: active-only-consumption
    label: 业务只消费生效规则
    content: PENDING 和 INACTIVE 规则不会被资金方规则 Provider 返回。
    applicability: 业务系统校验或查询资金方规则
    query_impact: 必须过滤 funding_rule.rule_status='ACTIVE'；明细和前台配置过滤 enable='Y'
    field_targets:
    - dataset: funding_rule
      field: rule_status
      database: ''
    - dataset: funding_rule_detail
      field: enable
      database: ''
    - dataset: funding_rule_front
      field: enable
      database: ''
    evidence_refs:
    - ev-provider-query
  - rule_id: detail-key-matches-front-config
    label: 明细键须映射前台配置
    content: 保存时 ruleMap 的 key 与 funding_rule_front_cfg.front_key 匹配后才写入明细；Provider 以 ruleKey==frontKey 组装展示字段。
    applicability: 规则保存和业务规则查询
    query_impact: 连接或映射明细与前台配置使用 funding_rule_detail.rule_key=funding_rule_front_cfg.front_key
    field_targets:
    - dataset: funding_rule_detail
      field: rule_key
      database: ''
    - dataset: funding_rule_front
      field: front_key
      database: ''
    evidence_refs:
    - ev-provider-query
  verified_query_patterns:
  - pattern_id: count-active-funding-rules
    question: 生效中的资金规则有多少
    query: 'SELECT COUNT(DISTINCT id) AS active_rule_count

      FROM funding_rule_info

      WHERE rule_status = ''ACTIVE'' AND enable = ''Y'''
    intended_specification:
      grain: funding_rule
      caliber_id: active-funding-rule
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-provider-query
evidence_refs:
- ev-rule-status-enum
- ev-layer-enum
- ev-info-fields
- ev-detail-fields
- ev-front-fields
- ev-party-cfg-schema
- ev-party-detail-schema
- ev-party-front-schema
- ev-exception-fields
- ev-controller-save
- ev-controller-status
- ev-provider-query
- ev-exception-controller
unit_links: []
assumptions:
- 查询范例未在目标数据库执行。
- funding_party_rule_* 为休眠表（有 DO/Mapper/Service 但无入口调用链）：FundingPartyRuleProviderImpl(@DubboService) 只消费 funding_rule_*，funding_party_rule_* 的 Mapper 除自身 Service 外无任何 Java 引用；仅登记不参与问数。
conflicts: []
confidence: 0.92
