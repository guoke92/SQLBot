  - kind: example
    item_id: EXAMPLE-MONTHLY-ACTIVE-BUILT-COMPANY
    status: verified
    confidence: 0.99
    evidence_refs: [CODE-CUST-QUERY, DB-QUERY-VERIFY-20260814]
    question: 按企业主数据创建月份统计有效已建档企业数
    query: >-
      SELECT DATE_FORMAT(cci.create_time, '%Y-%m') AS month,
             COUNT(DISTINCT cci.id) AS company_count
      FROM cust_company_info cci
      WHERE cci.cust_build_status = 'BUILD_SUCCESS'
        AND cci.cust_status = 'EFFECT'
        AND cci.data_type = '1'
        AND cci.enable = 'Y'
      GROUP BY DATE_FORMAT(cci.create_time, '%Y-%m')
      ORDER BY month
      LIMIT 1000
    intended_specification:
      subject: 企业
      measure: 有效已建档企业数
      time_basis: 企业主数据创建时间
      grain: month
    verification:
      executed: true
      passed: true
      checked_at: '2026-08-14'
      row_count: 44
      notes: 在 lowcode_pplatform 只读执行通过

  - kind: example
    item_id: EXAMPLE-COMPANY-COUNT-BY-PROJECT
    status: verified
    confidence: 0.98
    evidence_refs: [CODE-CUST-QUERY, DB-QUERY-VERIFY-20260814]
    question: 按租户项目统计当前有效已建档企业数量
    query: >-
      SELECT tp.id AS project_id,
             tp.name AS project_name,
             COUNT(DISTINCT cci.id) AS company_count
      FROM tenant_project tp
      JOIN cust_project_rel cpr ON cpr.project_id = tp.id AND cpr.enable = 'Y'
      JOIN cust_company_info cci ON cci.code = cpr.ref_cust_company_info
       AND cci.cust_build_status = 'BUILD_SUCCESS'
       AND cci.cust_status = 'EFFECT'
       AND cci.data_type = '1'
       AND cci.enable = 'Y'
      WHERE tp.enable = 'Y'
      GROUP BY tp.id, tp.name
      ORDER BY company_count DESC, tp.id
      LIMIT 1000
    intended_specification:
      subject: 企业
      measure: 有效已建档企业数
      grouping: 租户项目
    verification:
      executed: true
      passed: true
      checked_at: '2026-08-14'
      row_count: 92
      notes: 在 lowcode_pplatform 只读执行通过

  - kind: example
    item_id: EXAMPLE-FINANCING-PARTY-BY-PROJECT
    status: verified
    confidence: 0.98
    evidence_refs: [CODE-COMPANY-TYPE, CODE-CUST-QUERY, DB-QUERY-VERIFY-20260814]
    question: 查询每个租户项目当前启用的资金方企业
    query: >-
      SELECT tp.id AS project_id,
             tp.name AS project_name,
             cci.id AS company_id,
             cci.name AS company_name
      FROM cust_project_rel cpr
      JOIN tenant_project tp ON tp.id = cpr.project_id
      JOIN cust_company_info cci ON cci.code = cpr.ref_cust_company_info
      WHERE cpr.company_type = 'FINANCE'
        AND cpr.enable = 'Y'
      ORDER BY tp.id, cci.name
      LIMIT 1000
    intended_specification:
      subject: 企业项目关系
      role: 资金方
      output: [租户项目, 企业]
    verification:
      executed: true
      passed: true
      checked_at: '2026-08-14'
      row_count: 159
