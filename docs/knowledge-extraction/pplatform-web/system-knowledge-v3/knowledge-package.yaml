    item_id: RULE-SYNC-ERROR-GRAIN
    status: verified
    confidence: 0.98
    label: 同步失败记录按调用粒度统计
    content: client_api_sync_error 的计数表示失败调用记录数，retry_num 表示重试次数；除非存在可验证业务键去重，否则不得解释为失败企业数、失败项目数或失败协议数。
