  - kind: example
    item_id: EXAMPLE-SYNC-ERROR-MONTHLY
    status: verified
    confidence: 0.97
    evidence_refs: [DB-PROFILE-20260814, DB-QUERY-VERIFY-20260814]
    question: 按失败记录创建月份统计同步失败调用次数和累计重试次数
    query: >-
      SELECT DATE_FORMAT(create_time, '%Y-%m') AS month,
             COUNT(*) AS failed_call_count,
             SUM(COALESCE(retry_num, 0)) AS retry_count
      FROM client_api_sync_error
      GROUP BY DATE_FORMAT(create_time, '%Y-%m')
      ORDER BY month
      LIMIT 1000
    intended_specification:
      subject: 同步失败记录
      measures: [失败调用次数, 累计重试次数]
      time_basis: 失败记录创建时间
