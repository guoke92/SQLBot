unit_id: openapi-access
revision: 1
title: OpenAPI 接入
aliases:
- OpenAPI 渠道接入
- 接入密钥
- 同步失败重试
domain: openapi
applicability: OpenAPI 渠道合法性、渠道租户解析、客户端接口同步失败重试；不用于查询密钥原文或把 enable=N 失败记录当作待重试
description: OpenAPI 请求按启用渠道密钥解析租户，客户端同步异常写入失败记录并由启用状态与重试次数驱动重试。
content:
  concepts:
  - concept_id: enabled-channel-secret
    name: 有效渠道接入密钥
    aliases:
    - OpenAPI 密钥
    - 启用渠道
    definition: cust_access_secret 中 channel 匹配请求且 enable=Y 的渠道配置；密钥原文不作为问数口径。
    dictionary:
      Y: 启用
      N: 停用
    field_targets:
    - dataset: access_secret
      field: channel
      database: ''
    - dataset: access_secret
      field: enable
      database: ''
    evidence_refs:
    - ev-channel-resolver
    - ev-secret-do
  - concept_id: sync-failure-record
    name: 客户端接口同步失败记录
    aliases:
    - 同步失败
    - 同步异常
    definition: 客户端同步调用失败后保存的 service class、参数、重试次数与启用状态记录。
    dictionary: {}
    field_targets:
    - dataset: sync_error
      field: service_class_name
      database: ''
    - dataset: sync_error
      field: retry_num
      database: ''
    - dataset: sync_error
      field: enable
      database: ''
    evidence_refs:
    - ev-sync-error-write
    - ev-sync-error-do
  processes:
  - stage_id: resolve-channel
    name: 解析 OpenAPI 渠道
    description: ''
    trigger: OpenAPI 请求携带 channel
    enter_conditions:
    - channel 非空
    exit_conditions:
    - 匹配到 channel 且 enable=Y 的 cust_access_secret
    next_stages:
    - validate-tenant
    data_effects:
    - operation: read
      dataset: access_secret
      fields:
      - channel
      - enable
      - db_tenant_code
      condition: channel=请求 channel 且 enable=Y
      description: ''
      evidence_refs:
      - ev-channel-resolver
      - ev-access-application
    evidence_refs:
    - ev-channel-resolver
  - stage_id: validate-tenant
    name: 校验渠道租户
    description: ''
    trigger: 渠道密钥解析成功
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - submit-openapi-request
    data_effects:
    - operation: read
      dataset: tenant_setting
      fields:
      - db_tenant_code
      - enable
      condition: db_tenant_code=密钥中的 db_tenant_code 且 enable=Y
      description: ''
      evidence_refs:
      - ev-access-application
    evidence_refs:
    - ev-access-application
  - stage_id: submit-openapi-request
    name: 执行客户 OpenAPI 接入
    description: ''
    trigger: 渠道与租户校验通过
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - retry-sync
    data_effects:
    - operation: upsert
      dataset: sync_error
      fields:
      - service_class_name
      - param
      - create_time
      - enable
      - retry_num
      condition: 客户端同步 RPC 失败时 enable=Y、retry_num=1
      description: ''
      evidence_refs:
      - ev-sync-error-write
    evidence_refs:
    - ev-cust-access-controller
    - ev-sync-error-write
  - stage_id: retry-sync
    name: 重试客户端同步
    description: ''
    trigger: 定时/启动重试任务扫描失败记录
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: read
      dataset: sync_error
      fields:
      - id
      - enable
      - create_time
      - service_class_name
      - param
      - retry_num
      condition: enable=Y 且 create_time 不晚于当前时间加 intervalSecond，按 id 升序
      description: ''
      evidence_refs:
      - ev-startup-retry
    - operation: delete
      dataset: sync_error
      fields:
      - id
      condition: 重试调用成功
      description: ''
      evidence_refs:
      - ev-startup-retry
    - operation: update
      dataset: sync_error
      fields:
      - retry_num
      condition: 重试异常且 retry_num < retries，retry_num 加 1
      description: ''
      evidence_refs:
      - ev-startup-retry
    - operation: update
      dataset: sync_error
      fields:
      - enable
      condition: 重试异常且 retry_num >= retries，enable 置为 Y（代码注释称删除，但实际为 update）
      description: ''
      evidence_refs:
      - ev-startup-retry
    evidence_refs:
    - ev-startup-retry
  datasets:
  - dataset_id: access_secret
    name: cust_access_secret
    description: 客户 OpenAPI 渠道接入配置；包含受保护的密钥字段，问数仅使用渠道、启用状态及租户映射。
    database: lowcode_pplatform
    fields:
    - field_id: channel
      name: channel
      description: 请求渠道标识
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-secret-do
      - ev-channel-resolver
    - field_id: db_tenant_code
      name: db_tenant_code
      description: 渠道映射的数据租户标识
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-secret-do
      - ev-access-application
    - field_id: enable
      name: enable
      description: 启用状态
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-secret-do
      - ev-channel-resolver
    evidence_refs:
    - ev-secret-do
  - dataset_id: sync_error
    name: client_api_sync_error
    description: 客户端接口同步失败记录；只有 enable=Y 且满足时间条件的记录进入重试扫描。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-sync-error-do
    - field_id: service_class_name
      name: service_class_name
      description: 失败同步服务类名
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-sync-error-do
      - ev-sync-error-write
    - field_id: param
      name: param
      description: 重试所需序列化参数
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-sync-error-do
      - ev-sync-error-write
    - field_id: retry_num
      name: retry_num
      description: 已尝试重试次数，失败时递增
      data_type: int
      dictionary: {}
      evidence_refs:
      - ev-sync-error-do
      - ev-sync-error-write
      - ev-startup-retry
    - field_id: enable
      name: enable
      description: 是否进入重试队列，Y 才扫描
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-sync-error-do
      - ev-startup-retry
    - field_id: create_time
      name: create_time
      description: 失败记录创建时间，用于重试时间筛选
      data_type: datetime
      dictionary: {}
      evidence_refs:
      - ev-sync-error-do
      - ev-sync-error-write
      - ev-startup-retry
    evidence_refs:
    - ev-sync-error-do
  - dataset_id: tenant_setting
    name: tenant_setting_config
    description: 租户基础及运营配置，一行一个配置记录。
    database: lowcode_pplatform
    fields:
    - field_id: db_tenant_code
      name: db_tenant_code
      description: 数据租户标识
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-access-application
    - field_id: enable
      name: enable
      description: 行可用标识；Y=启用，N=停用
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-access-application
    evidence_refs:
    - ev-access-application
  relationships: []
  metrics:
  - metric_id: enabled-channel-count
    name: 有效渠道数
    description: enable=Y 的渠道配置数量，若按渠道实体统计应按 channel 去重。
    aggregation: COUNT_DISTINCT
    field:
      dataset: access_secret
      field: channel
      database: ''
    filters: []
    grain:
    - dataset: access_secret
      field: channel
      database: ''
    evidence_refs:
    - ev-channel-resolver
  - metric_id: retryable-sync-error-count
    name: 待重试同步失败数
    description: 按重试扫描条件统计的失败记录数，不等同于全部历史失败记录数。
    aggregation: COUNT
    field:
      dataset: sync_error
      field: id
      database: ''
    filters: []
    grain:
    - dataset: sync_error
      field: id
      database: ''
    evidence_refs:
    - ev-startup-retry
  calibers:
  - caliber_id: enabled-channel-secret
    label: 有效 OpenAPI 渠道
    description: 渠道配置存在且 enable=Y；请求 channel 必须命中该配置。
    contract_fragment:
      predicates:
      - field: access_secret.enable
        operator: eq
        values:
        - Y
      - field: access_secret.channel
        operator: eq
        values:
        - <请求channel>
    field_targets:
    - dataset: access_secret
      field: channel
      database: ''
    - dataset: access_secret
      field: enable
      database: ''
    evidence_refs:
    - ev-channel-resolver
    - ev-access-application
  - caliber_id: retryable-sync-error
    label: 待重试同步失败
    description: 失败记录 enable=Y 且 create_time 满足扫描时间条件；retry_num 用于失败次数上限判断。
    contract_fragment:
      predicates:
      - field: sync_error.enable
        operator: eq
        values:
        - Y
      - field: sync_error.create_time
        operator: lte
        values:
        - <now+intervalSecond>
    field_targets:
    - dataset: sync_error
      field: enable
      database: ''
    - dataset: sync_error
      field: create_time
      database: ''
    - dataset: sync_error
      field: retry_num
      database: ''
    evidence_refs:
    - ev-startup-retry
  domain_rules:
  - rule_id: disabled-channel-rejected
    label: 未启用渠道不可接入
    content: 请求 channel 为空或没有 channel+enable=Y 配置时返回未知渠道错误。
    applicability: OpenAPI 渠道合法性校验
    query_impact: 有效渠道必须过滤 enable='Y'，不能把停用配置计入。
    field_targets:
    - dataset: access_secret
      field: channel
      database: ''
    - dataset: access_secret
      field: enable
      database: ''
    evidence_refs:
    - ev-channel-resolver
  - rule_id: retry-queue-enable-filter
    label: 重试队列按 enable 筛选
    content: 重试扫描只取 enable=Y；处理时若记录已变为 N 则跳过。
    applicability: 同步失败重试
    query_impact: 待重试统计必须过滤 enable='Y'，历史失败不代表当前待重试。
    field_targets:
    - dataset: sync_error
      field: enable
      database: ''
    evidence_refs:
    - ev-startup-retry
  - rule_id: retry-count-increment
    label: 重试失败次数递增
    content: 同步失败记录初始 retry_num=1；重试异常且未达 retries 时 retry_num 加一，达到上限后停止后续处理。
    applicability: 客户端同步异常恢复
    query_impact: retry_num 是重试次数口径，不是失败记录总数。
    field_targets:
    - dataset: sync_error
      field: retry_num
      database: ''
    - dataset: sync_error
      field: enable
      database: ''
    evidence_refs:
    - ev-sync-error-write
    - ev-startup-retry
  verified_query_patterns:
  - pattern_id: count-enabled-channels
    question: 当前有多少个有效 OpenAPI 渠道
    query: 'SELECT COUNT(DISTINCT channel) AS enabled_channel_count

      FROM cust_access_secret

      WHERE enable = ''Y'''
    intended_specification:
      grain: channel
      caliber_id: enabled-channel-secret
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-channel-resolver
  - pattern_id: count-retryable-errors
    question: 当前有多少条待重试的客户端同步失败
    query: 'SELECT COUNT(*) AS retryable_sync_error_count

      FROM client_api_sync_error

      WHERE enable = ''Y'''
    intended_specification:
      grain: sync_error
      caliber_id: retryable-sync-error
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-startup-retry
evidence_refs:
- ev-cust-access-controller
- ev-channel-resolver
- ev-access-application
- ev-secret-do
- ev-sync-error-do
- ev-sync-error-write
- ev-startup-retry
unit_links: []
assumptions:
- 密钥原文（pub_key、pri_key、password）不进入知识单元字段声明或查询示例。
- 查询示例未在目标数据库逐条执行，verification 保持 PENDING_VALIDATION。
- 重试达到上限的代码将 enable 设置为 Y，未推断其为停用；应以源码实际赋值为准。
conflicts: []
confidence: 0.92
