unit_id: op-user-coverage
revision: 1
title: 运营人员覆盖
aliases:
- 运营人员
- 运营对接人
- 离职置顶
- top_flag
domain: operation
applicability: 查询在职/离职运营人员、项目及项目企业运营覆盖、运营组别和离职置顶提示；不把 top_flag 当风险分数，也不在 operation_user
  上查询 top_flag
description: 运营中台人员以 operation_id 覆盖项目和企业关系记录，离职集合驱动置顶标记清理与报表提示。
content:
  concepts:
  - concept_id: operation-user
    name: 运营人员
    aliases:
    - 运营对接人
    - 风控对接人
    definition: 运营中台同步到本地的人员主数据；项目/企业关系字段使用 operation_id 作为业务键，不使用 operation_user.id。
    dictionary: {}
    field_targets:
    - dataset: operation_user
      field: id
      database: ''
    - dataset: operation_user
      field: operation_id
      database: ''
    evidence_refs:
    - ev-user-catalog
    - ev-sync-upsert
  - concept_id: active-operation-user
    name: 在职运营人员
    aliases:
    - 有效运营人员
    definition: operation_user.deleted='N' 且 enable='Y' 的人员；同步任务会把接口未返回且当前启用未删除记录标记
      deleted='Y'。
    dictionary:
      N: 未删除/在职
      Y: 已删除/离职
    field_targets:
    - dataset: operation_user
      field: deleted
      database: ''
    - dataset: operation_user
      field: enable
      database: ''
    evidence_refs:
    - ev-sync-active
    - ev-mark-deleted
  - concept_id: deleted-operation-user
    name: 离职运营人员
    aliases:
    - 已删除运营人员
    definition: TopFlag 检查使用 deleted='Y' 且 enable='Y' 的 operation_id 集合；字段名 deleted
      是系统删除/离职标记。
    dictionary:
      Y: 已删除/离职
      N: 未删除
    field_targets:
    - dataset: operation_user
      field: operation_id
      database: ''
    - dataset: operation_user
      field: deleted
      database: ''
    - dataset: operation_user
      field: enable
      database: ''
    evidence_refs:
    - ev-deleted-set
  - concept_id: top-flag
    name: 离职置顶
    aliases:
    - topFlag
    - 置顶项目
    definition: 项目或项目企业关系上的置顶标记；值为 '1' 时检查关联运营字段，确认项目及其企业均无离职人员后才清为 '0'。
    dictionary:
      '1': 置顶
      '0': 未置顶
    field_targets:
    - dataset: wec_project_operation_rel
      field: top_flag
      database: ''
    - dataset: wec_project_cust_operation_rel
      field: top_flag
      database: ''
    evidence_refs:
    - ev-top-check
    - ev-report-top
  processes:
  - stage_id: sync-operation-users
    name: 同步运营人员
    description: ''
    trigger: 定时任务从运营中台获取 operationUser 与 riskUser 列表
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - sync-groups
    - check-top-flag
    data_effects:
    - operation: read
      dataset: operation_user
      fields:
      - operation_id
      - operation_name
      - operation_group
      - enable
      - deleted
      condition: ''
      description: ''
      evidence_refs: []
    - operation: insert
      dataset: operation_user
      fields:
      - operation_id
      - operation_name
      - operation_group
      - deleted
      condition: 新 operation_id 写入且 deleted='N'
      description: ''
      evidence_refs: []
    - operation: update
      dataset: operation_user
      fields:
      - operation_id
      - operation_name
      - operation_group
      - deleted
      condition: 已存在按 operation_id 更新并恢复 deleted='N'
      description: ''
      evidence_refs: []
    - operation: update
      dataset: operation_user
      fields:
      - operation_id
      - deleted
      condition: 数据库启用且未删除、但接口未返回的 operation_id 标记 deleted='Y'
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-sync-upsert
    - ev-mark-deleted
  - stage_id: sync-groups
    name: 同步冗余运营组别
    description: ''
    trigger: 同步发现 operation_group 变化
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: wec_project_operation_rel
      fields:
      - op_contact_a_group
      - verification_contact_group
      - risk_control_contact_a_group
      condition: 对接人A字段等于变更 operation_id
      description: ''
      evidence_refs: []
    - operation: update
      dataset: wec_project_cust_operation_rel
      fields:
      - op_contact_a_group
      - verification_contact_group
      - risk_control_contact_a_group
      condition: 对接人A字段等于变更 operation_id
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-group-sync
  - stage_id: update-operation-rel
    name: 更新项目运营覆盖
    description: ''
    trigger: WecProjectOperationController 更新项目或项目企业运营关系
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - check-top-flag
    data_effects:
    - operation: update
      dataset: wec_project_operation_rel
      fields:
      - op_contact_a
      - op_contact_b
      - verification_contact
      - risk_control_contact_a
      - risk_control_contact_b
      - op_contact_a_group
      - verification_contact_group
      - risk_control_contact_a_group
      - top_flag
      condition: 按 wec_project_id 定位记录并仅更新请求中非空字段
      description: ''
      evidence_refs: []
    - operation: update
      dataset: wec_project_cust_operation_rel
      fields:
      - op_contact_a
      - op_contact_b
      - verification_contact
      - risk_control_contact_a
      - risk_control_contact_b
      - op_contact_a_group
      - verification_contact_group
      - risk_control_contact_a_group
      - top_flag
      condition: 按 wec_rel_id 或 project_id 定位，可叠加 company_id/company_type
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-controller-project
    - ev-controller-company
  - stage_id: check-top-flag
    name: 检查离职置顶
    description: ''
    trigger: 项目/项目企业关系保存，或运营人员同步完成
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: wec_project_operation_rel
      fields:
      - top_flag
      - text
      condition: 原 top_flag='1' 且项目自身及其企业关系均无离职人员时 top_flag='0' 并清空 text
      description: ''
      evidence_refs: []
    - operation: update
      dataset: wec_project_cust_operation_rel
      fields:
      - top_flag
      condition: 作为项目企业关系参与离职人员检查
      description: ''
      evidence_refs: []
    evidence_refs:
    - ev-top-check
    - ev-task-top
  datasets:
  - dataset_id: operation_user
    name: operation_user
    description: 运营中台人员镜像；operation_id 是与业务关系字段匹配的业务键。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: operation_id
      name: operation_id
      description: 运营中台人员业务键
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: operation_name
      name: operation_name
      description: 运营人员姓名
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: operation_group
      name: operation_group
      description: 运营组别
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: deleted
      name: deleted
      description: 删除/离职标记；Y=已删除/离职，N=未删除
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: enable
      name: enable
      description: 启用标记；Y=启用，N=停用
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-user-catalog
  - dataset_id: wec_project_operation_rel
    name: wec_project_operation_rel
    description: 微企链项目级运营关系；运营字段保存 operation_id，top_flag 在此表而不在 operation_user。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs: []
    - field_id: op_contact_a
      name: op_contact_a
      description: 运营对接人A的 operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: op_contact_b
      name: op_contact_b
      description: 运营对接人B，可能为 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: op_contact_a_group
      name: op_contact_a_group
      description: 运营组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: verification_contact
      name: verification_contact
      description: 查验对接人 operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: verification_contact_group
      name: verification_contact_group
      description: 查验组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_a
      name: risk_control_contact_a
      description: 风控对接人A operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_b
      name: risk_control_contact_b
      description: 风控对接人B，可能为 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_a_group
      name: risk_control_contact_a_group
      description: 风控组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: top_flag
      name: top_flag
      description: 置顶标记；1=置顶，0=未置顶
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: text
      name: text
      description: 离职运营人员提示文本
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-project-catalog
  - dataset_id: wec_project_cust_operation_rel
    name: wec_project_cust_operation_rel
    description: 微企链项目企业级运营关系；按项目及企业关系承载运营覆盖与 top_flag。
    database: lowcode_pplatform
    fields:
    - field_id: op_contact_a
      name: op_contact_a
      description: 运营对接人A的 operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: op_contact_b
      name: op_contact_b
      description: 运营对接人B，可能为 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: op_contact_a_group
      name: op_contact_a_group
      description: 运营组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: verification_contact
      name: verification_contact
      description: 查验对接人 operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: verification_contact_group
      name: verification_contact_group
      description: 查验组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_a
      name: risk_control_contact_a
      description: 风控对接人A operation_id
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_b
      name: risk_control_contact_b
      description: 风控对接人B，可能为 JSON 数组
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: risk_control_contact_a_group
      name: risk_control_contact_a_group
      description: 风控组别冗余字段
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    - field_id: top_flag
      name: top_flag
      description: 置顶标记；1=置顶，0=未置顶
      data_type: varchar
      dictionary: {}
      evidence_refs: []
    evidence_refs:
    - ev-company-catalog
  relationships:
  - relationship_id: operation-project-contact
    left:
      dataset: operation_user
      field: operation_id
      database: ''
    right:
      dataset: wec_project_operation_rel
      field: op_contact_a
      database: ''
    relationship_type: SHARED_KEY
    cardinality: 1:n
    business_meaning: 项目运营对接人A按 operation_id 覆盖运营人员
    status: proposed
    evidence_refs:
    - ev-project-contact
    confidence: 0.5
  - relationship_id: operation-company-contact
    left:
      dataset: operation_user
      field: operation_id
      database: ''
    right:
      dataset: wec_project_cust_operation_rel
      field: op_contact_a
      database: ''
    relationship_type: SHARED_KEY
    cardinality: 1:n
    business_meaning: 项目企业运营对接人A按 operation_id 覆盖运营人员
    status: proposed
    evidence_refs:
    - ev-company-contact
    confidence: 0.5
  metrics:
  - metric_id: active-operation-user-count
    name: 在职运营人员数
    description: 满足在职口径的运营人员数量；按 operation_user.id 去重计数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: operation_user
      field: id
      database: ''
    filters: []
    grain:
    - dataset: operation_user
      field: id
      database: ''
    evidence_refs:
    - ev-sync-active
  - metric_id: project-operation-coverage-count
    name: 项目运营覆盖记录数
    description: 微企链项目运营关系中按关系记录统计的覆盖记录数，不等同于去重人员数。
    aggregation: COUNT
    field:
      dataset: wec_project_operation_rel
      field: id
      database: ''
    filters: []
    grain:
    - dataset: wec_project_operation_rel
      field: id
      database: ''
    evidence_refs:
    - ev-project-catalog
  calibers:
  - caliber_id: active-operation-user
    label: 在职运营人员
    description: operation_user.deleted='N' AND operation_user.enable='Y'。
    contract_fragment:
      predicates:
      - field: operation_user.deleted
        operator: eq
        values:
        - N
      - field: operation_user.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: operation_user
      field: deleted
      database: ''
    - dataset: operation_user
      field: enable
      database: ''
    evidence_refs:
    - ev-sync-active
  - caliber_id: deleted-operation-user
    label: 离职运营人员集合
    description: TopFlag 判定集合为 deleted='Y' AND enable='Y'。
    contract_fragment:
      predicates:
      - field: operation_user.deleted
        operator: eq
        values:
        - Y
      - field: operation_user.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: operation_user
      field: deleted
      database: ''
    - dataset: operation_user
      field: enable
      database: ''
    evidence_refs:
    - ev-deleted-set
  - caliber_id: top-flag-project
    label: 置顶微企链项目
    description: 项目关系 top_flag='1'；是否存在离职运营人员需进一步检查其项目及企业覆盖字段。
    contract_fragment:
      predicates:
      - field: wec_project_operation_rel.top_flag
        operator: eq
        values:
        - '1'
    field_targets:
    - dataset: wec_project_operation_rel
      field: top_flag
      database: ''
    evidence_refs:
    - ev-project-report-top
  domain_rules:
  - rule_id: operation-id-is-business-key
    label: 运营关联必须使用 operation_id
    content: 业务关系的对接人字段与 operation_user.operation_id 比较，不用 operation_user.id；A 字段可等值匹配，B
      字段可能是 JSON 数组。
    applicability: 运营覆盖关联、离职检查、运营组别同步
    query_impact: JOIN/过滤应以 operation_id 对应 op_contact_a、verification_contact、risk_control_contact_a；B
      字段需按 JSON 成员处理。
    field_targets:
    - dataset: operation_user
      field: operation_id
      database: ''
    - dataset: wec_project_operation_rel
      field: op_contact_a
      database: ''
    - dataset: wec_project_cust_operation_rel
      field: op_contact_a
      database: ''
    evidence_refs:
    - ev-project-contact
    - ev-top-check
  - rule_id: top-flag-clear-only-when-no-deleted
    label: 无离职人员才清除置顶
    content: 只有项目自身和其项目企业关系都不含离职运营人员时，原 top_flag='1' 才更新为 '0'；同时清理项目 text 提示。
    applicability: 微企链项目/项目企业置顶检查
    query_impact: 统计置顶项目不能仅看 top_flag；需按离职集合检查项目及企业覆盖字段。
    field_targets:
    - dataset: wec_project_operation_rel
      field: top_flag
      database: ''
    - dataset: wec_project_operation_rel
      field: text
      database: ''
    - dataset: wec_project_cust_operation_rel
      field: top_flag
      database: ''
    evidence_refs:
    - ev-top-check
    - ev-task-top
  - rule_id: report-top-flag-warning
    label: 置顶记录展示离职提示
    content: 项目报表仅对 top_flag='1' 的记录检查 A/B、查验和风控对接人；发现离职人员时生成“已离职，请修改”提示文本。
    applicability: 项目报表/项目企业信息展示
    query_impact: top_flag 非 1 不应生成该离职提示；B 字段按 JSON 数组或单值兼容解析。
    field_targets:
    - dataset: wec_project_operation_rel
      field: top_flag
      database: ''
    - dataset: wec_project_cust_operation_rel
      field: top_flag
      database: ''
    - dataset: operation_user
      field: deleted
      database: ''
    evidence_refs:
    - ev-report-top
  verified_query_patterns:
  - pattern_id: count-active-operation-users
    question: 在职运营人员有多少
    query: 'SELECT COUNT(DISTINCT id) AS active_operation_user_count

      FROM operation_user

      WHERE deleted = ''N'' AND enable = ''Y'''
    intended_specification:
      grain: operation_user
      caliber_id: active-operation-user
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-sync-active
  - pattern_id: list-top-project-operations
    question: 微企链有哪些置顶项目运营关系
    query: 'SELECT id, wec_project_id, op_contact_a, top_flag

      FROM wec_project_operation_rel

      WHERE top_flag = ''1'''
    intended_specification:
      grain: wec_project_operation_rel
      caliber_id: top-flag-project
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-project-report-top
evidence_refs:
- ev-user-catalog
- ev-sync-upsert
- ev-top-check
- ev-project-report-top
unit_links: []
assumptions:
- 查询范例未在目标数据库逐条执行；B 类对接人字段可能为 JSON 数组，等值 JOIN 仅适用于单值字段。
conflicts: []
confidence: 0.93
