unit_id: project-approval
revision: 1
title: 租户项目上线审批
aliases:
- 项目审批
- 上线审批
- 审批流程
domain: project
applicability: 项目上线审批单、流程节点、审批附件、授信额度及微信立项申请变更；不用于直接统计租户项目数
description: 租户项目上线前通过审批主单驱动流程实例、节点操作与附件/授信记录，微信立项申请及字段历史提供前置申请信息。
content:
  concepts:
  - concept_id: approval-order
    name: 项目上线审批单
    aliases:
    - 审批单
    - 上线申请
    definition: tenant_project_approval 一行表示一张项目上线审批单，wf_status 表示工作流状态。
    dictionary:
      PENDING: 待发起
      RUNNING: 审批中
      FINISHED: 审批通过
      TERMINATED: 审批拒绝
    field_targets:
    - dataset: approval
      field: wf_status
      database: ''
    evidence_refs:
    - ev-approval-do
    - ev-wf-status
  - concept_id: project-type
    name: 审批项目类型
    aliases:
    - 标准项目
    - 常规项目
    definition: 审批单按 project_type 区分标准与常规项目。
    dictionary:
      STANDARD: 标准项目
      REGULAR: 常规项目
    field_targets:
    - dataset: approval
      field: project_type
      database: ''
    evidence_refs:
    - ev-approval-do
    - ev-project-type
  - concept_id: flow-template
    name: 审批流程模板
    aliases:
    - 流程配置
    definition: flow_config 以 flow_code 标识审批流程模板，审批单通过引用列关联模板。
    dictionary:
      NO_ONLINE: 无需上线审批
      STANDARD: 标准流程
      REGULAR: 常规流程
    field_targets:
    - dataset: approval_flow_config
      field: flow_code
      database: ''
    evidence_refs:
    - ev-flow-config
    - ev-flow-code
  - concept_id: approval-node
    name: 审批流程节点
    aliases:
    - 审批节点
    - 流转节点
    definition: flow 表记录流程实例节点顺序、状态和审批人，flow_node 记录实际操作。
    dictionary:
      PENDING: 待审批
      APPROVING: 审批中
      APPROVED: 已通过
      REJECTED: 已拒绝
    field_targets:
    - dataset: approval_flow
      field: node_status
      database: ''
    - dataset: approval_flow_node
      field: operate_type
      database: ''
    evidence_refs:
    - ev-flow
    - ev-flow-node
  processes:
  - stage_id: create-approval
    name: 创建审批单
    description: ''
    trigger: 项目上线申请提交
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - instantiate-flow
    data_effects:
    - operation: insert
      dataset: approval
      fields:
      - id
      - approval_no
      - project_type
      - flow_code
      - wf_status
      - code
      - ref_tenant_project_approval_tenant_project
      condition: ''
      description: ''
      evidence_refs:
      - ev-approval-app
    - operation: insert
      dataset: approval_business
      fields:
      - product_code
      - source_system
      - payer
      - ref_tenant_project_approval_business_info_project_approval
      condition: ''
      description: ''
      evidence_refs:
      - ev-approval-app
    evidence_refs:
    - ev-approval-app
  - stage_id: instantiate-flow
    name: 生成流程实例
    description: ''
    trigger: 审批单提交后按流程模板生成节点
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - operate-node
    data_effects:
    - operation: insert
      dataset: approval_flow
      fields:
      - node_code
      - node_order
      - node_status
      - approver_user_id
      - ref_tenant_project_approval_flow_tenant_project_approval
      - code
      condition: ''
      description: ''
      evidence_refs:
      - ev-approval-app
    - operation: update
      dataset: approval
      fields:
      - wf_status
      condition: 工作流启动后进入 RUNNING
      description: ''
      evidence_refs:
      - ev-workflow-adapter
    evidence_refs:
    - ev-workflow-adapter
  - stage_id: operate-node
    name: 节点审批操作
    description: ''
    trigger: 审批人通过、拒绝、退回或转审
    enter_conditions: []
    exit_conditions: []
    next_stages:
    - complete-approval
    data_effects:
    - operation: insert
      dataset: approval_flow_node
      fields:
      - approval_type
      - node_code
      - operate_type
      - approve_comment
      - operator_user_id
      - operate_time
      - ref_tenant_project_approval_flow_node_project_approval
      - ref_tenant_project_approval_flow_node_project_approval_flow
      - code
      condition: ''
      description: ''
      evidence_refs:
      - ev-desk-app
    - operation: upsert
      dataset: approval_flow_credit
      fields:
      - credited_cust_name
      - credit_limit
      - ref_tenant_project_approval_flow_credit_project_approval
      - ref_tenant_project_approval_flow_credit_project_approval_node
      condition: ''
      description: ''
      evidence_refs:
      - ev-desk-app
    - operation: upsert
      dataset: approval_flow_file
      fields:
      - catg_id
      - file_id
      - file_name
      - ref_tenant_project_approval_flow_file_project_approval_flow_node
      condition: ''
      description: ''
      evidence_refs:
      - ev-desk-app
    evidence_refs:
    - ev-desk-app
  - stage_id: complete-approval
    name: 完成审批
    description: ''
    trigger: 工作流终态回调
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: update
      dataset: approval
      fields:
      - wf_status
      - complete_time
      - wf_last_operator
      - wf_last_operate_time
      condition: FINISHED 表示通过，TERMINATED 表示拒绝
      description: ''
      evidence_refs:
      - ev-workflow-status
    evidence_refs:
    - ev-workflow-status
  - stage_id: wechat-application
    name: 微信立项申请与变更留痕
    description: ''
    trigger: 微信项目立项申请或字段更新
    enter_conditions: []
    exit_conditions: []
    next_stages: []
    data_effects:
    - operation: insert
      dataset: wechat_approval_apply
      fields:
      - sp_no
      - sp_type
      - project_id
      - project_type
      - project_phase
      - project_manager
      - solution_manager
      - business_center
      - capital_org_full_name
      - enable
      condition: ''
      description: ''
      evidence_refs:
      - ev-wechat-apply
    - operation: insert
      dataset: wechat_approval_field_history
      fields:
      - apply_id
      - sp_no
      - field_name
      - field_label
      - old_value
      - new_value
      - change_source
      - operator_id
      - operator_name
      - enable
      condition: ''
      description: ''
      evidence_refs:
      - ev-wechat-history
    evidence_refs:
    - ev-wechat-apply
    - ev-wechat-history
  datasets:
  - dataset_id: approval
    name: tenant_project_approval
    description: 项目上线审批主表；一行一张审批单。
    database: lowcode_pplatform
    fields:
    - field_id: id
      name: id
      description: 表主键
      data_type: bigint
      dictionary: {}
      evidence_refs:
      - ev-approval-do
    - field_id: approval_no
      name: approval_no
      description: 审批编号
      data_type: varchar
      dictionary: {}
      evidence_refs:
      - ev-approval-do
    - field_id: project_type
      name: project_type
      description: 项目类型
      data_type: varchar
      dictionary:
        STANDARD: 标准
        REGULAR: 常规
      evidence_refs:
      - ev-approval-do
      - ev-project-type
    - field_id: flow_code
      name: flow_code
      description: 流程配置编码
      data_type: varchar
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准
        REGULAR: 常规
      evidence_refs:
      - ev-approval-do
      - ev-flow-code
    - field_id: wf_status
      name: wf_status
      description: 工作流状态
      data_type: varchar
