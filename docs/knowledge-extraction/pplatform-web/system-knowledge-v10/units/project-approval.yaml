  metrics:
  - metric_id: approval-count
    name: 审批单数量
    description: 按审批单粒度计数，按状态分布时以 wf_status 分组。
    aggregation: COUNT
    field:
      dataset: approval
      field: id
      database: ''
    filters: []
    grain:
    - dataset: approval
      field: wf_status
      database: ''
    evidence_refs:
    - ev-wf-status
  - metric_id: credit-limit-sum
    name: 审批授信额度合计
    description: 对授信记录 credit_limit 求和，按授信企业或审批单聚合。
    aggregation: SUM
    field:
      dataset: approval_flow_credit
      field: credit_limit
      database: ''
    filters: []
    grain:
    - dataset: approval_flow_credit
      field: credited_cust_name
      database: ''
    evidence_refs:
    - ev-credit
  calibers:
  - caliber_id: running-approval
    label: 审批中的审批单
    description: 工作流状态为 RUNNING 的审批主表记录。
    contract_fragment:
      predicates:
      - field: approval.wf_status
        operator: eq
        values:
        - RUNNING
    field_targets:
    - dataset: approval
      field: wf_status
      database: ''
    evidence_refs:
    - ev-wf-status
  - caliber_id: latest-approval
    label: 最新审批单
    description: 仅统计 is_latest 标记的最新版本，字段由主表维护。
    contract_fragment:
      predicates:
      - field: approval.is_latest
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: approval
      field: is_latest
      database: ''
    evidence_refs:
    - ev-approval-do
  domain_rules:
  - rule_id: workflow-status-scope
    label: 工作流状态口径
    content: PENDING/RUNNING/FINISHED/TERMINATED 只表示 tenant_project_approval.wf_status，不代表
      tenant_project.project_status。
    applicability: 查询审批中、通过或拒绝的项目上线审批单
    query_impact: 必须在审批主表的 wf_status 上过滤，并可配合 enable=Y；不要将状态写入项目表。
    field_targets:
    - dataset: approval
      field: wf_status
      database: ''
    evidence_refs:
    - ev-wf-status
  - rule_id: approval-count-grain
    label: 审批数量去重粒度
    content: 审批单数量以 tenant_project_approval.id 计数；流程节点、附件、授信是明细表，连接后计数需避免一对多放大。
    applicability: 统计审批单数量或状态分布
    query_impact: COUNT 使用 approval.id，连接明细表时使用 COUNT(DISTINCT approval.id) 或先聚合明细。
    field_targets:
    - dataset: approval
      field: id
      database: ''
    - dataset: approval_flow
      field: id
      database: ''
    evidence_refs:
    - ev-wf-status
    - ev-flow
  verified_query_patterns:
  - pattern_id: count-running-approvals
    question: 审批中的项目上线审批单有多少
    query: SELECT COUNT(1) AS running_approval_count FROM tenant_project_approval
      WHERE wf_status = 'RUNNING' AND enable = 'Y'
    intended_specification:
      grain: approval
      caliber_id: running-approval
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-wf-status
