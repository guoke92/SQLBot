unit_id: ca-fee
revision: 1
title: CA 服务费
aliases:
- CA 费
- 证书服务费
domain: ca_fee
applicability: 未缴/已缴 CA 费企业与订单；不用于交e保外部余额
description: 企业台账 ca_fee_company.pay_status 为 PAID/UNPAID；订单 order_status 为 PENDING/PAID/CLOSED/EXPIRED。
content:
  concepts:
  - concept_id: ca-fee-company
    name: CA 费企业台账
    aliases:
    - CA 缴费
    definition: 按企业维度的缴费与证书快照。
    dictionary:
      PAID: 已缴费
      UNPAID: 未缴费
    evidence_refs:
    - ev-ca-fee-company-fields
    - ev-profile-ca-fee
  processes:
  - stage_id: query-ca-fee
    name: 查询 CA 费
    trigger: /cust-web/caFee
    enter_conditions:
    - 企业或订单条件
    exit_conditions:
    - 读取台账或订单
    data_effects:
    - operation: read
      dataset: ca_fee_company
      fields:
      - pay_status
      - ca_status
      - enable
      evidence_refs:
      - ev-ca-fee-endpoint
    evidence_refs:
    - ev-ca-fee-endpoint
  datasets:
  - dataset_id: ca_fee_company
    name: ca_fee_company
    database: lowcode_pplatform
    description: CA 费企业台账。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-company-fields
    - field_id: certification_no
      name: certification_no
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-company-fields
    - field_id: company_name
      name: company_name
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-company-fields
    - field_id: pay_status
      name: pay_status
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-company-fields
      - ev-profile-ca-fee
      dictionary:
        PAID: 已缴费
        UNPAID: 未缴费
    - field_id: ca_status
      name: ca_status
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-company-fields
      dictionary:
        NORMAL: 有效
        EXPIRED: 已过期
        CANCELLED: 已注销
        UNREGISTERED: 未注册
        UNKNOWN: 未知
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-company-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-company-fields
    - field_id: source_project_id
      name: source_project_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-company-fields
    evidence_refs:
    - ev-ca-fee-company-fields
  - dataset_id: ca_fee_order
    name: ca_fee_order
    database: lowcode_pplatform
    description: CA 费订单。脏值 PAIDING/UNPAID 不纳入正式口径。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-order-fields
    - field_id: order_no
      name: order_no
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-order-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-order-fields
    - field_id: project_id
      name: project_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-order-fields
    - field_id: order_status
      name: order_status
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-order-fields
      - ev-profile-ca-fee
      dictionary:
        PENDING: 待支付
        PAID: 已支付
        CLOSED: 已关闭
        EXPIRED: 已过期
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-order-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-ca-fee-order-fields
  - dataset_id: ca_fee_project_config
    name: ca_fee_project_config
    database: lowcode_pplatform
    description: 项目级 CA 费配置，charge_enabled 是否收费。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: project_id
      name: project_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: tenant_id
      name: tenant_id
      data_type: bigint
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: charge_enabled
      name: charge_enabled
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-project-config-fields
      dictionary:
        Y: 收费
        N: 不收费
    - field_id: supplier_annual_fee
      name: supplier_annual_fee
      data_type: decimal
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: core_annual_fee
      name: core_annual_fee
      data_type: decimal
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: pay_channel
      name: pay_channel
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: agreement_version
      name: agreement_version
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-project-config-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-ca-fee-project-config-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-ca-fee-project-config-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 租户项目。最小声明：仅声明 id 用于 CA 费项目配置关联。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  relationships:
  - relationship_id: ca-order-company
    left:
      dataset: ca_fee_order
      field: company_id
    right:
      dataset: ca_fee_company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 订单指向台账企业；company_id 与企业主数据 id 的对齐待绑定后确认
    status: proposed
    evidence_refs:
    - ev-ca-fee-order-fields
    confidence: 0.4
  - relationship_id: ca-fee-company-source-project-order
    left:
      dataset: ca_fee_company
      field: source_project_id
    right:
      dataset: ca_fee_order
      field: project_id
    relationship_type: SHARED_KEY
    cardinality: n:n
    business_meaning: 台账的来源项目 source_project_id 与订单的触发项目 project_id 是同一项目 id（业务一致），属共享项目维度。串联时各自按项目 id JOIN 到 tenant_project，不得直接 JOIN 彼此（n:n 会笛卡尔积）。
    status: proposed
    evidence_refs:
    - ev-ca-fee-company-fields
    - ev-ca-fee-order-fields
  - relationship_id: ca-fee-project-config-project
    left:
      dataset: ca_fee_project_config
      field: project_id
    right:
      dataset: tenant_project
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: CA 费项目配置的 project_id 指向租户项目
    status: proposed
    evidence_refs:
    - ev-ca-fee-project-config-fields
    - ev-tenant-project-fields
  metrics:
  - metric_id: unpaid-ca-fee-company-count
    name: 未缴 CA 费企业数
    description: 未缴纳 CA 费的企业台账数，按租户统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: ca_fee_company
      field: id
    grain:
    - dataset: ca_fee_company
      field: tenant_id
    evidence_refs:
    - ev-profile-ca-fee
    - ev-ca-fee-company-fields
  - metric_id: ca-fee-order-count-by-status
    name: CA 费订单状态分布
    description: 按订单状态统计 CA 费订单数。
    aggregation: COUNT
    field:
      dataset: ca_fee_order
      field: id
    grain:
    - dataset: ca_fee_order
      field: order_status
    evidence_refs:
    - ev-ca-fee-order-fields
    - ev-profile-ca-fee
  calibers:
  - caliber_id: unpaid-ca-fee-company
    label: 未缴 CA 费企业
    description: pay_status=UNPAID 且 enable=Y。
    contract_fragment:
      predicates:
      - field: ca_fee_company.pay_status
        operator: eq
        values:
        - UNPAID
      - field: ca_fee_company.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: ca_fee_company
      field: pay_status
    - dataset: ca_fee_company
      field: enable
    evidence_refs:
    - ev-ca-fee-company-fields
    - ev-profile-ca-fee
  domain_rules:
  - rule_id: ignore-dirty-ca-order-status
    label: 忽略订单脏状态
    content: order_status 存在 PAIDING/UNPAID，问数只认 PENDING/PAID/CLOSED/EXPIRED。
    applicability: 已支付订单、待支付订单
    query_impact: 不要把 PAIDING 当成 PAID
    field_targets:
    - dataset: ca_fee_order
      field: order_status
    evidence_refs:
    - ev-profile-ca-fee
    - ev-ca-fee-order-fields
  verified_query_patterns:
  - pattern_id: count-unpaid-ca-fee-companies
    question: 未缴 CA 费的企业有多少
    query: "SELECT COUNT(1) AS unpaid_ca_fee_company_count\nFROM ca_fee_company\n\
      WHERE pay_status = 'UNPAID'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: ca_fee_company
      caliber_id: unpaid-ca-fee-company
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ca-fee-company-fields
    - ev-profile-ca-fee
evidence_refs:
- ev-ca-fee-endpoint
- ev-ca-fee-company-fields
- ev-ca-fee-order-fields
- ev-profile-ca-fee
- ev-ca-fee-project-config-fields
- ev-tenant-project-fields
assumptions:
- ca_fee_order.company_id 与 cust_company_info.id 的对应关系保持 proposed。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.86
