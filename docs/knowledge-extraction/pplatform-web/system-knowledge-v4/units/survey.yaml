unit_id: survey
revision: 1
title: 企业回访
aliases:
- 回访
- 问卷
- 白名单
domain: survey
applicability: 企业回访白名单、首次回访状态与问卷答案；不用于企业建档与认证
description: 回访白名单在 cust_company_survey_whitelist，首次回访状态在 cust_company_survey_state，问卷答案在 cust_survey_answer，三者均以 company_id 关联企业。
content:
  concepts:
  - concept_id: survey-whitelist
    name: 回访白名单
    definition: 允许进行回访的企业名单，company_id/company_name 标识企业。
    evidence_refs:
    - ev-survey-whitelist-fields
  - concept_id: survey-state
    name: 首次回访状态
    definition: 企业首次回访人、时间与抽奖展示标记。
    evidence_refs:
    - ev-survey-state-fields
  - concept_id: survey-answer
    name: 问卷答案
    definition: 回访问卷逐题答案，survey_code 区分问卷。
    evidence_refs:
    - ev-survey-answer-fields
  datasets:
  - dataset_id: whitelist
    name: cust_company_survey_whitelist
    database: lowcode_pplatform
    description: 回访白名单企业。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-survey-whitelist-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-survey-whitelist-fields
    - field_id: company_name
      name: company_name
      data_type: varchar
      evidence_refs:
      - ev-survey-whitelist-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-survey-whitelist-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-survey-whitelist-fields
  - dataset_id: state
    name: cust_company_survey_state
    database: lowcode_pplatform
    description: 企业首次回访状态。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-survey-state-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-survey-state-fields
    - field_id: respondent
      name: respondent
      data_type: varchar
      evidence_refs:
      - ev-survey-state-fields
    - field_id: first_visitor_user_id
      name: first_visitor_user_id
      data_type: bigint
      evidence_refs:
      - ev-survey-state-fields
    - field_id: first_visit_time
      name: first_visit_time
      data_type: datetime
      evidence_refs:
      - ev-survey-state-fields
    - field_id: first_visitor_lottery_shown
      name: first_visitor_lottery_shown
      data_type: varchar
      evidence_refs:
      - ev-survey-state-fields
      dictionary:
        Y: 已展示
        N: 未展示
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-survey-state-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-survey-state-fields
  - dataset_id: answer
    name: cust_survey_answer
    database: lowcode_pplatform
    description: 回访问卷答案。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: survey_code
      name: survey_code
      data_type: varchar
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: user_id
      name: user_id
      data_type: bigint
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: question_no
      name: question_no
      data_type: int
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: answer_value
      name: answer_value
      data_type: varchar
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: other_text
      name: other_text
      data_type: varchar
      evidence_refs:
      - ev-survey-answer-fields
    - field_id: submit_time
      name: submit_time
      data_type: datetime
      evidence_refs:
      - ev-survey-answer-fields
    evidence_refs:
    - ev-survey-answer-fields
  relationships:
  - relationship_id: answer-state
    left:
      dataset: answer
      field: company_id
    right:
      dataset: state
      field: company_id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 答案按企业关联首次回访状态。
    status: proposed
    evidence_refs:
    - ev-survey-answer-fields
    - ev-survey-state-fields
  metrics:
  - metric_id: surveyed-company-count
    name: 已回访企业数
    description: 存在首次回访状态的企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: state
      field: company_id
    evidence_refs:
    - ev-survey-state-fields
  - metric_id: survey-answer-count-by-code
    name: 问卷答题量
    description: 按问卷编码统计答案数。
    aggregation: COUNT
    field:
      dataset: answer
      field: id
    grain:
    - dataset: answer
      field: survey_code
    evidence_refs:
    - ev-survey-answer-fields
  calibers:
  - caliber_id: surveyed-company
    label: 已回访企业
    description: 存在首次回访状态记录且 enable=Y 的企业。
    contract_fragment:
      predicates:
      - field: state.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: state
      field: enable
    evidence_refs:
    - ev-survey-state-fields
  domain_rules:
  - rule_id: survey-answer-not-whitelist
    label: 答案不等于白名单
    content: 白名单是允许回访范围，答案才是实际回访结果；统计已回访必须看 state/answer 而非 whitelist。
    applicability: 已回访企业
    query_impact: 已回访统计不能 FROM cust_company_survey_whitelist 代替。
    field_targets:
    - dataset: state
      field: company_id
    - dataset: whitelist
      field: company_id
    evidence_refs:
    - ev-survey-state-fields
    - ev-survey-whitelist-fields
  verified_query_patterns:
  - pattern_id: count-surveyed-companies
    question: 已回访的企业有多少
    query: "SELECT COUNT(DISTINCT company_id) AS surveyed_company_count\nFROM cust_company_survey_state\nWHERE enable = 'Y'\n"
    intended_specification:
      grain: state
      caliber_id: surveyed-company
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-survey-state-fields
evidence_refs:
- ev-survey-whitelist-fields
- ev-survey-state-fields
- ev-survey-answer-fields
assumptions:
- 白名单/状态/答案均以 company_id 关联企业，字段类型待连库确认。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.78
