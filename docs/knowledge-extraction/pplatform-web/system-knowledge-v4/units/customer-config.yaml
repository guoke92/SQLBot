unit_id: customer-config
revision: 1
title: 客户与渠道配置
aliases:
- 渠道映射
- 客户配置
- 协议配置
domain: config
applicability: 外部渠道到内部编码映射，以及企业级协议/验证/邀请码配置；不用于租户品牌配置
description: 外部渠道映射在 cust_config_mapping，企业级配置在 cust_setting_config（一行一个企业）。
content:
  concepts:
  - concept_id: config-mapping
    name: 渠道配置映射
    aliases:
    - 外部渠道映射
    definition: 外部渠道编码到内部编码/名称的映射，type/groups 分组。
    evidence_refs:
    - ev-config-mapping-fields
  - concept_id: cust-setting
    name: 企业级配置
    aliases:
    - 客户配置
    definition: 企业维度协议、验证开关、邀请码与发送间隔等配置。
    evidence_refs:
    - ev-cust-setting-config-fields
  datasets:
  - dataset_id: config_mapping
    name: cust_config_mapping
    database: lowcode_pplatform
    description: 外部渠道到内部编码映射。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: outer_channel
      name: outer_channel
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: inner_code
      name: inner_code
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: inner_name
      name: inner_name
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: outer_code
      name: outer_code
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: outer_name
      name: outer_name
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: type
      name: type
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: groups
      name: groups
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-config-mapping-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-config-mapping-fields
  - dataset_id: cust_setting
    name: cust_setting_config
    database: lowcode_pplatform
    description: 企业级配置。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: key_word
      name: key_word
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: need_verify_no_key
      name: need_verify_no_key
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: authorization_online
      name: authorization_online
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: authorization_offline
      name: authorization_offline
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: need_auth_verify
      name: need_auth_verify
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: face_recognition
      name: face_recognition
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: payment_verification
      name: payment_verification
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-cust-setting-config-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-cust-setting-config-fields
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。本单元仅声明 id 用于企业级配置关联企业。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  relationships:
  - relationship_id: cust-setting-company
    left:
      dataset: cust_setting
      field: cust_id
    right:
      dataset: company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业级配置 cust_id 指向企业主数据 id。
    status: proposed
    evidence_refs:
    - ev-cust-setting-config-fields
    - ev-company-fields
    confidence: 0.6
  metrics:
  - metric_id: enabled-config-mapping-count
    name: 启用渠道映射数
    description: 启用的渠道映射条数，按类型统计。
    aggregation: COUNT
    field:
      dataset: config_mapping
      field: id
    grain:
    - dataset: config_mapping
      field: type
    evidence_refs:
    - ev-config-mapping-fields
  - metric_id: customer-config-count
    name: 企业级配置数
    description: 有企业级配置的企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: cust_setting
      field: cust_id
    evidence_refs:
    - ev-cust-setting-config-fields
  calibers:
  - caliber_id: enabled-config-mapping
    label: 启用渠道映射
    description: enable=Y 的渠道映射。
    contract_fragment:
      predicates:
      - field: config_mapping.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: config_mapping
      field: enable
    evidence_refs:
    - ev-config-mapping-fields
  domain_rules:
  - rule_id: mapping-not-customer-setting
    label: 渠道映射不是企业配置
    content: cust_config_mapping 是渠道级映射，cust_setting_config 是企业级配置，两者不可混查。
    applicability: 渠道配置、企业配置
    query_impact: 查询企业协议/验证开关必须 FROM cust_setting_config，不能去 cust_config_mapping 找。
    field_targets:
    - dataset: config_mapping
      field: outer_channel
    - dataset: cust_setting
      field: cust_id
    evidence_refs:
    - ev-config-mapping-fields
    - ev-cust-setting-config-fields
  verified_query_patterns:
  - pattern_id: count-enabled-config-mappings
    question: 启用的渠道映射有多少
    query: "SELECT COUNT(1) AS enabled_mapping_count\nFROM cust_config_mapping\nWHERE enable = 'Y'\n"
    intended_specification:
      grain: config_mapping
      caliber_id: enabled-config-mapping
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-config-mapping-fields
evidence_refs:
- ev-config-mapping-fields
- ev-cust-setting-config-fields
assumptions:
- 授权/验证/人脸等开关字段的 Y/N 语义待连库确认，未标注枚举。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.74
