unit_id: op-user-coverage
revision: 1
title: 运营对接人与离职置顶
aliases:
- 运营人员
- 离职置顶
- top_flag
domain: operation
applicability: 在职运营人员、离职运营人员、置顶项目；不要把 top_flag 解释成风险分数，也不要在 operation_user 上找 top_flag
  列
description: 运营人员主数据在 operation_user，业务键是 operation_id。top_flag 在项目/关系表，值为 1/0。
content:
  concepts:
  - concept_id: operation-user
    name: 运营人员
    aliases:
    - 运营对接人
    definition: 运营中台人员镜像。关联键是 operation_id，不是本地 id。
    evidence_refs:
    - ev-operation-user-fields
    - ev-profile-op-user
  - concept_id: top-flag
    name: 离职置顶
    aliases:
    - topFlag
    definition: 项目或关系上的置顶标记。对接人均不在 deleted=Y 列表时清为 0。
    dictionary:
      '1': 置顶
      '0': 未置顶
    evidence_refs:
    - ev-top-flag-clear
    - ev-project-report-top
  processes:
  - stage_id: clear-top-flag
    name: 清除离职置顶
    trigger: TopFlagCheckService 在项目/关系保存后
    enter_conditions:
    - top_flag=1
    exit_conditions:
    - 若对接人已无离职人员则 top_flag=0
    data_effects:
    - operation: update
      dataset: tenant_project
      fields:
      - top_flag
      evidence_refs:
      - ev-top-flag-clear
    - operation: update
      dataset: wec_project_op
      fields:
      - top_flag
      evidence_refs:
      - ev-top-flag-clear
    evidence_refs:
    - ev-top-flag-clear
  datasets:
  - dataset_id: operation_user
    name: operation_user
    database: lowcode_pplatform
    description: 运营人员。在职口径 deleted='N' AND enable='Y'。无 top_flag 列。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-operation-user-fields
    - field_id: operation_id
      name: operation_id
      data_type: varchar
      evidence_refs:
      - ev-operation-user-fields
      - ev-top-flag-clear
      description: 与项目对接人字段比较的业务键。
    - field_id: operation_name
      name: operation_name
      data_type: varchar
      evidence_refs:
      - ev-operation-user-fields
    - field_id: deleted
      name: deleted
      data_type: varchar
      evidence_refs:
      - ev-operation-user-fields
      - ev-op-user-active-query
      dictionary:
        Y: 已删除/离职
        N: 未删除
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-operation-user-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: operation_group
      name: operation_group
      data_type: varchar
      evidence_refs:
      - ev-operation-user-fields
    evidence_refs:
    - ev-operation-user-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 项目上的对接人与 top_flag。对接人字段存 operation_id。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: op_contact_a
      name: op_contact_a
      data_type: varchar
      evidence_refs:
      - ev-top-flag-clear
      - ev-tenant-project-fields
    - field_id: top_flag
      name: top_flag
      data_type: varchar
      evidence_refs:
      - ev-top-flag-clear
      - ev-profile-tenant-project
      dictionary:
        '1': 置顶
        '0': 未置顶
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-tenant-project-fields
    - ev-top-flag-clear
  - dataset_id: wec_project_op
    name: wec_project_operation_rel
    database: lowcode_pplatform
    description: 微企链项目运营关系，对接人存 operation_id。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-wec-project-op-fields
    - field_id: op_contact_a
      name: op_contact_a
      data_type: varchar
      evidence_refs:
      - ev-wec-project-op-fields
      - ev-top-flag-clear
    - field_id: top_flag
      name: top_flag
      data_type: varchar
      evidence_refs:
      - ev-wec-project-op-fields
      dictionary:
        '1': 置顶
        '0': 未置顶
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-wec-project-op-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-wec-project-op-fields
  - dataset_id: wec_cust_op
    name: wec_project_cust_operation_rel
    database: lowcode_pplatform
    description: 微企链企业×项目运营关系。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-wec-cust-op-fields
    - field_id: project_id
      name: project_id
      data_type: varchar
      evidence_refs:
      - ev-wec-cust-op-fields
    - field_id: op_contact_a
      name: op_contact_a
      data_type: varchar
      evidence_refs:
      - ev-wec-cust-op-fields
      - ev-top-flag-clear
    - field_id: top_flag
      name: top_flag
      data_type: varchar
      evidence_refs:
      - ev-wec-cust-op-fields
      dictionary:
        '1': 置顶
        '0': 未置顶
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-wec-cust-op-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-wec-cust-op-fields
  - dataset_id: oper_change_record
    name: cust_oper_change_record
    database: lowcode_pplatform
    description: 运营人员变更记录，before/after_operator 记录变更前后运营。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-oper-change-fields
    - field_id: person_id
      name: person_id
      data_type: bigint
      evidence_refs:
      - ev-oper-change-fields
    - field_id: person_name
      name: person_name
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-oper-change-fields
    - field_id: company_name
      name: company_name
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: before_operator_id
      name: before_operator_id
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: before_operator_name
      name: before_operator_name
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: after_operator_id
      name: after_operator_id
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: after_operator_name
      name: after_operator_name
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: change_type
      name: change_type
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: change_reason
      name: change_reason
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: asset_id
      name: asset_id
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: asset_no
      name: asset_no
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: source_system
      name: source_system
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-oper-change-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-oper-change-fields
  relationships:
  - relationship_id: op-user-project-contact
    left:
      dataset: operation_user
      field: operation_id
    right:
      dataset: tenant_project
      field: op_contact_a
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 项目运营对接人 A 引用运营人员 operation_id；B 类字段可能是 JSON 数组，不能当等值 JOIN 主路径
    status: proposed
    evidence_refs:
    - ev-top-flag-clear
  metrics:
  - metric_id: active-operation-user-count
    name: 在职运营人员数
    description: 未删除且启用的运营人员数，按运营组统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: operation_user
      field: id
    grain:
    - dataset: operation_user
      field: operation_group
    evidence_refs:
    - ev-op-user-active-query
    - ev-profile-op-user
  calibers:
  - caliber_id: active-operation-user
    label: 在职运营人员
    description: 未删除且启用的运营人员。
    contract_fragment:
      predicates:
      - field: operation_user.deleted
        operator: eq
        values:
        - N
      - field: operation_user.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: operation_user
      field: deleted
    - dataset: operation_user
      field: enable
    evidence_refs:
    - ev-op-user-active-query
    - ev-profile-op-user
  - caliber_id: deleted-operation-user
    label: 离职运营人员
    description: TopFlag 使用的离职集合：deleted=Y 且 enable=Y。
    contract_fragment:
      predicates:
      - field: operation_user.deleted
        operator: eq
        values:
        - Y
      - field: operation_user.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: operation_user
      field: deleted
    - dataset: operation_user
      field: enable
    evidence_refs:
    - ev-top-flag-clear
  - caliber_id: top-flag-project
    label: 置顶项目
    description: tenant_project.top_flag='1'。
    contract_fragment:
      predicates:
      - field: tenant_project.top_flag
        operator: eq
        values:
        - '1'
      - field: tenant_project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_project
      field: top_flag
    - dataset: tenant_project
      field: enable
    evidence_refs:
    - ev-top-flag-clear
    - ev-profile-tenant-project
  domain_rules:
  - rule_id: top-flag-not-on-op-user
    label: top_flag 不在运营人员表
    content: operation_user 没有 top_flag。置顶问数必须落在 tenant_project / wec_* / cust_project_rel。
    applicability: 置顶项目、离职置顶
    query_impact: 禁止在 operation_user 上过滤 top_flag；JOIN 用 operation_id 而不是 id
    field_targets:
    - dataset: operation_user
      field: operation_id
    - dataset: tenant_project
      field: top_flag
    evidence_refs:
    - ev-operation-user-fields
    - ev-top-flag-clear
  verified_query_patterns:
  - pattern_id: count-active-operation-users
    question: 在职运营人员有多少
    query: "SELECT COUNT(1) AS active_operation_user_count\nFROM operation_user\n\
      WHERE deleted = 'N'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: operation_user
      caliber_id: active-operation-user
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-op-user-active-query
    - ev-profile-op-user
evidence_refs:
- ev-operation-user-fields
- ev-wec-project-op-fields
- ev-wec-cust-op-fields
- ev-top-flag-clear
- ev-project-report-top
- ev-wec-op-endpoint
- ev-op-user-active-query
- ev-profile-op-user
- ev-tenant-project-fields
- ev-profile-tenant-project
- ev-oper-change-fields
assumptions:
- op_contact_b 等可能是 JSON 数组，等值 JOIN 只适用于单值字段如 op_contact_a。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.91
