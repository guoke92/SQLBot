unit_id: project-approval
revision: 1
title: 租户项目上线审批
aliases:
- 项目审批
- 上线审批
- 审批流程
domain: project
applicability: 项目上线审批单、审批流程节点、审批附件与授信额度；不用于统计项目本身数量
description: 租户项目上线前走审批流，主表 tenant_project_approval 记录审批单与工作流状态，business_info 记录业务/收费信息，flow 为流程实例节点，flow_config 为流程模板，flow_credit/flow_file/flow_node 记录授信、附件与流转明细。
content:
  concepts:
  - concept_id: project-approval
    name: 项目上线审批
    aliases:
    - 上线审批
    definition: 租户项目上线前的审批单，一行一张审批单，wf_status 描述工作流状态。
    dictionary:
      PENDING: 待发起
      RUNNING: 审批中
      FINISHED: 审批通过
      TERMINATED: 审批拒绝
    evidence_refs:
    - ev-approval-fields
    - ev-approval-wf-status-dict
  - concept_id: approval-flow-config
    name: 审批流程模板
    aliases:
    - 流程配置
    definition: 审批流程模板，flow_code 区分标准/常规流程，node 描述模板节点顺序。
    evidence_refs:
    - ev-approval-flow-config-fields
    - ev-approval-flow-code-dict
  datasets:
  - dataset_id: approval
    name: tenant_project_approval
    database: lowcode_pplatform
    description: 项目上线审批主表。wf_status 为 PENDING/RUNNING/FINISHED/TERMINATED。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-fields
    - field_id: approval_no
      name: approval_no
      data_type: varchar
      evidence_refs:
      - ev-approval-fields
    - field_id: wf_status
      name: wf_status
      data_type: varchar
      dictionary:
        PENDING: 待发起
        RUNNING: 审批中
        FINISHED: 审批通过
        TERMINATED: 审批拒绝
      evidence_refs:
      - ev-approval-fields
      - ev-approval-wf-status-dict
    - field_id: project_type
      name: project_type
      data_type: varchar
      dictionary:
        STANDARD: 标准项目
        REGULAR: 常规项目
      evidence_refs:
      - ev-approval-fields
      - ev-approval-project-type-dict
    - field_id: flow_code
      name: flow_code
      data_type: varchar
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-approval-fields
      - ev-approval-flow-code-dict
    - field_id: is_latest
      name: is_latest
      data_type: varchar
      description: 是否最新一版审批单。
      evidence_refs:
      - ev-approval-fields
    - field_id: initiator_user_name
      name: initiator_user_name
      data_type: varchar
      evidence_refs:
      - ev-approval-fields
    - field_id: initiate_time
      name: initiate_time
      data_type: datetime
      evidence_refs:
      - ev-approval-fields
    - field_id: ref_tenant_project_approval_tenant_project
      name: ref_tenant_project_approval_tenant_project
      data_type: varchar
      description: 关联 tenant_project 的引用列，存 tenant_project.code。
      evidence_refs:
      - ev-approval-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 审批单业务编码，ref 列存此编码而非 id。
      evidence_refs:
      - ev-approval-fields
    - field_id: ref_tenant_project_approval_tenant_project_approval_flow_config
      name: ref_tenant_project_approval_tenant_project_approval_flow_config
      data_type: varchar
      description: 关联审批流程模板的引用列，存 flow_config.code。
      evidence_refs:
      - ev-approval-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-approval-fields
    evidence_refs:
    - ev-approval-fields
  - dataset_id: approval_business
    name: tenant_project_approval_business_info
    database: lowcode_pplatform
    description: 审批单业务信息，产品/来源系统/收费方式等。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-biz-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-approval-biz-fields
    - field_id: source_system
      name: source_system
      data_type: varchar
      evidence_refs:
      - ev-approval-biz-fields
    - field_id: payer
      name: payer
      data_type: varchar
      evidence_refs:
      - ev-approval-biz-fields
    - field_id: ref_tenant_project_approval_business_info_project_approval
      name: ref_tenant_project_approval_business_info_project_approval
      data_type: varchar
      description: 关联审批主表。
      evidence_refs:
      - ev-approval-biz-fields
    evidence_refs:
    - ev-approval-biz-fields
  - dataset_id: approval_flow
    name: tenant_project_approval_flow
    database: lowcode_pplatform
    description: 审批流程实例节点，记录节点状态与审批人。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: node_code
      name: node_code
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: node_name
      name: node_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: node_order
      name: node_order
      data_type: int
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: node_status
      name: node_status
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: approver_user_name
      name: approver_user_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: ref_tenant_project_approval_flow_tenant_project_approval
      name: ref_tenant_project_approval_flow_tenant_project_approval
      data_type: varchar
      description: 关联审批主表，存 approval.code。
      evidence_refs:
      - ev-approval-flow-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 流程实例节点业务编码，流转明细的 ref 列存此编码。
      evidence_refs:
      - ev-approval-flow-fields
    evidence_refs:
    - ev-approval-flow-fields
  - dataset_id: approval_flow_config
    name: tenant_project_approval_flow_config
    database: lowcode_pplatform
    description: 审批流程模板，按 flow_code 区分流程并定义节点顺序。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-flow-config-fields
    - field_id: flow_code
      name: flow_code
      data_type: varchar
      dictionary:
        NO_ONLINE: 无需上线审批
        STANDARD: 标准项目流程
        REGULAR: 常规项目流程
      evidence_refs:
      - ev-approval-flow-config-fields
      - ev-approval-flow-code-dict
    - field_id: node_code
      name: node_code
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-config-fields
    - field_id: node_name
      name: node_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-config-fields
    - field_id: node_order
      name: node_order
      data_type: int
      evidence_refs:
      - ev-approval-flow-config-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 流程模板业务编码，审批单 ref 列存此编码。
      evidence_refs:
      - ev-approval-flow-config-fields
    evidence_refs:
    - ev-approval-flow-config-fields
  - dataset_id: approval_flow_credit
    name: tenant_project_approval_flow_credit
    database: lowcode_pplatform
    description: 审批授信额度，记录授信企业与额度区间。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: credit_limit
      name: credit_limit
      data_type: decimal
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: credited_cust_name
      name: credited_cust_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: crediting_cust_name
      name: crediting_cust_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: limit_begin_date
      name: limit_begin_date
      data_type: date
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: limit_end_date
      name: limit_end_date
      data_type: date
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: ref_tenant_project_approval_flow_credit_project_approval
      name: ref_tenant_project_approval_flow_credit_project_approval
      data_type: varchar
      description: 关联审批主表，存 approval.code。
      evidence_refs:
      - ev-approval-flow-credit-fields
    - field_id: ref_tenant_project_approval_flow_credit_project_approval_node
      name: ref_tenant_project_approval_flow_credit_project_approval_node
      data_type: varchar
      description: 关联审批流转节点，存 flow_node.code。
      evidence_refs:
      - ev-approval-flow-credit-fields
    evidence_refs:
    - ev-approval-flow-credit-fields
  - dataset_id: approval_flow_file
    name: tenant_project_approval_flow_file
    database: lowcode_pplatform
    description: 审批节点附件，记录文件元数据。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-flow-file-fields
    - field_id: catg_name
      name: catg_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-file-fields
    - field_id: file_name
      name: file_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-file-fields
    - field_id: file_url
      name: file_url
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-file-fields
    - field_id: ref_tenant_project_approval_flow_file_project_approval
      name: ref_tenant_project_approval_flow_file_project_approval
      data_type: varchar
      description: 审批引用列，派生自流转节点对审批主表的引用，非直连审批主表。
      evidence_refs:
      - ev-approval-flow-file-fields
    - field_id: ref_tenant_project_approval_flow_file_project_approval_flow_node
      name: ref_tenant_project_approval_flow_file_project_approval_flow_node
      data_type: varchar
      description: 关联审批流转节点，存 flow_node.code。
      evidence_refs:
      - ev-approval-flow-file-fields
    evidence_refs:
    - ev-approval-flow-file-fields
  - dataset_id: approval_flow_node
    name: tenant_project_approval_flow_node
    database: lowcode_pplatform
    description: 审批流转明细，记录每个节点的操作人/操作类型/审批意见。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: node_code
      name: node_code
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: node_order
      name: node_order
      data_type: int
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: approval_type
      name: approval_type
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: operate_type
      name: operate_type
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: approve_comment
      name: approve_comment
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: operator_user_name
      name: operator_user_name
      data_type: varchar
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: operate_time
      name: operate_time
      data_type: datetime
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: ref_tenant_project_approval_flow_node_project_approval
      name: ref_tenant_project_approval_flow_node_project_approval
      data_type: varchar
      description: 关联审批主表，存 approval.code。
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: ref_tenant_project_approval_flow_node_project_approval_flow
      name: ref_tenant_project_approval_flow_node_project_approval_flow
      data_type: varchar
      description: 关联审批流程实例节点，存 flow.code。
      evidence_refs:
      - ev-approval-flow-node-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 流转明细业务编码，授信与附件的 ref 列存此编码。
      evidence_refs:
      - ev-approval-flow-node-fields
    evidence_refs:
    - ev-approval-flow-node-fields
  - dataset_id: project_file
    name: project_file_info
    database: lowcode_pplatform
    description: 项目文件，project_id 关联项目。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-project-file-info-fields
    - field_id: project_id
      name: project_id
      data_type: bigint
      evidence_refs:
      - ev-project-file-info-fields
    - field_id: title
      name: title
      data_type: varchar
      evidence_refs:
      - ev-project-file-info-fields
    - field_id: content
      name: content
      data_type: varchar
      evidence_refs:
      - ev-project-file-info-fields
    - field_id: file_type
      name: file_type
      data_type: varchar
      evidence_refs:
      - ev-project-file-info-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-project-file-info-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-project-file-info-fields
  - dataset_id: wechat_approval_apply
    name: wechat_project_approval_apply
    database: lowcode_pplatform
    description: 微信侧项目上线审批申请单。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: sp_type
      name: sp_type
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: project_id
      name: project_id
      data_type: bigint
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: project_type
      name: project_type
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: project_phase
      name: project_phase
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: ka_white_label
      name: ka_white_label
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: project_manager
      name: project_manager
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: solution_manager
      name: solution_manager
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: business_center
      name: business_center
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: capital_org_full_name
      name: capital_org_full_name
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-apply-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-wechat-approval-apply-fields
  - dataset_id: wechat_approval_field_history
    name: wechat_project_approval_field_history
    database: lowcode_pplatform
    description: 微信审批申请字段变更历史。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: apply_id
      name: apply_id
      data_type: bigint
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: sp_no
      name: sp_no
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: field_name
      name: field_name
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: field_label
      name: field_label
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: old_value
      name: old_value
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: new_value
      name: new_value
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: change_source
      name: change_source
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: operator_id
      name: operator_id
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: operator_name
      name: operator_name
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-wechat-approval-field-history-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-wechat-approval-field-history-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 租户项目。本单元仅声明 id 与 code 用于审批单关联项目。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: code
      name: code
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  relationships:
  - relationship_id: wechat-history-apply
    left:
      dataset: wechat_approval_field_history
      field: apply_id
    right:
      dataset: wechat_approval_apply
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 字段变更历史指向一条微信审批申请单。
    status: proposed
    evidence_refs:
    - ev-wechat-approval-field-history-fields
    - ev-wechat-approval-apply-fields

  - relationship_id: approval-business
    left:
      dataset: approval
      field: code
    right:
      dataset: approval_business
      field: ref_tenant_project_approval_business_info_project_approval
    relationship_type: EQUI_JOIN
    cardinality: '1:1'
    business_meaning: 审批业务信息通过 ref 列存审批主表 code，不是 id。
    status: proposed
    evidence_refs:
    - ev-approval-fields
    - ev-approval-biz-fields
  - relationship_id: approval-flow
    left:
      dataset: approval
      field: code
    right:
      dataset: approval_flow
      field: ref_tenant_project_approval_flow_tenant_project_approval
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一张审批单有多个流程实例节点，ref 列存审批主表 code。
    status: proposed
    evidence_refs:
    - ev-approval-fields
    - ev-approval-flow-fields
  - relationship_id: approval-flow-config
    left:
      dataset: approval_flow_config
      field: code
    right:
      dataset: approval
      field: ref_tenant_project_approval_tenant_project_approval_flow_config
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一个审批流程模板对应多张审批单，审批单 ref 列存流程模板 code。
    status: proposed
    evidence_refs:
    - ev-approval-fields
    - ev-approval-flow-config-fields
  - relationship_id: approval-flow-credit
    left:
      dataset: approval
      field: code
    right:
      dataset: approval_flow_credit
      field: ref_tenant_project_approval_flow_credit_project_approval
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一张审批单可含多条授信额度记录，ref 列存审批主表 code。
    status: proposed
    evidence_refs:
    - ev-approval-fields
    - ev-approval-flow-credit-fields
  - relationship_id: flow-credit-node
    left:
      dataset: approval_flow_node
      field: code
    right:
      dataset: approval_flow_credit
      field: ref_tenant_project_approval_flow_credit_project_approval_node
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 授信额度记录关联其产生的审批流转节点 code。
    status: proposed
    evidence_refs:
    - ev-approval-flow-credit-fields
    - ev-approval-flow-node-fields
  - relationship_id: flow-file-node
    left:
      dataset: approval_flow_node
      field: code
    right:
      dataset: approval_flow_file
      field: ref_tenant_project_approval_flow_file_project_approval_flow_node
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 审批附件关联其所属流转节点 code。
    status: proposed
    evidence_refs:
    - ev-approval-flow-file-fields
    - ev-approval-flow-node-fields
  - relationship_id: flow-node-approval
    left:
      dataset: approval
      field: code
    right:
      dataset: approval_flow_node
      field: ref_tenant_project_approval_flow_node_project_approval
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一张审批单有多次流转明细，ref 列存审批主表 code。
    status: proposed
    evidence_refs:
    - ev-approval-fields
    - ev-approval-flow-node-fields
  - relationship_id: flow-node-flow
    left:
      dataset: approval_flow
      field: code
