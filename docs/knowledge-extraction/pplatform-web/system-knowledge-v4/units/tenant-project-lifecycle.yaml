unit_id: tenant-project-lifecycle
revision: 1
title: 租户项目生效
aliases:
- 待生效项目
- 已生效项目
- 已失效项目
domain: project
applicability: 租户项目待生效/已生效/已失效数量；不用于资金规则 PENDING/ACTIVE，也不替代企业项目关联成员数
description: 租户项目状态字段是 tenant_project.project_status，物理值 0/1/2。rule_status 属于资金规则表。
content:
  concepts:
  - concept_id: tenant-project-lifecycle
    name: 租户项目生命周期
    aliases:
    - 项目生效
    - 项目失效
    definition: tenant_project 上的业务项目实例从待生效到生效或失效。
    dictionary:
      '0': 待生效
      '1': 已生效
      '2': 已失效
    evidence_refs:
    - ev-project-status-dict
    - ev-tenant-project-status-write
  processes:
  - stage_id: create-project
    name: 创建项目
    trigger: POST /app-web/tenantProject/create
    enter_conditions:
    - 租户产品已存在
    exit_conditions:
    - 写入 tenant_project 且 project_status=0
    next_stages:
    - effective-project
    data_effects:
    - operation: insert
      dataset: tenant_project
      fields:
      - project_status
      - product_id
      - enable
      description: 创建写待生效 0。
      evidence_refs:
      - ev-tenant-project-status-write
    evidence_refs:
    - ev-tenant-project-endpoint
    - ev-tenant-project-status-write
  - stage_id: effective-project
    name: 生效项目
    trigger: POST /app-web/tenantProject/effective
    enter_conditions:
    - 项目已创建
    exit_conditions:
    - project_status=1
    next_stages:
    - invalid-project
    data_effects:
    - operation: update
      dataset: tenant_project
      fields:
      - project_status
      evidence_refs:
      - ev-tenant-project-status-write
    evidence_refs:
    - ev-tenant-project-endpoint
    - ev-tenant-project-status-write
  - stage_id: invalid-project
    name: 失效项目
    trigger: POST /app-web/tenantProject/invalid
    enter_conditions:
    - 项目已生效或待生效
    exit_conditions:
    - project_status=2
    data_effects:
    - operation: update
      dataset: tenant_project
      fields:
      - project_status
      evidence_refs:
      - ev-tenant-project-status-write
    evidence_refs:
    - ev-tenant-project-endpoint
    - ev-tenant-project-status-write
  datasets:
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 租户业务项目实例。已生效库值是 '1'。product_id 连 tenant_product.id。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: product_id
      name: product_id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: project_approval_id
      name: project_approval_id
      data_type: bigint
      description: 关联的项目上线审批单主键，指向 tenant_project_approval.id。
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: project_status
      name: project_status
      data_type: varchar
      evidence_refs:
      - ev-project-status-dict
      - ev-profile-tenant-project
      dictionary:
        '0': 待生效
        '1': 已生效
        '2': 已失效
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: top_flag
      name: top_flag
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
      - ev-profile-tenant-project
      description: 离职风险置顶标记在项目表，不在 operation_user。
      dictionary:
        '1': 置顶
        '0': 未置顶
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: project_effective_time
      name: project_effective_time
      data_type: timestamp
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  - dataset_id: tenant_product
    name: tenant_product
    database: lowcode_pplatform
    description: 项目所属租户产品。本单元只用来连接，开通口径见 tenant-product-lifecycle。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-tenant-product-fields
  - dataset_id: approval
    name: tenant_project_approval
    database: lowcode_pplatform
    description: 项目上线审批单。本单元仅声明 id 用于项目关联审批单。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-approval-fields
    evidence_refs:
    - ev-approval-fields
  relationships:
  - relationship_id: project-belongs-product
    left:
      dataset: tenant_project
      field: product_id
    right:
      dataset: tenant_product
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 项目挂在一条租户产品下
    status: proposed
    evidence_refs:
    - ev-tenant-project-fields
    - ev-tenant-product-fields
  - relationship_id: project-approval-link
    left:
      dataset: tenant_project
      field: project_approval_id
    right:
      dataset: approval
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 项目通过 project_approval_id 关联其上线审批单
    status: proposed
    evidence_refs:
    - ev-tenant-project-fields
    - ev-approval-fields
  metrics:
  - metric_id: tenant-project-count-by-status
    name: 租户项目状态分布
    description: 按 project_status 0/1/2 统计租户项目数。
    aggregation: COUNT
    field:
      dataset: tenant_project
      field: id
    grain:
    - dataset: tenant_project
      field: project_status
    evidence_refs:
    - ev-project-status-dict
    - ev-profile-tenant-project
  - metric_id: effective-tenant-project-count
    name: 已生效租户项目数
    description: 已生效的租户项目数，按租户统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: tenant_project
      field: id
    grain:
    - dataset: tenant_project
      field: db_tenant_code
    evidence_refs:
    - ev-effective-project
    - ev-profile-tenant-project
  calibers:
  - caliber_id: effective-tenant-project-v4
    label: 已生效租户项目
    description: 启用且 project_status='1'。
    contract_fragment:
      predicates:
      - field: tenant_project.project_status
        operator: eq
        values:
        - '1'
      - field: tenant_project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_project
      field: project_status
    - dataset: tenant_project
      field: enable
    evidence_refs:
    - ev-effective-project
    - ev-project-status-dict
  - caliber_id: pending-tenant-project
    label: 待生效租户项目
    description: 启用且 project_status='0'。
    contract_fragment:
      predicates:
      - field: tenant_project.project_status
        operator: eq
        values:
        - '0'
      - field: tenant_project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_project
      field: project_status
    - dataset: tenant_project
      field: enable
    evidence_refs:
    - ev-tenant-project-status-write
    - ev-profile-tenant-project
  domain_rules:
  - rule_id: project-status-is-not-rule-status
    label: 项目状态不是 rule_status
    content: 项目用 project_status 的 0/1/2；PENDING/ACTIVE/INACTIVE 属于 funding_rule_info.rule_status。
    applicability: 已生效项目、待生效项目
    query_impact: 过滤必须使用 project_status IN ('0','1','2')，禁止 PENDING/ACTIVE
    field_targets:
    - dataset: tenant_project
      field: project_status
    evidence_refs:
    - ev-project-status-dict
    - ev-funding-fields
  verified_query_patterns:
  - pattern_id: count-effective-tenant-projects
    question: 已生效的租户项目有多少
    query: "SELECT COUNT(1) AS effective_project_count\nFROM tenant_project\nWHERE\
      \ project_status = '1'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: tenant_project
      caliber_id: effective-tenant-project-v4
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-effective-project
    - ev-profile-tenant-project
evidence_refs:
- ev-tenant-project-endpoint
- ev-tenant-project-status-write
- ev-tenant-project-fields
- ev-project-status-dict
- ev-effective-project
- ev-profile-tenant-project
- ev-tenant-product-fields
- ev-approval-fields
- ev-funding-fields
assumptions:
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.93
