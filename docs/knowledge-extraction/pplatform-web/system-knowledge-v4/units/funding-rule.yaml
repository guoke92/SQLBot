unit_id: funding-rule
revision: 1
title: 资金方规则版本
aliases:
- 资方规则
- 资金规则
domain: funding
applicability: 生效中的资金规则版本；不要用 PENDING/ACTIVE 去过滤 tenant_project
description: 资金规则在 funding_rule_info。rule_status 为 ACTIVE/PENDING/INACTIVE。
content:
  concepts:
  - concept_id: funding-rule
    name: 资金方规则
    aliases:
    - 资方规则
    definition: 某资金方在某产品上的规则版本。
    dictionary:
      ACTIVE: 生效
      PENDING: 待生效
      INACTIVE: 失效
    evidence_refs:
    - ev-funding-fields
    - ev-profile-funding
  processes:
  - stage_id: query-funding-rule
    name: 查询资金规则
    trigger: /fund-web/ruleInfo
    enter_conditions:
    - 可选 ruleStatus 精确匹配
    exit_conditions:
    - 返回 funding_rule_info
    data_effects:
    - operation: read
      dataset: funding_rule
      fields:
      - rule_status
      - enable
      evidence_refs:
      - ev-funding-endpoint
    evidence_refs:
    - ev-funding-endpoint
  datasets:
  - dataset_id: funding_rule
    name: funding_rule_info
    database: lowcode_pplatform
    description: 资金方规则版本。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-fields
    - field_id: funding_party_mark
      name: funding_party_mark
      data_type: varchar
      evidence_refs:
      - ev-funding-fields
    - field_id: funding_party_name
      name: funding_party_name
      data_type: varchar
      evidence_refs:
      - ev-funding-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-funding-fields
    - field_id: rule_status
      name: rule_status
      data_type: varchar
      evidence_refs:
      - ev-funding-fields
      - ev-profile-funding
      dictionary:
        ACTIVE: 生效
        PENDING: 待生效
        INACTIVE: 失效
    - field_id: version
      name: version
      data_type: int
      evidence_refs:
      - ev-funding-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-fields
  - dataset_id: funding_exception
    name: funding_exception_resolution
    database: lowcode_pplatform
    description: 资金规则异常解析，一行一条异常与建议。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: exception_no
      name: exception_no
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: funding_party_code
      name: funding_party_code
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: funding_party_name
      name: funding_party_name
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: error_keyword
      name: error_keyword
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: error_reason
      name: error_reason
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: suggestion
      name: suggestion
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-exception-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-exception-fields
  - dataset_id: funding_party_cfg
    name: funding_party_rule_cfg
    database: lowcode_pplatform
    description: 资方规则配置头，rule_status 描述规则状态。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-party-cfg-fields
    - field_id: funding_party_code
      name: funding_party_code
      data_type: varchar
      evidence_refs:
      - ev-funding-party-cfg-fields
    - field_id: funding_party_name
      name: funding_party_name
      data_type: varchar
      evidence_refs:
      - ev-funding-party-cfg-fields
    - field_id: rule_status
      name: rule_status
      data_type: varchar
      evidence_refs:
      - ev-funding-party-cfg-fields
      dictionary:
        ACTIVE: 生效
        PENDING: 待生效
        INACTIVE: 失效
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-party-cfg-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-party-cfg-fields
  - dataset_id: funding_party_detail
    name: funding_party_rule_detail
    database: lowcode_pplatform
    description: 资方规则明细，cfg_ref_code 关联配置头。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: cfg_ref_code
      name: cfg_ref_code
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
    - field_id: key_cod_type
      name: key_cod_type
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: rule_value
      name: rule_value
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: funding_party_code
      name: funding_party_code
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-party-detail-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-party-detail-fields
  - dataset_id: funding_party_front
    name: funding_party_rule_front
    database: lowcode_pplatform
    description: 资方规则前台展示项。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: rule_type
      name: rule_type
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: key_code
      name: key_code
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: key_name
      name: key_name
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
    - field_id: front_value
      name: front_value
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: key_code_type
      name: key_code_type
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-party-front-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-party-front-fields
  - dataset_id: funding_rule_detail
    name: funding_rule_detail
    database: lowcode_pplatform
    description: 资金规则版本明细，rule_info_id 关联版本头。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: rule_value
      name: rule_value
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: fund_rule_code_ref
      name: fund_rule_code_ref
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: rule_key
      name: rule_key
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
      dictionary:
        UNDERLYING: 底层规则
        FINANCING: 融资规则
        OTHER: 其他规则
    - field_id: version
      name: version
      data_type: int
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: funding_party_mark
      name: funding_party_mark
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: rule_info_id
      name: rule_info_id
      data_type: bigint
      evidence_refs:
      - ev-funding-rule-detail-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-funding-rule-detail-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-funding-rule-detail-fields
  - dataset_id: funding_rule_front
    name: funding_rule_front_cfg
    database: lowcode_pplatform
    description: 资金规则前台字段样式配置。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-funding-rule-front-fields
    - field_id: rule_layer
      name: rule_layer
      data_type: varchar
