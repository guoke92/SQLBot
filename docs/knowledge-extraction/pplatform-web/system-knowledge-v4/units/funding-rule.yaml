  relationships:
  - relationship_id: funding-rule-detail-rule-info
    left:
      dataset: funding_rule_detail
      field: rule_info_id
    right:
      dataset: funding_rule
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 资金规则明细 rule_info_id 归属版本头 funding_rule_info。
    status: proposed
    evidence_refs:
    - ev-funding-rule-detail-fields
    - ev-funding-fields
    confidence: 0.6
  metrics:
  - metric_id: funding-rule-count-by-status
    name: 资金规则状态分布
    description: 按 ACTIVE/PENDING/INACTIVE 统计资金规则数。
    aggregation: COUNT
    field:
      dataset: funding_rule
      field: id
    grain:
    - dataset: funding_rule
      field: rule_status
    evidence_refs:
    - ev-profile-funding
    - ev-funding-fields
  - metric_id: active-funding-rule-count
    name: 生效资金规则数
    description: 生效中的资金规则数，按产品统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: funding_rule
      field: id
    grain:
    - dataset: funding_rule
      field: product_code
    evidence_refs:
    - ev-profile-funding
    - ev-funding-fields
  calibers:
  - caliber_id: active-funding-rule
    label: 生效中的资金规则
    description: rule_status=ACTIVE 且 enable=Y。
    contract_fragment:
      predicates:
      - field: funding_rule.rule_status
        operator: eq
        values:
        - ACTIVE
      - field: funding_rule.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: funding_rule
      field: rule_status
    - dataset: funding_rule
      field: enable
    evidence_refs:
    - ev-funding-endpoint
    - ev-profile-funding
  domain_rules:
  - rule_id: rule-status-not-project-status
    label: 规则状态不是项目状态
    content: ACTIVE/PENDING/INACTIVE 只用于 funding_rule_info.rule_status。
    applicability: 生效规则、待生效规则
    query_impact: 禁止把这些值写到 tenant_project.project_status
    field_targets:
    - dataset: funding_rule
      field: rule_status
    evidence_refs:
    - ev-funding-fields
    - ev-project-status-dict
  verified_query_patterns:
  - pattern_id: count-active-funding-rules
    question: 生效中的资金规则有多少
    query: "SELECT COUNT(1) AS active_funding_rule_count\nFROM funding_rule_info\n\
      WHERE rule_status = 'ACTIVE'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: funding_rule
      caliber_id: active-funding-rule
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-funding-endpoint
    - ev-profile-funding
evidence_refs:
- ev-funding-endpoint
- ev-funding-fields
- ev-profile-funding
- ev-project-status-dict
- ev-funding-exception-fields
- ev-funding-party-cfg-fields
- ev-funding-party-detail-fields
- ev-funding-party-front-fields
- ev-funding-rule-detail-fields
- ev-funding-rule-front-fields
assumptions:
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.9
