unit_id: org-manage
revision: 1
title: 机构管理
aliases:
- 机构
- 组织
domain: org
applicability: 机构层级与状态；不用于运营人员与租户
description: 机构在 org_manage，parent_code 建立父子层级，status 描述机构状态。
content:
  concepts:
  - concept_id: org
    name: 机构
    aliases:
    - 组织
    definition: 机构/组织节点，code 业务键，parent_code 关联父机构。
    evidence_refs:
    - ev-org-manage-fields
  datasets:
  - dataset_id: org
    name: org_manage
    database: lowcode_pplatform
    description: 机构节点。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-org-manage-fields
    - field_id: code
      name: code
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: org_no
      name: org_no
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: org_name
      name: org_name
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: org_level
      name: org_level
      data_type: int
      evidence_refs:
      - ev-org-manage-fields
    - field_id: org_type
      name: org_type
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: client_type
      name: client_type
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: parent_code
      name: parent_code
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-org-manage-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-org-manage-fields
  relationships:
  - relationship_id: org-parent
    left:
      dataset: org
      field: parent_code
    right:
      dataset: org
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 机构通过 parent_code 指向父机构 code。
    status: proposed
    evidence_refs:
    - ev-org-manage-fields
  metrics:
  - metric_id: org-count-by-level
    name: 机构层级分布
    description: 按层级统计机构数。
    aggregation: COUNT
    field:
      dataset: org
      field: id
    grain:
    - dataset: org
      field: org_level
    evidence_refs:
    - ev-org-manage-fields
  calibers:
  - caliber_id: enabled-org
    label: 启用机构
    description: enable=Y 的机构。
    contract_fragment:
      predicates:
      - field: org.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: org
      field: enable
    evidence_refs:
    - ev-org-manage-fields
  domain_rules:
  - rule_id: org-parent-by-code
    label: 机构父子按 code 连接
    content: parent_code 关联父机构 code，不是 id。
    applicability: 机构层级
    query_impact: 自连接必须 org.parent_code = parent.code。
    field_targets:
    - dataset: org
      field: parent_code
    evidence_refs:
    - ev-org-manage-fields
  verified_query_patterns:
  - pattern_id: count-enabled-orgs
    question: 启用的机构有多少
    query: "SELECT COUNT(1) AS enabled_org_count\nFROM org_manage\nWHERE enable = 'Y'\n"
    intended_specification:
      grain: org
      caliber_id: enabled-org
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-org-manage-fields
evidence_refs:
- ev-org-manage-fields
assumptions:
- status 的具体取值未确认，暂不作为问数口径。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.72
