unit_id: ca-certification
revision: 1
title: CA 数字证书签约认证
aliases:
- CA 认证
- 数字证书
- 证书签约
domain: ca_certification
applicability: CA 数字证书提交/签约结果；不用于企业工商/法人实名认证，也不用于 CA 费台账
description: CA 数字证书认证记录在 ca_certification_info，submit_status 为 PENDING/SUCCESS/FAIL，按 (custId, dataDate, headCompanyData) 幂等。
content:
  concepts:
  - concept_id: ca-certification
    name: CA 数字证书认证
    aliases:
    - 证书签约
    definition: 企业向 CFCA/CA 平台提交数字证书签约的认证记录，一行一次提交。
    dictionary:
      PENDING: 待提交
      SUCCESS: 提交成功
      FAIL: 提交失败
    evidence_refs:
    - ev-ca-cert-fields
    - ev-ca-cert-submit-dict
  datasets:
  - dataset_id: ca_certification
    name: ca_certification_info
    database: lowcode_pplatform
    description: CA 数字证书认证主表。submit_status 描述提交结果，sign_platform_result 描述签约平台回执。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: cust_id
      name: cust_id
      data_type: bigint
      description: 关联企业。
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: data_date
      name: data_date
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: op_type
      name: op_type
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: batch_no
      name: batch_no
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: submit_status
      name: submit_status
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
      - ev-ca-cert-submit-dict
      dictionary:
        PENDING: 待提交
        SUCCESS: 提交成功
        FAIL: 提交失败
    - field_id: sign_platform_result
      name: sign_platform_result
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-ca-cert-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-ca-cert-fields
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。本单元仅声明 id 用于 CA 认证记录关联企业，企业统计口径回建档单元。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  relationships:
  - relationship_id: ca-cert-company
    left:
      dataset: ca_certification
      field: cust_id
    right:
      dataset: company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: CA 认证记录的 cust_id 指向企业主数据 id。
    status: proposed
    evidence_refs:
    - ev-ca-cert-fields
    - ev-company-fields
    confidence: 0.6
  metrics:
  - metric_id: ca-cert-count-by-submit
    name: CA 证书提交状态分布
    description: 按提交状态统计 CA 证书认证记录数。
    aggregation: COUNT
    field:
      dataset: ca_certification
      field: id
    grain:
    - dataset: ca_certification
      field: submit_status
    evidence_refs:
    - ev-ca-cert-fields
    - ev-ca-cert-submit-dict
  calibers:
  - caliber_id: ca-cert-success
    label: 已提交成功的 CA 证书
    description: submit_status=SUCCESS 且 enable=Y。
    contract_fragment:
      predicates:
      - field: ca_certification.submit_status
        operator: eq
        values:
        - SUCCESS
      - field: ca_certification.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: ca_certification
      field: submit_status
    - dataset: ca_certification
      field: enable
    evidence_refs:
    - ev-ca-cert-fields
    - ev-ca-cert-submit-dict
  domain_rules:
  - rule_id: ca-cert-idempotent-key
    label: CA 提交幂等键
    content: 提交幂等键为 (cust_id, data_date, head_company_data)；submit_status=PENDING 表示未提交。
    applicability: 提交中、提交失败重试
    query_impact: 判断是否提交成功看 submit_status=SUCCESS，不拿 enable 或 create_time 代替。
    field_targets:
    - dataset: ca_certification
      field: submit_status
    evidence_refs:
    - ev-ca-cert-submit-dict
  verified_query_patterns:
  - pattern_id: count-ca-cert-success
    question: 已提交成功的 CA 数字证书认证有多少
    query: "SELECT COUNT(1) AS ca_cert_success_count\nFROM ca_certification_info\n\
      WHERE submit_status = 'SUCCESS'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: ca_certification
      caliber_id: ca-cert-success
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-ca-cert-fields
    - ev-ca-cert-submit-dict
evidence_refs:
- ev-ca-cert-fields
- ev-ca-cert-submit-dict
assumptions:
- sign_platform_result 为签约平台回执字符串，无统一枚举。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.8
