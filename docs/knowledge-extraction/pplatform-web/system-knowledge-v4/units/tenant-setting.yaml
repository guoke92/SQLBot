unit_id: tenant-setting
revision: 1
title: 租户配置生效
aliases:
- 租户设置
- 已生效租户
domain: tenant
applicability: 已生效/待生效租户配置；不用于 SSO/DBAss 是否初始化
description: 租户配置在 tenant_setting_config。status=Y 已生效，否则待生效。
content:
  concepts:
  - concept_id: tenant-setting
    name: 租户配置
    aliases:
    - 租户设置
    definition: 租户品牌、域名、默认项目等配置行。
    dictionary:
      Y: 已生效
      N: 待生效
    evidence_refs:
    - ev-tenant-setting-fields
    - ev-tenant-setting-status-dict
  processes:
  - stage_id: get-tenant-setting
    name: 查询租户配置
    trigger: /tenant-web/setting/getTenantSetting
    enter_conditions:
    - 租户标识已知
    exit_conditions:
    - 读取 tenant_setting_config
    data_effects:
    - operation: read
      dataset: tenant_setting
      fields:
      - status
      - enable
      - default_project_id
      evidence_refs:
      - ev-tenant-setting-endpoint
    evidence_refs:
    - ev-tenant-setting-endpoint
  datasets:
  - dataset_id: tenant_setting
    name: tenant_setting_config
    database: lowcode_pplatform
    description: 一行一个租户配置。status 不是 enable。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-setting-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-status-dict
      - ev-profile-tenant-setting
      dictionary:
        Y: 已生效
        N: 待生效
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: default_project_id
      name: default_project_id
      data_type: bigint
      evidence_refs:
      - ev-tenant-setting-fields
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-fields
    evidence_refs:
    - ev-tenant-setting-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 默认项目指向 tenant_project.id。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  - dataset_id: tenant_setting_share
    name: tenant_setting_config_share
    database: lowcode_pplatform
    description: 租户分享/品牌配置，source_id 标识来源，sso 字段为单点登录渠道。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: source_id
      name: source_id
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: source
      name: source
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: band_name
      name: band_name
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: uni_social_credit_code
      name: uni_social_credit_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: sso_sys_channel
      name: sso_sys_channel
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: sso_tenant_chanel
      name: sso_tenant_chanel
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
      dictionary:
        Y: 已生效
        N: 待生效
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-setting-share-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-tenant-setting-share-fields
  relationships:
  - relationship_id: setting-default-project
    left:
      dataset: tenant_setting
      field: default_project_id
    right:
      dataset: tenant_project
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户默认项目
    status: proposed
    evidence_refs:
    - ev-tenant-setting-fields
  metrics:
  - metric_id: effective-tenant-setting-count
    name: 已生效租户配置数
    description: 已启用的租户配置数，按租户统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: tenant_setting
      field: id
    grain:
    - dataset: tenant_setting
      field: db_tenant_code
    evidence_refs:
    - ev-tenant-setting-status-dict
    - ev-profile-tenant-setting
  calibers:
  - caliber_id: effective-tenant-setting
    label: 已生效租户配置
    description: status=Y 且 enable=Y。
    contract_fragment:
      predicates:
      - field: tenant_setting.status
        operator: eq
        values:
        - Y
      - field: tenant_setting.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_setting
      field: status
    - dataset: tenant_setting
      field: enable
    evidence_refs:
    - ev-tenant-setting-status-dict
    - ev-profile-tenant-setting
  domain_rules:
  - rule_id: setting-status-not-enable
    label: 配置生效不是 enable
    content: enable 是行是否可用；是否已生效看 status。
    applicability: 已生效租户、待生效租户
    query_impact: 已生效必须同时过滤 status='Y'，不能只过滤 enable='Y'
    field_targets:
    - dataset: tenant_setting
      field: status
    - dataset: tenant_setting
      field: enable
    evidence_refs:
    - ev-tenant-setting-status-dict
    - ev-profile-tenant-setting
  verified_query_patterns:
  - pattern_id: count-effective-tenant-settings
    question: 已生效租户配置有多少
    query: "SELECT COUNT(1) AS effective_tenant_setting_count\nFROM tenant_setting_config\n\
      WHERE status = 'Y'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: tenant_setting
      caliber_id: effective-tenant-setting
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-setting-status-dict
    - ev-profile-tenant-setting
evidence_refs:
- ev-tenant-setting-endpoint
- ev-tenant-setting-fields
- ev-tenant-setting-status-dict
- ev-profile-tenant-setting
- ev-tenant-project-fields
- ev-tenant-setting-share-fields
assumptions:
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.88
