  relationships:
  - relationship_id: project-product
    left:
      dataset: tenant_interworking_project
      field: product_id
    right:
      dataset: tenant_interworking_product
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 互联项目指向一条租户互联产品。
    status: proposed
    evidence_refs:
    - ev-tenant-interworking-project-fields
    - ev-tenant-interworking-product-fields
  - relationship_id: cust-product-tenant-product
    left:
      dataset: cust_interworking_product
      field: product_id
    right:
      dataset: tenant_interworking_product
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业互联产品指向租户互联产品。
    status: proposed
    evidence_refs:
    - ev-interworking-product-fields
    - ev-tenant-interworking-product-fields
  - relationship_id: cust-interworking-product-company
    left:
      dataset: cust_interworking_product
      field: ref_cust_interworking_product_cust_company_info
    right:
      dataset: company
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业互联产品按企业 code 关联企业主数据。
    status: proposed
    evidence_refs:
    - ev-interworking-product-fields
    - ev-company-fields
  - relationship_id: cust-interworking-product-ref-product
    left:
      dataset: cust_interworking_product
      field: ref_cust_interworking_product_tenant_interworking_product
