unit_id: interworking
revision: 1
title: 互联产品与项目
aliases:
- 互联产品
- 互联项目
- 开放产品
domain: interworking
applicability: 租户/企业互联产品开通与互联项目；不用于租户产品开通实例 tenant_product
description: 租户互联产品在 tenant_interworking_product，租户互联项目在 tenant_interworking_project，企业互联产品在 cust_interworking_product；开通状态 open_status 为 Y/P/N。
content:
  concepts:
  - concept_id: tenant-interworking-product
    name: 租户互联产品
    definition: 租户对平台产品的互联开通实例，open_status 为 Y/P/N。
    dictionary:
      Y: 已开通
      P: 开通中
      N: 未开通
    evidence_refs:
    - ev-tenant-interworking-product-fields
  - concept_id: tenant-interworking-project
    name: 租户互联项目
    definition: 租户在互联产品下的项目。
    evidence_refs:
    - ev-tenant-interworking-project-fields
  - concept_id: cust-interworking-product
    name: 企业互联产品
    definition: 企业维度的互联产品开通记录。
    evidence_refs:
    - ev-interworking-product-fields
  datasets:
