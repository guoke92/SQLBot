    evidence_refs:
    - ev-tenant-interworking-product-fields
    - ev-tenant-setting-fields
  - relationship_id: interworking-project-ref-product
    left:
      dataset: tenant_interworking_project
      field: ref_tenant_interworking_project_tenant_interworking_product
    right:
      dataset: tenant_interworking_product
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 互联项目按 code 关联租户互联产品。
    status: proposed
    evidence_refs:
    - ev-tenant-interworking-project-fields
    - ev-tenant-interworking-product-fields
  - relationship_id: interworking-project-tenant-setting
    left:
      dataset: tenant_interworking_project
      field: ref_tenant_interworking_project_tenant_setting_config
    right:
      dataset: tenant_setting
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 互联项目关联所属租户配置。
    status: proposed
    evidence_refs:
    - ev-tenant-interworking-project-fields
    - ev-tenant-setting-fields
  - relationship_id: interworking-project-product-tenant-setting
    left:
      dataset: tenant_interworking_project
      field: ref_tenant_interworking_project_tenant_setting_config
    right:
      dataset: tenant_interworking_product
      field: ref_tenant_interworking_product_tenant_setting_config
    relationship_type: SHARED_KEY
    cardinality: n:n
    business_meaning: 互联项目与互联产品的 ref_*_tenant_setting_config 业务含义相同（都是租户配置 code）、取值一致，属共享租户维度。串联时各自 JOIN 到 tenant_setting_config.code，不得直接 JOIN 彼此（会扇出）。
    status: proposed
    evidence_refs:
    - ev-tenant-interworking-project-fields
    - ev-tenant-interworking-product-fields
  metrics:
  - metric_id: opened-interworking-product-count
    name: 已开通互联产品数
    description: 已开通且启用的租户互联产品数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: tenant_interworking_product
      field: id
    grain:
    - dataset: tenant_interworking_product
      field: platform_product_code
    evidence_refs:
    - ev-tenant-interworking-product-fields
  calibers:
  - caliber_id: opened-interworking-product
    label: 已开通互联产品
    description: open_status=Y 且 enable=Y。
    contract_fragment:
      predicates:
      - field: tenant_interworking_product.open_status
        operator: eq
        values:
        - Y
      - field: tenant_interworking_product.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_interworking_product
      field: open_status
    - dataset: tenant_interworking_product
      field: enable
    evidence_refs:
    - ev-tenant-interworking-product-fields
  domain_rules:
  - rule_id: interworking-open-is-ynp
    label: 互联产品开通是 Y/P/N
    content: 互联产品 open_status 只用 Y/P/N，与企业申请表 OPENED 是两套口径。
    applicability: 已开通互联产品、开通中互联产品
    query_impact: 过滤互联产品必须用 Y/P/N，禁止 OPENED。
    field_targets:
    - dataset: tenant_interworking_product
      field: open_status
    evidence_refs:
    - ev-tenant-interworking-product-fields
  verified_query_patterns:
  - pattern_id: count-opened-interworking-products
    question: 已开通的互联产品有多少
    query: "SELECT COUNT(1) AS opened_interworking_product_count\nFROM tenant_interworking_product\nWHERE open_status = 'Y'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: tenant_interworking_product
      caliber_id: opened-interworking-product
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-interworking-product-fields
evidence_refs:
- ev-tenant-interworking-product-fields
- ev-tenant-interworking-project-fields
- ev-interworking-product-fields
- ev-company-fields
- ev-platform-product-fields
- ev-tenant-setting-fields
assumptions:
- 互联项目 product_id 关联互联产品 id，企业互联产品 product_id 关联租户互联产品 id，关联键待连库确认。
- 查询范例未在目标库逐条执行。
conflicts: []
