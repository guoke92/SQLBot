      dataset: tenant_interworking_product
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 企业互联产品按 code 关联租户互联产品。
    status: proposed
    evidence_refs:
    - ev-interworking-product-fields
    - ev-tenant-interworking-product-fields
  - relationship_id: tenant-interworking-product-platform-code
    left:
      dataset: tenant_interworking_product
      field: platform_product_code
    right:
      dataset: platform_product
      field: product_code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户互联产品按平台产品编号关联平台产品。
