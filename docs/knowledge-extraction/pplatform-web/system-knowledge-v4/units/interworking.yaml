    - ev-platform-product-fields
  - relationship_id: tenant-interworking-product-ref-platform-product
    left:
      dataset: tenant_interworking_product
      field: ref_tenant_interworking_product_platform_product
    right:
      dataset: platform_product
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户互联产品的平台产品引用字段关联平台产品编码。
    status: proposed
    evidence_refs:
    - ev-tenant-interworking-product-fields
    - ev-platform-product-fields
  - relationship_id: tenant-interworking-product-tenant-setting
    left:
      dataset: tenant_interworking_product
