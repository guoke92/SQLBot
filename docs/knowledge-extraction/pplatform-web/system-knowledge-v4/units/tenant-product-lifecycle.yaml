  relationships:
  - relationship_id: tenant-product-platform
    left:
      dataset: tenant_product
      field: platform_product_id
    right:
      dataset: platform_product
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户开通实例指向一条平台产品
    status: proposed
    evidence_refs:
    - ev-tenant-product-fields
    - ev-platform-product-fields
  - relationship_id: tenant-product-platform-code
    left:
      dataset: tenant_product
      field: platform_product_code
    right:
      dataset: platform_product
      field: product_code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户产品按平台产品编号关联平台产品。
    status: proposed
    evidence_refs:
    - ev-tenant-product-fields
    - ev-platform-product-fields
  - relationship_id: tenant-product-ref-platform-product
    left:
      dataset: tenant_product
      field: ref_tenant_product_project_code
    right:
      dataset: platform_product
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户产品的平台产品引用字段关联平台产品编码。
    status: proposed
    evidence_refs:
    - ev-tenant-product-fields
    - ev-platform-product-fields
  - relationship_id: tenant-product-tenant-setting
    left:
      dataset: tenant_product
      field: ref_tenant_product_tenant_setting_config
    right:
      dataset: tenant_setting
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 租户产品关联所属租户配置。
    status: proposed
    evidence_refs:
    - ev-tenant-product-fields
    - ev-tenant-setting-fields
  - relationship_id: tenant-product-ext-field-product
    left:
      dataset: tenant_product_ext_field
      field: ref_tenant_ext_field_tenant_product
    right:
      dataset: tenant_product
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 扩展字段定义关联租户产品编码。
    status: proposed
    evidence_refs:
    - ev-tenant-product-ext-field-fields
    - ev-tenant-product-fields
  - relationship_id: tenant-product-ext-form-product
    left:
