    - field_id: ref_cust_customized_product_cust_company_info
      name: ref_cust_customized_product_cust_company_info
      data_type: varchar
      description: 关联企业 code。
      evidence_refs:
      - ev-cust-customized-product-fields
    evidence_refs:
    - ev-cust-customized-product-fields
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据，本单元作为关联锚点。
    fields:
    - field_id: id
      name: id
      data_type: bigint
