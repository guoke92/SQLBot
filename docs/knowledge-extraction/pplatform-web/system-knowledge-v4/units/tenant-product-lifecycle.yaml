    - field_id: readonly
      name: readonly
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-ext-field-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-ext-field-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: ref_tenant_ext_field_tenant_product
      name: ref_tenant_ext_field_tenant_product
      data_type: varchar
      description: 关联租户产品 code。
      evidence_refs:
      - ev-tenant-product-ext-field-fields
    evidence_refs:
    - ev-tenant-product-ext-field-fields
  - dataset_id: tenant_product_ext_field_form
    name: tenant_product_ext_field_form
    database: lowcode_pplatform
    description: 租户产品扩展字段表单分组。
    fields:
    - field_id: id
      name: id
