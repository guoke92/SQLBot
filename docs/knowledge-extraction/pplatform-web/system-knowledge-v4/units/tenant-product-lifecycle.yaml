  metrics:
  - metric_id: opened-tenant-product-count
    name: 已开通租户产品数
    description: 启用且开通完成的租户产品实例数，按平台产品统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: tenant_product
      field: id
    grain:
    - dataset: tenant_product
      field: platform_product_code
    evidence_refs:
    - ev-tenant-product-opened-query
    - ev-profile-tenant-product
  - metric_id: tenant-product-count-by-open-status
    name: 租户产品开通状态分布
    description: 按 Y/P/N 开通状态统计租户产品实例数。
    aggregation: COUNT
    field:
      dataset: tenant_product
      field: id
    grain:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-product-open-ynp
    - ev-profile-tenant-product
  calibers:
  - caliber_id: opened-tenant-product
    label: 已开通租户产品
    description: 启用且开通完成的租户产品。
    contract_fragment:
      predicates:
      - field: tenant_product.open_status
        operator: eq
        values:
        - Y
      - field: tenant_product.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_product
      field: open_status
    - dataset: tenant_product
      field: enable
    evidence_refs:
    - ev-tenant-product-opened-query
    - ev-product-open-ynp
  domain_rules:
  - rule_id: tenant-product-open-is-ynp
    label: 租户产品开通不是 OPENED
    content: tenant_product.open_status 只用 Y/P/N。企业申请表的 OPENED/OPENING/NOT_OPENED
      属于另一单元。
    applicability: 已开通产品、开通中产品
    query_impact: 过滤必须使用 Y/P/N，禁止 OPENED
    field_targets:
    - dataset: tenant_product
      field: open_status
    evidence_refs:
    - ev-product-open-ynp
    - ev-auth-application-dict
  verified_query_patterns:
  - pattern_id: count-opened-tenant-products
    question: 已开通的租户产品有多少
    query: "SELECT COUNT(1) AS opened_tenant_product_count\nFROM tenant_product\n\
      WHERE open_status = 'Y'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: tenant_product
      caliber_id: opened-tenant-product
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-tenant-product-opened-query
    - ev-profile-tenant-product
evidence_refs:
- ev-tenant-product-endpoint
- ev-tenant-product-fields
- ev-platform-product-fields
- ev-product-open-ynp
- ev-tenant-product-opened-query
- ev-tenant-product-active-write
- ev-profile-tenant-product
- ev-auth-application-dict
- ev-platform-product-client-fields
- ev-platform-product-cust-role-fields
- ev-tenant-product-ext-field-fields
- ev-tenant-product-ext-field-form-fields
- ev-cust-customized-product-fields
- ev-company-fields
- ev-tenant-setting-fields
assumptions:
- 查询范例未在目标库逐条执行。
conflicts:
- topic: 两套开通字典
  parties:
  - src-product-open-enum
  - src-product-active-const
  summary: 租户产品 Y/P/N；企业申请 OPENED/OPENING/NOT_OPENED。按表选字典，不要混用。
confidence: 0.92
