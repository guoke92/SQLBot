unit_id: tenant-product-lifecycle
revision: 1
title: 租户产品开通
aliases:
- 开通产品
- 待激活产品
- 取消产品
domain: product
applicability: 租户已开通/开通中/未开通产品数；不用于企业侧 OPENED 申请，也不用于项目生效
description: 租户在平台产品目录上的开通实例是 tenant_product。开通状态物理值是 Y/P/N。
content:
  concepts:
  - concept_id: tenant-product
    name: 租户产品
    aliases:
    - 开通产品
    definition: 某租户对平台产品的开通记录，对应表 tenant_product。
    evidence_refs:
    - ev-tenant-product-fields
    - ev-platform-product-fields
  - concept_id: tenant-product-open
    name: 租户产品开通状态
    aliases:
    - 已开通
    - 开通中
    - 未开通
    definition: tenant_product.open_status，值是 Y/P/N。
    dictionary:
      Y: 已开通
      P: 开通中
      N: 未开通
    evidence_refs:
    - ev-product-open-ynp
    - ev-profile-tenant-product
  processes:
  - stage_id: active-tenant-product
    name: 开通租户产品
    trigger: POST /app-web/tenantProduct/cmd/active
    enter_conditions:
    - 租户产品行已存在
    exit_conditions:
    - open_status 进入开通完成或开通中
    next_stages:
    - cancel-tenant-product
    data_effects:
    - operation: update
      dataset: tenant_product
      fields:
      - open_status
      description: 开通完成写 Y；过程中可写 P。
      evidence_refs:
      - ev-tenant-product-active-write
      - ev-tenant-product-endpoint
    evidence_refs:
    - ev-tenant-product-endpoint
    - ev-tenant-product-active-write
  - stage_id: cancel-tenant-product
    name: 取消租户产品
    trigger: POST /app-web/tenantProduct/cmd/cancel
    enter_conditions:
    - 租户产品已开通或开通中
    exit_conditions:
    - 产品取消开通
    data_effects:
    - operation: update
      dataset: tenant_product
      fields:
      - open_status
      evidence_refs:
      - ev-tenant-product-endpoint
    evidence_refs:
    - ev-tenant-product-endpoint
  datasets:
  - dataset_id: tenant_product
    name: tenant_product
    database: lowcode_pplatform
    description: 租户产品开通实例。已开通口径是 open_status='Y' AND enable='Y'。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: platform_product_id
      name: platform_product_id
      data_type: bigint
      evidence_refs:
      - ev-tenant-product-fields
      - ev-platform-product-fields
    - field_id: platform_product_code
      name: platform_product_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: open_status
      name: open_status
      data_type: varchar
      evidence_refs:
      - ev-product-open-ynp
      - ev-profile-tenant-product
      dictionary:
        Y: 已开通
        P: 开通中
        N: 未开通
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 业务键，关联扩展字段/扩展表单的 ref 列。
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: ref_tenant_product_project_code
      name: ref_tenant_product_project_code
      data_type: varchar
      description: 关联平台产品 code。
      evidence_refs:
      - ev-tenant-product-fields
    - field_id: ref_tenant_product_tenant_setting_config
      name: ref_tenant_product_tenant_setting_config
      data_type: varchar
      description: 关联租户配置 code。
      evidence_refs:
      - ev-tenant-product-fields
    evidence_refs:
    - ev-tenant-product-fields
  - dataset_id: platform_product
    name: platform_product
    database: lowcode_pplatform
    description: 平台产品目录，不是租户开通实例。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-platform-product-fields
    - field_id: code
      name: code
      data_type: varchar
      evidence_refs:
      - ev-platform-product-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-platform-product-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-platform-product-fields
    evidence_refs:
    - ev-platform-product-fields
  - dataset_id: platform_product_client
    name: platform_product_client
    database: lowcode_pplatform
    description: 平台产品客户端入口，url 为入口地址。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: platform_product_id
      name: platform_product_id
      data_type: bigint
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: url
      name: url
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: client_type
      name: client_type
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: multiple_type
      name: multiple_type
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: wx_flag
      name: wx_flag
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: link_type
      name: link_type
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-platform-product-client-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-platform-product-client-fields
  - dataset_id: platform_product_cust_role
    name: platform_product_cust_role
    database: lowcode_pplatform
    description: 平台产品按企业类型的角色配置。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-platform-product-cust-role-fields
    - field_id: product_code
      name: product_code
      data_type: varchar
      evidence_refs:
      - ev-platform-product-cust-role-fields
    - field_id: company_type_code
      name: company_type_code
      data_type: varchar
      evidence_refs:
      - ev-platform-product-cust-role-fields
    - field_id: company_type_name
      name: company_type_name
      data_type: varchar
      evidence_refs:
      - ev-platform-product-cust-role-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-platform-product-cust-role-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-platform-product-cust-role-fields
  - dataset_id: tenant_product_ext_field
    name: tenant_product_ext_field
    database: lowcode_pplatform
    description: 租户产品扩展字段定义。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
