unit_id: project-enterprise-rel
revision: 1
title: 企业关联租户项目
aliases:
- 关联项目
- 项目成员企业
- 开通项目
domain: project
applicability: 某企业加入了哪些项目、某项目下有哪些企业、项目开通状态；不用于统计建档成功企业总数
description: '企业在建档之后按客户角色、租户产品和租户项目写入 cust_project_rel。 租户项目是 tenant_project 上的业务项目实例，不是
  ERP 泛项目。 开通状态真实值为 Y/N/P；已生效项目的库值是 ''1''。

  '
content:
  concepts:
  - concept_id: tenant-project
    name: 租户项目
    aliases:
    - 项目配置
    - 业务项目
    definition: 某租户在已开通产品下的可运营项目实例，对应表 tenant_project。
    evidence_refs:
    - ev-doc-project
    - ev-tenant-project-fields
  - concept_id: project-rel
    name: 企业项目关联
    aliases:
    - 关联项目
    - 项目成员
    definition: 一行表示某企业以某角色绑定某租户项目，不是企业主数据。
    evidence_refs:
    - ev-project-rel-fields
    - ev-relate-impl
  - concept_id: project-open
    name: 项目开通
    aliases:
    - 已开通
    - 开通中
    definition: 关系表上的开通状态，值是 Y/P/N，不是 OPENED。
    dictionary:
      Y: 已开通
      P: 开通中
      N: 未开通
    evidence_refs:
    - ev-open-status-dict
    - ev-project-rel-fields
  processes:
  - stage_id: relate-project
    name: 关联项目
    trigger: POST /cust-web/custInfo/relateProject
    enter_conditions:
    - 企业已存在
    - 选择客户角色/产品/项目
    exit_conditions:
    - 写入或更新 cust_project_rel
    data_effects:
    - operation: upsert
      dataset: project_rel
      fields:
      - project_id
      - product_id
      - company_type
      - company_code
      description: 同企业同角色不可重复绑定同一项目；可能先填空项目再补 project_id。
      evidence_refs:
      - ev-relate-impl
      - ev-relate-endpoint
    evidence_refs:
    - ev-relate-impl
    - ev-relate-endpoint
    - ev-doc-project
  datasets:
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。本单元通过 code 连接项目关系，统计企业数时应回到建档单元口径。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    - field_id: code
      name: code
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      - ev-strict-caliber
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-company-fields
    - field_id: build_status
      name: cust_build_status
      data_type: varchar
      dictionary:
        BUILD_SUCCESS: 认证成功
        CUST_BUILDING: 审核中
      evidence_refs:
      - ev-build-status-dict
    - field_id: company_status
      name: cust_status
      data_type: varchar
      dictionary:
        EFFECT: 生效
      evidence_refs:
      - ev-cust-status-dict
    - field_id: enabled
      name: enable
      data_type: varchar
      dictionary:
        Y: 启用
      evidence_refs:
      - ev-company-fields
    - field_id: data_type
      name: data_type
      data_type: varchar
      dictionary:
        '1': 正式企业主数据
      evidence_refs:
      - ev-data-type-main
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  - dataset_id: project_rel
    name: cust_project_rel
    database: lowcode_pplatform
    description: 项目—企业—角色关系。企业引用连接 cust_company_info.code。project_id 存 tenant_project.id
      的字符串。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-project-rel-fields
    - field_id: project_id
      name: project_id
      data_type: varchar
      description: 租户项目主键的字符串形式。
      evidence_refs:
      - ev-project-rel-fields
      - ev-relate-impl
    - field_id: product_id
      name: product_id
      data_type: varchar
      description: 租户产品 ID 的字符串，派生自 tenant_project.product_id（反规范化拷贝），真外键是 tenant_project.product_id
        → tenant_product.id，不是直连 tenant_product。
      evidence_refs:
      - ev-project-rel-fields
    - field_id: company_type
      name: company_type
      data_type: varchar
      dictionary:
        CORE: 核心企业
        FINANCE: 金融机构
        SUPPLIER: 供应商
        DEALER: 经销商
        CORPORATION_COMPANY: 集团公司
      evidence_refs:
      - ev-company-type-dict
      - ev-project-rel-fields
    - field_id: project_open_status
      name: project_open_status
      data_type: varchar
      dictionary:
        Y: 已开通
        P: 开通中
        N: 未开通
      evidence_refs:
      - ev-open-status-dict
      - ev-project-rel-fields
    - field_id: company_code
      name: ref_cust_project_rel_cust_company_info
      data_type: varchar
      description: 企业业务键，连接 cust_company_info.code，不是企业 id。
      evidence_refs:
      - ev-project-rel-fields
      - ev-strict-caliber
    - field_id: enable
      name: enable
      data_type: varchar
      dictionary:
        Y: 启用
        N: 停用
      evidence_refs:
      - ev-project-rel-fields
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-project-rel-fields
    evidence_refs:
    - ev-project-rel-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 租户在某产品下的业务项目实例。已生效状态库值为 '1'。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: product_id
      name: product_id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: project_status
      name: project_status
      data_type: varchar
      dictionary:
        '0': 待生效
        '1': 已生效
        '2': 已失效
      evidence_refs:
      - ev-project-status-dict
      - ev-tenant-project-fields
    - field_id: enable
      name: enable
      data_type: varchar
      dictionary:
        Y: 启用
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: tenant_flg_en
      name: tenant_flg_en
      data_type: varchar
      evidence_refs:
      - ev-tenant-project-fields
    - field_id: project_effective_time
      name: project_effective_time
      data_type: timestamp
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  relationships:
  - relationship_id: company-project-rel
    left:
      dataset: company
      field: code
    right:
      dataset: project_rel
      field: company_code
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一家企业可按不同角色绑定多个租户项目
    status: proposed
    evidence_refs:
    - ev-strict-caliber
    - ev-project-rel-fields
  - relationship_id: project-rel-tenant-project
    left:
      dataset: project_rel
      field: project_id
    right:
      dataset: tenant_project
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 关系上的 project_id 是 tenant_project.id 的字符串形式（字符串转数字），JOIN 需 CAST 类型转换
    status: proposed
    evidence_refs:
    - ev-relate-impl
    - ev-tenant-project-fields
  metrics:
  - metric_id: companies-in-project-count
    name: 项目内企业数
    description: 企业项目关联中按项目统计的企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: project_rel
      field: company_code
    grain:
    - dataset: project_rel
      field: project_id
    evidence_refs:
    - ev-project-rel-fields
    - ev-profile-project-rel-open
  - metric_id: opened-projects-of-company-count
    name: 企业已开通项目数
    description: 企业已开通的项目数，按企业统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: project_rel
      field: id
    grain:
    - dataset: project_rel
      field: company_code
    evidence_refs:
    - ev-open-status-dict
    - ev-profile-project-rel-open
  calibers:
  - caliber_id: opened-project-rel
    label: 已开通的企业项目关系
    description: 启用且开通完成的项目绑定。统计企业数时仍应按企业去重并叠加建档口径。
    contract_fragment:
      predicates:
      - field: project_rel.project_open_status
        operator: eq
        values:
        - Y
      - field: project_rel.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: project_rel
      field: project_open_status
    - dataset: project_rel
      field: enable
    evidence_refs:
    - ev-open-status-dict
    - ev-project-rel-fields
  - caliber_id: effective-tenant-project
    label: 已生效租户项目
    description: 企业下拉可选项目来自已生效租户项目，库值是 '1' 不是 EFFECTIVE。
    contract_fragment:
      predicates:
      - field: tenant_project.project_status
        operator: eq
        values:
        - '1'
      - field: tenant_project.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: tenant_project
      field: project_status
    - dataset: tenant_project
      field: enable
    evidence_refs:
    - ev-effective-project
    - ev-project-status-dict
  - caliber_id: project-member-built-company
    label: 项目下有效已建档企业
    description: 按项目统计成员企业时，关系行去重到企业，并套用建档成功口径。
    contract_fragment:
      predicates:
      - field: project_rel.enable
        operator: eq
        values:
        - Y
      - field: company.build_status
        operator: eq
        values:
        - BUILD_SUCCESS
      - field: company.company_status
        operator: eq
        values:
        - EFFECT
      - field: company.enabled
        operator: eq
        values:
        - Y
      - field: company.data_type
        operator: eq
        values:
        - '1'
    field_targets:
    - dataset: project_rel
      field: enable
    - dataset: project_rel
      field: company_code
    - dataset: company
      field: build_status
    - dataset: company
      field: company_status
    - dataset: company
      field: enabled
    - dataset: company
      field: data_type
    evidence_refs:
    - ev-strict-caliber
  domain_rules:
  - rule_id: join-company-by-code
    label: 项目关系按企业 code 连接
    content: cust_project_rel 通过 ref_cust_project_rel_cust_company_info 连接 cust_company_info.code，禁止按企业
      id 臆造 JOIN。
    applicability: 项目成员、资金方、核心企业查询
    query_impact: JOIN 必须使用 company.code = project_rel.company_code
    field_targets:
    - dataset: company
      field: code
    - dataset: project_rel
      field: company_code
    evidence_refs:
    - ev-strict-caliber
    - ev-project-rel-fields
  - rule_id: open-status-is-ynp
    label: 开通状态不是 OPENED
    content: 项目开通状态字段是 project_open_status，值为 Y/P/N。
    applicability: 已开通项目、开通中项目
    query_impact: 过滤必须使用 Y/P/N，不能使用 OPENED/OPENING
    field_targets:
    - dataset: project_rel
      field: project_open_status
    evidence_refs:
    - ev-open-status-dict
  - rule_id: rel-row-is-not-company
    label: 关系行不是企业
    content: 统计企业数必须按企业 code/id 去重，禁止直接 COUNT(cust_project_rel)。
    applicability: 项目企业数、开通企业数
    query_impact: grain 必须是 company，关系表只提供存在性过滤
    field_targets:
    - dataset: company
      field: code
    - dataset: project_rel
      field: company_code
    evidence_refs:
    - ev-project-rel-fields
    - ev-strict-caliber
  verified_query_patterns:
  - pattern_id: companies-in-project
    question: 某项目下有效已建档企业有哪些
    query: "SELECT DISTINCT cci.id, cci.code, cci.name FROM cust_project_rel cpl JOIN\
      \ cust_company_info cci\n  ON cci.code = cpl.ref_cust_project_rel_cust_company_info\n\
      WHERE cpl.project_id = :project_id\n  AND cpl.enable = 'Y'\n  AND cci.cust_build_status\
      \ = 'BUILD_SUCCESS'\n  AND cci.cust_status = 'EFFECT'\n  AND cci.enable = 'Y'\n\
      \  AND cci.data_type = '1'\n"
    intended_specification:
      grain: company
      caliber_id: project-member-built-company
    evidence_refs:
    - ev-strict-caliber
    verification:
      status: PENDING_VALIDATION
  - pattern_id: opened-projects-of-company
    question: 某企业已开通哪些项目
    query: "SELECT tp.id, tp.name, cpl.company_type, cpl.project_open_status FROM\
      \ cust_project_rel cpl JOIN tenant_project tp\n  ON CAST(tp.id AS CHAR) = cpl.project_id\n\
      JOIN cust_company_info cci\n  ON cci.code = cpl.ref_cust_project_rel_cust_company_info\n\
      WHERE cci.id = :company_id\n  AND cpl.enable = 'Y'\n  AND cpl.project_open_status\
      \ = 'Y'\n"
    intended_specification:
      grain: project_rel
      caliber_id: opened-project-rel
    evidence_refs:
    - ev-relate-impl
    - ev-open-status-dict
    - ev-tenant-project-fields
    verification:
      status: PENDING_VALIDATION
evidence_refs:
- ev-relate-endpoint
- ev-relate-impl
- ev-project-rel-fields
- ev-tenant-project-fields
- ev-strict-caliber
- ev-open-status-dict
- ev-project-status-dict
assumptions:
- project_id 与 tenant_project.id 的字符串转换方言待绑定数据源后确认。
- 未验证生产环境 project_open_status 空值含义。
- 金融机构跨租户例外只影响写入校验，问数仍应按实际落库的 db_tenant_code 过滤。
conflicts:
- topic: 关联项目接口路径
  parties:
  - src-doc-project-rel
  - src-controller
  summary: 文档写 POST /app-web/custCompanyInfo/relateProject，代码为 POST /cust-web/custInfo/relateProject。问数与溯源以代码为准。
confidence: 0.9
