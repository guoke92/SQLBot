unit_id: enterprise-certification
revision: 1
title: 企业实名认证与企业账户
aliases:
- 实名认证
- 企业认证
- 收款账户
- 打款验证
domain: enterprise
applicability: 企业实名认证结果与企业收款/付款账户；不用于 CA 数字证书签约认证
description: 企业工商/法人/人脸等实名认证在 cust_certification_info，企业银行账户在 cust_account_info，两者均通过 ref_cust_company_info 关联企业主数据。
content:
  concepts:
  - concept_id: enterprise-certification
    name: 企业实名认证
    aliases:
    - 认证
    - 四要素
    - 二要素
    definition: 企业工商/法人/人脸等实名认证记录，一行一次认证。
    evidence_refs:
    - ev-cert-info-fields
  - concept_id: enterprise-account
    name: 企业账户
    aliases:
    - 银行账户
    - 收款账户
    definition: 企业收款/付款银行账户，account_type 区分银行/第三方/开票。
    dictionary:
      '1': 银行
      '2': 第三方支付机构
      '3': 开票
    evidence_refs:
    - ev-account-info-fields
    - ev-account-type-dict
  datasets:
  - dataset_id: certification
    name: cust_certification_info
    database: lowcode_pplatform
    description: 企业实名认证记录。auto_verify_status/manual_verify_status 描述自动/人工核查结果。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-cert-info-fields
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业主数据 code。
      evidence_refs:
      - ev-cert-info-fields
    - field_id: certification_type
      name: certification_type
      data_type: varchar
      evidence_refs:
      - ev-cert-info-fields
      - ev-cert-type-dict
      dictionary:
        COMPANY_FOUR_ELEMENTS: 企业工商（四要素）认证
        COMPANY_TWO_ELEMENTS: 企业工商（二要素）认证
        LEGAL_THREE_ELEMENTS: 法人三要素认证
        LEGAL_REAL_NAME: 法人实名认证
        FACE_VERIFY: 人脸识别认证
        AUTH_THREE_ELEMENTS: 客户管理员三要素认证
        AUTH_REAL_NAME: 客户管理员实名认证
        LEGAL_OCR: 法人身份证OCR比对
        AUTH_OCR: 客户管理员身份证OCR比对
        LICENSE_OCR: 营业执照OCR比对
        LEGAL_MEDIA_OCR: 法人证件核查比对
        AUTH_MEDIA_OCR: 客户管理员证件核查比对
    - field_id: auto_verify_status
      name: auto_verify_status
      data_type: varchar
      evidence_refs:
      - ev-cert-info-fields
      - ev-cert-result-dict
      dictionary:
        TO_BE_VERIFIED: 待核查
        AUTOMATIC_AUTHENTICATION_PASSED: 自动认证通过
        AUTOMATIC_AUTHENTICATION_FAILED: 自动认证不通过
        MANUAL_AUTHENTICATION_PASSED: 人工认证通过
        MANUAL_AUTHENTICATION__FAILED: 人工认证不通过
        NO_RECORD: 库无记录
    - field_id: manual_verify_status
      name: manual_verify_status
      data_type: varchar
      evidence_refs:
      - ev-cert-info-fields
      - ev-cert-result-dict
      dictionary:
        TO_BE_VERIFIED: 待核查
        AUTOMATIC_AUTHENTICATION_PASSED: 自动认证通过
        AUTOMATIC_AUTHENTICATION_FAILED: 自动认证不通过
        MANUAL_AUTHENTICATION_PASSED: 人工认证通过
        MANUAL_AUTHENTICATION__FAILED: 人工认证不通过
        NO_RECORD: 库无记录
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-cert-info-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-cert-info-fields
  - dataset_id: account
    name: cust_account_info
    database: lowcode_pplatform
    description: 企业银行账户。account_type 区分银行/第三方/开票，receive_payment_type 区分收款/付款。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-account-info-fields
    - field_id: ref_cust_company_info
      name: ref_cust_company_info
      data_type: varchar
      description: 关联企业主数据 code。
      evidence_refs:
      - ev-account-info-fields
    - field_id: account_no
      name: account_no
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
    - field_id: account_type
      name: account_type
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
      - ev-account-type-dict
      dictionary:
        '1': 银行
        '2': 第三方支付机构
        '3': 开票
    - field_id: receive_payment_type
      name: receive_payment_type
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
      - ev-receive-payment-dict
      dictionary:
        '1': 收款
        '2': 付款
    - field_id: default_account_flag
      name: default_account_flag
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
      dictionary:
        Y: 默认账户
        N: 非默认账户
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
    - field_id: auth_state
      name: auth_state
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
      - ev-account-auth-state-dict
      dictionary:
        APPLY_00: 初始化
        APPLY_10: 申请受理中
        APPLY_20: 受理打款成功
        APPLY_30: 受理打款失败
        APPLY_40: 成功
        APPLY_50: 失败
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-account-info-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-account-info-fields
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。最小声明：仅用于认证记录按 code 关联企业，企业统计口径回 enterprise-onboarding。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    - field_id: code
      name: code
      data_type: varchar
      description: 企业业务键。
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  relationships:
  - relationship_id: certification-account-company
    left:
      dataset: certification
      field: ref_cust_company_info
    right:
      dataset: account
      field: ref_cust_company_info
    relationship_type: SHARED_KEY
    cardinality: n:n
    business_meaning: 两侧 ref_cust_company_info 业务含义相同（都是企业 code）、取值一致，属共享企业维度。串联时各自 JOIN 到 cust_company_info.code，不得直接 JOIN 彼此（n:n 会笛卡尔积）。
    status: proposed
    evidence_refs:
    - ev-cert-info-fields
    - ev-account-info-fields
  - relationship_id: certification-company
    left:
      dataset: certification
      field: ref_cust_company_info
    right:
      dataset: company
      field: code
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 认证记录通过 ref_cust_company_info 关联企业主数据 code
    status: proposed
    evidence_refs:
    - ev-cert-info-fields
    - ev-company-fields
  metrics:
  - metric_id: cert-company-count
    name: 已实名认证企业数
    description: 存在自动或人工认证通过的认证记录的企业数。
    aggregation: COUNT_DISTINCT
    field:
      dataset: certification
      field: ref_cust_company_info
    evidence_refs:
    - ev-cert-info-fields
    - ev-cert-result-dict
  - metric_id: account-count-by-type
    name: 企业账户类型分布
    description: 按账户类型统计企业账户数。
    aggregation: COUNT
    field:
      dataset: account
      field: id
    grain:
    - dataset: account
      field: account_type
    evidence_refs:
    - ev-account-info-fields
    - ev-account-type-dict
  calibers:
  - caliber_id: verified-enterprise
    label: 已通过实名认证的企业
    description: 自动或人工认证状态为通过的认证记录对应的企业。
    contract_fragment:
      predicates:
      - field: certification.auto_verify_status
        operator: eq
        values:
        - AUTOMATIC_AUTHENTICATION_PASSED
      - field: certification.manual_verify_status
        operator: eq
        values:
        - MANUAL_AUTHENTICATION_PASSED
    field_targets:
    - dataset: certification
      field: auto_verify_status
    - dataset: certification
      field: manual_verify_status
    evidence_refs:
    - ev-cert-info-fields
    - ev-cert-result-dict
  domain_rules:
  - rule_id: cert-status-not-enable
    label: 认证结果不是 enable
    content: 是否认证通过看 auto/manual_verify_status，enable 只表示行是否可用。
    applicability: 已认证企业、未认证企业
    query_impact: 统计认证通过必须过滤认证状态，不能只过滤 enable='Y'
    field_targets:
    - dataset: certification
      field: auto_verify_status
    - dataset: certification
      field: manual_verify_status
    evidence_refs:
    - ev-cert-result-dict
  verified_query_patterns:
  - pattern_id: count-verified-companies
    question: 已通过实名认证的企业有多少
    query: "SELECT COUNT(DISTINCT ref_cust_company_info) AS verified_company_count\n\
      FROM cust_certification_info\nWHERE auto_verify_status = 'AUTOMATIC_AUTHENTICATION_PASSED'\n\
      \  OR manual_verify_status = 'MANUAL_AUTHENTICATION_PASSED'\n"
    intended_specification:
      grain: certification
      caliber_id: verified-enterprise
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-cert-info-fields
    - ev-cert-result-dict
evidence_refs:
- ev-cert-info-fields
- ev-cert-type-dict
- ev-cert-result-dict
- ev-account-info-fields
- ev-account-type-dict
- ev-receive-payment-dict
- ev-account-auth-state-dict
- ev-company-fields
assumptions:
- 认证与账户均通过 ref_cust_company_info 关联企业主数据 code，JOIN 字段类型待连库确认。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.82
