unit_id: openapi-access
revision: 1
title: OpenAPI 渠道密钥
aliases:
- 接入秘钥
- 同步失败
domain: openapi
applicability: 有效渠道密钥；同步失败历史。不要把 enable=N 的失败行当待重试
description: 有效密钥是 cust_access_secret.channel + enable=Y。同步失败表当前画像全部 enable=N。
content:
  concepts:
  - concept_id: access-secret
    name: 渠道接入密钥
    aliases:
    - OpenAPI 密钥
    definition: 按 channel 落库的接入密钥，enable=Y 才有效。
    evidence_refs:
    - ev-access-secret-fields
    - ev-access-secret-query
  processes:
  - stage_id: resolve-channel-secret
    name: 解析渠道密钥
    trigger: CustAccessApplication 按 channel 取密钥
    enter_conditions:
    - channel 已知
    exit_conditions:
    - enable=Y 的 cust_access_secret
    data_effects:
    - operation: read
      dataset: access_secret
      fields:
      - channel
      - enable
      evidence_refs:
      - ev-access-secret-query
    evidence_refs:
    - ev-access-endpoint
    - ev-access-secret-query
  datasets:
  - dataset_id: access_secret
    name: cust_access_secret
    database: lowcode_pplatform
    description: 渠道密钥。不要把密钥原文写入查询口径。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-access-secret-fields
    - field_id: channel
      name: channel
      data_type: varchar
      evidence_refs:
      - ev-access-secret-fields
      - ev-access-secret-query
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-access-secret-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: encry_type
      name: encry_type
      data_type: varchar
      evidence_refs:
      - ev-access-secret-fields
    evidence_refs:
    - ev-access-secret-fields
  - dataset_id: sync_error
    name: client_api_sync_error
    database: lowcode_pplatform
    description: 同步失败记录。当前画像全部 enable=N，不能当待重试队列。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-sync-error-fields
    - field_id: service_class_name
      name: service_class_name
      data_type: varchar
      evidence_refs:
      - ev-sync-error-fields
    - field_id: retry_num
      name: retry_num
      data_type: int
      evidence_refs:
      - ev-sync-error-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-sync-error-fields
      - ev-profile-openapi
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-sync-error-fields
  relationships: []
  metrics:
  - metric_id: enabled-access-secret-count
    name: 有效渠道密钥数
    description: 已启用的渠道接入密钥数，按渠道统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: access_secret
      field: id
    grain:
    - dataset: access_secret
      field: channel
    evidence_refs:
    - ev-access-secret-query
    - ev-profile-openapi
  calibers:
  - caliber_id: enabled-access-secret
    label: 有效渠道密钥
    description: enable=Y。
    contract_fragment:
      predicates:
      - field: access_secret.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: access_secret
      field: enable
    evidence_refs:
    - ev-access-secret-query
    - ev-profile-openapi
  domain_rules:
  - rule_id: sync-error-enable-n-not-retry
    label: enable=N 不是待重试
    content: 当前库中 client_api_sync_error 全部 enable=N，不能解释为待重试失败。
    applicability: 同步失败、待重试
    query_impact: 若问待重试必须过滤 enable='Y'；当前画像结果应为 0
    field_targets:
    - dataset: sync_error
      field: enable
    evidence_refs:
    - ev-profile-openapi
    - ev-sync-error-fields
  verified_query_patterns:
  - pattern_id: count-enabled-access-secrets
    question: 有效 OpenAPI 渠道密钥有多少
    query: 'SELECT COUNT(1) AS enabled_access_secret_count

      FROM cust_access_secret

      WHERE enable = ''Y''

      '
    intended_specification:
      grain: access_secret
      caliber_id: enabled-access-secret
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-access-secret-query
    - ev-profile-openapi
evidence_refs:
- ev-access-endpoint
- ev-access-secret-fields
- ev-access-secret-query
- ev-sync-error-fields
- ev-profile-openapi
assumptions:
- 不提取密钥/私钥字段进入问数口径。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.85
