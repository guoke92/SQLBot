unit_id: person-user
revision: 1
title: 企业联系人与管理员
aliases:
- 企业用户
- 管理员
- 经办人
domain: enterprise
applicability: 已生效联系人、企业管理员；不要用仅 1 行的 cust_user_rel 当事实表，也不要统计建档企业数
description: 联系人在 cust_person_info，企业角色在 cust_role_info，都通过企业 code 连接。
content:
  concepts:
  - concept_id: cust-person
    name: 企业联系人
    aliases:
    - 用户
    - 管理员
    definition: 企业下的联系人账号。状态 ADD/EFFECT/WRITEOFF；类型 accountAdmin/accountNormal/accountGuest。
    dictionary:
      ADD: 新增
      EFFECT: 生效
      WRITEOFF: 注销
      accountAdmin: 管理员
      accountNormal: 经办人
      accountGuest: 游客
    evidence_refs:
    - ev-person-fields
    - ev-person-status-dict
    - ev-user-type-dict
  processes:
  - stage_id: query-admin
    name: 查询企业管理员
    trigger: POST /cust-web/custPerson/getAdminByCurCompanyInfo
    enter_conditions:
    - 企业 code 已知
    exit_conditions:
    - 返回 status=EFFECT 且 user_type=accountAdmin 的联系人
    data_effects:
    - operation: read
      dataset: person
      fields:
      - status
      - user_type
      - company_code
      - enable
      evidence_refs:
      - ev-person-endpoint
    evidence_refs:
    - ev-person-endpoint
  datasets:
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。本单元通过 id 或 code 连接，统计建档成功数应回到 enterprise-onboarding。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    - field_id: code
      name: code
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      description: 企业业务键。
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-company-fields
    - field_id: build_status
      name: cust_build_status
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      dictionary:
        INIT: 初始化
        TO_BE_BUILD: 未建档
        BUILDING: 建档中
        BUILD_SUCCESS: 认证成功
        BUILD_FAIL: 认证失败
        BUILD_BACK: 退回
        BUILD_ACTIVATE: 待激活
        CUST_CONFIRM_AWAIT: 待客户认证
        CUST_AUDIT_AWAIT: 待审核
        CUST_BUILDING: 审核中
        CUST_BUILD_SUCCESS: 审核通过
        CUST_BUILD_FAIL: 审核拒绝
        CUST_CHANGE: 变更
        AWAIT_CUST_CONFIRM: 待客户确认
    - field_id: company_status
      name: cust_status
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      dictionary:
        ADD: 新增
        EFFECT: 生效
        FAILURE: 失效
        WRITEOFF: 注销
        FREEZE: 冻结
        CHANGE: 变更
    - field_id: enabled
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: data_type
      name: data_type
      data_type: varchar
      evidence_refs:
      - ev-company-fields
      dictionary:
        '1': 正式企业主数据
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  - dataset_id: person
    name: cust_person_info
    database: lowcode_pplatform
    description: 企业联系人。ref_cust_company_info 是企业 code。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-person-fields
    - field_id: name
      name: name
      data_type: varchar
      evidence_refs:
      - ev-person-fields
    - field_id: company_code
      name: ref_cust_company_info
      data_type: varchar
      evidence_refs:
      - ev-person-fields
      - ev-person-endpoint
      description: 企业业务键，连接 cust_company_info.code。
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-person-status-dict
      - ev-profile-person
      dictionary:
        ADD: 新增
        EFFECT: 生效
        WRITEOFF: 注销
    - field_id: user_type
      name: user_type
      data_type: varchar
      evidence_refs:
      - ev-user-type-dict
      dictionary:
        accountAdmin: 管理员
        accountNormal: 经办人
        accountGuest: 游客
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-person-fields
      dictionary:
        Y: 启用
        N: 停用
    - field_id: user_id
      name: user_id
      data_type: bigint
      evidence_refs:
      - ev-person-fields
    - field_id: db_tenant_code
      name: db_tenant_code
      data_type: varchar
      evidence_refs:
      - ev-person-fields
    evidence_refs:
    - ev-person-fields
  - dataset_id: role
    name: cust_role_info
    database: lowcode_pplatform
    description: 企业在某角色上的记录。JOIN 企业用 code。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-role-fields
    - field_id: company_code
      name: ref_cust_company_info
      data_type: varchar
      evidence_refs:
      - ev-role-fields
      - ev-role-join-code
    - field_id: role_type
      name: role_type
      data_type: varchar
      evidence_refs:
      - ev-role-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-role-status-write
      - ev-cust-status-dict
      dictionary:
        ADD: 新增
        EFFECT: 生效
        WRITEOFF: 注销
        FREEZE: 冻结
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-role-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-role-fields
  - dataset_id: user_rel
    name: cust_user_rel
    database: lowcode_pplatform
    description: 用户-企业关系。仅作为关联关系，不作为人员事实主表。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-user-rel-fields
    - field_id: user_id
      name: user_id
      data_type: bigint
      evidence_refs:
      - ev-user-rel-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-user-rel-fields
    - field_id: company_type
      name: company_type
      data_type: varchar
      evidence_refs:
      - ev-user-rel-fields
    - field_id: type_status
      name: type_status
      data_type: varchar
      evidence_refs:
      - ev-user-rel-fields
    - field_id: user_type
      name: user_type
      data_type: varchar
      evidence_refs:
      - ev-user-rel-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-user-rel-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-user-rel-fields
  relationships:
  - relationship_id: user-rel-company
    left:
      dataset: user_rel
      field: company_id
    right:
      dataset: company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 用户-企业关系指向企业。
    status: proposed
    evidence_refs:
    - ev-user-rel-fields

  - relationship_id: company-person
    left:
      dataset: company
      field: code
    right:
      dataset: person
      field: company_code
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一家企业多个联系人
    status: proposed
    evidence_refs:
    - ev-person-endpoint
    - ev-person-fields
  - relationship_id: company-role
    left:
      dataset: company
      field: code
    right:
      dataset: role
      field: company_code
    relationship_type: EQUI_JOIN
    cardinality: 1:n
    business_meaning: 一家企业多个角色记录
    status: proposed
    evidence_refs:
    - ev-role-join-code
  metrics:
  - metric_id: effective-person-count
    name: 已生效企业人员数
    description: 已生效的企业联系人/管理员数，按用户类型统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: person
      field: id
    grain:
    - dataset: person
      field: user_type
    evidence_refs:
    - ev-person-status-dict
    - ev-profile-person
  - metric_id: effective-admin-count
    name: 企业管理员数
    description: 用户类型为管理员且已生效的人员数，按企业统计。
    aggregation: COUNT_DISTINCT
    field:
      dataset: person
      field: id
    grain:
    - dataset: person
      field: company_code
    evidence_refs:
    - ev-user-type-dict
    - ev-profile-person
  calibers:
  - caliber_id: effect-person
    label: 已生效联系人
    description: status=EFFECT 且 enable=Y。
    contract_fragment:
      predicates:
      - field: person.status
        operator: eq
        values:
        - EFFECT
      - field: person.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: person
      field: status
    - dataset: person
      field: enable
    evidence_refs:
    - ev-person-status-dict
    - ev-person-endpoint
  - caliber_id: effect-admin
    label: 已生效企业管理员
    description: 生效联系人且 user_type=accountAdmin。
    contract_fragment:
      predicates:
      - field: person.status
        operator: eq
        values:
        - EFFECT
      - field: person.user_type
        operator: eq
        values:
        - accountAdmin
      - field: person.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: person
      field: status
    - dataset: person
      field: user_type
    - dataset: person
      field: enable
    evidence_refs:
    - ev-person-endpoint
    - ev-user-type-dict
  domain_rules:
  - rule_id: person-join-by-code
    label: 联系人按企业 code 连接
    content: ref_cust_company_info 连接 cust_company_info.code，禁止按企业 id 臆造 JOIN。
    applicability: 企业用户、管理员
    query_impact: JOIN 必须使用 company.code = person.company_code
    field_targets:
    - dataset: company
      field: code
    - dataset: person
      field: company_code
    evidence_refs:
    - ev-person-fields
    - ev-person-endpoint
  - rule_id: do-not-use-user-rel
    label: 不要用 cust_user_rel 当事实表
    content: 画像仅 1 行，人员问数以 cust_person_info / cust_role_info 为准。
    applicability: 企业用户数
    query_impact: 主表必须是 person，不能 FROM cust_user_rel
    field_targets:
    - dataset: person
      field: id
    evidence_refs:
    - ev-profile-person
  verified_query_patterns:
  - pattern_id: count-effect-admins
    question: 已生效企业管理员有多少
    query: "SELECT COUNT(1) AS effect_admin_count\nFROM cust_person_info\nWHERE status\
      \ = 'EFFECT'\n  AND user_type = 'accountAdmin'\n  AND enable = 'Y'\n"
    intended_specification:
      grain: person
      caliber_id: effect-admin
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-person-endpoint
    - ev-profile-person
evidence_refs:
- ev-person-endpoint
- ev-person-fields
- ev-role-endpoint
- ev-role-fields
- ev-person-status-dict
- ev-user-type-dict
- ev-role-status-write
- ev-role-join-code
- ev-profile-person
- ev-company-fields
- ev-cust-status-dict
- ev-user-rel-fields
assumptions:
- 邀请表 cust_invite_info 不作为本单元 grain。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.9
