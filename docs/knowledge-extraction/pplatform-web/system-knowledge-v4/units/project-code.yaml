unit_id: project-code
revision: 1
title: 项目码领取与项目推送
aliases:
- 项目码
- 项目推送
domain: project
applicability: 项目码领取记录与项目推送企业；不用于项目生效与审批
description: 项目码领取记录在 cust_project_code_record，项目推送企业在 cust_project_pushcust。
content:
  concepts:
  - concept_id: project-code-record
    name: 项目码领取记录
    definition: 企业/使用方领取项目码的记录，status 描述领取状态。
    evidence_refs:
    - ev-project-code-record-fields
  - concept_id: project-pushcust
    name: 项目推送企业
    definition: 项目在单点渠道间推送企业，source_sso_channel/target_sso_channel 标识来源与目标渠道。
    evidence_refs:
    - ev-project-pushcust-fields
  datasets:
  - dataset_id: project_code_record
    name: cust_project_code_record
    database: lowcode_pplatform
    description: 项目码领取记录。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: company_id
      name: company_id
      data_type: bigint
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: use_id
      name: use_id
      data_type: bigint
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: channel_code
      name: channel_code
      data_type: varchar
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: status
      name: status
      data_type: varchar
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: company_type
      name: company_type
      data_type: varchar
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: type
      name: type
      data_type: varchar
      evidence_refs:
      - ev-project-code-record-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-project-code-record-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-project-code-record-fields
  - dataset_id: project_pushcust
    name: cust_project_pushcust
    database: lowcode_pplatform
    description: 项目推送企业。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-project-pushcust-fields
    - field_id: source_sso_channel
      name: source_sso_channel
      data_type: varchar
      evidence_refs:
      - ev-project-pushcust-fields
    - field_id: target_sso_channel
      name: target_sso_channel
      data_type: varchar
      evidence_refs:
      - ev-project-pushcust-fields
    - field_id: project_id
      name: project_id
      data_type: varchar
      evidence_refs:
      - ev-project-pushcust-fields
    - field_id: enable
      name: enable
      data_type: varchar
      evidence_refs:
      - ev-project-pushcust-fields
      dictionary:
        Y: 启用
        N: 停用
    evidence_refs:
    - ev-project-pushcust-fields
  - dataset_id: company
    name: cust_company_info
    database: lowcode_pplatform
    description: 企业主数据。本单元仅声明 id 用于项目码领取记录关联企业。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-company-fields
    evidence_refs:
    - ev-company-fields
  - dataset_id: tenant_project
    name: tenant_project
    database: lowcode_pplatform
    description: 租户项目。本单元仅声明 id 用于项目推送关联；project_id 为 tenant_project.id 的字符串，JOIN 需 CAST。
    fields:
    - field_id: id
      name: id
      data_type: bigint
      evidence_refs:
      - ev-tenant-project-fields
    evidence_refs:
    - ev-tenant-project-fields
  relationships:
  - relationship_id: project-code-company
    left:
      dataset: project_code_record
      field: company_id
    right:
      dataset: company
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 项目码领取记录的 company_id 指向企业主数据 id。
    status: proposed
    evidence_refs:
    - ev-project-code-record-fields
    - ev-company-fields
    confidence: 0.6
  - relationship_id: project-pushcust-project
    left:
      dataset: project_pushcust
      field: project_id
    right:
      dataset: tenant_project
      field: id
    relationship_type: EQUI_JOIN
    cardinality: n:1
    business_meaning: 项目推送的 project_id 是 tenant_project.id 的字符串，JOIN 需 CAST。
    status: proposed
    evidence_refs:
    - ev-project-pushcust-fields
    - ev-tenant-project-fields
    confidence: 0.4
  metrics:
  - metric_id: project-code-record-count-by-status
    name: 项目码领取状态分布
    description: 按状态统计项目码领取记录数。
    aggregation: COUNT
    field:
      dataset: project_code_record
      field: id
    grain:
    - dataset: project_code_record
      field: status
    evidence_refs:
    - ev-project-code-record-fields
  - metric_id: project-pushcust-count
    name: 项目推送企业数
    description: 项目推送企业记录数。
    aggregation: COUNT
    field:
      dataset: project_pushcust
      field: id
    evidence_refs:
    - ev-project-pushcust-fields
  calibers:
  - caliber_id: enabled-project-code-record
    label: 启用项目码领取记录
    description: enable=Y 的项目码领取记录。
    contract_fragment:
      predicates:
      - field: project_code_record.enable
        operator: eq
        values:
        - Y
    field_targets:
    - dataset: project_code_record
      field: enable
    evidence_refs:
    - ev-project-code-record-fields
  domain_rules:
  - rule_id: code-record-status-unknown
    label: 领取状态字典未确认
    content: project_code_record.status 与 type 未确认枚举，不能臆造成功/失败口径。
    applicability: 项目码领取
    query_impact: 涉及领取成功/失败的统计必须先确认字典，避免按错误值过滤。
    field_targets:
    - dataset: project_code_record
      field: status
    evidence_refs:
    - ev-project-code-record-fields
  verified_query_patterns:
  - pattern_id: count-project-code-records
    question: 项目码领取记录有多少
    query: "SELECT COUNT(1) AS project_code_record_count\nFROM cust_project_code_record\nWHERE enable = 'Y'\n"
    intended_specification:
      grain: project_code_record
      caliber_id: enabled-project-code-record
    verification:
      status: PENDING_VALIDATION
    evidence_refs:
    - ev-project-code-record-fields
evidence_refs:
- ev-project-code-record-fields
- ev-project-pushcust-fields
assumptions:
- 项目码领取 status 与推送渠道字典未确认，暂不提供成功/失败口径。
- 查询范例未在目标库逐条执行。
conflicts: []
confidence: 0.7
