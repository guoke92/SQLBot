      query_impact: JOIN 必须使用 company.code = person.company_code
      field_targets:
      - dataset: company
        field: code
      - dataset: person
        field: company_code
      evidence_refs:
      - ev-person-fields
      - ev-person-endpoint
    - rule_id: do-not-use-user-rel
      label: 不要用 cust_user_rel 当事实表
      content: 画像仅 1 行，人员问数以 cust_person_info / cust_role_info 为准。
      applicability: 企业用户数
      query_impact: 主表必须是 person，不能 FROM cust_user_rel
      field_targets:
      - dataset: person
        field: id
      evidence_refs:
      - ev-profile-person
    verified_query_patterns:
    - pattern_id: count-effect-admins
      question: 已生效企业管理员有多少
      query: |
        SELECT COUNT(1) AS effect_admin_count
        FROM cust_person_info
        WHERE status = 'EFFECT'
          AND user_type = 'accountAdmin'
          AND enable = 'Y'
      intended_specification:
        grain: person
        caliber_id: effect-admin
      verification:
        status: PENDING_VALIDATION
      evidence_refs:
      - ev-person-endpoint
      - ev-profile-person
