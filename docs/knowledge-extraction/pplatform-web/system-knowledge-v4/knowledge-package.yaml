      - ev-person-endpoint
    - caliber_id: effect-admin
      label: 已生效企业管理员
      description: 生效联系人且 user_type=accountAdmin。
      contract_fragment:
        predicates:
        - field: person.status
          operator: eq
          values:
          - EFFECT
        - field: person.user_type
          operator: eq
          values:
          - accountAdmin
        - field: person.enable
          operator: eq
          values:
