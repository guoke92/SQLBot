        field: status
      - dataset: person
        field: user_type
      - dataset: person
        field: enable
      evidence_refs:
      - ev-person-endpoint
      - ev-user-type-dict
    domain_rules:
    - rule_id: person-join-by-code
      label: 联系人按企业 code 连接
      content: ref_cust_company_info 连接 cust_company_info.code，禁止按企业 id 臆造 JOIN。
