evidence:
  - evidence_id: ev-doc-admission
    source_id: src-doc-customer
    evidence_kind: document_claim
    locator: 客户管理平台业务规则文档.md#企业客户准入流程
    claim: 文档将企业准入描述为注册、审核、通过后分配项目；未给出表字段与状态值。
    confidence: 0.6
  - evidence_id: ev-doc-project
    source_id: src-doc-project-rel
    evidence_kind: document_claim
    locator: 租户项目与企业关联说明.md
    claim: 文档定义租户项目与 cust_project_rel 三角绑定（角色/产品/项目），并写 POST /app-web/custCompanyInfo/relateProject。
    confidence: 0.7
  - evidence_id: ev-skill-operation
    source_id: src-skill-operation
    evidence_kind: document_claim
    locator: lls-operation/SKILL.md
    claim: skill 导航 OperCustFacade 推数与回调，不是口径来源。
    confidence: 0.5
  - evidence_id: ev-submit-endpoint
    source_id: src-controller
    evidence_kind: code_path
    locator: CustCompanyInfoController#submitCust
    claim: POST /cust-web/custInfo/submitCust 提交当前企业信息。
    confidence: 1.0
  - evidence_id: ev-check-build-endpoint
    source_id: src-controller
    evidence_kind: code_path
    locator: CustCompanyInfoController#checkBuild
    claim: POST /cust-web/custInfo/checkBuild 检查并继续建档分流。
    confidence: 1.0
  - evidence_id: ev-relate-endpoint
    source_id: src-controller
    evidence_kind: code_path
    locator: CustCompanyInfoController#relateProject
    claim: POST /cust-web/custInfo/relateProject 在认证成功后关联项目，不是文档中的 /app-web/custCompanyInfo/relateProject。
    confidence: 1.0
  - evidence_id: ev-push-init
    source_id: src-facade
    evidence_kind: code_path
    locator: OperCustFacade#reg
    claim: 向运营推送成功后将 check_status 置为 CUST_CHECK_INIT；该动作不是认证成功。
    confidence: 1.0
  - evidence_id: ev-simple-success
    source_id: src-facade
    evidence_kind: code_path
    locator: OperCustFacade#resetStatus
    claim: 简易建档且不走工作流时直接写 cust_status=EFFECT、cust_build_status=BUILD_SUCCESS；否则变更写 CHANGE + CUST_CHANGE。
    confidence: 1.0
  - evidence_id: ev-async-record
    source_id: src-async
    evidence_kind: code_path
    locator: RegAsyncService
    claim: 事务提交后异步推影像、启流程并写入 cust_build_record；一行一次技术过程。
    confidence: 1.0
  - evidence_id: ev-status-map
    source_id: src-callback
    evidence_kind: code_path
    locator: CustSyncEventProcessor#getCustBuildStatus
    claim: BACKTOCUSTOM→CUST_CONFIRM_AWAIT；INIT/CHECKING→CUST_BUILDING；REJECT→BUILD_FAIL；PASS→BUILD_SUCCESS。
    confidence: 1.0
  - evidence_id: ev-update-build-status
    source_id: src-callback
    evidence_kind: code_path
    locator: CustSyncEventProcessor#updateCustBuildStatus
    claim: PASS 写 BUILD_SUCCESS；REJECT 仅当 process=CHECK 写 BUILD_FAIL，变更拒绝仍保持 BUILD_SUCCESS。状态更新同时要求 enable=Y 且 data_type=主数据。
    confidence: 1.0
  - evidence_id: ev-effect-cust
    source_id: src-callback
    evidence_kind: code_path
    locator: CustSyncEventProcessor#effectCust
    claim: 建档状态变为 BUILD_SUCCESS 后把 cust_status 更新为 EFFECT 并赋管理员权限。
    confidence: 1.0
  - evidence_id: ev-first-submit
    source_id: src-callback
    evidence_kind: code_path
    locator: CustSyncEventProcessor#updateCustFirstSubmitAuthTime
    claim: cust_first_submit_auth 仅在为空且 identify_style 为 SELF 或 INVITE 时写入当前时间。
    confidence: 1.0
  - evidence_id: ev-active-caliber
    source_id: src-mapper
    evidence_kind: query_usage
    locator: CustCompanyQueryMapper.xml#listEffectCompanyByCustType
    claim: 查询有效企业使用 data_type='1' AND enable='Y'，并包含 BUILD_SUCCESS+EFFECT 或 CUST_CHANGE+CHANGE。
    confidence: 1.0
  - evidence_id: ev-strict-caliber
    source_id: src-mapper
    evidence_kind: query_usage
    locator: CustCompanyQueryMapper.xml#listEffectFinance
    claim: 资金方有效企业用 cust_build_status='BUILD_SUCCESS' AND cust_status='EFFECT' AND data_type='1' AND enable='Y'，经 cust_project_rel.code 连接。
    confidence: 1.0
  - evidence_id: ev-group-caliber
    source_id: src-group-mapper
    evidence_kind: query_usage
    locator: CustGroupMapper.xml
    claim: 可选企业列表过滤 enable='Y' AND data_type=1 AND cust_build_status='BUILD_SUCCESS'。
    confidence: 0.95
  - evidence_id: ev-company-fields
    source_id: src-company-do
    evidence_kind: database_schema
    locator: CustCompanyInfoDO
    claim: 表 cust_company_info；业务键 code；建档/业务状态/启用/数据类型/认证方式/首次提交时间/创建时间均在此表。
    confidence: 1.0
  - evidence_id: ev-build-record-fields
    source_id: src-build-record-do
    evidence_kind: database_schema
    locator: CustBuildRecordDO
    claim: 表 cust_build_record；企业引用字段是 cust_id，不是 company_id。
    confidence: 1.0
  - evidence_id: ev-project-rel-fields
    source_id: src-project-rel-do
    evidence_kind: database_schema
    locator: CustProjectRelDO
    claim: 表 cust_project_rel；企业引用是 ref_cust_project_rel_cust_company_info（企业 code）；开通状态字段是 project_open_status。
    confidence: 1.0
  - evidence_id: ev-tenant-project-fields
    source_id: src-tenant-project-do
    evidence_kind: database_schema
    locator: TenantProjectDO
    claim: 表 tenant_project；项目状态字段 project_status；生效时间 project_effective_time。
    confidence: 1.0
  - evidence_id: ev-build-status-dict
    source_id: src-build-status-enum
    evidence_kind: code_path
    locator: CustBuildStatusEnum
    claim: BUILD_SUCCESS 展示名为认证成功，BUILD_FAIL 为认证失败，CUST_BUILDING 为审核中。
    confidence: 1.0
  - evidence_id: ev-cust-status-dict
    source_id: src-cust-status-enum
    evidence_kind: code_path
    locator: CustStatusEnum
    claim: EFFECT=生效，CHANGE=变更，另有 ADD/FAILURE/WRITEOFF/FREEZE。
    confidence: 1.0
  - evidence_id: ev-project-status-dict
    source_id: src-project-status-enum
    evidence_kind: code_path
    locator: ProjectStatusEnum
    claim: 已生效项目的库值为 '1'，待生效 '0'，已失效 '2'，不是字符串 EFFECTIVE。
    confidence: 1.0
  - evidence_id: ev-open-status-dict
    source_id: src-open-status-enum
    evidence_kind: code_path
    locator: OpenStatus
    claim: 项目开通状态真实值为 Y/P/N，不是 OPENED。
    confidence: 1.0
  - evidence_id: ev-company-type-dict
    source_id: src-company-type-enum
    evidence_kind: code_path
    locator: CustCompanyTypeEnum
    claim: 客户角色含 CORE/FINANCE/SUPPLIER/DEALER 等，关系表 company_type 存单角色。
    confidence: 1.0
  - evidence_id: ev-data-type-main
    source_id: src-data-type-const
    evidence_kind: code_path
    locator: CustDataTypeConstant.DATA_TYPE_MAIN
    claim: 正式企业主数据 data_type 值为 '1'。
    confidence: 1.0
  - evidence_id: ev-relate-impl
    source_id: src-application
    evidence_kind: code_path
    locator: CustCompanyInfoApplication#relateProject
    claim: 同企业同角色不可重复绑同一项目；非金融机构要求企业租户等于项目租户；写入/更新 cust_project_rel 后开通产品并同步下游。
    confidence: 1.0
  - evidence_id: ev-effective-project
    source_id: src-tenant-project-dao
    evidence_kind: query_usage
    locator: TenantProjectDaoImpl
    claim: 可选/生效项目查询过滤 project_status = ProjectStatusEnum.EFFECTIVE 即 '1'。
    confidence: 1.0

knowledge_units:
  - unit_id: enterprise-onboarding
    revision: 1
    title: 企业建档
    aliases: [建档, 企业开户, 客户建档, 企业认证]
    domain: enterprise
    applicability: 企业主数据查询、建档进度、有效已建档企业统计；不用于项目成员清点或开通产品数
    description: >
      企业资料提交、向运营中台推送、审核回调并形成可使用企业主数据的过程。
      推送完成、审核中、建档成功、企业生效是不同事件。推送记录不是企业。
    content:
      concepts:
        - concept_id: onboarding
          name: 建档
          aliases: [企业建档, 开户, 企业认证]
          definition: 从提交资料到主数据生效的全过程，不是单一状态值，也不能用一次接口返回等同完成。
          evidence_refs: [ev-doc-admission, ev-submit-endpoint, ev-push-init, ev-update-build-status]
        - concept_id: build-success
          name: 建档成功
          aliases: [认证成功, 有效已建档企业, 已建档]
          definition: 主数据建档状态为 BUILD_SUCCESS。口语「建档成功」对应枚举展示名「认证成功」。
          dictionary:
            BUILD_SUCCESS: 认证成功
            EFFECT: 生效
          evidence_refs: [ev-build-status-dict, ev-effect-cust, ev-strict-caliber]
        - concept_id: building
          name: 建档中
          aliases: [审核中]
          definition: 已推送运营、尚未得到终态回调。
          dictionary:
            CUST_BUILDING: 审核中
            CUST_CHECK_INIT: 待运营审核
            CUST_CHECK_CHECKING: 审核中
          evidence_refs: [ev-status-map, ev-push-init]
        - concept_id: await-customer
          name: 待客户确认
          aliases: [退回客户, 待客户认证]
          definition: 运营退回客户补正，不是建档失败。
          dictionary:
            CUST_CONFIRM_AWAIT: 待客户认证
            CUST_CHECK_BACKTOCUSTOM: 退回客户
          evidence_refs: [ev-status-map]
        - concept_id: build-fail
          name: 建档失败
          aliases: [认证失败, 建档驳回]
          definition: 仅建档审核流程（process=CHECK）被拒绝。企业变更拒绝不等于建档失败。
          dictionary:
            BUILD_FAIL: 认证失败
          evidence_refs: [ev-update-build-status]
        - concept_id: changing
          name: 变更中
          aliases: [企业变更]
          definition: 已建档企业发起变更时的状态组合，仍可能出现在部分「有效企业」查询中。
          dictionary:
            CUST_CHANGE: 变更
            CHANGE: 变更
          evidence_refs: [ev-active-caliber, ev-simple-success]
      processes:
        - stage_id: submitted
          name: 提交建档
          trigger: POST /cust-web/custInfo/submitCust 或 checkBuild 分流后的注册推送
          exit_conditions: [运营推送成功, check_status=CUST_CHECK_INIT]
          next_stages: [async_push]
          data_effects:
            - operation: update
              dataset: company
              fields: [check_status]
              condition: check_status = CUST_CHECK_INIT
              description: 推送成功只表示运营已收单，不是建档成功。
              evidence_refs: [ev-push-init, ev-submit-endpoint]
          evidence_refs: [ev-submit-endpoint, ev-check-build-endpoint, ev-push-init]
        - stage_id: async_push
          name: 异步后置与过程记录
          trigger: 提交事务提交之后
          enter_conditions: [非自主建档的后置任务已注册]
          next_stages: [reviewing, await_customer, simple_shortcut]
          data_effects:
            - operation: insert
              dataset: build_record
              fields: [cust_id, person_id, retry_status, channel]
              description: 一行一次推送/补偿，不能计为企业数。
              evidence_refs: [ev-async-record, ev-build-record-fields]
          evidence_refs: [ev-async-record]
        - stage_id: reviewing
          name: 审核中
          trigger: 运营回调 INIT 或 CHECKING
          enter_conditions: [已推送运营]
          next_stages: [approved, rejected, await_customer]
          data_effects:
            - operation: update
              dataset: company
              fields: [build_status, check_status]
              condition: check_status IN (CUST_CHECK_INIT, CUST_CHECK_CHECKING) → cust_build_status=CUST_BUILDING
              evidence_refs: [ev-status-map]
          evidence_refs: [ev-status-map]
        - stage_id: await_customer
          name: 退回待客户确认
          trigger: 运营回调 BACKTOCUSTOM
          next_stages: [reviewing]
          data_effects:
            - operation: update
              dataset: company
              fields: [build_status, check_status]
              condition: cust_build_status=CUST_CONFIRM_AWAIT
              evidence_refs: [ev-status-map, ev-update-build-status]
          evidence_refs: [ev-status-map]
        - stage_id: approved
          name: 建档审核通过
          trigger: 运营回调 CUST_CHECK_PASS
          exit_conditions: [cust_build_status=BUILD_SUCCESS, cust_status=EFFECT]
          data_effects:
            - operation: update
              dataset: company
              fields: [build_status, check_status, company_status]
              description: 先写 BUILD_SUCCESS，再 effectCust 写 EFFECT。
              evidence_refs: [ev-update-build-status, ev-effect-cust]
          evidence_refs: [ev-update-build-status, ev-effect-cust]
        - stage_id: rejected
          name: 建档失败
          trigger: 运营回调 REJECT 且 process=CHECK
          data_effects:
            - operation: update
              dataset: company
              fields: [build_status, check_status]
              condition: process=CHECK → BUILD_FAIL；process=CHANGE 时保持 BUILD_SUCCESS
              evidence_refs: [ev-update-build-status]
          evidence_refs: [ev-update-build-status]
        - stage_id: simple_shortcut
          name: 简易建档本地成功
          trigger: identify_style=SIMPLE 且变更项不启动工作流
          exit_conditions: [cust_build_status=BUILD_SUCCESS, cust_status=EFFECT]
          data_effects:
            - operation: update
              dataset: company
              fields: [build_status, company_status, check_status]
              description: 不经运营 PASS 回调，本地直接成功。
              evidence_refs: [ev-simple-success]
          evidence_refs: [ev-simple-success]
      datasets:
        - dataset_id: company
          name: cust_company_info
          database: lowcode_pplatform
          description: 企业主/过程记录，一行一家企业。业务主数据通常需 data_type='1' AND enable='Y'。连接关系表用 code，连接推送记录用 id。
          fields:
            - field_id: id
              name: id
              data_type: bigint
              evidence_refs: [ev-company-fields]
            - field_id: code
              name: code
              data_type: varchar
              description: 业务键，连接 cust_project_rel.ref_cust_project_rel_cust_company_info。
              evidence_refs: [ev-company-fields, ev-strict-caliber]
            - field_id: name
              name: name
              data_type: varchar
              evidence_refs: [ev-company-fields]
            - field_id: build_status
              name: cust_build_status
              data_type: varchar
              dictionary:
                CUST_BUILDING: 审核中
                CUST_CONFIRM_AWAIT: 待客户认证
                BUILD_SUCCESS: 认证成功
                BUILD_FAIL: 认证失败
                CUST_CHANGE: 变更
                AWAIT_CUST_CONFIRM: 待客户确认
              evidence_refs: [ev-company-fields, ev-build-status-dict]
            - field_id: check_status
              name: check_status
              data_type: varchar
              dictionary:
                CUST_CHECK_INIT: 待审核
                CUST_CHECK_CHECKING: 审核中
                CUST_CHECK_BACKTOCUSTOM: 退回客户
                CUST_CHECK_PASS: 通过
                CUST_CHECK_REJECT: 拒绝
              evidence_refs: [ev-push-init, ev-status-map]
            - field_id: company_status
              name: cust_status
              data_type: varchar
              dictionary:
                ADD: 新增
                EFFECT: 生效
                CHANGE: 变更
                FAILURE: 失效
                WRITEOFF: 注销
                FREEZE: 冻结
              evidence_refs: [ev-company-fields, ev-cust-status-dict]
            - field_id: enabled
              name: enable
              data_type: varchar
              dictionary:
                Y: 启用
                N: 停用
              evidence_refs: [ev-company-fields]
            - field_id: data_type
              name: data_type
              data_type: varchar
              dictionary:
                "1": 正式企业主数据
              evidence_refs: [ev-data-type-main, ev-company-fields]
            - field_id: identify_style
              name: identify_style
              data_type: varchar
              dictionary:
                SELF: 自主认证
                INVITE: 邀请认证
                SIMPLE: 简易认证
                INVITE_AGW: 网关邀请
              evidence_refs: [ev-first-submit, ev-simple-success]
            - field_id: first_submit_auth
              name: cust_first_submit_auth
              data_type: timestamp
              description: 仅 SELF/INVITE 首次提交时写入，不能代表全部来源的建档时间。
              evidence_refs: [ev-first-submit]
            - field_id: create_time
              name: create_time
              data_type: timestamp
              description: 行创建时间，不是建档成功时间。
              evidence_refs: [ev-company-fields]
            - field_id: db_tenant_code
              name: db_tenant_code
              data_type: varchar
              evidence_refs: [ev-company-fields]
          evidence_refs: [ev-company-fields]
        - dataset_id: build_record
          name: cust_build_record
          database: lowcode_pplatform
          description: 推送、异步后置或补偿记录。一行一次技术过程，不能计为企业数或建档成功数。
          fields:
            - field_id: id
              name: id
              data_type: bigint
              evidence_refs: [ev-build-record-fields]
            - field_id: cust_id
              name: cust_id
              data_type: bigint
              description: 企业主键，对应 cust_company_info.id。
              evidence_refs: [ev-build-record-fields]
            - field_id: person_id
              name: person_id
              data_type: bigint
              evidence_refs: [ev-build-record-fields]
            - field_id: retry_status
              name: retry_status
              data_type: varchar
              evidence_refs: [ev-build-record-fields]
            - field_id: channel
              name: channel
              data_type: varchar
              evidence_refs: [ev-build-record-fields]
            - field_id: enable
              name: enable
              data_type: varchar
              evidence_refs: [ev-build-record-fields]
            - field_id: create_time
              name: create_time
              data_type: timestamp
              evidence_refs: [ev-build-record-fields]
          evidence_refs: [ev-build-record-fields, ev-async-record]
      relationships:
        - relationship_id: company-build-record
          left: { dataset: company, field: id }
          right: { dataset: build_record, field: cust_id }
          relationship_type: EQUI_JOIN
          cardinality: 1:n
          business_meaning: 一家企业对应多次推送/补偿过程
          status: proposed
          evidence_refs: [ev-async-record, ev-build-record-fields]
      metrics: []
      calibers:
        - caliber_id: active-built-company
          label: 有效已建档企业
          description: 建档成功且企业生效的正式主数据。用户未声明「含变更中」时使用此口径。
          contract_fragment:
            predicates:
              - field: company.build_status
                operator: eq
                values: [BUILD_SUCCESS]
              - field: company.company_status
                operator: eq
                values: [EFFECT]
              - field: company.enabled
                operator: eq
                values: [Y]
              - field: company.data_type
                operator: eq
                values: ["1"]
          field_targets:
            - { dataset: company, field: build_status }
            - { dataset: company, field: company_status }
            - { dataset: company, field: enabled }
            - { dataset: company, field: data_type }
          evidence_refs: [ev-strict-caliber, ev-group-caliber, ev-data-type-main]
        - caliber_id: effect-company-including-change
          label: 有效企业（含变更中）
          description: Mapper listEffectCompanyByCustType 的宽松口径。仅当用户明确要求包含变更中企业时使用。
          contract_fragment:
            predicates:
              - field: company.enabled
                operator: eq
                values: [Y]
              - field: company.data_type
                operator: eq
                values: ["1"]
              - any_of:
                  - predicates:
                      - field: company.build_status
                        operator: eq
                        values: [BUILD_SUCCESS]
                      - field: company.company_status
                        operator: eq
                        values: [EFFECT]
                  - predicates:
                      - field: company.build_status
                        operator: eq
                        values: [CUST_CHANGE]
                      - field: company.company_status
                        operator: eq
                        values: [CHANGE]
          field_targets:
            - { dataset: company, field: build_status }
            - { dataset: company, field: company_status }
            - { dataset: company, field: enabled }
            - { dataset: company, field: data_type }
          evidence_refs: [ev-active-caliber]
      domain_rules:
        - rule_id: do-not-count-push-records
          label: 推送记录不计企业数
          content: 统计建档企业必须用 cust_company_info 去重，禁止用 cust_build_record 行数。
          applicability: 企业数、建档成功数
          query_impact: 主表必须是 company，build_record 只作过程过滤
          field_targets:
            - { dataset: company, field: build_status }
            - { dataset: build_record, field: cust_id }
          evidence_refs: [ev-build-record-fields, ev-async-record]
        - rule_id: change-reject-is-not-build-fail
          label: 变更拒绝不是建档失败
          content: 运营 REJECT 且 process=CHANGE 时企业保持 BUILD_SUCCESS，不得计入建档失败。
          applicability: 建档失败、驳回数
          query_impact: 失败口径必须同时约束建档流程，不能只看 check_status=CUST_CHECK_REJECT
          field_targets:
            - { dataset: company, field: build_status }
            - { dataset: company, field: check_status }
          evidence_refs: [ev-update-build-status]
        - rule_id: create-time-is-not-success-time
          label: 创建时间不是建档成功时间
          content: 没有统一的审核通过时间字段；create_time 不可顶替建档成功日；cust_first_submit_auth 仅覆盖 SELF/INVITE。
          applicability: 建档趋势、本月新增已建档企业
          query_impact: 缺时间字段时不得默用 create_time；应对用户澄清时间口径
          field_targets:
            - { dataset: company, field: create_time }
            - { dataset: company, field: first_submit_auth }
          evidence_refs: [ev-first-submit, ev-company-fields]
      verified_query_patterns:
        - pattern_id: count-built-companies
          question: 有效已建档企业有多少
          query: >
            SELECT COUNT(1) AS built_company_count
            FROM cust_company_info
            WHERE cust_build_status = 'BUILD_SUCCESS'
              AND cust_status = 'EFFECT'
              AND enable = 'Y'
              AND data_type = '1'
          intended_specification:
            grain: company
            caliber_id: active-built-company
          evidence_refs: [ev-strict-caliber, ev-group-caliber]
        - pattern_id: count-building-companies
          question: 正在建档审核中的企业有多少
          query: >
            SELECT COUNT(1) AS building_company_count
            FROM cust_company_info
            WHERE cust_build_status = 'CUST_BUILDING'
              AND enable = 'Y'
              AND data_type = '1'
          intended_specification:
            grain: company
          evidence_refs: [ev-status-map, ev-data-type-main]
    evidence_refs:
      - ev-submit-endpoint
      - ev-push-init
      - ev-status-map
      - ev-update-build-status
      - ev-effect-cust
      - ev-company-fields
      - ev-build-record-fields
      - ev-strict-caliber
    assumptions:
      - 正式企业主数据以 data_type='1' 为准，待库画像复核空值与历史脏数据。
      - 未连接目标库，关系与基数均为 proposed。
      - 查询范例未在目标数据源执行，绑定后才可升级为已验证模式。
    conflicts:
      - topic: 有效企业是否包含变更中
        parties: [src-mapper#listEffectCompanyByCustType, src-mapper#listEffectFinance]
        summary: 部分列表接口把 CUST_CHANGE+CHANGE 算作有效企业；资金方/严格口径只要 BUILD_SUCCESS+EFFECT。用户未说明时用严格口径并允许澄清。
      - topic: 建档成功时间
        parties: [src-doc-customer, src-company-do, src-callback]
        summary: 文档没有物理成功时间字段；代码仅对 SELF/INVITE 写 cust_first_submit_auth；不得用 create_time 顶替。
      - topic: 建档成功的展示名
        parties: [src-build-status-enum, src-doc-customer]
        summary: 枚举展示名为认证成功，业务口语常说建档成功；问数按库值 BUILD_SUCCESS 对齐。
    confidence: 0.93

  - unit_id: project-enterprise-rel
    revision: 1
    title: 企业关联租户项目
    aliases: [关联项目, 项目成员企业, 开通项目]
    domain: project
    applicability: 某企业加入了哪些项目、某项目下有哪些企业、项目开通状态；不用于统计建档成功企业总数
    description: >
      企业在建档之后按客户角色、租户产品和租户项目写入 cust_project_rel。
      租户项目是 tenant_project 上的业务项目实例，不是 ERP 泛项目。
      开通状态真实值为 Y/N/P；已生效项目的库值是 '1'。
    content:
      concepts:
        - concept_id: tenant-project
          name: 租户项目
          aliases: [项目配置, 业务项目]
          definition: 某租户在已开通产品下的可运营项目实例，对应表 tenant_project。
          evidence_refs: [ev-doc-project, ev-tenant-project-fields]
        - concept_id: project-rel
          name: 企业项目关联
          aliases: [关联项目, 项目成员]
          definition: 一行表示某企业以某角色绑定某租户项目，不是企业主数据。
          evidence_refs: [ev-project-rel-fields, ev-relate-impl]
        - concept_id: project-open
          name: 项目开通
          aliases: [已开通, 开通中]
          definition: 关系表上的开通状态，值是 Y/P/N，不是 OPENED。
          dictionary:
            Y: 已开通
            P: 开通中
            N: 未开通
          evidence_refs: [ev-open-status-dict, ev-project-rel-fields]
      processes:
        - stage_id: relate-project
          name: 关联项目
          trigger: POST /cust-web/custInfo/relateProject
          enter_conditions: [企业已存在, 选择客户角色/产品/项目]
          exit_conditions: [写入或更新 cust_project_rel]
          data_effects:
            - operation: upsert
              dataset: project_rel
              fields: [project_id, product_id, company_type, company_code]
              description: 同企业同角色不可重复绑定同一项目；可能先填空项目再补 project_id。
              evidence_refs: [ev-relate-impl, ev-relate-endpoint]
          evidence_refs: [ev-relate-impl, ev-relate-endpoint, ev-doc-project]
      datasets:
        - dataset_id: company
          name: cust_company_info
          database: lowcode_pplatform
          description: 企业主数据。本单元通过 code 连接项目关系，统计企业数时应回到建档单元口径。
          fields:
            - field_id: id
              name: id
              data_type: bigint
              evidence_refs: [ev-company-fields]
            - field_id: code
              name: code
              data_type: varchar
              evidence_refs: [ev-company-fields, ev-strict-caliber]
            - field_id: name
              name: name
              data_type: varchar
              evidence_refs: [ev-company-fields]
            - field_id: build_status
              name: cust_build_status
              data_type: varchar
              dictionary:
                BUILD_SUCCESS: 认证成功
                CUST_BUILDING: 审核中
              evidence_refs: [ev-build-status-dict]
            - field_id: company_status
              name: cust_status
              data_type: varchar
              dictionary:
                EFFECT: 生效
              evidence_refs: [ev-cust-status-dict]
            - field_id: enabled
              name: enable
              data_type: varchar
              dictionary:
                Y: 启用
              evidence_refs: [ev-company-fields]
            - field_id: data_type
              name: data_type
              data_type: varchar
              dictionary:
                "1": 正式企业主数据
              evidence_refs: [ev-data-type-main]
            - field_id: db_tenant_code
              name: db_tenant_code
              data_type: varchar
              evidence_refs: [ev-company-fields]
          evidence_refs: [ev-company-fields]
        - dataset_id: project_rel
          name: cust_project_rel
          database: lowcode_pplatform
          description: 项目—企业—角色关系。企业引用连接 cust_company_info.code。project_id 存 tenant_project.id 的字符串。
          fields:
            - field_id: id
              name: id
              data_type: bigint
              evidence_refs: [ev-project-rel-fields]
            - field_id: project_id
              name: project_id
              data_type: varchar
              description: 租户项目主键的字符串形式。
              evidence_refs: [ev-project-rel-fields, ev-relate-impl]
            - field_id: product_id
              name: product_id
              data_type: varchar
              description: 租户产品 ID。
              evidence_refs: [ev-project-rel-fields]
            - field_id: company_type
              name: company_type
              data_type: varchar
              dictionary:
                CORE: 核心企业
                FINANCE: 金融机构
                SUPPLIER: 供应商
                DEALER: 经销商
                CORPORATION_COMPANY: 集团公司
              evidence_refs: [ev-company-type-dict, ev-project-rel-fields]
            - field_id: project_open_status
              name: project_open_status
              data_type: varchar
              dictionary:
                Y: 已开通
                P: 开通中
                N: 未开通
              evidence_refs: [ev-open-status-dict, ev-project-rel-fields]
            - field_id: company_code
              name: ref_cust_project_rel_cust_company_info
              data_type: varchar
              description: 企业业务键，连接 cust_company_info.code，不是企业 id。
              evidence_refs: [ev-project-rel-fields, ev-strict-caliber]
            - field_id: enable
              name: enable
              data_type: varchar
              dictionary:
                Y: 启用
                N: 停用
              evidence_refs: [ev-project-rel-fields]
            - field_id: db_tenant_code
              name: db_tenant_code
              data_type: varchar
              evidence_refs: [ev-project-rel-fields]
          evidence_refs: [ev-project-rel-fields]
        - dataset_id: tenant_project
          name: tenant_project
          database: lowcode_pplatform
          description: 租户在某产品下的业务项目实例。已生效状态库值为 '1'。
          fields:
            - field_id: id
              name: id
              data_type: bigint
              evidence_refs: [ev-tenant-project-fields]
            - field_id: name
              name: name
              data_type: varchar
              evidence_refs: [ev-tenant-project-fields]
            - field_id: product_id
              name: product_id
              data_type: bigint
              evidence_refs: [ev-tenant-project-fields]
            - field_id: project_status
              name: project_status
              data_type: varchar
              dictionary:
                "0": 待生效
                "1": 已生效
                "2": 已失效
              evidence_refs: [ev-project-status-dict, ev-tenant-project-fields]
            - field_id: enable
              name: enable
              data_type: varchar
              dictionary:
                Y: 启用
              evidence_refs: [ev-tenant-project-fields]
            - field_id: db_tenant_code
              name: db_tenant_code
              data_type: varchar
              evidence_refs: [ev-tenant-project-fields]
            - field_id: tenant_flg_en
              name: tenant_flg_en
              data_type: varchar
              evidence_refs: [ev-tenant-project-fields]
            - field_id: project_effective_time
              name: project_effective_time
              data_type: timestamp
              evidence_refs: [ev-tenant-project-fields]
          evidence_refs: [ev-tenant-project-fields]
      relationships:
        - relationship_id: company-project-rel
          left: { dataset: company, field: code }
          right: { dataset: project_rel, field: company_code }
          relationship_type: EQUI_JOIN
          cardinality: 1:n
          business_meaning: 一家企业可按不同角色绑定多个租户项目
          status: proposed
          evidence_refs: [ev-strict-caliber, ev-project-rel-fields]
        - relationship_id: project-rel-tenant-project
          left: { dataset: project_rel, field: project_id }
          right: { dataset: tenant_project, field: id }
          relationship_type: EQUI_JOIN
          cardinality: n:1
          business_meaning: 关系上的 project_id 是 tenant_project.id 的字符串，JOIN 需类型转换
          status: proposed
          evidence_refs: [ev-relate-impl, ev-tenant-project-fields]
      metrics: []
      calibers:
        - caliber_id: opened-project-rel
          label: 已开通的企业项目关系
          description: 启用且开通完成的项目绑定。统计企业数时仍应按企业去重并叠加建档口径。
          contract_fragment:
            predicates:
              - field: project_rel.project_open_status
                operator: eq
                values: [Y]
              - field: project_rel.enable
                operator: eq
                values: [Y]
          field_targets:
            - { dataset: project_rel, field: project_open_status }
            - { dataset: project_rel, field: enable }
          evidence_refs: [ev-open-status-dict, ev-project-rel-fields]
        - caliber_id: effective-tenant-project
          label: 已生效租户项目
          description: 企业下拉可选项目来自已生效租户项目，库值是 '1' 不是 EFFECTIVE。
          contract_fragment:
            predicates:
              - field: tenant_project.project_status
                operator: eq
                values: ["1"]
              - field: tenant_project.enable
                operator: eq
                values: [Y]
          field_targets:
            - { dataset: tenant_project, field: project_status }
            - { dataset: tenant_project, field: enable }
          evidence_refs: [ev-effective-project, ev-project-status-dict]
        - caliber_id: project-member-built-company
          label: 项目下有效已建档企业
          description: 按项目统计成员企业时，关系行去重到企业，并套用建档成功口径。
          contract_fragment:
            predicates:
              - field: project_rel.enable
                operator: eq
                values: [Y]
              - field: company.build_status
                operator: eq
                values: [BUILD_SUCCESS]
              - field: company.company_status
                operator: eq
                values: [EFFECT]
              - field: company.enabled
                operator: eq
                values: [Y]
              - field: company.data_type
                operator: eq
                values: ["1"]
          field_targets:
            - { dataset: project_rel, field: enable }
            - { dataset: project_rel, field: company_code }
            - { dataset: company, field: build_status }
            - { dataset: company, field: company_status }
            - { dataset: company, field: enabled }
            - { dataset: company, field: data_type }
          evidence_refs: [ev-strict-caliber]
      domain_rules:
        - rule_id: join-company-by-code
          label: 项目关系按企业 code 连接
          content: cust_project_rel 通过 ref_cust_project_rel_cust_company_info 连接 cust_company_info.code，禁止按企业 id 臆造 JOIN。
          applicability: 项目成员、资金方、核心企业查询
          query_impact: JOIN 必须使用 company.code = project_rel.company_code
          field_targets:
            - { dataset: company, field: code }
            - { dataset: project_rel, field: company_code }
          evidence_refs: [ev-strict-caliber, ev-project-rel-fields]
        - rule_id: open-status-is-ynp
          label: 开通状态不是 OPENED
          content: 项目开通状态字段是 project_open_status，值为 Y/P/N。
          applicability: 已开通项目、开通中项目
          query_impact: 过滤必须使用 Y/P/N，不能使用 OPENED/OPENING
          field_targets:
            - { dataset: project_rel, field: project_open_status }
          evidence_refs: [ev-open-status-dict]
        - rule_id: rel-row-is-not-company
          label: 关系行不是企业
          content: 统计企业数必须按企业 code/id 去重，禁止直接 COUNT(cust_project_rel)。
          applicability: 项目企业数、开通企业数
          query_impact: grain 必须是 company，关系表只提供存在性过滤
          field_targets:
            - { dataset: company, field: code }
            - { dataset: project_rel, field: company_code }
          evidence_refs: [ev-project-rel-fields, ev-strict-caliber]
      verified_query_patterns:
        - pattern_id: companies-in-project
          question: 某项目下有效已建档企业有哪些
          query: >
            SELECT DISTINCT cci.id, cci.code, cci.name
            FROM cust_project_rel cpl
            JOIN cust_company_info cci
              ON cci.code = cpl.ref_cust_project_rel_cust_company_info
            WHERE cpl.project_id = :project_id
              AND cpl.enable = 'Y'
              AND cci.cust_build_status = 'BUILD_SUCCESS'
              AND cci.cust_status = 'EFFECT'
              AND cci.enable = 'Y'
              AND cci.data_type = '1'
          intended_specification:
            grain: company
            caliber_id: project-member-built-company
          evidence_refs: [ev-strict-caliber]
        - pattern_id: opened-projects-of-company
          question: 某企业已开通哪些项目
          query: >
            SELECT tp.id, tp.name, cpl.company_type, cpl.project_open_status
            FROM cust_project_rel cpl
            JOIN tenant_project tp
              ON CAST(tp.id AS CHAR) = cpl.project_id
            JOIN cust_company_info cci
              ON cci.code = cpl.ref_cust_project_rel_cust_company_info
            WHERE cci.id = :company_id
              AND cpl.enable = 'Y'
              AND cpl.project_open_status = 'Y'
          intended_specification:
            grain: project_rel
            caliber_id: opened-project-rel
          evidence_refs: [ev-relate-impl, ev-open-status-dict, ev-tenant-project-fields]
    evidence_refs:
      - ev-relate-endpoint
      - ev-relate-impl
      - ev-project-rel-fields
      - ev-tenant-project-fields
      - ev-strict-caliber
      - ev-open-status-dict
      - ev-project-status-dict
    assumptions:
      - project_id 与 tenant_project.id 的字符串转换方言待绑定数据源后确认。
      - 未验证生产环境 project_open_status 空值含义。
      - 金融机构跨租户例外只影响写入校验，问数仍应按实际落库的 db_tenant_code 过滤。
    conflicts:
      - topic: 关联项目接口路径
        parties: [src-doc-project-rel, src-controller]
        summary: 文档写 POST /app-web/custCompanyInfo/relateProject，代码为 POST /cust-web/custInfo/relateProject。问数与溯源以代码为准。
    confidence: 0.9
