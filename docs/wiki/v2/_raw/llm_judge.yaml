  tenant_project:
    table: tenant_project
    dicts:
    - column: project_status
      verdict: dict_keep
      reason: 项目状态，3个取值(0/1/2)呈封闭状态码；注释未给出码→中文映射，不写 labels，待人工补码表
    - column: test_data
      verdict: dict_keep
      reason: 是否测试数据，Y/N 二值开关，属封闭代码集；注释无显式映射，不写 labels
    - column: ref_tenant_project_platform_product
      verdict: drop
      reason: 取值为32位十六进制ID串，列为「平台产品-项目关联」引用ID，不是码表
    - column: enable
      verdict: dict_hold
      reason: 仅观测到单值 Y，注释为英文 enable 无中文映射；列名像启用开关代码集，但样本不足以确认为 Y/N 码表，保留待人工审核
    - column: app_tenant_code
      verdict: drop
      reason: 逻辑租户标识，取值为租户码(base/JYYL 等)，属租户标识不属业务字典
    - column: platform_product_code
      verdict: drop
      reason: 平台产品编码，开放取值集合且为 platform_product.code 的引用码，字典应归属父表
    - column: source
      verdict: dict_hold
      reason: 项目来源取值与平台产品编码大量重合(ACFLOW/ORDER/STORAGE 等)且含 pplaftorm 等杂值，疑似引用拷贝而非封闭来源枚举
    - column: operator_name
      verdict: drop
      reason: 注释为空，取值为人名与数字杂项，属 PII/自由文本
    - column: is_prd
      verdict: dict_keep
      reason: 是否生产数据，Y/N 二值开关，封闭代码集；注释无显式映射，不写 labels
    - column: config_model
      verdict: dict_keep
      reason: 项目配置模式，取值 admin/normal 封闭；注释中的 (XYC) 不是码→中文映射，不写 labels
    - column: operater_card_type
      verdict: dict_keep
      reason: 运营名片类型，取值 WX_WORK/WX 封闭代码集；注释无码→中文映射，不写 labels
    - column: cover_operator
      verdict: dict_keep
      reason: 是否覆盖运营，Y/N 二值开关；注释无显式映射，不写 labels
    - column: share_flag
      verdict: dict_keep
      reason: 共享租户标识，Y/N 二值开关；注释无显式映射，不写 labels
    - column: project_config_version
      verdict: dict_keep
      reason: 项目配置版本，取值 config/configPro 封闭代码集；注释无码→中文映射，不写 labels
    - column: op_contact_a
      verdict: drop
      reason: 运营对接人A，取值为人员数字ID，属裸 id 而非字典
    - column: op_contact_b
      verdict: drop
      reason: 取值为 JSON 数组字符串(人员ID列表)，属 JSON 结构而非字典
    - column: op_contact_a_group
      verdict: drop
      reason: 运营组别取值高度自由(运营组别0123/可乐可口2/zu1)，属自由文本
    - column: verification_contact
      verdict: drop
      reason: 查验对接人，取值为人员数字ID/工号，属裸 id
    - column: verification_contact_group
      verdict: drop
      reason: 查验组别取值自由文本且与运营组别混用，不构成封闭码表
    - column: risk_control_contact_a
      verdict: drop
      reason: 风控对接人A，取值为人员数字ID，属裸 id
    - column: risk_control_contact_b
      verdict: drop
      reason: 取值为 JSON 数组字符串(人员ID列表)，属 JSON 结构而非字典
    - column: risk_control_contact_a_group
      verdict: drop
      reason: 风控组别取值自由文本(组一/可乐可口2/zu1)，不构成封闭码表
    - column: solution_manager
      verdict: drop
      reason: 方案经理取值为人名与数字杂项，属 PII/自由文本
    - column: business_manager
      verdict: drop
      reason: 业务经理取值为人名与数字杂项，属 PII/自由文本
    - column: business_group
      verdict: drop
      reason: 关联业务部门仅「部门a」「11」两个自由文本/测试值，属自由文本与测库污染
    - column: custom_field_one
      verdict: drop
      reason: 自定义字段一，取值含长段自由文本，属自由文本
    - column: custom_field_two
      verdict: drop
      reason: 自定义字段二，取值含长段自由文本，属自由文本
    - column: custom_field_three
      verdict: drop
      reason: 自定义字段三，取值含长段自由文本，属自由文本
    - column: project_tag
      verdict: dict_keep
      reason: 项目标签，取值 PRD/TEST 封闭代码集；注释无码→中文映射，不写 labels
    - column: project_relation
      verdict: drop
      reason: 项目归属仅 111/1111 两个无业务含义值，属测库污染
    - column: bussiness_project_relation
      verdict: drop
      reason: 运营项目归属取值自由文本(宁的运营部门一/长文案)，属自由文本
    - column: top_flag
      verdict: dict_keep
      reason: 置顶标识，0/1 封闭代码集；注释无码→中文映射，不写 labels
    - column: text
      verdict: drop
      reason: 空注释，取值为大段中文提示语，属自由文本
    - column: op_update_user
      verdict: drop
      reason: 运营信息更新人，取值为人名，属 PII/审计人
    - column: cust_oper_show
      verdict: dict_keep
      reason: 建档运营名片展示，Y/N 二值开关；注释无显式映射，不写 labels
    - column: is_add
      verdict: dict_keep
      labels:
        Y: 是
        N: 否
      reason: 注释明确给出 Y：是，N：否，默认为N，为封闭 Y/N 代码字典
