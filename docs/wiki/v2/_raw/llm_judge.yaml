      verdict: drop
      reason: 租户编码类标识，且仅单值并带「(备份)」测库痕迹
    - column: dbass_app_id
      verdict: drop
      reason: 应用ID（app_xxx_日期）裸标识，逐租户唯一，非封闭码集
    - column: sso_sys_channel
      verdict: drop
      reason: 取值内嵌机构编码（org…）、值域开放，looks_like_enum=false，非封闭码表
