    - column: source
      verdict: dict_hold
      labels: {}
      reason: 单值 ACFLOW 呈代码风格，列名/注释像来源代码集，但测库仅见 1 值，疑为不全码表，保留人工审核
    - column: name
      verdict: drop
      labels: {}
      reason: 租户名称为自由文本（企业/项目名），非封闭码表
    - column: band_name
      verdict: drop
      labels: {}
      reason: 贴牌平台名称为自由文本，非码表
    - column: cust_service_number
      verdict: drop
      labels: {}
      reason: 客服电话属联系方式（PII/自由文本），非码表
    - column: dev_domain
      verdict: drop
      labels: {}
      reason: 开发环境域名为 URL 自由文本，非码表
    - column: sit_domain
      verdict: drop
      labels: {}
      reason: 测试环境域名为 URL 自由文本，非码表
    - column: uat_domain
      verdict: drop
      labels: {}
      reason: UAT 环境域名为 URL 自由文本，非码表
    - column: prd_domain
      verdict: drop
      labels: {}
      reason: 生产环境域名为 URL 自由文本（含疑似录入错误 xy...com11），非码表
    - column: privacy_policy_agreement
      verdict: drop
      labels: {}
      reason: 单值 CT- 开头的协议单据号，是对协议实体的引用 id，非码表
    - column: user_protocol_agreement
      verdict: drop
      labels: {}
      reason: 单值 CT- 协议单据号引用，非码表
    - column: auth_agreement
      verdict: drop
      labels: {}
      reason: 单值 CT- 协议单据号引用，非码表
    - column: dbass_app_id
      verdict: drop
      labels: {}
      reason: 单值 app_xxx_日期 形态的外部应用唯一 ID，非码表
    - column: enable
      verdict: dict_hold
      labels: {}
      reason: Y/N 启用标志，测库仅见 Y，疑为不全码表；注释无码值中文映射，无法产出 labels
    - column: db_tenant_code
      verdict: drop
      labels: {}
      reason: 数据租户标识，值为域名形态的租户码，属租户码类，非码表
    - column: act_procinst_status
      verdict: dict_hold
      labels: {}
      reason: 审批状态代码列，语义像封闭枚举，但测库仅见 N，值域未探明，保留待审
    - column: platform_operator
      verdict: drop
      labels: {}
      reason: 值为 JSON 数组字符串 ["platform"]，属 JSON，非码表
    - column: tenant_flag_zh
      verdict: drop
      labels: {}
      reason: 每租户唯一的中文项目标识（近自由文本），随租户增长，非封闭码表
    - column: tenant_flg_en
      verdict: drop
      labels: {}
      reason: 每租户唯一的英文租户码（业务主键串），属租户码类且非封闭，注释亦无中文映射
    - column: uat_mp_app_id
