    - column: source_system
      verdict: dict_hold
      reason: 「来源系统」取值 ACFLOW/ORDER/RVSFACTOR_PC，与同表 product_code 值域完全一致，疑两列同源或一列错填；注释无码表映射，闭集语义待人工确认，先保留。
    - column: project_config_version
      verdict: dict_hold
      reason: 仅 config/configPro 两个取值，注释为「项目配置版本」，更像配置档位/版本标识而非业务码表，且样本过少（distinct=2），保留字典页等待人工审核。
    - column: asset_list_mode
      verdict: dict_keep
      labels: {}
      reason: STANDARD_LIST/SIMPLE_LIST 为典型封闭模式码，语义单一（资产清单模式），值本身即码；注释未给码→中文映射，故不写
        labels，字典页仍为 proposed。
    - column: business_flow_mode
      verdict: dict_keep
      labels: {}
      reason: CONFIRM_RIGHT_FIRST/CONFIRM_RIGHT_AFTER 与「先确权/后确权」成对出现，属同一封闭枚举（确权时机）的两种编码，判为封闭业务码表；注释无映射故不给
        labels。
    - column: service_fee_collector_financing
      verdict: dict_keep
      labels: {}
      reason: PLATFORM/平台方、OPERATOR/运营方两两成对，构成封闭的「服务费收取方」码集（中英文双编码并存），保留字典页；注释未给映射，labels
        留空。
    - column: service_fee_quote_type_financing
      verdict: dict_hold
      reason: 7 个取值混有 PLATFORM_SERVICE_RATE/TOTAL_RATE/FIXED 与固定年化利率/非年化利率/固定利率/浮动利率，码与值不成对、口径边界不清，是否闭集待人工审核。
    - column: service_fee_collect_method_financing
      verdict: dict_hold
      reason: 8 个取值同时含收取方式（OFFLINE/ONLINE/FREE/线上收取/线下收取）与支付渠道（BOCOM_PAY/银行代扣/交e保），维度混叠，疑多套码混用，保留待审。
    - column: payer
      verdict: dict_hold
      reason: SUPPLIER/CORE/APPLICANT 与融资申请人/资金方中英文混用，码与中文无法一一对齐（支付方口径不明），闭集证据不足，保留。
    - column: service_fee_min_amount
      verdict: drop
      reason: 取值为 0/100/200/2010 及多位小数金额，是数值金额而非编码字典，不应建字典页。
    - column: service_fee_min_flag
      verdict: dict_keep
      labels: {}
      reason: 「服务费低消」为封闭布尔码集（是/否，另见 N），值域小且语义单一，保留字典页；注释未给码→中文映射，labels 留空。
    - column: review_fee
      verdict: drop
      reason: 取值为「0/90/198/1.330000」等金额（含两种小数精度），是费用数值而非码表。
    - column: zhongdeng_register
      verdict: drop
      reason: 取值多为分号拼接的长文本（如「交易前中登登记;转让时中登查询、中登登记」），并夹带「中登登记啊大大」「中登登记我是受让方」等自由填写/乱码样本，属自由文本而非封闭码表。
    - column: enable
      verdict: dict_hold
      reason: 注释即「enable」、列名像 Y/N 启停码集，但库内仅观测到单值 Y（distinct=1），属码表取样不全而非污染，保留字典页等待人工补全。
    - column: create_by
      verdict: drop
      reason: 「创建人id」为审计人标识（雪花 id），非业务码表。
    - column: create_user
      verdict: drop
      reason: 「创建人名称」为自然人姓名（PII），非业务码表。
    - column: update_by
      verdict: drop
      reason: 「更新人id」为审计人标识，非业务码表。
    - column: update_user
      verdict: drop
      reason: 「更新人名称」为自然人姓名（PII），非业务码表。
    - column: app_tenant_code
      verdict: drop
      reason: 「逻辑租户标识」为租户码（base/boscxsbl/sdhsg），按规则租户码不入字典。
    - column: db_tenant_code
      verdict: drop
      reason: 「数据租户标识」取值含域名与隔离标签（beehive-scf.qhhrly.cn、ISOLATE_TAG_boscxsbl），属租户/数据源标识混合，不入字典。
