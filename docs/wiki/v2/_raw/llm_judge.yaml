      verdict: dict_keep
      reason: 标准启停开关，码值族 Y/N；测库仅见 Y 属码值不全，非垃圾单值
    - column: app_tenant_code
      verdict: drop
      reason: 逻辑租户码，取值随租户自由增长（base/chenguang/…），属租户码类
    - column: act_procinst_status
