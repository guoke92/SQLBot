tables:
  argeement_migratory_record:
    table: argeement_migratory_record
    dicts:
    - column: platform_product_code
      comment: 产品编码
      verdict: dict_hold
      reason: 取值 ACFLOW/RVSFACTOR_PC/ORDER/AMS/BEECREDIT/STORAGE/VOUCHER 像平台产品维表的产品码，且存在指向
        platform_product.code 的候选边，更可能是外键码而非封闭中文码表；注释无码→中文映射，无法生成 labels，保留字典页待人工确认
    - column: status
      verdict: dict_hold
      reason: 注释仅「状态」，取值 0/1，注释未给码→中文映射，无法产出 labels；二值更像布尔标志且可能非全集，保留待人工审核
    - column: agreement_type
      verdict: dict_keep
      reason: 取值 PrivacyPolicy/UserProtocol/CustPersonLicense/CFCA_Auth/ProductProtocol*
        等 12 个自描述枚举，属协议类型封闭业务码集；注释无中文映射，不写 labels
    - column: sign_mode
      verdict: dict_keep
      reason: 取值 01/02/03 为定长零填充编码，符合签署模式封闭码表特征；注释未给码→中文映射，不写 labels
    - column: is_new
      verdict: dict_hold
      reason: 取值 yes/no，注释「是否新数据」语义自明但注释无码→中文映射；是否为业务码表需人工确认，保留待审
    - column: pull_num
      verdict: drop
      reason: 拉取次数，取值为 0/1/2/3…28 等连续计数，属数值指标而非代码字典
    - column: enable
      verdict: dict_hold
      reason: 列名/注释为 enable，取值仅 Y 单值，形似 Y/N 启停码表但当前样本不全（非测库垃圾值），保留字典页等待人工补全
    - column: create_by
      verdict: drop
      reason: 创建人id，属人员标识/审计字段，非字典
    - column: create_user
      verdict: drop
      reason: 创建人名称，含真实姓名/手机号（如 13545235866、王二明），属 PII，非字典
    - column: update_by
      verdict: drop
      reason: 更新人id，属人员标识/审计字段，非字典
    - column: update_user
      verdict: drop
      reason: 更新人名称，含真实姓名/手机号，属 PII，非字典
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - enable
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
      - app_tenant_code
      - db_tenant_code
    - key: identity
      title: 业务主体标识
      fields:
      - code
      - name
      - cust_id
      - platform_product_code
      - organization_id
    - key: agreement
      title: 协议信息
      fields:
      - agreement_type
      - agreement_path
      - agreement_name
      - agreement_no
      - effect_date
      - expire_date
    - key: sign
      title: 签署信息
      fields:
      - sign_mode
      - sign_date
    - key: act_procinst
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: migrate
      title: 迁移拉取状态
      fields:
      - status
      - is_new
      - pull_num
    similar_fields:
    - fields:
      - name
      - agreement_name
      note: 同表两个名称列，name 为记录名称、agreement_name 为协议名称，语义可能重叠冗余
    - fields:
      - code
      - agreement_no
      note: code（编码）与 agreement_no（协议编号）均为业务编号列，需确认是否同一编号的不同表达
    - fields:
      - effect_date
      - sign_date
      note: 协议生效日与签署日期，时间语义接近但不等价，注意下游使用区分
    joins:
    - right: platform_product.code
      authenticity: unknown
      note: name_evidence 为 exact_table，left 列名 stem=platform_product、右列注释「产品编码」与本地
        platform_product_code 注释一致，列名/注释有明确关联语义；但 overlap 已探测 sample_size=2、ratio=0.0（miss
        2），值域契合证据不足且样本过小，不足以判 likely，故给 unknown，待扩大探测
    propose_joins: []
  async_io_task:
    table: async_io_task
    dicts:
    - column: task_type
      verdict: dict_keep
      labels: {}
      reason: 任务类型为 IMPORT/EXPORT 封闭枚举，两值且无注释码表映射，保留字典页待人工补充中文标签。
    - column: task_name
      verdict: drop
      labels: {}
      reason: 任务名称为自由文本，非封闭代码字典。
    - column: menu_code
      verdict: dict_keep
      labels: {}
      reason: 业务菜单标识为大写代码集，取值封闭，虽注释未给码→中文映射，仍保留字典页。
    - column: menu_name
      verdict: drop
      labels: {}
      reason: 业务菜单名称为自由文本名称，非代码字典。
    - column: biz_class
      verdict: drop
      labels: {}
      reason: Controller Bean 全限定名为技术字符串，非业务代码字典。
    - column: biz_method
      verdict: drop
      labels: {}
      reason: 方法签名为技术字符串，非业务代码字典。
    - column: status
      verdict: dict_keep
      labels: {}
      reason: 状态为 SUCCESS/FAILED/RUNNING 封闭业务状态枚举，注释未给映射，保留字典页。
    - column: user_id
      verdict: drop
      labels: {}
      reason: 用户ID为裸标识，按 PII/裸 id 处理。
    - column: user_name
      verdict: drop
      labels: {}
      reason: 发起人姓名为个人姓名 PII，非代码字典。
    - column: is_deleted
      verdict: dict_keep
      labels:
        '0': 否
        '1': 是
      reason: 注释明确给出 0 否 1 是 的封闭软删除映射，保留字典页。
    - column: enable
      verdict: dict_hold
      labels: {}
      reason: 列名/注释像启停代码集，但当前仅 Y 单值，无法确认完整码表，保留待审核。
    - column: create_by
      verdict: drop
      labels: {}
      reason: 创建人id为审计人标识，按审计人/裸 id 处理。
    - column: create_user
      verdict: drop
      labels: {}
      reason: 创建人名称为审计人名称，PII/审计人，非代码字典。
    - column: update_by
      verdict: drop
      labels: {}
      reason: 更新人id为审计人标识，按审计人/裸 id 处理。
    - column: update_user
      verdict: drop
      labels: {}
      reason: 更新人名称为审计人名称，PII/审计人，非代码字典。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 逻辑租户标识，按租户码处理。
    - column: db_tenant_code
      verdict: drop
      labels: {}
      reason: 数据租户标识，按租户码处理。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - is_deleted
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: task
      title: 任务信息
      fields:
      - task_no
      - task_type
      - task_name
    - key: menu
      title: 业务菜单
      fields:
      - menu_code
      - menu_name
    - key: execution
      title: 执行与结果
      fields:
      - biz_class
      - biz_method
      - biz_args_json
      - ctx_json
      - status
      - result_text
      - error_msg
      - start_time
      - end_time
    - key: file
      title: 文件
      fields:
      - file_url
      - file_name
    - key: initiator
      title: 发起人
      fields:
      - user_id
      - user_name
    - key: process
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant
      title: 租户
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: organization
      title: 组织
      fields:
      - organization_id
    similar_fields:
    - fields:
      - task_name
      - name
      note: name 为泛化名称字段，语义笼统，可能与 task_name（任务名称）存在冗余或历史遗留，需人工确认。
    - fields:
      - menu_code
      - code
      note: code 为泛化编码字段，语义笼统，可能与 menu_code（业务菜单标识）重复，需人工确认。
    joins: []
    propose_joins: []
  authorization_agreement:
    table: authorization_agreement
    dicts:
    - column: platform_product_code
      verdict: dict_keep
      labels: {}
      reason: 平台产品代码，取值 PLATFORM/ACFLOW/RVSFACTOR/ORDER/AMS 等为封闭业务码集，注释仅写「平台产品id」无码→中文映射，故不产出
        labels；样本含 'pplatform' 疑似脏值，且与 platform_product.code 探测 0 重合，建议人工核对码表口径。
    - column: authed_status
      verdict: dict_keep
      labels: {}
      reason: 授权书认证状态，取值仅 Y/N，典型二元业务状态码集；注释未给出 Y/N 的中文含义，不臆造 labels。
    - column: original_cust_id
      verdict: drop
      labels: {}
      reason: 注释为「源系统custid」，取值为雪花号裸 ID（1796784307050151938 等），属外部系统主键裸 id，非封闭代码字典。
    - column: company_type
      verdict: dict_keep
      labels: {}
      reason: 企业角色（SUPPLIER/CORE/FINANCE/PROJECT_COMPANY/FACTOR_COMPANY 等）为封闭业务角色码集；样本中混入
        ["CORE"] 形式疑似脏数据，注释无码→中文映射，不产出 labels。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: 通用启用标记，取值仅 Y/N，封闭二元码集；注释仅英文 'enable'，无中文映射，不产出 labels。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 注释「逻辑租户标识」，取值 base/common/JHYL/LLS 为租户码，按硬规则租户码不属于业务字典。
    - column: creation_type
      verdict: dict_keep
      labels: {}
      reason: 创建类型取值 CUST_BUILD_INIT/AUTO/COMPANY_MANAGER_CHANGE_CODE 为封闭业务来源码集；注释无码→中文映射，不产出
        labels。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - creation_type
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: cust
      title: 企业客户
      fields:
      - cust_id
      - cust_name
      - cust_manager_id
      - cust_manager_name
      - original_cust_id
      - company_type
      - organization_id
    - key: auth
      title: 授权要素
      fields:
      - platform_product_code
      - authed_status
    - key: act_procinst
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    similar_fields:
    - fields:
      - cust_id
      - original_cust_id
      note: 两者均为企业标识承载列，original_cust_id 注释为「源系统custid」，与本表 cust_id 语义近义但来源不同，需人工确认是外部映射还是冗余。
    joins:
    - right: platform_product.code
      authenticity: unlikely
      note: 列名与注释「平台产品id」同 platform_product.code 语义精确对应（exact_table），但探测 overlap=0.0（sample_size=5，miss=5，未深化），值域不契合，暂判
        unlikely；样本量小，建议人工复核是否码表口径差异，勿据此删边。
    propose_joins: []
  ca_certification_info:
    table: ca_certification_info
    dicts:
    - column: cust_type
      verdict: dict_keep
      labels: {}
      reason: 注释 PERSON / COMPANY 明确列出封闭取值集合，属主体类型码（个人/企业）；测试库仅命中 COMPANY 属取样不全，非污染。注释无码→中文映射，故不写
        labels。
    - column: op_type
      verdict: dict_hold
      labels: {}
      reason: 注释 INSERT / UPDATE 看似枚举，但更像数据变更/CDC 技术标记而非业务字典，且测试库仅单值、注释无中文映射，证据不足，保留待人工审核。
    - column: data_source
      verdict: dict_keep
      labels: {}
      reason: FBP_PORTAL / OPERATION_PLATFORM / CHANNEL_OPENAPI 为封闭来源码集，3 个取值互为不同码，属业务来源字典；注释无中文映射，故不写
        labels。
    - column: submit_status
      verdict: dict_keep
      labels: {}
      reason: 注释 PENDING / SUCCESS / FAIL 为封闭提交状态码集，测试库三值齐全，属业务状态字典；注释无码→中文映射，故不写
        labels。
    - column: enable
      verdict: dict_hold
      labels: {}
      reason: 仅单值 Y、注释为英文 enable 且无中文映射，是否启用标志是否为需单独建档的封闭业务字典证据不足，保留待人工审核。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 逻辑租户标识属租户码，按规则不建业务字典。
    - column: db_tenant_code
      verdict: drop
      labels: {}
      reason: 数据租户标识属租户码（取值含域名、实例/隔离标签等混合值），非封闭业务代码字典，按规则丢弃。
    - column: head_company_data
      verdict: dict_keep
      labels: {}
      reason: 注释“是否总公司”为明确的二值布尔语义，N/Y 封闭取值，属业务标志字典；注释无码→中文映射，故不写 labels。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
    - key: audit
      title: 审计信息
      fields:
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: customer
      title: 客户主体
      fields:
      - cust_id
      - cust_type
      - head_company_data
    - key: org
      title: 机构信息
      fields:
      - organization_id
    - key: data_sync
      title: 数据同步批次
      fields:
      - data_date
      - op_type
      - batch_no
      - data_source
    - key: certification
      title: 认证材料
      fields:
      - notify_agreement_json
      - enterprise_four_json
      - police_two_json
      - file_refs_json
    - key: intent
      title: 意愿核验
      fields:
      - intent_sms_json
      - intent_h_face_json
    - key: submit
      title: 提交结果
      fields:
      - submit_status
      - sign_platform_result
      - submit_time
    - key: approval
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    similar_fields:
    - fields:
      - cust_id
      - organization_id
      note: 企业Id 与 机构编号 均指向主体标识，语义可能重叠，需确认是否为同一维度的冗余列
    - fields:
      - enterprise_four_json
      - police_two_json
      note: 企业四要素与实名核验(POLICE_TWO)均为认证材料 JSON，结构相近，注意区分用途与来源
    - fields:
      - intent_sms_json
      - intent_h_face_json
      note: 同为意愿核验结果 JSON，仅核验渠道不同（SMS_CODE / H5_FACE）
    - fields:
      - submit_status
      - act_procinst_status
      note: 提交状态与审批状态分属两条生命周期，语义相近易混用，需明确口径
    joins: []
    propose_joins: []
  ca_fee_company:
    table: ca_fee_company
    dicts:
    - column: tenant_id
      verdict: drop
      labels: {}
      reason: 租户主键/裸 id，指向租户实体而非封闭业务码集，不属于字典。
    - column: locked_annual_fee
      verdict: drop
      labels: {}
      reason: 年费金额（元），开放数值域而非封闭代码字典，低基数只是取值集中在常见档位。
    - column: fee_locked
      verdict: dict_keep
      labels: {}
      reason: 是否已锁定年费标准，Y/N 二值布尔标志，属封闭业务码集；注释未给出码→中文映射，故不填 labels。
    - column: pay_status
      verdict: dict_keep
      labels:
        PAID: 已缴费
        UNPAID: 未缴费
      reason: 缴费状态，注释中已显式给出 PAID/UNPAID 的中文含义，封闭枚举。
    - column: source_company_type
      verdict: dict_keep
      labels: {}
      reason: 首次锁定来源企业角色，SUPPLIER/CORE/PROJECT_COMPANY 为封闭角色码集；注释仅举例码值未给中文映射，故不填 labels。
    - column: renew_remind_sent
      verdict: dict_keep
      labels:
        Y: 已生成
        N: 未生成
      reason: 本期续费待办是否已生成，注释中已给出 Y/N 的中文含义，封闭二值枚举。
    - column: special_config_flag
      verdict: dict_keep
      labels: {}
      reason: 是否存在生效中的特殊配置快照，Y/N 二值布尔标志，属封闭业务码集；注释未给码→中文映射。
    - column: special_annual_fee
      verdict: drop
      labels: {}
      reason: 特殊配置后应缴年费金额（元），开放数值域，非封闭码表。
    - column: ca_status
      verdict: dict_keep
      labels: {}
      reason: CA签章状态，NORMAL/CANCELLED/UNKNOWN 为封闭状态码集；注释无码→中文映射，故不填 labels。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: 典型启用标志列，Y/N 封闭布尔码集，与同表 fee_locked、special_config_flag 同向；样本仅探测到 Y，疑为抽样不全而非码集不成立。
    - column: create_by
      verdict: drop
      labels: {}
      reason: 创建人 id，审计人员标识，非字典。
    - column: create_user
      verdict: drop
      labels: {}
      reason: 创建人名称，人名类 PII，非字典。
    - column: update_by
      verdict: drop
      labels: {}
      reason: 更新人 id，审计人员标识，非字典。
    - column: update_user
      verdict: drop
      labels: {}
      reason: 更新人名称，人名类 PII，非字典。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 逻辑租户标识，租户码，非业务字典；且当前仅单值 base。
    - column: db_tenant_code
      verdict: drop
      labels: {}
      reason: 数据租户标识，租户码（含域名与 ISOLATE_TAG 隔离标记），非业务字典。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: identity
      title: 企业主档身份
      fields:
      - company_name
      - certification_no
      - organization_id
    - key: fee
      title: 年费与缴费
      fields:
      - locked_annual_fee
      - fee_locked
      - special_annual_fee
      - special_config_flag
      - pay_status
      - ca_status
    - key: service
      title: 服务周期与续费
      fields:
      - service_start
      - service_end
      - renew_remind_sent
    - key: source
      title: 首次锁定来源
      fields:
      - source_project_id
      - source_company_type
      - tenant_id
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: approval
      title: 审批流程
