  wec_project_cust_operation_rel:
    table: wec_project_cust_operation_rel
    dicts:
    - column: company_type
      verdict: dict_keep
      labels: {}
      reason: 注释「微企链企业角色」，取值 ce/cpt 为封闭角色码值集，符合业务代码字典；注释未给码→中文映射，故不写 labels，保留字典页待人工补映射。
    - column: op_contact_a
      verdict: drop
      reason: 运营对接人，取值 420/267/321 等为人员标识（裸 id/人员引用），非封闭业务码表。
    - column: op_contact_b
      verdict: drop
      reason: 取值形如 ["420"]、["411","141"] 的 JSON 数组串，属结构化/自由文本，不是码表。
    - column: op_contact_a_group
      verdict: drop
      reason: 组别取值混杂（1/xxcc/可乐可口2/组三），自由文本且明显脏数据，非封闭代码集。
    - column: verification_contact
      verdict: drop
      reason: 查验对接人，取值为人员标识（裸 id），属人员引用而非字典码值。
    - column: verification_contact_group
      verdict: drop
      reason: 组别取值为自由文本（可乐可口2/1组/小微蜂组），非封闭代码集。
    - column: risk_control_contact_a
      verdict: drop
      reason: 风控对接人，取值为人员标识（裸 id），非字典码值。
    - column: risk_control_contact_b
      verdict: drop
      reason: 取值形如 ["420"] 的 JSON 数组串，自由/结构化文本，不是码表。
    - column: risk_control_contact_a_group
      verdict: drop
      reason: 组别取值为自由文本（A1/组一/运营一组），非封闭代码集。
    - column: enable
      verdict: dict_hold
      labels: {}
      reason: 注释仅「enable」，样本只有单值 Y，疑似 Y/N 启用标志码集但样本不全，注释无中文映射，保留待人工确认。
    - column: create_by
      verdict: drop
      reason: 创建人id，审计人员标识，非字典。
    - column: create_user
      verdict: drop
      reason: 创建人名称，人名 PII，非字典。
    - column: update_by
      verdict: drop
      reason: 更新人id，审计人员标识，非字典。
    - column: update_user
      verdict: drop
      reason: 更新人名称，人名 PII，非字典。
    - column: app_tenant_code
      verdict: drop
      reason: 逻辑租户标识，租户码，按规则不作字典。
    - column: top_flag
      verdict: dict_hold
      labels: {}
      reason: 置顶标识，样本仅单值 0，疑似 0/1 布尔标志码集但不全，注释无中文映射，保留待人工确认；与 enable 同向处理。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: status_flag
      title: 状态与标识
      fields:
      - enable
      - top_flag
    - key: tenant
      title: 租户
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: wec_rel
      title: 微企链关联主体
      fields:
      - wec_rel_id
      - company_id
      - company_type
      - project_id
    - key: organization
      title: 机构
      fields:
      - organization_id
    - key: op_contact
      title: 运营对接
      fields:
      - op_contact_a
      - op_contact_b
      - op_contact_a_group
    - key: verification
      title: 查验对接
      fields:
      - verification_contact
      - verification_contact_group
    - key: risk_control
      title: 风控对接
      fields:
      - risk_control_contact_a
      - risk_control_contact_b
      - risk_control_contact_a_group
    - key: act_procinst
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    similar_fields:
    - fields:
      - op_contact_a
      - op_contact_b
      note: 同一「运营对接人」A/B 槽位，语义同构；B 侧以 JSON 数组存多人。
    - fields:
      - op_contact_a
