    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustCustomizedProductDaoImpl.java:25
    note: 定制产品按企业主键 cust_id，不是 ref_cust_customized_product_cust_company_info。
  - left: cust_company_info.id
    right: cust_invite_info.invite_cust_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustCompanyIfoEnchanceService.java:1587
    note: 邀请方企业主键。progress 回写按被邀请企业 name+db_tenant_code 匹配，不是这条 JOIN。
  - left: cust_company_info.id
    right: cust_company_lifecycle_info.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustCompanyInfoApplication.java:7082
    note: 冻结/解冻留痕按企业主键。预生成行 enable=N，确认后改 Y。ref_cust_company_info 本路径未使用。
  - left: cust_company_info.id
    right: cust_project_code_record.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustProjectRelEnhanceService.java:407
    note: 项目码输入记录按企业主键。
  - left: cust_company_info.id
    right: cust_oper_change_record.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:OperChangeRecordHelper.java:87
    note: 运营人员变更留痕写入企业主键。列表查询按 person_id，company_code 只是冗余拷贝。
  - left: cust_person_info.id
    right: cust_oper_change_record.person_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:OperChangeRecordApplication.java:46
    note: 变更记录按联系人主键倒序查。
  - left: cust_company_info.id
    right: cust_survey_answer.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustSurveyAnswerDao.java:18
    note: 调研答案按登录企业主键。
  - left: cust_company_info.id
    right: cust_company_survey_whitelist.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustCompanySurveyWhitelistDao.java:19
    note: 问卷星白名单按企业主键。
  - left: cust_company_info.id
    right: cust_company_survey_state.company_id
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    evidence: code_path:CustCompanySurveyStateDao.java:18
    note: 问卷星活动状态按企业主键，一企一行。
  - left: cust_company_info.id
    right: cust_user_rel.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CustCompanyIfoEnchanceService.java:566
    note: 用户企业角色按企业主键。现网几乎无行；不要当成 sys 侧用户关系。
  - left: tenant_project.id
    right: cust_project_pushcust.project_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    cast: varchar←bigint
    evidence: code_path:CustSyncEventProcessor.java:3106
    note: 默认推送项目 project_id 转 Long 查 tenant_project.id。配置本身按 SSO 渠道查，不是企业 JOIN。
