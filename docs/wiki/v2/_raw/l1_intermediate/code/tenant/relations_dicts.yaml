kind: relations_dicts
domain: tenant
confirmed_relations:
  - left: tenant_setting_config.id
    right: tenant_project.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProjectDomainService.java:157
    note: 创建项目写 tenant_id=租户配置主键；列表按 tenant_id 等值查。
  - left: tenant_setting_config.id
    right: tenant_product.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProductDomainService.java:147
    note: 开通产品写 tenant_id=TenantDTO.id（即 tenant_setting_config.id）。
  - left: tenant_setting_config.code
    right: tenant_product.ref_tenant_product_tenant_setting_config
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProductDomainService.java:161
    note: 码引用租户配置 code，与 tenant_id 并存。
  - left: tenant_setting_config.code
    right: tenant_project.ref_tenant_project_tenant_code
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProjectDaoImpl.java:135
    note: 生效项目列表按租户配置 code 过滤。
  - left: tenant_product.id
    right: tenant_project.product_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProjectDaoImpl.java:34
    note: 项目按租户产品主键关联。
  - left: tenant_product.code
    right: tenant_project.ref_tenant_project_product_code
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProjectDaoImpl.java:136
    note: 码引用租户产品 code。
  - left: platform_product.id
    right: tenant_product.platform_product_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantProductDaoImpl.java:42
    note: 租户产品对平台产品主键。
  - left: tenant_project.code
    right: tenant_project_approval.ref_tenant_project_approval_tenant_project
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:ProjectApprovalApplication.java:253
    note: 审批按项目 code 关联，不是 tenant_project.id。最新一笔再加 is_latest=Y。
  - left: tenant_project_approval.id
    right: tenant_project.project_approval_id
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    priority: secondary
    evidence: code_path:ProjectApprovalApplication.java:405
    note: 创建审批后回写项目上的审批主键。主查询走 code=ref。
  - left: tenant_project.id
    right: tenant_setting_config.default_project_id
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    evidence: code_path:TenantAppliactionService.java:449
    note: 默认关联项目是租户配置上的项目主键。
  - left: tenant_project_approval.code
    right: tenant_project_approval_flow.ref_tenant_project_approval_flow_tenant_project_approval
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:ProjectApprovalApplication.java:571
    note: 流程节点按审批单 code，不是审批 id。
  - left: tenant_project_approval.code
    right: tenant_project_approval_business_info.ref_tenant_project_approval_business_info_project_approval
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    evidence: code_path:ProjectApprovalApplication.java:1003
    note: 业务推送信息按审批 code。
  - left: tenant_project_approval.code
    right: tenant_project_approval_flow_credit.ref_tenant_project_approval_flow_credit_project_approval
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:ProjectApprovalApplication.java:1551
    note: 授信按审批 code。
  - left: tenant_project_approval.code
    right: tenant_project_approval_flow_node.ref_tenant_project_approval_flow_node_project_approval
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:ProjectOnlineProcessOperateListener.java:355
    note: 节点操作留痕按审批 code。
  - left: tenant_project_approval_flow.code
    right: tenant_project_approval_flow_node.ref_tenant_project_approval_flow_node_project_approval_flow
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:ProjectApprovalApplication.java:824
    note: 操作留痕按流程节点实例 code。
  - left: tenant_setting_config.id
    right: tenant_interworking_product.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProductDaoImpl.java:35
    note: 互通产品按租户配置主键。
  - left: platform_product.id
    right: tenant_interworking_product.platform_product_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProductDaoImpl.java:36
  - left: tenant_interworking_product.id
    right: tenant_interworking_project.product_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProjectDaoImpl.java:32
    note: 互通项目绑定的是互通产品主键，不是 tenant_product.id。
  - left: tenant_interworking_product.code
    right: tenant_interworking_project.ref_tenant_interworking_project_tenant_interworking_product
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProjectApplicationService.java:67
  - left: tenant_setting_config.id
    right: tenant_interworking_project.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProjectDaoImpl.java:24
  - left: tenant_project.id
    right: tenant_interworking_project.project_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:TenantInterworkingProjectApplicationService.java:64
    note: 互通项目绑定的是 tenant_project.id，不是项目 code。
