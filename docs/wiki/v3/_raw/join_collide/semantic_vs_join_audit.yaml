semantic_groups:
- field: platform_product_code
  meaning: 平台产品业务码（如 ACFLOW）；各场景表冗余拷贝，不是表间 FK
  code: 'authorization_agreement.trace: 未见对 platform_product.product_code 的 SQL EQUI_JOIN；agreement_migratory:
    CSV notIn 不是 JOIN'
  tables:
  - platform_product.product_code
  - authorization_agreement.platform_product_code
  - cust_auth_application.platform_product_code
  - tenant_product.platform_product_code
  - tenant_project.platform_product_code
  - argeement_migratory_record.platform_product_code
  - tenant_migarory_log.platform_product_code
  - cust_interworking_product.platform_product_code
  - tenant_interworking_product.platform_product_code
  - tenant_interworking_project.platform_product_code
  action: drop_cross_table_equi_joins
- field: product_code
  meaning: 产品业务码；资方规则/菜单/审批业务信息/角色等多场景共用语义
  code: platform_product_cust_role.product_code 与平台产品是内存 contains，不是 SQL EQUI_JOIN；funding_rule
    真 FK 是 rule_info_id
  hub_hint: 若需强关联优先 platform_product.product_code → 各子场景（仍要代码证实）；子场景之间不互链
  action: drop_satellite_clique
- field: channel_code
  meaning: 同名异义：项目码 vs OpenAPI/SSO 渠道 vs 企业建档渠道
  code: tenant_concepts.channel_code_term ≠ open_sso_channel_term ≠ cust_company_info.channel_code；open_sso↔company
    为对齐非 FK
  action: never_equi_join_across_meanings
- field: certification_no
  meaning: 企业/CA 统码；hub→各 CA 附属表可以强关联，附属表之间不互链
  keep_hub:
  - cust_company_info.certification_no → ca_fee_company / ca_fee_order / ca_cfca_upgrade_report
  - ca_fee_company.certification_no → ca_fee_order
  drop: ca_fee_order ↔ ca_fee_special_config ↔ ca_cfca 等同名互链（值域阶段不同）
  action: hub_satellites_only
- field: sp_no
  meaning: 企微审批单号 vs 项目上线审批 — 不同场景不要互代
  code: 'remaining calibers: 企微在 wechat_project_approval_apply；项目上线在 tenant_project_approval。字段历史用
    apply_id'
  action: drop_cross_scenario
- field: node_code
  meaning: 审批流程节点码；config/flow/node 各表同语义，真关联走 ref_* code
  action: semantic_only_unless_ref
