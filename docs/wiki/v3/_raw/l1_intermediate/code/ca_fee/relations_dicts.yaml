kind: relations_dicts
domain: ca_fee
confirmed_relations:
  - left: tenant_project.id
    right: ca_fee_project_config.project_id
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    evidence: code_path:cafee/CaFeeProjectConfigService.java:296
    note: 项目配置按 tenant_project 主键，一项目一行。
  - left: tenant_setting_config.id
    right: ca_fee_project_config.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeProjectConfigService.java:236
    note: 新建配置写 tenant_id=项目上的租户主键。
  - left: tenant_project.id
    right: ca_fee_order.project_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeOrderService.java:150
  - left: tenant_setting_config.id
    right: ca_fee_order.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeOrderService.java:481
  - left: cust_company_info.id
    right: ca_fee_order.company_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CaFeeBocomGateway.java:118
    note: company_id 是企业主键，不是 ca_fee_company.id。
  - left: ca_fee_company.certification_no
    right: ca_fee_order.certification_no
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeOrderService.java:440
    note: 企业宽表与订单按统码关联。
  - left: cust_company_info.certification_no
    right: ca_fee_company.certification_no
    type: EQUI_JOIN
    cardinality: one_to_one
    join_role: identity
    evidence: code_path:CaFeeCompanyCaStatusSupport.java:85
  - left: tenant_project.id
    right: ca_fee_company.source_project_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeOrderService.java:456
    note: 首次锁定年费时记下源项目。
  - left: tenant_setting_config.id
    right: ca_fee_company.tenant_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:cafee/CaFeeOrderService.java:458
  - left: cust_company_info.id
    right: ca_certification_info.cust_id
    type: EQUI_JOIN
    cardinality: one_to_many
    join_role: identity
    evidence: code_path:CaCertificationInfoAppServiceImpl.java:151
