kind: processes
domain: remaining
processes:
  - process_key: platform_product__product_status
    table: platform_product
    field: product_status
    title: 平台产品状态
    description: |
      钉 platform_product.product_status。人工生效写 1。不要当成租户产品 open_status。
    entry: POST /app-web/platformProduct/effective
    stages:
      - stage: 生效
        transitions:
          - from: "0"
            event: effective
            to: "1"
            evidence: code_path:PlatformProduct.java:100
  - process_key: async_io_task__status
    table: async_io_task
    field: status
    title: 异步导入导出任务
    description: |
      钉 async_io_task.status。PENDING → RUNNING → SUCCESS/FAILED。
      枚举无 displayName，不编中文 label。
    entry: 异步导入导出
    stages:
      - stage: 创建
        transitions:
          - from: PENDING
            event: create
            to: PENDING
            evidence: code_path:AsyncIoTaskManager.java:84
      - stage: 执行
        transitions:
          - from: PENDING
            event: claim
            to: RUNNING
            evidence: code_path:AsyncIoTaskManager.java:114
      - stage: 结束
        transitions:
          - from: RUNNING
            event: success
            to: SUCCESS
            evidence: code_path:AsyncIoTaskManager.java:122
          - from: RUNNING
            event: fail
            to: FAILED
            evidence: code_path:AsyncIoTaskManager.java:147
