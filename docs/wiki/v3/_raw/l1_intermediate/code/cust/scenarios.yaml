kind: scenarios
domain: cust
scenarios:
  - scenario_key: company_build
    title: 企业建档
    aliases: [简易建档, 客户建档, 企业认证]
    description: 客户主档建档/认证。关联项目时并入 cust_project_rel.relation。
    hubs:
      - table: cust_company_info
        role: master
    shared:
      - table: cust_project_rel
        role: project_link
      - table: cust_role_info
        role: company_role
      - table: cust_person_info
        role: admin_person
      - table: cust_project_code_record
        role: project_code
      - table: cust_project_pushcust
        role: default_project
    lifecycle:
      - dict: cust_company_info__cust_build_status
        process: cust_company_info__cust_build_status
      - dict: cust_company_info__cust_status
        process: cust_company_info__cust_status
  - scenario_key: company_invite_auth
    title: 邀请认证
    aliases: [邀请建档, 平台录入认证, 客户录入认证]
    description: 邀请/自主提交走 submitCust，运营回调写 check_status 与 cust_build_status。人员、账户按企业 code 闭包。
    hubs:
      - table: cust_company_info
        role: master
    shared:
      - table: cust_person_info
        role: admin_person
      - table: cust_account_info
        role: bank_account
      - table: cust_build_record
        role: oper_push
      - table: cust_certification_info
        role: license
    lifecycle:
      - dict: cust_company_info__cust_build_status
        process: cust_company_info__cust_build_status
      - dict: cust_company_info__check_status
        process: cust_company_info__check_status
  - scenario_key: company_change
    title: 企业变更
    aliases: [客户变更, 资料变更]
    description: 变更把建档状态写成 CUST_CHANGE、生效状态写成 CHANGE。问变更中企业用 changing_company，不要当成失效。
    hubs:
      - table: cust_company_info
        role: master
    shared:
      - table: cust_change_record
        role: change_log
      - table: cust_change_cfg
        role: change_item
      - table: cust_person_info
        role: admin_person
    lifecycle:
      - dict: cust_company_info__cust_build_status
        process: cust_company_info__cust_build_status
      - dict: cust_company_info__cust_status
        process: cust_company_info__cust_status
      - dict: cust_company_info__check_status
        process: cust_company_info__check_status
  - scenario_key: person_admin
    title: 企业管理员
    aliases: [客户管理员, 冻旧建新]
    description: |
      管理员钉 user_type=accountAdmin 且 enable=Y。同一企业同一 company_type 只能有一个有效管理员。
      变更管理员是冻旧建新，不是改原行。企业冻结不改 person.enable。
    hubs:
      - table: cust_person_info
        role: master
    shared:
      - table: cust_company_info
        role: company
      - table: cust_oper_change_record
        role: oper_trace
    lifecycle:
      - dict: cust_person_info__user_type
      - dict: cust_person_info__status
        process: cust_person_info__status
  - scenario_key: company_freeze
    title: 企业冻结与注销
    aliases: [冻结企业, 注销企业, 解冻]
    description: |
      冻结写 cust_status=FREEZE 并同步角色 status，再冻管理员 SSO。注销写 WRITEOFF 并冻全部 SSO。
      不要问成「管理员 enable=N」。
    hubs:
      - table: cust_company_info
        role: master
    shared:
      - table: cust_role_info
        role: company_role
      - table: cust_company_lifecycle_info
        role: freeze_audit
    lifecycle:
      - dict: cust_company_info__cust_status
        process: cust_company_info__cust_status
      - dict: cust_role_info__status
        process: cust_role_info__status
  - scenario_key: company_invite_progress
    title: 邀请进度
    aliases: [邀请建档进度]
    description: |
      邀请落库 progress=INIT。之后按被邀请企业名称+租户把 progress 写成 cust_build_status。
      邀请方企业用 invite_cust_id=company.id；不要用这条 JOIN 解释 progress。
    hubs:
      - table: cust_invite_info
        role: master
    shared:
      - table: cust_company_info
        role: invited_company
    lifecycle:
      - dict: cust_invite_info__progress
        process: cust_invite_info__progress
      - dict: cust_company_info__cust_build_status
        process: cust_company_info__cust_build_status
