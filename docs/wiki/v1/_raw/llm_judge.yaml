    dicts:
    - column: company_type
      verdict: dict_keep
      labels: {}
      reason: 注释为「微企链企业角色」，取值为 ce/cpt 短码，属封闭业务角色字典；注释未给出码值中文明细，故不填 labels。
    - column: op_contact_a
      verdict: drop
      labels: {}
      reason: 「运营对接人A」取值为 420/267/321 等人员编号，属人员裸 id 引用，不是业务代码字典。
    - column: op_contact_b
      verdict: drop
      labels: {}
      reason: 取值为 ["420"] 形式的 JSON 数组人员编号列表，属人员引用/自由结构化文本，非封闭代码字典。
    - column: op_contact_a_group
      verdict: drop
      labels: {}
      reason: 「运营组别」取值为 1/小微蜂组/xxcc/可乐可口2 等混杂自由文本名称，属组织名称枚举，非封闭业务码（同一业务定位的组别列同判）。
    - column: verification_contact
      verdict: drop
      labels: {}
      reason: 「查验对接人」取值为 454/305/321 等人员编号，属人员裸 id 引用。
    - column: verification_contact_group
      verdict: drop
      labels: {}
      reason: 「查验组别」为组别名称自由文本（可乐可口2/1组/小微蜂组/3），非封闭业务码。
    - column: risk_control_contact_a
      verdict: drop
      labels: {}
      reason: 「风控对接人A」取值为 454/271 等人员编号，属人员裸 id 引用。
    - column: risk_control_contact_b
      verdict: drop
      labels: {}
      reason: 取值为 JSON 数组形式的多人编号列表，非封闭代码字典。
    - column: risk_control_contact_a_group
      verdict: drop
      labels: {}
      reason: 「风控组别」为组别名称自由文本（可乐可口2/运营一组/小微蜂组等），非封闭业务码。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: enable 为 Y/N 布尔开关，属封闭代码字典；注释无码值中文映射故不填 labels；库中当前仅 Y 不能单独作为排除依据。
    - column: create_by
      verdict: drop
      labels: {}
      reason: 「创建人id」为审计人标识，属审计/人员类字段。
    - column: create_user
      verdict: drop
      labels: {}
      reason: 「创建人名称」为人员姓名，属 PII/审计人字段。
    - column: update_by
      verdict: drop
      labels: {}
      reason: 「更新人id」为审计人标识。
    - column: update_user
      verdict: drop
      labels: {}
      reason: 「更新人名称」为人员姓名，属 PII/审计人字段。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 「逻辑租户标识」为系统级租户分区/隔离键，非业务代码字典；取值单一不作为唯一判据。
    - column: top_flag
      verdict: dict_keep
      labels: {}
      reason: 「置顶标识」为 0/1 布尔开关，属封闭代码字典；注释无码值中文映射故不填 labels；库中当前仅 0 不能单独作为排除依据。
