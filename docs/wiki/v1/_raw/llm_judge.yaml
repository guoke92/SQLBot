    table: tenant_project_approval
    dicts:
    - column: is_online_approval
      verdict: dict_keep
      labels: {}
      reason: 封闭布尔码（Y/N），属业务是/否枚举；注释只给码域未给码→中文映射，故不填 labels。
    - column: sp_no
      verdict: drop
      labels: {}
      reason: 立项审批单据编号（如 202604270003、MN-202606230165），自由编号非封闭码表。
    - column: solution_manager_id
      verdict: drop
      labels: {}
      reason: 方案经理 userId（JSON 数组），人员标识，非业务码字典。
    - column: solution_manager_name
      verdict: drop
      labels: {}
      reason: 方案经理姓名，人员 PII。
    - column: project_type
      verdict: dict_keep
      labels:
        STANDARD: 标准
        REGULAR: 常规
      reason: 注释已给出码→中文映射的封闭项目类型码。
    - column: simple_mode
      verdict: dict_keep
      labels: {}
      reason: Y/N 布尔码，取值为封闭枚举；注释无码→中文映射，故不填 labels。
    - column: initiator_user_id
      verdict: drop
      labels: {}
      reason: 发起人 userId，人员标识，非字典。
    - column: initiator_user_name
      verdict: drop
      labels: {}
      reason: 发起人姓名，人员 PII。
    - column: wf_status
      verdict: dict_keep
      labels: {}
      reason: 工作流状态为封闭枚举（RUNNING/FINISHED/TERMINATED/PENDING/REVOKED）；注释未给中文映射，故不填
        labels。
    - column: wf_last_operator_id
      verdict: drop
      labels: {}
      reason: 工作流最近操作人 userId，人员标识。
    - column: wf_last_operator
      verdict: drop
      labels: {}
      reason: 工作流最近操作人姓名，人员 PII。
    - column: is_low_risk
      verdict: dict_keep
      labels: {}
      reason: 是否低风险 Y/N 布尔码，封闭取值；注释无码→中文映射，故不填 labels。
    - column: is_latest
      verdict: dict_keep
      labels: {}
      reason: 是否最新审批 Y/N 布尔码，封闭取值；注释无码→中文映射，故不填 labels。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: 启用标志 Y/N 布尔码，属封闭码；测库当前仅见 Y，不足以 drop，注释无中文映射故不填 labels。
    - column: create_by
      verdict: drop
      labels: {}
      reason: 创建人 id，审计人字段。
    - column: create_user
      verdict: drop
      labels: {}
      reason: 创建人名称，审计人字段（PII）。
    - column: update_by
      verdict: drop
      labels: {}
      reason: 更新人 id，审计人字段。
    - column: update_user
      verdict: drop
      labels: {}
      reason: 更新人名称，审计人字段（PII）。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 逻辑租户隔离标识（base/sdhsg/…），属多租户隔离 key 而非封闭业务码枚举，注释也无可抄的中文映射。
    - column: db_tenant_code
      verdict: drop
      labels: {}
      reason: 数据租户/物理库隔离标识（含域名、ISOLATE_TAG_*），技术隔离 key，非业务字典。
    - column: is_add
      verdict: dict_keep
      labels:
        Y: 是
        N: 否
      reason: 是否新增项目 Y/N 布尔码，注释已给出 Y=是、N=否 的码→中文映射。
