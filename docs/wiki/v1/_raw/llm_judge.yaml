  wechat_project_approval_apply:
    table: wechat_project_approval_apply
    dicts:
    - column: sp_type
      verdict: dict_keep
      reason: 3个封闭业务类型取值，属业务分类字典；注释未给出码值映射，不写labels
    - column: product_type
      verdict: dict_hold
      reason: 产品类型以逗号多选拼接，取值组合多，非规范封闭代码字典，待人工确认
    - column: project_online_name
      verdict: drop
      reason: 项目上线名称自由文本，非字典
    - column: prd
      verdict: dict_keep
      reason: Y/N二值布尔标志（是否投产），封闭；注释未给码值映射，不写labels
    - column: bussiness_manager
      verdict: drop
      reason: 业务经理人名，PII，非字典
    - column: op_contact
      verdict: drop
      reason: 运营对接人取值为人员数字id，PII/裸id，非字典
    - column: op_contact_group
      verdict: dict_hold
      reason: 运营组别为组织名称，取值含测试数据，是否受控字典待人工确认
    - column: archives_contact
      verdict: drop
      reason: 档案对接人取值为人员数字id，PII/裸id，非字典
    - column: archives_contact_group
      verdict: dict_hold
      reason: 档案组别为组织名称，是否受控字典待人工确认
    - column: risk_control_contact
      verdict: drop
      reason: 风控对接人取值为人员数字id，PII/裸id，非字典
    - column: risk_control_contact_group
      verdict: dict_hold
      reason: 风控对接人组别为组织名称，是否受控字典待人工确认
    - column: comment
      verdict: drop
      reason: 备注自由文本，非字典
    - column: project_manager
      verdict: drop
      reason: 项目经理人名/自由文本，PII，非字典
    - column: solution_manager
      verdict: drop
      reason: 方案经理人名（含多选拼接），PII，非字典
    - column: custom_field_one
      verdict: drop
      reason: 自定义字段自由文本，非字典
    - column: custom_field_two
      verdict: drop
      reason: 自定义字段自由文本，非字典
    - column: custom_field_three
      verdict: drop
      reason: 自定义字段自由文本，非字典
    - column: enable
      verdict: dict_keep
      reason: Y/N启用标志，封闭；注释未给码值映射，不写labels
    - column: create_by
      verdict: drop
      reason: 创建人审计id，非字典
    - column: create_user
      verdict: drop
      reason: 创建人名称，审计人/人名，非字典
    - column: update_by
      verdict: drop
      reason: 更新人审计id，非字典
    - column: update_user
      verdict: drop
      reason: 更新人名称，审计人/人名，非字典
    - column: app_tenant_code
      verdict: dict_hold
      reason: 逻辑租户标识编码，当前仅见一个取值，是否受控字典待人工确认
    - column: db_tenant_code
      verdict: dict_hold
      reason: 数据租户标识编码，当前仅见一个取值，是否受控字典待人工确认
    - column: act_procinst_status
      verdict: dict_keep
      reason: 当前审批状态1-4，封闭状态码；注释未给码值映射，不写labels
    - column: project_type
      verdict: dict_keep
      reason: MAIN/SUB项目类型封闭码；注释未给码值映射，不写labels
    - column: ka_white_label
      verdict: dict_keep
      reason: Y/N是否贴牌标志，封闭；注释未给码值映射，不写labels
    - column: project_phase
      verdict: dict_keep
      reason: IMPLEMENTATION/OPERATION/HANG项目阶段封闭码；注释未给码值映射，不写labels
    - column: business_center
      verdict: dict_hold
      reason: 业务中心为部门名称，取值含测试数据，是否受控字典待人工确认
    - column: project_exception_remark
      verdict: drop
      reason: 项目异常备注自由文本，非字典
    - column: project_focus_level
      verdict: drop
      reason: 取值以自由文本/测试串为主，非封闭代码字典
    - column: data_source
      verdict: dict_keep
      reason: WECHAT/MANUAL数据来源封闭码；注释未给码值映射，不写labels
    - column: custom_field_statistics_one
      verdict: drop
      reason: 自定义统计字段自由文本，非字典
    - column: solution_manager_wxid
      verdict: drop
      reason: 方案经理企微id，PII，非字典
    - column: old_solution_manager
      verdict: drop
      reason: 前方案经理人名，PII，非字典
    - column: system_delivery
      verdict: dict_keep
      reason: SaaS/本地化等交付方式封闭分类；注释未给码值映射，不写labels
    - column: product_type_arr
      verdict: dict_hold
      reason: 产品类型编码数组（多值），需与product_type映射后确认，暂保留待审
    - column: statics_op_user
      verdict: drop
      reason: 项目统计更新用户人名，PII，非字典
    - column: bank_quota
      verdict: drop
      reason: 银行额度为数值度量（含单位混写），非字典
    - column: core_enterprise
      verdict: drop
      reason: 核心企业名称为自由文本，非字典
    - column: credit_enhancer
      verdict: drop
      reason: 增信主体名称为自由文本，非字典
    - column: fund_manager
      verdict: drop
      reason: 管理人名称为自由文本，非字典
    - column: lls_participate_role
      verdict: dict_keep
