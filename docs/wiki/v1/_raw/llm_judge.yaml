tables:
  ca_certification_info:
    table: ca_certification_info
    dicts:
    - column: cust_type
      verdict: dict_keep
      reason: 注释给出 PERSON / COMPANY 两个主体类型码，属封闭业务代码字典；注释未提供「码→中文」映射，故不写 labels。
    - column: op_type
      verdict: dict_keep
      reason: INSERT / UPDATE 为封闭的数据操作类型码，属业务字典；注释无中文映射，不写 labels。
    - column: data_source
      verdict: dict_keep
      reason: 注释「数据来源」，样本 FBP_PORTAL / OPERATION_PLATFORM / CHANNEL_OPENAPI 均为枚举码，属封闭业务字典；注释无中文映射，不写
        labels。
    - column: submit_status
      verdict: dict_keep
      reason: PENDING / SUCCESS / FAIL 为提交结果封闭枚举，属业务字典；注释无中文映射，不写 labels。
    - column: enable
      verdict: dict_hold
      reason: 列名与注释均为 enable，无中文语义说明，仅观测到 Y；疑似通用启用标志，是否为封闭业务码字典证据不足，保留字典页待人工审核。
    - column: app_tenant_code
      verdict: dict_hold
      reason: 注释「逻辑租户标识」指向租户标识，当前仅观测到 base，值域是否封闭且是否属业务码字典不明；不能仅因单一取值排除，保留待人工审核。
    - column: db_tenant_code
      verdict: dict_hold
      reason: 注释「数据租户标识」，样本混合域名与 ISOLATE_TAG_* 等标识，偏实例清单；是否为可枚举业务码字典需人工确认，保留待审核。
    - column: head_company_data
      verdict: dict_keep
      reason: 注释「是否总公司」语义明确，样本覆盖 Y/N 二值，属封闭是否标志码；注释无中文映射，不写 labels。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
    - key: audit
      title: 审计字段
      fields:
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: cust
      title: 主体信息
      fields:
      - cust_id
      - cust_type
    - key: cert_material
      title: 认证要素
      fields:
      - notify_agreement_json
      - enterprise_four_json
      - police_two_json
      - file_refs_json
    - key: intent
      title: 意愿核验
      fields:
      - intent_sms_json
      - intent_h_face_json
    - key: submit
      title: 提交结果
      fields:
      - submit_status
      - sign_platform_result
      - submit_time
    - key: process
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: etl
      title: 数据同步信息
      fields:
      - data_date
      - data_source
      - op_type
      - batch_no
    - key: tenant
      title: 租户标识
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: org
      title: 机构属性
      fields:
      - organization_id
      - head_company_data
    similar_fields:
    - fields:
      - submit_status
      - act_procinst_status
      note: 同为状态列，但分别表示认证提交结果与流程审批状态，语义层级不同，勿互相替代。
    - fields:
      - cust_id
      - organization_id
      note: 均指向企业/机构主体（企业Id 与 机构编号），存在指向同一主体的可能，使用时需人工确认对应关系。
    - fields:
      - submit_time
      - act_procinst_date
      note: 均为流程相关时间列，分别记录提交时间与审批结束时间，含义不同不可混用。
    joins: []
    propose_joins: []
  authorization_agreement:
    table: authorization_agreement
    dicts:
    - column: platform_product_code
      verdict: dict_hold
      labels: {}
      reason: 注释仅「平台产品id」，未给出任何码→中文映射；取值为 PLATFORM/ACFLOW/RVSFACTOR_PC 等产品代码集合，看似受控，但同时也是指向
        platform_product.code 的外键码（join_candidates 中 overlap=0、样本仅5），封闭性与口径需人工确认，保留字典页待审。
    - column: authed_status
      verdict: dict_keep
      labels: {}
      reason: 「授权书认证状态」取值为 Y/N 的封闭二值状态码，属业务状态字典（仍 proposed）；注释中无码→中文映射，故 labels 留空。
    - column: original_cust_id
      verdict: drop
      labels: {}
      reason: 「源系统custid」为外部系统传入的裸主体 id，取值高基数且非封闭业务代码集，不构成字典。
    - column: company_type
      verdict: dict_keep
      labels: {}
      reason: 「企业角色」取值为 SUPPLIER/CORE/FINANCE/PROJECT_COMPANY 等封闭角色码集（含少量脏值写法），属业务代码字典；注释未提供码→中文映射，labels
        留空，映射待人工补。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: 通用启用标志，取值 Y/N 封闭二值；注释本身即为 enable、无中文映射，labels 留空。
    - column: app_tenant_code
      verdict: drop
      labels: {}
      reason: 「逻辑租户标识」是多租户隔离用的运行期标识（base/common/QA2tiepai2/JHYL 等），随租户开放增长，非封闭业务代码字典。
    - column: creation_type
      verdict: dict_keep
      labels: {}
      reason: 「创建类型」取值为 CUST_BUILD_INIT/AUTO/COMPANY_MANAGER_CHANGE_CODE 的封闭业务码集，属代码字典；注释未给码→中文映射，labels
        留空。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
      - creation_type
      - app_tenant_code
      - db_tenant_code
    - key: enterprise
      title: 企业信息
      fields:
      - cust_id
      - cust_name
      - cust_manager_id
      - cust_manager_name
      - original_cust_id
      - company_type
      - organization_id
    - key: product
      title: 产品与授权
      fields:
      - platform_product_code
      - authed_status
    - key: approval
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    similar_fields:
    - fields:
      - cust_id
      - original_cust_id
      note: 同为企业主体标识：cust_id 为本系统企业id（number），original_cust_id 为源系统custid（string），口径不同需区分来源。
    - fields:
      - cust_manager_id
      - cust_manager_name
      note: 同为客户/企业管理员主体，一为 id 一为名称，名称属冗余冗余存储，取数时注意以 id 为准。
    - fields:
      - act_procinst_id
      - act_procinst_no
      note: 同指一条审批流程实例：一为流程实例ID、一为流程申请编号，判断流程唯一性时应二选一并保持一致。
    joins:
    - right: platform_product.code
      authenticity: unlikely
      note: name_evidence 为 exact_table 精确匹配（平台产品编码 vs 平台产品表 code），语义上像是码对码外键；但探测
        overlap.ratio=0.0、sample_size=5、miss=5，样本过小且全部未命中，当前按 unlikely 记录，建议加大样本重探后再定。
    propose_joins: []
  async_io_task:
    table: async_io_task
    dicts:
    - column: task_type
      verdict: dict_keep
      reason: 任务类型为 IMPORT/EXPORT 封闭业务码，注释仅有字段名未给码值中文映射，保留待人工审核
    - column: task_name
      verdict: drop
      reason: 任务名称为自由文本业务描述，非封闭代码字典
    - column: menu_code
      verdict: dict_keep
      reason: 业务菜单标识为封闭菜单码集合，注释未给码值中文映射，保留待人工审核
    - column: menu_name
      verdict: drop
      reason: 业务菜单名称为自由文本，非封闭代码字典
    - column: biz_class
      verdict: drop
      reason: Controller Bean 全限定名为技术类名，非业务代码字典
    - column: biz_method
      verdict: drop
      reason: 方法签名为技术文本，非业务代码字典
    - column: status
      verdict: dict_keep
      reason: 状态为 SUCCESS/FAILED/RUNNING 封闭执行状态码，注释未给码值中文映射
    - column: user_id
      verdict: drop
      reason: 用户ID为裸 id/PII，不是字典
    - column: user_name
      verdict: drop
      reason: 发起人姓名为 PII 自由文本，不是字典
    - column: is_deleted
      verdict: dict_keep
      labels:
        '0': 否
        '1': 是
      reason: 软删除标志为 0/1 封闭码，注释给出中文映射
    - column: enable
      verdict: dict_hold
      reason: 注释仅“enable”，语义不清且当前样本仅 Y，不能单独因单值 drop，保留待人工审核
    - column: create_by
      verdict: drop
      reason: 创建人id为审计人/裸 id，不是字典
    - column: create_user
      verdict: drop
      reason: 创建人名称为审计人标识/自由文本，不是字典
    - column: update_by
      verdict: drop
      reason: 更新人id为审计人/裸 id，不是字典
    - column: update_user
      verdict: drop
      reason: 更新人名称为审计人标识/自由文本，不是字典
    - column: app_tenant_code
      verdict: dict_hold
      reason: 逻辑租户标识，当前样本仅 base，语义偏租户分区标识，证据不足，保留待人工审核
    - column: db_tenant_code
      verdict: dict_hold
      reason: 数据租户标识，当前样本仅 all，语义偏租户分区标识，证据不足，保留待人工审核
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - is_deleted
    - key: tenant
      title: 租户
      fields:
      - app_tenant_code
      - db_tenant_code
    - key: audit
      title: 审计
      fields:
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: task
      title: 任务
      fields:
      - task_no
      - task_type
      - task_name
    - key: menu
      title: 业务菜单
      fields:
      - menu_code
      - menu_name
    - key: invoke
      title: 调用信息
      fields:
      - biz_class
      - biz_method
      - biz_args_json
      - ctx_json
    - key: execution
      title: 执行结果与时间
      fields:
      - status
      - result_text
      - error_msg
      - start_time
      - end_time
    - key: file
      title: 文件
      fields:
      - file_url
      - file_name
    - key: initiator
      title: 发起人
      fields:
      - user_id
      - user_name
    - key: workflow
      title: 流程审批
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: organization
      title: 机构
      fields:
      - organization_id
    similar_fields:
    - fields:
      - task_name
      - name
      note: 任务名称与通用名称列语义相近，可能冗余
    - fields:
      - task_no
      - code
      note: 任务号与通用编码列均为编号语义，可能冗余
    joins: []
    propose_joins: []
  argeement_migratory_record:
    table: argeement_migratory_record
    dicts:
    - column: platform_product_code
      verdict: dict_keep
      labels: {}
      reason: 产品编码，取值均为封闭业务产品代码，保留字典页待补充中文标签。
    - column: status
      verdict: dict_keep
      labels: {}
      reason: 状态为封闭二元代码（0/1），注释无码值映射，保留字典页待补充标签。
    - column: agreement_type
      verdict: dict_keep
      labels: {}
      reason: 协议类型为封闭业务类型代码，注释无中文映射，保留字典页待补充标签。
    - column: sign_mode
      verdict: dict_keep
      labels: {}
      reason: 签署模式为封闭代码（01/02/03），注释无中文映射，保留字典页待补充标签。
    - column: is_new
      verdict: dict_keep
      labels: {}
      reason: 是否新数据为封闭 yes/no 标志，保留字典页待补充中文标签。
    - column: pull_num
      verdict: drop
      labels: {}
      reason: 拉取次数为数值型计数指标，非封闭代码字典。
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: enable 为通用启用标识，取值 Y，属封闭标志位；样本仅见 Y 不单独作为排除依据。
    - column: create_by
      verdict: drop
      labels: {}
      reason: 创建人id，属审计人/主体标识，非字典。
    - column: create_user
      verdict: drop
      labels: {}
      reason: 创建人名称，含姓名/手机号等 PII，非字典。
    - column: update_by
      verdict: drop
      labels: {}
      reason: 更新人id，属审计人/主体标识，非字典。
    - column: update_user
      verdict: drop
      labels: {}
      reason: 更新人名称，含姓名/手机号等 PII，非字典。
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - status
      - enable
      - remark
      - app_tenant_code
      - db_tenant_code
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: agreement
      title: 协议信息
      fields:
      - agreement_type
      - agreement_path
      - agreement_name
      - agreement_no
      - effect_date
      - expire_date
    - key: sign
      title: 签署信息
      fields:
      - sign_mode
      - sign_date
    - key: approval
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    - key: migration
      title: 迁移信息
      fields:
      - is_new
      - pull_num
    - key: customer_product
      title: 客户/机构与产品
      fields:
      - cust_id
      - organization_id
      - platform_product_code
    similar_fields:
    - fields:
      - code
      - agreement_no
      note: 通用编码与协议编号可能同为协议业务编号，需确认是否冗余。
    - fields:
      - name
      - agreement_name
      note: 通用名称与协议名称可能指向同一协议名称，需确认是否冗余。
    - fields:
      - status
      - enable
      note: 状态与启用标识均为通用状态位，可能语义重叠。
    joins:
    - right: argeement_migratory_record.platform_product_code
      authenticity: unknown
      note: 候选边 platform_product.code -> argeement_migratory_record.platform_product_code；名称证据
        exact_table 较强，但 overlap 仅抽样2条且0命中，暂判 unknown，建议扩大样本复核。
    propose_joins: []
  ca_fee_project_config:
    table: ca_fee_project_config
    dicts:
    - column: charge_enabled
      verdict: dict_keep
      labels: {}
      reason: 是否开启CA收费，取值 N/Y，闭集布尔型业务开关编码，保留为字典页；注释未给出码→中文映射，故不写 labels
    - column: enable
      verdict: dict_keep
      labels: {}
      reason: 与 charge_enabled 同类的启停开关字段（当前样本仅 Y），属封闭状态编码，保留；注释仅为 'enable'，无中文映射，不写
        labels
    - column: supplier_annual_fee
      verdict: drop
      reason: 供应商角色年费（元），数值型金额度量，取值随机离散，非封闭业务代码字典
    - column: core_annual_fee
      verdict: drop
      reason: 核心企业角色年费（元），数值型金额度量，非枚举代码
    - column: agreement_version
      verdict: dict_hold
      reason: 协议版本号语义介于标识与可枚举版本集合之间，当前样本仅 V1.0，证据不足，保留待人工审核
    - column: app_tenant_code
      verdict: drop
      reason: 逻辑租户标识，取值即各租户实例编码（base/JYYL/...），属租户实例/标识类而非业务代码字典
    clusters:
    - key: common
      title: 通用
      include: always
      fields:
      - id
      - code
      - name
      - enable
      - remark
      - create_by
      - create_user
      - create_time
      - update_by
      - update_user
      - update_time
    - key: fee_config
      title: 收费项目配置
      fields:
      - charge_enabled
      - supplier_annual_fee
      - core_annual_fee
      - pay_channel
      - special_company_list
      - block_scene_list
      - agreement_version
      - last_toggle_time
    - key: tenant
      title: 租户标识
      fields:
      - tenant_id
      - app_tenant_code
      - db_tenant_code
    - key: project_org
      title: 项目与机构
      fields:
      - project_id
      - organization_id
    - key: act_procinst
      title: 审批流程
      fields:
      - act_procinst_id
      - act_procinst_no
      - act_procinst_status
      - act_procinst_date
    similar_fields:
    - fields:
      - charge_enabled
      - enable
      note: 均为开关语义，但 charge_enabled 专指 CA 收费开关（含 last_toggle_time 配套），enable 为通用启停位，语义不完全冗余
    - fields:
      - supplier_annual_fee
      - core_annual_fee
      note: 同为角色年费金额列，仅角色主体不同，结构高度相似
    joins: []
    propose_joins:
    - left: ca_fee_company.id
      right: ca_fee_project_config.project_id
      verdict: skip
      note: name_evidence 仅前缀相似（project_id→id/code），overlap=0.0/200 采样，project_id
        更可能指向项目主档而非 CA 企业表，暂 skip
    - left: ca_fee_company.code
      right: ca_fee_project_config.project_id
      verdict: skip
      note: 码对 id 类型语义不匹配，overlap=0.0，skip
    - left: ca_fee_order.id
      right: ca_fee_project_config.project_id
      verdict: skip
      note: 订单主键与配置表项目ID无名称/注释证据，overlap=0.0，skip
    - left: ca_fee_order.code
      right: ca_fee_project_config.project_id
      verdict: skip
      note: 订单编码与配置表项目ID语义不符，overlap=0.0，skip
    - left: ca_fee_special_config.id
      right: ca_fee_project_config.project_id
      verdict: skip
      note: 特殊企业配置主键与项目ID无关联证据，overlap=0.0，skip
    - left: ca_fee_special_config.code
      right: ca_fee_project_config.project_id
      verdict: skip
      note: 特殊企业配置编码与项目ID语义不符，overlap=0.0，skip
  ca_cfca_upgrade_report:
    table: ca_cfca_upgrade_report
    dicts:
    - column: source_system
      verdict: dict_keep
      reason: 来源系统为封闭系统标识枚举，样本含多个系统代号，注释未提供码值中文映射，不写 labels。
    - column: company_type
      verdict: dict_keep
      reason: 企业角色为封闭角色代码枚举，注释未提供码值中文映射，不写 labels。
    - column: title
      verdict: drop
      reason: 异常标题为自由文本标题，非字典。
    - column: biz_module
      verdict: dict_keep
      reason: 所属模块为封闭模块代码/模块标识，注释未提供码值中文映射，不写 labels。
    - column: trigger_scene
      verdict: dict_hold
      reason: 触发场景值多为描述性场景文本且混合英文代号，注释未给出封闭码表映射，保留待人工审核。
    - column: todo_triggered
