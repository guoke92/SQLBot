  tenant_project_approval_flow_node:
    table: tenant_project_approval_flow_node
    dicts:
    - column: node_code
      verdict: dict_keep
      reason: 节点编码为闭集业务码（PROJECT_MANAGER/PROJECT_CONFIG/BUSINESS_MANAGER/OPERATION/LEGAL_PROCESS/LEGAL_REVIEW），注释未给码→中文映射，故不出
        labels
    - column: node_order
      verdict: drop
      reason: 审批顺序（从1开始的连续整数），是排序序号而非封闭业务码字典
    - column: operate_type
      verdict: dict_keep
      reason: 操作类型为闭集枚举（pass/back/reject/delegate/revoke），注释无码→中文映射
    - column: approval_type
      verdict: dict_keep
      reason: 审批类型闭集（ONLINE_APPROVAL/BACK_AGREEMENT），注释无码→中文映射
    - column: is_low_risk
      verdict: dict_keep
      reason: 是否低风险项目，Y/N 二值闭集；注释未给出 Y/N 的中文映射，故不出 labels
    - column: operator_user_id
      verdict: drop
      reason: 操作人 userId，裸用户标识/PII，非字典
    - column: operator_user_name
      verdict: drop
      reason: 操作人姓名，人名 PII，非字典
    - column: transfer_to_user_id
      verdict: drop
      reason: 被转审人 id，裸用户标识/PII
    - column: transfer_to_user_name
      verdict: drop
      reason: 被转审人姓名，人名 PII
    - column: enable
      verdict: dict_keep
      reason: 启用标记，Y/N 闭集语义；样本仅见 Y 不构成 drop 依据，注释无映射故不出 labels
    - column: remark
      verdict: drop
      reason: 自由文本（节点回退配置 JSON），非字典
    - column: create_by
      verdict: drop
      reason: 创建人 id，审计人字段
    - column: create_user
      verdict: drop
      reason: 创建人名称，审计人字段
    - column: update_by
      verdict: drop
      reason: 更新人 id，审计人字段
    - column: update_user
      verdict: drop
      reason: 更新人名称，审计人字段
    - column: app_tenant_code
      verdict: drop
      reason: 逻辑租户标识，属租户/分区身份标识，非封闭业务代码字典
    - column: db_tenant_code
      verdict: drop
      reason: 数据租户标识，取值混杂主机域名与 ISOLATE_TAG 等基础设施标识，非业务代码字典
    - column: is_back_agreement
      verdict: dict_keep
      reason: 是否后补合作协议，Y/N 二值闭集；注释未给出中文映射，故不出 labels
